vlan 100
   name Production_App1
!
vlan 101
   name Production_DB
!
vlan 200
   name Dev_App1
!
vlan 3401
   name L2_VLAN3401
!
vlan 3402
   name L2_VLAN3402
!
vrf instance VRF_PRODUCTION
!
vrf instance VRF_DEVELOPMENT
!
interface Vlan100
   description Production_App1
   no shutdown
   mtu 9000
   vrf VRF_PRODUCTION
   ip address virtual 10.100.100.1/24
!
interface Vlan101
   description Production_DB
   no shutdown
   mtu 9000
   vrf VRF_PRODUCTION
   ip address virtual 10.100.101.1/24
!
interface Vlan200
   description Dev_App1
   no shutdown
   vrf VRF_DEVELOPMENT
   ip address virtual 10.200.100.1/24
!
interface Vxlan1
   description howto-l3-leaf1_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 101 vni 10101
   vxlan vlan 200 vni 10200
   vxlan vlan 3401 vni 13401
   vxlan vlan 3402 vni 13402
   vxlan vrf VRF_DEVELOPMENT vni 200
   vxlan vrf VRF_PRODUCTION vni 100
!
