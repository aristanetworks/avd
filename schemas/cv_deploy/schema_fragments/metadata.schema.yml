# yaml-language-server: $schema=../../../python-avd/pyavd/_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  metadata:
    type: dict
    # Allowing other keys to avoid validation errors when used with eos_designs.
    allow_other_keys: true
    description: |-
      Metadata from the `eos_designs` role, loaded automatically from structured configs.
      For standalone usage without `eos_designs`, use the other `cv_deploy` schema keys instead.
      If both are provided, `metadata` takes precedence.
    documentation_options:
      hide_keys: true
    keys:
      is_deployed:
        type: bool
        $ref: eos_cli_config_gen#/keys/metadata/keys/is_deployed
      serial_number:
        type: str
        $ref: eos_cli_config_gen#/keys/metadata/keys/serial_number
      system_mac_address:
        type: str
        $ref: eos_cli_config_gen#/keys/metadata/keys/system_mac_address
      cv_tags:
        type: dict
        $ref: eos_cli_config_gen#/keys/metadata/keys/cv_tags
      cv_pathfinder:
        type: dict
        $ref: eos_cli_config_gen#/keys/metadata/keys/cv_pathfinder
      cv_use_static_config_manifest:
        type: bool
        $ref: eos_cli_config_gen#/keys/metadata/keys/cv_use_static_config_manifest
