# yaml-language-server: $schema=../../../python-avd/pyavd/_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  metadata:
    type: dict
    description: |-
      Metadata from the `eos_designs` role, loaded automatically from structured configs.
      For standalone usage without `eos_designs`, use the other `cv_deploy` schema keys instead.
      If both are provided, `metadata` takes precedence.
    documentation_options:
      hide_keys: true
    # Using the full metadata dict as a $ref to avoid errors on non-cv_deploy keys in metadata.
    # Using specific keys requires allow_other_keys: true which we want to avoid.
    $ref: eos_cli_config_gen#/keys/metadata
