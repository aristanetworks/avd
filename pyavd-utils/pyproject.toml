[project]
name = "pyavd-utils"
dynamic = ["version"]
authors=[{ name = "Arista Networks", email = "avd-dev@arista.com"}]
description="Rust based utilities used by PyAVD. Should not be used directly and may not follow semantic versioning."
readme = "README.md"
license = { file = "pyavd_utils/LICENSE" }
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
keywords = ["pyavd", "pyavd-utils"]
requires-python = ">=3.10"

[project.urls]
homepage = "https://avd.arista.com"
repository = "https://github.com/aristanetworks/avd"

[build-system]
requires = [
    "setuptools",
    "setuptools-rust>=1.12.0",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
pytest = ["pytest"]
coverage = ["coverage[toml]"]

[tool.distutils.bdist_wheel]
py-limited-api = "cp310"

[tool.setuptools.dynamic]
version = {attr = "pyavd_utils.__version__"}

[tool.setuptools.packages.find]
include = ["pyavd_utils"]

[tool.setuptools.package-data]
"pyavd_utils" = ["*.pyi"]

[[tool.setuptools-rust.ext-modules]]
target = "pyavd_utils.passwords"
path = "rust/pypasswords/Cargo.toml"
binding = "PyO3"

[[tool.setuptools-rust.ext-modules]]
target = "pyavd_utils.validation"
path = "rust/pyvalidation/Cargo.toml"
binding = "PyO3"

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 85
include = [
  "python_avd/*",
]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    # Don't complain about TYPE_CHECKING blocks
    "if TYPE_CHECKING:",
    # Ignore typing overloads
    "@overload",
    # Don't complain about Jinja2 internalcode
    # Note that except KeyError is a bit sad but this is the pattern
    "except KeyError:",
    "@internalcode",
    "raise TemplateRuntimeError",
    "^blocks = {}",
    "^debug_info =.*",
]

[tool.ruff]
# Extend the `pyproject.toml` file in the parent directory...
# Should not be needed, but the ruff vscode extension does not seem to respect the ruff behavior of ignoring files without tool.ruff
extend = "../pyproject.toml"

[tool.pytest.ini_options]
testpaths = "tests"

[tool.pyright]
# Pyright stops at the first parent pyproject.toml it finds so as documented adding base config
extends = "../pyproject.toml"
