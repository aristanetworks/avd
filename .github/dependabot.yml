---
version: 2
updates:
  # Maintain Python dependencies and uv lock files
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/python-avd/"
    schedule:
      interval: "weekly"
      day: "monday"

    # Separate Dev and Production into two distinct PR groups
    groups:
      prod-dependencies:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"

    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "Bump(requirements): "
      prefix-development: "CI(requirements): "
    cooldown:
      default-days: 7

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "CI: "
    cooldown:
      default-days: 7
