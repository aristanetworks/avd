---
name: "Build pyvad-utils wheels"

"on":
  workflow_call:
    inputs:
      TESTPYPI_VERSION:
        description: "Version string to use for manual push to test pypi"
        # required: true
        type: string

env:
  # Do the same for CIBW to be able to troubleshoot errors from CI
  CIBW_BUILD_VERBOSITY: ${{ secrets.ACTIONS_STEP_DEBUG && 3 || 0 }}
  PY_COLORS: 1 # allows molecule colors to be passed to GitHub Actions
  # rust
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------ #
  # Build cross platform pyavd-utils wheels and upload artifacts
  # ------------------------------------------------------------ #
  pyavd_utils_build_wheels:
    name: Build pyavd-utils wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 covers x64 and macos-latest covers arm
        # note that at some point x64 won't be available anymore as per
        # https://github.com/actions/runner-images/issues/13046
        # the next update will be macos-15-intel
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-14
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        # See pyproject.toml for config
        # TODO: Adjust the version in the wheels
        run: |
          pip install --group build_wheel
      - name: Build wheels
        # Not using working-directory because manylinux uses a container
        # and will not copy the parent Cargo.toml and we will be sad
        run: |-
          python -m cibuildwheel --output-dir pyavd-utils/dist pyavd-utils
      - uses: actions/upload-artifact@v5
        with:
          name: pyavd-utils-wheels-${{ matrix.os }}
          path: pyavd-utils/dist/*.whl

  # ------------------------------------------- #
  # pyavd-utils test on platforms using wheels
  # ------------------------------------------- #
  pyavd_utils_test_cross_platform:
    name: pyavd-utils ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [pyavd_utils_build_wheels]
    if: needs.file-changes.outputs.rust_src_or_ci_changed == 'true' || github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        # macos-14 covers x64 and macos-latest covers arm
        # note that at some point x64 won't be available anymore as per
        # https://github.com/actions/runner-images/issues/13046
        # the next update will be macos-15-intel
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-14
          - macos-latest
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Download {{ matrix.os }} wheel
        uses: actions/download-artifact@v6
        with:
          name: pyavd-utils-wheels-${{ matrix.os }}
          path: pyavd-utils/dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: |
          pip install tox --upgrade
      - name: Run pytest via tox for the wheel
        # the environment will automatically pick up the downloaded wheel from pyavd-utils/dist
        run: |-
          tox run -e pyavd-utils
