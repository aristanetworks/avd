---
name: "Publish PyAVD package"

"on":
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to build the PyAVD package from"
        required: true
        type: string
    outputs:
      target_version:
        description: "PyAVD version built by the workflow"
        value: ${{ jobs.build_pyavd_dist.outputs.target_version }}

permissions:
  contents: read

env:
  AVD_NEVER_RUN_FROM_SOURCE: 1
  PY_COLORS: 1
  ANSIBLE_FORCE_COLOR: 1

jobs:
  build_pyavd_dist:
    name: Build PyAVD wheel
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd'
    outputs:
      target_version: ${{ steps.target_version.outputs.target_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install release requirements
        run: python -m pip install --group release

      - name: Set target version
        id: target_version
        run: |
          CURRENT_VERSION=$(bump-my-version show current_version | tr '-' '.')
          echo "target_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and check PyAVD wheel
        working-directory: ./python-avd
        run: |
          python -m build --wheel
          python -m twine check dist/*

      - name: Upload PyAVD wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyavd-dist
          path: ./python-avd/dist/*.whl

  publish_pyavd_testpypi:
    name: Publish PyAVD to TestPyPI
    needs: [build_pyavd_dist]
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd'
    environment:
      name: test
      url: https://test.pypi.org/p/pyavd
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PyAVD wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyavd-dist
          path: dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test_pyavd_from_testpypi:
    name: Test PyAVD from TestPyPI on Python ${{ matrix.python }}
    needs: [build_pyavd_dist, publish_pyavd_testpypi]
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyAVD from TestPyPI
        env:
          TARGET_VERSION: ${{ needs.build_pyavd_dist.outputs.target_version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "pyavd[ansible]==${TARGET_VERSION}"
          python -m pip check

      - name: Smoke test installed PyAVD
        env:
          TARGET_VERSION: ${{ needs.build_pyavd_dist.outputs.target_version }}
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from importlib.metadata import version
          import os

          import pyavd
          from pyavd.constants import RUNNING_FROM_SRC, SCHEMA_STORE_GZ_FILE

          target_version = os.environ["TARGET_VERSION"]
          assert version("pyavd") == target_version
          assert pyavd.__version__ == target_version
          assert not RUNNING_FROM_SRC
          assert SCHEMA_STORE_GZ_FILE.is_file()

          for api_name in (
              "get_avd_facts",
              "get_device_config",
              "get_device_doc",
              "get_device_structured_config",
              "get_device_test_catalog",
              "get_fabric_documentation",
              "validate_inputs",
              "validate_structured_config",
          ):
              assert callable(getattr(pyavd, api_name))
          PY

  publish_pyavd_pypi:
    name: Publish PyAVD to PyPI
    needs: [test_pyavd_from_testpypi]
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd'
    environment:
      name: production
      url: https://pypi.org/p/pyavd
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PyAVD wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyavd-dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
