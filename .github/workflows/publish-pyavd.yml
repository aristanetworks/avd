---
name: "Publish PyAVD package"

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      TESTPYPI_VERSION:
        description: "PEP 440 version string to use for manual push to TestPyPI"
        required: false
        type: string

permissions:
  contents: read

env:
  AVD_NEVER_RUN_FROM_SOURCE: 1
  PY_COLORS: 1
  ANSIBLE_FORCE_COLOR: 1

jobs:
  build_pyavd_dist:
    name: Build PyAVD wheel
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd' && (github.event_name == 'release' || github.ref == 'refs/heads/devel')
    outputs:
      target_version: ${{ steps.target_version.outputs.target_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install release requirements
        run: python -m pip install --group release

      - name: Set target version
        id: target_version
        env:
          TESTPYPI_VERSION: ${{ inputs.TESTPYPI_VERSION }}
        run: |
          CURRENT_VERSION=$(bump-my-version show current_version | tr '-' '.')
          echo "target_version=${TESTPYPI_VERSION:-$CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Override version for manual TestPyPI run
        if: github.event_name == 'workflow_dispatch' && inputs.TESTPYPI_VERSION != ''
        env:
          TESTPYPI_VERSION: ${{ inputs.TESTPYPI_VERSION }}
        run: |
          if [[ ! "$TESTPYPI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]+)?$ ]]; then
            echo "Unsupported TESTPYPI_VERSION '$TESTPYPI_VERSION'. Use X.Y.Z or X.Y.Z.devN."
            exit 1
          fi

          COLLECTION_VERSION="${TESTPYPI_VERSION/.dev/-dev}"

          bump-my-version replace \
            --regex \
            --search "^version: .*$" \
            --replace "version: ${COLLECTION_VERSION}" \
            --no-configured-files \
            -v \
            ansible_collections/arista/avd/galaxy.yml
          bump-my-version replace \
            --regex \
            --search "pyavd==[^\"]*" \
            --replace "pyavd==${TESTPYPI_VERSION}" \
            --no-configured-files \
            -v \
            python-avd/pyproject.toml
          bump-my-version replace \
            --regex \
            --search "__version__ = \"[^\"]*\"" \
            --replace "__version__ = \"${TESTPYPI_VERSION}\"" \
            --no-configured-files \
            -v \
            python-avd/pyavd/__init__.py

      - name: Build and check PyAVD wheel
        working-directory: ./python-avd
        run: |
          python -m build --wheel
          python -m twine check dist/*

      - name: Upload PyAVD wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyavd-dist
          path: ./python-avd/dist/*.whl

  publish_pyavd_testpypi:
    name: Publish PyAVD to TestPyPI
    needs: [build_pyavd_dist]
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd'
    environment:
      name: test
      url: https://test.pypi.org/p/pyavd
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PyAVD wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyavd-dist
          path: dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test_pyavd_from_testpypi:
    name: Test PyAVD from TestPyPI on Python ${{ matrix.python }}
    needs: [build_pyavd_dist, publish_pyavd_testpypi]
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyAVD from TestPyPI
        env:
          TARGET_VERSION: ${{ needs.build_pyavd_dist.outputs.target_version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "pyavd[ansible]==${TARGET_VERSION}"
          python -m pip check

      - name: Smoke test installed PyAVD
        env:
          TARGET_VERSION: ${{ needs.build_pyavd_dist.outputs.target_version }}
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from importlib.metadata import version
          import os

          import pyavd
          from pyavd.constants import RUNNING_FROM_SRC, SCHEMA_STORE_GZ_FILE

          target_version = os.environ["TARGET_VERSION"]
          assert version("pyavd") == target_version
          assert pyavd.__version__ == target_version
          assert not RUNNING_FROM_SRC
          assert SCHEMA_STORE_GZ_FILE.is_file()

          for api_name in (
              "get_avd_facts",
              "get_device_config",
              "get_device_doc",
              "get_device_structured_config",
              "get_device_test_catalog",
              "get_fabric_documentation",
              "validate_inputs",
              "validate_structured_config",
          ):
              assert callable(getattr(pyavd, api_name))
          PY

  publish_pyavd_pypi:
    name: Publish PyAVD to PyPI
    needs: [test_pyavd_from_testpypi]
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd' && github.event_name == 'release'
    environment:
      name: production
      url: https://pypi.org/p/pyavd
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PyAVD wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyavd-dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  build_collection_artifact:
    name: Build and validate collection artifact
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd' && github.event_name == 'release'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build Ansible collection
        run: |
          python -m pip install "ansible-core<2.22.0" distlib --upgrade
          ansible-galaxy collection build -vvv --force ansible_collections/arista/avd

      - name: Upload collection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avd-collection
          path: ./arista-avd-*.tar.gz

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Run galaxy-importer checks
        run: |
          python -m pip install "ansible-core==2.16.0" "galaxy-importer==0.4.31"
          python -m galaxy_importer.main arista-avd-*.tar.gz

      - name: Upload importer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: importer-logs
          path: ./importer_result.json
