---
name: Schema Explorer check

"on":
  pull_request:
    paths:
      - "tools/schema-explorer/**"
      - "tools/schema_explorer_markdown.py"
      - "Makefile"
      - ".github/workflows/schema-explorer-check.yml"
  push:
    branches:
      - devel
    paths:
      - "tools/schema-explorer/**"
      - "tools/schema_explorer_markdown.py"
      - "Makefile"
      - ".github/workflows/schema-explorer-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  schema-explorer-check:
    name: Schema Explorer guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install Python dependencies
        run: pip install --group doc --group pytest --upgrade
      - name: Run schema-explorer-check
        run: make schema-explorer-check
