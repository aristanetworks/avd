---
name: Reusable build pyavd workflow

"on":
  workflow_call:
    inputs:
      python_version:
        required: true
        type: string
        description: "Python version to use for building (e.g., 3.12, 3.13)"
    outputs:
      wheel_file:
        description: "Path to the built wheel file"
        value: ${{ jobs.build_pyavd.outputs.wheel_file }}

jobs:
  build_pyavd:
    name: Build pyavd
    runs-on: ubuntu-latest
    outputs:
      wheel_file: ${{ steps.build_step.outputs.wheel_file }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            ${{ inputs.python_version }}
      - name: Create pyavd wheel and output wheel path
        id: build_step
        working-directory: ./python-avd
        run: |
          pip install build
          python -m build --wheel
          WHEEL_FILE=$(find ./dist/*.whl -print0 -type f | xargs -0 -n 1 basename)
          echo "wheel_file=/tmp/pyavd/$WHEEL_FILE" >> "$GITHUB_OUTPUT"
      - name: Upload pyavd artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyavd
          path: ./python-avd/dist/*.whl
