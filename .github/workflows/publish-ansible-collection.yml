---
name: "Publish Ansible collection"

"on":
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to build the Ansible collection from"
        required: true
        type: string

permissions:
  contents: read

env:
  PY_COLORS: 1
  ANSIBLE_FORCE_COLOR: 1

jobs:
  build_collection_artifact:
    name: Build and validate collection artifact
    runs-on: ubuntu-latest
    if: github.repository == 'aristanetworks/avd'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build Ansible collection
        run: |
          python -m pip install "ansible-core<2.22.0" distlib --upgrade
          ansible-galaxy collection build -vvv --force ansible_collections/arista/avd

      - name: Upload collection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avd-collection
          path: ./arista-avd-*.tar.gz

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Run galaxy-importer checks
        run: |
          python -m pip install "ansible-core==2.16.0" "galaxy-importer==0.4.31"
          python -m galaxy_importer.main arista-avd-*.tar.gz

      - name: Upload importer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: importer-logs
          path: ./importer_result.json
