---
name: autofix.ci

"on":
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - devel

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    # Added in GitHub settings as a required check. Keep this name stable.
    name: Autofix - run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install prek
        run: python -m pip install --group prek

      - name: Run prek autofix pass
        id: prek
        continue-on-error: ${{ github.event_name != 'merge_group' }}
        run: prek run --all-files --show-diff-on-failure --color=always

      - name: Fail if prek failed without fixes
        if: steps.prek.outcome == 'failure'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "prek failed and did not produce changes for autofix.ci to commit."
            exit 1
          fi

      - name: Commit back any git diff
        if: github.event_name != 'merge_group'
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
