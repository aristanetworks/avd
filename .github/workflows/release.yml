---
name: "Publish Python package"

"on":
  release:
    types:
      - published
  # Allow for manual trigger on the selected branch in UI
  # Reducing it to only execute on devel branch today.
  workflow_dispatch:
    inputs:
      TESTPYPI_VERSION:
        description: "Version string to use for manual push to test Pypi"
        required: true
        type: string

# For now only pyavd-utils
jobs:
  build-pyavd-utils-wheels:
    name: Build and test pyavd-utils wheel on ${{ matrix.os }}
    # if: github.repository == 'aristanetworks/avd'
    permissions:
      contents: read
      actions: write  # Needed to trigger workflows
      pull-requests: write
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest
    uses: ./.github/workflows/build-pyavd-wheel.yml
    with:
      runner: ${{ matrix.os }}
      # Default value to '' to not overwrite the version in the child workflow
      TESTPYPI_VERSION: ${{ inputs.TESTPYPI_VERSION || '' }}

  pyavd-utils-testpypi:
    name: Publish pyavd-utils to Test PyPI
    needs: [build-pyavd-utils-wheels]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/devel')
    environment:
      name: test
      url: https://test.pypi.org/p/pyavd-utils
    permissions:
      id-token: write
    steps:
      - name: Download pyavd-utils wheels
        uses: actions/download-artifact@v6
        with:
          path: dist/
          merge-multiple: true
          pattern: pyavd-utils-wheels-*
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
