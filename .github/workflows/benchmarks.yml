---
name: "Benchmarks"

"on": # zizmor: ignore[dangerous-triggers]
  push:
    branches: [devel]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "benchmarks/**"
      - "pyproject.toml"
      - "python-avd/pyavd/**"
      - "python-avd/tests/models.py"
      - "ansible_collections/arista/avd/extensions/molecule/**"
  pull_request:
    types: [reopened, synchronize]
    branches: [devel]
  pull_request_target:
    types: [labeled]
    branches: [devel]
  schedule:
    # GitHub Actions schedules are UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the full benchmark suite, including scale benchmarks."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

env:
  PY_COLORS: 1
  ANSIBLE_FORCE_COLOR: 1

jobs:
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (
        github.event_name != 'pull_request' &&
        github.event_name != 'pull_request_target'
      ) ||
      (
        contains(github.event.pull_request.labels.*.name, 'benchmark') &&
        (
          github.event.pull_request.head.repo.full_name == github.repository ||
          (
            github.event_name == 'pull_request_target' &&
            github.event.action == 'labeled' &&
            github.event.label.name == 'benchmark'
          )
        )
      )
    steps:
      - name: Check benchmark authorization
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.actor }}
        run: |
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${TRIGGERING_ACTOR}/permission" --jq .permission)"
          case "${permission}" in
            admin|maintain|write)
              echo "${TRIGGERING_ACTOR} is authorized to trigger benchmarks with ${permission} permission."
              ;;
            *)
              echo "::error::${TRIGGERING_ACTOR} is not authorized to trigger benchmarks."
              echo "::error::Required permission: write, maintain, or admin. Actual permission: ${permission}."
              exit 1
              ;;
          esac

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --group dev --group benchmark --upgrade

      - name: Run default benchmarks
        if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || !inputs.full_suite)
        uses: CodSpeedHQ/action@c0179f10961f7a08defab9f862e9a09562d674d0 # v4
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
          run: |
            python -m pytest --codspeed \
              benchmarks/test_molecule_scenarios.py \
              benchmarks/test_large_fabric_scaling.py \
              -k "not 150_devices" \
              -q

      - name: Run full benchmarks
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        uses: CodSpeedHQ/action@c0179f10961f7a08defab9f862e9a09562d674d0 # v4
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
          run: |
            python -m pytest --codspeed benchmarks -q
