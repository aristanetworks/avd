---
name: "Benchmarks"

"on":
  push:
    branches: [devel]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "benchmarks/**"
      - "pyproject.toml"
      - "python-avd/pyavd/**"
      - "python-avd/scripts/**"
      - "python-avd/schema_tools/**"
      - "python-avd/Makefile"
      - "python-avd/tests/models.py"
      - "ansible_collections/arista/avd/extensions/molecule/**"
      - "tools/e2e_test_avd.py"
  pull_request:
    types: [reopened, synchronize, labeled]
    branches: [devel]

env:
  PY_COLORS: 1
  ANSIBLE_FORCE_COLOR: 1

jobs:
  benchmarks:
    name: CodSpeed benchmarks (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: simulation
            mode: simulation
            targets: |-
              benchmarks/test_molecule_scenarios.py
              benchmarks/test_large_fabric_scaling.py
          - suite: memory-main
            mode: memory
            targets: benchmarks/test_molecule_scenarios.py
          - suite: memory-scaling
            mode: memory
            targets: benchmarks/test_large_fabric_scaling.py::test_large_fabric_full_workflow_benchmark[15_devices]
            capture: true
          - suite: memory-facts
            mode: memory
            targets: benchmarks/test_synthetic_memory_phases.py::test_synthetic_facts_memory_benchmark
            capture: true
          - suite: memory-structured-config
            mode: memory
            targets: benchmarks/test_synthetic_memory_phases.py::test_synthetic_structured_config_memory_benchmark
            capture: true
          - suite: memory-structured-preloaded
            mode: memory
            targets: benchmarks/test_synthetic_memory_phases.py::test_synthetic_preloaded_structured_config_memory_benchmark
          - suite: memory-cli
            mode: memory
            targets: benchmarks/test_synthetic_memory_phases.py::test_synthetic_cli_memory_benchmark
    env:
      MEMORY_DIAGNOSTIC_OUTPUT: /tmp/codspeed-memory-evidence
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ matrix.suite }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.9"

      - name: Install dependencies
        run: |
          pip install --group dev --group benchmark --upgrade

      - name: Generate PyAVD artifacts
        run: |
          make -C python-avd dep

      - name: Install libc debug symbols
        if: matrix.mode == 'memory'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libc6-dbg

      - name: Record diagnostic dependency versions
        if: matrix.capture
        run: |
          mkdir -p "$MEMORY_DIAGNOSTIC_OUTPUT"
          python -m pip freeze > "$MEMORY_DIAGNOSTIC_OUTPUT/pip-freeze.txt"

      - name: Run default benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        env:
          BENCHMARK_TARGETS: ${{ matrix.targets }}
          CAPTURE_MEMORY_PROFILE: ${{ matrix.capture && 'true' || 'false' }}
          CODSPEED_LOG: ${{ matrix.capture && 'debug' || 'info' }}
        with:
          mode: ${{ matrix.mode }}
          run: |
            benchmark_targets=()
            while IFS= read -r benchmark_target; do
              if [[ -n "$benchmark_target" ]]; then
                benchmark_targets+=("$benchmark_target")
              fi
            done <<< "$BENCHMARK_TARGETS"
            diagnostic_args=()
            if [[ "$CAPTURE_MEMORY_PROFILE" == "true" ]]; then
              diagnostic_args=(-p benchmarks.codspeed_memory_probe)
            fi
            python -m pytest --codspeed \
              "${benchmark_targets[@]}" \
              "${diagnostic_args[@]}" \
              -m "not benchmark_scale" \
              -q

      - name: Retain completed memory profile
        if: always() && matrix.capture
        run: python -m benchmarks.codspeed_memory_probe

      - name: Upload memory profiling evidence
        if: always() && matrix.capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codspeed-memory-${{ matrix.suite }}
          path: ${{ env.MEMORY_DIAGNOSTIC_OUTPUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
