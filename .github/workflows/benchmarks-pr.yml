---
name: "PR Benchmarks"

"on":
  pull_request:
    types: [labeled]

env:
  PY_COLORS: 1
  ANSIBLE_FORCE_COLOR: 1

jobs:
  pr-benchmarks:
    name: PR Benchmarks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: contains(github.event.pull_request.labels.*.name, 'benchmark')
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --group dev --group benchmark --upgrade

      - name: Build schemas and templates
        working-directory: python-avd
        run: |
          make compile-schemas
          make compile-templates

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
          run: |
            # Run API benchmarks + scale tests (15 and 150 devices) for PRs
            # Full benchmark suite (including 1500 devices and molecule scenarios) runs on schedule
            pytest --codspeed benchmarks/test_pyavd_api.py benchmarks/test_large_fabric_scaling.py -k "15_devices or 150_devices"
