---
name: "PR Benchmarks"

"on":
  pull_request:
    types: [labeled]

env:
  PY_COLORS: 1
  ANSIBLE_FORCE_COLOR: 1

jobs:
  pr-benchmarks:
    name: PR Benchmarks (Shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: contains(github.event.pull_request.labels.*.name, 'benchmark')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --group dev --group benchmark --upgrade

      - name: Build schemas and templates
        working-directory: python-avd
        run: |
          make compile-schemas
          make compile-templates

      - name: Run benchmarks (shard ${{ matrix.shard }}/5)
        uses: CodSpeedHQ/action@v4
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
          run: |
            # Run API benchmarks (8 tests) + filtered scale benchmarks (8 tests) = 16 total
            # All tests collected together and split across 5 shards (~3-4 tests per shard)
            # The -k filter applies to the entire test collection
            pytest --codspeed \
              benchmarks/test_pyavd_api.py \
              benchmarks/test_large_fabric_scaling.py \
              -k "test_pyavd_api or 15_devices or 150_devices" \
              --test-group=${{ matrix.shard }} --test-group-count=5 \
              -v -s --log-cli-level=INFO
