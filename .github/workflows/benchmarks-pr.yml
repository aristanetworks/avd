---
name: "PR Benchmarks"

"on":
  workflow_call:

env:
  PY_COLORS: 1
  ANSIBLE_FORCE_COLOR: 1

jobs:
  pr-benchmarks:
    name: PR Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --group dev --group benchmark --upgrade

      - name: Build schemas and templates
        working-directory: python-avd
        run: |
          make compile-schemas
          make compile-templates

      - name: Run benchmarks (shard ${{ matrix.shard }}/4)
        uses: CodSpeedHQ/action@v4
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
          run: |
            # Run only molecule scenario benchmark on PRs
            pytest --codspeed \
              benchmarks/test_molecule_scenarios.py \
              --test-group=${{ matrix.shard }} --test-group-count=4
