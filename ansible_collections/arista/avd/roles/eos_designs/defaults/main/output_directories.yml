# Roles Defaults - ouptput directories

# Collection-wide output paths. Existing unprefixed variables remain accepted
# as legacy inputs when explicitly supplied by the user.
avd_root_dir: "{{ root_dir | default(inventory_dir) }}"
avd_documentation_dir_name: "{{ documentation_dir_name | default('documentation') }}"
avd_documentation_dir: "{{ documentation_dir | default(avd_root_dir ~ '/' ~ avd_documentation_dir_name) }}"
avd_fabric_dir_name: "{{ fabric_dir_name | default('fabric') }}"
avd_fabric_dir: "{{ fabric_dir | default(avd_documentation_dir ~ '/' ~ avd_fabric_dir_name) }}"
avd_output_dir_name: "{{ output_dir_name | default('intended') }}"
avd_output_dir: "{{ output_dir | default(avd_root_dir ~ '/' ~ avd_output_dir_name) }}"
avd_structured_dir_name: "{{ structured_dir_name | default('structured_configs') }}"
avd_structured_dir: "{{ structured_dir | default(avd_output_dir ~ '/' ~ avd_structured_dir_name) }}"

# Output directory for temporary files.
eos_designs_tmp_dir: "{{ avd_output_dir }}/tmp_eos_designs"
