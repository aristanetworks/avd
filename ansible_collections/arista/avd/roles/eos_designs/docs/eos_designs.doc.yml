# The List-merge strategy used when merging custom structured configurations.
#
# This applies to all vars prefixed by prefixes in `custom_structured_configuration_prefix`
# and all data under the various `structured_config` options.
#
# The available list merge strategies:
# - `replace`:
#   - Any list will be replaced with the list defined in custom structured configurations.
# - `append`:
#   - Existing list items with the same "Primary key"-value will be updated.
#   - New items will be appended to the existing list (including duplicates).
# - `keep`:
#   - Only set list if there is no existing list or existing list is `None`.
# - `prepend`:
#   - Existing list items with the same "Primary key"-value will be updated.
#   - New items will be prepended to the existing list (including duplicates).
# - `append_rp`:
#   - Existing list items with the same "Primary key"-value will be updated.
#   - New unique items will be appended to the existing list.
# - `prepend_rp`:
#   - Existing list items with the same "Primary key"-value will be updated.
#   - New unique items will be prepended to the existing list.
custom_structured_configuration_list_merge: <str; "replace" | "append" | "keep" | "prepend" | "append_rp" | "prepend_rp"; default="append_rp">

# Custom EOS Structured Configuration keys can be set on any group or host_var level using the name
# of the corresponding `eos_cli_config_gen` key prefixed with content of `custom_structured_configuration_prefix`.
#
# The content of Custom Structured Configuration variables will be merged with the structured config generated by the eos_designs role.
#
# The merge is done recursively, so it is possible to update a sub-key of a variable set by `eos_designs` role already.
#
# The merge follow these recursive merge strategies:
# - New keys will be added for all types.
# - Existing keys of type "List" with a "Primary key" set in the schema:
#   - Strategy can be changed with `custom_structured_configuration_list_merge`. Default strategy:
#     - Existing list items with the same "Primary key"-value will be updated.
#     - New unique items will be appended to the existing list
# - Other keys of type "List" will have new unique items appended the the existing list.
# - Existing keys of type "Dictionary" will recursively merge
# - Other existing keys will be replaced.
custom_structured_configuration_prefix: # default=['custom_structured_configuration_']
  - <str>

# Define sites that are outside of the CV Pathfinder hierarchy.
# This is used to arrange pathfinders in the CloudVision topology layout.
cv_pathfinder_global_sites:

    # The site name.
  - name: <str; required; unique>
    description: <str>

    # Location as a string is resolved on Cloudvision.
    location: <str>

# PREVIEW: These keys are in preview mode.
#
# List of internet-exit policies used for the WAN configuration.
cv_pathfinder_internet_exit_policies:

    # Internet-exit policy name.
  - name: <str; required; unique>

    # Internet-exit policy type.
    # direct: Exit directly over wan interfaces
    # zscaler: Exit using Zscaler secure web gateway service
    type: <str; "direct" | "zscaler"; required>

    # Add system default exit-group at the end of the policy.
    fallback_to_system_default: <bool; default=True>

    # Zscaler information. Only used if `type` is 'zscaler'.
    zscaler:

      # "Salt" used for auto generation of encryption keys for IPsec tunnels to Zscaler.
      # The keys will be generated as a hash of `salt_<hostname>_<policy_name>`.
      # Since this salt can be used to deduct the encryption key, it is recommended to use vault.
      ipsec_key_salt: <str; required>

      # Domain name as configured in Zscaler for the tenant. Used as UFQDN suffix for authentication.
      domain_name: <str; required>

      # When `true` the traffic going over the tunnels will be encrypted with AES-256-GCM. Otherwise the traffic will be using NULL encryption.
      # Note that encryption requires a subscription on the Zscaler account.
      encrypt_traffic: <bool; default=True>

      # Maximum allowed download bandwidth in Mbps for each device using this policy.
      download_bandwidth: <int>

      # Maximum allowed upload bandwidth in Mbps for each device using this policy.
      upload_bandwidth: <int>
      firewall:

        # Enforce firewall controls.
        enabled: <bool; default=False>

        # Enable IPS Controls for the firewall.
        ips: <bool; default=False>

      # Display an Acceptable Use Policy (AUP) and require users to accept it.
      acceptable_use_policy: <bool; default=False>

# Define the CV Pathfinder hierarchy.
cv_pathfinder_regions:
  - name: <str; length 1-128; required; unique>
    description: <str>

    # The region ID must be unique for the whole WAN deployment.
    id: <int; 1-255; required>

    # All sites are placed in a default zone "<region_name>-ZONE" with ID 1.
    sites:

        # The site name.
      - name: <str; length 1-128; required; unique>
        description: <str>

        # The site ID must be unique within a zone.
        # Given that all the sites are placed in a zone named after the region, the site ID must be unique within a region.
        id: <int; 1-10000; required>

        # Location as a string is resolved on Cloudvision.
        location: <str>
        site_contact: <str>
        site_after_hours_contact: <str>

# PREVIEW: These keys are in preview mode.
#
# Hostname or IP address of CloudVision host. Ex. "www.arista.io" for CVaaS.
# For `eos_designs` this variable is only used for the WAN Internet-exit integration with Zscaler.
# The same variable name is also used by the `cv_deploy` role, and will override the value of `ansible_host` on inventory 'cloudvision' host.
# Make sure to set it in a common group_vars file.
cv_server: <str>

# Settings for CloudVision telemetry streaming and provisioning.
cv_settings:

  # State streaming to CloudVision-as-a-Service.
  cvaas:

    # Enable streaming to CVaaS.
    # When enabled it will stream to 'apiserver.arista.io:443' using the VRF obtained from `default_mgmt_method` unless overridden under `clusters`.
    enabled: <bool; required>
    clusters: # default=[{'name': 'cvaas'}]

        # Short name for the CVaaS cluster. Required here, but only used when configuring multiple clusters.
      - name: <str; required; unique>

        # Optionally set the region to stream to.
        # The "auto" region will use 'apiserver.arista.io:443' which will redirect to the correct region based on the device's serial number.
        # "staging", "dev" and "play" are for internal Arista use.
        region: <str; "auto" | "us-central1-a" | "us-central1-b" | "us-central1-c" | "apnortheast-1" | "euwest-2" | "ausoutheast-1" | "na-northeast1-b" | "uk-1" | "india-1" | "staging" | "dev" | "play"; default="auto">

        # The VRF used to connect to CloudVision.
        # The value will be interpreted according to these rules:
        # - `use_mgmt_interface_vrf` will configure the VRF set with `mgmt_interface_vrf` and configure the `mgmt_interface` as the source interface.
        #   An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
        # - `use_inband_mgmt_vrf` will configure the VRF set with `inband_mgmt_vrf` and configure the `inband_mgmt_interface` as the source interface.
        #   An error will be raised if inband management is not configured for the device.
        # - `use_default_mgmt_method_vrf` will configure the VRF and source-interface for one of the two options above depending on the value of `default_mgmt_method`.
        # - Any other string will be used directly as the VRF name.
        vrf: <str; default="use_default_mgmt_method_vrf">

        # Path to the onboarding token used for certificate based authentication.
        # The path is on the EOS device and the token file must be copied to the device first.
        token_file: <str; default="/tmp/cv-onboarding-token">

        # Source-interface used to connect to CloudVision.
        # If not set, the source interface may be set automatically when VRF is set to `use_mgmt_interface_vrf`, `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
        source_interface: <str>

  # On-premise CloudVision clusters.
  onprem_clusters:

      # Short name for the cluster. Required here, but only used when configuring multiple clusters.
    - name: <str; required; unique>

      # CloudVision servers that makes up one cluster.
      servers: # 1-3 items; required

          # Server FQDN or IP address.
        - name: <str; required; unique>
          port: <int; default=9910>

      # The VRF used to connect to CloudVision.
      # The value will be interpreted according to these rules:
      # - `use_mgmt_interface_vrf` will configure the VRF set with `mgmt_interface_vrf` and configure the `mgmt_interface` as the source interface.
      #   An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
      # - `use_inband_mgmt_vrf` will configure the VRF set with `inband_mgmt_vrf` and configure the `inband_mgmt_interface` as the source interface.
      #   An error will be raised if inband management is not configured for the device.
      # - `use_default_mgmt_method_vrf` will configure the VRF and source-interface for one of the two options above depending on the value of `default_mgmt_method`.
      # - Any other string will be used directly as the VRF name.
      vrf: <str; default="use_default_mgmt_method_vrf">

      # Path to the onboarding token used for certificate based authentication.
      # The path is on the EOS device and the token file must be copied to the device first.
      token_file: <str; default="/tmp/token">

      # Source-interface used to connect to CloudVision.
      # If not set, the source interface may be set automatically when VRF is set to `use_mgmt_interface_vrf`, `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
      source_interface: <str>

  # Specific settings for the TerminAttr daemon.
  terminattr:

    # Exclude paths from Sysdb on the ingest side.
    # e.g. "/Sysdb/cell/1/agent,/Sysdb/cell/2/agent"
    ingestexclude: <str>

    # Exclude paths from the shared memory table.
    # e.g. "ale,flexCounter,hardware,kni,pulse,strata"
    smashexcludes: <str; default="ale,flexCounter,hardware,kni,pulse,strata">

    # Disable AAA authorization and accounting.
    # When setting this flag, all commands pushed from CloudVision are applied directly to the CLI without authorization.
    disable_aaa: <bool; default=False>

  # Automatically set source interface when VRF is set to `use_mgmt_interface_vrf`, `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
  # Can be set to `false` to avoid changes when migrating from the old `cv_instances` model.
  set_source_interfaces: <bool; default=True>

# Device type that CloudVision should use when generating the Topology like "leaf", "spine", "core", "edge" or "member-leaf". Defaults to the setting under node_type_keys.
cv_tags_topology_type: <str>

# PREVIEW: These keys are in preview mode.
#
# Service account token as defined on CloudVision. This value should be using Ansible Vault.
# For `eos_designs` this variable is only used for the WAN Internet-exit integration with Zscaler.
# The same variable name is also used by the `cv_deploy` role, and will override the value of `ansible_password` on inventory 'cloudvision' host.
# Make sure to set it in a common group_vars file.
cv_token: <str>

# Generate AVD configurations directly from the given CloudVision topology.
# Activate this feature by setting `use_cv_topology` to `true`.
# Interfaces are assigned according to the following rules:
#   - All interfaces connected to the MLAG peer (only other device in the same node group) will be `mlag_interfaces`.
#   - For connections between devices with different `cv_topology_levels[type=<type>].level`, the lowest level will be considered the "parent switch"
#     and the highest level will be considered the "child switch".
#   - Connections between devices with the same `cv_topology_levels[type=<type>].level` will be ignored and must be created manually.
#   - The first Management interface is assigned as `mgmt_interface` unless it is set for the node or under platform_settings.
# Neighbor hostnames must match the inventory hostnames of the AVD inventory to be taken into consideration.
cv_topology:
  - hostname: <str; required; unique>
    platform: <str; required>
    interfaces: # required
      - name: <str; required; unique>
        neighbor: <str>
        neighbor_interface: <str>

# Type to level assignment used for generation of the AVD topology from the CloudVision topology.
# See `cv_topology` for details.
cv_topology_levels:

    # Node type like l3leaf, l2spine etc.
  - type: <str; required; unique>

    # Level value used to determine the relationship between two devices for a connection.
    # The lower value is the "parent switch" (like Spine).
    # The higher value is the "child switch" (like Leaf).
    level: <int; required>

# DC Name is used in:
# - Fabric Documentation (Optional, falls back to fabric_name)
# - SNMP Location: `snmp_settings.location` (Optional)
# - HER Overlay DC scoped flood lists: `overlay_her_flood_list_scope: dc` (Required)
dc_name: <str>

