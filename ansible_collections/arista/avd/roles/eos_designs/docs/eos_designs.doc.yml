      campus: <str>

      # PREVIEW: This option is marked as "preview", meaning the data models or generated configuration can change at any time.
      # Name of the campus pod. Used to generate CloudVision device tags with the `generate_cv_tags.campus_fabric` feature.
      campus_pod: <str>

      # PREVIEW: This option is marked as "preview", meaning the data models or generated configuration can change at any time.
      # Name of the campus access pod. Used to generate CloudVision device tags with the `generate_cv_tags.campus_fabric` feature.
      campus_access_pod: <str>

      # Device type that CloudVision should use when generating the Topology like "leaf", "spine", "core", "edge" or "member-leaf".
      cv_tags_topology_type: <str>

      # PREVIEW: This option is marked as "preview", meaning the data models or generated configuration can change at any time.
      # Set the OS version and management IP address for the digital twin of the associated node(s).
      digital_twin:

        # Desired ACT Digital Twin OS version.
        # Overrides global `digital_twin.fabric.act_os_version` flag.
        act_os_version: <str>

        # Desired management interface IPv4 address.
        mgmt_ip: <str>

        # Specifies if the ACT Digital Twin device is deployed with direct access to the Internet.
        # This option applies only to the 'cloudeos' and 'veos' node types and will be ignored for all other ACT node types.
        # ACT does not provide direct Internet access to cloudeos or veos devices by default.
        # Overrides global `digital_twin.fabric.act_internet_access` flag.
        act_internet_access: <bool>
aaa_settings:
  enable_password:

    # SHA512 hashed password.
    password: <str>
  tacacs:
    servers:

        # Host IP address or name.
        # Combination of `host` and `vrf` should be unique.
      - host: <str; required>
        groups: # >=1 items; required
          - <str>

        # VRF name.
        # The value will be interpreted according to these rules:
        # - `use_mgmt_interface_vrf` will configure the TACACS host under the VRF set with `mgmt_interface_vrf`.
        #   An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
        # - `use_inband_mgmt_vrf` will configure the TACACS host under the VRF set with `inband_mgmt_vrf`.
        #   An error will be raised if inband management is not configured for the device.
        # - `use_default_mgmt_method_vrf` will configure the VRF and source-interface for one of the two options above depending on the value of `default_mgmt_method`.
        # - Any other string will be used directly as the VRF name.
        vrf: <str>

        # Encrypted Type 7 key.
        # Takes precedence over `cleartext_key` if both are provided.
        # Either `key` or `cleartext_key` must be set to render the configuration;
        # otherwise, an error will be raised.
        key: <str>

        # Plaintext password that will be encrypted to Type 7 by AVD.
        # To protect the password at rest it is strongly recommended to make use of a vault or similar.
        # Either `key` or `cleartext_key` must be set to render the configuration;
        # otherwise, an error will be raised.
        cleartext_key: <str>
    vrfs:

        # VRF Name.
      - name: <str; required; unique>

        # Source interface to use for TACACS hosts in this VRF.
        # If not set, the source interface may be set automatically when the TACACS server VRF is set to `use_mgmt_interface_vrf`, `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
        # If set for the VRFs defined by `mgmt_interface_vrf` or `inband_mgmt_vrf`, this setting will take precedence.
        source_interface: <str>
    policy:
      ignore_unknown_mandatory_attribute: <bool; default=False>
  radius:
    servers:

        # Host IP address or name.
        # Combination of `host` and `vrf` should be unique.
      - host: <str; required>
        groups: # >=1 items; required
          - <str>

        # VRF name.
        # The value will be interpreted according to these rules:
        # - `use_mgmt_interface_vrf` will configure the Radius host under the VRF set with `mgmt_interface_vrf`.
        #   An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
        # - `use_inband_mgmt_vrf` will configure the Radius host under the VRF set with `inband_mgmt_vrf`.
        #   An error will be raised if inband management is not configured for the device.
        # - `use_default_mgmt_method_vrf` will configure the VRF and source-interface for one of the two options above depending on the value of `default_mgmt_method`.
        # - Any other string will be used directly as the VRF name.
        vrf: <str>

        # Encrypted type-7 key.
        # Takes precedence over `cleartext_key`.
        key: <str>

        # Cleartext password.
        # Encrypted to Type 7 by AVD.
        # To protect the password at rest it is strongly recommended to make use of a vault or similar.
        cleartext_key: <str>
    vrfs:

        # VRF Name.
      - name: <str; required; unique>

        # Source interface to use for RADIUS hosts in this VRF.
        # If not set, the source interface may be set automatically when the RADIUS server VRF is set to `use_mgmt_interface_vrf`, `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
        # If set for the VRFs defined by `mgmt_interface_vrf` or `inband_mgmt_vrf`, this setting will take precedence.
        source_interface: <str>
  authentication:
    login:

      # Login authentication method(s) as a string.
      # Examples:
      # - "group tacacs+ local"
      # - "group MYGROUP none"
      # - "group radius group MYGROUP local"
      default: <str>

      # Command-API authentication method(s) as a string.
      # This feature is not yet visible in EOS.
      # This feature only supports local authentication at the moment.
      # Examples:
      # - "local"
      command_api: <str>

      # Console authentication method(s) as a string.
      # Examples:
      # - "group tacacs+ local"
      # - "group MYGROUP none"
      # - "group radius group MYGROUP local"
      console: <str>
    enable:

      # Enable authentication method(s) as a string.
      # Examples:
      # - "group tacacs+ local"
      # - "group MYGROUP none"
      # - "group radius group MYGROUP local"
      default: <str>
    dot1x:

      # 802.1x authentication method(s) as a string.
      # Examples:
      # - "group radius"
      # - "group MYGROUP group radius"
      default: <str>
    policies:
      on_failure_log: <bool>
      on_success_log: <bool>
      local:
        allow_nopassword: <bool>
      lockout:
        failure: <int; 1-255>
        duration: <int; 1-4294967295>
        window: <int; 1-4294967295>
  authorization:
    policy:
      local_default_role: <str>
    exec:

      # Exec authorization method(s) as a string.
      # Examples:
      # - "group tacacs+ local"
      # - "group MYGROUP none"
      # - "group radius group MYGROUP local"
      default: <str>
    config_commands: <bool>
    serial_console: <bool>
    dynamic:
      dot1x_additional_groups: # >=1 items
        - <str>
    commands:

      # Command authorization method(s) as a string.
      # Examples:
      # - "group tacacs+ local"
      # - "group MYGROUP none"
      # - "group tacacs+ group MYGROUP local
      all_default: <str>
      privilege:

          # Privilege level(s) 0-15.
        - level: <str>

          # Command authorization method(s) as a string.
          # Examples:
          # - "group tacacs+ local"
          # - "group MYGROUP none"
          # - "group tacacs+ group MYGROUP local"
          default: <str>
  accounting:
    exec:
      console:
        type: <str; "none" | "start-stop" | "stop-only"; required>
        methods: # >=1 items
          - method: <str; "logging" | "group"; required>

            # Specify the server group to be used.
            # This option is applicable only when the `method` key is explicitly set to `group`.
            group: <str>
      default:
        type: <str; "none" | "start-stop" | "stop-only"; required>
        methods: # >=1 items
          - method: <str; "logging" | "group"; required>

            # Specify the server group to be used.
            # This option is applicable only when the `method` key is explicitly set to `group`.
            group: <str>
    system:
      default:
        type: <str; "none" | "start-stop" | "stop-only"; required>
        methods: # >=1 items
          - method: <str; "logging" | "group"; required>

            # Specify the server group to be used.
            # This option is applicable only when the `method` key is explicitly set to `group`.
            group: <str>
    dot1x:
      default:
        type: <str; "start-stop" | "stop-only"; required>
        methods: # >=1 items

            # Forward accounting packets to all servers within the specified group.
            # This option is applicable only when the `method` key is explicitly set to `group`.
          - multicast: <bool>
            method: <str; "logging" | "group"; required>

            # Specify the server group to be used.
            # This option is applicable only when the `method` key is explicitly set to `group`.
            group: <str>
    commands:
      console:

          # Privilege level 'all' or 0-15. Ensure that if ranges are used, they do not overlap with one another.
        - commands: <str>
          type: <str; "none" | "start-stop" | "stop-only"; required>
          methods: # >=1 items
            - method: <str; "logging" | "group"; required>

              # Specify the server group to be used.
              # This option is applicable only when the `method` key is explicitly set to `group`.
              group: <str>
      default:

          # Privilege level 'all' or 0-15. Ensure that if ranges are used, they do not overlap with one another.
        - commands: <str>
          type: <str; "none" | "start-stop" | "stop-only"; required>
          methods: # >=1 items
            - method: <str; "logging" | "group"; required>

              # Specify the server group to be used.
              # This option is applicable only when the `method` key is explicitly set to `group`.
              group: <str>
  root_login:
    enabled: <bool; default=False>
    sha512_password: <str>
  local_users:

      # Username.
    - name: <str; required; unique>

      # If true, the user will be removed and all other settings are ignored.
      # Useful for removing the default "admin" user.
      disabled: <bool>

      # Initial privilege level with local EXEC authorization.
      privilege: <int; 0-15>

      # EOS RBAC Role to be assigned to the user such as "network-admin" or "network-operator".
      role: <str>

      # SHA512 Hash of Password.
      # Must be the hash of the password. By default EOS salts the password with the username, so the simplest is to generate the hash on an EOS device using the same username.
      sha512_password: <str>

      # If set a password will not be configured for this user. "sha512_password" MUST not be defined for this user.
      no_password: <bool>
      ssh_key: <str>
      secondary_ssh_key: <str>

      # Specify shell for the user.
      shell: <str; "/bin/bash" | "/bin/sh" | "/sbin/nologin">
address_locking_settings:

  # The value will be interpreted according to these rules:
  #   - `use_mgmt_interface` will configure the `mgmt_interface` as the local interface.
  #   - `use_inband_mgmt_interface` will configure the `inband_mgmt_interface` as the local interface.
  #   - `use_default_mgmt_method_interface` will configure `mgmt_interface` or `inband_mgmt_interface` as the local interface depending on the value of `default_mgmt_method`.
  #   - Any other string will be used directly as the local interface.
  local_interface: <str; default="use_default_mgmt_method_interface">
  local_users:

      # Username.
    - name: <str; required; unique>

      # If true, the user will be removed and all other settings are ignored.
      # Useful for removing the default "admin" user.
      disabled: <bool>

      # Initial privilege level with local EXEC authorization.
      privilege: <int; 0-15>

      # EOS RBAC Role to be assigned to the user such as "network-admin" or "network-operator".
      role: <str>

      # SHA512 Hash of Password.
      # Must be the hash of the password. By default EOS salts the password with the username, so the simplest is to generate the hash on an EOS device using the same username.
      sha512_password: <str>

      # If set a password will not be configured for this user. "sha512_password" MUST not be defined for this user.
      no_password: <bool>
      ssh_key: <str>
      secondary_ssh_key: <str>

      # Specify shell for the user.
      shell: <str; "/bin/bash" | "/bin/sh" | "/sbin/nologin">
  dhcp_servers_ipv4:

      # DHCP server IPv4 address.
    - <str>

  # Disable IP locking on configured ports.
  disabled: <bool>
  leases:

      # IP address.
    - ip: <str; required>

      # MAC address (hhhh.hhhh.hhhh or hh:hh:hh:hh:hh:hh).
      mac: <str; required>
  locked_address:

    # Configure deauthorizing locked addresses upon MAC aging out.
    expiration_mac_disabled: <bool>

    # Configure enforcement for locked IPv4 addresses.
    ipv4_enforcement_disabled: <bool>

    # Configure enforcement for locked IPv6 addresses.
    ipv6_enforcement_disabled: <bool>

# Application traffic recognition configuration.
application_classification:

  # List of categories.
  categories:

      # Category name.
    - name: <str; required; unique>

      # List of applications.
      applications:

          # Application name.
        - name: <str; required>

          # Service Name.
          # Specific service to target for this application.
          # If no service is specified, all supported services of the application are matched.
          # Not all valid values are valid for all applications, check on EOS CLI.
          service: <str; "audio-video" | "chat" | "default" | "file-transfer" | "networking-protocols" | "peer-to-peer" | "software-update">
  field_sets:

    # L4 port field-set.
    l4_ports:

        # L4 port field-set name.
      - name: <str; required; unique>
        port_values: # >=1 items

            # Port values or range of port values.
            # Port values are between 0 and 65535.
          - <str>

    # IPv4 prefix field set.
    ipv4_prefixes:

        # IPv4 prefix field-set name.
      - name: <str; required; unique>
        prefix_values: # >=1 items

            # IP prefix (ex 1.2.3.0/24).
          - <str>
  applications:

    # List of user defined IPv4 applications. The name should be unique over all defined applications (ipv4 and l4).
    ipv4_applications:

        # Application name.
      - name: <str; required; unique>

        # Source prefix set name.
        src_prefix_set_name: <str>

        # Destination prefix set name.
        dest_prefix_set_name: <str>

        # Accept DSCP value(s) or range(s).
        # DSCP values can be between 0 and 63.
        # Other valid values are cs0 to cs7, af11-13, af21-23, af31-33, af41-af43 and ef.
        # Note: The values are not sorted so the list items need to be supplied in the right order to match the CLI if required.
        dscp_ranges:

            # DSCP value or range syntax.
          - <str>

        # List of protocols to consider for this application.
        # To use port field-sets (source, destination or both), the list
        # must contain only one or two protocols, either `tcp` or `udp`.
        # When using both protocols, one line is rendered for each in the configuration,
        # hence the field-sets must have the same value for `tcp_src_port_set_name` and
        # `udp_src_port_set_name` and for `tcp_dest_port_set_name` and `udp_dest_port_set_name`
        # if set in order to generate valid configuration in EOS.
        protocols:
          - <str; "ahp" | "esp" | "icmp" | "igmp" | "ospf" | "pim" | "rsvp" | "tcp" | "udp" | "vrrp">

        # Accept protocol value(s) or range(s).
        # Protocol values can be between 1 and 255.
        protocol_ranges:
          - <str>

        # Name of field set for UDP source ports.
        # When the `protocols` list contain both `tcp` and `udp`, this key value
        # must be the same as `tcp_src_port_set_name`.
        udp_src_port_set_name: <str>

        # Name of field set for TCP source ports.
        # When the `protocols` list contain both `tcp` and `udp`, this key value
        # must be the same as `udp_src_port_set_name`.
        tcp_src_port_set_name: <str>

        # Name of field set for UDP destination ports.
        # When the `protocols` list contain both `tcp` and `udp`, this key value
        # must be the same as `tcp_dest_port_set_name`.
        udp_dest_port_set_name: <str>

        # Name of field set for TCP destination ports.
        # When the `protocols` list contain both `tcp` and `udp`, this key value
        # must be the same as `udp_dest_port_set_name`.
        tcp_dest_port_set_name: <str>

    # List of user defined L4 applications. The name should be unique over all defined applications (ipv4 and l4).
    l4_applications:

        # Application name.
      - name: <str; required; unique>

        # List of protocols to consider for this application.
        # To use port field-sets (source, destination or both), the list
        # must contain only one or two protocols, either `tcp` or `udp`.
        # When using both protocols, one line is rendered for each in the configuration,
        # hence the field-sets must have the same value for `tcp_src_port_set_name` and
        # `udp_src_port_set_name` and for `tcp_dest_port_set_name` and `udp_dest_port_set_name`
        # if set in order to generate valid configuration in EOS.
        protocols:
          - <str; "ahp" | "esp" | "icmp" | "igmp" | "ospf" | "pim" | "rsvp" | "tcp" | "udp" | "vrrp">

        # Accept protocol value(s) or range(s).
        # Protocol values can be between 1 and 255.
        protocol_ranges:
          - <str>

        # Name of field set for UDP source ports.
        # When the `protocols` list contain both `tcp` and `udp`, this key value
        # must be the same as `tcp_src_port_set_name`.
        udp_src_port_set_name: <str>

        # Name of field set for TCP source ports.
        # When the `protocols` list contain both `tcp` and `udp`, this key value
        # must be the same as `udp_src_port_set_name`.
        tcp_src_port_set_name: <str>

        # Name of field set for UDP destination ports.
        # When the `protocols` list contain both `tcp` and `udp`, this key value
        # must be the same as `tcp_dest_port_set_name`.
        udp_dest_port_set_name: <str>

        # Name of field set for TCP destination ports.
        # When the `protocols` list contain both `tcp` and `udp`, this key value
        # must be the same as `udp_dest_port_set_name`.
        tcp_dest_port_set_name: <str>

  # Group of applications.
  application_profiles:

      # Application Profile name.
    - name: <str; required; unique>

      # List of applications part of the application profile.
      applications:

          # Application Name.
        - name: <str; required>

          # Service Name.
          # Specific service to target for this application.
          # If no service is specified, all supported services of the application are matched.
          # Not all valid values are valid for all applications, check on EOS CLI.
          service: <str; "audio-video" | "chat" | "default" | "file-transfer" | "networking-protocols" | "peer-to-peer" | "software-update">

      # List of transport protocols.
      application_transports:

          # Transport name.
        - <str; "http" | "https" | "udp" | "tcp" | "ip" | "ip6" | "ssl" | "rtp" | "sctp" | "quic">

      # Categories under this application profile.
      categories:

          # Name of a category.
        - name: <str; required>

          # Service Name.
          # Specific service to target for this application.
          # If no service is specified, all supported services of the application are matched.
          # Not all valid values are valid for all applications, check on EOS CLI.
          service: <str; "audio-video" | "chat" | "default" | "file-transfer" | "networking-protocols" | "peer-to-peer" | "software-update">

# Validation Mode for AVD input data validation.
# Input data validation will validate the input variables according to the schema.
# During validation, messages will generated with information about the host(s) and key(s) which failed validation.
# "error" will produce error messages and fail the task.
# "warning" will produce warning messages.
avd_data_validation_mode: <str; "error" | "warning"; default="error">

# PREVIEW: This option is marked as "preview", meaning the data models or generated configuration can change at any time.
# Enable generation of the Digital Twin version of the fabric (Digital Twin topology, adjusted configuration, etc.).
# By default, Digital Twin artifacts (such as the topology file, adjusted structured and EOS configuration, device and fabric documentation) will replace original fabric artifacts.
# To keep Digital Twin artifacts separate, adjust the `output_dir_name` and `documentation_dir_name` variables for both `eos_designs` and `eos_cli_config_gen` to point to a dedicated output location.
avd_digital_twin_mode: <bool; default=False>

# Dump all vars and facts per device after generating `avd_switch_facts`.
avd_eos_designs_debug: <bool; default=False>

# PREVIEW: This option is marked as "preview", while we refactor the code to conform to the described behavior.
# When this is enabled, the generation of Structured Config in `eos_designs` will prevent duplicate objects generated
# by different input models. This will also improve performance since `eos_designs` will not maintain separate copied of the Structured Configuration.
# As an example, if you define an Ethernet interface under `l3_edge` and use the same interface for connectivity under `servers`:
# - With this option disabled (default), AVD will merge these configurations together for the interface and not raise an error.
# - With this option enabled, AVD will raise an error about duplicate interface definitions.
avd_eos_designs_enforce_duplication_checks_across_all_models: <bool; default=False>

# Generate structured configuration per device.
avd_eos_designs_structured_config: <bool; default=True>

# Unset `avd_switch_facts` to gain a small performance improvement since Ansible needs to handle fewer variables.
avd_eos_designs_unset_facts: <bool; default=True>

# BFD Multihop tuning.
bfd_multihop: # (1)!
  interval: <int; 50-60000; required>
  min_rx: <int; 50-60000; required>
  multiplier: <int; 3-50; required>

# BGP AS <1-4294967295> or AS number in asdot notation "<1-65535>.<0-65535>" to use to configure overlay when "overlay_routing_protocol" == ibgp.
# For asdot notation in YAML inputs, the value must be put in quotes, to prevent it from being interpreted as a float number.
bgp_as: <str>

# Default activation of IPv4 unicast address-family on all IPv4 neighbors.
# It is best practice to disable activation.
bgp_default_ipv4_unicast: <bool; default=False>
bgp_distance:
  external_routes: <int; 1-255; required>
  internal_routes: <int; 1-255; required>
  local_routes: <int; 1-255; required>

# Maximum ECMP for BGP multi-path.
bgp_ecmp: <int; 1-600>

# BGP graceful-restart allows a BGP speaker with separate control plane and data plane processing to continue forwarding traffic during a BGP restart.
# Its neighbors (receiving speakers) may retain routing information from the restarting speaker while a BGP session with it is being re-established, reducing route flapping.
bgp_graceful_restart:

  # Enable or disable graceful-restart for all BGP peers.
  enabled: <bool; default=False; required>

  # Restart time in seconds.
  restart_time: <int; 1-3600; default=300>

# Maximum Paths for BGP multi-path.
# The default value is 4 except for WAN Routers where the default value is 16.
bgp_maximum_paths: <int; 1-600>

# Configure an iBGP full mesh between PEs, either because there is no RR used or other reasons.
# Only supported in combination with MPLS overlay.
bgp_mesh_pes: <bool; default=False>

# Leverage an Arista EOS switch to generate the encrypted password using the correct peer group name.
# Note that the name of the peer groups use '-' instead of '_' in EOS configuration.
bgp_peer_groups:
  ipv4_underlay_peers:

    # Name of peer group.
    name: <str; default="IPv4-UNDERLAY-PEERS">

    # BGP peer group Type 7 encrypted password.
    # Takes precedence over `cleartext_password`.
    password: <str>

    # BGP peer group cleartext password.
    # To protect the password at rest it is strongly recommended to make use of a vault or similar.
    cleartext_password: <str>
    bfd: <bool; default=False>

    # Custom structured config added under router_bgp.peer_groups.[name=<name>] for eos_cli_config_gen.
    structured_config: <dict>

  # Set this peer group name to use a different peer-group for MLAG peerings in VRFs.
  # By default AVD uses the `mlag_ipv4_underlay_peer` peer group for the Underlay and for all the VRFs.
  #
  # If `mlag_ipv4_vrfs_peer.name` and `mlag_ipv4_underlay_peer.name` are the same,
  # then all the attributes set here are ignored.
  mlag_ipv4_vrfs_peer:

    # Name of peer group.
    name: <str; required>

    # BGP peer group Type 7 encrypted password.
