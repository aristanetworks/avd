---
# Role defaults - main

# Run ANTA for these devices.
# Defaults to all hosts in the play.
# This means the role must be imported/included in a play targeting only the relevant EOS devices - not CloudVision.
anta_runner_devices: "{{ anta_devices | default(ansible_play_hosts) }}"

# Enable AVD catalogs generation.
anta_runner_avd_catalogs_enabled: "{{ avd_catalogs_enabled | default(true) }}"

# Disable user-defined catalogs generation.
anta_runner_user_catalogs_enabled: "{{ user_catalogs_enabled | default(false) }}"

# Generate extra fabric-wide validation tests.
anta_runner_avd_catalogs_extra_fabric_validation: "{{ avd_catalogs_extra_fabric_validation | default(false) }}"
anta_runner_avd_catalogs_filters: "{{ avd_catalogs_filters | default([]) }}"

# Global timeout for the ANTA runner.
anta_runner_timeout: 30

# ANTA runner batch size. This controls the number of devices that will be processed in parallel. 5-10 is a good starting point.
anta_runner_batch_size: 5

# Run ANTA in dry-run mode. This will generate the tests but not execute them.
anta_runner_dry_run: false

# Structured configuration file format. Supported formats: yml, yaml, json.
anta_runner_structured_config_file_format: "{{ avd_structured_config_file_format | default('yml') }}"

# ANTA runner reports sorting settings.
anta_runner_report_status_priority: "{{ anta_report_status_priority | default(['error', 'failure', 'skipped', 'success', 'unset']) }}"
anta_runner_report_sort_fields: "{{ anta_report_sort_fields | default(['device', 'categories', 'test', 'description', 'custom_field']) }}"
anta_runner_report_expand_results: "{{ anta_report_expand_results | default(false) }}"
anta_runner_report_custom_field: "{{ anta_report_custom_field | default(false) }}"
anta_runner_report_exclude_statuses: "{{ anta_report_exclude_statuses | default([]) }}"
