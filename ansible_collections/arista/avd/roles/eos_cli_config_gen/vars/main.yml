---
eos_cli_config_gen_internal_legacy_var_aliases:
  avd_structured_config_file_format: eos_cli_config_gen_structured_config_file_format
  avd_vault_id: eos_cli_config_gen_vault_id
  custom_templates: eos_cli_config_gen_custom_templates
  devices_dir: eos_cli_config_gen_devices_dir
  devices_dir_name: eos_cli_config_gen_devices_dir_name
  documentation_dir: eos_cli_config_gen_documentation_dir
  documentation_dir_name: eos_cli_config_gen_documentation_dir_name
  eos_config_dir: eos_cli_config_gen_config_dir
  eos_config_dir_name: eos_cli_config_gen_config_dir_name
  output_dir: eos_cli_config_gen_output_dir
  output_dir_name: eos_cli_config_gen_output_dir_name
  read_structured_config_from_file: eos_cli_config_gen_read_structured_config_from_file
  root_dir: eos_cli_config_gen_root_dir
  structured_dir: eos_cli_config_gen_structured_dir
  structured_dir_name: eos_cli_config_gen_structured_dir_name

eos_cli_config_gen_internal_structured_config_file_format: >-
  {{ eos_cli_config_gen_structured_config_file_format | default(avd_structured_config_file_format | default('yml')) }}
eos_cli_config_gen_internal_vault_id: "{{ eos_cli_config_gen_vault_id | default(avd_vault_id | default(None)) }}"
eos_cli_config_gen_internal_read_structured_config_from_file: >-
  {{ eos_cli_config_gen_read_structured_config_from_file | default(read_structured_config_from_file | default(true)) }}
eos_cli_config_gen_internal_root_dir: "{{ eos_cli_config_gen_root_dir | default(root_dir | default(inventory_dir)) }}"
eos_cli_config_gen_internal_documentation_dir_name: >-
  {{ eos_cli_config_gen_documentation_dir_name | default(documentation_dir_name | default('documentation')) }}
eos_cli_config_gen_internal_documentation_dir: >-
  {{
    eos_cli_config_gen_documentation_dir
    | default(documentation_dir | default(
        eos_cli_config_gen_internal_root_dir ~ '/' ~ eos_cli_config_gen_internal_documentation_dir_name
      ))
  }}
eos_cli_config_gen_internal_devices_dir_name: "{{ eos_cli_config_gen_devices_dir_name | default(devices_dir_name | default('devices')) }}"
eos_cli_config_gen_internal_devices_dir: >-
  {{
    eos_cli_config_gen_devices_dir
    | default(devices_dir | default(
        eos_cli_config_gen_internal_documentation_dir ~ '/' ~ eos_cli_config_gen_internal_devices_dir_name
      ))
  }}
eos_cli_config_gen_internal_output_dir_name: "{{ eos_cli_config_gen_output_dir_name | default(output_dir_name | default('intended')) }}"
eos_cli_config_gen_internal_output_dir: >-
  {{ eos_cli_config_gen_output_dir | default(output_dir | default(eos_cli_config_gen_internal_root_dir ~ '/' ~ eos_cli_config_gen_internal_output_dir_name)) }}
eos_cli_config_gen_internal_structured_dir_name: >-
  {{ eos_cli_config_gen_structured_dir_name | default(structured_dir_name | default('structured_configs')) }}
eos_cli_config_gen_internal_structured_dir: >-
  {{
    eos_cli_config_gen_structured_dir
    | default(structured_dir | default(
        eos_cli_config_gen_internal_output_dir ~ '/' ~ eos_cli_config_gen_internal_structured_dir_name
      ))
  }}
eos_cli_config_gen_internal_config_dir_name: "{{ eos_cli_config_gen_config_dir_name | default(eos_config_dir_name | default('configs')) }}"
eos_cli_config_gen_internal_config_dir: >-
  {{
    eos_cli_config_gen_config_dir
    | default(eos_config_dir | default(
        eos_cli_config_gen_internal_output_dir ~ '/' ~ eos_cli_config_gen_internal_config_dir_name
      ))
  }}
