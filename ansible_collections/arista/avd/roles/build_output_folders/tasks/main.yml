---
# tasks file for build_directories

- name: "Cleanup existing folders in {{ avd_output_dir }}"
  ansible.builtin.file:
    path: "{{ avd_output_dir }}"
    state: absent
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder {{ avd_output_dir }}"
  ansible.builtin.file:
    path: "{{ avd_output_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for structured YAML files {{ avd_structured_dir_name }}"
  ansible.builtin.file:
    path: "{{ avd_structured_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for EOS Configuration files {{ avd_eos_config_dir_name }}"
  ansible.builtin.file:
    path: "{{ avd_eos_config_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for CVP structured YAML files {{ avd_structured_cvp_dir_name }}"
  ansible.builtin.file:
