- name: Create output directory for each EOS device
  ansible.builtin.file:
    path: "{{ avd_snapshots_backup_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

# anta_runner directories

- name: >-
    Cleanup existing folders in {{ avd_anta_dir_name ~ ', preserving ' ~ avd_user_catalogs_dir_name }}
  ansible.builtin.find:
    paths: "{{ avd_anta_dir }}"
    file_type: directory
    excludes: "{{ avd_user_catalogs_dir_name }}"
  register: build_output_folders_dirs_to_clean
  delegate_to: localhost
  run_once: true

- name: "Remove found directories in {{ avd_anta_dir_name }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ build_output_folders_dirs_to_clean.files }}"
  delegate_to: localhost
  run_once: true

- name: "Create folder for ANTA {{ avd_anta_dir_name }}"
  ansible.builtin.file:
    path: "{{ avd_anta_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for ANTA user-defined catalogs {{ avd_user_catalogs_dir_name }}"
  ansible.builtin.file:
    path: "{{ avd_user_catalogs_dir }}"
