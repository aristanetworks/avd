---
# tasks file for build_directories

- name: Validate legacy role variables
  arista.avd.legacy_role_vars:
    role_name: build_output_folders
    aliases: "{{ build_output_folders_internal_legacy_var_aliases }}"
    mode: "{{ avd_legacy_role_vars_mode | default('warning') }}"
  delegate_to: localhost
  run_once: true
  check_mode: false

- name: "Cleanup existing folders in {{ build_output_folders_internal_output_dir }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_output_dir }}"
    state: absent
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder {{ build_output_folders_internal_output_dir }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_output_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for structured YAML files {{ build_output_folders_internal_structured_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_structured_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for EOS Configuration files {{ build_output_folders_internal_eos_config_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_eos_config_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for CVP structured YAML files {{ build_output_folders_internal_structured_cvp_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_structured_cvp_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create documentation folder {{ build_output_folders_internal_documentation_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_documentation_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for Fabric documentation {{ build_output_folders_internal_fabric_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_fabric_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for EOS documentation {{ build_output_folders_internal_devices_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_devices_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for EOS post backup dir {{ build_output_folders_internal_post_running_config_backup_dir }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_post_running_config_backup_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for EOS pre backup dir {{ build_output_folders_internal_pre_running_config_backup_dir }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_pre_running_config_backup_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: Create output directory for each EOS device
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_snapshots_backup_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

# anta_runner directories

- name: >-
    Cleanup existing folders in {{ build_output_folders_internal_anta_dir_name ~ ', preserving ' ~ build_output_folders_internal_user_catalogs_dir_name }}
  ansible.builtin.find:
    paths: "{{ build_output_folders_internal_anta_dir }}"
    file_type: directory
    excludes: "{{ build_output_folders_internal_user_catalogs_dir_name }}"
  register: build_output_folders_dirs_to_clean
  delegate_to: localhost
  run_once: true

- name: "Remove found directories in {{ build_output_folders_internal_anta_dir_name }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ build_output_folders_dirs_to_clean.files }}"
  delegate_to: localhost
  run_once: true

- name: "Create folder for ANTA {{ build_output_folders_internal_anta_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_anta_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for ANTA user-defined catalogs {{ build_output_folders_internal_user_catalogs_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_user_catalogs_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for ANTA AVD generated catalogs {{ build_output_folders_internal_avd_catalogs_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_avd_catalogs_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for ANTA reports {{ build_output_folders_internal_anta_reports_dir_name }}"
  ansible.builtin.file:
    path: "{{ build_output_folders_internal_anta_reports_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true
