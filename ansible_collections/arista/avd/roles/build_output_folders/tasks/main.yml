---
# tasks file for build_directories

- name: "Cleanup existing folders in {{ output_dir }}"
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: absent
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder {{ output_dir }}"
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for structured YAML files {{ structured_dir_name }}"
  ansible.builtin.file:
    path: "{{ structured_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for EOS Configuration files {{ eos_config_dir_name }}"
  ansible.builtin.file:
