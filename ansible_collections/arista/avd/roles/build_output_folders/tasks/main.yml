    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for ANTA AVD generated catalogs {{ avd_catalogs_dir_name }}"
  ansible.builtin.file:
    path: "{{ avd_catalogs_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true

- name: "Create folder for ANTA reports {{ avd_anta_reports_dir_name }}"
  ansible.builtin.file:
    path: "{{ avd_anta_reports_dir }}"
    state: directory
    mode: "0o775"
  delegate_to: localhost
  run_once: true
