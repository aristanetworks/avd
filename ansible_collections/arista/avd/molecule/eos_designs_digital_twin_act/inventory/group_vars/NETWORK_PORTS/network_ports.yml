---

port_profiles:
  - profile: base_access_portfast
    mode: access
    spanning_tree_portfast: edge

network_ports:
  # All even ports between 30 and 40 are excluded from Digital Twin topology
  # Standalone interfaces to stay
  - switches:
      - dc1-leaf1[ab]
    switch_ports:
      - Ethernet31
      - Ethernet33

  # Standalone interfaces to be filtered out
  - switches:
      - dc1-leaf1[ab]
    switch_ports:
      - Ethernet32
      - Ethernet34
    description: EXCLUDED NETWORK_PORT
    # digital_twin: false

  # Dual-homed PO interfaces to stay
  - switches:
      - dc1-leaf1[ab]
    switch_ports:
      - Ethernet35
    port_channel:
      mode: active

  # Dual-homed PO interfaces to be filtered out
  - switches:
      - dc1-leaf1[ab]
    switch_ports:
      - Ethernet36
    port_channel:
      mode: active
      description: EXCLUDED NETWORK_PORT PO
    description: EXCLUDED NETWORK_PORT PO
    # digital_twin: false

  # Single-homed PO interfaces to stay
  - switches:
      - dc1-leaf1a
    switch_ports:
      - Ethernet37
      - Ethernet39
    port_channel:
      mode: active
      channel_id: 37

  # Single-homed PO interfaces to be filtered out
  - switches:
      - dc1-leaf1a
    switch_ports:
      - Ethernet38
      - Ethernet40
    port_channel:
      mode: active
      channel_id: 38
      description: EXCLUDED NETWORK_PORT PO
    description: EXCLUDED NETWORK_PORT PO
    # digital_twin: false

  # Standalone interfaces to stay
  - switches:
      - dc1-leaf1c
    switch_ports:
      - Ethernet31
      - Ethernet33
    profile: base_access_portfast
    poe:
      reboot:
        action: maintain

  # Standalone interfaces to be filtered out
  - switches:
      - dc1-leaf1c
    switch_ports:
      - Ethernet32
      - Ethernet34
    poe:
      reboot:
        action: maintain
    description: EXCLUDED NETWORK_PORT
    # digital_twin: false

  # network_ports which will be excluded from Digital Twin topology due to the filtering of the parent switches
  - switches:
      - dc1-leaf2[ab]
    switch_ports:
      - Ethernet32
      - Ethernet34

  - switches:
      - dc1-leaf2[ab]
    switch_ports:
      - Ethernet36
    port_channel:
      mode: active

  - switches:
      - dc1-leaf2a
    switch_ports:
      - Ethernet38
      - Ethernet40
    port_channel:
      mode: active
      channel_id: 37

  - switches:
      - dc1-leaf2c
    switch_ports:
      - Ethernet32
      - Ethernet34
    poe:
      reboot:
        action: maintain
