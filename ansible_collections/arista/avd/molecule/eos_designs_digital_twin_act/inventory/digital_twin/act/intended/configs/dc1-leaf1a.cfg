!
no enable password
no aaa root
!
prompt virtual_friendly_prompt
!
terminal length 100
terminal width 100
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-leaf1a
!
no spanning-tree vlan-id 4093-4094
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel8
   description L2_dc1-leaf1c_Port-Channel1
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 8
!
interface Port-Channel9
   description MLAG_dc1-leaf1b_Port-Channel9
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel13
   description SERVER_DC1-LEAF1-SERVER2
   no shutdown
   switchport
   mlag 13
!
interface Port-Channel14
   description EXCLUDED CONNECTED_ENDPOINT ADAPTER PO
   no shutdown
   switchport
   mlag 14
!
interface Port-Channel15
   description SERVER_DC1-LEAF1-SERVER3
   no shutdown
   switchport
!
interface Port-Channel16
   description EXCLUDED CONNECTED_ENDPOINT ADAPTER PO
   no shutdown
   switchport
!
interface Port-Channel22
   description EXCLUDED CONNECTED_ENDPOINT
   no shutdown
   switchport
   mlag 22
!
interface Port-Channel24
   description EXCLUDED CONNECTED_ENDPOINT
   no shutdown
   switchport
!
interface Port-Channel35
   no shutdown
   switchport
   mlag 35
!
interface Port-Channel36
   description EXCLUDED NETWORK_PORT PO
   no shutdown
   switchport
   mlag 36
!
interface Port-Channel37
   no shutdown
   switchport
   mlag 37
!
interface Port-Channel38
   description EXCLUDED NETWORK_PORT PO
   no shutdown
   switchport
   mlag 38
!
interface Ethernet1
   description P2P_dc1-spine1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.255.1/31
!
interface Ethernet2
   description P2P_dc1-spine2_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.255.3/31
!
interface Ethernet8
   description L2_dc1-leaf1c_Ethernet1
   no shutdown
   channel-group 8 mode active
!
interface Ethernet9
   description MLAG_dc1-leaf1b_Ethernet9
   no shutdown
   channel-group 9 mode active
!
interface Ethernet10
   description MLAG_dc1-leaf1b_Ethernet10
   no shutdown
   channel-group 9 mode active
!
interface Ethernet11
   description SERVER_DC1-LEAF1-SERVER1_Eth1
   no shutdown
   switchport
!
interface Ethernet12
   description EXCLUDED CONNECTED_ENDPOINT ADAPTER
   no shutdown
   switchport
!
interface Ethernet13
   description SERVER_DC1-LEAF1-SERVER2_Eth1
   no shutdown
   channel-group 13 mode active
!
interface Ethernet14
   description EXCLUDED CONNECTED_ENDPOINT ADAPTER PO
   no shutdown
   channel-group 14 mode active
!
interface Ethernet15
   description SERVER_DC1-LEAF1-SERVER3_Eth1
   no shutdown
   channel-group 15 mode active
!
interface Ethernet16
   description EXCLUDED CONNECTED_ENDPOINT ADAPTER PO
   no shutdown
   channel-group 16 mode active
!
interface Ethernet17
   description SERVER_DC1-LEAF1-SERVER3_Eth2
   no shutdown
   channel-group 15 mode active
!
interface Ethernet18
   description EXCLUDED CONNECTED_ENDPOINT ADAPTER PO
   no shutdown
   channel-group 16 mode active
!
interface Ethernet20
   description EXCLUDED CONNECTED_ENDPOINT
   no shutdown
   switchport
!
interface Ethernet22
   description EXCLUDED CONNECTED_ENDPOINT
   no shutdown
   channel-group 22 mode active
!
interface Ethernet24
   description EXCLUDED CONNECTED_ENDPOINT
   no shutdown
   channel-group 24 mode active
!
interface Ethernet26
   description EXCLUDED CONNECTED_ENDPOINT
   no shutdown
   channel-group 24 mode active
!
interface Ethernet31
   no shutdown
   switchport
!
interface Ethernet32
   description EXCLUDED NETWORK_PORT
   no shutdown
   switchport
!
interface Ethernet33
   no shutdown
   switchport
!
interface Ethernet34
   description EXCLUDED NETWORK_PORT
   no shutdown
   switchport
!
interface Ethernet35
   no shutdown
   channel-group 35 mode active
!
interface Ethernet36
   description EXCLUDED NETWORK_PORT PO
   no shutdown
   channel-group 36 mode active
!
interface Ethernet37
   no shutdown
   channel-group 37 mode active
!
interface Ethernet38
   description EXCLUDED NETWORK_PORT PO
   no shutdown
   channel-group 38 mode active
!
interface Ethernet39
   no shutdown
   channel-group 37 mode active
!
interface Ethernet40
   description EXCLUDED NETWORK_PORT PO
   no shutdown
   channel-group 38 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.0.3/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.1.3/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.1.101/24
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.255.1.96/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.1.64/31
!
interface Vxlan1
   description dc1-leaf1a_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/27 eq 32
   seq 20 permit 10.255.1.0/27 eq 32
!
mlag configuration
   domain-id DC1_L3_LEAF1
   local-interface Vlan4094
   peer-address 10.255.1.65
   peer-link Port-Channel9
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.255.0.3
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description dc1-leaf1b
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 12000
   neighbor 10.255.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.1 remote-as 65100
   neighbor 10.255.0.1 description dc1-spine1_Loopback0
   neighbor 10.255.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.2 remote-as 65100
   neighbor 10.255.0.2 description dc1-spine2_Loopback0
   neighbor 10.255.1.97 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.1.97 description dc1-leaf1b_Vlan4093
   neighbor 10.255.255.0 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.0 remote-as 65100
   neighbor 10.255.255.0 description dc1-spine1_Ethernet1
   neighbor 10.255.255.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.2 remote-as 65100
   neighbor 10.255.255.2 description dc1-spine2_Ethernet1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
!
end
