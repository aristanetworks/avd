!
no enable password
no aaa root
!
prompt virtual_friendly_prompt
!
terminal length 100
terminal width 100
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-leaf2c
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1
   description L2_DC1_L3_LEAF2_Port-Channel8
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_dc1-leaf2a_Ethernet8
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_dc1-leaf2b_Ethernet8
   no shutdown
   channel-group 1 mode active
!
interface Ethernet12
   description SERVER_DC1-LEAF2-SERVER1_iLO
   no shutdown
   switchport
!
interface Ethernet32
   no shutdown
   switchport
!
interface Ethernet34
   no shutdown
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.1.152/24
no ip routing vrf MGMT
!
end
