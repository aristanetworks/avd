---
node_type_keys:
  - key: wan_router
    type: wan_router
    default_wan_role: client
    default_underlay_routing_protocol: none
    default_overlay_routing_protocol: ibgp
    default_flow_tracker_type: hardware
    vtep: true
    network_services:
      l3: true
    interface_descriptions:
      underlay_port_channel_interfaces: 'custom_templates/interface_descriptions/underlay/port-channel-interfaces.j2'

type: wan_router

cv_pathfinder_regions:
  - name: AVD_Land_East
    id: 43
    description: AVD Region
    sites:
      - name: Site511
        id: 511
        location: Miami

bgp_peer_groups:
  wan_overlay_peers:
    password: "htm4AZe9mIQOO1uiMuGgYQ=="
    listen_range_prefixes:
      - 192.168.142.0/24
      - 192.168.143.0/24

wan_ipsec_profiles:
  control_plane:
    shared_key: ABCDEF1234567890
  data_plane:
    shared_key: ABCDEF1234567890666

wan_router:
  node_groups:
    - group: Site511
      uplink_type: p2p-vrfs
      cv_pathfinder_region: AVD_Land_East
      cv_pathfinder_site: Site511
      nodes:
        - name: node-type-l3-port-channels-custom-template
          id: 1
          loopback_ipv4_pool: 192.168.255.0/24
          vtep_loopback_ipv4_pool: 192.168.142.0/24
          bgp_as: 65005
          l3_port_channels:
            - # Port-Channel with 2 member ports
              name: Port-Channel5
              mode: passive
              member_interfaces:
                - name: Ethernet1/4
                  peer: peerDevice2
                  peer_interface: Ethernet1/12
                  speed: "forced 10000full"
                - # if peer not set, use parent L3 Port-Channel peer
                  name: Ethernet1/5
                  speed: "forced 10000full"
              ip_address: 192.168.1.105/31
              peer: peer2
              peer_port_channel: Port-Channel15
              peer_ip: 192.168.1.104
              qos_profile: TEST-QOS-PROFILE1
              wan_carrier: StreamFast
              wan_circuit_id: 102
              flow_tracking:
                enabled: false
              structured_config:
                service_policy:
                  qos:
                    input: TEST_POLICY
              raw_eos_cli: |
                ! TEST RAW_EOS_CLI
            - # sub-interface for Port-Channel with user-specfied encapsulation_dot1q_vlan
              name: Port-Channel5.100
              encapsulation_dot1q_vlan: 108
              ip_address: 192.168.100.115/31
              peer: peer2
              peer_port_channel: Port-Channel15
              peer_ip: 192.168.100.114
              qos_profile: TEST-QOS-PROFILE2
              flow_tracking:
                enabled: true
            - # sub-interface for Port-Channel without wan_carrier set
              name: Port-Channel5.105
              ip_address: 192.168.100.116/31
              peer: peer2
              peer_port_channel: Port-Channel16
              peer_ip: 192.168.100.117
              qos_profile: TEST-QOS-PROFILE2
              flow_tracking:
                enabled: true
wan_carriers:
  - name: Cybercast
    path_group: INET
    trusted: true
  - name: StreamFast
    path_group: INET
    trusted: true
  - name: ExtremeCable
    path_group: INET
    trusted: true
  - name: BlizzardFast
    path_group: INET
    trusted: true

wan_path_groups:
  - name: INET
    id: 101
