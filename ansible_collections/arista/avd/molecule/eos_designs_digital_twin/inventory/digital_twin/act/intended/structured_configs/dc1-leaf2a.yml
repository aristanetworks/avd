aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet9
  description: MLAG_dc1-leaf2b_Ethernet9
  shutdown: false
  channel_group:
    id: 9
    mode: active
  peer: dc1-leaf2b
  peer_interface: Ethernet9
  peer_type: mlag_peer
- name: Ethernet10
  description: MLAG_dc1-leaf2b_Ethernet10
  shutdown: false
  channel_group:
    id: 9
    mode: active
  peer: dc1-leaf2b
  peer_interface: Ethernet10
  peer_type: mlag_peer
- name: Ethernet1
  description: P2P_dc1-spine1_Ethernet3
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.9/31
  peer: dc1-spine1
  peer_interface: Ethernet3
  peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_dc1-spine2_Ethernet3
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.11/31
  peer: dc1-spine2
  peer_interface: Ethernet3
  peer_type: spine
  switchport:
    enabled: false
- name: Ethernet8
  description: L2_dc1-leaf2c_Ethernet1
  shutdown: false
  channel_group:
    id: 8
    mode: active
  peer: dc1-leaf2c
  peer_interface: Ethernet1
  peer_type: l2leaf
- name: Ethernet12
  description: SERVER_DC1-LEAF2-SERVER1_Eth1
  shutdown: false
  peer: DC1-LEAF2-SERVER1
  peer_interface: Eth1
  peer_type: server
  switchport:
    enabled: true
- name: Ethernet14
  description: SERVER_DC1-LEAF2-SERVER1_Eth3
  shutdown: false
  channel_group:
    id: 14
    mode: active
  peer: DC1-LEAF2-SERVER1
  peer_interface: Eth3
  peer_type: server
- name: Ethernet32
  shutdown: false
  peer_type: network_port
  switchport:
    enabled: true
- name: Ethernet34
  shutdown: false
  peer_type: network_port
  switchport:
    enabled: true
- name: Ethernet36
  shutdown: false
  channel_group:
    id: 36
    mode: active
  peer_type: network_port
- name: Ethernet38
  shutdown: false
  channel_group:
    id: 37
    mode: active
  peer_type: network_port
- name: Ethernet40
  shutdown: false
  channel_group:
    id: 37
    mode: active
  peer_type: network_port
hostname: dc1-leaf2a
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
is_deployed: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.5/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.1.5/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.1.103/24
  type: oob
metadata:
  platform: vEOS-lab
  fabric_name: FABRIC
  digital_twin:
    environment: act
    node_type: veos
    ip_addr: 172.16.1.103/24
    version: 4.33.1.1F
    username: act_user
    password: act_pass
mlag_configuration:
  domain_id: DC1_L3_LEAF2
  local_interface: Vlan4094
  peer_address: 10.255.1.69
  peer_link: Port-Channel9
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel9
  description: MLAG_dc1-leaf2b_Port-Channel9
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel8
  description: L2_dc1-leaf2c_Port-Channel1
  shutdown: false
  mlag: 8
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
- name: Port-Channel14
  description: SERVER_DC1-LEAF2-SERVER1
  shutdown: false
  mlag: 14
  switchport:
    enabled: true
- name: Port-Channel36
  shutdown: false
  mlag: 36
  switchport:
    enabled: true
- name: Port-Channel37
  shutdown: false
  mlag: 37
  switchport:
    enabled: true
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.0.0/27 eq 32
  - sequence: 20
    action: permit 10.255.1.0/27 eq 32
prompt: virtual_friendly_prompt
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65102'
  router_id: 10.255.0.5
  maximum_paths:
    paths: 4
    ecmp: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    type: ipv4
    remote_as: '65102'
    description: dc1-leaf2b
    next_hop_self: true
    send_community: all
    maximum_routes: 12000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.255.1.101
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    peer: dc1-leaf2b
    description: dc1-leaf2b_Vlan4093
  - ip_address: 10.255.255.8
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    peer: dc1-spine1
    description: dc1-spine1_Ethernet3
  - ip_address: 10.255.255.10
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    peer: dc1-spine2
    description: dc1-spine2_Ethernet3
  - ip_address: 10.255.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 10.255.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    peer: dc1-spine2
    description: dc1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  no_spanning_tree_vlan: 4093-4094
terminal:
  length: 100
  width: 100
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 10.255.1.100/31
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.255.1.68/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  tenant: system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  tenant: system
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: dc1-leaf2a_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
