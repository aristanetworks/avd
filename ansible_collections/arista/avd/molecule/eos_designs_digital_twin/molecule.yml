---
scenario:
  converge_sequence:
    - converge
  test_sequence:
    - converge
  cleanup_sequence:
    - destroy
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
  options:
    managed: false
platforms:
  - name: dummy
provisioner:
  name: ansible
  config_options:
    defaults:
      jinja2_extensions: 'jinja2.ext.loopcontrols,jinja2.ext.do,jinja2.ext.i18n'
      duplicate_dict_key: error
  playbooks:
    converge: './converge.yml'
  ansible_args:
    - --inventory
    - ${MOLECULE_SCENARIO_DIRECTORY}/inventory/hosts.yml
    - -e
    - '{"digital_twin_mode": true}'
    - --limit
    - DIGITAL_TWIN
verifier:
  name: ansible
