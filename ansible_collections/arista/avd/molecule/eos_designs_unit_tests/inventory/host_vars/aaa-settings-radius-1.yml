type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: aaa-settings-radius-1
      mgmt_ip: 192.168.0.2/24

aaa_settings:
  radius:
    servers:
      - host: 11.10.10.11
        vrf: default
        key: password
        groups:
          - RADIUS1

      - host: 11.10.10.1
        vrf: use_mgmt_interface_vrf
        key: password
        groups:
          - RADIUS1
          - RADIUS2

      - host: 11.10.10.2
        vrf: MGMT
        key: password
        groups:
          - RADIUS1

      - host: 11.10.10.3
        key: password
        groups:
          - RADIUS1
      #   # No VRF, so it should honor default_mgmt_method which is oob in this case

    vrfs:
      # Testing override of source for VRF default - no VRF in output source interface model.
      - name: default
        source_interface: Vlan123