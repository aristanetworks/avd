type: l2leaf
l2leaf:
  nodes:
    - name: cv-settings
      mgmt_ip: 192.168.0.2/24
      inband_mgmt_vrf: INBAND_MGMT_VRF
      inband_mgmt_ip: 172.17.0.2/24

default_mgmt_method: inband

cv_settings:
  cvaas:
    - name: cvaas-oob  # Name with dash
      vrf: use_mgmt_interface_vrf
      fqdn: www.arista.io
    - name: cvaas_inband_1  # Name with underscore and number
      vrf: use_inband_mgmt_vrf
      fqdn: www.cv-prod-euwest-2.arista.io
    - name: cvaas_mgmt_intf
      fqdn: www.arista.io
      source_interface: Loopback0
    - name: cvaas_inband_2
      fqdn: www.cv-prod-euwest-2.arista.io
      # No VRF, so we use default_mgmt_method by default, inband mgmt here.
  onprem_clusters:
    - name: onprem-oob
      vrf: use_mgmt_interface_vrf
      servers:
        - name: onprem_oob1
          port: 9911
        - name: onprem_oob2
        - name: onprem_oob3
    - name: onprem_inband
      vrf: use_inband_mgmt_vrf
      servers:
        - name: onprem_inband_1
      token_file: /tmp/anothertoken
      source_interface: Management1/1
    - name: onprem_inband_two
      servers:
        - name: onprem_inband_2
      # No VRF, so we use default_mgmt_method by default, inband mgmt here.
  terminattr_disable_aaa: true
  terminattr_ingestexclude: this_is_ingest_excluded
  terminattr_smashexcludes: this_is_smash_excluded
