---
type: spine

node_type_keys:
  - key: spine
    type: spine
    # Make sure this does not take over and generate empty string
    interface_descriptions:
      underlay_ethernet_interfaces: "templates/interface-descriptions/underlay-interfaces.j2"

spine:
  nodes:
    - name: l3_edge
      ptp:
        enabled: true
      id: 1
      evpn_role: "none"
      loopback_ipv4_pool: 1.2.3.4/24
      bgp_as: 65000

l3_edge:
  p2p_links:
    # Descriptions set manually should take precedence over the template
    - nodes: [l3_edge, peer4]
      interfaces: [ethernet4, ethernet4]
      ip: [1.1.1.1, 1.1.1.2]
      id: 4
      as: [65000, 65004]
      descriptions:
        - "Custom description on l3_edge_bgp eth4"
        - "Custom description on peer4 eth4"
