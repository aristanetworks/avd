---
# The group is composed of two nodes, one where encrypt_passwords is enabled
# and one where it is disabled to see the interactions.
# VRF level encryption for OSPF is always activated no matter the value of encrypt_passwords.

type: l3leaf

# Verifying we don't encrypt passwords
encrypt_passwords: false

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.66.0/24
    vtep_loopback_ipv4_pool: 192.168.142.0/24
    virtual_router_mac_address: 00:11:22:33:44:55
    bgp_as: 666
  nodes:
    - name: ospf-encryption-password-encrypt-false
      id: 43
      mgmt_ip: 192.168.42.43/24
      filter:
        tags: [ospf-encryption-password-encrypt-false]

tenants:
  - name: Tenant_OSPF
    mac_vrf_vni_base: 10000
    mac_vrf_id_base: 20000
    redistribute_mlag_ibgp_peering_vrfs: true
    vrfs:
      - name: Tenant_OSPF_VRF_LEVEL_SIMPLE_ENCRYPTION
        vrf_vni: 100
        vrf_id: 42
        ospf:
          enabled: true
          router_id: 10.10.10.10
          # The VRF is configured with OSPF auth method simple
          authentication: simple
          simple_auth_key: password
          nodes: [ospf-encryption-password-encrypt-false]
        svis:
          # test ospf authentication inherited from VRF vlan interface for both
          - id: 202
            name: Tenant_OSPF_202
            tags: [ospf-encryption-password-encrypt-false]
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
          # test ospf simple authentication at SVI level overwriting VRF level
          - id: 204
            name: Tenant_OSPF_204
            tags: [ospf-encryption-password-encrypt-false]
            enabled: true
            ip_address_virtual: 10.1.40.1/24
            ospf:
              enabled: true
              area: 1
              cost: 100
              authentication: simple
              simple_auth_key: P6e73mHkLBd2exwHPq6K3A==
        l3_interfaces:
          - interfaces: [Ethernet1]
            ip_addresses: [10.10.70.70/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "Overwriting auth from VRF, encrypt_passwords: false"
            ospf:
              enabled: true
              cost: 100
              authentication: message-digest
              point_to_point: true
              # overwriting keys from VRF on ospf-encryption-password-encrypt-false, which is using `encrypt_passwords: false`
              # hence verifying the type 7 password is not re-encrypted
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: CSjTKv7UtuWSOX61bToedQ==
          - interfaces: [Ethernet2]
            ip_addresses: [10.10.20.20/24]
            nodes: [ospf-encryption-password-encrypt-false]
            description: "Inheriting auth from VRF, encrypt_passwords: false"
            mtu: 9000
            enabled: true
            ospf:
              enabled: true
              cost: 100
              point_to_point: true
      - name: Tenant_OSPF_VRF_LEVEL_MESSAGE_DIGEST_ENCRYPTION
        vrf_vni: 101
        vrf_id: 43
        ospf:
          enabled: true
          router_id: 10.10.10.20
          # The VRF is configured with OSPF auth method message-digest
          authentication: message-digest
          message_digest_keys:
            - id: 1
              hash_algorithm: sha256
              key: arista
          nodes: [ospf-encryption-password-encrypt-false]
        svis:
          # test ospf authentication inherited from VRF vlan interface
          - id: 212
            name: Tenant_OSPF_212
            tags: [ospf-encryption-password-encrypt-false]
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
          # test overwriting ospf authentication message-digest with simple for both nodes.
          - id: 213
            name: Tenant_OSPF_213
            tags: [ospf-encryption-password-encrypt-false]
            enabled: true
            ip_address_virtual: 10.1.30.1/24
            ospf:
              enabled: true
              area: 1
              cost: 100
              authentication: simple
              simple_auth_key: 9lUSaRCtplbyboJZn9kq5g==
        l3_interfaces:
          - interfaces: [Ethernet3]
            ip_addresses: [10.10.70.70/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "Overwriting auth from VRF, encrypt_passwords: false"
            ospf:
              enabled: true
              cost: 100
              authentication: message-digest
              point_to_point: true
              # overwriting keys from VRF on ospf-encryption-password-encrypt-false, which is using `encrypt_passwords: false`
              # hence verifying the type 7 password is not encrypted
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha512
                  key: g73J3pK8WsFSHE+mvk4W8A==
          # Test inheriting authentication from VRF, the VRF keys are ALWAYS encrypted no matter the value
          - interfaces: [Ethernet4]
            ip_addresses: [10.10.20.20/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "Inheriting auth from VRF, encrypt_passwords: false"
            ospf:
              enabled: true
              cost: 100
              point_to_point: true
      - name: Tenant_OSPF_NO_VRF_LEVEL_ENCRYPTION
        vrf_vni: 102
        vrf_id: 44
        ospf:
          enabled: true
          # The VRF is configured without any OSPF encryption method
        svis:
          # test ospf authentication inherited from VRF vlan interface
          # Expect NO authentication
          - id: 222
            name: Tenant_OSPF_222
            tags: [ospf-encryption-password-encrypt-false]
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
        l3_interfaces:
          - interfaces: [Ethernet5]
            ip_addresses: [10.10.70.70/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "Overwriting auth from VRF, encrypt_passwords: false"
            ospf:
              enabled: true
              cost: 100
              authentication: message-digest
              point_to_point: true
              # overwriting keys from VRF on ospf-encryption-password-encrypt-false, which is using `encrypt_passwords: false`
              # hence verifying the type 7 password is not encrypted
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha384
                  key: HETNWQ4hixKxgZv7UHHb9w==
          - interfaces: [Ethernet6]
            ip_addresses: [10.10.20.20/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "Inheriting no auth from VRF, encrypt_passwords: false"
            ospf:
              enabled: true
              cost: 100
              point_to_point: true
