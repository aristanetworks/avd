type: l3leaf

evpn_overlay_bgp_rtc: true

l3leaf:
  defaults:
    loopback_ipv4_pool: 169.254.102.0/24
    vtep_loopback_ipv4_pool: 169.253.103.0/24
    virtual_router_mac_address: 00:1c:73:00:00:99
    bgp_as: 65233
  nodes:
    - name: evpn_gateway_l2_evpn_role_server
      id: 1
      platform: vEOS
      mlag: false
      mgmt_ip: 192.168.0.205/24
      evpn_role: server
      evpn_gateway:
        evpn_l2:
          enabled: true

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF10
        vrf_vni: 10
        svis:
          - id: 11
            name: VRF10_VLAN11
            enabled: true
            ip_address_virtual: 10.10.11.1/24
          - id: 12
            name: VRF10_VLAN12
            enabled: true
            ip_address_virtual: 10.10.12.1/24
