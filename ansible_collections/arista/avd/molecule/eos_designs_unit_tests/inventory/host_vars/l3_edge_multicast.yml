---
underlay_routing_protocol: ospf
underlay_ospf_graceful_restart: true

underlay_multicast_pim_sm: true
underlay_multicast_static: true

type: spine
spine:
  nodes:
    - name: l3_edge_multicast
      id: 1
      evpn_role: "none"
      loopback_ipv4_pool: 1.2.3.4/24
      bgp_as: 65000

l3_edge:
  p2p_links_profiles:
    - name: profile1
      ip_pool: pool1
      speed: "forced 10000full"
      mtu: 2000
      bfd: true
      ptp:
        enabled: true
      qos_profile: TEST-QOS-PROFILE
      macsec_profile: TEST-MACSEC-PROFILE

  p2p_links_ip_pools:
    - name: pool1
      ipv4_pool: 192.168.0.0/24

  p2p_links:
    - nodes: [l3_edge_multicast, peer1]
      description: P2P link, included in underlay protocol, PIM SM disabled.
      interfaces: [ethernet1, ethernet1]
      ip: [192.168.0.4/31, 192.168.0.5/31]
      include_in_underlay_protocol: true
      underlay_multicast_pim_sm: false
      # added to not pollute the test
      underlay_multicast_static: false
    - nodes: [l3_edge_multicast, peer2]
      description: P2P link, included in underlay protocol, PIM SM enabled.
      interfaces: [ethernet2, ethernet2]
      ip: [192.168.0.2/31, 192.168.0.3/31]
      include_in_underlay_protocol: true
      # underlay_multicast_pim_sm: true => should be default but can't because of current implementation
      # added to not pollute the test
      underlay_multicast_static: false
    - nodes: [l3_edge_multicast, peer3]
      description: P2P link, NOT included in underlay protocol, PIM SM enabled.
      interfaces: [ethernet3, ethernet3]
      ip: [192.168.0.4/31, 192.168.0.5/31]
      include_in_underlay_protocol: false
      underlay_multicast_pim_sm: true
      # added to not pollute the test
      underlay_multicast_static: false
    - nodes: [l3_edge_multicast, peer4]
      description: P2P link, included in underlay protocol, static multicast disabled.
      interfaces: [ethernet4, ethernet4]
      ip: [192.168.0.4/31, 192.168.0.5/31]
      include_in_underlay_protocol: true
      underlay_multicast_static: false
      # added to not pollute the test
      underlay_multicast_pim_sm: false
    - nodes: [l3_edge_multicast, peer5]
      description: P2P link, included in underlay protocol, static multicast enabled.
      interfaces: [ethernet2, ethernet2]
      ip: [192.168.0.2/31, 192.168.0.3/31]
      include_in_underlay_protocol: true
      # underlay_multicast_static: true => should be default but can't because of current implementation
      # added to not pollute the test
      underlay_multicast_pim_sm: false
    - nodes: [l3_edge_multicast, peer6]
      description: P2P link, NOT included in underlay protocol, static multicast enabled.
      interfaces: [ethernet6, ethernet6]
      ip: [192.168.0.4/31, 192.168.0.5/31]
      include_in_underlay_protocol: false
      underlay_multicast_static: true
      # added to not pollute the test
      underlay_multicast_pim_sm: false
