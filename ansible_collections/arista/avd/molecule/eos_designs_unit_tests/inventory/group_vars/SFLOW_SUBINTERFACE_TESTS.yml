---
type: spine

# Test to not render any sflow configuration on subinterfaces
platform_settings:
  - platforms: [vEOS-LAB]
    feature_support:
      sflow_subinterfaces: false

spine:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 10.255.0.0/27
    bgp_as: 65200

  nodes:
    - name: sflow-subinterface-tests-spine1
      id: 1
      mgmt_ip: 192.168.0.111/24

    - name: sflow-subinterface-tests-spine2
      id: 2
      mgmt_ip: 192.168.0.211/24
