---
type: l3leaf

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.66.0/24
    vtep_loopback_ipv4_pool: 192.168.142.0/24
    virtual_router_mac_address: 00:11:22:33:44:55
    bgp_as: 666
  nodes:
    - name: ospf-encryption-password-encrypt-true
      id: 42
      mgmt_ip: 192.168.42.42/24
    - name: ospf-encryption-password-encrypt-false
      id: 43
      mgmt_ip: 192.168.42.43/24

tenants:
  - name: Tenant_OSPF
    # Tenant used to test OSPF encryption.
    mac_vrf_vni_base: 10000
    mac_vrf_id_base: 20000
    redistribute_mlag_ibgp_peering_vrfs: true
    vrfs:
      - name: Tenant_OSPF_VRF_LEVEL_SIMPLE_ENCRYPTION
        vrf_vni: 100
        vrf_id: 42
        ospf:
          enabled: true
          router_id: 10.10.10.10
          authentication: simple
          simple_auth_key: password
          nodes:
            [
              ospf-encryption-password-encrypt-false,
              ospf-encryption-password-encrypt-true,
            ]
        svis:
          # SVI as string
          # test ospf authentication on vlan interface overwriting authentication from VRF.
          - id: 201
            name: Tenant_OSPF_201
            tags: [ospf-encryption-password-encrypt-true]
            enabled: true
            ospf:
              enabled: true
              area: 0.0.0.0
              authentication: message-digest
              point_to_point: true
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: arista
                - id: 2
                  key: arista
          # test ospf authentication inherited from VRF vlan interface
          - id: 202
            name: Tenant_OSPF_202
            tags:
              [
                ospf-encryption-password-encrypt-true,
                ospf-encryption-password-encrypt-false,
              ]
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
          # test ospf authentication at SVI level being encrypted by AVD on ospf-encryption-password-encrypt-true
          - id: 203
            name: Tenant_OSPF_203
            tags: [ospf-encryption-password-encrypt-false]
            nodes:
              - node: ospf-encryption-password-encrypt-true
              - node: ospf-encryption-password-encrypt-false
                # ospf-encryption-password-encrypt-false uses `encrypt_password: false`
                ospf:
                  message_digest_keys:
                    - id: 2
                      key: cWuRi5NDH6EVzs1zPgGzYw==
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
              # overwriting keys from VRF
              authentication: message-digest
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: arista
                - id: 2
                  # Testing eos_designs encryption at interface level on some device using `encrypt_passwords: true`
                  key: ClearText
          - id: 204
            name: Tenant_OSPF_204
            tags:
              [
                ospf-encryption-password-encrypt-false,
                ospf-encryption-password-encrypt-true,
              ]
            enabled: true
            ip_address_virtual: 10.1.40.1/24
            ospf:
              enabled: true
              area: 1
              cost: 100
              authentication: simple
              simple_auth_key: "AQQvKeimxJu+uGQ/yYvv9w=="
            nodes:
              - node: ospf-encryption-password-encrypt-true
                ospf:
                  enabled: true
                  area: 1
                  cost: 100
                  authentication: simple
                  simple_auth_key: arista
        l3_interfaces:
          - interfaces: [Ethernet1]
            ip_addresses: [10.10.10.10/24]
            nodes: [ospf-encryption-password-encrypt-true]
            mtu: 9000
            enabled: true
            description: "test"
            ospf:
              enabled: true
              cost: 100
              authentication: message-digest
              point_to_point: true
              # overwriting keys from VRF
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: arista
                - id: 2
                  # Testing eos_designs encryption at interface level on some device using `encrypt_passwords: true`
                  key: ClearText
          - interfaces: [Ethernet1]
            ip_addresses: [10.10.20.20/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "test"
            # Inheriting authentication from VRF
            ospf:
              enabled: true
              cost: 100
              point_to_point: true
          - interfaces: [Ethernet2]
            ip_addresses: [10.10.70.70/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "test"
            ospf:
              enabled: true
              cost: 100
              authentication: message-digest
              point_to_point: true
              # overwriting keys from VRF on ospf-encryption-password-encrypt-false, which is using `encrypt_passwords: false`
              # hence verifying the type 7 password is not encrypted
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: qKh1ui6D2mKd2SnK6uhhlw==
      - name: Tenant_OSPF_VRF_LEVEL_MESSAGE_DIGEST_ENCRYPTION
        vrf_vni: 101
        vrf_id: 43
        ospf:
          enabled: true
          router_id: 10.10.10.10
          authentication: message-digest
          message_digest_keys:
            - id: 1
              hash_algorithm: sha256
              key: arista
          nodes:
            [
              ospf-encryption-password-encrypt-false,
              ospf-encryption-password-encrypt-true,
            ]
        svis:
          # test ospf authentication on vlan interface overwriting authentication from VRF.
          # we expect 2 keys
          - id: 211
            name: Tenant_OSPF_211
            tags: [ospf-encryption-password-encrypt-true]
            enabled: true
            ospf:
              enabled: true
              area: 0.0.0.0
              authentication: message-digest
              point_to_point: true
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: arista
                - id: 2
                  key: arista2
          # test ospf authentication inherited from VRF vlan interface
          - id: 212
            name: Tenant_OSPF_212
            tags:
              [
                ospf-encryption-password-encrypt-true,
                ospf-encryption-password-encrypt-false,
              ]
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
          # test ospf authentication at SVI level being encrypted by AVD on ospf-encryption-password-encrypt-true
          - id: 213
            name: Tenant_OSPF_213
            tags: [ospf-encryption-password-encrypt-false]
            nodes:
              - node: ospf-encryption-password-encrypt-true
              - node: ospf-encryption-password-encrypt-false
                # ospf-encryption-password-encrypt-false uses `encrypt_password: false`
                ospf:
                  message_digest_keys:
                    - id: 2
                      key: cWuRi5NDH6EVzs1zPgGzYw==
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
              # overwriting keys from VRF
              authentication: message-digest
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: arista
                - id: 2
                  # Testing eos_designs encryption at interface level on some device using `encrypt_passwords: true`
                  key: ClearText
          - id: 214
            name: Tenant_OSPF_214
            tags:
              [
                ospf-encryption-password-encrypt-false,
                ospf-encryption-password-encrypt-true,
              ]
            enabled: true
            ip_address_virtual: 10.1.40.1/24
            ospf:
              enabled: true
              area: 1
              cost: 100
              authentication: simple
              simple_auth_key: "AQQvKeimxJu+uGQ/yYvv9w=="
            nodes:
              - node: ospf-encryption-password-encrypt-true
                ospf:
                  enabled: true
                  area: 1
                  cost: 100
                  authentication: simple
                  simple_auth_key: arista
        l3_interfaces:
          - interfaces: [Ethernet3]
            ip_addresses: [10.10.10.10/24]
            nodes: [ospf-encryption-password-encrypt-true]
            mtu: 9000
            enabled: true
            description: "test"
            ospf:
              enabled: true
              cost: 100
              authentication: message-digest
              point_to_point: true
              # overwriting keys from VRF
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: arista
                - id: 2
                  # Testing eos_designs encryption at interface level on some device using `encrypt_passwords: true`
                  key: ClearText
          - interfaces: [Ethernet3]
            ip_addresses: [10.10.20.20/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "test"
            # Inheriting authentication from VRF
            ospf:
              enabled: true
              cost: 100
              point_to_point: true
          - interfaces: [Ethernet4]
            ip_addresses: [10.10.70.70/24]
            nodes: [ospf-encryption-password-encrypt-false]
            mtu: 9000
            enabled: true
            description: "test"
            ospf:
              enabled: true
              cost: 100
              authentication: message-digest
              point_to_point: true
              # overwriting keys from VRF on ospf-encryption-password-encrypt-false, which is using `encrypt_passwords: false`
              # hence verifying the type 7 password is not encrypted
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: qKh1ui6D2mKd2SnK6uhhlw==
      - name: Tenant_OSPF_NO_VRF_LEVEL_ENCRYPTION
        vrf_vni: 102
        vrf_id: 44
        ospf:
          enabled: true
        svis:
          # SVI as string
          # test ospf authentication on vlan interface overwriting authentication from VRF.
          - id: 221
            name: Tenant_OSPF_221
            tags: [ospf-encryption-password-encrypt-true]
            enabled: true
            ospf:
              enabled: true
              area: 0.0.0.0
              authentication: message-digest
              point_to_point: true
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: arista
                - id: 2
                  key: arista2
          # test ospf authentication not inherited from VRF vlan interface
          - id: 222
            name: Tenant_OSPF_222
            tags:
              [
                ospf-encryption-password-encrypt-true,
                ospf-encryption-password-encrypt-false,
              ]
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
          # test ospf authentication at SVI level being encrypted by AVD on ospf-encryption-password-encrypt-true
          - id: 223
            name: Tenant_OSPF_223
            tags: [ospf-encryption-password-encrypt-false]
            nodes:
              - node: ospf-encryption-password-encrypt-true
              - node: ospf-encryption-password-encrypt-false
                # ospf-encryption-password-encrypt-false uses `encrypt_password: false`
                ospf:
                  message_digest_keys:
                    - id: 2
                      key: cWuRi5NDH6EVzs1zPgGzYw==
            enabled: true
            ospf:
              enabled: true
              point_to_point: true
              # overwriting keys from VRF
              authentication: message-digest
              message_digest_keys:
                - id: 1
                  hash_algorithm: sha1
                  key: arista
                - id: 2
                  # Testing eos_designs encryption at interface level on some device using `encrypt_passwords: true`
                  key: ClearText
          - id: 224
            name: Tenant_OSPF_224
            tags:
              [
                ospf-encryption-password-encrypt-false,
                ospf-encryption-password-encrypt-true,
              ]
            enabled: true
            ip_address_virtual: 10.1.40.1/24
            ospf:
              enabled: true
              area: 1
              cost: 100
              authentication: simple
              simple_auth_key: "AQQvKeimxJu+uGQ/yYvv9w=="
            nodes:
              - node: ospf-encryption-password-encrypt-true
                ospf:
                  enabled: true
                  area: 1
                  cost: 100
                  authentication: simple
                  simple_auth_key: arista
        l3_interfaces:
          - interfaces: [Ethernet5]
            ip_addresses: [10.10.10.10/24]
            nodes: [ospf-encryption-password-encrypt-true]
            mtu: 9000
            enabled: true
