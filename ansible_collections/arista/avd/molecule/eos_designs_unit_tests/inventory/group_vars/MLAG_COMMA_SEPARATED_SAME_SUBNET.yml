---
fabric_ip_addressing:
  mlag:
    algorithm: "same_subnet"
    ipv4_prefix_length: 30
type: l3leaf

l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_interfaces: [ Ethernet3, Ethernet4 ]
    uplink_ipv4_pool: 172.31.255.0/24
    uplink_interfaces: [Ethernet11]
    uplink_switches: [MLAG_SAME_SUBNET_L3LEAF1A]
  node_groups:
    - group: MLAG_COMMA_SEPARATED_SAME_SUBNET_L3LEAF1
      bgp_as: 65101
      nodes:
        - name: MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1A
          id: 1
          mgmt_ip: 192.168.200.101/24
          uplink_switch_interfaces: [Ethernet1]
        - name: MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1B
          id: 2
          mgmt_ip: 192.168.200.102/24
          uplink_switch_interfaces: [Ethernet2]

tenants:
  - name: MLAG_COMMA_SEPARATED_SAME_SUBNET_TENANT
    mac_vrf_vni_base: 11000
    vrfs:
      - name: TEST_VRF
        vrf_id: 1
        mlag_ibgp_peering_ipv4_pool: 10.255.240.0/24, 10.255.241.0/24
        svis:
          # SVI as string
          - id: 110
            name: Tenant_A_OP_Zone_1
            tags: ['opzone']
            enabled: true
            ip_address_virtual: 10.1.10.1/24
