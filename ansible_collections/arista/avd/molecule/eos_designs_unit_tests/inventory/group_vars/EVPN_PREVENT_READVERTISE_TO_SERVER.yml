---
type: l3leaf
mgmt_gateway: 192.168.0.1
overlay_routing_protocol: ebgp
bgp_as: 65001
evpn_prevent_readvertise_to_server: true
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    mlag_peer_l3_vlan: 4094
    mlag_peer_ipv4_pool: 192.168.253.0/24
    mlag_interfaces: [ Ethernet3 ]
  node_groups:
    - group: mlag
      nodes:
        - name: evpn-prevent-readvertise-to-server-1
          id: 103
          bgp_as: 103
          evpn_route_servers: [ evpn-prevent-readvertise-to-server-2]
          mpls_route_reflectors: [ evpn-prevent-readvertise-to-server-2]
          mpls_overlay_role: client
          evpn_gateway:
            evpn_l3:
              enabled: true
        - name: evpn-prevent-readvertise-to-server-2
          id: 104
          bgp_as: 104
          evpn_role: server
          mpls_overlay_role: server
