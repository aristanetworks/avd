!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname UPLINK_P2P_VRFS_RFC5549_TESTS_L2LEAF1
!
vlan 150
   name Tenant_A_WAN_Zone_1
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1
   description L2_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAFS_Port-Channel51
   no shutdown
   switchport trunk allowed vlan 150
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF1_Ethernet51
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF2_Ethernet52
   no shutdown
   channel-group 1 mode active
no ip routing vrf MGMT
!
end
