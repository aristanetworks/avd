!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF
!
vlan 66
   name TEST-L2VLAN-ATTRACTION
!
vrf instance IT
!
vrf instance MGMT
!
vrf instance ONLY-ON-L2LEAF
!
vrf instance PROD
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_UPLINK_P2P_VRFS_TESTS_SPINE1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.42.42.29/31
   mac security profile TEST
!
interface Ethernet1.42
   description P2P_UPLINK_P2P_VRFS_TESTS_SPINE1_Ethernet3.42_VRF_PROD
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 42
   vrf PROD
   ip address 10.42.42.29/31
!
interface Ethernet1.66
   description P2P_UPLINK_P2P_VRFS_TESTS_SPINE1_Ethernet3.66_VRF_ONLY-ON-L2LEAF
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 66
   vrf ONLY-ON-L2LEAF
   ip address 10.42.42.29/31
!
interface Ethernet2
   description P2P_UPLINK_P2P_VRFS_TESTS_SPINE2_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.42.42.31/31
   mac security profile TEST
!
interface Ethernet2.42
   description P2P_UPLINK_P2P_VRFS_TESTS_SPINE2_Ethernet4.42_VRF_PROD
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 42
   vrf PROD
   ip address 10.42.42.31/31
!
interface Ethernet2.100
   description P2P_UPLINK_P2P_VRFS_TESTS_SPINE2_Ethernet4.100_VRF_IT
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 100
   vrf IT
   ip address 10.42.42.31/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.42.8/32
!
interface Vlan66
   description TEST-L2VLAN-ATTRACTION
   no shutdown
   vrf ONLY-ON-L2LEAF
   ip address virtual 172.16.0.1/24
!
ip virtual-router mac-address cafe:cafe:cafe
!
ip routing
ip routing vrf IT
no ip routing vrf MGMT
ip routing vrf ONLY-ON-L2LEAF
ip routing vrf PROD
!
router bgp 65000
   router-id 192.168.42.8
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.42.42.28 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.42.42.28 remote-as 65000
   neighbor 10.42.42.28 description UPLINK_P2P_VRFS_TESTS_SPINE1_Ethernet3
   neighbor 10.42.42.30 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.42.42.30 remote-as 65000
   neighbor 10.42.42.30 description UPLINK_P2P_VRFS_TESTS_SPINE2_Ethernet4
   redistribute connected
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf IT
      router-id 192.168.42.8
      neighbor 10.42.42.30 peer group IPv4-UNDERLAY-PEERS
      neighbor 10.42.42.30 remote-as 65000
      neighbor 10.42.42.30 description UPLINK_P2P_VRFS_TESTS_SPINE2_Ethernet4.100_vrf_IT
      redistribute connected
   !
   vrf ONLY-ON-L2LEAF
      router-id 192.168.42.8
      neighbor 10.42.42.28 peer group IPv4-UNDERLAY-PEERS
      neighbor 10.42.42.28 remote-as 65000
      neighbor 10.42.42.28 description UPLINK_P2P_VRFS_TESTS_SPINE1_Ethernet3.66_vrf_ONLY-ON-L2LEAF
      redistribute connected
   !
   vrf PROD
      router-id 192.168.42.8
      neighbor 10.42.42.28 peer group IPv4-UNDERLAY-PEERS
      neighbor 10.42.42.28 remote-as 65000
      neighbor 10.42.42.28 description UPLINK_P2P_VRFS_TESTS_SPINE1_Ethernet3.42_vrf_PROD
      neighbor 10.42.42.30 peer group IPv4-UNDERLAY-PEERS
      neighbor 10.42.42.30 remote-as 65000
      neighbor 10.42.42.30 description UPLINK_P2P_VRFS_TESTS_SPINE2_Ethernet4.42_vrf_PROD
      redistribute connected
!
end
