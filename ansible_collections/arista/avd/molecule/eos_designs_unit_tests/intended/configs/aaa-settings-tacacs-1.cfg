!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname aaa-settings-tacacs-1
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
tacacs-server host 10.10.10.1
tacacs-server host 10.10.10.1 single-connection vrf MGMT timeout 100 key 0 password
tacacs-server host 10.10.10.2 vrf MGMT
tacacs-server host 10.10.10.2 vrf other_vrf
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
no ip routing vrf MGMT
!
ip tacacs vrf MGMT source-interface Management1
!
end
