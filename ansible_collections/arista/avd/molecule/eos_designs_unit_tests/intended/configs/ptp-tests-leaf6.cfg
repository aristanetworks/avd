!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
no ip igmp snooping
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ptp-tests-leaf6
!
spanning-tree mode mstp
spanning-tree mst pvst border
spanning-tree mst 0 priority 4096
!
vlan 11
   name VLAN11
!
vrf instance MGMT
!
vrf instance VRF1
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel16
   description L2_ptp-tests-l2leaf6-ptp-enabled_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 11
   switchport mode trunk
   switchport
   ptp enable
!
interface Ethernet1
   description P2P_ptp-tests-spine1_Ethernet7
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.2.21/31
!
interface Ethernet2
   description P2P_ptp-tests-spine1_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.2.23/31
!
interface Ethernet16
   description L2_ptp-tests-l2leaf6-ptp-enabled_Ethernet1
   no shutdown
   channel-group 16 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.254.1.6/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.254.11.6/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.103/24
!
interface Vlan11
   description VLAN11
   no shutdown
   vrf VRF1
!
interface Vxlan1
   description ptp-tests-leaf6_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 11 vni 10011
   vxlan vrf VRF1 vni 1
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF1
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.254.1.0/27 eq 32
   seq 20 permit 10.254.11.0/27 eq 32
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65103
   router-id 10.254.1.6
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.254.2.20 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.2.20 remote-as 65200
   neighbor 10.254.2.20 description ptp-tests-spine1_Ethernet7
   neighbor 10.254.2.22 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.2.22 remote-as 65200
   neighbor 10.254.2.22 description ptp-tests-spine1_Ethernet8
   neighbor 10.255.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.1 remote-as 65200
   neighbor 10.255.0.1 description ptp-tests-spine1_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 11
      rd 10.254.1.6:10011
      route-target both 10011:10011
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf VRF1
      rd 10.254.1.6:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      router-id 10.254.1.6
      redistribute connected
!
end
