!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR1_LEAFS_LEAF1B
!
no spanning-tree vlan-id 4094
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel51
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_Port-Channel1
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 51
!
interface Port-Channel53
   description MLAG_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR1_LEAFS_LEAF1A_Port-Channel53
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet51
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_SPINE2_Ethernet1
   no shutdown
   channel-group 51 mode active
!
interface Ethernet53
   description MLAG_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR1_LEAFS_LEAF1A_Ethernet53
   no shutdown
   channel-group 53 mode active
!
interface Ethernet54
   description MLAG_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR1_LEAFS_LEAF1A_Ethernet54
   no shutdown
   channel-group 53 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.100.102/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 192.168.0.1/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR1_LEAFS
   local-interface Vlan4094
   peer-address 192.168.0.0
   peer-link Port-Channel53
   reload-delay mlag 300
   reload-delay non-mlag 330
!
end
