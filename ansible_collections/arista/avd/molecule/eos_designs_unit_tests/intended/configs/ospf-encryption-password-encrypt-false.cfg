!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ospf-encryption-password-encrypt-false
!
vlan 201
   name Tenant_OSPF_201
!
vlan 202
   name Tenant_OSPF_202
!
vlan 203
   name Tenant_OSPF_203
!
vlan 204
   name Tenant_OSPF_204
!
vrf instance MGMT
!
vrf instance Tenant_OSPF_VRF
   description Tenant_OSPF_encryption
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet14
   description test
   no shutdown
   mtu 9000
   no switchport
   vrf Tenant_OSPF_VRF
   ip address 10.10.20.20/24
   ip ospf cost 100
   ip ospf network point-to-point
   ip ospf authentication
   ip ospf authentication-key 7 DDirwLnK/qHtkPYz4yyzNQ==
   ip ospf area 0.0.0.0
!
interface Ethernet15
   description test
   no shutdown
   mtu 9000
   no switchport
   vrf Tenant_OSPF_VRF
   ip address 10.10.70.70/24
   ip ospf cost 100
   ip ospf network point-to-point
   ip ospf authentication message-digest
   ip ospf area 0.0.0.0
   ip ospf message-digest-key 1 sha1 7 qKh1ui6D2mKd2SnK6uhhlw==
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.66.43/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.142.43/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.42.43/24
!
interface Vlan201
   description Tenant_OSPF_201
   no shutdown
   vrf Tenant_OSPF_VRF
   ip ospf network point-to-point
   ip ospf authentication message-digest
   ip ospf area 0.0.0.0
   ip ospf message-digest-key 1 sha1 7 AQQvKeimxJu+uGQ/yYvv9w==
   ip ospf message-digest-key 2 sha512 7 AQQvKeimxJu+uGQ/yYvv9w==
!
interface Vlan202
   description Tenant_OSPF_202
   no shutdown
   vrf Tenant_OSPF_VRF
   ip ospf network point-to-point
   ip ospf authentication
   ip ospf authentication-key 7 SphQt8480K3DbPx81kMUOg==
   ip ospf area 0.0.0.0
!
interface Vlan203
   description Tenant_OSPF_203
   no shutdown
   vrf Tenant_OSPF_VRF
   ip ospf network point-to-point
   ip ospf authentication message-digest
   ip ospf area 0.0.0.0
   ip ospf message-digest-key 2 sha512 7 cWuRi5NDH6EVzs1zPgGzYw==
!
interface Vlan204
   description Tenant_OSPF_204
   no shutdown
   vrf Tenant_OSPF_VRF
   ip ospf cost 100
   ip ospf authentication
   ip ospf authentication-key 7 AQQvKeimxJu+uGQ/yYvv9w==
   ip ospf area 1
   ip address virtual 10.1.40.1/24
!
interface Vxlan1
   description ospf-encryption-password-encrypt-false_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 201 vni 10201
   vxlan vlan 202 vni 10202
   vxlan vlan 203 vni 10203
   vxlan vlan 204 vni 10204
   vxlan vrf Tenant_OSPF_VRF vni 100
!
ip virtual-router mac-address 00:11:22:33:44:55
!
ip routing
no ip routing vrf MGMT
ip routing vrf Tenant_OSPF_VRF
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.66.0/24 eq 32
   seq 20 permit 192.168.142.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 666
   router-id 192.168.66.43
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 201
      rd 192.168.66.43:20201
      route-target both 20201:20201
      redistribute learned
   !
   vlan 202
      rd 192.168.66.43:20202
      route-target both 20202:20202
      redistribute learned
   !
   vlan 203
      rd 192.168.66.43:20203
      route-target both 20203:20203
      redistribute learned
   !
   vlan 204
      rd 192.168.66.43:20204
      route-target both 20204:20204
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf Tenant_OSPF_VRF
      rd 192.168.66.43:42
      route-target import evpn 42:42
      route-target export evpn 42:42
      router-id 192.168.66.43
      redistribute connected
      redistribute ospf
!
router ospf 42 vrf Tenant_OSPF_VRF
   router-id 10.10.10.10
   passive-interface default
   no passive-interface Ethernet14
   no passive-interface Ethernet15
   no passive-interface Vlan201
   no passive-interface Vlan202
   no passive-interface Vlan203
   no passive-interface Vlan204
   redistribute bgp
!
end
