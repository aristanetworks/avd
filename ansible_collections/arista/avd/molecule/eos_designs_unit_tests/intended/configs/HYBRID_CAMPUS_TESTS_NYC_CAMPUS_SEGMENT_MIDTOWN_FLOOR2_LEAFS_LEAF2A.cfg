!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR2_LEAFS_LEAF2A
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel11
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_Port-Channel491
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Ethernet1/1
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_SPINE1_Ethernet49/1
   no shutdown
   channel-group 11 mode active
!
interface Ethernet1/3
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_SPINE2_Ethernet49/1
   no shutdown
   channel-group 11 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.100.103/24
no ip routing vrf MGMT
!
end
