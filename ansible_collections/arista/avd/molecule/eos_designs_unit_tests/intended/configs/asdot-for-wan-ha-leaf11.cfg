!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname asdot-for-wan-ha-leaf11
!
vlan 100
   name VLAN100
!
vrf instance MGMT
!
vrf instance PROD
!
interface Ethernet1
   description P2P_asdot-for-wan-ha-transit1A1_Ethernet52
   no shutdown
   mtu 9214
   no switchport
   ip address 172.17.0.0/31
!
interface Ethernet1.142
   description P2P_asdot-for-wan-ha-transit1A1_Ethernet52.142_VRF_PROD
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 142
   vrf PROD
   ip address 172.17.0.0/31
!
interface Ethernet2
   description P2P_asdot-for-wan-ha-transit1B1_Ethernet52
   no shutdown
   mtu 9214
   no switchport
   ip address 172.17.0.2/31
!
interface Ethernet2.142
   description P2P_asdot-for-wan-ha-transit1B1_Ethernet52.142_VRF_PROD
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 142
   vrf PROD
   ip address 172.17.0.2/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.45.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.255.1/32
!
interface Vlan100
   description VLAN100
   shutdown
   vrf PROD
   ip address virtual 10.0.100.1/24
!
interface Vxlan1
   description asdot-for-wan-ha-leaf11_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 1100
   vxlan vrf default vni 1
   vxlan vrf PROD vni 142
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf PROD
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.45.0/24 eq 32
   seq 20 permit 192.168.255.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65199
   router-id 192.168.45.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 172.17.0.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.17.0.1 remote-as 65000.1
   neighbor 172.17.0.1 description asdot-for-wan-ha-transit1A1_Ethernet52
   neighbor 172.17.0.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.17.0.3 remote-as 65000.1
   neighbor 172.17.0.3 description asdot-for-wan-ha-transit1B1_Ethernet52
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 192.168.45.1:1100
      route-target both 1100:1100
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf default
      rd 192.168.45.1:1
      route-target import evpn 1:1
      route-target export evpn 1:1
   !
   vrf PROD
      rd 192.168.45.1:142
      route-target import evpn 142:142
      route-target export evpn 142:142
      router-id 192.168.45.1
      neighbor 172.17.0.1 peer group IPv4-UNDERLAY-PEERS
      neighbor 172.17.0.1 remote-as 65000.1
      neighbor 172.17.0.1 description asdot-for-wan-ha-transit1A1_Ethernet52.142_vrf_PROD
      neighbor 172.17.0.3 peer group IPv4-UNDERLAY-PEERS
      neighbor 172.17.0.3 remote-as 65000.1
      neighbor 172.17.0.3 description asdot-for-wan-ha-transit1B1_Ethernet52.142_vrf_PROD
      redistribute connected
!
end
