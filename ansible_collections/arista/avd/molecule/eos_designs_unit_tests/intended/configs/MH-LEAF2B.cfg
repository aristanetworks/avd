username cvpadmin ssh-key ssh-rsa AAAAB3NzaC1yc2EAA82spi2mkxp4FgaLi4CjWkpnL1A/MD7WhrSNgqXToF7QCb9Lidagy9IHafQxfu7LwkFdyQIMu8XNwDZIycuf29wHbDdz1N+YNVK8zwyNAbMOeKMqblsEm2YIorgjzQX1m9+/rJeFBKz77PSgeMp/Rc3txFVuSmFmeTy3aMkU= cvpadmin@hostmachine.local
username cvpadmin ssh-key secondary ssh-rsa AAAAB3NzaC1yc2EAA82spi2mkxp4FgaLi4CjWkpnL1A/MD7WhrSNgqXToF7QCb9Lidagy9IHafQxfu7LwkFdyQIMu8XNwDZIycuf29wHbDdz1N+YNVK8zwyNAbMOeKMqblsEm2YIorgjzQX1m9+/rJeFBKz77PSgeMp/Rc3txFVuSmFmeTy3aMkz= cvpadmin@hostmachine.local
!
agent KernelFib environment KERNELFIB_PROGRAM_ALL_ECMP=1
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.200.11:9910 -cvauth=key,telarista -cvvrf=MGMT -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
flow tracking hardware
   tracker FLOW-TRACKER
      record export on inactive timeout 70000
      record export on interval 300000
      exporter CV-TELEMETRY
         collector 127.0.0.1
         local interface Loopback0
         template interval 3600000
   no shutdown
!
service routing protocols model multi-agent
!
lacp port-id range 257 768
!
link tracking group Eth-conn-to-router
   recovery delay 520
!
hostname MH-LEAF2B
ip name-server vrf MGMT 8.8.8.8
ip name-server vrf MGMT 192.168.200.5
ip name-server vrf MGMT 2001:db8::1
ip name-server vrf MGMT 2001:db8::2
!
router path-selection
   peer dynamic source stun
   tcp mss ceiling ipv4 ingress
   !
   path-group INET id 101
      ipsec profile AUTOVPN
      !
      local interface Ethernet1
   !
   path-group MPLS id 100
   !
   load-balance policy LB-DEFAULT-POLICY-CONTROL-PLANE
      path-group MPLS
      path-group INET priority 42
   !
   load-balance policy LB-DEFAULT-POLICY-DEFAULT
      path-group MPLS
      path-group INET priority 42
   !
   policy DEFAULT-POLICY-WITH-CP
      default-match
         load-balance LB-DEFAULT-POLICY-DEFAULT
      !
      10 application-profile APP-PROFILE-CONTROL-PLANE
         load-balance LB-DEFAULT-POLICY-CONTROL-PLANE
   !
   vrf default
      path-selection-policy DEFAULT-POLICY-WITH-CP
!
platform sfe data-plane cpu allocation maximum 1
!
snmp-server contact example@example.com
snmp-server location EOS_DESIGNS_UNIT_TESTS MH-LEAF2B
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no default-services
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management security
   !
   ssl profile STUN-DTLS
      tls versions 1.2
      trust certificate aristaDeviceCertProvisionerDefaultRootCA.crt
      certificate STUN-DTLS.crt key STUN-DTLS.key
!
ip security
   ike policy AUTOVPN-IKE
      local-id 192.168.254.35
   !
   sa policy AUTOVPN-SA
   !
   profile AUTOVPN
      ike-policy AUTOVPN-IKE
      sa-policy AUTOVPN-SA
      connection start
      shared-key 7 ABCDEF1234567890
      dpd 10 50 clear
      mode transport
!
interface Dps1
   description DPS Interface
   mtu 9194
   flow tracker hardware FLOW-TRACKER
   ip address 192.168.254.35/32
!
interface Ethernet1
   description Comcast
   no shutdown
   no switchport
   ip address 10.1.1.1/24
!
interface Ethernet11
   description P2P_LINK_TO_DC1-SPINE1_Ethernet13
   no shutdown
   mtu 1500
   no switchport
   ip address 10.10.102.5/31
   link tracking group Eth-conn-to-router upstream
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.250.35/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.106/24
!
interface Vxlan1
   description MH-LEAF2B_VTEP
   vxlan source-interface Dps1
   vxlan udp-port 4789
   vxlan vrf default vni 1
!
application traffic recognition
   !
   application ipv4 APP-CONTROL-PLANE
      source prefix field-set PFX-LOCAL-VTEP-IP
   !
   application-profile APP-PROFILE-CONTROL-PLANE
      application APP-CONTROL-PLANE
   !
   field-set ipv4 prefix PFX-LOCAL-VTEP-IP
      192.168.254.35/32
!
ip routing
no ip routing vrf MGMT
!
ip extcommunity-list ECL-EVPN-SOO permit soo 192.168.250.35:0
!
ip route vrf MGMT 0.0.0.0/0 192.168.200.5
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 192.168.200.5 prefer
ntp server vrf MGMT 2001:db8::3
!
route-map RM-EVPN-EXPORT-VRF-DEFAULT permit 10
   match extcommunity ECL-EVPN-SOO
!
router bfd
   multihop interval 1200 min-rx 1200 multiplier 3
!
router bgp 65153
   router-id 192.168.250.35
   update wait-install
   no bgp default ipv4-unicast
   bgp cluster-id 192.168.250.35
   maximum-paths 16
   bgp listen range 192.168.130.0/24 peer-group WAN-OVERLAY-PEERS remote-as 65153
   neighbor WAN-OVERLAY-PEERS peer group
   neighbor WAN-OVERLAY-PEERS remote-as 65153
   neighbor WAN-OVERLAY-PEERS update-source Dps1
   neighbor WAN-OVERLAY-PEERS bfd
   neighbor WAN-OVERLAY-PEERS bfd interval 1000 min-rx 1000 multiplier 10
   neighbor WAN-OVERLAY-PEERS ttl maximum-hops 1
   neighbor WAN-OVERLAY-PEERS route-reflector-client
   neighbor WAN-OVERLAY-PEERS password 7 htm4AZe9mIQOO1uiMuGgYQ==
   neighbor WAN-OVERLAY-PEERS send-community
   neighbor WAN-OVERLAY-PEERS maximum-routes 0
   redistribute connected
   !
   address-family evpn
      neighbor WAN-OVERLAY-PEERS activate
      neighbor WAN-OVERLAY-PEERS encapsulation path-selection
      next-hop resolution disabled
   !
   address-family ipv4
      no neighbor WAN-OVERLAY-PEERS activate
   !
   address-family path-selection
      bgp additional-paths receive
      bgp additional-paths send any
      neighbor WAN-OVERLAY-PEERS activate
   !
   vrf default
      rd 192.168.250.35:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      route-target export evpn route-map RM-EVPN-EXPORT-VRF-DEFAULT
!
stun
   server
      local-interface Ethernet1
      ssl profile STUN-DTLS
!
end
