!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname UPLINK_P2P_VRFS_RFC5549_TESTS_SPINE1
!
spanning-tree mode none
!
vrf instance MGMT
!
vrf instance Tenant_A_WAN_Zone
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
   mac security profile TEST
!
interface Ethernet1.14
   description P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF1_Ethernet1.14_VRF_Tenant_A_WAN_Zone
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 14
   vrf Tenant_A_WAN_Zone
   ipv6 enable
!
interface Ethernet2
   description P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF2_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
   mac security profile TEST
!
interface Ethernet2.14
   description P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF2_Ethernet1.14_VRF_Tenant_A_WAN_Zone
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 14
   vrf Tenant_A_WAN_Zone
   ipv6 enable
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.42.1/32
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
ip routing vrf Tenant_A_WAN_Zone
!
ipv6 unicast-routing
!
router bgp 65001
   router-id 192.168.42.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   redistribute connected
   neighbor interface Ethernet1 peer-group IPv4-UNDERLAY-PEERS remote-as 65106
   neighbor interface Ethernet2 peer-group IPv4-UNDERLAY-PEERS remote-as 65106
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS next-hop address-family ipv6 originate
   !
   vrf Tenant_A_WAN_Zone
      router-id 192.168.42.1
      neighbor interface Ethernet1.14 peer-group IPv4-UNDERLAY-PEERS remote-as 65106
      neighbor interface Ethernet2.14 peer-group IPv4-UNDERLAY-PEERS remote-as 65106
!
end
