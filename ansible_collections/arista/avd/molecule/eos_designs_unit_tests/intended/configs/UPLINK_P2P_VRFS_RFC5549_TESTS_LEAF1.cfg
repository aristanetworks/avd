!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF1
!
no spanning-tree vlan-id 4093-4094
!
vlan 150
   name Tenant_A_WAN_Zone_1
!
vlan 3013
   name MLAG_L3_VRF_Tenant_A_WAN_Zone
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance Tenant_A_WAN_Zone
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel5
   description MLAG_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF2_Port-Channel5
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel51
   description L2_UPLINK_P2P_VRFS_RFC5549_TESTS_L2LEAF1_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 150
   switchport mode trunk
   switchport
   mlag 51
!
interface Ethernet1
   description P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_SPINE1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
   mac security profile TEST
!
interface Ethernet1.14
   description P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_SPINE1_Ethernet1.14_VRF_Tenant_A_WAN_Zone
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 14
   vrf Tenant_A_WAN_Zone
   ipv6 enable
!
interface Ethernet2
   description P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_SPINE2_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
   mac security profile TEST
!
interface Ethernet2.14
   description P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_SPINE2_Ethernet3.14_VRF_Tenant_A_WAN_Zone
   no shutdown
   mtu 9214
   encapsulation dot1q vlan 14
   vrf Tenant_A_WAN_Zone
   ipv6 enable
!
interface Ethernet5
   description MLAG_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF2_Ethernet5
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description MLAG_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF2_Ethernet6
   no shutdown
   channel-group 5 mode active
!
interface Ethernet51
   description L2_UPLINK_P2P_VRFS_RFC5549_TESTS_L2LEAF1_Ethernet1
   no shutdown
   channel-group 51 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.42.8/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.200.106/24
!
interface Vlan150
   description Tenant_A_WAN_Zone_1
   no shutdown
   vrf Tenant_A_WAN_Zone
   ip address virtual 10.1.40.1/24
!
interface Vlan3013
   description MLAG_L3_VRF_Tenant_A_WAN_Zone
   no shutdown
   mtu 9214
   vrf Tenant_A_WAN_Zone
   ip address 10.255.251.14/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ipv6 enable
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 92.168.43.14/31
!
ip virtual-router mac-address cafe:cafe:cafe
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
ip routing vrf Tenant_A_WAN_Zone
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.251.14/31
!
ipv6 unicast-routing
!
mlag configuration
   domain-id UPLINK_P2P_VRFS_RFC5549_TESTS_LEAFS
   local-interface Vlan4094
   peer-address 92.168.43.15
   peer-link Port-Channel5
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf Tenant_A_WAN_Zone 10.3.4.0/24 1.2.3.4
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
route-map RM-Tenant_A_WAN_Zone-fd5a:fe45:8831:06c5::a-SET-NEXT-HOP-OUT permit 10
   set ipv6 next-hop fd5a:fe45:8831:06c5::1
!
router bgp 65106
   router-id 192.168.42.8
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65106
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF2
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 12000
   redistribute connected
   neighbor interface Ethernet1 peer-group IPv4-UNDERLAY-PEERS remote-as 65001
   neighbor interface Ethernet2 peer-group IPv4-UNDERLAY-PEERS remote-as 65001
   neighbor interface Vlan4093 peer-group MLAG-IPv4-UNDERLAY-PEER remote-as 65106
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS next-hop address-family ipv6 originate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
      neighbor MLAG-IPv4-UNDERLAY-PEER next-hop address-family ipv6 originate
   !
   vrf Tenant_A_WAN_Zone
      router-id 192.168.42.8
      update wait-install
      neighbor 10.255.251.15 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.251.15 description UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF2_Vlan3013
      neighbor fd5a:fe45:8831:06c5::a remote-as 12345
      neighbor fd5a:fe45:8831:06c5::a route-map RM-Tenant_A_WAN_Zone-fd5a:fe45:8831:06c5::a-SET-NEXT-HOP-OUT out
      neighbor fd5a:fe45:8831:06c5::b remote-as 12345
      redistribute connected route-map RM-CONN-2-BGP-VRFS
      redistribute static
      neighbor interface Ethernet1.14 peer-group IPv4-UNDERLAY-PEERS remote-as 65001
      neighbor interface Ethernet2.14 peer-group IPv4-UNDERLAY-PEERS remote-as 65001
      !
      address-family ipv4
         no neighbor 10.255.251.15 next-hop address-family ipv6
      !
      address-family ipv6
         neighbor fd5a:fe45:8831:06c5::a activate
         neighbor fd5a:fe45:8831:06c5::b activate
!
end
