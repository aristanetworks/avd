!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname sflow-subinterface-tests-l2-leaf1
!
vlan 11
   name VLAN11
!
vlan 4092
   name INBAND_MGMT
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1111
   description L2_sflow-tests-leaf1_Port-Channel66
   no shutdown
   switchport trunk allowed vlan 11,4092
   switchport mode trunk
   switchport
   no sflow enable
!
interface Ethernet11.11
   description L2_sflow-tests-leaf1_Ethernet6.6
   no shutdown
   channel-group 1111 mode active
!
interface Ethernet12.12
   description L2_sflow-tests-leaf2_Ethernet6.6
   no shutdown
   channel-group 1111 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.211/24
!
interface Vlan4092
   description Inband Management
   no shutdown
   mtu 1500
   ip address 10.254.254.4/24
no ip routing vrf MGMT
!
ip route 0.0.0.0/0 10.254.254.1
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
end
