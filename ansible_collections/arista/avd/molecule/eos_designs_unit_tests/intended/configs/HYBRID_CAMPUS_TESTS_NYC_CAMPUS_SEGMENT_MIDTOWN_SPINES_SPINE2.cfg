!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_SPINE2
!
no spanning-tree vlan-id 4093-4094
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR1_LEAFS_Port-Channel51
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 1
!
interface Port-Channel491
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR2_LEAFS_LEAF2A_Port-Channel11
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 491
!
interface Port-Channel501
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR3_LEAFS_AB_Port-Channel971
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 501
!
interface Port-Channel551
   description MLAG_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_SPINE1_Port-Channel551
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR1_LEAFS_LEAF1B_Ethernet51
   no shutdown
   channel-group 1 mode active
!
interface Ethernet10
   no shutdown
   no switchport
   ip address 199.199.2.1/30
!
interface Ethernet49/1
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR2_LEAFS_LEAF2A_Ethernet1/3
   no shutdown
   channel-group 491 mode active
!
interface Ethernet50/1
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR3_LEAFS_LEAF3A_Ethernet97/2
   no shutdown
   channel-group 501 mode active
!
interface Ethernet51/1
   description L2_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_FLOOR3_LEAFS_LEAF3B_Ethernet97/2
   no shutdown
   channel-group 501 mode active
!
interface Ethernet52/1
   description P2P_WAN_Ethernet1/1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.0.0.5/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet55/1
   description MLAG_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_SPINE1_Ethernet55/1
   no shutdown
   channel-group 551 mode active
!
interface Ethernet56/1
   description MLAG_HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES_SPINE1_Ethernet56/1
   no shutdown
   channel-group 551 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 172.16.1.2/32
   ip ospf area 0.0.0.0
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.99.102/24
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.1.1.1/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 192.168.0.1/31
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
no ip routing vrf MGMT
!
mlag configuration
   domain-id HYBRID_CAMPUS_TESTS_NYC_CAMPUS_SEGMENT_MIDTOWN_SPINES
   local-interface Vlan4094
   peer-address 192.168.0.0
   peer-link Port-Channel551
   reload-delay mlag 300
   reload-delay non-mlag 330
!
router ospf 100
   router-id 172.16.1.2
   passive-interface default
   no passive-interface Ethernet52/1
   no passive-interface Vlan4093
   redistribute connected
   max-lsa 12000
!
end
