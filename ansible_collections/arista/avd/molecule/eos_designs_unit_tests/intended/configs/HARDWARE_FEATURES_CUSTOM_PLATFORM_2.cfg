!
no enable password
no aaa root
!
hardware counter feature acl out mac
hardware counter feature decap-group
hardware counter feature directflow in
hardware counter feature ecn out
hardware counter feature flow-spec in
hardware counter feature gre tunnel interface out
hardware counter feature ip in
hardware counter feature mpls interface in
hardware counter feature mpls lfib
hardware counter feature mpls tunnel
hardware counter feature multicast ipv4
hardware counter feature nexthop
hardware counter feature pbr in
hardware counter feature pdp
hardware counter feature policing interface in
hardware counter feature qos in
hardware counter feature qos dual-rate-policer in
hardware counter feature route ipv4 1.1.1.1/32
hardware counter feature routed-port
hardware counter feature segment-security in
hardware counter feature subinterface in
hardware counter feature tapagg in
hardware counter feature traffic-class in
hardware counter feature traffic-policy in
hardware counter feature vlan in
hardware counter feature vlan-interface in
hardware counter feature vni decap
hardware counter feature vni encap
hardware counter feature vtep decap
hardware counter feature vtep encap
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
queue-monitor length
queue-monitor length notifying
!
hostname HARDWARE_FEATURES_CUSTOM_PLATFORM_2
!
ptp clock-identity 00:1C:73:1e:00:08
ptp domain 127
ptp mode boundary
ptp priority1 30
ptp priority2 8
ptp monitor threshold offset-from-master 250
ptp monitor threshold mean-path-delay 1500
ptp monitor sequence-id
ptp monitor threshold missing-message sync 3 sequence-ids
ptp monitor threshold missing-message follow-up 3 sequence-ids
ptp monitor threshold missing-message delay-resp 3 sequence-ids
ptp monitor threshold missing-message announce 3 sequence-ids
!
vrf instance MGMT
!
queue-monitor streaming
   no shutdown
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel7
   description L2_HARDWARE_FEATURES_CLOUDEOS_2_Port-Channel1
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Ethernet1
   description P2P_HARDWARE_FEATURES_VEOS_LAB_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.0/31
   ptp enable
   ptp announce interval 0
   ptp announce timeout 3
   ptp delay-req interval -3
   ptp sync-message interval -3
   ptp transport ipv4
!
interface Ethernet2
   description P2P_HARDWARE_FEATURES_CEOS_LAB_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.2/31
   ptp enable
   ptp announce interval 0
   ptp announce timeout 3
   ptp delay-req interval -3
   ptp sync-message interval -3
   ptp transport ipv4
!
interface Ethernet3
   description P2P_HARDWARE_FEATURES_CLOUDEOS_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.4/31
!
interface Ethernet4
   description P2P_HARDWARE_FEATURES_720XP_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.6/31
   ptp enable
   ptp announce interval 0
   ptp announce timeout 3
   ptp delay-req interval -3
   ptp sync-message interval -3
   ptp transport ipv4
!
interface Ethernet5
   description P2P_HARDWARE_FEATURES_7280R_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.8/31
   ptp enable
   ptp announce interval 0
   ptp announce timeout 3
   ptp delay-req interval -3
   ptp sync-message interval -3
   ptp transport ipv4
!
interface Ethernet6
   description P2P_HARDWARE_FEATURES_CUSTOM_PLATFORM_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.10/31
   ptp enable
   ptp announce interval 0
   ptp announce timeout 3
   ptp delay-req interval -3
   ptp sync-message interval -3
   ptp transport ipv4
!
interface Ethernet7
   description L2_HARDWARE_FEATURES_CLOUDEOS_2_Ethernet1
   no shutdown
   channel-group 7 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.10.8/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.10.20.8/32
!
interface Vxlan1
   description HARDWARE_FEATURES_CUSTOM_PLATFORM_2_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.10.0/24 eq 32
   seq 20 permit 10.10.20.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 10.10.10.8
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.10.50.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.1 remote-as 65001
   neighbor 10.10.50.1 description HARDWARE_FEATURES_VEOS_LAB_Ethernet1
   neighbor 10.10.50.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.3 remote-as 65001
   neighbor 10.10.50.3 description HARDWARE_FEATURES_CEOS_LAB_Ethernet1
   neighbor 10.10.50.5 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.5 remote-as 65001
   neighbor 10.10.50.5 description HARDWARE_FEATURES_CLOUDEOS_Ethernet1
   neighbor 10.10.50.7 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.7 remote-as 65001
   neighbor 10.10.50.7 description HARDWARE_FEATURES_720XP_Ethernet1
   neighbor 10.10.50.9 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.9 remote-as 65001
   neighbor 10.10.50.9 description HARDWARE_FEATURES_7280R_Ethernet1
   neighbor 10.10.50.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.11 remote-as 65001
   neighbor 10.10.50.11 description HARDWARE_FEATURES_CUSTOM_PLATFORM_Ethernet1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
