!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1A
!
no spanning-tree vlan-id 4093-4094
!
vlan 110
   name Tenant_A_OP_Zone_1
!
vlan 3000
   name MLAG_L3_VRF_TEST_VRF
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance TEST_VRF
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel3
   description MLAG_MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1B_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet3
   description MLAG_MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1B_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1B_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Ethernet11
   description P2P_MLAG_SAME_SUBNET_L3LEAF1A_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 172.31.255.1/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.1/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.200.101/24
!
interface Vlan110
   description Tenant_A_OP_Zone_1
   no shutdown
   vrf TEST_VRF
   ip address virtual 10.1.10.1/24
!
interface Vlan3000
   description MLAG_L3_VRF_TEST_VRF
   no shutdown
   mtu 9214
   vrf TEST_VRF
   ip address 10.255.240.1/30
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.255.251.1/30
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.1/30
!
interface Vxlan1
   description MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1A_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 110 vni 11110
   vxlan vrf TEST_VRF vni 1
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip routing
no ip routing vrf MGMT
ip routing vrf TEST_VRF
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.240.0/30
!
mlag configuration
   domain-id MLAG_COMMA_SEPARATED_SAME_SUBNET_L3LEAF1
   local-interface Vlan4094
   peer-address 10.255.252.2
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 192.168.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1B
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 12000
   neighbor 10.255.251.2 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.251.2 description MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1B_Vlan4093
   neighbor 172.31.255.0 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.31.255.0 remote-as 923
   neighbor 172.31.255.0 description MLAG_SAME_SUBNET_L3LEAF1A_Ethernet1
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 110
      rd 192.168.255.1:11110
      route-target both 11110:11110
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf TEST_VRF
      rd 192.168.255.1:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      router-id 192.168.255.1
      update wait-install
      neighbor 10.255.240.2 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.240.2 description MLAG-COMMA-SEPARATED-SAME-SUBNET-L3LEAF1B_Vlan3000
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
