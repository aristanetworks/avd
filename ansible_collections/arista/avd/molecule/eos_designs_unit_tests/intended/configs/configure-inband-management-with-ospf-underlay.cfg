!
no enable password
no aaa root
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=INBANDMGMT -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname configure-inband-management-with-ospf-underlay
ip name-server vrf INBANDMGMT 1.1.1.1
ip name-server vrf INBANDMGMT 8.8.8.8
!
vlan 101
   name INBAND_MGMT
!
vlan 102
   name INBAND_MGMT
!
vlan 103
   name Inband management vlan
!
vlan 105
   name Inband_management_vlan_ipv6
!
vrf instance INBANDMGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Port-Channel21
   description INBAND-MGMT-SUBNET_Po1
   no shutdown
   switchport trunk allowed vlan 101
   switchport mode trunk
   switchport
   port-channel lacp fallback individual
   port-channel lacp fallback timeout 30
!
interface Port-Channel22
   description INBAND-MGMT-SUBNET-VRF_Po1
   no shutdown
   switchport trunk allowed vlan 102
   switchport mode trunk
   switchport
   port-channel lacp fallback individual
   port-channel lacp fallback timeout 90
!
interface Port-Channel23
   description INBAND-MGMT-IP_Po1
   no shutdown
   switchport trunk allowed vlan 103
   switchport mode trunk
   switchport
!
interface Ethernet1
   description P2P_inband-mgmt-spine1-ztp_Ethernet11
   no shutdown
   mtu 9214
   no switchport
   ip address 172.17.255.1/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet21
   description INBAND-MGMT-SUBNET_Ethernet3
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
   channel-group 21 mode active
!
interface Ethernet22
   description INBAND-MGMT-SUBNET-VRF_Ethernet3
   no shutdown
   switchport access vlan 102
   switchport mode access
   switchport
   channel-group 22 mode active
!
interface Ethernet23
   description INBAND-MGMT-IP_Ethernet3
   no shutdown
   channel-group 23 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.255.1/32
   ip ospf area 0.0.0.0
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.0.254.1/32
   ip ospf area 0.0.0.0
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.100.111/24
!
interface Vlan101
   description Inband Management
   no shutdown
   mtu 1500
   vrf INBANDMGMT
   ip address 192.168.101.2/24
   ip virtual-router address 192.168.101.1
!
interface Vlan102
   description Inband Management
   no shutdown
   mtu 1500
   vrf INBANDMGMT
   ip address 192.168.102.2/24
   ip virtual-router address 192.168.102.1
!
interface Vlan103
   description Inband management vlan
   shutdown
   vrf INBANDMGMT
   ip address 192.168.103.1/24
!
interface Vlan105
   description Inband_management_vlan_ipv6
   shutdown
   vrf INBANDMGMT
!
interface Vxlan1
   description configure-inband-management-with-ospf-underlay_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf INBANDMGMT vni 1
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
ip routing vrf INBANDMGMT
!
ntp local-interface vrf INBANDMGMT Vlan102
ntp server vrf INBANDMGMT 2.2.2.55 prefer
ntp server vrf INBANDMGMT pool.ntp.org
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 10.10.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor 10.0.254.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.0.254.1 remote-as 64999
   neighbor 10.0.254.1 description inband-mgmt-spine1-ztp_Loopback0
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
   !
   vrf INBANDMGMT
      rd 10.10.255.1:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      router-id 10.10.255.1
      redistribute connected
      redistribute attached-host
!
router ospf 100
   router-id 10.10.255.1
   passive-interface default
   no passive-interface Ethernet1
   max-lsa 12000
!
end
