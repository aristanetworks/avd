!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname aaa-settings-radius-1
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
radius-server host 11.10.10.11 key 7 password
radius-server host 11.10.10.1 vrf MGMT key 7 password
radius-server host 11.10.10.2 vrf MGMT key 7 password
radius-server host 11.10.10.3 vrf MGMT key 7 password
!
aaa group server radius RADIUS1
   server 11.10.10.11 vrf default
   server 11.10.10.1 vrf MGMT
   server 11.10.10.2 vrf MGMT
   server 11.10.10.3 vrf MGMT
!
aaa group server radius RADIUS2
   server 11.10.10.1 vrf MGMT
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
no ip routing vrf MGMT
!
ip radius vrf MGMT source-interface Management1
!
ip radius vrf MGMT source-interface Management1
!
end
