aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: aaa-settings-tacacs-1
ip_igmp_snooping:
  globally_enabled: true
ip_tacacs_source_interfaces:
- name: Management1
  vrf: MGMT
is_deployed: true
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.2/24
  type: oob
metadata:
  fabric_name: EOS_DESIGNS_UNIT_TESTS
service_routing_protocols_model: multi-agent
tacacs_servers:
  hosts:
  - host: 10.10.10.1
    vrf: default
    key_type: '7'
  - host: 10.10.10.1
    vrf: MGMT
    key: password
    key_type: '0'
    single_connection: true
    timeout: 100
  - host: 10.10.10.2
    vrf: MGMT
    key_type: '7'
  - host: 10.10.10.2
    vrf: other_vrf
    key_type: '7'
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
