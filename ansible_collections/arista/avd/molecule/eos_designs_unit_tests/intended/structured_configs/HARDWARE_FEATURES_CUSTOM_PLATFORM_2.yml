aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_HARDWARE_FEATURES_VEOS_LAB_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.10.50.0/31
  ptp:
    enable: true
    announce:
      interval: 0
      timeout: 3
    delay_req: -3
    sync_message:
      interval: -3
    transport: ipv4
  peer: HARDWARE_FEATURES_VEOS_LAB
  peer_interface: Ethernet1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_HARDWARE_FEATURES_CEOS_LAB_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.10.50.2/31
  ptp:
    enable: true
    announce:
      interval: 0
      timeout: 3
    delay_req: -3
    sync_message:
      interval: -3
    transport: ipv4
  peer: HARDWARE_FEATURES_CEOS_LAB
  peer_interface: Ethernet1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_HARDWARE_FEATURES_CLOUDEOS_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.10.50.4/31
  peer: HARDWARE_FEATURES_CLOUDEOS
  peer_interface: Ethernet1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_HARDWARE_FEATURES_720XP_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.10.50.6/31
  ptp:
    enable: true
    announce:
      interval: 0
      timeout: 3
    delay_req: -3
    sync_message:
      interval: -3
    transport: ipv4
  peer: HARDWARE_FEATURES_720XP
  peer_interface: Ethernet1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet5
  description: P2P_HARDWARE_FEATURES_7280R_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.10.50.8/31
  ptp:
    enable: true
    announce:
      interval: 0
      timeout: 3
    delay_req: -3
    sync_message:
      interval: -3
    transport: ipv4
  peer: HARDWARE_FEATURES_7280R
  peer_interface: Ethernet1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet6
  description: P2P_HARDWARE_FEATURES_CUSTOM_PLATFORM_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.10.50.10/31
  ptp:
    enable: true
    announce:
      interval: 0
      timeout: 3
    delay_req: -3
    sync_message:
      interval: -3
    transport: ipv4
  peer: HARDWARE_FEATURES_CUSTOM_PLATFORM
  peer_interface: Ethernet1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet7
  description: L2_HARDWARE_FEATURES_CLOUDEOS_2_Ethernet1
  shutdown: false
  channel_group:
    id: 7
    mode: active
  peer: HARDWARE_FEATURES_CLOUDEOS_2
  peer_interface: Ethernet1
  peer_type: l3leaf
hardware_counters:
  features:
  - name: acl
    direction: out
    address_type: mac
  - name: decap-group
  - name: directflow
    direction: in
  - name: ecn
    direction: out
  - name: flow-spec
    direction: in
  - name: gre tunnel interface
    direction: out
  - name: ip
    direction: in
  - name: mpls interface
    direction: in
  - name: mpls lfib
  - name: mpls tunnel
  - name: multicast
    address_type: ipv4
  - name: nexthop
  - name: pbr
    direction: in
  - name: pdp
  - name: policing interface
    direction: in
  - name: qos
    direction: in
  - name: qos dual-rate-policer
    direction: in
  - name: route
    address_type: ipv4
    prefix: 1.1.1.1/32
  - name: routed-port
  - name: segment-security
    direction: in
  - name: subinterface
    direction: in
  - name: tapagg
    direction: in
  - name: traffic-class
    direction: in
  - name: traffic-policy
    direction: in
  - name: vlan
    direction: in
  - name: vlan-interface
    direction: in
  - name: vni decap
  - name: vni encap
  - name: vtep decap
  - name: vtep encap
hostname: HARDWARE_FEATURES_CUSTOM_PLATFORM_2
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
is_deployed: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.10.10.8/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.10.20.8/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
metadata:
  platform: customplatform_2
  fabric_name: EOS_DESIGNS_UNIT_TESTS
port_channel_interfaces:
- name: Port-Channel7
  description: L2_HARDWARE_FEATURES_CLOUDEOS_2_Port-Channel1
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.10.0/24 eq 32
  - sequence: 20
    action: permit 10.10.20.0/24 eq 32
ptp:
  mode: boundary
  clock_identity: 00:1C:73:1e:00:08
  priority1: 30
  priority2: 8
  domain: 127
  monitor:
    enabled: true
    threshold:
      offset_from_master: 250
      mean_path_delay: 1500
    missing_message:
      sequence_ids:
        enabled: true
        announce: 3
        delay_resp: 3
        follow_up: 3
        sync: 3
queue_monitor_length:
  enabled: true
  notifying: true
queue_monitor_streaming:
  enable: true
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65001'
  router_id: 10.10.10.8
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.10.50.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: HARDWARE_FEATURES_VEOS_LAB
    description: HARDWARE_FEATURES_VEOS_LAB_Ethernet1
  - ip_address: 10.10.50.3
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: HARDWARE_FEATURES_CEOS_LAB
    description: HARDWARE_FEATURES_CEOS_LAB_Ethernet1
  - ip_address: 10.10.50.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: HARDWARE_FEATURES_CLOUDEOS
    description: HARDWARE_FEATURES_CLOUDEOS_Ethernet1
  - ip_address: 10.10.50.7
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: HARDWARE_FEATURES_720XP
    description: HARDWARE_FEATURES_720XP_Ethernet1
  - ip_address: 10.10.50.9
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: HARDWARE_FEATURES_7280R
    description: HARDWARE_FEATURES_7280R_Ethernet1
  - ip_address: 10.10.50.11
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: HARDWARE_FEATURES_CUSTOM_PLATFORM
    description: HARDWARE_FEATURES_CUSTOM_PLATFORM_Ethernet1
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: HARDWARE_FEATURES_CUSTOM_PLATFORM_2_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
