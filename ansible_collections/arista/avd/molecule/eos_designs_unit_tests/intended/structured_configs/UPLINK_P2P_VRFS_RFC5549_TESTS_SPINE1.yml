aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: P2P_UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF_Ethernet1
  shutdown: false
  mtu: 9214
  ipv6_enable: true
  mac_security:
    profile: TEST
  peer: UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF
  peer_interface: Ethernet1
  peer_type: l3leaf
  switchport:
    enabled: false
hostname: UPLINK_P2P_VRFS_RFC5549_TESTS_SPINE1
ip_routing_ipv6_interfaces: true
ipv6_unicast_routing: true
is_deployed: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.42.1/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
metadata:
  platform: vEOS-LAB
  fabric_name: EOS_DESIGNS_UNIT_TESTS
router_bgp:
  as: '65000'
  router_id: 192.168.42.1
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  neighbor_interfaces:
  - name: Ethernet3
    remote_as: '65000'
    peer: UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF
    peer_group: IPv4-UNDERLAY-PEERS
    description: UPLINK_P2P_VRFS_RFC5549_TESTS_LEAF_Ethernet1
  redistribute:
    connected:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
      next_hop:
        address_family_ipv6:
          enabled: true
          originate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
