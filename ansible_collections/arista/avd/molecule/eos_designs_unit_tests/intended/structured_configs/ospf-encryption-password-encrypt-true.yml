aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet13
  description: test
  shutdown: false
  mtu: 9000
  vrf: Tenant_OSPF_VRF
  ip_address: 10.10.10.10/24
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  ospf_cost: 100
  ospf_authentication: message-digest
  ospf_message_digest_keys:
  - id: 1
    hash_algorithm: sha1
    key: arista
  - id: 2
    hash_algorithm: sha512
    key: ClearText
  peer_type: l3_interface
  switchport:
    enabled: false
hostname: ospf-encryption-password-encrypt-true
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:11:22:33:44:55
is_deployed: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.66.42/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.142.42/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.42.42/24
  type: oob
metadata:
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.66.0/24 eq 32
  - sequence: 20
    action: permit 192.168.142.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '666'
  router_id: 192.168.66.42
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 201
    tenant: Tenant_OSPF
    rd: 192.168.66.42:20201
    route_targets:
      both:
      - 20201:20201
    redistribute_routes:
    - learned
  - id: 202
    tenant: Tenant_OSPF
    rd: 192.168.66.42:20202
    route_targets:
      both:
      - 20202:20202
    redistribute_routes:
    - learned
  - id: 203
    tenant: Tenant_OSPF
    rd: 192.168.66.42:20203
    route_targets:
      both:
      - 20203:20203
    redistribute_routes:
    - learned
  - id: 204
    tenant: Tenant_OSPF
    rd: 192.168.66.42:20204
    route_targets:
      both:
      - 20204:20204
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: Tenant_OSPF_VRF
    rd: 192.168.66.42:42
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '42:42'
      export:
      - address_family: evpn
        route_targets:
        - '42:42'
    router_id: 192.168.66.42
    redistribute:
      connected:
        enabled: true
      ospf:
        enabled: true
router_ospf:
  process_ids:
  - id: 42
    vrf: Tenant_OSPF_VRF
    passive_interface_default: true
    router_id: 10.10.10.10
    no_passive_interfaces:
    - Ethernet13
    - Vlan201
    - Vlan202
    - Vlan203
    - Vlan204
    redistribute:
      bgp:
        enabled: true
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan201
  description: Tenant_OSPF_201
  shutdown: false
  vrf: Tenant_OSPF_VRF
