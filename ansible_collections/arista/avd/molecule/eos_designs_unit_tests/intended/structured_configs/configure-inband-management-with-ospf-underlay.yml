aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - apiserver.arista.io:443
  cvauth:
    method: token-secure
    token_file: /tmp/cv-onboarding-token
  cvvrf: INBANDMGMT
  disable_aaa: false
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_inband-mgmt-spine1-ztp_Ethernet11
  shutdown: false
  mtu: 9214
  ip_address: 172.17.255.1/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  peer: inband-mgmt-spine1-ztp
  peer_interface: Ethernet11
  peer_type: spine
  switchport:
    enabled: false
- name: Ethernet21
  description: INBAND-MGMT-SUBNET_Ethernet3
  shutdown: false
  channel_group:
    id: 21
    mode: active
  peer: inband-mgmt-subnet
  peer_interface: Ethernet3
  peer_type: l2leaf
  switchport:
    enabled: true
    mode: access
    access_vlan: 101
- name: Ethernet22
  description: INBAND-MGMT-SUBNET-VRF_Ethernet3
  shutdown: false
  channel_group:
    id: 22
    mode: active
  peer: inband-mgmt-subnet-vrf
  peer_interface: Ethernet3
  peer_type: l2leaf
  switchport:
    enabled: true
    mode: access
    access_vlan: 102
- name: Ethernet23
  description: INBAND-MGMT-IP_Ethernet3
  shutdown: false
  channel_group:
    id: 23
    mode: active
  peer: inband-mgmt-ip
  peer_interface: Ethernet3
  peer_type: l2leaf
hostname: configure-inband-management-with-ospf-underlay
ip_igmp_snooping:
  globally_enabled: true
ip_name_servers:
- ip_address: 1.1.1.1
  vrf: INBANDMGMT
- ip_address: 8.8.8.8
  vrf: INBANDMGMT
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:dc:01
is_deployed: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.10.255.1/32
  ospf_area: 0.0.0.0
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.0.254.1/32
  ospf_area: 0.0.0.0
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.100.111/24
  type: oob
metadata:
  fabric_name: EOS_DESIGNS_UNIT_TESTS
ntp:
  local_interface:
    name: Vlan102
    vrf: INBANDMGMT
  servers:
  - name: 2.2.2.55
    preferred: true
    vrf: INBANDMGMT
  - name: pool.ntp.org
    vrf: INBANDMGMT
port_channel_interfaces:
- name: Port-Channel21
  description: INBAND-MGMT-SUBNET_Po1
  shutdown: false
  lacp_fallback_timeout: 30
  lacp_fallback_mode: individual
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: '101'
- name: Port-Channel22
  description: INBAND-MGMT-SUBNET-VRF_Po1
  shutdown: false
  lacp_fallback_timeout: 90
  lacp_fallback_mode: individual
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: '102'
- name: Port-Channel23
  description: INBAND-MGMT-IP_Po1
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: '103'
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 10.10.255.1
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.0.254.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '64999'
    peer: inband-mgmt-spine1-ztp
    description: inband-mgmt-spine1-ztp_Loopback0
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: INBANDMGMT
    rd: 10.10.255.1:1
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '1:1'
      export:
      - address_family: evpn
        route_targets:
        - '1:1'
    router_id: 10.10.255.1
    redistribute:
      attached_host:
        enabled: true
      connected:
        enabled: true
router_ospf:
  process_ids:
  - id: 100
    passive_interface_default: true
    router_id: 10.10.255.1
    bfd_enable: false
    no_passive_interfaces:
    - Ethernet1
    max_lsa: 12000
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan103
  description: Inband management vlan
  shutdown: true
  vrf: INBANDMGMT
  ip_address: 192.168.103.1/24
  tenant: INBAND_MGMT_TESTS
- name: Vlan105
  description: Inband_management_vlan_ipv6
  shutdown: true
  vrf: INBANDMGMT
  tenant: INBAND_MGMT_TESTS
- name: Vlan101
  description: Inband Management
  shutdown: false
  vrf: INBANDMGMT
  ip_address: 192.168.101.2/24
  ip_virtual_router_addresses:
  - 192.168.101.1
  mtu: 1500
- name: Vlan102
  description: Inband Management
  shutdown: false
  vrf: INBANDMGMT
  ip_address: 192.168.102.2/24
  ip_virtual_router_addresses:
  - 192.168.102.1
  mtu: 1500
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 103
  name: Inband management vlan
  tenant: INBAND_MGMT_TESTS
- id: 105
  name: Inband_management_vlan_ipv6
  tenant: INBAND_MGMT_TESTS
- id: 101
  name: INBAND_MGMT
  tenant: system
- id: 102
  name: INBAND_MGMT
  tenant: system
vrfs:
- name: default
  ip_routing: false
- name: INBANDMGMT
  ip_routing: true
  tenant: INBAND_MGMT_TESTS
vxlan_interface:
  vxlan1:
    description: configure-inband-management-with-ospf-underlay_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vrfs:
      - name: INBANDMGMT
        vni: 1
