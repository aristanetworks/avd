---
scenario:
  converge_sequence:
    - converge
  test_sequence:
    - create
    - converge
    - idempotence
  destroy_sequence:
    - destroy

ansible:
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=inventory/inventory.yml
        - --check
  env:
    ANSIBLE_FORCE_COLOR: true
  cfg:
    defaults:
      jinja2_extensions: jinja2.ext.loopcontrols,jinja2.ext.do,jinja2.ext.i18n
      duplicate_dict_key: error
      gathering: explicit

verifier:
  name: ansible
