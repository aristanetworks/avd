---
- name: Converge
  hosts: TWODC_5STAGE_CLOS
  gather_facts: false
  connection: local
  tasks:

    - name: Generate device intended config and documentation
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen

- name: Converge
  hosts: TWODC_5STAGE_CLOS
  gather_facts: false
  connection: local
  vars:
    output_dir_name: "digital_twin/intended"
    documentation_dir_name: "digital_twin/documentation"
    avd_digital_twin_mode: true
  tasks:

    - name: Generate device intended config and documentation in ACT Digital Twin mode
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen

- name: Converge
  hosts: TWODC_5STAGE_CLOS
  gather_facts: false
  connection: local
  vars:
    output_dir_name: "digital_twin/intended"
    documentation_dir_name: "digital_twin/documentation"
    avd_digital_twin_mode: true
  tasks:

    - name: Set facts to use original platform for fetching default_interfaces
      ansible.builtin.set_fact:
        digital_twin:
          fabric: {}
          default_interfaces_of_original_platform: true

    - name: Generate device intended config and documentation in ACT Digital Twin mode
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen
