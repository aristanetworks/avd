aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
eos_cli: "management security\n   password encryption-key common\n"
hostname: SITE1-LER3
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:dc:00
ipv6_unicast_routing: true
is_deployed: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 100.70.0.11/32
  ipv6_address: 2000:1234:ffff:ffff::b/128
  mpls:
    ldp:
      interface: true
  isis_enable: CORE
  isis_passive: true
  node_segment:
    ipv4_index: 211
    ipv6_index: 211
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.200.112/24
  type: oob
  gateway: 192.168.200.5
metadata:
  platform: 7280SR3
  fabric_name: MPLS_CORE
mpls:
  ip: true
  ldp:
    interface_disabled_default: true
    router_id: 100.70.0.11
    shutdown: false
    transport_address_interface: Loopback0
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 100.70.0.11
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp_defaults:
  - distance bgp 20 200 200
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    remote_as: '65000'
    update_source: Loopback0
    bfd: true
    send_community: all
    maximum_routes: 0
  vlans:
  - id: 10
    tenant: TENANT_A
    rd: 100.70.0.11:10010
    route_targets:
      both:
      - 65000:10010
    redistribute_routes:
    - learned
  - id: 20
    tenant: TENANT_A
    rd: 100.70.0.11:123456
    route_targets:
      both:
      - 65000:123456
    redistribute_routes:
    - learned
  - id: 2020
    tenant: TENANT_B
    rd: 100.70.0.11:22020
    route_targets:
      both:
      - 65000:22020
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_rtc:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: TENANT_B_INTRA
    rd: 100.70.0.11:19
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '65000:19'
      export:
      - address_family: evpn
        route_targets:
        - '65000:19'
    router_id: 100.70.0.11
    redistribute:
      connected:
        enabled: true
router_isis:
  instance: CORE
  net: 49.0001.1000.7000.0011.00
  router_id: 100.70.0.11
  is_type: level-1-2
  log_adjacency_changes: true
  mpls_ldp_sync_default: true
  timers:
    local_convergence:
      protected_prefixes: true
      delay: 15000
  advertise:
    passive_only: true
  address_family_ipv4:
    enabled: true
    maximum_paths: 4
    fast_reroute_ti_lfa:
      mode: link-protection
  address_family_ipv6:
    enabled: true
    maximum_paths: 4
    fast_reroute_ti_lfa:
      mode: link-protection
  segment_routing_mpls:
    enabled: true
    router_id: 100.70.0.11
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.168.200.5
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan2020
  description: TENANT_B_INSIDE_FW
  shutdown: false
  vrf: TENANT_B_INTRA
  tenant: TENANT_B
  tags:
  - tag1
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 10
  name: TENANT_A_L2_SERVICE
  tenant: TENANT_A
- id: 20
  name: TENANT_A_L2_SERVICE
  tenant: TENANT_A
- id: 2020
  name: TENANT_B_INSIDE_FW
  tenant: TENANT_B
vrfs:
- name: MGMT
  ip_routing: false
- name: TENANT_B_INTRA
  ip_routing: true
  tenant: TENANT_B
