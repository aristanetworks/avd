!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DIGITAL_TWIN_DEFAULT_INTERFACES_DIGITAL_TWIN_PLATFORM
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel4
   description L2_DIGITAL_TWIN_DEFAULT_INTERFACES_ORIGINAL_PLATFORM_Port-Channel2
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Ethernet4
   description L2_DIGITAL_TWIN_DEFAULT_INTERFACES_ORIGINAL_PLATFORM_Ethernet2
   no shutdown
   channel-group 4 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.10.10.100/24
no ip routing vrf MGMT
!
end
