---

l3leaf:
  defaults:
    mlag_peer_l3_ipv4_pool: 192.168.3.80/28
    mlag_peer_ipv4_pool: 192.168.3.96/28
    uplink_ipv4_pool: 192.168.3.112/28
    loopback_ipv4_pool: 192.168.3.128/28
    vtep_loopback_ipv4_pool: 192.168.3.144/28
    bgp_as: 65001
    mlag_interfaces: [ Ethernet4, Ethernet5 ]
  node_groups:
    - group: NODE_GROUP_A
      nodes:
        - name: digital-twin-ethernet-ports-1
          id: 1
          mgmt_ip: 192.169.3.1/32
        - name: digital.twin.ethernet.ports.2
          id: 2
          mgmt_ip: 192.169.3.2/32
          uplink_interfaces: [ Ethernet3 ]
          uplink_switches: [ digital-twin-ethernet-ports-1 ]
          uplink_switch_interfaces: [ Ethernet3 ]
    - group: NODE_GROUP_B
      nodes:
        - name: digital-twin-ethernet-ports-3
          id: 1
          platform: custom-platform
          mgmt_ip: 192.169.3.3/32
          uplink_interfaces: [ Ethernet6 ]
          uplink_switches: [ digital-twin-ethernet-ports-1 ]
          uplink_switch_interfaces: [ Ethernet6 ]

custom_platform_settings:
  - platforms:
      - custom-platform
    digital_twin:
      act_node_type: third-party

firewalls:
  - name: firewall-1
    adapters:
      - endpoint_ports: [ Eth1, Eth2 ]
        switch_ports: [ Ethernet1, Ethernet1 ]
        switches: [ digital-twin-ethernet-ports-1, digital.twin.ethernet.ports.2 ]

network_ports:
  - switches: [ digital-twin-ethernet-ports-1, digital.twin.ethernet.ports.2 ]
    switch_ports: [ Ethernet2, Ethernet2 ]

tenants:
  - name: TENANT_A
    mac_vrf_vni_base: 10000
    mac_vrf_id_base: 20000
    enable_mlag_ibgp_peering_vrfs: false
    vrfs:
      - name: TENANT_A_VRF_A
        vrf_vni: 1025
        svis:
          - id: 1
            name: TENANT_A_VRF_A_SVI_A
            enabled: true
            vxlan: false
        l3_interfaces:
          - interfaces: [ Ethernet10.100, Ethernet10.100 ]
            ip_addresses: [ "192.168.3.160/31", "192.168.3.162/31" ]
            nodes: [ digital-twin-ethernet-ports-1, digital.twin.ethernet.ports.2 ]
          - interfaces: [ Ethernet10.101, Ethernet10.101 ]
            ip_addresses: [ "192.168.3.162/31", "192.168.3.163/31" ]
            nodes: [ digital-twin-ethernet-ports-1, digital.twin.ethernet.ports.2 ]
          - interfaces: [ Ethernet10, Ethernet10 ]
            ip_addresses: [ "192.168.3.164/31", "192.168.3.165/31" ]
            nodes: [ digital-twin-ethernet-ports-1, digital.twin.ethernet.ports.2 ]

l3_edge:
  p2p_links:
    - nodes: [ digital-twin-ethernet-ports-1, digital.twin.ethernet.ports.2 ]
      interfaces: [ Ethernet11, Ethernet11 ]
      as: [ 65001, 65001 ]
      ip: [ "192.168.3.166/31", "192.168.3.167/31" ]
    - nodes: [ digital-twin-ethernet-ports-1, digital.twin.ethernet.ports.2 ]
      interfaces: [ Ethernet11.100, Ethernet11.100 ]
      as: [ 65001, 65001 ]
      ip: [ "192.168.3.168/31", "192.168.3.169/31" ]
    - nodes: [ digital-twin-ethernet-ports-1, digital.twin.ethernet.ports.2 ]
      interfaces: [ Ethernet11.101, Ethernet11.101 ]
      as: [ 65001, 65001 ]
      ip: [ "192.168.3.170/31", "192.168.3.171/31" ]
