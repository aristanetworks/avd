            - name: host11
              key: secret_host_11
            - name: host12
            - name: host13
              key: secret_host_13
        - name: vrf_only_ipv4
          ipv4_clients:
            - address: 1.2.10.11
              key: secret_11
            - address: 1.2.10.16
            - address: 2.2.1.11
            - address: 1.2.10.18
              key: secret_21
    - name: CG_5
      vrfs:
        - name: vrf_only_ipv6
          ipv6_clients:
            - address: 2001:db8::11
              key: secret_ipv6_12
            - address: ::12
            - address: fd0::1234
              key: secret_ipv6_22
