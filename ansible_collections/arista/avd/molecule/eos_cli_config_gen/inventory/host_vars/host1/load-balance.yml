load_balance:
  policies:
    sand_profiles:
      - name: Profile_B
        fields:
          udp:
            dst_port: 100
            payload_bytes: 10-20
            match:
              payload_bits: 10
              pattern: "0x7d1"
              hash_payload_bytes: 10
      - name: Profile_A
        fields:
          udp:
            dst_port: 101
            payload_bytes: 25
  cluster:
    forwarding_type: routed ipv4
    flow:
      monitor: true
      source_learning_aging_timeout: 45
    load_balance_method_flow_round_robin: true
    destination_grouping: BGP field-set
