---
### Errdisable ###

errdisable:
  detect:
    causes:
      - arp-inspection
      - dot1x
      - link-change
      - tapagg
      - xcvr-misconfigured
      - xcvr-overheat
      - xcvr-power-unsupported
      - acl
  recovery:
    causes:
      - bpduguard
      - dot1x
      - hitless-reload-down
      - lacp-rate-limit
      - link-flap
      - no-internal-vlan
      - portchannelguard
      - portsec
      - speed-misconfigured
      - tapagg
      - uplink-failure-detection
      - xcvr-misconfigured
      - xcvr-overheat
      - xcvr-power-unsupported
      - xcvr-unsupported
      - arp-inspection
    intervals:
      - 100
      - 200
      - 300
      - 400
      - 500
      - 600
      - "none"
      - 500
      - 400
      - 300
      - 200
      - 100
      - "none"
      - 100
      - 200
      - 300
    interval: 300
