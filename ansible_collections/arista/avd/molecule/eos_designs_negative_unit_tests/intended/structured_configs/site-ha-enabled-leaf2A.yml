aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_cv-pathfinder-edge2A_Ethernet52
  shutdown: false
  mtu: 9214
  ipv6_enable: true
  peer: cv-pathfinder-edge2A
  peer_interface: Ethernet52
  peer_type: wan_router
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_cv-pathfinder-edge2B_Ethernet52
  shutdown: false
  mtu: 9214
  ipv6_enable: true
  peer: cv-pathfinder-edge2B
  peer_interface: Ethernet52
  peer_type: wan_router
  switchport:
    enabled: false
hostname: site-ha-enabled-leaf2A
ip_igmp_snooping:
  globally_enabled: true
is_deployed: true
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
metadata:
  fabric_name: CV_PATHFINDER_TESTS
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
