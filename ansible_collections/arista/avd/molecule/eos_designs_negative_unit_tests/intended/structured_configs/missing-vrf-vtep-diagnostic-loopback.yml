aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: missing-vrf-vtep-diagnostic-loopback
ip_igmp_snooping:
  globally_enabled: true
  vlans:
  - id: 110
    querier:
      enabled: true
      address: 192.168.255.3
    fast_leave: true
ip_routing: true
ip_virtual_router_mac_address: 00:dc:00:00:00:0a
is_deployed: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.3/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.3/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.200.105/24
  type: oob
  gateway: 192.168.200.1
metadata:
  platform: vEOS-LAB
  fabric_name: EOS_DESIGNS_FAILURES
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 192.168.255.3
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 110
    tenant: Tenant_A
    rd: 192.168.255.3:10110
    route_targets:
      both:
      - 10110:10110
    redistribute_routes:
    - learned
    - igmp
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: MULTICAST_ENABLED_110_111
    rd: 192.168.255.3:11
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '11:11'
      export:
      - address_family: evpn
        route_targets:
        - '11:11'
    router_id: 192.168.255.3
    redistribute:
      connected:
        enabled: true
router_multicast:
  ipv4:
    routing: true
    software_forwarding: sfe
service_routing_protocols_model: multi-agent
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.168.200.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan110
  description: MULTICAST_ENABLED_110
  shutdown: false
  vrf: MULTICAST_ENABLED_110_111
  ip_address_virtual: 10.1.10.1/24
  tenant: Tenant_A
  tags:
  - test_l3
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 110
  name: MULTICAST_ENABLED_110
  tenant: Tenant_A
vrfs:
- name: MGMT
  ip_routing: false
- name: MULTICAST_ENABLED_110_111
  description: MULTICAST_ENABLED_110
  ip_routing: true
  tenant: Tenant_A
vxlan_interface:
  vxlan1:
    description: missing-vrf-vtep-diagnostic-loopback_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 110
        vni: 10110
        multicast_group: 232.0.0.109
      vrfs:
      - name: MULTICAST_ENABLED_110_111
        vni: 11
