# Testing missing default-virtual-topology path-group
type: wan_router

wan_router:
  defaults:
    loopback_ipv4_pool: 192.168.42.0/24
    vtep_loopback_ipv4_pool: 192.168.142.0/24
    filter:
      always_include_vrfs_in_tenants: [TenantA]
    bgp_as: 65000
  node_groups:
    - group: Site511
      cv_pathfinder_region: AVD_Land_East
      cv_pathfinder_site: Site511
      wan_ha:
        enabled: false
      nodes:
        - name: missing-default-virtual-topology-path-group
          id: 1
          l3_interfaces:
            - name: Ethernet1
              peer: peer3
              peer_interface: Ethernet42
              wan_carrier: ATT
              wan_circuit_id: 666
              dhcp_accept_default_route: true
              ip_address: 172.16.0.2/30
              peer_ip: 172.16.0.1/30
              ipv4_acl_in: TEST-IPV4-ACL-WITH-IP-FIELDS-IN

wan_carriers:
  - name: ATT
    path_group: INET
    trusted: true

wan_path_groups:
  - id: 100
    name: INET
  - id: 200
    name: MPLS

ipv4_acls:
  - name: TEST-IPV4-ACL-WITH-IP-FIELDS-IN
    entries:
      - sequence: 15
        action: deny
        protocol: ip
        source: any
        destination: interface_ip
      - action: permit
        protocol: ip
        source: peer_ip
        destination: interface_ip

cv_pathfinder_regions:
  - name: AVD_Land_East
    id: 43
    description: AVD Region
    sites:
      - name: Site511
        id: 511
        location: Miami

wan_ipsec_profiles:
  control_plane:
    shared_key: ABCDEF1234567890
  data_plane:
    shared_key: ABCDEF1234567890666

bgp_peer_groups:
  wan_overlay_peers:
    password: "htm4AZe9mIQOO1uiMuGgYQ=="
    listen_range_prefixes:
      - 192.168.142.0/24
      - 192.168.143.0/24

wan_virtual_topologies:
  vrfs:
    - name: default
      wan_vni: 1
  control_plane_virtual_topology:
    name: CUSTOM-CP-POLICY
    lowest_hop_count: true
    constraints:
      jitter: 5
    path_groups:
      - names: [INET]
        preference: preferred
      - names: [MPLS]
        preference: alternate
  policies:
    - name: DEFAULT-POLICY
      default_virtual_topology:
        drop_unmatched: false
        path_groups:
          - names: [MPLS]

expected_error_message: >-
  The `default_virtual_topology` path-groups configuration for `wan_virtual_topologies.policies[DEFAULT-POLICY]` produces an empty load-balancing policy.
  Make sure at least one path-group present on the device is allowed in the `default_virtual_topology` path-groups.
