# Testing the policy does not match any traffic but is assigned to a VRF
type: wan_router

wan_router:
  defaults:
    loopback_ipv4_pool: 192.168.42.0/24
    vtep_loopback_ipv4_pool: 192.168.142.0/24
    filter:
      always_include_vrfs_in_tenants: [TenantA]
    bgp_as: 65000
  node_groups:
    - group: Site511
      cv_pathfinder_region: AVD_Land_East
      cv_pathfinder_site: Site511
      wan_ha:
        enabled: false
      nodes:
        - name: wan-router-policy-unmatched
          id: 1
          l3_interfaces:
            - name: Ethernet1
              peer: peer3
              peer_interface: Ethernet42
              wan_carrier: ATT
              wan_circuit_id: 666
              dhcp_accept_default_route: true
              ip_address: 172.16.0.2/30
              peer_ip: 172.16.0.1/30
              ipv4_acl_in: TEST-IPV4-ACL-WITH-IP-FIELDS-IN

wan_carriers:
  - name: ATT
    path_group: INET
    trusted: true

wan_path_groups:
  - id: 100
    name: INET

ipv4_acls:
  - name: TEST-IPV4-ACL-WITH-IP-FIELDS-IN
    entries:
      - sequence: 15
        action: deny
        protocol: ip
        source: any
        destination: interface_ip
      - action: permit
        protocol: ip
        source: peer_ip
        destination: interface_ip

cv_pathfinder_regions:
  - name: AVD_Land_East
    id: 43
    description: AVD Region
    sites:
      - name: Site511
        id: 511
        location: Miami

wan_ipsec_profiles:
  control_plane:
    shared_key: ABCDEF1234567890
  data_plane:
    shared_key: ABCDEF1234567890666

bgp_peer_groups:
  wan_overlay_peers:
    password: "htm4AZe9mIQOO1uiMuGgYQ=="
    listen_range_prefixes:
      - 192.168.142.0/24
      - 192.168.143.0/24

tenants:
  - name: TenantA
    mac_vrf_vni_base: 1000
    vrfs:
      - name: default
        vrf_id: 1
        # Checking static route on VRF default is redistributed in a route-map
        static_routes:
          - destination_address_prefix: 66.66.66.0/24
            gateway: 172.17.0.0
            nodes: [missing-default-virtual-topology-path-groups]
      - name: PROD
        # Showing that wan_vni and vrf_id can be different. `vrf_id` influences the subinterface id.
        vrf_id: 142
        svis:
          - id: 100
            name: VLAN100
            ip_address_virtual: 10.0.100.1/241

wan_virtual_topologies:
  vrfs:
    - name: PROD
      wan_vni: 2
  control_plane_virtual_topology:
    name: CUSTOM-CP-POLICY
    lowest_hop_count: true
    constraints:
      jitter: 5
    path_groups:
      - names: [INET]
        preference: preferred
      - names: [MPLS]
        preference: alternate

  policies:
    - name: DEFAULT-POLICY
      default_virtual_topology:
        lowest_hop_count: true
        drop_unmatched: true
        path_groups:
          - names: [INET]
          - names: [LTE]
            preference: 42

expected_error_message: >-
  The policy `wan_virtual_topologies.policies[DEFAULT-POLICY]` cannot match any traffic but is assigned to a VRF.
  Make sure at least one path-group present on the device is used in the policy.
