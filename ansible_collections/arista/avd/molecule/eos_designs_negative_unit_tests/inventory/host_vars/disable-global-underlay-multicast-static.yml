# Fabric node type keys
node_type_keys:
  - key: core_router
    type: core_router

bgp_as: 65000

# Nodes
type: core_router
core_router:
  defaults:
    loopback_ipv4_pool: 10.0.0.0/24
  nodes:
    - name: disable-global-underlay-multicast-static
      id: 1

core_interfaces:
  p2p_links_profiles:
    - name: isis_bb_profile
      speed: "forced 1000full"
      mtu: 1500
  p2p_links:
    - nodes: [ disable-global-underlay-multicast-static, peer1 ]
      id: 10
      as: [6000]
      interfaces: [ Ethernet1, Ethernet1 ]
      include_in_underlay_protocol: true
      multicast_static: true

expected_error_message: >-
  core_interfaces.p2p_links has `include_in_underlay_protocol: true` and `multicast_static: true`, which requires the global setting `underlay_multicast_static` to also be set to `true`.