---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
  nodes:
    - name: address-locking-missing-address-locking-settings
      id: 101
      bgp_as: 101

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    l2vlans:
      - id: 101
        name: test-address-locking-1
        address_locking:
          ipv4: true
  - name: TENANT2
    mac_vrf_vni_base: 10001
    vrfs:
      - name: TEST_ADDRESS_LOCKING
        vrf_vni: 789655
        svis:
          - id: 102
            name: test-address-locking-2
            enabled: true
            address_locking:
              ipv6: true

expected_error_message: >-
  To configure address locking address_locking_settings.dhcp_servers_ipv4 and address_locking_settings.local_interface are required.
