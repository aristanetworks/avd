---
type: l2leaf
l2leaf:
  defaults:
    uplink_switches: [duplicate-ip-address-1]
    uplink_switch_interfaces: [Ethernet1]
    uplink_structured_config:
      shudown: true
  nodes:
    - name: uplink-structured-config-with-new-keys
      uplink_port_channel_structured_config:
        shutdown: false

expected_error_message:
  The input data model 'uplink_structured_config' in node_type settings is deprecated and
  cannot be used in conjunction with the new keys.
  Check the 'defaults/node_group/nodes' settings for 'uplink-structured-config-with-new-keys'.