---
type: wan_router
wan_mode: autovpn
bgp_as: 65000

cv_pathfinder_regions:
  - name: AVD_Land_West
    id: 42
    description: AVD Region
    sites:
      - name: Site422
        id: 422
        location: Somewhere

bgp_peer_groups:
  wan_overlay_peers:
    password: "htm4AZe9mIQOO1uiMuGgYQ=="
    listen_range_prefixes:
      - 192.168.255.0/24

wan_route_servers:
  - hostname: cv-pathfinder-pathfinder
    vtep_ip: 10.10.10.10
    path_groups:
      - name: INET
        interfaces:
          - name: Ethernet1
            public_ip: 192.168.55.55

wan_ipsec_profiles:
  control_plane:
    shared_key: ABCDEF1234567890
  data_plane:
    shared_key: ABCDEF1234567890666

wan_router:
  defaults:
    loopback_ipv4_pool: 192.168.42.0/24
    vtep_loopback_ipv4_pool: 192.168.255.0/24
    wan_role: client
  nodes:
    - name: missing-wan-control-load-balance-policy
      cv_pathfinder_region: AVD_Land_West
      cv_pathfinder_site: Site422
      id: 1
      l3_interfaces:
        - name: Ethernet1
          wan_carrier: ATT
          ip_address: dhcp

wan_path_groups:
  - name: INET
    id: 101

wan_carriers:
  - name: ATT
    path_group: INET
    trusted: true

wan_virtual_topologies:
  control_plane_virtual_topology:
    name: CUSTOM-CP-POLICY
    path_groups:
      - names: [INTERNET]
        preference: preferred
      - names: [MPLS]
        preference: alternate
    lowest_hop_count: true
    constraints:
      jitter: 5
  vrfs:
    - name: PROD
      wan_vni: 42
  policies:
    - name: DEFAULT-POLICY
      default_virtual_topology:
        drop_unmatched: true
      application_virtual_topologies:
        - application_profile: TEST
          path_groups:
            - names: [INET]
          internet_exit:
            policy: ZSCALER-EXIT-POLICY-1
          id: 42
        - application_profile: TEST2
          path_groups:
            - names: [INET]
          internet_exit:
            policy: ZSCALER-EXIT-POLICY-2
          id: 43

application_classification:
  application_profiles:
    - name: TEST
    - name: TEST2

cv_pathfinder_internet_exit_policies:
  - name: ZSCALER-EXIT-POLICY-1
    type: zscaler
    zscaler:
      domain_name: test.local
      ipsec_key_salt: THIS_SHOULD_BE_VAULTED
  - name: ZSCALER-EXIT-POLICY-2
    fallback_to_system_default: false
    type: zscaler
    zscaler:
      domain_name: test.local
      ipsec_key_salt: THIS_SHOULD_BE_VAULTED

expected_error_message: >-
  The WAN control-plane load-balance policy is empty. Make sure at least one path-group can be used in the policy
