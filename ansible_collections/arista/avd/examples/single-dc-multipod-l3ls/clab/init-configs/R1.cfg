hostname R1
!
no aaa root
!
username arista privilege 15 role network-admin secret arista
!
vrf instance MGMT
!
ip name-server vrf MGMT 8.8.8.8
dns domain avd.lab
!
platform tfa
   personality arfa
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org
ntp server vrf MGMT 1.pool.ntp.org
ntp server vrf MGMT 2.pool.ntp.org
!
service routing protocols model multi-agent
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Ethernet1
   description Peering to dc1-leaf2b
   no switchport
   ip address 10.1.5.1/31
!
interface Loopback0
   description BGP Router ID
   ip address 192.168.0.1/32
!
interface Loopback1
   description External Network
   ip address 10.10.10.10/24
!
interface Management1
   vrf MGMT
      ip address 172.16.1.27/24
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 172.16.1.1
!
ip name-server vrf MGMT 8.8.8.8
!
router bgp 65534
   router-id 192.168.0.1
   neighbor 10.1.5.0 remote-as 65299
   neighbor 10.1.5.0 description Peering to dc1-leaf2b
   !
   address-family ipv4
      neighbor 10.1.5.0 activate
      network 10.10.10.0/24
!
end
