aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - 172.16.1.5:9910
  - 172.16.1.6:9910
  - 172.16.1.7:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_dc1-spine1_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 192.168.103.40/31
  metadata:
    peer: dc1-spine1
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_dc1-spine2_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 192.168.103.44/31
  metadata:
    peer: dc1-spine2
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_dc1-spine3_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 192.168.103.48/31
  metadata:
    peer: dc1-spine3
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_dc1-spine4_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 192.168.103.52/31
  metadata:
    peer: dc1-spine4
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
hostname: dc1-ss1
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 192.168.1.1
ip_routing: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.101.201/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.1.25/24
  type: oob
  gateway: 172.16.1.1
metadata:
  is_deployed: true
  platform: cEOS
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 0.pool.ntp.org
    preferred: true
  vrf: MGMT
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.101.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 1200
    min_rx: 1200
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 192.168.101.201
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 192.168.103.41
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Ethernet1
  - ip_address: 192.168.103.45
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Ethernet1
  - ip_address: 192.168.103.49
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65002'
    metadata:
      peer: dc1-spine3
    description: dc1-spine3_Ethernet1
  - ip_address: 192.168.103.53
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65002'
    metadata:
      peer: dc1-spine4
    description: dc1-spine4_Ethernet1
  - ip_address: 192.168.101.11
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65001'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 192.168.101.12
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65001'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Loopback0
  - ip_address: 192.168.101.13
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65002'
    metadata:
      peer: dc1-spine3
    description: dc1-spine3_Loopback0
  - ip_address: 192.168.101.14
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65002'
    metadata:
      peer: dc1-spine4
    description: dc1-spine4_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.16.1.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
