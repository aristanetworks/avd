---
# Please note, comments below are intended for site documentation only
mgmt_gateway: 172.16.1.1 # (1)!

bgp_as: 65001 # (2)!

bgp_distance: # (3)!
  external_routes: 20
  internal_routes: 200
  local_routes: 200

# P router group
p:
  # Definition of default values that will be configured to all nodes defined in this group
  defaults:
    platform: cEOSLab # (4)!
    loopback_ipv4_pool: 10.255.0.0/27 # (5)!
    isis_system_id_prefix: '0000.0000' # (6)!
  # Definition of nodes contained in this group.
  # Specific configuration of device must take place under the node definition. Each node inherits all values defined under 'defaults'
  nodes: # (7)!
    - name: p1 # (8)!
      id: 1 # (9)!
      mgmt_ip: 172.16.1.11/24 # (10)!
    - name: p2
      id: 2
      mgmt_ip: 172.16.1.12/24
    - name: p3
      id: 3
      mgmt_ip: 172.16.1.13/24
    - name: p4
      id: 4
      mgmt_ip: 172.16.1.14/24

# PE router group
pe:
  defaults:
    # Set the relevant platform as each platform has different default values in Ansible AVD
    platform: cEOSLab # (1)!
    # Pool of IPv4 addresses to configure interface Loopback0 used for BGP EVPN sessions
    loopback_ipv4_pool: 10.255.1.0/27 # (2)!
    virtual_router_mac_address: 00:1c:73:00:dc:00 # (3)!
    mpls_route_reflectors: [rr1, rr2] # (4)!
    # ISIS NET system id prefix
    isis_system_id_prefix: '0000.0001' # (5)!
    spanning_tree_mode: none # (6)!

  node_groups: # (7)!
    - group: WAN1-PE1-2
      nodes:
        - name: pe1
          id: 1
          mgmt_ip: 172.16.1.101/24
        - name: pe2
          id: 2
          mgmt_ip: 172.16.1.102/24

    - group: WAN1-PE3
      nodes:
        - name: pe3
          id: 3
          mgmt_ip: 172.16.1.103/24

# RR router group
rr:
  defaults:
    platform: cEOSLab
    spanning_tree_mode: none
    loopback_ipv4_pool: 10.255.2.0/27
    mpls_route_reflectors: [ rr1, rr2 ] # (1)!
    isis_system_id_prefix: '0000.0002'
  node_groups:
    - group: WAN1_RR1-2
      nodes:
        - name: rr1
          id: 1
          mgmt_ip: 172.16.1.151/24
        - name: rr2
          id: 2
          mgmt_ip: 172.16.1.152/24

# As MPLS-VPN WAN networks are often not pure l3ls-topologies, but arbitrary mesh topologies/hub-and-spoke, etc, the l3ls-evpn method
# of defining underlay topology on the nodes/node-defaults with uplink_switches, uplink_interfaces and uplink_switch_interfaces is
# substituted for this free-standing data model of core_interfaces, where all p2p underlay links in the topology are defined.

core_interfaces:
  p2p_links_ip_pools: # (1)!
    - name: core_pool # (2)!
      ipv4_pool: 10.255.3.0/24
  p2p_links_profiles:
    - name: core_profile # (3)!
      isis_metric: 50
      ip_pool: core_pool
      isis_circuit_type: level-2
      isis_authentication_mode: md5
      isis_authentication_key: $1c$sTNAlR6rKSw=
  p2p_links: # (4)!
    - nodes: [ pe1, p1 ] # (5)!
      id: 1 # (6)!
      interfaces: [ Ethernet1, Ethernet1 ]
      profile: core_profile # (7)!
    - nodes: [ pe1, p2 ]
      id: 2
      interfaces: [Ethernet2, Ethernet2]
      profile: core_profile
    # PE2 links
    - nodes: [pe2, p2]
      id: 3
      interfaces: [Ethernet1, Ethernet1]
      profile: core_profile
    - nodes: [pe2, p1]
      id: 4
      interfaces: [Ethernet2, Ethernet2]
      profile: core_profile
    # P1 links
    # The rest of the P1/P2 links are defined under PE1/PE2/RR1/RR2 links
    - nodes: [p1, p2]
      id: 5
      interfaces: [Ethernet4, Ethernet4]
      profile: core_profile
    # RR1 links
    - nodes: [rr1, p1]
      id: 6
      interfaces: [Ethernet3, Ethernet3]
      profile: core_profile
    - nodes: [rr1, p3]
      id: 7
      interfaces: [Ethernet2, Ethernet2]
      profile: core_profile
    - nodes: [rr1, rr2]
      id: 8
      interfaces: [Ethernet4, Ethernet4]
      profile: core_profile
    # RR2 links
    - nodes: [rr2, p2]
      id: 9
      interfaces: [Ethernet3, Ethernet3]
      profile: core_profile
    - nodes: [rr2, p4]
      id: 10
      interfaces: [Ethernet2, Ethernet2]
      profile: core_profile
    # P3 links
    - nodes: [p3, p4]
      id: 11
      interfaces: [Ethernet4, Ethernet4]
      profile: core_profile
    # PE3 links
    - nodes: [pe3, p3]
      id: 12
      interfaces: [Ethernet1, Ethernet1]
      profile: core_profile
    - nodes: [pe3, p4]
      id: 13
      interfaces: [Ethernet3, Ethernet3]
      profile: core_profile
