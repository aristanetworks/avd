---
### group_vars/DC1.yml

custom_structured_configuration_aaa_authentication:
  policies:
    local:
      allow_nopassword: true

# local users
local_users:
  # Username with no password configured
  - name: ansible
    privilege: 15
    role: network-admin
    no_password: true

  # Username with a password
  - name: arista
    privilege: 15
    role: network-admin
    sha512_password: "$6$8OFgOTnr2RnFBu7w$ZCp//phfwcbdinBMxEFxZWNLxh0VwUVyvvKKXG5quq4D.bvs5CMbdaNjQ9bABjAVARr0LuE0G32Zrr0pGmDy00"

# OOB Management network default gateway
mgmt_gateway: 172.16.100.1
mgmt_interface: Management0

# dns servers.
name_servers:
  - 8.8.4.4
  - 8.8.8.8

# NTP Servers IP or DNS name, first NTP server will be preferred, and sourced from Management VRF
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: time.google.com
    - name: pool.ntp.org

# Establish exec/enable role when logging in to switch
custom_structured_configuration_aaa_authorization:
  exec:
    default: local
