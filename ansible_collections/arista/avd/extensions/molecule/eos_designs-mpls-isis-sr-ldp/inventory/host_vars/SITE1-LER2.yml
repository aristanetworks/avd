# Hostvars for this node has bgp_mesh_pes: true so this device will setup BGP peerings to all other PEs as well as the RRs.
# Should always be set fabric-wide but in this case we just need to test if it works.
bgp_mesh_pes: true

# Test when evpn_overlay_bgp_rtc is true
evpn_overlay_bgp_rtc: true

# Exercise a shared eBGP peer-group name with different settings on each edge node.
custom_structured_configuration_router_bgp:
  peer_groups:
    - name: DOCUMENTATION-EBGP-PEERS
      remote_as: '65101'
      update_source: Loopback0
      bfd: true
      send_community: all
