---
### 802.1x Global ###
# this needs to be in another test than dot1x host because
# we verify that PR 2764 is not happenign again
dot1x:
  system_auth_control: true
  protocol_bpdu_bypass: true
  protocol_lldp_bypass: true
  dynamic_authorization: true
  radius_av_pair:
    service_type: true
    framed_mtu: 1500
    lldp:
      system_name:
        enabled: true
      system_description:
        enabled: true
    dhcp:
      hostname:
        enabled: true
      parameter_request_list:
        enabled: true
      vendor_class_id:
        enabled: true
  aaa:
    unresponsive:
      action:
        traffic_allow: true
      phone_action:
        apply_cached_results: true
