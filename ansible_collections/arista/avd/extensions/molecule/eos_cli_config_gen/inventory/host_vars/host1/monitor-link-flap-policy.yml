---
monitor_link_flap_policy:
  profiles:
    - name: LFP2
      damping_penalty:
        decay:
          half_life: 5
          units: "seconds"
        mac_fault_local_penalty: 5
        mac_fault_remote_penalty: 10
        threshold:
          maximum: 5
          reuse: 2
          suppression: 100
    - name: LFP3
      damping_penalty:
        threshold:
    - name: LFP1
      max_flaps:
        flaps: 11
        time: 12
        violations: 5
        intervals: 10
    - name: LFP4
      max_flaps:
        flaps: 23
        time: 10
    - name: LFP5
      damping_penalty:
        threshold:
          reuse: 1
  default_profiles:
    - LFP3
    - LFP1
