---
snmp_server:
  engine_ids:
    local: 424242424242424242
    remotes:
      # TODO: make address as primary key
      # First one without IP should not be rendered
      # - id: 1234567890ABCDEF12
      - id: 6172697374615F6970
        address: 1.1.1.1
      - id: DEADBEEFCAFE123456
        address: 2.2.2.2
        udp_port: 1337
      # These next two are needed to configure non localized remote users defined below
      - id: 424242424242DEAD
        address: 42.42.42.42
      - id: 424242424242DEAD6666
        address: 42.42.42.42
        udp_port: 666
  contact: DC1_OPS
  location: DC1
  communities:
    - name: SNMP-COMMUNITY-1
      access: ro
      access_list_ipv4:
        name: onur
    - name: SNMP-COMMUNITY-2
      access: rw
      access_list_ipv4:
        name: SNMP-MGMT
      access_list_ipv6:
        name: SNMP-MGMT
      view: VW-READ
    - name: SNMP-COMMUNITY-3
  local_interfaces:
    - name: Management1
      vrf: MGMT
    - name: Loopback0
    - name: Loopback12
      vrf: Tenant_A_APP_Zone
    - name: Ethernet1
      vrf: AAA
    - name: Ethernet2
      vrf: abc
  ipv4_acls:
    - name: SNMP-MGMT
      vrf: MGMT
    - name: onur
  ipv6_acls:
    - name: SNMP-MGMT
      vrf: MGMT
    - name: onur_v6
  views:
    - name: VW-EXCLUDED
      mib_family_name: iso
      included: false
    - name: VW-WRITE
      mib_family_name: iso
      included: true
    - name: VW-READ
      mib_family_name: iso
      included: true
  groups:
    - name: GRP-READ-ONLY
      version: v3
      authentication: priv
      read: v3read
    - name: GRP-READ-WRITE
      version: v3
      authentication: auth
      read: v3read
      write: v3write
  users:
    - name: USER-READ-NO-AUTH-NO-PRIV
      group: GRP-READ-ONLY
      version: v3
    - name: USER-READ-AUTH-NO-PRIV
      group: GRP-READ-ONLY
      version: v3
      auth: sha
      auth_passphrase: clearPassword
    - name: USER-READ-AUTH-PRIV
      group: GRP-READ-ONLY
      version: v3
      auth: sha
      auth_passphrase: clearPassword
      priv: aes
      priv_passphrase: clearPassword
    - name: USER-READ-NO-AUTH-NO-PRIV-LOC
      group: GRP-READ-ONLY
      version: v3
      localized: 424242424242424242
    - name: USER-READ-AUTH-NO-PRIV-LOC
      group: GRP-READ-ONLY
      version: v3
      auth: sha
      auth_passphrase: 8da526cd35b9ea9b42d819036f7fad058576ea0a
      localized: 424242424242424242
    - name: USER-READ-AUTH-PRIV-LOC
      group: GRP-READ-ONLY
      version: v3
      auth: sha
      auth_passphrase: 8da526cd35b9ea9b42d819036f7fad058576ea0a
      priv: aes
      priv_passphrase: 8da526cd35b9ea9b42d819036f7fad05
      localized: 424242424242424242
    - name: USER-WRITE
      group: GRP-READ-WRITE
      version: v3
      auth: sha
      auth_passphrase: clearPassword
      priv: aes
      priv_passphrase: clearPassword
    - name: REMOTE-USER-IP-ONLY
      group: GRP-REMOTE
      version: v3
      remote_address: 42.42.42.42
    - name: REMOTE-USER-IP-PORT
      group: GRP-REMOTE
      version: v3
      remote_address: 42.42.42.42
      udp_port: 666
    - name: REMOTE-USER-IP-LOCALIZED
      group: GRP-REMOTE
      version: v3
      remote_address: 42.42.42.42
      localized: DEADBEEFCAFE123456
      auth: sha
      auth_passphrase: DEADBEEFCAFE123456ABC1234321AB1233456778
      priv: aes
      priv_passphrase: DEADBEEFCAFE123456ABC1234321AB12334567
    - name: USER-AUTH-TYPE7
      group: GRP-READ
      version: v3
      localized: f5717f500000bb417100
      auth: md5
      auth_passphrase_type: 7
      auth_passphrase: 00564605530A0F005D71484C59185615175A08542C297778363175460240025252
    - name: USER-AUTH-PRIV-TYPE0
      group: GRP-WRITE
      version: v3
      localized: f5717f500000bb417100
      auth: sha
      auth_passphrase_type: 0
      auth_passphrase: DEADBEEFCAFE123456ABC1234321AB1233456778
      priv: aes
      priv_passphrase_type: 0
      priv_passphrase: DEADBEEFCAFE123456ABC1234321AB1233456778
    - name: USER-AUTH-PRIV-WITHOUT-LOCALIZED
      group: GRP-WRITE
      version: v3
      auth: sha
      # auth_passphrase_type and priv_passphrase_type will ignore as localized is not set
      auth_passphrase_type: 7
      auth_passphrase: 00564605530A0F005D71484C5918561517
      priv: aes256
      priv_passphrase_type: 7
      priv_passphrase: 00564605530A0F005D71484C59185615175
    - name: USER-LOCALIZED-TYPE7
      group: GRP-WRITE
      version: v3
      localized: f5717f500000bb417100
      auth: sha
      auth_passphrase_type: 7
      auth_passphrase: 00534602530E5A075622181F5B4A5C11435C5A532F7A227B6A33201004410753015B5D04040F054C4E
      priv: aes
      priv_passphrase_type: 7
      priv_passphrase: 00054156070F5C070E771C1A5A1C561410090F522F2D27786330211106465A5901
    - name: USER-REMOTE-TYPE7
      group: GRP-REMOTE
      version: v3
      remote_address: 10.1.1.1
      auth: md5
      localized: f5717f500000bb417100
      auth_passphrase_type: 7
      auth_passphrase: 00511103025A52565F754A1D0F1B0046455A08072F7E707E656D7B4054425655525D0A04035C544E42
      priv: des
      priv_passphrase_type: 7
      priv_passphrase: 00054156070F5C070E771C1A5A1C561410090F522F2D27786330211106465A5901
  hosts:
    - host: 10.6.75.121
      vrf: MGMT
      version: 1
      community: SNMP-COMMUNITY-1
    - host: 10.6.75.121
      vrf: MGMT
      version: 2c
      community: SNMP-COMMUNITY-2
    - host: 10.6.75.122
      vrf: MGMT
      # version: 2c should be autodetected based on community key.
      community: SNMP-COMMUNITY-2
    - host: 10.6.75.99
      vrf: MGMT
      version: 3
      users:
        - username: USER-READ-AUTH-NO-PRIV
          authentication_level: auth
        - username: USER-WRITE
          authentication_level: auth
    - host: 10.6.75.100
      vrf: MGMT
      # version: 3 should be autodetected based on users key.
      users:
        - username: USER-READ-AUTH-PRIV
          authentication_level: priv
  traps:
    enable: true
    snmp_traps:
      - name: bridge
      - name: bridge arista-mac-age
        enabled: false
      - name: mpls
      - name: bgp
      - name: bgp arista-backward-transition
        enabled: false
      - name: lldp
      - name: msdp backward-transition
      - name: msdp established
      - name: snmp link-down
      - name: snmpConfigManEvent
  extensions:
    - oid: ".111.3.6.1.4.1.99999.2.1.0"
      path: "flash:/test1.py"
      one_shot: true
    - oid: ".2.3.6.1.4.1.99999.2.1.0"
      path: "flash:/test2.py"
    - oid: ".1.3.6.1.4.1.30065.4.101.100.1.1"
      path: "flash:/monitorConnectivity.py"
    - oid: ".1.3.6.1.4.1.30065.4.101.100.2.33"
      path: "flash:/test.py"
  vrfs:
    - name: default
      enable: false
    - name: MGMT
      enable: true
    - name: lower_case
      enable: true
  ifmib_ifspeed_shape_rate: true
