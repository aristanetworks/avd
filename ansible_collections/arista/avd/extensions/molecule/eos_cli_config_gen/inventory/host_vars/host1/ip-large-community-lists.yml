---
### IP large community lists ###
ip_large_community_lists:
  - name: IP_L_CL_TEST1
    entries:
      - action: permit
        large_communities: ["64496:1001:1001", "65536:1002:1002"]
      - action: deny
        large_communities: ["64496:1010:1010"]
      - action: permit
        regexp: 65536:*:*
  - name: IP_L_CL_TEST2
    entries:
      - action: deny
        large_communities: ["65536:1003:1003"]
  - name: IP_L_RE_TEST1
    entries:
      - action: permit
        regexp: ^$
  - name: IP_L_RE_TEST2
    entries:
      - action: deny
        regexp: ^64496:*:*
      - action: deny
        large_communities: ["64497:1004:1004", "64497:1005:1005"]
  # Test for sort with ignore_case: false
  - name: aa_test3
    entries:
      - action: deny
        regexp: ^65536:*:*
