### VRFs ###
# Exercises eos_config_future.new_ip_routing_vrfs_separator: a leading `!`
# should appear before the first VRF-scoped `ip routing` line because no
# global `ip_routing` / `ip_routing_ipv6_interfaces` directive is defined
# on this host.

vrfs:
  - name: MGMT
    ip_routing: false
  - name: TENANT_A
    ip_routing: true
  - name: TENANT_B
    ip_routing_ipv6_interfaces: true
