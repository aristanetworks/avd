---
management_interfaces:
  - name: Management1
    description: OOB_MANAGEMENT
    vrf: MGMT
    ip_address: 10.73.255.122/24
    gateway: 10.73.255.2
    type: oob
    redundancy:
      fallback_delay: infinity
      monitor:
        neighbor:
          ipv6_address: "1:1:1:1:1:1:1:1"
          interval: 101
          multiplier: 3
    ipv6_nd:
      ra:
        disabled: true
        rx_accept:
          default_route: true
          route_preference: true
        dns_servers: 
          servers:
            - address: cafe::cafe:64
            - address: ca::ca:64
      managed_config_flag: true
      prefixes:
        - ipv6_prefix: 2345:ABCD:3FE0::1/96
          valid_lifetime: infinite
          preferred_lifetime: 50
          no_autoconfig_flag: true
        - ipv6_prefix: 2345:ABCD:3FE0::2/96
          valid_lifetime: 50
          preferred_lifetime: infinite
          no_autoconfig_flag: false
        - ipv6_prefix: 2345:ABCD:3FE0::3/96
          valid_lifetime: 100000
          no_autoconfig_flag: true

  - name: Management0
    ip_address: 10.1.1.1
    mac_address: 00:1c:73:00:00:aa
    redundancy:
      fallback_delay: 100
      monitor:
        link_state: true
      supervisor_2:
        primary_management_interface: Management2/1
        backup_management_interfaces:
          - Management2/2
          - Management1/1
      supervisor_1:
        primary_management_interface: Management1/1
        backup_management_interfaces:
          - Management1/2
          - Management2/1
  - name: Vlan123
    description: inband_management
    vrf: default
    ip_address: 10.73.0.123/24
    ipv6_addresses:
      - 2001:db8:abcd:1234::2/64
      - 2001:db8:abcd:1234::1/64
    # This is to test that the default route is only rendered when ip_address is dhcp and dhcp_client_accept_default_route is true
    dhcp_client_accept_default_route: true
    gateway: 10.73.0.1
    type: inband
    mtu: 1500
    eos_cli: "ip virtual-router address 10.73.0.1"
  - name: Management42
    shutdown: true
    speed: forced 1000full
    lldp:
      transmit: false
      receive: false
      ztp_vlan: 666
    redundancy:
      fallback_delay: infinity
      monitor:
        neighbor:
          ipv6_address: "1:1:1:1:1:1:1:1"
    ipv6_address_auto_config: true
    ipv6_enable: true
    ip_address: dhcp
    dhcp_client_accept_default_route: true
  # IPv6 ND new structure with cache and other_config_flag
  - name: Management3
    description: IPv6 ND new structure test
    shutdown: false
    vrf: MGMT
    ipv6_enable: true
    ipv6_addresses:
      - 2001:db8:100::1/64
    ipv6_nd:
      ra:
        disabled: true
        rx_accept:
          default_route: true
          route_preference: true
      managed_config_flag: true
      other_config_flag: true
      cache:
        dynamic_capacity: 1500
        expire: 350
        refresh_always: true
      prefixes:
        - ipv6_prefix: 2001:db8:100::/64
          valid_lifetime: 300
          preferred_lifetime: 150
          no_autoconfig_flag: true
