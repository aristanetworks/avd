---
### Name Servers ###
ip_name_server:
  vrfs:
    - name: default
      servers:
        - ip_address: 10.10.128.10
        # no VRF priority
        - ip_address: 10.10.129.10
          priority: 0
        - ip_address: 2001:db8::1
        - ip_address: 2001:db8::2
          priority: 0
        - ip_address: 2001:db8::3
          priority: 1
    - name: mgmt
      servers:
        - ip_address: 10.10.128.10
        - ip_address: 2001:db8::1
        - ip_address: 2001:db8::2
          priority: 1
    # Test for sort with ignore_case: false
    - name: TEST
      servers:
        - ip_address: 4.4.4.4
        - ip_address: 10.10.128.10
          priority: 3
        - ip_address: 2001:db8::2
          priority: 3
