---
### Logging ###
logging:
  console: disabled
  monitor: debugging
  facility: syslog
  repeat_messages: false
  trap: alerts
  buffered:
    level: disabled
  event:
    global_link_status: true
  synchronous:
    level: disabled
  format:
    hostname: ipv4
  # Test to check table created for source_interface without vrfs key.
  source_interface: Ethernet1
