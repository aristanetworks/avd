---
router_ospfv3:
  router_id: 1.1.1.1
  passive_interface_default: true
  auto_cost_reference_bandwidth: 1000
  address_family_ipv4:
    enabled: true
    redistribute:
      bgp:
        enabled: true
        include_leaked: true
        route_map: map1
      connected:
        enabled: true
        include_leaked: true
        route_map: map1
      isis:
        enabled: true
        level: level-1
        include_leaked: true
        route_map: map1
      ospfv3:
        enabled: true
        route_map: map1
        match_external:
          enabled: true
          route_map: map1
        match_nssa_external:
          enabled: true
          route_map: map1
      static:
        enabled: true
        route_map: map1
  address_family_ipv6:
    enabled: true
    redistribute:
      bgp:
        enabled: true
        include_leaked: true
        route_map: map1
      connected:
        enabled: true
        include_leaked: true
        route_map: map1
      isis:
        enabled: true
        level: level-1
        include_leaked: true
        route_map: map1
      ospfv3:
        enabled: true
        route_map: map1
        match_external:
          enabled: true
          route_map: map1
        match_nssa_external:
          enabled: true
          route_map: map1
      static:
        enabled: true
        route_map: map1
      dhcp:
        enabled: true
        route_map: map1
  vrfs:
    - name: data
      # These settings will not get rendered as address family level settings gets precedence.
      router_id: 2.2.2.2
      passive_interface_default: true
      auto_cost_reference_bandwidth: 100
      address_family_ipv4:
        enabled: true
        router_id: 1.1.1.1
        passive_interface_default: true
        auto_cost_reference_bandwidth: 1000
    - name: MGMT
      router_id: 2.2.2.2
      auto_cost_reference_bandwidth: 100
      passive_interface_default: true
      address_family_ipv6:
        enabled: true
        redistribute:
          bgp:
            enabled: true
            include_leaked: true
            route_map: map1
          connected:
            enabled: true
            include_leaked: true
            route_map: map1
          isis:
            enabled: true
            level: level-1
            include_leaked: true
            route_map: map1
          ospfv3:
            enabled: true
            route_map: map1
            match_external:
              enabled: true
              route_map: map1
            match_nssa_external:
              enabled: true
              route_map: map1
          static:
            enabled: true
            route_map: map1
          dhcp:
            enabled: true
            route_map: map1
