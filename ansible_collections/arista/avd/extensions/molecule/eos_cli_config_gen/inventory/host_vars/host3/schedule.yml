---
schedule:
  config:
    max_concurrent_jobs: 3
  jobs:
    # at <time> interval <N> — no date (covers doc template line 34 True with date absent)
    - name: at_interval_nodate
      at:
        time: "10:00:00"
        interval: 60
      max_log_files: 1
      command: show clock
    - name: at_time_only
      at:
        time: "12:00:00"
        once: true
      max_log_files: 1
      command: show interfaces
