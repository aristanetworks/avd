---
# Tests for opsfv3 redistribution
router_ospfv3:
  router_id: 1.1.1.1
  graceful_restart:
    enabled: true
    grace_period: 30
  graceful_restart_helper: true
  bfd_default: true
  bfd_adjacency_state_any: true
  passive_interface_default: true
  auto_cost_reference_bandwidth: 1000
  address_family_ipv4:
    enabled: true
    router_id: 2.2.2.2
    bfd_default: true
    bfd_adjacency_state_any: true
    auto_cost_reference_bandwidth: 2000
    passive_interface_default: true
    graceful_restart:
      enabled: true
      grace_period: 4
    graceful_restart_helper: true
    redistribute:
      ospfv3:
        leaked:
          enabled: true
          match_internal: true
          route_map: map1
        leaked_match_external:
          enabled: true
          route_map: map1
        leaked_match_nssa_external:
          enabled: true
          route_map: map1
  address_family_ipv6:
    enabled: true
    router_id: 3.3.3.3
    bfd_default: true
    auto_cost_reference_bandwidth: 2000
    passive_interface_default: true
    graceful_restart:
      enabled: true
    graceful_restart_helper: false
    redistribute:
      ospfv3:
        leaked:
          enabled: true
          match_internal: true
          route_map: map1
        leaked_match_external:
          enabled: true
          route_map: map1
        leaked_match_nssa_external:
          enabled: true
          route_map: map1
