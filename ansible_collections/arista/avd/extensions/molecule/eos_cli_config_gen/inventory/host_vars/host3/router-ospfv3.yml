---
# Tests for opsfv3 redistribution
router_ospfv3:
  router_id: 1.1.1.1
  bfd_default: true
  bfd_adjacency_state_any: true
  passive_interface_default: true
  auto_cost_reference_bandwidth: 1000
  address_family_ipv4:
    enabled: true
    router_id: 2.2.2.2
    bfd_default: true
    bfd_adjacency_state_any: true
    auto_cost_reference_bandwidth: 2000
    passive_interface_default: true
    lsa:
      limit: 20000
      disabled_time: 30
      incident_count:
        limit: 10
        clear_timeout: 20
      warning_limit: 80
      exceed_action_warn: true # won't render as incident_count is set
    redistribute:
      ospfv3:
        leaked:
          enabled: true
          match_internal: true
          route_map: map1
        leaked_match_external:
          enabled: true
          route_map: map1
        leaked_match_nssa_external:
          enabled: true
          route_map: map1
  address_family_ipv6:
    enabled: true
    router_id: 3.3.3.3
    bfd_default: true
    auto_cost_reference_bandwidth: 2000
    passive_interface_default: true
    lsa:
      limit: 20000
      disabled_time: 30
      incident_count:
        limit: 10
        clear_timeout: 20
      warning_limit: 80
      exceed_action_warn: true # won't render as incident_count is set
    redistribute:
      ospfv3:
        leaked:
          enabled: true
          match_internal: true
          route_map: map1
        leaked_match_external:
          enabled: true
          route_map: map1
        leaked_match_nssa_external:
          enabled: true
          route_map: map1
