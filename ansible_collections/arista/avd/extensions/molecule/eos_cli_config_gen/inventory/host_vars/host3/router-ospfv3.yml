---
# Tests for opsfv3 redistribution
router_ospfv3:
  router_id: 1.1.1.1
  graceful_restart:
    enabled: true
    grace_period: 30
  graceful_restart_helper: true
  bfd_default: true
  bfd_adjacency_state_any: true
  passive_interface_default: true
  auto_cost_reference_bandwidth: 1000
  # Shared timers are overridden by the IPv4 address family timers below.
  timers:
    spf:
      delay:
        initial: 400
        min_hold_time: 1400
        max_wait_time: 7000
    lsa:
      rx:
        min_interval: 300
      tx:
        delay:
          initial: 400
          min: 800
          max: 2000
  address_family_ipv4:
    enabled: true
    router_id: 2.2.2.2
    bfd_default: true
    bfd_adjacency_state_any: true
    auto_cost_reference_bandwidth: 2000
    passive_interface_default: true
    graceful_restart:
      enabled: true
      grace_period: 4
    # Verify IPv4 timers suppress shared timers when IPv6 has no override.
    timers:
      spf:
        delay:
          initial: 900
          min_hold_time: 3000
          max_wait_time: 9000
      lsa:
        rx:
          min_interval: 600
        tx:
          delay:
            initial: 700
            min: 1200
            max: 3000
    redistribute:
      ospfv3:
        leaked:
          enabled: true
          match_internal: true
          route_map: map1
        leaked_match_external:
          enabled: true
          route_map: map1
        leaked_match_nssa_external:
          enabled: true
          route_map: map1
  address_family_ipv6:
    enabled: true
    router_id: 3.3.3.3
    bfd_default: true
    auto_cost_reference_bandwidth: 2000
    passive_interface_default: true
    graceful_restart:
      enabled: true
    redistribute:
      ospfv3:
        leaked:
          enabled: true
          match_internal: true
          route_map: map1
        leaked_match_external:
          enabled: true
          route_map: map1
        leaked_match_nssa_external:
          enabled: true
          route_map: map1
  vrfs:
    - name: SAME_HELPER
      graceful_restart:
        enabled: true
      graceful_restart_helper: true
      address_family_ipv4:
        enabled: true
        # Duplicate positive helper configuration is rendered only at the address-family level.
        graceful_restart_helper: true
