---
### VLAN Interfaces ###
vlan_interfaces:
  - name: Vlan85
    description: SVI Description
    ip_address: 10.10.84.1/24
    bfd:
      echo: true
      interval: 500
      min_rx: 500
      multiplier: 5
    # Test isis auth both sha
    isis_enable: "EVPN_UNDERLAY"
    isis_hello_padding: false
    isis_authentication:
      both:
        key_type: 0
        key: password
        mode: sha
        sha:
          key_id: 2
    mpls:
      ip: false
      ldp:
        igp_sync: false
    ospfv3:
      ipv4:
        area: 0.0.0.0
      ipv6:
        area: 1000
      passive_interface: true
      network_point_to_point: true

  - name: Vlan1000
    description: Vlan with minimal ospfv3 configurations
    ospfv3:
      ipv4:
        area: 1000
      ipv6:
        area: 0.0.0.0

  - name: Vlan1001
    description: Test VLAN with both ospfv3 and ipv6_ospf configurations
    ospfv3:
      ipv4:
        area: 1000
      ipv6:
        area: 0.0.0.0
      passive_interface: true
      network_point_to_point: true
    ipv6_ospf:
      process:
        id: 100
        area: 0.0.0.29
