---
### VLAN Interfaces ###
vlan_interfaces:
  - name: Vlan85
    description: SVI Description
    ip_address: 10.10.84.1/24
    bfd:
      echo: true
      interval: 500
      min_rx: 500
      multiplier: 5
    # Test isis auth both sha
    isis_enable: "EVPN_UNDERLAY"
    isis_hello_padding: false
    isis_authentication:
      both:
        key_type: 0
        key: password
        mode: sha
        sha:
          key_id: 2
    mpls:
      ip: false
