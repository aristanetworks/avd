---
maintenance:
  default_interface_profile: IP1
  default_bgp_profile: BP1
  default_unit_profile: UP1
  interface_profiles:
    - name: IP1
      rate_monitoring:
        load_interval: 10
        threshold: 500
      shutdown:
        max_delay: 300
  bgp_profiles:
    - name: bgp2
    - name: BP1
      initiator:
        route_map_inout: RM-MAINTENANCE
    - name: BP2
      initiator:
        route_map_inout: RM-MAINTENANCE2
    - name: BP3
      initiator:
        route_map_inout: RM-MAINTENANCE3
    - name: BP4
      initiator:
        route_map_in: RM-MAINTENANCE-IN
    - name: BP5
      initiator:
        route_map_out: RM-MAINTENANCE-OUT
    - name: BP6
      initiator:
        route_map_in: RM-MAINTENANCE-IN
        route_map_out: RM-MAINTENANCE-OUT
    - name: BP7
      initiator:
        route_map_inout: RM-MAINTENANCE-INOUT
        route_map_in: RM-MAINTENANCE-IN
        route_map_out: RM-MAINTENANCE-OUT
  unit_profiles:
    - name: UP1
      on_boot:
        duration: 900
    - name: UP2
      on_boot:
        duration: 600
  units:
    - name: UNIT1
      profile: UP1
      groups:
        bgp_groups:
          - bgp_group
          - BGP_GROUP_1
          - BGP_GROUP_2
        interface_groups:
          - inrerface_group
          - INTERFACE_GROUP_1
    # Adding a unit with no profile for issue/2488
    - name: System
      quiesce: false
    - name: UNIT2
      quiesce: true
