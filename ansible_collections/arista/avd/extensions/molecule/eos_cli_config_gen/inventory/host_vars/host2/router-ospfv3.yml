---
router_ospfv3:
  bfd_default: true
  bfd_adjacency_state_any: true
  passive_interface_default: true
  lsa:
    limit: 20000
    disabled_time: 30
    incident_count:
      limit: 10
      clear_timeout: 20
    warning_limit: 80
    exceed_action_warn: true # won't render as incident_count is set
  address_family_ipv4:
    enabled: true
    redistribute:
      bgp:
        enabled: true
      connected:
        enabled: true
      isis:
        enabled: true
      ospfv3:
        leaked:
          enabled: true
      static:
        enabled: true
  address_family_ipv6:
    enabled: true
    redistribute:
      bgp:
        enabled: true
      dhcp:
        enabled: true
      connected:
        enabled: true
      isis:
        enabled: true
      ospfv3:
        leaked:
          enabled: true
      static:
        enabled: true
  vrfs:
    - name: FULL
      bfd_default: true
      bfd_adjacency_state_any: true
      address_family_ipv4:
        enabled: true
        router_id: 3.3.3.3
        bfd_default: true
        bfd_adjacency_state_any: true
        auto_cost_reference_bandwidth: 500
        passive_interface_default: true
        lsa:
          limit: 5000
          warning_limit: 70
          exceed_action_warn: true
        redistribute:
          bgp:
            enabled: true
            include_leaked: true
          connected:
            enabled: true
            include_leaked: true
          isis:
            enabled: true
            include_leaked: true
            level: level-2
          ospfv3:
            leaked:
              enabled: true
              match_internal: true
              route_map: map2
            leaked_match_external:
              enabled: true
              route_map: map2
            leaked_match_nssa_external:
              enabled: true
              route_map: map2
      address_family_ipv6:
        enabled: true
        router_id: 4.4.4.4
        bfd_default: true
        bfd_adjacency_state_any: true
        auto_cost_reference_bandwidth: 500
        passive_interface_default: true
        lsa:
          limit: 6000
          disabled_time: 15
          incident_count:
            limit: 4
            clear_timeout: 12
          warning_limit: 75
          exceed_action_warn: true # won't render as incident_count is set
        redistribute:
          bgp:
            enabled: true
            include_leaked: true
          connected:
            enabled: true
            include_leaked: true
          isis:
            enabled: true
            include_leaked: true
            level: level-2
          ospfv3:
            leaked:
              enabled: true
              match_internal: true
              route_map: map2
            leaked_match_external:
              enabled: true
              route_map: map2
            leaked_match_nssa_external:
              enabled: true
              route_map: map2
    - name: data
      # These settings (auto_cost_reference_bandwidth) will not get rendered as address family level settings gets precedence.
      router_id: 2.2.2.2
      passive_interface_default: true
      auto_cost_reference_bandwidth: 100
      address_family_ipv4:
        enabled: true
        auto_cost_reference_bandwidth: 1000
        lsa:
          limit: 7000
          incident_count:
            limit: 3
            clear_timeout: 6
          warning_limit: 90
          exceed_action_warn: true # won't render as incident_count is set
        redistribute:
          bgp:
            enabled: true
            route_map: map1
          connected:
            enabled: true
            route_map: map1
          isis:
            enabled: true
            route_map: map1
          ospfv3:
            leaked:
              enabled: true
              route_map: map1
          static:
            enabled: true
            include_leaked: true
            route_map: map1
      address_family_ipv6:
        enabled: true
        auto_cost_reference_bandwidth: 1000
        lsa:
          limit: 8000
          warning_limit: 65
          exceed_action_warn: true
        redistribute:
          bgp:
            enabled: true
            route_map: map1
          connected:
            enabled: true
            route_map: map1
          isis:
            enabled: true
            route_map: map1
          ospfv3:
            leaked:
              enabled: true
              route_map: map1
          static:
            enabled: true
            route_map: map1
          dhcp:
            enabled: true
            route_map: map1
    - name: MGMT
      router_id: 2.2.2.2
      auto_cost_reference_bandwidth: 100
      passive_interface_default: true
      lsa:
        limit: 4000
        warning_limit: 75
        exceed_action_warn: true
      address_family_ipv4:
        enabled: true
        passive_interface_default: false
        lsa:
          limit: 4100
          disabled_time: 9
        redistribute:
          bgp:
            enabled: true
          connected:
            enabled: true
          isis:
            enabled: true
          ospfv3:
            leaked:
              enabled: true
          static:
            enabled: true
      address_family_ipv6:
        enabled: true
        passive_interface_default: true
        redistribute:
          bgp:
            enabled: true
          connected:
            enabled: true
          isis:
            enabled: true
          ospfv3:
            leaked:
              enabled: true
          static:
            enabled: true
          dhcp:
            enabled: true
    - name: Test
      address_family_ipv4:
        enabled: true
        router_id: 1.1.1.1
        redistribute:
          ospfv3:
            leaked:
              enabled: true
            leaked_match_external:
              enabled: true
            leaked_match_nssa_external:
              enabled: true
      address_family_ipv6:
        enabled: true
        passive_interface_default: true
        redistribute:
          ospfv3:
            leaked:
              enabled: true
            leaked_match_external:
              enabled: true
            leaked_match_nssa_external:
              enabled: true
    - name: Test_VRF
      router_id: 1.1.1.1
      passive_interface_default: true
      auto_cost_reference_bandwidth: 1000
      lsa:
        limit: 4500
        disabled_time: 7
        incident_count:
          limit: 2
          clear_timeout: 5
        exceed_action_warn: true # won't render as incident_count is set
    - name: WARN_ONLY
      lsa:
        limit: 8000
        warning_limit: 65
        exceed_action_warn: true
