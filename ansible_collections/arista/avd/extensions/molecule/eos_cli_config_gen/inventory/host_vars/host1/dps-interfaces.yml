---
### DPS interface ###

dps_interfaces:
  - name: Dps1
    description: Test DPS Interface
    shutdown: true
    mtu: 666
    ip_address: 192.168.42.42/24
    ipv6_nd:
      ra:
        disabled: true
        rx_accept:
          default_route: true
          route_preference: true
      managed_config_flag: true
      prefixes:
        - ipv6_prefix: 2345:ABCD:3FE0::1/96
          valid_lifetime: infinite
          preferred_lifetime: 50
          no_autoconfig_flag: true
        - ipv6_prefix: 2345:ABCD:3FE0::2/96
          valid_lifetime: 50
          preferred_lifetime: infinite
          no_autoconfig_flag: false
        - ipv6_prefix: 2345:ABCD:3FE0::3/96
          valid_lifetime: 100000
          no_autoconfig_flag: true
    flow_tracker:
      hardware: T3
      sampled: T2
    # Cannot test all combination of tcp_mss_ceiling with only one Dps interface
    # available
    tcp_mss_ceiling:
      ipv4: 666
      ipv6: 666
      direction: ingress
    # This is a dummy command
    eos_cli: |-
      load-interval 42
