---
router_bgp:
  as: 65006
  bgp:
    additional_paths:
      send: limit
      send_limit: 6
  redistribute:
    ospf:
      enabled: true
      include_leaked: true
      route_map: RM-BGP-OSPF
  address_family_ipv4:
    bgp:
      additional_paths:
        send: limit
        send_limit: 4
  address_family_ipv4_labeled_unicast:
    bgp:
      additional_paths:
        send: disabled
  address_family_ipv6:
    bgp:
      additional_paths:
        send: disabled
    redistribute:
      ospfv3:
        match_external:
          enabled: true
          route_map: RM-BGP-OSPFV3-EXTERNAL
  address_family_path_selection:
    bgp:
      additional_paths:
        send: limit
        send_limit: 5
  vrfs:
    - name: TENANT_B
      address_family_ipv6:
        bgp:
          additional_paths:
            install_ecmp_primary: true
