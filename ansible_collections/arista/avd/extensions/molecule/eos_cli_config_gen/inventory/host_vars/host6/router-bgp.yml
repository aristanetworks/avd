---
router_bgp:
  as: 65006
  bgp:
    additional_paths:
      send: limit
      send_limit: 6
  redistribute:
    ospf:
      enabled: true
      include_leaked: true
      route_map: RM-BGP-OSPF
  address_family_ipv4:
    bgp:
      additional_paths:
        send: limit
        send_limit: 4
    # Legacy address-family ordering also remains case-insensitive without the future knob.
    peer_groups:
      - name: IPV4-UNDERLAY-PEERS
        activate: true
      - name: evpn-overlay-peers
        activate: true
  address_family_ipv4_labeled_unicast:
    bgp:
      additional_paths:
        send: disabled
  address_family_ipv6:
    # Reuse the same pair to verify legacy IPv6 ordering.
    peer_groups:
      - name: IPV4-UNDERLAY-PEERS
        activate: true
      - name: evpn-overlay-peers
        activate: true
    bgp:
      additional_paths:
        send: disabled
    redistribute:
      ospfv3:
        match_external:
          enabled: true
          route_map: RM-BGP-OSPFV3-EXTERNAL
  address_family_path_selection:
    bgp:
      additional_paths:
        send: limit
        send_limit: 5
  vrfs:
    - name: TENANT_B
      address_family_ipv6:
        bgp:
          additional_paths:
            install_ecmp_primary: true
  # Without the future knob, retain case-insensitive order: evpn-overlay-peers, IPV4-UNDERLAY-PEERS.
  peer_groups:
    - name: IPV4-UNDERLAY-PEERS
      remote_as: "65002"
      description: IPv4 underlay peer group for legacy ordering
    - name: evpn-overlay-peers
      remote_as: "65001"
      description: EVPN overlay peer group for legacy ordering
