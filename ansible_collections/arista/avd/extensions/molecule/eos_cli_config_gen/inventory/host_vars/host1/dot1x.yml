---
### 802.1x Global ###
dot1x:
  system_auth_control: true
  protocol_lldp_bypass: true
  dynamic_authorization: true
  statistics_packets_dropped: true
  mac_based_authentication:
    delay: 300
    hold_period: 300
  radius_av_pair:
    service_type: true
    framed_mtu: 1500
    filter_id:
      delimiter_period: true
      ipv4_ipv6_required: true
      multiple: true
    lldp:
      system_name:
        enabled: true
        auth_only: true
      system_description:
        enabled: true
        auth_only: true
    dhcp:
      hostname:
        enabled: true
        auth_only: true
        # TODO: Open an issue. documentation/dot1x.j2 checks
        # dot1x.radius_av_pair.lldp.hostname.auth_only for DHCP hostname auth-only,
        # so this valid setting does not cover the intended documentation branch.
      parameter_request_list:
        enabled: true
        auth_only: true
      vendor_class_id:
        enabled: true
        auth_only: true
  aaa:
    unresponsive:
      eap_response: success
      action:
        traffic_allow_vlan: 10
      phone_action:
        apply_cached_results: true
        cached_results_timeout:
          time_duration: 10
          time_duration_unit: hours
        traffic_allow: true
        apply_alternate: true
      recovery_action_reauthenticate: true
    accounting_update_interval: 6
  radius_av_pair_username_format:
    delimiter: colon
    mac_string_case: lowercase
  captive_portal:
    enabled: true
    url: http://portal-nacm08/captiveredirect/
    ssl_profile: Profile1
    start_limit_infinite: true
    access_list_ipv4: ACL
  supplicant:
    profiles:
      - name: Profile1
        eap_method: tls
        identity: user_id1
        passphrase_type: 0
        passphrase: 1048080A02
        ssl_profile: PF1
      - name: Profile2
        identity: user_id2
        passphrase: 1048080A01
      - name: Profile3
        ssl_profile: PF2
      # Test for sort with ignore_case: false
      - name: aa_profile4
        eap_method: tls
        identity: user_id1
        passphrase_type: 0
        passphrase: 1048080A02
        ssl_profile: PF1
    logging: true
    disconnect_cached_results_timeout: 79
  vlan_assignment_groups:
    - name: Assignment_3
      members: 1,3,15-20
    - name: Assignment_2
      members: 55
    - name: Assignment_1
      members: 400-407
    # Test for sort with ignore_case: false
    - name: aa_Assignment_1
      members: 400-407
  eapol:
    vlan_change_logoff_disabled: true
    unresponsive_action_traffic_allow_vlan: 20
