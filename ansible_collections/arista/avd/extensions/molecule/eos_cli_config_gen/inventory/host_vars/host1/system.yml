system:
  mac_address: 00:1c:73:00:00:01
  control_plane:
    tcp_mss:
      ipv4: 1344
      ipv6: 1366
    ipv4_access_group_ingress_default: ingress_ipv4_acl
    ipv4_access_groups:
      - acl_name: "acl4_1"
      - acl_name: "acl4_2"
        vrf: red
      - acl_name: "acl4_2"
        vrf: red_1
      - acl_name: "acl4_3"
        vrf: default
    ipv6_access_group_ingress_default: ingress_ipv6_acl
    ipv6_access_groups:
      - acl_name: "acl6_1"
      - acl_name: "acl6_2"
        vrf: blue
      - acl_name: "acl6_2"
        vrf: blue_1
      - acl_name: "acl6_3"
        vrf: default
  l1:
    modules:
      - name: linecard0
        profile: small
      - name: linecard1
        profile: CAPITAL
      - name: linecard3
        profile: Uniform-4x100G-2-R
      - name: fabric2
        profile: Uniform-4x10G-1
      - name: fabric0
        profile: Uniform-1x400G-8
      - name: switch
        profile: Uniform-4x100G-2-R
    unsupported_speed_action: warn
    unsupported_error_correction_action: error
