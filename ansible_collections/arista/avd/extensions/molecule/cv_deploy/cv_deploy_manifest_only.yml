---
- name: "{{ test_id | upper }} Converge - Manifest-only deployment to CVP"
  hosts: SITE1_FABRIC
  connection: local
  gather_facts: false
  vars:
    cv_server: "{{ lookup('env', 'CV_SERVER') }}"
    cv_token: "{{ lookup('env', 'CV_ACCESS_TOKEN') }}"
    proxy_host: "{{ lookup('env', 'CV_PROXY_HOST') | default('', true) }}"
    proxy_port: "{{ lookup('env', 'CV_PROXY_PORT') | default(3128, true) | int }}"
    proxy_username: "{{ lookup('env', 'CV_PROXY_USERNAME') | default('', true) }}"
    proxy_password: "{{ lookup('env', 'CV_PROXY_PASSWORD') | default('', true) }}"
    cv_verify_certs: "{{ lookup('env', 'CV_VERIFY_CERTS') | default(true, true) | bool }}"
    cv_skip_missing_devices: true
    eos_config_dir: "{{ playbook_dir }}/intended/configs/test_configs"
    structured_dir: "{{ playbook_dir }}/intended/structured_configs/test_configs"
    test_id: "manifest-only"
    cv_common_pattern: "avd_cv-deploy_{{ test_id }}"

  tasks:
    - name: "{{ test_id | upper }} Banner"
      tags: ["{{ test_id }}"]
      run_once: true
      ansible.builtin.debug:
        msg:
          - "{{ ('#' * (31 + test_id | length))[:100] }}"
          - "### STARTING MOLECULE TEST {{ test_id[:69] | upper }} ###"
          - "{{ ('#' * (31 + test_id | length))[:100] }}"

    - name: "{{ test_id | upper }} {{ 'Read' if lookup('env', 'MOLECULE_EXECUTION_ID') else 'Generate' }} molecule execution ID"
      tags: ["{{ test_id }}"]
      run_once: true
      ansible.builtin.set_fact:
        r: "{{ lookup('env', 'MOLECULE_EXECUTION_ID') or lookup('password', '/dev/null chars=ascii_lowercase,digits length=4') }}"

    - name: "{{ test_id | upper }} Code block for manifest-only deployment to CVP"
      tags: ["{{ test_id }}"]
      run_once: true
      delegate_to: localhost

      block:

        - name: "(BLOCK) {{ test_id | upper }} Banner"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.debug:
            msg:
              - "### ENGAGE CV_DEPLOY ROLE FOR MANIFEST-ONLY DEPLOYMENT {{ test_id[:69] | upper }} ###"

        - name: "(BLOCK) {{ test_id | upper }} Provision CVP with manifest only"
          tags: ["{{ test_id }}"]
          run_once: true
          delegate_to: localhost
          ansible.builtin.import_role:
            name: arista.avd.cv_deploy
          vars:
            cv_workspace_name: "{{ cv_common_pattern }}_{{ r }}_converge"
            cv_workspace_description: "{{ (cv_common_pattern + '_' + r + '_converge') | upper }}"
            cv_change_control_name: "{{ cv_common_pattern }}_{{ r }}_converge"
            cv_change_control_description: "{{ (cv_common_pattern + '_' + r + '_converge') | upper }}"
            cv_register_detailed_results: true
            cv_submit_workspace_force: true
            cv_run_change_control: true
            # Enforce manifest-only mode by setting cv_devices to empty list
            cv_devices: []
            cv_static_config_manifest:
              configlets:
                - name: "TEST-MANIFEST-ALIAS"
                  file: "{{ playbook_dir }}/intended/configlets/test_manifest_alias.txt"
                - name: "TEST-MANIFEST-ACCESS-LISTS"
                  file: "{{ playbook_dir }}/intended/configlets/test_manifest_access_lists.txt"
              containers:
                - name: "AVD-MANIFEST-ROOT"
                  description: "Root container for AVD manifest deployment"
                  # Tag query to match avd-ci-leaf1 (device tag is a part of the base configuration)
                  tag_query: "dummy_name:dummy_val"
                  sub_containers:
                    - name: "AVD-MANIFEST-CHILD"
                      description: "Child container for AVD manifest deployment"
                      tag_query: "device:avd-ci-leaf1"
                      configlets:
                        - name: "TEST-MANIFEST-ACCESS-LISTS"

        - name: "(BLOCK) {{ test_id | upper }} Check CVP returns"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              # workspace
              - cv_deploy_results.workspace.name == cv_workspace_name
              - cv_deploy_results.workspace.state == "submitted"
              - cv_deploy_results.workspace.description == cv_workspace_description
              # errors and warnings
              - cv_deploy_results.errors == []
              - cv_deploy_results.warnings | default([]) | length == 0
              # tags
              - cv_deploy_results.deployed_device_tags == []
              - cv_deploy_results.deployed_interface_tags == []
              # Change control
              - cv_deploy_results.change_control.name == cv_change_control_name
              - cv_deploy_results.change_control.description == cv_change_control_description
              - cv_deploy_results.change_control.requested_state == "completed"
              - cv_deploy_results.change_control.state == "completed"
          vars:
            cv_workspace_name: "{{ cv_common_pattern }}_{{ r }}_converge"
            cv_workspace_description: "{{ (cv_common_pattern + '_' + r + '_converge') | upper }}"
            cv_change_control_name: "{{ cv_common_pattern }}_{{ r }}_converge"
            cv_change_control_description: "{{ (cv_common_pattern + '_' + r + '_converge') | upper }}"

        - name: "(BLOCK) {{ test_id | upper }} Verify manifest configlets were deployed"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              - cv_deploy_results.deployed_static_config_configlets is defined
              - "'TEST-MANIFEST-ACCESS-LISTS' in cv_deploy_results.deployed_static_config_configlets | map(attribute='name') | list"
              - "'TEST-MANIFEST-ALIAS' in cv_deploy_results.deployed_static_config_configlets | map(attribute='name') | list"

        - name: "(BLOCK) {{ test_id | upper }} Verify manifest containers were deployed"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              - cv_deploy_results.deployed_static_config_containers is defined
              - cv_deploy_results.deployed_static_config_containers | length == 2
              - cv_deploy_results.skipped_static_config_containers is defined
              - cv_deploy_results.skipped_static_config_containers | length == 0
              # AVD-MANIFEST-ROOT (root container)
              - (cv_deploy_results.deployed_static_config_containers | selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).configlets | length == 0
              - >
                (cv_deploy_results.deployed_static_config_containers | selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).description ==
                'Root container for AVD manifest deployment'
              - (cv_deploy_results.deployed_static_config_containers | selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).match_policy == 'match_all'
              - (cv_deploy_results.deployed_static_config_containers | selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).sub_containers | length == 1
              - >
                (cv_deploy_results.deployed_static_config_containers | selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).tag_query ==
                'dummy_name:dummy_val'
              # AVD-MANIFEST-CHILD (nested sub-container)
              - >
                ((cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).sub_containers | first).configlets | length == 1
              - >
                'TEST-MANIFEST-ACCESS-LISTS' in
                ((cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).sub_containers | first).configlets
              - >
                ((cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).sub_containers | first).description ==
                'Child container for AVD manifest deployment'
              - >
                ((cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).sub_containers | first).match_policy == 'match_all'
              - >
                ((cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).sub_containers | first).name == 'AVD-MANIFEST-CHILD'
              - >
                ((cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).sub_containers | first).sub_containers | length == 0
              - >
                ((cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-ROOT') | first).sub_containers | first).tag_query == 'device:avd-ci-leaf1'
              # AVD-MANIFEST-CHILD (standalone container)
              - >
                (cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-CHILD') | first).configlets | first == 'TEST-MANIFEST-ACCESS-LISTS'
              - >
                (cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-CHILD') | first).description == 'Child container for AVD manifest deployment'
              - >
                (cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-CHILD') | first).match_policy == 'match_all'
              - >
                (cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-CHILD') | first).sub_containers | length == 0
              - >
                (cv_deploy_results.deployed_static_config_containers |
                selectattr('name', 'eq', 'AVD-MANIFEST-CHILD') | first).tag_query == 'device:avd-ci-leaf1'

        - name: "(BLOCK) {{ test_id | upper }} Verify regular AVD device configs were not deployed"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              - cv_deploy_results.deployed_configs is defined
              - cv_deploy_results.deployed_configs | length == 0

      always:

        - name: "(ALWAYS) {{ test_id | upper }} Display CVP detailed result"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.debug:
            var: cv_deploy_results

        - name: "(ALWAYS) {{ test_id | upper }} Banner"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.debug:
            msg:
              - "### ENGAGE CV_DEPLOY ROLE TO CLEANUP AFTER {{ test_id[:69] | upper }} ###"

        - name: "(ALWAYS) {{ test_id | upper }} Check status of the Workspace"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/workspace/v1/Workspace?key.workspaceId={{ cv_deploy_results.workspace.id }}
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: GET
            force_basic_auth: true
            timeout: 10
          register: cvp_workspace_status_result
          until: cvp_workspace_status_result.status == 200
          retries: 3
          delay: 3
          ignore_errors: true
          when: cv_deploy_results.workspace.id is not none and cv_deploy_results.workspace.id | length > 0
          # Set HTTPS_PROXY environment variable scoped for this task only
          environment:
            https_proxy: >-
              http://{{ (proxy_username and proxy_password) | ternary(proxy_username ~ ':' ~ proxy_password ~ '@', '') }}{{ proxy_host }}:{{ proxy_port }}

        - name: "(ALWAYS) {{ test_id | upper }} Cleanup orphan workspace (if needed)"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/workspace/v1/WorkspaceConfig/some
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: POST
            body_format: json
            body:
              {
                "values": [
                  {
                    "key": {
                      "workspaceId": "{{ cv_deploy_results.workspace.id }}"
                    },
                    "request": "REQUEST_ABANDON",
                    "requestParams": {
                      "requestId": "{{ r }}"
                    }
                  }
                ]
              }
            force_basic_auth: true
            timeout: 10
          register: cvp_abandon_workspace_result
          until: cvp_abandon_workspace_result.status == 200
          retries: 3
          delay: 3
          ignore_errors: true
          when:
            - cv_deploy_results.workspace.id is not none and cv_deploy_results.workspace.id | length > 0
            - >
              cvp_workspace_status_result.json.value.state | default("WORKSPACE_STATE_UNSPECIFIED") not in
              ["WORKSPACE_STATE_SUBMITTED", "WORKSPACE_STATE_ABANDONED", "WORKSPACE_STATE_ROLLED_BACK"]
          # Set HTTPS_PROXY environment variable scoped for this task only
          environment:
            https_proxy: >-
              http://{{ (proxy_username and proxy_password) | ternary(proxy_username ~ ':' ~ proxy_password ~ '@', '') }}{{ proxy_host }}:{{ proxy_port }}

        # Apply base config (rollback) even if we expect no changes to regular AVD static configlets
        - name: "(ALWAYS) {{ test_id | upper }} Rollback regular AVD configlets"
          tags: ["{{ test_id }}"]
          run_once: true
          delegate_to: localhost
          ansible.builtin.import_role:
            name: arista.avd.cv_deploy
          vars:
            cv_workspace_name: "{{ cv_common_pattern }}_{{ r }}_cleanup"
            cv_workspace_description: "{{ (cv_common_pattern + '_' + r + '_cleanup') | upper }}"
            cv_change_control_name: "{{ cv_common_pattern }}_{{ r }}_cleanup"
            cv_change_control_description: "{{ (cv_common_pattern + '_' + r + '_cleanup') | upper }}"
            cv_register_detailed_results: true
            cv_devices: "{{ ansible_play_hosts_all }}"
            eos_config_dir: "{{ playbook_dir }}/intended/configs/base_configs"
            structured_dir: "{{ playbook_dir }}/intended/structured_configs/base_configs"
            cv_submit_workspace_force: true
            cv_run_change_control: true

        # TODO: Remove everything below once cv_deploy can handle complete removal of containers and configlets deployed using manifest approach
        - name: "(ALWAYS) {{ test_id | upper }} Generate WS ID to cleanup manifest artifacts"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.set_fact:
            cleanup_ws_id: "avd-cleanup-roots-workspace-{{ r }}-{{ lookup('password', '/dev/null chars=ascii_lowercase,digits length=4') }}"
            clean_ws_build_request_id: "build-studio-roots-cleanup-ws-{{ r }}"
            clean_ws_submit_request_id: "submit-studio-roots-cleanup-ws-{{ r }}"

        - name: "(ALWAYS) {{ test_id | upper }} Create new workspace to cleanup manifest artifacts"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/workspace/v1/WorkspaceConfig
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: POST
            body_format: json
            body:
              {
                "key": {
                  "workspaceId": "{{ cleanup_ws_id }}"
                },
                "request": "REQUEST_UNSPECIFIED",
                "displayName": "{{ (cv_common_pattern + '_' + r + '_cleanup_roots') }}",
              }
            force_basic_auth: true
            timeout: 10
          register: cvp_cleanup_workspace_result
          until: cvp_cleanup_workspace_result.status == 200
          retries: 3
          delay: 3
          ignore_errors: true
          # Set HTTPS_PROXY environment variable scoped for this task only
          environment:
            https_proxy: >-
              http://{{ (proxy_username and proxy_password) | ternary(proxy_username ~ ':' ~ proxy_password ~ '@', '') }}{{ proxy_host }}:{{ proxy_port }}

        - name: "(ALWAYS) {{ test_id | upper }} Fetch existing studio roots"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/studio/v1/Inputs/getsome
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: POST
            body_format: json
            body:
              {
                "keys": [
                  {
                    "studioId": "studio-static-configlet",
                    "workspaceId": "",
                    "path": {
                      "values": [
                        "configletAssignmentRoots",
                      ]
                    }
                  },
                ]
              }
            force_basic_auth: true
            timeout: 10
          register: cvp_fetch_studio_roots_result
          until: cvp_fetch_studio_roots_result.status == 200
          retries: 3
          delay: 3
          ignore_errors: true
          # Set HTTPS_PROXY environment variable scoped for this task only
          environment:
            https_proxy: >-
              http://{{ (proxy_username and proxy_password) | ternary(proxy_username ~ ':' ~ proxy_password ~ '@', '') }}{{ proxy_host }}:{{ proxy_port }}

        - name: "(ALWAYS) {{ test_id | upper }} Parse current studio roots"
          ansible.builtin.set_fact:
            current_roots: "{{ cvp_fetch_studio_roots_result.json.result.value.inputs | from_json }}"

        - name: "(ALWAYS) {{ test_id | upper }} Remove AVD-MANIFEST-ROOT from roots"
          ansible.builtin.set_fact:
            updated_roots: "{{ current_roots | reject('equalto', 'avd_3a4a3c55-8c4f-5a62-aae3-7d178ffe0286') | list }}"

        - name: "(ALWAYS) {{ test_id | upper }} Debug updated studio roots"
          ansible.builtin.debug:
            msg: "{{ updated_roots | to_json }}"

        - name: "(ALWAYS) {{ test_id | upper }} Remove root manifest assignment from studio roots"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/studio/v1/InputsConfig
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: POST
            body_format: json
            body:
              {
                "key": {
                  "studioId": "studio-static-configlet",
                  "workspaceId": "{{ cleanup_ws_id }}",
                  "path": {
                    "values": [
                      "configletAssignmentRoots",
                    ]
                  }
                },
                "inputs": "{{ updated_roots | to_json }}"
              }
            force_basic_auth: true
            timeout: 10
          register: cvp_sync_studio_roots_result
          until: cvp_sync_studio_roots_result.status == 200
          retries: 3
          delay: 3
          ignore_errors: true
          # Set HTTPS_PROXY environment variable scoped for this task only
          environment:
            https_proxy: >-
              http://{{ (proxy_username and proxy_password) | ternary(proxy_username ~ ':' ~ proxy_password ~ '@', '') }}{{ proxy_host }}:{{ proxy_port }}

        - name: "(ALWAYS) {{ test_id | upper }} Cleanup remaining AVD manifest container assignments"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/configlet/v1/ConfigletAssignmentConfig
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: POST
            body_format: json
            body:
              {
                "key": {
                  "workspaceId": "{{ cleanup_ws_id }}",
                  "configletAssignmentId": "{{ item }}",
                },
                "remove": true,
                "matchPolicy": 0,
              }
            force_basic_auth: true
            timeout: 10
          register: cvp_remove_root_assignment_result
          until: cvp_remove_root_assignment_result.status == 200
          retries: 3
          delay: 3
          ignore_errors: true
          loop:
            # AVD-MANIFEST-ROOT
            - avd_3a4a3c55-8c4f-5a62-aae3-7d178ffe0286
            # AVD-MANIFEST-ROOT/AVD-MANIFEST-CHILD
            - avd_cd84bbbf-fb04-59aa-b7a1-41af18bf8b0e
          # Set HTTPS_PROXY environment variable scoped for this task only
          environment:
            https_proxy: >-
              http://{{ (proxy_username and proxy_password) | ternary(proxy_username ~ ':' ~ proxy_password ~ '@', '') }}{{ proxy_host }}:{{ proxy_port }}

        - name: "(ALWAYS) {{ test_id | upper }} Cleanup remaining AVD manifest configlets"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/configlet/v1/ConfigletConfig
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: POST
            body_format: json
            body:
              {
                "key": {
                  "workspaceId": "{{ cleanup_ws_id }}",
                  "configletId": "{{ item }}",
                },
                "remove": true,
              }
            force_basic_auth: true
            timeout: 10
          register: cvp_remove_configlets_result
          until: cvp_remove_configlets_result.status == 200
          retries: 3
          delay: 3
          ignore_errors: true
          loop:
            # TEST-MANIFEST-ACCESS-LISTS
            - avd_481d34ea-792b-506c-b80a-b62ea545ea60
            # TEST-MANIFEST-ALIAS
            - avd_f0e33409-e301-5867-9d0f-97986b5e0823
          # Set HTTPS_PROXY environment variable scoped for this task only
          environment:
            https_proxy: >-
              http://{{ (proxy_username and proxy_password) | ternary(proxy_username ~ ':' ~ proxy_password ~ '@', '') }}{{ proxy_host }}:{{ proxy_port }}

        - name: "(ALWAYS) {{ test_id | upper }} Build workspace to cleanup manifest leftovers"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/workspace/v1/WorkspaceConfig
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: POST
            body_format: json
            body:
              {
                "key": {
                  "workspaceId": "{{ cleanup_ws_id }}"
                },
                "request": "REQUEST_START_BUILD",
                "requestParams": {
                  "requestId": "{{ clean_ws_build_request_id }}"
                }
              }
            force_basic_auth: true
            timeout: 10
          register: cvp_cleanup_workspace_build_result
          until: cvp_cleanup_workspace_build_result.status == 200
          retries: 3
          delay: 3
          ignore_errors: true
          # Set HTTPS_PROXY environment variable scoped for this task only
          environment:
            https_proxy: >-
              http://{{ (proxy_username and proxy_password) | ternary(proxy_username ~ ':' ~ proxy_password ~ '@', '') }}{{ proxy_host }}:{{ proxy_port }}

        - name: "(ALWAYS) {{ test_id | upper }} Wait until workspace build completes"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.legacy.uri:
            url: https://{{ cv_server }}/api/resources/workspace/v1/Workspace/getsome
            use_proxy: "{{ true if proxy_host and proxy_port else false }}"
            validate_certs: "{{ cv_verify_certs }}"
            return_content: true
            headers:
              Accept: "application/json"
              Content-Type: "application/json"
              Authorization: "Bearer {{ lookup('env', 'CV_ACCESS_TOKEN') }}"
            method: POST
            body_format: json
            body:
              {
                "keys": [
                  {
                    "workspaceId": "{{ cleanup_ws_id }}"
                  },
                ],
              }
            force_basic_auth: true
            timeout: 10
          register: cvp_cleanup_workspace_build_status_result
          until:
            - cvp_cleanup_workspace_build_status_result.status == 200
            - >
