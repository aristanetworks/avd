---
- name: "Converge - Configuration deployment with CVP using hostvars - {{ test_id | upper }}"
  hosts: SITE1_FABRIC
  connection: local
  gather_facts: false
  vars:
    cv_server: "{{ lookup('env', 'CV_SERVER') }}"
    cv_token: "{{ lookup('env', 'CV_ACCESS_TOKEN') }}"
    proxy_host: "{{ lookup('env', 'CV_PROXY_HOST') | default('', true) }}"
    proxy_port: "{{ lookup('env', 'CV_PROXY_PORT') | default(3128, true) | int }}"
    proxy_username: "{{ lookup('env', 'CV_PROXY_USERNAME') | default('', true) }}"
    proxy_password: "{{ lookup('env', 'CV_PROXY_PASSWORD') | default('', true) }}"
    cv_verify_certs: "{{ lookup('env', 'CV_VERIFY_CERTS') | default(true, true) | bool }}"
    cv_skip_missing_devices: true
    eos_config_dir: "{{ playbook_dir }}/intended/configs/test_configs"
    cv_deploy_tmp_dir: "{{ playbook_dir }}/intended/tmp_cv_deploy"
    intended_tag_device: avd-ci-leaf1
    intended_tags: "{{ hostvars[intended_tag_device] }}"
    test_id: "hostvars-deploy"
    cv_common_pattern: "avd_cv-deploy_{{ test_id }}"

  tasks:
    - name: "Banner - {{ test_id | upper }}"
      tags: ["{{ test_id }}"]
      run_once: true
      ansible.builtin.debug:
        msg:
          - "{{ ('#' * (31 + test_id | length))[:100] }}"
          - "### STARTING MOLECULE TEST {{ test_id[:69] | upper }} ###"
          - "{{ ('#' * (31 + test_id | length))[:100] }}"

    - name: "{{ (test_id | upper) + ' - ' + ('Read' if lookup('env', 'MOLECULE_EXECUTION_ID') else 'Generate') + ' molecule execution ID' }}"
      tags: ["{{ test_id }}"]
      run_once: true
      ansible.builtin.set_fact:
        r: "{{ lookup('env', 'MOLECULE_EXECUTION_ID') or lookup('password', '/dev/null chars=ascii_lowercase,digits length=4') }}"

    - name: "DEBUG BEFORE RESET - {{ test_id | upper }} - metadata keys for {{ intended_tag_device }}"
      tags: ["{{ test_id }}"]
      run_once: true
      ansible.builtin.debug:
        msg:
          - ">>> BEFORE RESET <<<"
          - "metadata.keys(): {{ hostvars[intended_tag_device].metadata.keys() | list }}"
          - "has cv_tags: {{ 'cv_tags' in hostvars[intended_tag_device].metadata }}"

    # Previous plays (duplicated checks) use set_fact to set metadata with only serial_number/system_mac_address fetched from CV.
    # This overrides the host_vars metadata which contains cv_tags.device_tags required for this play.
    - name: "Reset metadata fact from host_vars file - {{ test_id | upper }}"
      tags: ["{{ test_id }}"]
      when: inventory_hostname == intended_tag_device
      ansible.builtin.set_fact:
        metadata: "{{ (lookup('file', playbook_dir ~ '/inventory/host_vars/' ~ inventory_hostname ~ '.yml') | from_yaml).metadata }}"

    - name: "DEBUG AFTER RESET - {{ test_id | upper }} - metadata keys for {{ intended_tag_device }}"
      tags: ["{{ test_id }}"]
      run_once: true
      ansible.builtin.debug:
        msg:
          - ">>> AFTER RESET <<<"
          - "metadata.keys(): {{ hostvars[intended_tag_device].metadata.keys() | list }}"
          - "has cv_tags: {{ 'cv_tags' in hostvars[intended_tag_device].metadata }}"

    - name: "Code block to provision CVP with AVD configuration from hostvars - {{ test_id | upper }}"
      tags: ["{{ test_id }}"]
      run_once: true
      delegate_to: localhost

      block:

        - name: "(BLOCK) Banner - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.debug:
            msg:
              - "### ENGAGE CV_DEPLOY ROLE (HOSTVARS MODE) TO PUSH CONFIGURATION FOR {{ test_id[:69] | upper }} ###"

        - name: "(BLOCK) Provision CVP with AVD configuration from hostvars - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          delegate_to: localhost
          ansible.builtin.import_role:
            name: arista.avd.cv_deploy
          vars:
            cv_workspace_name: "{{ cv_common_pattern }}_{{ r }}_converge"
            cv_workspace_description: "{{ (cv_common_pattern + '_' + r + '_converge') | upper }}"
            cv_change_control_name: "{{ cv_common_pattern }}_{{ r }}_converge"
            cv_change_control_description: "{{ (cv_common_pattern + '_' + r + '_converge') | upper }}"
            cv_register_detailed_results: true
            cv_submit_workspace_force: true
            cv_run_change_control: true
            # Use hostvars instead of structured config files
            read_structured_config_from_file: false

        - name: "(BLOCK) Check CVP returns - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              # workspace
              - cv_deploy_results.workspace.name == cv_workspace_name
              - cv_deploy_results.workspace.state == "submitted"
              - cv_deploy_results.workspace.description == cv_workspace_description
              # errors and warnings
              - cv_deploy_results.errors == []
              - cv_deploy_results.warnings | default([]) | length == 0
              # tags
              - cv_deploy_results.deployed_device_tags != []
              - cv_deploy_results.deployed_interface_tags != []
              # Change control
              - cv_deploy_results.change_control.name == cv_change_control_name
              - cv_deploy_results.change_control.description == cv_change_control_description
              - cv_deploy_results.change_control.requested_state == "completed"
              - cv_deploy_results.change_control.state == "completed"
          vars:
            cv_workspace_name: "{{ cv_common_pattern }}_{{ r }}_converge"
            cv_workspace_description: "{{ (cv_common_pattern + '_' + r + '_converge') | upper }}"
            cv_change_control_name: "{{ cv_common_pattern }}_{{ r }}_converge"
            cv_change_control_description: "{{ (cv_common_pattern + '_' + r + '_converge') | upper }}"

        - name: "(BLOCK) Check tags from output - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              - item.0.label == item.1.label
              - item.0.value == item.1.value
          loop: "{{ cv_deploy_results.deployed_device_tags | zip(cv_deploy_results.device_tags) | list }}"

        - name: "(BLOCK) Extract all device tags from hostvars - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.set_fact:
            expected_device_tags: "{{ intended_tags.metadata.cv_tags.device_tags | default(intended_tags.cv_device_tags) }}"
            output_device_tags: "{{ cv_deploy_results.deployed_device_tags }}"

        - name: "(BLOCK) Check output device tags == intended device tags - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              - item.0.name == item.1.label
              - item.0.value == item.1.value
          loop: "{{ expected_device_tags | zip(output_device_tags) | list }}"

        - name: "(BLOCK) Extract all interface tags from role output - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.set_fact:
            output_interface_tags: "{{ cv_deploy_results.deployed_interface_tags }}"

        - name: "(BLOCK) Extract all interface tags from hostvars - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.set_fact:
            expected_interface_tags: "{{ expected_interface_tags | default([]) + [item.tags | list | first | combine({'interface': item.interface})] }}"
          loop: "{{ intended_tags.metadata.cv_tags.interface_tags | default(intended_tags.cv_interface_tags) }}"
          loop_control:
            label: "{{ item.interface }}"

        - name: "(BLOCK) Check output interface tags == intended interface tags - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              - item.0.name == item.1.label
              - item.0.value == item.1.value
          loop: "{{ expected_interface_tags | zip(output_interface_tags) | list }}"

        - name: "(BLOCK) Convert unstructed data into yaml - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.set_fact:
            devices_structure: '{{ cv_deploy_results.deployed_configs | from_yaml }}'
            output_devices: []

        - name: "(BLOCK) Extract devices from output - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.set_fact:
            output_devices: "{{ output_devices + [item.device.hostname] }}"
          loop: "{{ devices_structure }}"
          loop_control:
            label: "{{ item.configlet_name }}"

        - name: "(BLOCK) Check output devices == intended devices - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.assert:
            that:
              - output_devices == cv_devices

      always:

        - name: "(ALWAYS) Display CVP detailed result - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.debug:
            var: cv_deploy_results

        - name: "(ALWAYS) Banner - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          ansible.builtin.debug:
            msg:
              - "### ENGAGE CV_DEPLOY ROLE TO CLEANUP AFTER {{ test_id[:69] | upper }} ###"

        - name: "(ALWAYS) Cleanup - {{ test_id | upper }}"
          tags: ["{{ test_id }}"]
          run_once: true
          delegate_to: localhost
          ansible.builtin.import_role:
            name: arista.avd.cv_deploy
          vars:
            cv_workspace_name: "{{ cv_common_pattern }}_{{ r }}_cleanup"
            cv_workspace_description: "{{ (cv_common_pattern + '_' + r + '_cleanup') | upper }}"
            cv_change_control_name: "{{ cv_common_pattern }}_{{ r }}_cleanup"
            cv_change_control_description: "{{ (cv_common_pattern + '_' + r + '_cleanup') | upper }}"
            cv_register_detailed_results: true
            cv_devices: "{{ ansible_play_hosts_all }}"
            eos_config_dir: "{{ playbook_dir }}/intended/configs/base_configs"
            structured_dir: "{{ playbook_dir }}/intended/structured_configs/base_configs"
            cv_submit_workspace_force: true
            cv_run_change_control: true
