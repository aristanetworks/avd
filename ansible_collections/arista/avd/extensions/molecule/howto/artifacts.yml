---
base_path: "../../../../../../docs/howto"

artifacts:
  # Connected Endpoints artifacts
  - file: inventory/intended/configs/dc1-leaf1a.cfg
    sections:
      - header: "interface Ethernet10"
    artifact: "WEB-SERVER-01.cfg"
    output_dir: "connected_endpoints/artifacts/"

  - file: inventory/intended/configs/dc1-leaf1a.cfg
    sections:
      - header: "interface Port-Channel11"
      - header: "interface Ethernet11"
    artifact: "ESXI-HOST-03.cfg"
    output_dir: "connected_endpoints/artifacts/"

  # Network Services artifacts
  - file: inventory/intended/configs/htns-l3-leaf1.cfg
    sections:
      - header: "vlan 100"
      - header: "vlan 101"
      - header: "vlan 200"
      - header: "vlan 3401"
      - header: "vlan 3402"
      - header: "vrf instance VRF_PRODUCTION"
      - header: "vrf instance VRF_DEVELOPMENT"
      - header: "interface Vlan100"
      - header: "interface Vlan101"
      - header: "interface Vlan200"
    artifact: "htns-l3-leaf1-services.cfg"
    output_dir: "network_services/artifacts/"

  - file: inventory/intended/configs/htns-l3-leaf2.cfg
    sections:
      - header: "vlan 200"
      - header: "vrf instance VRF_DEVELOPMENT"
      - header: "interface Vlan200"
    artifact: "htns-l3-leaf2-services.cfg"
    output_dir: "network_services/artifacts/"

  # Fabric Topology artifacts
  - file: inventory/intended/configs/htft-spine1.cfg
    sections:
      - header: "interface Ethernet1"
      - header: "interface Ethernet2"
      - header: "interface Loopback0"
    artifact: "htft-spine1-links.cfg"
    output_dir: "fabric_topology/artifacts/"

  - file: inventory/intended/configs/htft-leaf1a.cfg
    sections:
      - header: "interface Port-Channel3"
      - header: "interface Ethernet1"
      - header: "interface Ethernet2"
      - header: "interface Ethernet3"
      - header: "interface Ethernet4"
      - header: "interface Loopback0"
      - header: "interface Loopback1"
    artifact: "htft-leaf1a-links.cfg"
    output_dir: "fabric_topology/artifacts/"

  # IP Addressing artifacts
  - file: inventory/intended/configs/htipa-leaf1.cfg
    sections:
      - header: "interface Ethernet1"
      - header: "interface Ethernet2"
    artifact: "leaf1-to-spines.cfg"
    output_dir: "ip_addressing/artifacts/"

  - file: inventory/intended/configs/htipa-leaf1.cfg
    sections:
      - header: "interface Loopback0"
    artifact: "leaf1-loopback.cfg"
    output_dir: "ip_addressing/artifacts/"

  - file: inventory/intended/configs/htipa-leaf2.cfg
    sections:
      - header: "interface Loopback0"
    artifact: "leaf2-loopback.cfg"
    output_dir: "ip_addressing/artifacts/"

  - file: inventory/intended/configs/htipa-spine1.cfg
    sections:
      - header: "interface Loopback0"
    artifact: "spine1-loopback.cfg"
    output_dir: "ip_addressing/artifacts/"

  - file: inventory/intended/configs/htipa-spine2.cfg
    sections:
      - header: "interface Loopback0"
    artifact: "spine2-loopback.cfg"
    output_dir: "ip_addressing/artifacts/"

  # IPv6 artifacts
  - file: inventory/intended/configs/htipv6-numbered-spine1.cfg
    sections:
      - header: "interface Loopback0"
    artifact: "spine1-loopback.cfg"
    output_dir: "ipv6_numbered/artifacts/"

  - file: inventory/intended/configs/htipv6-numbered-spine2.cfg
    sections:
      - header: "interface Loopback0"
    artifact: "spine2-loopback.cfg"
    output_dir: "ipv6_numbered/artifacts/"

  - file: inventory/intended/configs/htipv6-numbered-leaf1.cfg
    sections:
      - header: "interface Loopback0"
      - header: "interface Loopback1"
    artifact: "leaf1-loopback.cfg"
    output_dir: "ipv6_numbered/artifacts/"

  - file: inventory/intended/configs/htipv6-numbered-leaf2.cfg
    sections:
      - header: "interface Loopback0"
      - header: "interface Loopback1"
    artifact: "leaf2-loopback.cfg"
    output_dir: "ipv6_numbered/artifacts/"

  - file: inventory/intended/configs/htipv6-numbered-leaf1.cfg
    sections:
      - header: "interface Ethernet1"
      - header: "interface Ethernet2"
    artifact: "leaf1-uplinks.cfg"
    output_dir: "ipv6_numbered/artifacts/"

  - file: inventory/intended/configs/htipv6-numbered-leaf1.cfg
    sections:
      - header: "vlan 4093"
      - header: "vlan 4094"
      - header: "interface Vlan4093"
      - header: "interface Vlan4094"
    artifact: "leaf1-mlag.cfg"
    output_dir: "ipv6_numbered/artifacts/"

  - file: inventory/intended/configs/htipv6-numbered-spine1.cfg
    sections:
      - header: "router bgp 65100"
    artifact: "spine1-bgp.cfg"
    output_dir: "ipv6_numbered/artifacts/"

  # 802.1X Port Authentication artifacts
  - file: inventory/intended/configs/htdx-leaf1a.cfg
    sections:
      - header: "radius-server host"
      - header: "aaa group server radius DOT1X-RADIUS"
      - header: "aaa authentication dot1x"
      - header: "aaa accounting dot1x"
      - header: "dot1x"
      - header: "ip radius"
      - header: "dot1x system-auth-control"
      - header: "dot1x protocol lldp bypass"
      - header: "dot1x protocol bpdu bypass"
      - header: "dot1x dynamic-authorization"
    artifact: "htdx-leaf1a-dot1x-global.cfg"
    output_dir: "dot1x/artifacts/"

  - file: inventory/intended/configs/htdx-leaf1a.cfg
    sections:
      - header: "interface Ethernet5"
    artifact: "htdx-leaf1a-dot1x-workstation.cfg"
    output_dir: "dot1x/artifacts/"

  - file: inventory/intended/configs/htdx-leaf1a.cfg
    sections:
      - header: "interface Ethernet6"
    artifact: "htdx-leaf1a-dot1x-phone.cfg"
    output_dir: "dot1x/artifacts/"

  - file: inventory/intended/configs/htdx-leaf1b.cfg
    sections:
      - header: "interface Ethernet5"
    artifact: "htdx-leaf1b-dot1x-printer.cfg"
    output_dir: "dot1x/artifacts/"
