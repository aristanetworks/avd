---
- name: Run EOS Config Parser
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    script_path: "../../scripts/processor.py"
    config_file: "artifacts.yml"
    output_dir: "doc_artifacts"

  tasks:
    - name: Sanity check - config exists
      stat:
        path: "{{ config_file }}"
      register: cfg_stat

    - name: Fail if config is missing
      fail:
        msg: "Config not found at {{ config_file }}"
      when: not cfg_stat.stat.exists

    - name: Execute Shared Python Parser
      # Syntax: python3 <script> <config_input> <output_folder>
      command: "python3 {{ script_path }} {{ config_file }} {{ output_dir }}"
      register: parser_output
      changed_when: false

    - name: Show Parser Output
      debug:
        msg: "{{ parser_output.stdout_lines }}"
