                htipa-leaf2:
                  ansible_host: 172.16.2.102
        HTIPV6_NUMBERED: # How-To IPv6 Numbered
          children:
            HTIPV6_NUMBERED_SPINES:
              hosts:
                htipv6-numbered-spine1:
                  ansible_host: 172.16.3.11
                htipv6-numbered-spine2:
