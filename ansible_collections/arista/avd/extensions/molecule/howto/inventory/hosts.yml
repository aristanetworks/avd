                dc1-leaf1b:
                  ansible_host: 172.16.1.102
            DC1_SERVICE_LEAFS:
              hosts:
                dc1-svc-leaf1:
                  ansible_host: 172.16.1.111
        HTNS: # How-To Network Services
          children:
            HTNS_L3_LEAFS:
              hosts:
                htns-l3-leaf1:
                  ansible_host: 172.16.1.201
                htns-l3-leaf2:
                  ansible_host: 172.16.1.202
            HTNS_L2_LEAFS:
              hosts:
                htns-l2-leaf1:
                  ansible_host: 172.16.1.251
        HTFT: # How-To Fabric Topology
          children:
            HTFT_SPINES:
