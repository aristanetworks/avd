---
# 802.1X Port Authentication How-To Guide

fabric_name: FABRIC

underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# Global 802.1X settings
# --8<-- [start:dot1x_full]
# --8<-- [start:dot1x_minimal]
dot1x_settings:
  enabled: true
# --8<-- [end:dot1x_minimal]
  authentication: # (1)!
    radius_groups:
      - DOT1X-RADIUS
  accounting: # (2)!
    mode: start-stop
    radius_groups:
      - DOT1X-RADIUS
  dynamic_authorization: # (3)!
    enabled: true
  mac_based_authentication: # (4)!
    username_format:
      delimiter: colon
      letter_case: lowercase
  bypass_bpdu: true # (5)!
  bypass_lldp: true # (6)!

# RADIUS server configuration
# --8<-- [start:aaa_minimal]
aaa_settings:
  radius:
    servers:
      - host: radius.example.com
        cleartext_key: my-radius-secret
# --8<-- [end:aaa_minimal]
        groups: # (7)!
          - DOT1X-RADIUS
# --8<-- [end:dot1x_full]

# Port profiles for dot1x
port_profiles: # (1)!
  - profile: PP-DOT1X # (2)!
    mode: access
    spanning_tree_portfast: edge
    spanning_tree_bpduguard: enabled
    dot1x:
      port_control: auto # (3)!
      reauthentication: true # (4)!
      pae:
        mode: authenticator # (5)!
      host_mode:
        mode: single-host # (6)!
      mac_based_authentication:
        enabled: true # (7)!
      timeout:
        reauth_period: server # (8)!
        tx_period: 3
      reauthorization_request_limit: 3

  - profile: PP-DOT1X-PHONE # (9)!
    mode: "trunk phone"
    spanning_tree_portfast: edge
    spanning_tree_bpduguard: enabled
    dot1x:
      port_control: auto
      reauthentication: true
      pae:
        mode: authenticator
      host_mode:
        mode: multi-host # (10)!
        multi_host_authenticated: true # (11)!
      mac_based_authentication:
        enabled: true
      timeout:
        reauth_period: server
        tx_period: 3
      reauthorization_request_limit: 3
