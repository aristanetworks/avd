---
connected_endpoints:
  - name: WEB-SERVER-01 # (1)!
    adapters:
      - switch_ports: [Ethernet10]
        switches: [dc1-leaf1a]
        profile: PP-WEBSERVER
        description: "Connects to WEB-SERVER-01 NIC1"

  - name: ESXI-HOST-03 # (2)!
    adapters:
      - switch_ports: [Ethernet11, Ethernet11]
        switches: [dc1-leaf1a, dc1-leaf1b]
        profile: PP-VMHOST-LACP
        description: "LACP bundle to ESXI-HOST-03"
        port_channel:
          mode: active
