---
# Management Settings How-To Guide
# Fabric-wide settings — management configuration applies to all devices.

fabric_name: FABRIC  # (1)!

underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# Management interface and VRF
mgmt_interface: Management1  # (2)!
mgmt_interface_vrf: MGMT  # (3)!
mgmt_gateway: 172.16.4.1  # (4)!

# DNS
dns_settings:  # (5)!
  servers:
    - ip_address: 192.168.1.1
    - ip_address: 8.8.8.8

# NTP
ntp_settings:  # (6)!
  server_vrf: use_mgmt_interface_vrf  # (7)!
  servers:
    - name: 0.pool.ntp.org

# Local users and AAA
aaa_settings:  # (8)!
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      sha512_password: "$6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1."
    - name: arista
