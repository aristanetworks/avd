---
# Platform Settings How-To Guide
# Fabric-wide settings that apply to all devices

fabric_name: FABRIC

underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# --8<-- [start:basic]
# Override default reload delays for vEOS-lab devices
custom_platform_settings: # (1)!
  - platforms:
      - vEOS-lab # (2)!
    reload_delay:
      mlag: 180 # (3)!
      non_mlag: 210 # (4)!
# --8<-- [end:basic]

  # --8<-- [start:mtu]
  - platforms:
      - 7280R3 # (1)!
    reload_delay:
      mlag: 900
      non_mlag: 1020
    tcam_profile: vxlan-routing
    default_interface_mtu: 9000 # (2)!

  - platforms:
      - 7280R2 # (3)!
    reload_delay:
      mlag: 900
      non_mlag: 1020
    default_interface_mtu: 9214

  - platforms:
      - 7050X3 # (4)!
    reload_delay:
      mlag: 300
      non_mlag: 330
    default_interface_mtu: 9000 # (5)!
    p2p_uplinks_mtu: 9214 # (6)!
  # --8<-- [end:mtu]

  # --8<-- [start:tcam]
  - platforms:
      - 7280R
      - 7020R
    lag_hardware_only: true
    reload_delay:
      mlag: 900
      non_mlag: 1020
    tcam_profile: vxlan-routing
    feature_support:
      private_vlan: false
      queue_monitor_length_notify: true
      interface_storm_control: true
    digital_twin:
      platform: vEOS-lab
      act_node_type: veos
  # --8<-- [end:tcam]

  # --8<-- [start:hardware_validation]
  - platforms:
      - 7800R3
    reload_delay:
      mlag: 900
      non_mlag: 1020
    tcam_profile: vxlan-routing
    feature_support:
      evpn_gateway_all_active_multihoming: true
      private_vlan: false
      hardware_validation: true # (1)!
  # --8<-- [end:hardware_validation]

  # --8<-- [start:structured_config]
  - platforms:
      - 7500R.*
    management_interface: Management0
    reload_delay:
      mlag: 900
      non_mlag: 1020
    tcam_profile: vxlan-routing
    structured_config:
      hardware:
        access_list:
          mechanism: tcam
      hardware_counters:
        features:
          - name: route
            direction: in
      platform:
        sand:
          lag:
            hardware_only: true
  # --8<-- [end:structured_config]

  # --8<-- [start:digital_twin]
  - platforms:
      - 7060X5
    reload_delay:
      mlag: 300
      non_mlag: 330
    digital_twin:
      platform: vEOS-lab
      act_node_type: veos
  # --8<-- [end:digital_twin]

  # --8<-- [start:campus_poe]
  - platforms:
      - 720XP
      - "750"
      - "755"
    management_interface: Management0
    feature_support:
      poe: true
      queue_monitor_length_notify: false
    reload_delay:
      mlag: 300
      non_mlag: 330
  # --8<-- [end:campus_poe]

  # --8<-- [start:virtual_features]
  - platforms:
      - cEOS.*
    feature_support:
      bgp_update_wait_for_convergence: false
      bgp_update_wait_install: false
      interface_storm_control: false
      queue_monitor_length_notify: false
      hardware_validation: false
    reload_delay:
      mlag: 300
      non_mlag: 330
    digital_twin:
      act_node_type: veos
  # --8<-- [end:virtual_features]
