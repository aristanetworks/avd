---
# How-To IPv6 Leaf Configuration

l3leaf:
  defaults:
    platform: ceos
    # IPv4 pool for BGP Router ID (required for IPv6 numbered underlay)
    router_id_pool: 10.255.1.0/27
    # IPv6 pool for Loopback0 addresses
    loopback_ipv6_pool: 2001:db8:1::/48
    loopback_ipv6_offset: 2
    # IPv6 pool for VTEP Loopback1 addresses
    vtep_loopback_ipv6_pool: 2001:db8:3::/48
    # IPv6 pool for P2P uplinks
    uplink_ipv6_pool: 2001:db8:10::/48
    uplink_switches: [htipv6-numbered-spine1, htipv6-numbered-spine2]
    # MLAG peer address family set to IPv6
    mlag_peer_address_family: ipv6
    # IPv6 pool for MLAG peer-link SVI
    mlag_peer_ipv6_pool: 2001:db8:20::/48
    # IPv6 pool for MLAG L3 iBGP peering
    mlag_peer_l3_ipv6_pool: 2001:db8:21::/48
    virtual_router_mac_address: 00:1c:73:00:00:99
    spanning_tree_priority: 4096
    spanning_tree_mode: mstp

  node_groups:
    - group: HTIPV6_L3_LEAFS
      bgp_as: 65101
      nodes:
        - name: htipv6-numbered-leaf1
          id: 1
          mgmt_ip: 172.16.3.101/24
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
        - name: htipv6-numbered-leaf2
          id: 2
          mgmt_ip: 172.16.3.102/24
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
