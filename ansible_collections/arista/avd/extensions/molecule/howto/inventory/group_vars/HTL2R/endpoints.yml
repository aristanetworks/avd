---
# --8<-- [start:endpoints]
# Servers connected to the L2 ring. With `filter.only_vlans_in_use: true` on a
# ring node, AVD only configures VLANs that have an endpoint on this node *or*
# are needed by another ring member reachable through the declared neighbors.
servers:
  - name: server-leaf2
    adapters:
      - switches: [htl2r-l2leaf2]
        switch_ports: [Ethernet10]
        endpoint_ports: [nic1]
        vlans: 100,200
        mode: trunk
  - name: server-leaf5
    adapters:
      - switches: [htl2r-l2leaf5]
        switch_ports: [Ethernet10]
        endpoint_ports: [nic1]
        vlans: 101,200
        mode: trunk
# --8<-- [end:endpoints]
