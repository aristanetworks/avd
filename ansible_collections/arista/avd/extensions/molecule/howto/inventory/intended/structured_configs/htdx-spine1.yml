aaa_accounting:
  dot1x:
    default:
      type: start-stop
      methods:
      - multicast: false
        method: group
        group: DOT1X-RADIUS
aaa_authentication:
  dot1x:
    default: group DOT1X-RADIUS
aaa_root:
  disabled: true
aaa_server_groups:
- name: DOT1X-RADIUS
  type: radius
  servers:
  - server: radius.example.com
    vrf: MGMT
config_end: true
daemon_terminattr:
  cvaddrs:
  - 192.168.1.12:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
dot1x:
  system_auth_control: true
  protocol_lldp_bypass: true
  protocol_bpdu_bypass: true
  dynamic_authorization: true
  radius_av_pair_username_format:
    delimiter: colon
    mac_string_case: lowercase
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_htdx-leaf1a_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.0/31
  metadata:
    peer: htdx-leaf1a
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_htdx-leaf1b_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.4/31
  metadata:
    peer: htdx-leaf1b
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: htdx-spine1
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 192.168.1.1
ip_radius:
  vrfs:
  - name: MGMT
    source_interface: Management1
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.10.1/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.5.11/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 0.pool.ntp.org
    preferred: true
  vrf: MGMT
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.10.0/27 eq 32
radius_server:
  vrfs:
  - name: MGMT
    servers:
    - host: radius.example.com
      key: 151F1241162B2F2D3D2078311604040615
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.255.10.1
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: 7x4B4rnJhZB438m9+BrBfQ==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    password: Q4fqtbqcZ7oQuKfuWtNGRQ==
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.255.255.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: htdx-leaf1a
    description: htdx-leaf1a_Ethernet1
  - ip_address: 10.255.255.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: htdx-leaf1b
    description: htdx-leaf1b_Ethernet1
  - ip_address: 10.255.10.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: htdx-leaf1a
    description: htdx-leaf1a_Loopback0
  - ip_address: 10.255.10.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: htdx-leaf1b
    description: htdx-leaf1b_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
