aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - 192.168.1.12:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management0
  cvvrf: MGMT
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: MLAG_htipv6-numbered-leaf2_Ethernet3
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: htipv6-numbered-leaf2
    peer_interface: Ethernet3
    peer_type: mlag_peer
- name: Ethernet4
  description: MLAG_htipv6-numbered-leaf2_Ethernet4
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: htipv6-numbered-leaf2
    peer_interface: Ethernet4
    peer_type: mlag_peer
- name: Ethernet1
  description: P2P_htipv6-numbered-spine1_Ethernet1
  shutdown: false
  mtu: 1500
  ipv6_addresses:
  - 2001:db8:10::2/64
  metadata:
    peer: htipv6-numbered-spine1
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_htipv6-numbered-spine2_Ethernet1
  shutdown: false
  mtu: 1500
  ipv6_addresses:
  - 2001:db8:10:1::2/64
  metadata:
    peer: htipv6-numbered-spine2
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
hostname: htipv6-numbered-leaf1
ip_domain_lookup:
  source_interfaces:
  - name: Management0
    vrf: MGMT
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 192.168.1.1
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
ipv6_prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY-V6
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:1::/48 eq 128
  - sequence: 20
    action: permit 2001:db8:3::/48 eq 128
ipv6_unicast_routing: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ipv6_addresses:
  - 2001:db8:1::3/128
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ipv6_addresses:
  - 2001:db8:3:3::1/128
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.3.101/24
  type: oob
metadata:
  is_deployed: true
  platform: ceos
  fabric_name: FABRIC
mlag_configuration:
  domain_id: HTIPV6_L3_LEAFS
  local_interface: Vlan4094
  peer_address: 2001:db8:20::2
  peer_link: Port-Channel3
ntp:
  local_interface:
    name: Management0
    vrf: MGMT
  servers:
  - name: 0.pool.ntp.org
    preferred: true
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel3
  description: MLAG_htipv6-numbered-leaf2_Port-Channel3
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 30
    type: permit
    match:
    - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.255.1.1
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv6-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65101'
    description: htipv6-numbered-leaf2
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv6-UNDERLAY-PEERS
    metadata:
      type: ipv6
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2001:db8:21::2
    peer_group: MLAG-IPv6-UNDERLAY-PEER
    metadata:
      peer: htipv6-numbered-leaf2
    description: htipv6-numbered-leaf2_Vlan4093
  - ip_address: 2001:db8:10::1
    peer_group: IPv6-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: htipv6-numbered-spine1
    description: htipv6-numbered-spine1_Ethernet1
  - ip_address: 2001:db8:10:1::1
    peer_group: IPv6-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: htipv6-numbered-spine2
    description: htipv6-numbered-spine2_Ethernet1
  - ip_address: 2001:db8:1::1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: htipv6-numbered-spine1
    description: htipv6-numbered-spine1_Loopback0
  - ip_address: 2001:db8:1::2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: htipv6-numbered-spine2
    description: htipv6-numbered-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
  address_family_ipv6:
    peer_groups:
    - name: MLAG-IPv6-UNDERLAY-PEER
      activate: true
    - name: IPv6-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ipv6_addresses:
  - 2001:db8:21::1/64
  mtu: 1500
- name: Vlan4094
  description: MLAG
  shutdown: false
  ipv6_addresses:
  - 2001:db8:20::1/64
  mtu: 1500
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: htipv6-numbered-leaf1_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      encapsulations:
        ipv6: true
      virtual_router_encapsulation_mac_address: mlag-system-id
