!
no enable password
no aaa root
!
username admin privilege 15 role network-admin nopassword
username arista privilege 15 role network-admin secret sha512 $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.1.12:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname htl2r-leaf1a
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 192.168.1.1
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
vlan 100
   name PROD_VLAN100
!
vlan 101
   name PROD_VLAN101
!
vlan 110
   name INBAND_MGMT
!
vlan 200
   name L2_VLAN200
!
vlan 3179
   name MLAG_L3_VRF_VRF_PROD
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF_PROD
!
interface Port-Channel3
   description MLAG_htl2r-leaf1b_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description P2P_htl2r-spine1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.255.129/31
!
interface Ethernet2
   description P2P_htl2r-spine2_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.255.131/31
!
interface Ethernet3
   description MLAG_htl2r-leaf1b_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_htl2r-leaf1b_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Ethernet10
   description L2_htl2r-l2leaf1_Ethernet1
   no shutdown
   switchport trunk allowed vlan 100-101,110,200
   switchport mode trunk
   switchport
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.8.3/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.9.3/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.4.101/24
!
interface Vlan100
   description PROD_VLAN100
   shutdown
   vrf VRF_PROD
   ip address virtual 10.180.100.1/24
!
interface Vlan101
   description PROD_VLAN101
   shutdown
   vrf VRF_PROD
   ip address virtual 10.180.101.1/24
!
interface Vlan110
   description INBAND_MGMT
   shutdown
   vrf VRF_PROD
   ip address virtual 10.10.10.1/24
!
interface Vlan3179
   description MLAG_L3_VRF_VRF_PROD
   no shutdown
   mtu 9214
   vrf VRF_PROD
   ip address 10.255.9.96/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.255.9.96/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.9.64/31
!
interface Vxlan1
   description htl2r-leaf1a_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 100 vni 18100
   vxlan vlan 101 vni 18101
   vxlan vlan 110 vni 18110
   vxlan vlan 200 vni 18200
   vxlan vrf VRF_PROD vni 180
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_PROD
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.8.0/27 eq 32
   seq 20 permit 10.255.9.0/27 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.9.96/31
!
mlag configuration
   domain-id HTL2R_L3_LEAF1
   local-interface Vlan4094
   peer-address 10.255.9.65
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org prefer
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.255.8.3
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password 7 Q4fqtbqcZ7oQuKfuWtNGRQ==
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS password 7 7x4B4rnJhZB438m9+BrBfQ==
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description htl2r-leaf1b
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER password 7 4b21pAdCvWeAqpcKDFMdWw==
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.255.8.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.8.1 remote-as 65100
   neighbor 10.255.8.1 description htl2r-spine1_Loopback0
   neighbor 10.255.8.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.8.2 remote-as 65100
   neighbor 10.255.8.2 description htl2r-spine2_Loopback0
   neighbor 10.255.9.97 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.9.97 description htl2r-leaf1b_Vlan4093
   neighbor 10.255.255.128 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.128 remote-as 65100
   neighbor 10.255.255.128 description htl2r-spine1_Ethernet3
   neighbor 10.255.255.130 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.130 remote-as 65100
   neighbor 10.255.255.130 description htl2r-spine2_Ethernet3
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 10.255.8.3:18100
      route-target both 18100:18100
      redistribute learned
   !
   vlan 101
      rd 10.255.8.3:18101
      route-target both 18101:18101
      redistribute learned
   !
   vlan 110
      rd 10.255.8.3:18110
      route-target both 18110:18110
      redistribute learned
   !
   vlan 200
      rd 10.255.8.3:18200
      route-target both 18200:18200
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF_PROD
      rd 10.255.8.3:180
      route-target import evpn 180:180
      route-target export evpn 180:180
      router-id 10.255.8.3
      neighbor 10.255.9.97 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.9.97 description htl2r-leaf1b_Vlan3179
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
