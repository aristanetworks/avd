aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - 192.168.1.12:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management0
  cvvrf: MGMT
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_htipv6-numbered-leaf1_Ethernet2
  shutdown: false
  mtu: 9214
  ipv6_addresses:
  - 2001:db8:10:1::1/64
  metadata:
    peer: htipv6-numbered-leaf1
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_htipv6-numbered-leaf2_Ethernet2
  shutdown: false
  mtu: 9214
  ipv6_addresses:
  - 2001:db8:10:3::1/64
  metadata:
    peer: htipv6-numbered-leaf2
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: htipv6-numbered-spine2
ip_domain_lookup:
  source_interfaces:
  - name: Management0
    vrf: MGMT
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 192.168.1.1
ip_routing: true
ipv6_prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY-V6
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:1::/48 eq 128
ipv6_unicast_routing: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ipv6_addresses:
  - 2001:db8:1::2/128
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.3.12/24
  type: oob
metadata:
  is_deployed: true
  platform: ceos
  fabric_name: FABRIC
ntp:
  local_interface:
    name: Management0
    vrf: MGMT
  servers:
  - name: 0.pool.ntp.org
    preferred: true
  vrf: MGMT
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 30
    type: permit
    match:
    - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.255.0.2
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv6-UNDERLAY-PEERS
    metadata:
      type: ipv6
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2001:db8:10:1::2
    peer_group: IPv6-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: htipv6-numbered-leaf1
    description: htipv6-numbered-leaf1_Ethernet2
  - ip_address: 2001:db8:10:3::2
    peer_group: IPv6-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: htipv6-numbered-leaf2
    description: htipv6-numbered-leaf2_Ethernet2
  - ip_address: 2001:db8:1::3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: htipv6-numbered-leaf1
    description: htipv6-numbered-leaf1_Loopback0
  - ip_address: 2001:db8:1::4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: htipv6-numbered-leaf2
    description: htipv6-numbered-leaf2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
  address_family_ipv6:
    peer_groups:
    - name: IPv6-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
