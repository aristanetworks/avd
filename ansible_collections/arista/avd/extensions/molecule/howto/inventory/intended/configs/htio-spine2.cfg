!
no enable password
no aaa root
!
username admin privilege 15 role network-admin nopassword
username arista privilege 15 role network-admin secret sha512 $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.1.12:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname htio-spine2
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 192.168.1.1
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_htio-leaf1a_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.255.130/31
!
interface Ethernet2
   description P2P_htio-leaf1b_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.255.134/31
!
interface Ethernet3
   description P2P_htio-leaf2a_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.255.138/31
!
interface Ethernet4
   description P2P_htio-leaf2b_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.255.142/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.6.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.3.12/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.6.0/27 eq 32
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org prefer
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 10.255.6.2
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password 7 q+VNViP5i4rVjW1cxFv2wA==
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS password 7 AQQvKeimxJu+uGQ/yYvv9w==
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.255.6.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.6.3 remote-as 65101
   neighbor 10.255.6.3 description htio-leaf1a_Loopback0
   neighbor 10.255.6.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.6.4 remote-as 65101
   neighbor 10.255.6.4 description htio-leaf1b_Loopback0
   neighbor 10.255.6.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.6.5 remote-as 65102
   neighbor 10.255.6.5 description htio-leaf2a_Loopback0
   neighbor 10.255.6.6 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.6.6 remote-as 65102
   neighbor 10.255.6.6 description htio-leaf2b_Loopback0
   neighbor 10.255.255.131 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.131 remote-as 65101
   neighbor 10.255.255.131 description htio-leaf1a_Ethernet2
   neighbor 10.255.255.135 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.135 remote-as 65101
   neighbor 10.255.255.135 description htio-leaf1b_Ethernet2
   neighbor 10.255.255.139 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.139 remote-as 65102
   neighbor 10.255.255.139 description htio-leaf2a_Ethernet2
   neighbor 10.255.255.143 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.143 remote-as 65102
   neighbor 10.255.255.143 description htio-leaf2b_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
