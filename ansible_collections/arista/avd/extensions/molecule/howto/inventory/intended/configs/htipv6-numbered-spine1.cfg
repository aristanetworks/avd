!
no enable password
no aaa root
!
username admin privilege 15 role network-admin nopassword
username arista privilege 15 role network-admin secret sha512 $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.1.12:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Management0
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname htipv6-numbered-spine1
ip domain lookup vrf MGMT source-interface Management0
ip name-server vrf MGMT 192.168.1.1
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_htipv6-numbered-leaf1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:10::1/64
!
interface Ethernet2
   description P2P_htipv6-numbered-leaf2_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:10:2::1/64
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8:1::1/128
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.3.11/24
!
ip routing
no ip routing vrf MGMT
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8:1::/48 eq 128
!
ipv6 unicast-routing
!
ntp local-interface vrf MGMT Management0
ntp server vrf MGMT 0.pool.ntp.org prefer
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 10.255.0.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv6-UNDERLAY-PEERS peer group
   neighbor IPv6-UNDERLAY-PEERS send-community
   neighbor IPv6-UNDERLAY-PEERS maximum-routes 256000
   neighbor 2001:db8:1::3 peer group EVPN-OVERLAY-PEERS
   neighbor 2001:db8:1::3 remote-as 65101
   neighbor 2001:db8:1::3 description htipv6-numbered-leaf1_Loopback0
   neighbor 2001:db8:1::4 peer group EVPN-OVERLAY-PEERS
   neighbor 2001:db8:1::4 remote-as 65101
   neighbor 2001:db8:1::4 description htipv6-numbered-leaf2_Loopback0
   neighbor 2001:db8:10:2::2 peer group IPv6-UNDERLAY-PEERS
   neighbor 2001:db8:10:2::2 remote-as 65101
   neighbor 2001:db8:10:2::2 description htipv6-numbered-leaf2_Ethernet1
   neighbor 2001:db8:10::2 peer group IPv6-UNDERLAY-PEERS
   neighbor 2001:db8:10::2 remote-as 65101
   neighbor 2001:db8:10::2 description htipv6-numbered-leaf1_Ethernet1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv6
      neighbor IPv6-UNDERLAY-PEERS activate
!
end
