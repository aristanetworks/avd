!
no enable password
no aaa root
!
username admin privilege 15 role network-admin nopassword
username arista privilege 15 role network-admin secret sha512 $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.1.12:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname htns-l3-leaf1
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 192.168.1.1
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
vlan 100
   name Production_App1
!
vlan 101
   name Production_DB
!
vlan 200
   name Dev_App1
!
vlan 3099
   name MLAG_L3_VRF_VRF_PRODUCTION
   trunk group MLAG
!
vlan 3199
   name MLAG_L3_VRF_VRF_DEVELOPMENT
   trunk group MLAG
!
vlan 3401
   name L2_VLAN3401
!
vlan 3402
   name L2_VLAN3402
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF_DEVELOPMENT
!
vrf instance VRF_PRODUCTION
!
interface Port-Channel3
   description MLAG_htns-l3-leaf2_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel8
   description L2_htns-l2-leaf1_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 100-101
   switchport mode trunk
   switchport
!
interface Ethernet3
   description MLAG_htns-l3-leaf2_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_htns-l3-leaf2_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Ethernet8
   description L2_htns-l2-leaf1_Ethernet1
   no shutdown
   channel-group 8 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.0.3/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.1.3/32
!
interface Loopback10
   description DIAG_VRF_VRF_PRODUCTION
   no shutdown
   vrf VRF_PRODUCTION
   ip address 10.255.10.3/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.1.101/24
!
interface Vlan100
   description Production_App1
   no shutdown
   mtu 9000
   vrf VRF_PRODUCTION
   ip address virtual 10.100.100.1/24
!
interface Vlan101
   description Production_DB
   no shutdown
   mtu 9000
   vrf VRF_PRODUCTION
   ip address virtual 10.100.101.1/24
!
interface Vlan200
   description Dev_App1
   no shutdown
   vrf VRF_DEVELOPMENT
   ip address virtual 10.200.100.1/24
!
interface Vlan3099
   description MLAG_L3_VRF_VRF_PRODUCTION
   no shutdown
   mtu 1500
   vrf VRF_PRODUCTION
   ip address 10.255.1.96/31
!
interface Vlan3199
   description MLAG_L3_VRF_VRF_DEVELOPMENT
   no shutdown
   mtu 1500
   vrf VRF_DEVELOPMENT
   ip address 10.255.1.96/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 10.255.1.96/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.255.1.64/31
!
interface Vxlan1
   description htns-l3-leaf1_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 101 vni 10101
   vxlan vlan 200 vni 10200
   vxlan vlan 3401 vni 13401
   vxlan vlan 3402 vni 13402
   vxlan vrf VRF_DEVELOPMENT vni 200
   vxlan vrf VRF_PRODUCTION vni 100
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip address virtual source-nat vrf VRF_PRODUCTION address 10.255.10.3
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_DEVELOPMENT
ip routing vrf VRF_PRODUCTION
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/27 eq 32
   seq 20 permit 10.255.1.0/27 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.1.96/31
!
mlag configuration
   domain-id HTNS_L3_LEAFS
   local-interface Vlan4094
   peer-address 10.255.1.65
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org prefer
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.255.0.3
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description htns-l3-leaf2
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER password 7 4b21pAdCvWeAqpcKDFMdWw==
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.255.1.97 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.1.97 description htns-l3-leaf2_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 10.255.0.3:10100
      route-target both 10100:10100
      redistribute learned
   !
   vlan 101
      rd 10.255.0.3:10101
      route-target both 10101:10101
      redistribute learned
   !
   vlan 200
      rd 10.255.0.3:10200
      route-target both 10200:10200
      redistribute learned
   !
   vlan 3401
      rd 10.255.0.3:13401
      route-target both 13401:13401
      redistribute learned
   !
   vlan 3402
      rd 10.255.0.3:13402
      route-target both 13402:13402
      redistribute learned
   !
   address-family ipv4
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF_DEVELOPMENT
      rd 10.255.0.3:200
      route-target import evpn 200:200
      route-target export evpn 200:200
      router-id 10.255.0.3
      neighbor 10.255.1.97 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.1.97 description htns-l3-leaf2_Vlan3199
      redistribute connected route-map RM-CONN-2-BGP-VRFS
   !
   vrf VRF_PRODUCTION
      rd 10.255.0.3:100
      route-target import evpn 100:100
      route-target export evpn 100:100
      router-id 10.255.0.3
      neighbor 10.255.1.97 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.1.97 description htns-l3-leaf2_Vlan3099
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
