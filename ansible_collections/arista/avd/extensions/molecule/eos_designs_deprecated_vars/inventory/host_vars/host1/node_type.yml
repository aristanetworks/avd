---
evpn_overlay_bgp_rtc: true
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    id: 101
    bgp_as: 101
    # Used for OSPF
    uplink_switches: [host1]
    uplink_switch_interfaces: [Ethernet41]
    uplink_interfaces: [Ethernet42]
    uplink_ipv4_pool: 192.168.42.0/24
    platform: vEOS
  nodes:
    - name: host1
      id: 101
      bgp_as: 101
  node_groups:
    - group: sflow-tests-leaf-mlag
      bgp_as: 65105
      nodes:
        - name: host1
          id: 5
          mlag: false
          mgmt_ip: 192.168.0.103/24
          # Used by source-interfaces test:
          inband_mgmt_interface: Vlan10
          inband_mgmt_ip: 10.20.30.40/24
          inband_mgmt_gateway: 10.20.30.1
          inband_mgmt_vrf: INBANDMGMT
          evpn_gateway:
            evpn_l3:
              enabled: true
              inter_domain: true
            # Testing the deprecated enable_d_path, evpn_domain_id_local and evpn_domain_id_remote keys
            all_active_multihoming:
              enabled: true
              enable_d_path: true
              evpn_domain_id_local: "65200:2"
              evpn_domain_id_remote: "65100:1"
              evpn_ethernet_segment:
                identifier: 0000:0001:0001:0000:0509
                rt_import: 00:00:00:00:07:09

# Used by source-interfaces test: Testing that the generated source interfaces do not contain the VRF if VRF "default"
mgmt_interface_vrf: default

aaa_settings:
  radius:
    servers:
      - host: 11.10.10.11
        vrf: default
        key: 071B245F5A
        cleartext_key: arista
        groups:
          - RADIUS1

      - host: 11.10.10.5
        vrf: MGMT1
        key: 071B245F5A
        tls:
          enabled: true
          ssl_profile: HOST_SSL_PROFILE
          port: 2080
        groups:
          - RADIUS1

      - host: 11.10.10.3
        vrf: MGMT
        cleartext_key: arista
        groups:
          - RADIUS1

    vrfs:
      - name: default
        source_interface: Vlan123
      - name: MGMT
        source_interface: Vlan125
      - name: MGMT1
        source_interface: Vlan125
