aaa_root:
  disabled: true
aaa_server_groups:
- name: RADIUS1
  type: radius
  servers:
  - server: 11.10.10.11
    vrf: default
  - server: 11.10.10.5
    vrf: MGMT1
  - server: 11.10.10.3
    vrf: MGMT
- name: TACACS1
  type: tacacs+
  servers:
  - server: 10.10.10.11
    vrf: default
  - server: 10.10.10.1
    vrf: default
  - server: 10.10.10.2
    vrf: MGMT
  - server: 10.10.10.3
    vrf: default
  - server: 10.10.10.2
    vrf: MGMT1
  - server: nodomain.co
    vrf: default
  - server: '1:1:1:1:1:1:1:1'
    vrf: MGMT
- name: TACACS2
  type: tacacs+
  servers:
  - server: 10.10.10.1
    vrf: default
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet41
  description: P2P_host1_Ethernet42
  shutdown: false
  mtu: 9214
  ip_address: 192.168.42.200/31
  pim:
    ipv4:
      sparse_mode: true
  metadata:
    peer: host1
    peer_interface: Ethernet42
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet42
  description: P2P_host1_Ethernet41
  shutdown: false
  mtu: 9214
  ip_address: 192.168.42.201/31
  pim:
    ipv4:
      sparse_mode: true
  metadata:
    peer: host1
    peer_interface: Ethernet41
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet1
  shutdown: false
  ip_address: 172.16.0.2/30
  access_group_in: TEST-IPV4-ACL-WITH-IP-FIELDS-IN_Ethernet1
  metadata:
    peer_type: l3_interface
  switchport:
    enabled: false
hostname: host1
ip_access_lists:
- name: TEST-IPV4-ACL-WITH-IP-FIELDS-IN_Ethernet1
  entries:
  - action: permit
    protocol: ip
    source: 172.16.0.1/30
    destination: 172.16.0.2
    vlan_inner: true
    vlan_number: 123
    vlan_mask: '0x000'
ip_igmp_snooping:
  globally_enabled: true
  vlans:
  - id: 301
    querier:
      enabled: true
      address: 192.168.255.101
      version: 3
  - id: 302
    querier:
      enabled: true
      address: 2.2.2.2
      version: 2
  - id: 401
    enabled: false
ip_radius:
  source_interface: Vlan123
  vrfs:
  - name: MGMT1
    source_interface: Vlan125
  - name: MGMT
    source_interface: Vlan125
ip_routing: true
ip_tacacs:
  source_interface: Vlan123
  vrfs:
  - name: MGMT
    source_interface: Vlan125
  - name: MGMT1
    source_interface: Vlan125
ip_virtual_router_mac_address: 00:1c:73:00:00:01
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.101/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.101/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.103/24
  type: oob
  gateway: 192.168.200.1
metadata:
  is_deployed: true
  platform: vEOS
  fabric_name: EOS_DESIGNS_DEPRECATED_VARS
  validate_hardware:
    enabled: false
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
radius_server:
  servers:
  - host: 11.10.10.11
    key: 071B245F5A
  vrfs:
  - name: MGMT1
    servers:
    - host: 11.10.10.5
      tls:
        enabled: true
        ssl_profile: HOST_SSL_PROFILE
        port: 2080
  - name: MGMT
    servers:
    - host: 11.10.10.3
      key: 0112140D481F07
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '101'
  router_id: 192.168.255.101
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
    bestpath:
      d_path: true
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  neighbors:
  - ip_address: 192.168.42.201
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '101'
    metadata:
      peer: host1
    description: host1_Ethernet42
  - ip_address: 192.168.42.200
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '101'
    metadata:
      peer: host1
    description: host1_Ethernet41
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 301
    metadata:
      tenants:
      - Tenant_G
    rd: 192.168.255.101:30301
    route_targets:
      both:
      - 30301:30301
    redistribute_routes:
    - learned
  - id: 302
    metadata:
      tenants:
      - Tenant_G
    rd: 192.168.255.101:30302
    route_targets:
      both:
      - 30302:30302
    redistribute_routes:
    - learned
  - id: 22
    metadata:
      tenants:
      - Tenant_H
    rd: 192.168.255.101:40022
    route_targets:
      both:
      - 40022:40022
    redistribute_routes:
    - learned
  - id: 401
    metadata:
      tenants:
      - Tenant_H
    rd: 192.168.255.101:40401
    route_targets:
      both:
      - 40401:40401
    redistribute_routes:
    - learned
  address_family_evpn:
    domain_identifier: '65200:2'
    domain_identifier_remote: '65100:1'
    neighbor_default:
      next_hop_self_received_evpn_routes:
        enable: true
        inter_domain: true
    evpn_ethernet_segment:
    - domain: all
      identifier: 0000:0001:0001:0000:0509
      route_target_import: 00:00:00:00:07:09
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
  vrfs:
  - name: IGMP_QUERIER_TEST_3
    rd: 192.168.255.101:41
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '41:41'
      export:
      - address_family: evpn
        route_targets:
        - '41:41'
    router_id: 192.168.255.101
    redistribute:
      connected:
        enabled: true
router_multicast:
  ipv4:
    routing: true
    software_forwarding: sfe
service_routing_protocols_model: multi-agent
snmp_server:
  contact: example@example.com
  communities:
  - name: SNMP-COMMUNITY-1
    access: ro
    access_list_ipv4:
      name: acl1
  - name: SNMP-COMMUNITY-2
    access: rw
    access_list_ipv4:
      name: SNMP-MGMT
    access_list_ipv6:
      name: SNMP-MGMT
    view: VW-READ
  - name: SNMP-COMMUNITY-3
standard_access_lists:
- name: acl1
  entries:
  - sequence: 10
    action: permit
    source: 10.0.0.1
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.200.1
tacacs_servers:
  hosts:
  - host: 10.10.10.11
    vrf: default
    key: 071B245F5A
  - host: 10.10.10.1
    vrf: default
    key: 071B245F5A
  - host: 10.10.10.2
