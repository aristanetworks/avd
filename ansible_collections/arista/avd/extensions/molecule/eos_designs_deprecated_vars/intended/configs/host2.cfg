!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname host2
!
vrf instance deprecated_mgmt_interface_vrf
!
interface Management2
   description deprecated_mgmt_interface_description
   no shutdown
   vrf deprecated_mgmt_interface_vrf
   ip address 192.168.0.2/24
ip routing vrf deprecated_mgmt_interface_vrf
!
end
