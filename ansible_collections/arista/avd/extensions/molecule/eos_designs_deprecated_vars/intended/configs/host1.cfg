!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
ip igmp snooping vlan 301 querier
ip igmp snooping vlan 301 querier address 192.168.255.101
ip igmp snooping vlan 301 querier version 3
ip igmp snooping vlan 302 querier
ip igmp snooping vlan 302 querier address 2.2.2.2
ip igmp snooping vlan 302 querier version 2
no ip igmp snooping vlan 401
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname host1
!
vlan 22
   name VLAN_22
!
vlan 301
   name VLAN_301
!
vlan 302
   name VLAN_302
!
vlan 401
   name VLAN_401
!
vrf instance IGMP_QUERIER_TEST_3
   description IGMP_QUERIER_TEST
!
radius-server host 11.10.10.11 key 7 071B245F5A
radius-server host 11.10.10.5 vrf MGMT1 tls ssl-profile HOST_SSL_PROFILE port 2080
radius-server host 11.10.10.3 vrf MGMT key 7 0112140D481F07
!
aaa group server radius RADIUS1
   server 11.10.10.11 vrf default
   server 11.10.10.5 vrf MGMT1
   server 11.10.10.3 vrf MGMT
!
tacacs-server host 10.10.10.11 key 7 071B245F5A
tacacs-server host 10.10.10.1 key 7 071B245F5A
tacacs-server host 10.10.10.2 vrf MGMT key 7 071B245F5A
tacacs-server host 10.10.10.3 key 7 071B245F5A
tacacs-server host 10.10.10.2 vrf MGMT1 key 7 15131905173E2A
tacacs-server host nodomain.co key 7 071B245F5A
tacacs-server host 1:1:1:1:1:1:1:1 vrf MGMT key 7 071B245F5A
tacacs-server host 10.10.10.42 key 7 071B245F5A
!
aaa group server tacacs+ TACACS1
   server 10.10.10.11 vrf default
   server 10.10.10.1 vrf default
   server 10.10.10.2 vrf MGMT
   server 10.10.10.3 vrf default
   server 10.10.10.2 vrf MGMT1
   server nodomain.co vrf default
   server 1:1:1:1:1:1:1:1 vrf MGMT
!
aaa group server tacacs+ TACACS2
   server 10.10.10.1 vrf default
!
interface Ethernet41
   description P2P_host1_Ethernet42
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.42.200/31
   pim ipv4 sparse-mode
!
interface Ethernet42
   description P2P_host1_Ethernet41
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.42.201/31
   pim ipv4 sparse-mode
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.101/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.101/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.103/24
!
interface Vlan22
   description VLAN_22
   no shutdown
   vrf IGMP_QUERIER_TEST_3
   ip address virtual 10.0.22.1/24
!
interface Vxlan1
   description host1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 22 vni 40022
   vxlan vlan 301 vni 30301
   vxlan vlan 302 vni 30302
   vxlan vlan 401 vni 40401
   vxlan vrf IGMP_QUERIER_TEST_3 vni 41
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
ip routing vrf IGMP_QUERIER_TEST_3
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip route 0.0.0.0/0 192.168.200.1
!
ip radius vrf default source-interface Vlan123
!
ip radius vrf MGMT1 source-interface Vlan125
!
ip radius vrf MGMT source-interface Vlan125
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 101
   router-id 192.168.255.101
   no bgp default ipv4-unicast
   maximum-paths 4
   bgp bestpath d-path
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 192.168.42.200 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.42.200 remote-as 101
   neighbor 192.168.42.200 description host1_Ethernet41
   neighbor 192.168.42.201 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.42.201 remote-as 101
   neighbor 192.168.42.201 description host1_Ethernet42
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 22
      rd 192.168.255.101:40022
      route-target both 40022:40022
      redistribute learned
   !
   vlan 301
      rd 192.168.255.101:30301
      route-target both 30301:30301
      redistribute learned
   !
   vlan 302
      rd 192.168.255.101:30302
      route-target both 30302:30302
      redistribute learned
   !
   vlan 401
      rd 192.168.255.101:40401
      route-target both 40401:40401
      redistribute learned
   !
   address-family evpn
      domain identifier 65200:2
      domain identifier 65100:1 remote
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
      !
      evpn ethernet-segment domain all
         identifier 0000:0001:0001:0000:0509
         route-target import 00:00:00:00:07:09
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf IGMP_QUERIER_TEST_3
      rd 192.168.255.101:41
      route-target import evpn 41:41
      route-target export evpn 41:41
      router-id 192.168.255.101
      redistribute connected
!
router multicast
   ipv4
      routing
      software-forwarding sfe
!
ip tacacs vrf default source-interface Vlan123
!
ip tacacs vrf MGMT source-interface Vlan125
!
ip tacacs vrf MGMT1 source-interface Vlan125
!
end
