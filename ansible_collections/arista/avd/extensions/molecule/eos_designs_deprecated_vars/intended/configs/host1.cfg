!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
ip igmp snooping vlan 252 querier
ip igmp snooping vlan 252 querier address 192.168.255.101
ip igmp snooping vlan 252 fast-leave
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname host1
!
vlan 251
   name MULTICAST_DISABLED_251
!
vlan 252
   name MULTICAST_ENABLED_252
!
radius-server host 11.10.10.11 key 7 071B245F5A
radius-server host 11.10.10.5 vrf MGMT1 tls ssl-profile HOST_SSL_PROFILE port 2080
radius-server host 11.10.10.3 vrf MGMT key 7 0112140D481F07
!
aaa group server radius RADIUS1
   server 11.10.10.11 vrf default
   server 11.10.10.5 vrf MGMT1
   server 11.10.10.3 vrf MGMT
!
tacacs-server host 10.10.10.11 key 7 071B245F5A
tacacs-server host 10.10.10.1 key 7 071B245F5A
tacacs-server host 10.10.10.2 vrf MGMT key 7 071B245F5A
tacacs-server host 10.10.10.3 key 7 071B245F5A
tacacs-server host 10.10.10.2 vrf MGMT1 key 7 15131905173E2A
tacacs-server host nodomain.co key 7 071B245F5A
tacacs-server host 1:1:1:1:1:1:1:1 vrf MGMT key 7 071B245F5A
tacacs-server host 10.10.10.42 key 7 071B245F5A
!
aaa group server tacacs+ TACACS1
   server 10.10.10.11 vrf default
   server 10.10.10.1 vrf default
   server 10.10.10.2 vrf MGMT
   server 10.10.10.3 vrf default
   server 10.10.10.2 vrf MGMT1
   server nodomain.co vrf default
   server 1:1:1:1:1:1:1:1 vrf MGMT
!
aaa group server tacacs+ TACACS2
   server 10.10.10.1 vrf default
!
interface Ethernet41
   description P2P_host1_Ethernet42
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.42.200/31
   pim ipv4 sparse-mode
!
interface Ethernet42
   description P2P_host1_Ethernet41
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.42.201/31
   pim ipv4 sparse-mode
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.101/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.101/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.103/24
!
interface Vxlan1
   description host1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 251 vni 10251
   vxlan vlan 252 vni 10252
   vxlan vlan 252 multicast group 232.0.0.251
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip route 0.0.0.0/0 192.168.200.1
!
ip radius vrf default source-interface Vlan123
ip radius vrf MGMT1 source-interface Vlan125
ip radius vrf MGMT source-interface Vlan125
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 101
   router-id 192.168.255.101
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 192.168.42.200 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.42.200 remote-as 101
   neighbor 192.168.42.200 description host1_Ethernet41
   neighbor 192.168.42.201 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.42.201 remote-as 101
   neighbor 192.168.42.201 description host1_Ethernet42
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 251
      rd 192.168.255.101:10251
      route-target both 10251:10251
      redistribute learned
   !
   vlan 252
      rd 192.168.255.101:10252
      route-target both 10252:10252
      redistribute igmp
      redistribute learned
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
router multicast
   ipv4
      routing
      software-forwarding sfe
!
ip tacacs vrf default source-interface Vlan123
ip tacacs vrf MGMT source-interface Vlan125
ip tacacs vrf MGMT1 source-interface Vlan125
!
end
