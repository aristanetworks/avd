!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname host1
!
radius-server host 11.10.10.11 key 7 071B245F5A
radius-server host 11.10.10.5 vrf MGMT1 tls ssl-profile HOST_SSL_PROFILE port 2080
radius-server host 11.10.10.3 vrf MGMT key 7 0112140D481F07
!
aaa group server radius RADIUS1
   server 11.10.10.11 vrf default
   server 11.10.10.5 vrf MGMT1
   server 11.10.10.3 vrf MGMT
!
interface Ethernet41
   description P2P_host1_Ethernet42
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.42.200/31
!
interface Ethernet42
   description P2P_host1_Ethernet41
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.42.201/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.101/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.101/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.103/24
!
interface Vxlan1
   description host1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip radius source-interface Vlan123
ip radius vrf MGMT source-interface Vlan125
ip radius vrf MGMT1 source-interface Vlan125
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 101
   router-id 192.168.255.101
   no bgp default ipv4-unicast
   maximum-paths 4
   bgp bestpath d-path
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 192.168.42.200 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.42.200 remote-as 101
   neighbor 192.168.42.200 description host1_Ethernet41
   neighbor 192.168.42.201 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.42.201 remote-as 101
   neighbor 192.168.42.201 description host1_Ethernet42
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      domain identifier 65200:2
      domain identifier 65100:1 remote
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
      !
      evpn ethernet-segment domain all
         identifier 0000:0001:0001:0000:0509
         route-target import 00:00:00:00:07:09
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
