---
- name: Verify
  hosts: DIGITAL_TWIN_CONTAINERLAB
  gather_facts: false
  connection: local
  tasks:
    - name: Assert Containerlab topology file exists
      delegate_to: 127.0.0.1
      ansible.builtin.stat:
        path: "{{ root_dir }}/digital_twin/{{ fabric_name }}-topology.clab.yml"
      register: containerlab_topology_file
      run_once: true

    - name: Read Containerlab topology and interface mapping
      ansible.builtin.set_fact:
        containerlab_topology: "{{ lookup('ansible.builtin.file', root_dir ~ '/digital_twin/' ~ fabric_name ~ '-topology.clab.yml') | from_yaml }}"
        containerlab_mapping: "{{ lookup('ansible.builtin.file', root_dir ~ '/digital_twin/interface_mapping.json') | from_json }}"
      run_once: true

    - name: Assert Containerlab interface mapping file exists
      delegate_to: 127.0.0.1
      ansible.builtin.stat:
        path: "{{ root_dir }}/digital_twin/interface_mapping.json"
      register: containerlab_interface_mapping_file
      run_once: true

    - name: Validate generated Containerlab topology artifact
      ansible.builtin.assert:
        that:
          - "containerlab_topology_file.stat.exists"
          - "containerlab_interface_mapping_file.stat.exists"
          - "containerlab_topology.name == fabric_name"
          - "containerlab_topology.prefix == ''"
          - "containerlab_topology.mgmt['ipv4-subnet'] == '172.16.1.0/24'"
          - "containerlab_topology.topology.nodes | length == 4"
          - "containerlab_topology.topology.links | length == 4"
          - "containerlab_topology.topology.links | map(attribute='endpoints') | unique | length == 4"
          - "containerlab_mapping.ManagementIntf.eth0 == 'Management1'"
          - "containerlab_mapping.EthernetIntf.eth1 == 'Ethernet1'"
      run_once: true

    - name: Check referenced startup configurations
      delegate_to: 127.0.0.1
      ansible.builtin.stat:
        path: "{{ root_dir }}/digital_twin/{{ item.value['startup-config'] }}"
      loop: "{{ containerlab_topology.topology.nodes | dict2items }}"
      register: containerlab_startup_configs
      run_once: true

    - name: Validate referenced startup configurations
      ansible.builtin.assert:
        that:
          - "item.stat.exists"
      loop: "{{ containerlab_startup_configs.results }}"
      run_once: true
