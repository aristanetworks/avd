aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: containerlab-single-switch-fabric-1
ip_igmp_snooping:
  globally_enabled: true
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.0.2.1/32
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: DIGITAL_TWIN_CONTAINERLAB
  validate_hardware:
    enabled: false
  digital_twin:
    environment: containerlab
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
