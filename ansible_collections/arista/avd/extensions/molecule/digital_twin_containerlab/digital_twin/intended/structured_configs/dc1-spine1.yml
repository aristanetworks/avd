aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_dc1-leaf1a_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.0/31
  metadata:
    peer: dc1-leaf1a
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet1/3
  description: P2P_dc1-leaf2a_Ethernet1/1
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.4/31
  metadata:
    peer: dc1-leaf2a
    peer_interface: Ethernet1/1
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: dc1-spine1
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.1/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.1.11/24
  type: oob
  gateway: 172.16.1.1
metadata:
  is_deployed: true
  platform: cEOSLab
  fabric_name: DIGITAL_TWIN_CONTAINERLAB
  validate_hardware:
    enabled: false
  digital_twin:
    environment: containerlab
router_bgp:
  as: '65100'
  router_id: 10.255.0.1
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  neighbors:
  - ip_address: 10.255.255.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: dc1-leaf1a
    description: dc1-leaf1a_Ethernet1
  - ip_address: 10.255.255.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: dc1-leaf2a
    description: dc1-leaf2a_Ethernet1/1
  redistribute:
    connected:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.16.1.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
