---
name: DIGITAL_TWIN_CONTAINERLAB, Containerlab Digital Twin
prefix: avd-dt
topology:
  defaults:
    kind: arista_ceos
  kinds:
    arista_ceos:
      enforce-startup-config: true
      image: arista/ceos:latest
  nodes:
    containerlab-single-switch-fabric-1:
      mgmt-ipv4: 192.0.2.1
    dc1-leaf1a:
      mgmt-ipv4: 172.16.1.101
    dc1-leaf2a:
      mgmt-ipv4: 172.16.1.102
    dc1-spine1:
      mgmt-ipv4: 172.16.1.11
    dc1-spine2:
      mgmt-ipv4: 172.16.1.12
  links:
  - endpoints:
    - dc1-leaf1a:Ethernet1
    - dc1-spine1:Ethernet1
  - endpoints:
    - dc1-leaf1a:Ethernet2
    - dc1-spine2:Ethernet1
  - endpoints:
    - dc1-leaf2a:Ethernet1
    - dc1-spine1:Ethernet2
  - endpoints:
    - dc1-leaf2a:Ethernet2
    - dc1-spine2:Ethernet2
