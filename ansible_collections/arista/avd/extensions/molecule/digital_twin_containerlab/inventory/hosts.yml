---
all:
  children:
    DIGITAL_TWIN_CONTAINERLAB:
      children:
        DIGITAL_TWIN_CONTAINERLAB_FABRIC:
          children:
            DC1:
              children:
                DC1_SPINES:
                  hosts:
                    dc1-spine1:
                      ansible_host: 172.16.1.11
                    dc1-spine2:
                      ansible_host: 172.16.1.12
                DC1_L3_LEAVES:
                  hosts:
                    dc1-leaf1a:
                      ansible_host: 172.16.1.101
                    dc1-leaf2a:
                      ansible_host: 172.16.1.102
    DIGITAL_TWIN_CONTAINERLAB_UNSUPPORTED_MGMT_IP:
      children:
        DIGITAL_TWIN_CONTAINERLAB_UNSUPPORTED_MGMT_IP_DHCP:
          hosts:
            containerlab-dhcp-mgmt:
              ansible_host: containerlab-dhcp-mgmt
        DIGITAL_TWIN_CONTAINERLAB_UNSUPPORTED_MGMT_IP_EMPTY:
          hosts:
            containerlab-empty-mgmt:
              ansible_host: containerlab-empty-mgmt
        DIGITAL_TWIN_CONTAINERLAB_UNSUPPORTED_MGMT_IP_NULL:
          hosts:
            containerlab-null-mgmt:
              ansible_host: containerlab-null-mgmt
    DIGITAL_TWIN_CONTAINERLAB_MULTIPLE_MGMT_SUBNETS:
      hosts:
        containerlab-subnet-a:
          ansible_host: containerlab-subnet-a
        containerlab-subnet-b:
          ansible_host: containerlab-subnet-b
    IGNORE_IN_PYTEST:
      children:
        DIGITAL_TWIN_CONTAINERLAB_UNSUPPORTED_MGMT_IP:
        DIGITAL_TWIN_CONTAINERLAB_MULTIPLE_MGMT_SUBNETS:
