---
- name: Converge
  hosts: DIGITAL_TWIN_CONTAINERLAB
  gather_facts: false
  connection: local
  vars:
    output_dir_name: "digital_twin/intended"
    documentation_dir_name: "digital_twin/documentation"
    avd_digital_twin_mode: true
    avd_ignore_requirements: true
    eos_designs_documentation:
      enable: false
      topology_csv: false
      p2p_links_csv: false
  tasks:
    - name: Generate intended variables in Containerlab Digital Twin mode
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: Generate intended EOS configs in Containerlab Digital Twin mode
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen

- name: Converge expected failure for Containerlab Digital Twin without static management IP
  hosts: DIGITAL_TWIN_CONTAINERLAB_UNSUPPORTED_MGMT_IP_DHCP
  gather_facts: false
  connection: local
  vars: &unsupported_mgmt_ip_vars
    output_dir_name: "digital_twin/intended"
    documentation_dir_name: "digital_twin/documentation"
    avd_digital_twin_mode: true
    avd_ignore_requirements: true
    eos_designs_documentation:
      enable: false
      topology_csv: false
      p2p_links_csv: false
  tasks: &unsupported_mgmt_ip_tasks
    - name: Run expected failure scenario
      block:
        - name: Generate intended variables in Containerlab Digital Twin mode
          delegate_to: 127.0.0.1
          ansible.builtin.import_role:
            name: arista.avd.eos_designs

        - name: Fail if unsupported management IP did not fail
          ansible.builtin.fail:
            msg: "Expected Containerlab Digital Twin generation to fail for unsupported management IP."

      rescue:
        - name: Assert Containerlab Digital Twin failed with the expected error message
          run_once: true
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - expected_error_message in ansible_failed_result.msg

- name: Converge expected failure for Containerlab Digital Twin with empty management IP
  hosts: DIGITAL_TWIN_CONTAINERLAB_UNSUPPORTED_MGMT_IP_EMPTY
  gather_facts: false
  connection: local
  vars: *unsupported_mgmt_ip_vars
  tasks: *unsupported_mgmt_ip_tasks

- name: Converge expected failure for Containerlab Digital Twin with null management IP
  hosts: DIGITAL_TWIN_CONTAINERLAB_UNSUPPORTED_MGMT_IP_NULL
  gather_facts: false
  connection: local
  vars: *unsupported_mgmt_ip_vars
  tasks: *unsupported_mgmt_ip_tasks
