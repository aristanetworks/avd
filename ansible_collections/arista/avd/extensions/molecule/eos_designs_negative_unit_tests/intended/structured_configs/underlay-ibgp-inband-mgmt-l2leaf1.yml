aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: L2_underlay-ibgp-inband-mgmt-leaf1_Ethernet10
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: underlay-ibgp-inband-mgmt-leaf1
    peer_interface: Ethernet10
    peer_type: l3leaf
hostname: underlay-ibgp-inband-mgmt-l2leaf1
ip_igmp_snooping:
  globally_enabled: true
metadata:
  is_deployed: true
  fabric_name: FABRIC_UNDERLAY_IBGP_INBAND_MGMT
port_channel_interfaces:
- name: Port-Channel1
  description: L2_underlay-ibgp-inband-mgmt-leaf1_Port-Channel10
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: '100'
service_routing_protocols_model: multi-agent
static_routes:
- prefix: 0.0.0.0/0
  next_hop: 10.254.100.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan100
  description: Inband Management
  shutdown: false
  ip_address: 10.254.100.4/24
  mtu: 1500
  metadata:
    type: inband_mgmt
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 100
  name: INBAND_MGMT
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
