aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_underlay-ibgp-duplicate-cluster-ids-pod1-spine1_Ethernet7
  shutdown: false
  mtu: 9214
  ipv6_enable: true
  metadata:
    peer: underlay-ibgp-duplicate-cluster-ids-pod1-spine1
    peer_interface: Ethernet7
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_underlay-ibgp-duplicate-cluster-ids-pod2-spine1_Ethernet7
  shutdown: false
  mtu: 9214
  ipv6_enable: true
  metadata:
    peer: underlay-ibgp-duplicate-cluster-ids-pod2-spine1
    peer_interface: Ethernet7
    peer_type: spine
  switchport:
    enabled: false
hostname: underlay-ibgp-duplicate-cluster-ids-ssp1
ip_routing_ipv6_interfaces: true
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.254.10.1/32
metadata:
  is_deployed: true
  fabric_name: FABRIC_UNDERLAY_IBGP_DUPLICATE_CLUSTER_IDS
router_bgp:
  as: '65000'
  router_id: 10.254.10.1
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_cluster_id: 10.254.10.1
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: RR-CLIENTS-UNDERLAY-PEERS
    metadata:
      type: ipv4
    route_reflector_client: true
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
  neighbor_interfaces:
  - name: Ethernet1
    remote_as: '65000'
    metadata:
      peer: underlay-ibgp-duplicate-cluster-ids-pod1-spine1
    peer_group: RR-CLIENTS-UNDERLAY-PEERS
    description: underlay-ibgp-duplicate-cluster-ids-pod1-spine1_Ethernet7
  - name: Ethernet2
    remote_as: '65000'
    metadata:
      peer: underlay-ibgp-duplicate-cluster-ids-pod2-spine1
    peer_group: RR-CLIENTS-UNDERLAY-PEERS
    description: underlay-ibgp-duplicate-cluster-ids-pod2-spine1_Ethernet7
  redistribute:
    connected:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: RR-CLIENTS-UNDERLAY-PEERS
      activate: true
      next_hop:
        address_family_ipv6:
          enabled: true
          originate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
