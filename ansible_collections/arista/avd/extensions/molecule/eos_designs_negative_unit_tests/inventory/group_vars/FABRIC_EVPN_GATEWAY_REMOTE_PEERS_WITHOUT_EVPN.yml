---
fabric_name: FABRIC_EVPN_GATEWAY_REMOTE_PEERS_WITHOUT_EVPN

type: l3leaf
avd_design_future:
  # Test reverse EVPN Gateway validation when the peer requesting reverse
  # peering does not have EVPN overlay enabled.
  configure_reverse_evpn_gateway_remote_peers: true

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    bgp_as: 65101
    mlag: false
  nodes:
    - name: evpn-gateway-remote-peer-without-evpn
      id: 1
    - name: evpn-gateway-remote-peer-target
      id: 2
      evpn_gateway:
        remote_peers:
          # overlay_routing_protocol is set to "none" for this inventory peer in hosts.yml.
          - hostname: evpn-gateway-remote-peer-without-evpn

expected_error_message: >-
  Cannot configure EVPN Gateway remote peer 'evpn-gateway-remote-peer-without-evpn' on 'evpn-gateway-remote-peer-target'
  because EVPN is not enabled with a 'server' or 'client' role for 'evpn-gateway-remote-peer-without-evpn'.
  Remove 'evpn_gateway.remote_peers' or enable EVPN with a supported role.
