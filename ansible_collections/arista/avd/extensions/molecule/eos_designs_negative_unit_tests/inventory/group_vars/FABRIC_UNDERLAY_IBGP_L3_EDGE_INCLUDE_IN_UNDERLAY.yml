---
fabric_name: FABRIC_UNDERLAY_IBGP_L3_EDGE_INCLUDE_IN_UNDERLAY

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.254.1.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
    mlag: false
  nodes:
    - name: underlay-ibgp-l3-edge-include-in-underlay-leaf1
      id: 1

# 'include_in_underlay_protocol' defaults to true.
l3_edge:
  p2p_links:
    - nodes: [underlay-ibgp-l3-edge-include-in-underlay-leaf1, underlay-ibgp-gpu1]
      interfaces: [Ethernet10, eth0]
      subnet: 10.10.10.0/31
