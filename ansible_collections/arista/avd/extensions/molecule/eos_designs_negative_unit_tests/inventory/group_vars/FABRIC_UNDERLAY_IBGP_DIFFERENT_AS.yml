---
fabric_name: FABRIC_UNDERLAY_IBGP_DIFFERENT_AS

spine:
  defaults:
    loopback_ipv4_pool: 10.254.0.0/24
  nodes:
    - name: underlay-ibgp-different-as-spine1
      id: 1

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.254.1.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
    mlag: false
    uplink_switches: [underlay-ibgp-different-as-spine1]
    uplink_interfaces: [Ethernet1]
  nodes:
    - name: underlay-ibgp-different-as-leaf1
      id: 1
      uplink_switch_interfaces: [Ethernet1]
      # 'bgp_as: 65001' is set in host_vars, since the global 'bgp_as' takes precedence over the node setting.
