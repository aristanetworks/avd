---
type: l3leaf

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.50.0.0/24
    vtep_loopback_ipv4_pool: 10.51.0.0/24
    mlag_interfaces: [Ethernet5, Ethernet6]
    mlag_peer_address_family: ipv6
    mlag_peer_ipv6_pool: 2001:db8:50::/64
    # Using the MLAG peer VLAN for L3 peering.
    mlag_peer_l3_vlan: 0
    virtual_router_mac_address: 00:1c:73:00:00:99

  node_groups:
    - group: mlag-peer-vlan-l3-ipv6-underlay-ipv4
      bgp_as: 65110
      nodes:
        - name: mlag-peer-vlan-l3-ipv6-underlay-ipv4-1
          id: 1
          mgmt_ip: 192.168.0.209/24
        - name: mlag-peer-vlan-l3-ipv6-underlay-ipv4-2
          id: 2
          mgmt_ip: 192.168.0.210/24

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF10
        vrf_vni: 10
        svis:
          - id: 11
            name: VRF10_VLAN11
            ip_address_virtual: 10.10.11.1/24
