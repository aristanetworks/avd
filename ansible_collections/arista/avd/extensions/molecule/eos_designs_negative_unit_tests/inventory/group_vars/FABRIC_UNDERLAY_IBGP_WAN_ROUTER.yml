---
fabric_name: FABRIC_UNDERLAY_IBGP_WAN_ROUTER

type: wan_router
wan_mode: cv-pathfinder

cv_pathfinder_regions:
  - name: AVD_Land_East
    id: 43
    description: AVD Region
    sites:
      - name: Site511
        id: 511
        location: Miami

wan_router:
  defaults:
    loopback_ipv4_pool: 10.254.0.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
  node_groups:
    - group: Site511
      cv_pathfinder_region: AVD_Land_East
      cv_pathfinder_site: Site511
      nodes:
        - name: underlay-ibgp-wan-router-wan1
          id: 1
          l3_interfaces:
            - name: Ethernet1
              peer: peer3
              peer_interface: Ethernet42
              wan_carrier: Comcast
              wan_circuit_id: 666
              dhcp_accept_default_route: true
              ip_address: dhcp

wan_path_groups:
  - name: INET
    id: 101

wan_carriers:
  - name: Comcast
    path_group: INET
    trusted: true
