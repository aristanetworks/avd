---
fabric_name: FABRIC_MLAG_PEER_NOT_RECIPROCAL
underlay_routing_protocol: isis

type: l2leaf

l2leaf:
  defaults:
    mlag_peer_vlan: 4094
    mlag_peer_l3_vlan: 4094
    mlag_peer_ipv4_pool: 10.10.255.0/24
    uplink_ipv4_pool: 10.10.101.0/24
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 32
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    platform: vEOS-LAB
  node_groups:
    - group: mlag-peer-not-reciprocal-peer-view
      nodes:
        - name: mlag-peer-not-reciprocal3
          id: 33
          mgmt_ip: 192.168.201.233/24
          uplink_switch_interfaces: [Ethernet42]
          mlag_interfaces: [Ethernet5, Ethernet6]
        - name: mlag-peer-not-reciprocal2
          id: 32
          mgmt_ip: 192.168.201.232/24
          uplink_switch_interfaces: [Ethernet41]
          mlag_interfaces: [Ethernet5, Ethernet6]
    - group: mlag-peer-not-reciprocal-local-view
      nodes:
        - name: mlag-peer-not-reciprocal1
          id: 31
          mgmt_ip: 192.168.201.231/24
          uplink_switch_interfaces: [Ethernet40]
          mlag_interfaces: [Ethernet5, Ethernet6]
        - name: mlag-peer-not-reciprocal2
          id: 32
          mgmt_ip: 192.168.201.232/24
          uplink_switch_interfaces: [Ethernet41]
          mlag_interfaces: [Ethernet5, Ethernet6]

expected_error_message: >-
  MLAG peer relationship is not reciprocal for MLAG peer 'mlag-peer-not-reciprocal2'.
  The peer points to 'mlag-peer-not-reciprocal3' instead of 'mlag-peer-not-reciprocal1' for host 'mlag-peer-not-reciprocal1'.
