---
fabric_name: FABRIC_UNDERLAY_IBGP_MLAG

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.254.1.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
    mlag_interfaces: [Ethernet3, Ethernet4]
    mlag_peer_ipv4_pool: 10.254.3.0/24
    mlag_peer_l3_ipv4_pool: 10.254.4.0/24
  node_groups:
    - group: UNDERLAY_IBGP_MLAG
      nodes:
        - name: underlay-ibgp-mlag-leaf1
          id: 1
        - name: underlay-ibgp-mlag-leaf2
          id: 2
