---
type: l3leaf
underlay_ipv6: true
underlay_ipv6_numbered: true

l3leaf:
  defaults:
    loopback_ipv6_pool: 2001:db8:46::/48
    router_id_pool: 10.46.0.0/24
    vtep_loopback_ipv6_pool: 2001:db8:47::/48
    mlag_interfaces: [Ethernet5, Ethernet6]
    mlag_peer_address_family: ipv4
    mlag_peer_ipv4_pool: 10.255.248.0/24
    # Using the MLAG peer VLAN (4094) for L3 peering.
    mlag_peer_l3_vlan: 0
    virtual_router_mac_address: 00:1c:73:00:00:99

  node_groups:
    - group: mlag-peer-vlan-l3-ipv4-underlay-ipv6-numbered
      bgp_as: 65102
      nodes:
        - name: mlag-peer-vlan-l3-ipv4-underlay-ipv6-numbered-1
          id: 1
          mgmt_ip: 192.168.0.205/24
        - name: mlag-peer-vlan-l3-ipv4-underlay-ipv6-numbered-2
          id: 2
          mgmt_ip: 192.168.0.206/24

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF10
        vrf_vni: 10
        svis:
          - id: 11
            name: VRF10_VLAN11
            ipv6_address_virtuals: [2001:db8:11::1/64]

expected_error_message: >-
  Invalid combination of inputs. Unable to configure the IPv6 MLAG iBGP peering for VRF 'VRF10'
  since the MLAG peer VLAN is also used for L3 peering ('mlag_peer_l3_vlan' is 0 or the same as 'mlag_peer_vlan')
  with 'mlag_peer_address_family: ipv4'. Set 'mlag_peer_address_family: ipv6' or use a separate 'mlag_peer_l3_vlan'.
