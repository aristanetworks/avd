---
fabric_name: FABRIC_PORT_PROFILE_CIRCULAR_INHERITANCE

avd_design_future:
  allow_infinite_profile_inheritance: true

type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: port-profiles-circular-reference
      platform: 720XP
      link_tracking:
        enabled: true
      filter:
        only_vlans_in_use: true
      mgmt_ip: 192.168.1.2

servers:
  - name: PORT_PROFILE_CHAIN1
    adapters:
      - switches: [port-profiles-circular-reference]
        switch_ports: [Ethernet51]
        profile: profile1

port_profiles:
  - profile: profile1
    mode: trunk
    vlans: "1,2,3,4,5,6,7,123,234"
    native_vlan_tag: false
    native_vlan: 123
    parent_profile: profile2

  - profile: profile2
    mode: trunk
    spanning_tree_portfast: "edge"
    spanning_tree_bpdufilter: true
    spanning_tree_link_type: point-to-point
    parent_profile: profile3

  - profile: profile3
    mode: trunk
    qos_profile: MYQOS
    poe:
      disabled: true
    ptp:
      enabled: true
    sflow: false
    parent_profile: profile4

  - profile: profile4
    mode: trunk
    parent_profile: profile2
    native_vlan: 123
    link_tracking:
      enabled: true

expected_error_message: >-
  Circular profile dependency detected: Profile 'profile2' cannot be assigned
  as the parent of 'profile4' because it would create a loop for host 'port-profiles-circular-reference'.
