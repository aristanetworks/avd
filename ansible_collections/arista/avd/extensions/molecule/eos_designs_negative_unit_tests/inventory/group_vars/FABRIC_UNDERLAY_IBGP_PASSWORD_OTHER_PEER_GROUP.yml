---
fabric_name: FABRIC_UNDERLAY_IBGP_PASSWORD_OTHER_PEER_GROUP

bgp_peer_groups:
  ipv4_underlay_peers:
    # Type 7 of 'arista123' encrypted for the other peer group name 'RR-CLIENTS-UNDERLAY-PEERS',
    # so the route reflector cannot decrypt it to encrypt it again for 'rr_clients_underlay_peers'.
    password: oU8X5y3u4epoPjIAyBowQg==

spine:
  defaults:
    loopback_ipv4_pool: 10.254.0.0/24
  nodes:
    - name: underlay-ibgp-password-other-peer-group-spine1
      id: 1
      bgp_cluster_id: 1.1.1.1

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.254.1.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
    mlag: false
  nodes:
    - name: underlay-ibgp-password-other-peer-group-leaf1
      id: 1
      uplink_switches: [underlay-ibgp-password-other-peer-group-spine1]
      uplink_interfaces: [Ethernet1]
      uplink_switch_interfaces: [Ethernet1]
