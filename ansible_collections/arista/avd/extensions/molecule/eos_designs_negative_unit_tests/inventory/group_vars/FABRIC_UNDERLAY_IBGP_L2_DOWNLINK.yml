---
fabric_name: FABRIC_UNDERLAY_IBGP_L2_DOWNLINK

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.254.1.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
    mlag: false
  nodes:
    - name: underlay-ibgp-l2-downlink-leaf1
      id: 1

l2leaf:
  defaults:
    mlag: false
    uplink_switches: [underlay-ibgp-l2-downlink-leaf1]
    uplink_interfaces: [Ethernet1]
  nodes:
    - name: underlay-ibgp-l2-downlink-l2leaf1
      id: 1
      uplink_switch_interfaces: [Ethernet10]
