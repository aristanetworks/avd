---
# Minimum config to only test the specific feature.
fabric_name: FABRIC_UPLINK_TESTS_2
default_node_types:
  - node_type: spine
    match_hostnames:
      - uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches-1
      - uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches-2
  - node_type: l3leaf
    match_hostnames:
      - uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches

spine:
  defaults:
    loopback_ipv4_pool: 192.168.0.0/24
    bgp_as: 65000
  nodes:
    - name: uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches-1
      id: 1
      downlink_pools:
        - ipv4_pool: 10.0.0.0/24
    - name: uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches-2
      id: 2
      downlink_pools:
        - ipv4_pool: 11.0.0.0/24

default_interfaces:
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1]

l3leaf:
  nodes:
    - name: uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches
      id: 1
      loopback_ipv4_pool: 192.168.1.0/24
      bgp_as: 65000
      vtep_loopback_ipv4_pool: 10.255.1.0/27
      mgmt_ip: 172.16.1.151/24
      uplink_switches:
        - 'uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches-1'
        - 'uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches-2'
      uplink_switch_interfaces:
        - Ethernet8
        - Ethernet9
expected_error_message: >-
  Length of 'default_interfaces.uplink_interfaces': 1 is less than the length of 'uplink_switches': 2
  (Problematic host: 'uplink-interfaces-length-in-default-interfaces-less-than-uplink-switches').
