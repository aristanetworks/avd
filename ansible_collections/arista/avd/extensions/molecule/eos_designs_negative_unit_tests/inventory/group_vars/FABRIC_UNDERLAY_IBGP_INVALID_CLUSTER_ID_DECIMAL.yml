---
fabric_name: FABRIC_UNDERLAY_IBGP_INVALID_CLUSTER_ID_DECIMAL

spine:
  defaults:
    loopback_ipv4_pool: 10.254.0.0/24
  nodes:
    # EOS only accepts the dotted-quad notation.
    - name: underlay-ibgp-invalid-cluster-id-decimal-spine1
      id: 1
      bgp_cluster_id: "33686018"

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.254.1.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
    mlag: false
  nodes:
    - name: underlay-ibgp-invalid-cluster-id-decimal-leaf1
      id: 1
      uplink_switches: [underlay-ibgp-invalid-cluster-id-decimal-spine1]
      uplink_interfaces: [Ethernet1]
      uplink_switch_interfaces: [Ethernet1]
