---
# underlay_ipv6 with MLAG iBGP peering in VRFs over IPv4 raises with avd_design_future.fix_mlag_vrf_peer_group_address_families.
# RFC5549 underlay without overlay_mlag_rfc5549, using the shared MLAG peer group.
type: l3leaf

avd_design_future:
  fix_mlag_vrf_peer_group_address_families: true

underlay_rfc5549: true
underlay_ipv6: true

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.56.0.0/24
    loopback_ipv6_pool: 2001:db8:56::/48
    vtep_loopback_ipv4_pool: 10.57.0.0/24
    mlag_interfaces: [Ethernet5, Ethernet6]
    mlag_peer_ipv4_pool: 10.255.252.0/24
    # Required since the MLAG iBGP peering in VRFs uses IPv4 without overlay_mlag_rfc5549.
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    virtual_router_mac_address: 00:1c:73:00:00:99

  node_groups:
    - group: mlag-vrf-underlay-ipv6-rfc5549-shared-peer-group
      bgp_as: 65113
      nodes:
        - name: mlag-vrf-underlay-ipv6-rfc5549-shared-peer-group-1
          id: 1
          mgmt_ip: 192.168.0.215/24
        - name: mlag-vrf-underlay-ipv6-rfc5549-shared-peer-group-2
          id: 2
          mgmt_ip: 192.168.0.216/24

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF10
        vrf_vni: 10
        svis:
          - id: 11
            name: VRF10_VLAN11
            ip_address_virtual: 10.10.11.1/24
          - id: 12
            name: VRF10_VLAN12
            ipv6_address_virtuals: [2001:db8:12::1/64]

expected_error_message: >-
  Invalid combination of inputs. IPv6 routes requested with 'underlay_ipv6: true' cannot be carried over the MLAG iBGP peerings in VRFs,
  since these sessions run over IPv4. With 'underlay_rfc5549: true', set 'overlay_mlag_rfc5549: true' to run these sessions over IPv6.
  Otherwise, this combination is not supported yet when 'avd_design_future.fix_mlag_vrf_peer_group_address_families' is enabled.
