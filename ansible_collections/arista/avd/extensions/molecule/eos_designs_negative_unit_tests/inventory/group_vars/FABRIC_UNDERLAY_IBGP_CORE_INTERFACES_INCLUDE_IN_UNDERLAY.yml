---
fabric_name: FABRIC_UNDERLAY_IBGP_CORE_INTERFACES_INCLUDE_IN_UNDERLAY

l3leaf:
  defaults:
    loopback_ipv4_pool: 10.254.1.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
    mlag: false
  nodes:
    - name: underlay-ibgp-core-interfaces-include-in-underlay-leaf1
      id: 1

core_interfaces:
  p2p_links:
    - nodes: [underlay-ibgp-core-interfaces-include-in-underlay-leaf1, underlay-ibgp-core1]
      interfaces: [Ethernet10, Ethernet1]
      subnet: 10.10.10.0/31
      include_in_underlay_protocol: true
