---
fabric_name: FABRIC_UNDERLAY_IBGP_P2P_VRFS_DOWNLINK

# leaf2 uses subinterface uplinks towards leaf1.
# Subinterfaces are only created for VRFs present on both ends, so leaf1 raises for network services and leaf2 for 'uplink_type'.
l3leaf:
  defaults:
    loopback_ipv4_pool: 10.254.1.0/24
    vtep_loopback_ipv4_pool: 10.254.2.0/24
    mlag: false
  nodes:
    - name: underlay-ibgp-p2p-vrfs-downlink-leaf1
      id: 1
      bgp_cluster_id: 2.2.2.2
    - name: underlay-ibgp-p2p-vrfs-downlink-leaf2
      id: 2
      uplink_type: p2p-vrfs
      uplink_switches: [underlay-ibgp-p2p-vrfs-downlink-leaf1]
      uplink_interfaces: [Ethernet1]
      uplink_switch_interfaces: [Ethernet1]

tenants:
  - name: UNDERLAY_IBGP_TENANT
    vrfs:
      - name: UNDERLAY_IBGP_VRF
        vrf_id: 10
        l3_interfaces:
          - interfaces: [Ethernet10, Ethernet10]
            ip_addresses: [10.0.10.0/31, 10.0.10.2/31]
            nodes: [underlay-ibgp-p2p-vrfs-downlink-leaf1, underlay-ibgp-p2p-vrfs-downlink-leaf2]
