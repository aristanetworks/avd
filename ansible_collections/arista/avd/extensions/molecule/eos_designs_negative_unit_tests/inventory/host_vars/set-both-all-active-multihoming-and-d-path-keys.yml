---
type: l3leaf

# using default overlay_routing_protocol: ebgp
evpn_overlay_bgp_rtc: true

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:1c:73:00:00:99
    bgp_as: 65233
    platform: vEOS
    mlag: false
  nodes:
    - name: set-both-all-active-multihoming-and-d-path-keys
      id: 1
      filter:
        tenants: [EVPN_GATEWAY_TESTS]
      mgmt_ip: 192.168.0.204/24
      evpn_gateway:
        d_path:
          enabled: true
          local_domain_id: "65200:2"
          remote_domain_id: "65100:1"
        all_active_multihoming:
          enabled: true
          enable_d_path: true
          evpn_domain_id_local: "65200:2"
          evpn_domain_id_remote: "65100:1"
          evpn_ethernet_segment:
            identifier: 0000:0001:0001:0000:0509
            rt_import: 00:00:00:00:07:09
        evpn_l2:
          enabled: true
        evpn_l3:
          enabled: true
          inter_domain: true
        remote_peers:
          - hostname: DCI_TEST
            ip_address: 192.168.100.10
            bgp_as: 65002

tenants:
  - name: EVPN_GATEWAY_TESTS
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF10
        vrf_vni: 10
        svis:
          - id: 11
            name: VRF10_VLAN11
            enabled: true
            ip_address_virtual: 10.10.11.1/24
          - id: 12
            name: VRF10_VLAN12
            enabled: true
            ip_address_virtual: 10.10.12.1/24
      - name: VRF11
        vrf_vni: 11
        svis:
          - id: 21
            name: VRF11_VLAN21
            enabled: true
            ip_address_virtual: 10.10.21.1/24
          - id: 22
            name: VRF11_VLAN22
            enabled: true
            ip_address_virtual: 10.10.22.1/24
          - id: 300
            name: VRF11_VLAN300
            enabled: true
            ip_virtual_router_addresses:
              - 10.100.100.1
    l2vlans:
      - id: 3401
        name: L2_VLAN3401
      - id: 3402
        name: L2_VLAN3402

expected_error_message: >-
  The input data model 'evpn_gateway.all_active_multihoming' is deprecated and cannot be used in conjunction with the new data model 'evpn_gateway.d_path'.
  This usually happens when a data model has been updated and custom structured configuration still uses the old model.
