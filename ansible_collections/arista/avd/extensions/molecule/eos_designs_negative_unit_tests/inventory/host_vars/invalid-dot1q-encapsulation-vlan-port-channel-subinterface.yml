---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: invalid-dot1q-encapsulation-vlan-port-channel-subinterface
      id: 1
      bgp_as: 65001
      loopback_ipv4_pool: 10.0.0.0/24
      vtep_loopback_ipv4_pool: 10.0.1.0/24
      mgmt_ip: 192.168.1.2

servers:
  - name: OLD_SW-1/2
    adapters:
      - switches: [invalid-dot1q-encapsulation-vlan-port-channel-subinterface]
        switch_ports: [Ethernet1]
        endpoint_ports: [Endpoint_port1]
        description: "Interface description {interface} {endpoint_type}_{endpoint}{endpoint_port?<_!u}"
        port_channel:
          mode: "active"
          description: "Port channel description {interface} {endpoint_type}_{endpoint}_Po{port_channel_id}_{endpoint_port_channel}_{adapter_description!u}"
          endpoint_port_channel: ENDPOINT_PORT_CHANNEL
          subinterfaces:
            - number: 10000
              description: subinterface number greater than 4094
              vlan_id: 1000

expected_error_message: >-
  'encapsulation_vlan.client_dot1q' must be set for 'servers[name=OLD_SW-1/2].adapters[0].port_channel.subinterfaces[number=10000]'
  since the subinterface number is above 4094.
