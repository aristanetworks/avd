---
devices:
  - name: cv-settings-profile-duplicate-server-names
    type: l2leaf
    cv_settings_profile: duplicate_server_names

cv_settings:
  onprem_clusters:
    - name: global
      servers:
        - name: 192.0.2.1

cv_settings_profiles:
  - profile: duplicate_server_names
    onprem_clusters:
      - name: profile
        servers:
          - name: 192.0.2.1

expected_error_message: |-
  Duplicate on-prem CVP server name '192.0.2.1'. Server names must be unique across clusters.
