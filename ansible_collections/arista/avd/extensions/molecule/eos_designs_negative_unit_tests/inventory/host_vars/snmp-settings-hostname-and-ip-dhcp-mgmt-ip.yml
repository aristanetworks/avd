type: l2leaf

l2leaf:
  nodes:
    - name: snmp-settings-hostname-and-ip-dhcp-mgmt-ip
      mgmt_ip: dhcp

snmp_settings:
  compute_local_engineid: true
  compute_local_engineid_source: hostname_and_ip
