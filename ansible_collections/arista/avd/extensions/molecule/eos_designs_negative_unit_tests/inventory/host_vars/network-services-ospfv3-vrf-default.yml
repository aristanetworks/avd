---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: network-services-ospfv3-vrf-default
      id: 1
      bgp_as: 65101

tenants:
  - name: TENANT_A
    mac_vrf_vni_base: 10000
    vrfs:
      - name: default
        vrf_id: 1
        svis:
          - id: 110
            name: DEFAULT_VRF
            vxlan: false
            ipv6_address: 2001:db8:110::1/64
            ospfv3:
              enabled: true
