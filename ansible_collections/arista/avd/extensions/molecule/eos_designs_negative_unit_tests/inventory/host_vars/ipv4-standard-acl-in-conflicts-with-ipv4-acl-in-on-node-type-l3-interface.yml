---
# Tests that setting both ipv4_acl_in and ipv4_standard_acl_in on the same
# node_type l3_interface raises AristaAvdInvalidInputsError.
type: spine

spine:
  nodes:
    - name: ipv4-standard-acl-in-conflicts-with-ipv4-acl-in-on-node-type-l3-interface
      bgp_as: 65100
      id: 100
      loopback_ipv4_pool: 192.168.100.0/24
      l3_interfaces:
        - name: Ethernet1
          ip_address: 172.16.0.2/30
          ipv4_acl_in: EXTENDED-ACL-IN
          ipv4_standard_acl_in: STD-ACL-IN

expected_error_message: >-
  'ipv4_acl_in' and 'ipv4_standard_acl_in' are mutually exclusive on interface 'Ethernet1'. Only one ingress IPv4 ACL may be configured.
