---
# Testing with default none management
type: l2leaf

default_mgmt_method: none

sflow_settings:
  polling_interval: 1
  sample:
    rate: 10
  destinations:
    - destination: 10.10.10.11
    - destination: 10.10.10.12
      vrf: default
fabric_sflow:
  uplinks: true
  downlinks: true
  endpoints: true
  l3_edge: true
  core_interfaces: true
  mlag_interfaces: true
l2leaf:
  defaults:
    platform: vEOS-lab
    uplink_interfaces: ['Ethernet1']
    uplink_switches: ['sflow-settings-missing-destinations']
    inband_mgmt_subnet: "10.254.254.0/24"

  nodes:
    - name: missing-sflow-setting-destination-vrf
      id: 1
      mgmt_ip: 192.168.0.201/24
      uplink_switch_interfaces:
        - Ethernet5
l3_edge:
  p2p_links:
    - nodes: [missing-sflow-setting-destination-vrf, flow-settings-missing-destinations]
      interfaces: [Ethernet12, Ethernet12]
      include_in_underlay_protocol: false
      sflow: true

expected_error_message: >-
  The VRF 'sflow_settings.destinations[destination=10.10.10.11].vrf' must be set when 'default_mgmt_method' is set to 'none'.
  Use 'default' for the default VRF for host 'missing-sflow-setting-destination-vrf'.
