type: l2leaf
l2leaf:
  nodes:
    - name: sflow-settings-missing-mgmt-ip
      id: 1

sflow_settings:
  destinations:
    - destination: 10.10.10.10
      vrf: use_mgmt_interface_vrf

servers:
  - name: test
    adapters:
      - switches: [sflow-settings-missing-mgmt-ip]
        switch_ports: [Ethernet1]
        sflow: true

expected_error_message: >-
  'sflow_settings.destinations[destination=10.10.10.10].vrf' is set to 'use_mgmt_interface_vrf' but this node is missing 'mgmt_ip' or 'ipv6_mgmt_ip'
  for host 'sflow-settings-missing-mgmt-ip'.
