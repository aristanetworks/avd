type: l2leaf
l2leaf:
  nodes:
    - name: ntp-settings-source-address-missing-mgmt-ipv4
      id: 1
      ipv6_mgmt_ip: 2001:db8:100::2/64

ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: pool.ntp.com
      source_address: use_mgmt_interface_ipv4

