---
mac_acls:
  - name: acl1
    entries:
      - sequence: 10

type: l2leaf

l2leaf:
  nodes:
    - name: missing-mac-acl-action-or-remark

servers:
  - name: server1s
    rack: RackB
    adapters:
      - endpoint_ports: [E0]
        switch_ports: [Ethernet2]
        switches: [missing-mac-acl-action-or-remark]
        mac_acl_in: acl1

expected_error_message: >-
  'mac_acls[name=acl1].entries[0].action or mac_acls[name=acl1].entries[0].remark' is required but was not found.
