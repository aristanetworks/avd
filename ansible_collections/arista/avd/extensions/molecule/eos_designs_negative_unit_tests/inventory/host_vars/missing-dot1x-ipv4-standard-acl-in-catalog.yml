---
type: l2leaf
l2leaf:
  nodes:
    - name: missing-dot1x-ipv4-standard-acl-in-catalog
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true

aaa_settings:
  radius:
    servers:
      - host: radius.example.com
        cleartext_key: super-secret-key

ipv4_standard_acls:
  - name: another-acl
    entries:
      - sequence: 10
        action: permit
        source: any

network_ports:
  - switches: [missing-dot1x-ipv4-standard-acl-in-catalog]
    switch_ports: [Ethernet1]
    dot1x:
      authentication_failure:
        action: allow
        allow_ipv4_access_list: missing-acl

expected_error_message: >-
  'ipv4_standard_acls[name=missing-acl]' is required but was not found for host 'missing-dot1x-ipv4-standard-acl-in-catalog'.
