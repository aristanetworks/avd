type: l3leaf
uplink_type: lan

l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: failure-svi-ospfv3-uplink-lan
      bgp_as: 65103
      id: 3
      mgmt_ip: 192.168.200.103/24

tenants:
  # OSPFv3 is not supported on Ethernet subinterfaces (uplink_type: lan)
  - name: Tenant_OSPFv3_Uplink_Lan
    mac_vrf_vni_base: 13000
    mac_vrf_id_base: 23000
    vrfs:
      - name: OSPFV3_LAN_VRF
        vrf_vni: 107
        vrf_id: 49
        ospfv3:
          enabled: true
          router_id: 192.168.255.107
          address_family_ipv4:
            enabled: true
          address_family_ipv6:
            enabled: true
        svis:
          - id: 212
            name: OSPFv3_LAN_SVI
            enabled: true
            ip_address: 10.2.1.1/24
            ipv6_address: dead::2/64
            ospfv3:
              enabled: true
              address_family_ipv4:
                enabled: true
              address_family_ipv6:
                enabled: true

expected_error_message: >-
  OSPFv3 is enabled on SVI 'OSPFv3_LAN_SVI' but this node has uplink_type 'lan',
  which renders SVIs as Ethernet subinterfaces. OSPFv3 on Ethernet subinterfaces is not yet supported.
