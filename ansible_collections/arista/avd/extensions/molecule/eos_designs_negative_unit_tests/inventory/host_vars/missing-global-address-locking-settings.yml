---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: missing-global-address-locking-settings

avd_design_future:
  only_configure_address_locking_when_used: true

servers:
  - name: server
    adapters:
      - switches: [missing-global-address-locking-settings]
        switch_ports: [Ethernet1]
        mode: access
        vlans: 10
        address_locking:
          ipv4: true
