---
# Standard ACL validation is unconditional; an entry in the extended catalog must not satisfy the reference.
type: l2leaf
l2leaf:
  nodes:
    - name: dot1x-aaa-unresponsive-network-port-profile-missing-standard
      mgmt_ip: 192.0.2.2/24
dot1x_settings:
  enabled: true
aaa_settings:
  radius:
    servers:
      - host: 192.0.2.10
        cleartext_key: test-key
ipv4_acls:
  - name: AAA-TIMEOUT
    entries:
      - action: permit
        protocol: ip
        source: any
        destination: any
port_profiles:
  - profile: AAA-PROFILE
    dot1x:
      aaa:
        unresponsive:
          action:
            traffic_allow_standard_access_list: AAA-TIMEOUT
network_ports:
  - switches:
      - dot1x-aaa-unresponsive-network-port-profile-missing-standard
    switch_ports:
      - Ethernet1
    profile: AAA-PROFILE

expected_error_message: >-
  'ipv4_standard_acls[name=AAA-TIMEOUT]' is required but was not found for host 'dot1x-aaa-unresponsive-network-port-profile-missing-standard'.
