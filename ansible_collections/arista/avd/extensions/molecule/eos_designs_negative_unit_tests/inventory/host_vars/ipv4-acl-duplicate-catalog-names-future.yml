---
type: l2leaf

l2leaf:
  nodes:
    - name: ipv4-acl-duplicate-catalog-names-future
      id: 43
      mgmt_ip: 10.10.10.43/26

avd_design_future:
  raise_for_duplicate_ipv4_acl_names: true

# Neither ACL is referenced. The future knob validates the complete input catalogs.
ipv4_acls:
  - name: FILTER
    entries:
      - action: permit
        protocol: ip
        source: any
        destination: any

ipv4_standard_acls:
  - name: FILTER
    entries:
      - action: permit
        source: any

expected_error_message: >-
  ACL 'FILTER' is defined in both 'ipv4_acls' and 'ipv4_standard_acls'.
  Only one IPv4 ACL type can be defined with the same name.
