type: l2leaf
l2leaf:
  nodes:
    - name: sflow-settings-missing-destinations
      id: 1

servers:
  - name: test
    adapters:
      - switches: [sflow-settings-missing-destinations]
        switch_ports: [Ethernet1]
        sflow: true

expected_error_message: >-
  Either `sflow_settings.destinations` or `sflow_settings.export_to_cloudvision.enabled: true` is required to configure `sflow`.
