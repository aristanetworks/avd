---
# Tests that using peer_ipv6 substitution in an ipv6_acl on an L3 Port-Channel that has no peer_ipv6
# raises AristaAvdError indicating the substitution value is missing.
type: spine

spine:
  nodes:
    - name: ipv6-acl-on-l3-port-channel-missing-peer-ipv6
      bgp_as: 65104
      id: 104
      loopback_ipv4_pool: 192.168.104.0/24
      l3_port_channels:
        - name: Port-Channel1
          mode: active
          member_interfaces:
            - name: Ethernet1
          ip_address: 172.16.0.2/30
          ipv6_addresses:
            - 2001:db8:1::2/64
          # No peer_ipv6 set - peer_ipv6 substitution in the ACL below will fail.
          ipv6_acl_in: TEST-IPV6-ACL-WITH-PEER-IPV6-FIELD

ipv6_acls:
  - name: TEST-IPV6-ACL-WITH-PEER-IPV6-FIELD
    entries:
      - sequence: 10
        action: permit
        protocol: ipv6
        source: peer_ipv6
        destination: any
