l3leaf:
  defaults:
    loopback_ipv4_pool: 10.42.0.0/24
    vtep_loopback_ipv4_pool: 10.43.0.0/24
  nodes:
    - name: missing-peer-filter-or-remote-as
      bgp_as: 42
      id: 42

type: l3leaf

tenants:
  # Tenant A Specific Information - VRFs / VLANs
  - name: Tenant_X
    mac_vrf_vni_base: 11000
    bgp_peer_groups:
      - name: Tenant_C_BGP_PEER_GROUP2
        remote_as: "667"
        description: "Tenant C peer group2"
        listen_ranges:
          - prefix: 192.168.143.0/24
            peer_id_include_router_id: true
        nodes: [missing-peer-filter-or-remote-as]

expected_error_message: >-
  'Tenant_X.bgp_peer_groups[name=Tenant_C_BGP_PEER_GROUP2].listen_ranges[0].peer_filter or Tenant_X.bgp_peer_groups[name=Tenant_C_BGP_PEER_GROUP2].remote_as'
  is required but was not found.
