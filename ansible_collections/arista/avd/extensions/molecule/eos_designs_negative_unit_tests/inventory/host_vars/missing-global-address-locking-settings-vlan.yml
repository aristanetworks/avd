---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
  nodes:
    - name: missing-global-address-locking-settings-vlan
      id: 101
      bgp_as: 101

avd_design_future:
  only_configure_address_locking_when_used: true

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    l2vlans:
      - id: 101
        name: address-locking
        address_locking:
          ipv4: true

expected_error_message: >-
  Address locking is enabled under 'vlan 101 in Tenant 'TENANT1'' but 'address_locking_settings' is not configured.
  Configure the required global address locking settings before enabling address locking on an interface or VLAN.
