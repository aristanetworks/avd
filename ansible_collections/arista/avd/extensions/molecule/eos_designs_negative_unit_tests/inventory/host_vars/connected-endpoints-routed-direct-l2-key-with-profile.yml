---
type: l3leaf
overlay_routing_protocol: none
l3leaf:
  nodes:
    - name: connected-endpoints-routed-direct-l2-key-with-profile
      id: 1
      bgp_as: 65101
      loopback_ipv4_pool: 192.168.255.0/24
      vtep_loopback_ipv4_pool: 192.168.254.0/24

port_profiles:
  - profile: ROUTED
    mode: routed

servers:
  # 'mode: routed' from a profile with an unsupported L2 key set directly on the adapter (no profile override hint).
  - name: ROUTED_SERVER
    adapters:
      - switches: [connected-endpoints-routed-direct-l2-key-with-profile]
        switch_ports: [Ethernet1]
        profile: ROUTED
        vlans: "10"
        switch_ipv4_addresses: [10.0.0.0/31]
