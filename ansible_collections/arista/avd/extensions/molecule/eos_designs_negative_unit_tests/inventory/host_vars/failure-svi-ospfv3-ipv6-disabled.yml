type: l3leaf

l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: failure-svi-ospfv3-ipv6-disabled
      bgp_as: 65104
      id: 4
      mgmt_ip: 192.168.200.104/24

tenants:
  # OSPFv3 requires IPv6 to be enabled, even when using only IPv4 address family
  - name: Tenant_OSPFv3_IPv6_Disabled
    mac_vrf_vni_base: 14000
    mac_vrf_id_base: 24000
    vrfs:
      - name: OSPFV3_IPv6_Disabled_VRF
        vrf_vni: 108
        vrf_id: 50
        ospfv3:
          enabled: true
          router_id: 192.168.255.108
          address_family_ipv4:
            enabled: true
          address_family_ipv6:
            enabled: true
        svis:
          - id: 213
            name: OSPFv3_IPv6_Disabled_SVI
            enabled: true
            ip_address: 10.3.1.1/24
            ipv6_enable: false
            ospfv3:
              enabled: true
              address_family_ipv4:
                enabled: true

expected_error_message: >-
  OSPFv3 is enabled on SVI 'OSPFv3_IPv6_Disabled_SVI' but 'ipv6_enable' is set to false and no 'ipv6_address' is set under
  'tenants[name=Tenant_OSPFv3_IPv6_Disabled].vrfs[name=OSPFV3_IPv6_Disabled_VRF].svis[id=213]'.
