type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: aaa-settings-radius-group
      mgmt_ip: 192.168.0.2/24

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - radius
        cleartext_key: super-secret-key

expected_error_message: >-
  Server group 'radius' is reserved by EOS and cannot be used. Please specify a different server group name.
