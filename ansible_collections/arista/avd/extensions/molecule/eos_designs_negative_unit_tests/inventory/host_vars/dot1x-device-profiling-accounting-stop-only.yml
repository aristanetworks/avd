---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-device-profiling-accounting-stop-only
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  accounting:
    mode: stop-only
  device_profiling:
    enabled: true

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        cleartext_key: super-secret-key

expected_error_message: >-
  'dot1x_settings.device_profiling' requires 'dot1x_settings.accounting.enabled: true' and
  'dot1x_settings.accounting.mode: start-stop'. Device profiling depends on Accounting Interim-Updates.
