---
type: l3leaf
overlay_routing_protocol: none
underlay_ipv6: true
underlay_ipv6_numbered: true
l3leaf:
  nodes:
    - name: connected-endpoints-routed-unsupported-ipv6-numbered
      id: 1
      bgp_as: 65101
      router_id_pool: 192.168.255.0/24
      loopback_ipv6_pool: 2001:db8:255::/64
      vtep_loopback_ipv6_pool: 2001:db8:254::/64

servers:
  # 'mode: routed' with an IPv6 numbered eBGP underlay.
  - name: ROUTED_SERVER
    adapters:
      - switches: [connected-endpoints-routed-unsupported-ipv6-numbered]
        switch_ports: [Ethernet1]
        mode: routed
        switch_ipv4_addresses: [10.0.0.0/31]
