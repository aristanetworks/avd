type: l2leaf

l2leaf:
  nodes:
    - name: custom-system-mac-address-invalid-format
      id: 1
      mgmt_ip: 192.168.0.2/24

custom_system_mac_address: not-a-mac-address

expected_error_message: >-
  custom_system_mac_address rendered 'not-a-mac-address' which is not a valid unicast EOS system MAC address.
  The value must be a unicast MAC address in hhhh.hhhh.hhhh, hh:hh:hh:hh:hh:hh or hh-hh-hh-hh-hh-hh format.
