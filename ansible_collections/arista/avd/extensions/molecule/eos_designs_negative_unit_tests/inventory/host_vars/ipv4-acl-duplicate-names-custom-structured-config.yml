---
type: l2leaf

l2leaf:
  nodes:
    - name: ipv4-acl-duplicate-names-custom-structured-config
      id: 43
      mgmt_ip: 10.10.10.43/26
      structured_config:
        ip_access_lists:
          - name: FILTER
            entries:
              - action: permit
                protocol: ip
                source: any
                destination: any
        standard_access_lists:
          - name: FILTER
            entries:
              - action: permit
                source: any

expected_error_message: >-
  ACL 'FILTER' is configured in both 'ip_access_lists' and 'standard_access_lists'.
  Only one IPv4 ACL type can be configured with the same name.
