---
type: l3leaf
overlay_routing_protocol: none
l3leaf:
  nodes:
    - name: connected-endpoints-routed-subinterfaces
      id: 1
      bgp_as: 65101
      loopback_ipv4_pool: 192.168.255.0/24
      vtep_loopback_ipv4_pool: 192.168.254.0/24

servers:
  # 'mode: routed' with L2 subinterfaces.
  - name: ROUTED_SERVER
    adapters:
      - switches: [connected-endpoints-routed-subinterfaces]
        switch_ports: [Ethernet1]
        mode: routed
        switch_ipv4_addresses: [10.0.0.0/31]
        subinterfaces:
          - number: 10
