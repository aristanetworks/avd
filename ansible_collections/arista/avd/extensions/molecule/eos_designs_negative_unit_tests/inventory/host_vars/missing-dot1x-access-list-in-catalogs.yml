---
type: l2leaf
l2leaf:
  nodes:
    - name: missing-dot1x-access-list-in-catalogs
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true

aaa_settings:
  radius:
    servers:
      - host: radius.example.com
        cleartext_key: super-secret-key

ipv4_acls:
  - name: another-ipv4-acl
    entries:
      - sequence: 10
        action: permit
        protocol: ip
        source: any
        destination: any

ipv6_acls:
  - name: another-ipv6-acl
    entries:
      - sequence: 10
        action: permit
        protocol: ipv6
        source: any
        destination: any

network_ports:
  - switches: [missing-dot1x-access-list-in-catalogs]
    switch_ports: [Ethernet1]
    dot1x:
      mac_based_access_list: true
      authentication_failure:
        action: allow
        allow_access_list: missing-acl

expected_error_message: >-
  'ipv4_acls[name=missing-acl] or ipv6_acls[name=missing-acl]' is required but was not found for host 'missing-dot1x-access-list-in-catalogs'.
