loopback_ipv4_pool: 192.168.0.0/24

type: l2leaf
l2leaf:
  nodes:
    - name: connected-endpoints-vlan-tags-no-matching-vlans

servers:
  - name: server_1
    adapters:
      - switches: [connected-endpoints-vlan-tags-no-matching-vlans]
        switch_ports: [Ethernet1]
        mode: trunk
        vlan_tags: [UNKNOWN_TAG]

tenants:
  - name: TENANT_A
    l2vlans:
      - id: 600
        name: L2VLAN_ESX
        tags: [ESX]
