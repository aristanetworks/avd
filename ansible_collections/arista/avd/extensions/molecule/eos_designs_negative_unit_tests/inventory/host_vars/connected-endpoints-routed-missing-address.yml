---
type: l3leaf
overlay_routing_protocol: none
l3leaf:
  nodes:
    - name: connected-endpoints-routed-missing-address
      id: 1
      bgp_as: 65101
      loopback_ipv4_pool: 192.168.255.0/24
      vtep_loopback_ipv4_pool: 192.168.254.0/24

servers:
  # 'mode: routed' without 'switch_ipv4_addresses'.
  - name: ROUTED_SERVER
    adapters:
      - switches: [connected-endpoints-routed-missing-address]
        switch_ports: [Ethernet1]
        mode: routed
