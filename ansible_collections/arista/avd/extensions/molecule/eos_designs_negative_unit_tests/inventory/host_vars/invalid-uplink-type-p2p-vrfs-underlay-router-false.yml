---
fabric_name: FABRIC_P2P_VRFS

default_node_types:
  - node_type: not_underlay_router
    match_hostnames:
      - ".*underlay.*"

node_type_keys:
  - key: not_underlay_router
    type: not_underlay_router
    underlay_router: false
    uplink_type: p2p-vrfs

not_underlay_router:
  nodes:
    - name: invalid-uplink-type-p2p-vrfs-underlay-router-false
