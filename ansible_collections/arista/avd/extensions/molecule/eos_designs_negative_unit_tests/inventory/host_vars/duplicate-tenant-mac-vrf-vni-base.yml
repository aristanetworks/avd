---
# Test cross-key duplicate tenants failing during eos_designs_facts.
# BGP is forced to inspect network services in the facts phase, so the duplicate tenant collision is raised before structured config generation.
type: l3leaf
underlay_routing_protocol: none
overlay_routing_protocol: none
network_services_keys:
  - name: tenants
  - name: duplicate_tenants

node_type_keys:
  - key: l3leaf
    type: l3leaf
    default_underlay_routing_protocol: none
    default_overlay_routing_protocol: none
    default_evpn_role: none
    default_mpls_overlay_role: none
    uplink_type: p2p
    underlay_router: true
    network_services:
      l3: true
      l2: true

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
  nodes:
    - name: duplicate-tenant-mac-vrf-vni-base
      id: 1
      bgp_as: 65101
      filter:
        tenants:
          - Tenant_A

tenants:
  - name: Tenant_A
    mac_vrf_vni_base: 40000
    vrfs:
      - name: Tenant_A_OP_Zone
        vrf_id: 10
        bgp:
          enabled: true
        svis:
          - id: 110
            name: Tenant_A_OP_Zone_1
            enabled: true
            ip_address_virtual: 10.1.10.1/24

duplicate_tenants:
  - name: Tenant_A
    mac_vrf_vni_base: 30000
    vrfs:
      - name: Tenant_A_OP_Zone
        vrf_id: 10
        bgp:
          enabled: true
        svis:
          - id: 110
            name: Tenant_A_OP_Zone_1
            enabled: true
            ip_address_virtual: 10.1.10.1/24

expected_error_message: >-
  Found duplicate objects with conflicting data while generating configuration for NetworkServices.
  {'name': 'Tenant_A', 'mac_vrf_vni_base': 30000, 'vrfs': [{'name': 'Tenant_A_OP_Zone', 'vrf_id': 10, 'svis':
  [{'id': 110, 'name': 'Tenant_A_OP_Zone_1', 'enabled': True, 'ip_address_virtual': '10.1.10.1/24'}], 'bgp': {'enabled': True}}]}
  conflicts with {'name': 'Tenant_A', 'mac_vrf_vni_base': 40000, 'vrfs': [{'name': 'Tenant_A_OP_Zone', 'vrf_id': 10,
  'svis': [{'id': 110, 'name': 'Tenant_A_OP_Zone_1', 'enabled': True, 'ip_address_virtual': '10.1.10.1/24'}],
  'bgp': {'enabled': True}}]}.
