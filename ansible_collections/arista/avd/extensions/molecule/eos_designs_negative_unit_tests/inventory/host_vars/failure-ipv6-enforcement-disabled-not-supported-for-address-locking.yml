---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
    mgmt_ip: 1.1.10.10
  nodes:
    - name: failure-ipv6-enforcement-disabled-not-supported-for-address-locking
      id: 101
      bgp_as: 101
      platform: no_ipv6_enforcement_disabled_platform

custom_platform_settings:
  - platforms:
      - no_ipv6_enforcement_disabled_platform
    feature_support:
      address_locking:
        ipv6_enforcement_disabled: false

avd_design_future:
  only_configure_address_locking_when_used: true

address_locking_settings:
  locked_address:
    ipv6_enforcement_disabled: true

servers:
  - name: server
    adapters:
      - switches: [failure-ipv6-enforcement-disabled-not-supported-for-address-locking]
        switch_ports: [Ethernet1]
        mode: access
        vlans: 10
        address_locking:
          ipv6: true

expected_error_message: >-
  IPv6 address locking is enabled under 'servers[name=server].adapters[0]' but the platform does not support
  `locked-address ipv6 enforcement disabled`. IPv6 Address Locking can only operate in enforcement-disabled mode
  (`address_locking_settings.locked_address.ipv6_enforcement_disabled: true`), which is not supported by this platform.
