---
# This test covers the case where an L2 leaf (underlay_router: false) has L3 network services
# with IGMP querier enabled using main_router_id as source_address.
# Since L2 leafs don't have a router_id, this should trigger an error.

type: l2leaf

# Override default node_type_keys to allow L3 network services on l2leaf for this test
node_type_keys:
  - key: l2leaf
    type: l2leaf
    connected_endpoints: true
    mlag_support: true
    network_services:
      l2: true
      l3: true  # Enable L3 for this test
    underlay_router: false  # Still not an underlay router, so no router_id
    uplink_type: p2p

l2leaf:
  defaults:
    platform: vEOS-LAB
  nodes:
    - name: failure-l2leaf-svi-igmp-querier-no-router-id
      id: 1
      mgmt_ip: 192.168.200.101/24

tenants:
  - name: Tenant_A
    mac_vrf_vni_base: 10000
    igmp_snooping:
      querier:
        enabled: true
        source_address: main_router_id
    vrfs:
      - name: VRF1
        vrf_vni: 11
        svis:
          - id: 100
            name: test_svi
            enabled: true
expected_error_message: >-
  Invalid IGMP snooping querier source address for VLAN 'test_svi' in VRF 'VRF1' in Tenant 'Tenant_A'.
  The value 'None' resolved from 'igmp_snooping_querier.source_address: main_router_id' is not a valid IPv4 address
  for host 'failure-l2leaf-svi-igmp-querier-no-router-id'.
