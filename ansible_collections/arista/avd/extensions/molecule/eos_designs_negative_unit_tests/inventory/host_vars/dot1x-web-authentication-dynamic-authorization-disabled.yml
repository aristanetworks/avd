---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-web-authentication-dynamic-authorization-disabled
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  authentication:
    radius_groups: [agni-server-group]
  dynamic_authorization:
    enabled: false
  web_authentication:
    enabled: true

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - agni-server-group
        cleartext_key: super-secret-key
