---
type: l3leaf

l3leaf:
  defaults:
    bgp_as: 65001
    spanning_tree_mode: none
    loopback_ipv4_pool: 192.0.255.0/24
    uplink_ipv4_pool: 10.255.1.0/24
    vtep_loopback_ipv4_pool: 10.255.2.0/24
    virtual_router_mac_address: 00:1c:73:00:dc:01
  nodes:
    - name: network-services-ip-helpers-leaf1
      id: 1
      filter:
        tenants: ["TEST1"]
        always_include_vrfs_in_tenants: ["TEST1"]

tenants:
  - name: TEST1
    mac_vrf_vni_base: 1000
    vrfs:
      - name: IP_HELPERS3
        vrf_id: 102
        svis:
          - id: 11
            name: SVI2
            ip_helpers:
              - ip_helper: 1.1.1.4
                source_interface: use_inband_mgmt_interface
                source_vrf: use_inband_mgmt_vrf

expected_error_message: >-
  'IP_HELPERS3.svis[SVI2].ip_helpers[0].source_vrf or IP_HELPERS3.ip_helpers[0].source_vrf or' is set to 'use_inband_mgmt_vrf'
  but this node is missing configuration for inband management.
