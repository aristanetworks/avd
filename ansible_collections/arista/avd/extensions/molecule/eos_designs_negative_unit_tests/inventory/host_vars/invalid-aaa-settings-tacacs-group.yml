type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: invalid-aaa-settings-tacacs-group
      mgmt_ip: 192.168.0.2/24

aaa_settings:
  tacacs:
    servers:
      - host: 10.10.10.11
        groups:
          - tacacs+
        cleartext_key: super-secret-key

expected_error_message: >-
  Cannot use server group 'tacacs+' for aaa_settings.tacacs.servers[host=10.10.10.11].
  This group name is reserved by EOS. Please choose a different group name.
