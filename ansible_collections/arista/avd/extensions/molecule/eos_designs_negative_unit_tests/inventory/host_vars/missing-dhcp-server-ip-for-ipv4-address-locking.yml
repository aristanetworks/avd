---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: missing-dhcp-server-ip-for-ipv4-address-locking

avd_design_future:
  only_configure_address_locking_when_used: true

address_locking_settings:
  local_interface: Management1

servers:
  - name: server
    adapters:
      - switches: [missing-dhcp-server-ip-for-ipv4-address-locking]
        switch_ports: [Ethernet1]
        mode: access
        vlans: 10
        address_locking:
          ipv4: true

expected_error_message: >-
  IPv4 address locking is enabled under 'servers[name=server].adapters[0]' but 'address_locking_settings' is not properly configured
  for any supported IPv4 Address Locking mode. Consult the 'address_locking_settings' key documentation for the supported modes.
