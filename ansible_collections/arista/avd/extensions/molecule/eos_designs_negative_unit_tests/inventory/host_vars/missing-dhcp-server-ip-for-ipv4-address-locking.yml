---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: missing-dhcp-server-ip-for-ipv4-address-locking

avd_design_future:
  only_configure_address_locking_when_used: true

address_locking_settings:
  local_interface: Management1

servers:
  - name: server
    adapters:
      - switches: [missing-dhcp-server-ip-for-ipv4-address-locking]
        switch_ports: [Ethernet1]
        mode: access
        vlans: 10
        address_locking:
          ipv4: true
