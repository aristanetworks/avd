---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-aaa-accounting-missing-radius-groups-or-syslog
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  authentication:
    radius_groups: [agni-server-group]

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - agni-server-group
        cleartext_key: super-secret-key

expected_error_message: >-
  'dot1x_settings.accounting.radius_groups' or 'dot1x_settings.accounting.syslog' is required when 802.1X accounting is enabled.
