type: l3leaf

l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: failure-svi-ospfv3-ipv4-no-address
      bgp_as: 65105
      id: 5
      mgmt_ip: 192.168.200.105/24

tenants:
  # OSPFv3 IPv4 address family requires an IPv4 address on the SVI
  - name: Tenant_OSPFv3_IPv4_No_Address
    mac_vrf_vni_base: 15000
    mac_vrf_id_base: 25000
    vrfs:
      - name: OSPFV3_IPv4_No_Address_VRF
        vrf_vni: 109
        vrf_id: 51
        ospfv3:
          enabled: true
          router_id: 192.168.255.109
          address_family_ipv4:
            enabled: true
          address_family_ipv6:
            enabled: true
        svis:
          - id: 214
            name: OSPFv3_IPv4_No_Address_SVI
            enabled: true
            ipv6_address: dead::4/64
            ospfv3:
              enabled: true
              address_family_ipv4:
                enabled: true
              address_family_ipv6:
                enabled: true

expected_error_message: >-
  OSPFv3 IPv4 address family is enabled on SVI 'OSPFv3_IPv4_No_Address_SVI' but no IPv4 address is set under
  'tenants[name=Tenant_OSPFv3_IPv4_No_Address].vrfs[name=OSPFV3_IPv4_No_Address_VRF].svis[id=214]'.
