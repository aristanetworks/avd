---
type: l3leaf
overlay_routing_protocol: none
l3leaf:
  nodes:
    - name: connected-endpoints-routed-l2-key
      id: 1
      bgp_as: 65101
      loopback_ipv4_pool: 192.168.255.0/24
      vtep_loopback_ipv4_pool: 192.168.254.0/24

port_profiles:
  - profile: L2_PROFILE
    vlans: "10"
    spanning_tree_portfast: edge

servers:
  # 'mode: routed' with L2 keys inherited from a port profile.
  - name: ROUTED_SERVER
    adapters:
      - switches: [connected-endpoints-routed-l2-key]
        switch_ports: [Ethernet1]
        profile: L2_PROFILE
        mode: routed
        switch_ipv4_addresses: [10.0.0.0/31]
