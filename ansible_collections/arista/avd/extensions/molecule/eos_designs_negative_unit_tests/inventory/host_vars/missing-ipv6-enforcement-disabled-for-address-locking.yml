---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: missing-ipv6-enforcement-disabled-for-address-locking

avd_design_future:
  only_configure_address_locking_when_used: true

address_locking_settings:
  local_interface: Management1
  dhcp_servers_ipv4:
    - 192.0.2.1

servers:
  - name: server
    adapters:
      - switches: [missing-ipv6-enforcement-disabled-for-address-locking]
        switch_ports: [Ethernet1]
        mode: access
        vlans: 10
        address_locking:
          ipv6: true

expected_error_message: >-
  IPv6 address locking is enabled under 'servers[name=server].adapters[0]' but
  `address_locking_settings.locked_address.ipv6_enforcement_disabled: true` is required.
