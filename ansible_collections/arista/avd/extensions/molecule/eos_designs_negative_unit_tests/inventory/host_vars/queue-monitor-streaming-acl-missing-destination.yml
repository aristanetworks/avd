---
type: l2leaf

l2leaf:
  nodes:
    - name: queue-monitor-streaming-acl-missing-destination

queue_monitor_streaming:
  enable: true
  ipv4_acl: QMS-EXTENDED

ipv4_acls:
  - name: QMS-EXTENDED
    entries:
      - remark: This remark entry should be skipped during validation.
      - sequence: 20
        action: permit
        protocol: ip
        source: any
