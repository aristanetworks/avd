---
# Without 'uplink_switches', no subinterface is rendered for the SVI, so only the OSPFv3 instance would be created.
custom_node_type_keys:
  - key: l3_router
    type: l3-router
    network_services:
      l3: true
    default_underlay_routing_protocol: none
    default_overlay_routing_protocol: none

type: l3-router
l3_router:
  nodes:
    - name: network-services-ospfv3-uplink-type-lan-no-uplink-switches
      id: 1
      loopback_ipv4_pool: 192.168.255.0/24
      uplink_type: lan

tenants:
  - name: TENANT_A
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF_A
        vrf_id: 10
        svis:
          - id: 110
            name: NO_UPLINK
            ipv6_address: 2001:db8:110::1/64
            ospfv3:
              enabled: true

expected_error_message: >-
  'tenants[name=TENANT_A].vrfs[name=VRF_A].svis[].ospfv3.enabled: true' is not supported on node
  'network-services-ospfv3-uplink-type-lan-no-uplink-switches' with 'uplink_type: lan', since SVIs are deployed as subinterfaces.
