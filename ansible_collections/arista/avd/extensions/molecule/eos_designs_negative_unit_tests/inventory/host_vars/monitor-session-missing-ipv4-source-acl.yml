---
# The ACL exists only in the other IPv4 catalog; the selected catalog must be used.
type: l2leaf
avd_design_future:
  raise_for_missing_monitor_session_acls: true
l2leaf:
  nodes:
    - name: monitor-session-missing-ipv4-source-acl
ipv4_standard_acls:
  - name: MONITOR-ACL
    entries:
      - action: permit
        source: any
network_ports:
  - switches:
      - monitor-session-missing-ipv4-source-acl
    switch_ports:
      - Ethernet1
    monitor_sessions:
      - name: CAPTURE
        role: source
        source_settings:
          access_group:
            type: ip
            name: MONITOR-ACL
expected_error_message: >-
  'ipv4_acls[name=MONITOR-ACL]' is required but was not found for host 'monitor-session-missing-ipv4-source-acl'.
