# Testing duplicate VRF definitions with conflicting PIM sparse-mode configurations.
# When the same VRF is defined in multiple tenants with conflicting PIM settings,
# the _combine method should detect the conflict and raise an error.
# This test uses conflicting BFD settings on the PIM sparse-mode VRF configuration.

type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
  nodes:
    - name: duplicate-vrfs-pim-rp-conflict
      id: 101
      bgp_as: 101
      filter:
        tenants:
          - TENANT1
          - DUPLICATE_TENANT1

evpn_l3_multicast:
  enabled: true

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF1
        vrf_id: 1
        evpn_l3_multicast:
          enabled: true
        pim_rp_addresses:
          - rps:
              - 192.168.100.1
            groups:
              - 239.0.0.0/24
        svis:
          - id: 100
            enabled: true
            name: VLAN100
            ip_address_virtual: 10.0.100.1/24

  - name: DUPLICATE_TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF1
        vrf_id: 1
        evpn_l3_multicast:
          enabled: true
        # Conflicting PIM RP address for the same group - different RP address
        pim_rp_addresses:
          - rps:
              - 192.168.100.2
            groups:
              - 239.0.0.0/24
        svis:
          - id: 100
            enabled: true
            name: VLAN100
            ip_address_virtual: 10.0.100.1/24

expected_error_message: >-
  Found duplicate objects with conflicting data while generating configuration for RouterPimSparseMode.VrfsItem.
  {'name': 'VRF1', 'ipv4': {'rp_addresses': [{'address': '192.168.100.1', 'groups': ['239.0.0.0/24']}]}}
  conflicts with {'name': 'VRF1', 'ipv4': {'rp_addresses': [{'address': '192.168.100.2', 'groups': ['239.0.0.0/24']}]}}.
