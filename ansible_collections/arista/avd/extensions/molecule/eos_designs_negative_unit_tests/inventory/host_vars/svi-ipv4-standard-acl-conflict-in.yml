---
type: l3leaf
l3leaf:
  nodes:
    - name: svi-ipv4-standard-acl-conflict-in
      id: 1
      bgp_as: 65001
      loopback_ipv4_pool: 10.0.0.0/24
      vtep_loopback_ipv4_pool: 10.1.0.0/24
      virtual_router_mac_address: 00:1c:73:00:00:01
tenants:
  - name: ACL_TEST
    mac_vrf_vni_base: 10000
    vrfs:
      - name: ACL_TEST
        vrf_id: 10
        svis:
          - id: 10
            name: ACL_TEST
            enabled: true
            ip_address_virtual: 10.10.10.1/24
            ipv4_standard_acl_in: SVI-STANDARD
            ipv4_acl_in: SVI-EXTENDED
expected_error_message: >-
  'ipv4_acl_in' and 'ipv4_standard_acl_in' are mutually exclusive on interface 'tenants[name=ACL_TEST].vrfs[name=ACL_TEST].svis[id=10]'.
  Only one ingress IPv4 ACL can be configured.
