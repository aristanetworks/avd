    - name: ssh-settings-client-duplicate-default-vrf
      id: 1
      mgmt_ip: 192.168.0.2/24
      inband_mgmt_ip: 10.20.30.40/24
      inband_mgmt_gateway: 10.20.30.1
      inband_mgmt_vrf: default

mgmt_interface_vrf: default

ssh_settings:
  client_vrfs:
