---
# The session_settings contribution omits the access-group type.
avd_design_future:
  configure_monitor_session_acls_from_catalog: false

type: l2leaf
l2leaf:
  nodes:
    - name: monitor-session-access-group-missing-type
      id: 1
      mgmt_ip: 192.168.1.2/24

servers:
  - name: server1
    adapters:
      - switches: [monitor-session-access-group-missing-type]
        switch_ports: [Ethernet1]
        monitor_sessions:
          - name: SESSION-INCOMPLETE-ACCESS-GROUP
            role: source
            source_settings:
              direction: rx
            session_settings:
              access_group:
                name: MONITOR-SESSION-ACL
