---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: missing-ipv4-address-locking-mode-with-global-disabled

avd_design_future:
  only_configure_address_locking_when_used: true

address_locking_settings:
  disabled: true

servers:
  - name: server
    adapters:
      - switches: [missing-ipv4-address-locking-mode-with-global-disabled]
        switch_ports: [Ethernet1]
        mode: access
        vlans: 10
        address_locking:
          ipv4: true
