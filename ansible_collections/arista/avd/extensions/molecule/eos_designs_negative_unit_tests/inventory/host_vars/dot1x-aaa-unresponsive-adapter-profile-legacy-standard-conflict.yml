---
# A port-profile legacy ACL and an adapter standard ACL cannot be combined after profile inheritance.
type: l2leaf
l2leaf:
  nodes:
    - name: dot1x-aaa-unresponsive-adapter-profile-legacy-standard-conflict
      mgmt_ip: 192.0.2.2/24
dot1x_settings:
  enabled: true
aaa_settings:
  radius:
    servers:
      - host: 192.0.2.10
        cleartext_key: test-key
ipv4_standard_acls:
  - name: AAA-STANDARD
    entries:
      - action: permit
        source: 192.0.2.0/24
port_profiles:
  - profile: AAA-LEGACY-PROFILE
    dot1x:
      aaa:
        unresponsive:
          action:
            traffic_allow_access_list: AAA-LEGACY
connected_endpoints:
  - name: server1
    adapters:
      - switches:
          - dot1x-aaa-unresponsive-adapter-profile-legacy-standard-conflict
        switch_ports:
          - Ethernet1
        profile: AAA-LEGACY-PROFILE
        dot1x:
          aaa:
            unresponsive:
              action:
                traffic_allow_ipv4_standard_acl: AAA-STANDARD
