---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-aaa-accounting-radius-groups-not-defined
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  authentication:
    radius_groups: [agni-server-group]
  accounting:
    radius_groups: [accounting-server-group]

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - agni-server-group
        cleartext_key: super-secret-key

expected_error_message: >-
  The RADIUS accounting server group(s) 'accounting-server-group'
  are not defined on any server under 'aaa_settings.radius.servers' for host 'dot1x-aaa-accounting-radius-groups-not-defined'.
