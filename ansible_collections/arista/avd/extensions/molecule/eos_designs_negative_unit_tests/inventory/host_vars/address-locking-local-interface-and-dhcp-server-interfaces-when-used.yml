---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
  nodes:
    - name: address-locking-local-interface-and-dhcp-server-interfaces-when-used
      id: 101
      bgp_as: 101

avd_design_future:
  fix_address_locking_dhcp_server_interfaces: true
  only_configure_address_locking_when_used: true

address_locking_settings:
  dhcp_server_interfaces:
    - Ethernet1
  local_interface: Management1

servers:
  - name: server
    adapters:
      - switches: [address-locking-local-interface-and-dhcp-server-interfaces-when-used]
        switch_ports: [Ethernet1]
        mode: access
        vlans: 10
        # active address locking client requesting rendering of the global config
        address_locking:
          ipv4: true
