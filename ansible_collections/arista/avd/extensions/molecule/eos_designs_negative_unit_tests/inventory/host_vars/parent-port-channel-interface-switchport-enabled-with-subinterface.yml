---
# Test case for Port-Channel parent interface with switchport enabled and subinterface configured
# This should fail because a parent interface with switchport enabled will cause subinterfaces to be dormant

type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:1c:73:00:dc:01
    uplink_switches: []
    uplink_interfaces: []
  node_groups:
    - group: PARENT_PORT_CHANNEL_SWITCHPORT_TEST
      bgp_as: 65100
      nodes:
        - name: parent-port-channel-interface-switchport-enabled-with-subinterface
          id: 1
          mgmt_ip: 192.168.200.106/24

# Configure a connected endpoint that sets the parent Port-Channel as a switchport
servers:
  - name: test-server-po
    adapters:
      - endpoint_ports: [eth0, eth1]
        switch_ports: [Ethernet10, Ethernet11]
        switches: [parent-port-channel-interface-switchport-enabled-with-subinterface, parent-port-channel-interface-switchport-enabled-with-subinterface]
        mode: trunk
        vlans: 10-20
        port_channel:
          mode: active
          channel_id: 10

# Configure network services with a subinterface on the same parent Port-Channel
tenants:
  - name: TEST_TENANT
    vrfs:
      - name: TEST_VRF
        vrf_id: 100
        l3_port_channels:
          - name: Port-Channel10.100
            node: parent-port-channel-interface-switchport-enabled-with-subinterface
            ip_address: 10.2.2.1/30
            description: Test Port-Channel subinterface
            enabled: true

expected_error_message: >-
  Port-Channel10 Port-Channel interface has subinterfaces configured but is set as a switchport (switchport enabled),
  which will cause the subinterfaces to be in a dormant state. Parent interface must be routed interface
  (switchport.enabled: false) or remove the subinterfaces.
