---
# An extended ACL cannot be combined with the deprecated standard ACL key.
type: l2leaf
l2leaf:
  nodes:
    - name: dot1x-aaa-unresponsive-network-port-legacy-conflict
      mgmt_ip: 192.0.2.2/24
dot1x_settings:
  enabled: true
aaa_settings:
  radius:
    servers:
      - host: 192.0.2.10
        cleartext_key: test-key
network_ports:
  - switches:
      - dot1x-aaa-unresponsive-network-port-legacy-conflict
    switch_ports:
      - Ethernet1
    dot1x:
      aaa:
        unresponsive:
          action:
            traffic_allow_ipv4_acl: AAA-EXTENDED
            traffic_allow_access_list: AAA-STANDARD

expected_error_message: >-
  'traffic_allow_ipv4_acl' and 'traffic_allow_access_list' are mutually exclusive under
  'network_ports[0].dot1x.aaa.unresponsive.action'.
