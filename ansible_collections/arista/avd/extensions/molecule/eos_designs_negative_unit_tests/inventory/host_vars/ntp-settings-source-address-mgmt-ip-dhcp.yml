type: l2leaf
l2leaf:
  nodes:
    - name: ntp-settings-source-address-mgmt-ip-dhcp
      id: 1
      mgmt_ip: dhcp

ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: pool.ntp.com
      source_address: use_mgmt_interface_ipv4

expected_error_message: >-
  'ntp_settings.servers[name=pool.ntp.com].source_address' is set to 'use_mgmt_interface_ipv4' but mgmt_ip is set to 'dhcp'. A static IP is required to resolve this source_address keyword.
