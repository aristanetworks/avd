type: l3leaf

l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    bgp_as: 65101
  nodes:
    - name: failure-ospfv3-ipv6-not-enabled
      bgp_as: 65101
      id: 1
      mgmt_ip: 192.168.200.101/24

tenants:
  - name: Tenant_A
    mac_vrf_vni_base: 10000
    vrfs:
      - name: OSPFv3_TEST_SVI
        description: "IGMP_QUERIER_TEST_3"
        vrf_vni: 41
        ipv6_ospf:
          enabled: true
          router_id: ipv6_ospf_router
          auto_cost_reference_bandwidth: 10
        svis:
          - id: 21
            name: "VLAN_21"
            ipv6_ospf:
              enabled: true

expected_error_message: >-
  OSPFv3 is enabled on SVI 'VLAN_21' but 'ipv6_enable' is not set under 'tenants[name=Tenant_A].vrfs[name=OSPFv3_TEST_SVI].svis[id=21]'.
