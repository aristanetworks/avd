type: l3leaf

l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: failure-l2vlan-igmp-snooping-querier-source-address-resolve
      bgp_as: 65101
      id: 1
      mgmt_ip: 192.168.200.101/24

tenants:
  - name: Tenant_A
    mac_vrf_vni_base: 10000
    igmp_snooping:
      querier:
        enabled: true
        source_address: none
    l2vlans:
      - id: 110
        name: research1

expected_error_message: >-
  Invalid IGMP snooping querier source address for VLAN 'research1' in Tenant 'Tenant_A'.
  The value 'none' resolved from 'igmp_snooping.querier.source_address: none' is not a valid IPv4 address
  for host 'failure-l2vlan-igmp-snooping-querier-source-address-resolve'.
