---
type: l3leaf
overlay_routing_protocol: none
l3leaf:
  nodes:
    - name: network-ports-routed-missing-address
      id: 1
      bgp_as: 65101
      loopback_ipv4_pool: 192.168.255.0/24
      vtep_loopback_ipv4_pool: 192.168.254.0/24

port_profiles:
  - profile: ROUTED
    mode: routed

network_ports:
  # 'mode: routed' from a port profile without 'switch_ipv4_addresses'.
  - switches: [network-ports-routed-missing-address]
    switch_ports: [Ethernet1-2]
    profile: ROUTED
