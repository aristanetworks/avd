---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: network-services-ospfv3-vxlan-svi
      id: 1
      bgp_as: 65101

tenants:
  - name: TENANT_A
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF_A
        vrf_id: 10
        svis:
          # vxlan is left at its default (true).
          - id: 110
            name: VXLAN_DEFAULT
            ipv6_address: 2001:db8:110::1/64
            ospfv3:
              enabled: true
