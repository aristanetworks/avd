type: l2leaf
l2leaf:
  nodes:
    - name: ntp-settings-source-address-vrf-mismatch
      id: 1
      mgmt_ip: 192.168.0.2/24

ntp_settings:
  server_vrf: default
  servers:
    - name: pool.ntp.com
      source_address: use_mgmt_interface_ipv4

expected_error_message: >-
  'ntp_settings.servers[name=pool.ntp.com].source_address' is set to 'use_mgmt_interface_ipv4', but 'ntp_settings.server_vrf' resolves to 'default'. This source_address keyword requires VRF 'MGMT'.
