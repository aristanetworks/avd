---
# Testing macsec_profile inherited from an l3_edge p2p_links_profile on a Port-Channel link.

node_type_keys:
  - key: core_router
    type: core_router

type: core_router
core_router:
  defaults:
    loopback_ipv4_pool: 10.0.0.0/24
  nodes:
    - name: l3-edge-port-channel-profile-with-macsec
      id: 1
      bgp_as: 65123

l3_edge:
  p2p_links_profiles:
    - name: port-channel-with-macsec
      macsec_profile: test-macsec-profile
  p2p_links:
    - nodes: [l3-edge-port-channel-profile-with-macsec, peer1]
      profile: port-channel-with-macsec
      ip: [10.0.1.0/31, 10.0.1.1/31]
      port_channel:
        nodes_child_interfaces:
          - node: l3-edge-port-channel-profile-with-macsec
            interfaces: [Ethernet1, Ethernet2]
            channel_id: 1
          - node: peer1
            interfaces: [Ethernet1, Ethernet2]
            channel_id: 1

expected_error_message: "'PortChannelInterfacesItem' object has no attribute 'mac_security'"
