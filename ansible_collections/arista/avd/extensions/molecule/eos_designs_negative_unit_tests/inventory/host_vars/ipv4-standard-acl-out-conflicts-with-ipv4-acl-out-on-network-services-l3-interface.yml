---
# Tests that setting both ipv4_acl_out and ipv4_standard_acl_out on the same
# network_services l3_interface raises AristaAvdInvalidInputsError.
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
  nodes:
    - name: ipv4-standard-acl-out-conflicts-with-ipv4-acl-out-on-network-services-l3-interface
      id: 101
      bgp_as: 101

tenants:
  - name: L3INTF
    mac_vrf_vni_base: 10000
    vrfs:
      - name: TESTING
        vrf_id: 2
        l3_interfaces:
          - interfaces: [Ethernet1]
            nodes: [ipv4-standard-acl-out-conflicts-with-ipv4-acl-out-on-network-services-l3-interface]
            ip_addresses: ["10.0.1.1/31"]
            enabled: true
            ipv4_acl_out: EXTENDED-ACL-OUT
            ipv4_standard_acl_out: STD-ACL-OUT

expected_error_message: >-
  'ipv4_acl_out' and 'ipv4_standard_acl_out' are mutually exclusive on interface
  'tenants[name=L3INTF].vrfs[name=TESTING].l3_interfaces[interfaces=Ethernet1]'.
  Only one egress IPv4 ACL can be configured.
