---
# Minimum config to only test the specific feature.
node_type_keys:
  - key: pe
    type: pe
    mpls_lsr: true
    default_mpls_overlay_role: client
    default_evpn_role: client
    network_services:
      l1: true
      l2: true
      l3: true
    default_overlay_routing_protocol: ibgp
    default_overlay_address_families: [evpn]
    default_evpn_encapsulation: mpls

pe:
  defaults:
    loopback_ipv4_pool: 10.42.0.0/24
    bgp_as: 42
  nodes:
    - name: network-services-monitor-session-subinterface-destination
      id: 42

type: pe

tenants:
  - name: TENANT_A
    vrfs:
      - name: VRF_A
        vrf_id: 10
        l3_interfaces:
          - description: SITE_A
            enabled: true
            interfaces:
              - Ethernet6.101
            ip_addresses:
              - 192.168.48.4/31
            nodes:
              - network-services-monitor-session-subinterface-destination
            monitor_sessions:
              - name: SESSION-ON-SUBINTERFACE-WITH-DESTINATION-ROLE
                role: destination

expected_error_message: >-
  Port mirroring destination on sub-interface is not supported.
  Got 'role: destination' for monitor session 'SESSION-ON-SUBINTERFACE-WITH-DESTINATION-ROLE' on interface 'Ethernet6.101'
  under tenants[name=TENANT_A].vrfs[name=VRF_A].l3_interfaces[0].
