# Testing duplicate VRF definitions with conflicting BGP structured_config.
# If the same VRF name is used across multiple tenants and those tenants
# are accepted by `filter.tenants` on the node, any BGP structured_config set under
# the duplicate VRFs must either be unique or be an exact match.

type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
  nodes:
    - name: duplicate-vrfs-bgp-structured-config-conflict
      id: 101
      bgp_as: 65101
      filter:
        tenants:
          - TENANT1
          - TENANT2

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF1
        vrf_id: 1
        vrf_vni: 1
        svis:
          - id: 100
            enabled: true
            name: VLAN100
            ip_address_virtual: 10.0.100.1/24
        bgp:
          structured_config:
            rd: "65101:100"

  - name: TENANT2
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF1
        # Same VRF but with conflicting BGP structured_config
        vrf_id: 1
        vrf_vni: 1
        svis:
          - id: 101
            enabled: true
            name: VLAN101
            ip_address_virtual: 10.0.101.1/24
        bgp:
          structured_config:
            rd: "65101:200"  # Different RD - conflict!

expected_error_message: >-
  Found duplicate objects with conflicting data while generating configuration for VrfsItem.
  {'name': 'VRF1', 'rd': '65101:100'} conflicts with {'rd': '65101:200'}.
