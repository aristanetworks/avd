type: l2leaf
l2leaf:
  nodes:
    - name: source-interfaces-ssh-client-duplicate-vrf
      id: 1
      mgmt_ip: 192.168.0.2/24
      inband_mgmt_ip: 10.20.30.40/24
      inband_mgmt_gateway: 10.20.30.1
      inband_mgmt_vrf: default

mgmt_interface_vrf: default

ssh_settings:
  client_source_interfaces:
    - vrf: use_mgmt_interface_vrf
    - vrf: use_inband_mgmt_vrf

expected_error_message: >-
  Duplicate resolved VRF 'default' found under 'ssh_settings.client_source_interfaces'. Inputs resolving to this VRF: use_inband_mgmt_vrf, use_mgmt_interface_vrf. Use only one entry per resolved VRF.
