---
type: l3leaf
overlay_routing_protocol: none
l3leaf:
  nodes:
    - name: connected-endpoints-routed-length-mismatch
      id: 1
      bgp_as: 65101
      loopback_ipv4_pool: 192.168.255.0/24
      vtep_loopback_ipv4_pool: 192.168.254.0/24

servers:
  # More 'switch_ipv4_addresses' than 'switches' and 'switch_ports'.
  - name: ROUTED_SERVER
    adapters:
      - switches: [connected-endpoints-routed-length-mismatch]
        switch_ports: [Ethernet1]
        mode: routed
        switch_ipv4_addresses: [10.0.0.0/31, 10.0.0.2/31]
