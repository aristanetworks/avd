---
type: l3leaf
l3leaf:
  defaults:
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: monitor-connectivity-host-local-interfaces-not-in-interface-sets
      id: 203
      bgp_as: 203
      loopback_ipv4_pool: 192.168.255.0/24
      mgmt_ip: 1.1.10.203

monitor_connectivity:
  interval: 5
  interface_sets:
    - name: SET_INTERNET
      interfaces: [Ethernet1, Ethernet2]
  hosts:
    - name: DNS1
      ip: 8.8.8.8
      local_interfaces: Loopback0
