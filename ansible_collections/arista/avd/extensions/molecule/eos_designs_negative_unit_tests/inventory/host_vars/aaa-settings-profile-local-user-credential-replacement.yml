---
devices:
  - name: aaa-settings-profile-local-user-credential-replacement
    type: l2leaf
    aaa_settings_profile: credential_rotation

aaa_settings:
  local_users:
    - name: rotating-user
      privilege: 15
      role: network-admin
      sha512_password: OLD_LOCAL_USER_PASSWORD_HASH

aaa_settings_profiles:
  - profile: credential_rotation
    local_users:
      - name: rotating-user
        cleartext_password: new-local-user-password
