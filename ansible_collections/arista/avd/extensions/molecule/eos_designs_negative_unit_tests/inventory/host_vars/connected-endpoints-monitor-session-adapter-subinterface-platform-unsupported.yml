loopback_ipv4_pool: 192.168.1.0/24

platform_settings:
  - platforms:
      - PLATFORM_WITHOUT_SUBINTERFACE_MONITOR_SESSION
    feature_support:
      subinterface_monitor_session: false
    reload_delay:
      mlag: 300
      non_mlag: 330

type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: connected-endpoints-monitor-session-adapter-subinterface-platform-unsupported
      platform: PLATFORM_WITHOUT_SUBINTERFACE_MONITOR_SESSION

servers:
  - name: SERVER_1
    adapters:
      - switches: [connected-endpoints-monitor-session-adapter-subinterface-platform-unsupported]
        switch_ports: [Ethernet1.100]
        monitor_sessions:
          - name: DMF
            role: source
            source_settings:
              direction: rx

expected_error_message: >-
  Monitor session on sub-interfaces is not supported on this platform.
  Got monitor session on interface 'Ethernet1.100' under servers[name=SERVER_1].adapters[0].
