---
# With 'uplink_type: lan' on a node type with only L3 network services, the SVIs are only deployed as subinterfaces on the uplink interface.
# The uplink switch 'network-services-ospfv3-uplink-type-lan-l2leaf' must carry the VLAN for the subinterface to be created.
custom_node_type_keys:
  - key: l3_router
    type: l3-router
    network_services:
      l3: true
    default_underlay_routing_protocol: none
    default_overlay_routing_protocol: none

type: l3-router
l3_router:
  nodes:
    - name: network-services-ospfv3-uplink-type-lan
      id: 1
      loopback_ipv4_pool: 192.168.255.0/24
      uplink_type: lan
      uplink_interfaces: [Ethernet1]
      uplink_switches: [network-services-ospfv3-uplink-type-lan-l2leaf]
      uplink_switch_interfaces: [Ethernet1]

tenants:
  - name: TENANT_A
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF_A
        vrf_id: 10
        svis:
          - id: 110
            name: SUBINTERFACE
            vxlan: false
            ipv6_address: 2001:db8:110::1/64
            ospfv3:
              enabled: true

expected_error_message: >-
  'tenants[name=TENANT_A].vrfs[name=VRF_A].svis[id=110].ospfv3.enabled: true' is not supported on SVIs deployed as subinterfaces with 'uplink_type:
  lan'.
