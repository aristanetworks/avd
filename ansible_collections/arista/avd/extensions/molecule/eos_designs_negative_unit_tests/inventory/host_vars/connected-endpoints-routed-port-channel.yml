---
type: l2leaf
l2leaf:
  nodes:
    - name: connected-endpoints-routed-port-channel

servers:
  # 'mode: routed' with a port-channel.
  - name: ROUTED_SERVER
    adapters:
      - switches: [connected-endpoints-routed-port-channel, connected-endpoints-routed-port-channel]
        switch_ports: [Ethernet1, Ethernet2]
        mode: routed
        switch_ipv4_addresses: [10.0.0.0/31, 10.0.0.2/31]
        port_channel:
          mode: active
