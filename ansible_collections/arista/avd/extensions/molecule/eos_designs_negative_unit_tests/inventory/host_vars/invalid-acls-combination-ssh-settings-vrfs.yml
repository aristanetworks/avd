---
type: l2leaf

l2leaf:
  nodes:
    - name: invalid-acls-combination-ssh-settings-vrfs
      id: 43
      mgmt_ip: 10.10.10.43/26

ipv4_standard_acls:
  - name: ACL-SSH-STANDARD
    entries:
      - sequence: 10
        action: permit
        source: any

mgmt_interface_settings:
  vrf: MGMT
mgmt_gateway: 10.10.10.1

ssh_settings:
  enabled: false
  vrfs:
    - name: VRF20
      enabled: true
      ipv4_acl: ACL-EXTENDED
      ipv4_standard_acl: ACL-SSH-STANDARD

expected_error_message: >-
  'ipv4_acl' and 'ipv4_standard_acl' are mutually exclusive on 'ssh_settings.vrfs[name=VRF20]'
  for host 'missing-ipv4-standard-acl-ssh-settings-vrfs'. Only one IPv4 ACL can be configured.
