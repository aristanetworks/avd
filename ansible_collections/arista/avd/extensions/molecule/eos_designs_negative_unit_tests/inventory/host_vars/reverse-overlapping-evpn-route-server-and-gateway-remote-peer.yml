---
# This host tests the reverse overlap case: it is listed as an
# evpn_gateway.remote_peers target by reverse-evpn-gateway-remote-peer while
# also listing that same peer under evpn_route_servers locally.
type: l3leaf

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    bgp_as: 65101
  nodes:
    - name: reverse-overlapping-evpn-route-server-and-gateway-remote-peer
      id: 4
      bgp_as: 65106
      mgmt_ip: 192.168.200.113/24
      evpn_route_servers:
        - reverse-evpn-gateway-remote-peer

expected_error_message: >-
  Cannot configure EVPN Gateway remote peer 'reverse-evpn-gateway-remote-peer' under both another node's 'evpn_gateway.remote_peers'
  and 'evpn_route_servers' on this node. Use each inventory hostname in only one of these inputs.
