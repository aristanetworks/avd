---
# Tests that setting both ipv4_acl_out and ipv4_standard_acl_out on the same
# node_type l3_interface raises AristaAvdInvalidInputsError.
type: spine

spine:
  nodes:
    - name: ipv4-standard-acl-out-conflicts-with-ipv4-acl-out-on-node-type-l3-interface
      bgp_as: 65100
      id: 100
      loopback_ipv4_pool: 192.168.100.0/24
      l3_interfaces:
        - name: Ethernet1
          ip_address: 172.16.0.2/30
          ipv4_acl_out: EXTENDED-ACL-OUT
          ipv4_standard_acl_out: STD-ACL-OUT

expected_error_message: >-
  'ipv4_acl_out' and 'ipv4_standard_acl_out' are mutually exclusive on interface 'spine.nodes[name=ipv4-standard-acl-out-conflicts-with-ipv4-acl-out-on-node-type-l3-interface].l3_interfaces[name=Ethernet1]'. Only one egress IPv4 ACL can be configured.
