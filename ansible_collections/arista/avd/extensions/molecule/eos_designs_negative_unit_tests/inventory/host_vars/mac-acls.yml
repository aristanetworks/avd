---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: mac-acls

servers:
  - name: Server1
    adapters:
      - switches: [mac-acls]
        switch_ports: [Ethernet1]
        endpoint_ports: [ENDPOINT_PORT]
        mac_acl_in: ACL1

expected_error_message: >-
  MAC access-list `ACL1` referenced under servers[name=Server1].adapters[0] is not present in `mac_acls`.
