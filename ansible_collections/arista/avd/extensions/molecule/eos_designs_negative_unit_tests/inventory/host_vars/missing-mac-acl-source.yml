---
mac_acls:
  - name: acl1
    entries:
      - sequence: 10
        action: deny
        destination: any

type: l2leaf

l2leaf:
  nodes:
    - name: missing-mac-acl-source

servers:
  - name: server1
    rack: RackB
    adapters:
      - endpoint_ports: [E0]
        switch_ports: [Ethernet2]
        switches: [missing-mac-acl-source]
        mac_acl_in: acl1

expected_error_message: >-
  'mac_acls[name=acl1].entries[0].source' is required but was not found for host 'missing-mac-acl-source'.
