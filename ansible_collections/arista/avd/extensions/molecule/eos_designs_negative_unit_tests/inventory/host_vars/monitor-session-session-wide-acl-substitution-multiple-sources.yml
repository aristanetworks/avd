---
# A session-wide ACL with interface-specific substitution cannot be resolved for multiple source interfaces.
avd_design_future:
  configure_monitor_session_acls_from_catalog: true

ipv6_acls:
  - name: MONITOR-SESSION-ACL-SUBSTITUTION
    entries:
      - sequence: 10
        action: permit
        protocol: ipv6
        source: interface_ipv6
        destination: any

type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: monitor-session-session-wide-acl-substitution-multiple-sources
      id: 101
      bgp_as: 65101

tenants:
  - name: TEST
    mac_vrf_vni_base: 10000
    vrfs:
      - name: default
        vrf_id: 1
        bgp:
          enabled: false
        l3_interfaces:
          - interfaces: [Ethernet10]
            nodes: [monitor-session-session-wide-acl-substitution-multiple-sources]
            ipv6_addresses: ["2001:db8:10::1/64"]
            enabled: true
            monitor_sessions:
              - name: SESSION-WITH-MULTIPLE-SOURCES
                role: source
                source_settings:
                  direction: rx
                session_settings:
                  access_group:
                    type: ipv6
                    name: MONITOR-SESSION-ACL-SUBSTITUTION
          - interfaces: [Ethernet11]
            nodes: [monitor-session-session-wide-acl-substitution-multiple-sources]
            ipv6_addresses: ["2001:db8:11::1/64"]
            enabled: true
            monitor_sessions:
              - name: SESSION-WITH-MULTIPLE-SOURCES
                role: source
                source_settings:
                  direction: rx
