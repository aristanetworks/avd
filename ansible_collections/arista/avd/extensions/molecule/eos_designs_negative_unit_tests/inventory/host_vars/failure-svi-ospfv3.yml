type: l3leaf

l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: failure-svi-ospfv3
      bgp_as: 65101
      id: 1
      mgmt_ip: 192.168.200.101/24

tenants:
  # Node-level enabled: false disables OSPFv3 VRF level enabled: true,
  # OSPFv3 process should NOT be created for this node
  - name: Tenant_OSPFv3_Node_Override_Disabled
    mac_vrf_vni_base: 11000
    mac_vrf_id_base: 21000
    redistribute_mlag_ibgp_peering_vrfs: true
    vrfs:
      - name: Tenant_OSPFv3_Node_Override_Disabled_VRF
        vrf_vni: 106
        vrf_id: 48
        ospfv3:
          enabled: true
          router_id: 192.168.255.105
          address_family_ipv4:
            enabled: true
            redistribute_bgp:
              enabled: true
          address_family_ipv6:
            enabled: true
            redistribute_bgp:
              enabled: true
          nodes:
            - node: failure-svi-ospfv3
              enabled: false
        redistribute_ospfv3: true
        svis:
          - id: 210
            name: Tenant_OSPFv3_Node_Override_Disabled_210
            description: "Test node-level override disables OSPFv3"
            enabled: true
            ipv6_address: dead::beef/64
            ipv6_enable: true
            ospfv3:
              enabled: true
              address_family_ipv4:
                enabled: true
              address_family_ipv6:
                enabled: true
              passive_interface: true
              network_point_to_point: true

expected_error_message: >-
  OSPFv3 is enabled on SVI 'Tenant_OSPFv3_Node_Override_Disabled_210' but not under
  'tenants[name=Tenant_OSPFv3_Node_Override_Disabled].vrfs[name=Tenant_OSPFv3_Node_Override_Disabled_VRF]'.
