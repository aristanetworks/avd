---
# Minimum config to only test duplicate VLAN ID between suspended_vlans and network services VLANs.
type: l2leaf

l2leaf:
  nodes:
    - name: duplicate-vlans-suspended-vlans-and-connected-endpoints
      id: 1

general_settings:
  suspended_vlans:
    - id: 100

tenants:
  - name: Tenant-A
    vrfs:
      - name: default
        vrf_id: 2
        svis:
          - id: 100
            name: test-1
            vni_override: 50111
