---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-device-profiling-dhcp-with-ip-locking
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  device_profiling:
    enabled: true

address_locking_settings:
  local_interface: Loopback0
  dhcp_servers_ipv4:
    - 10.0.0.1

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        cleartext_key: super-secret-key

expected_error_message: >-
  'dot1x_settings.device_profiling.dhcp' is incompatible with IP Locking.
  Either remove 'address_locking_settings' or set 'address_locking_settings.disabled: true'.
