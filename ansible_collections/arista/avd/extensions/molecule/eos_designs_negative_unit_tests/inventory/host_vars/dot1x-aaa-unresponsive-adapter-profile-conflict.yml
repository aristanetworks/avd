---
# An extended ACL cannot be combined with a standard ACL.
type: l2leaf
l2leaf:
  nodes:
    - name: dot1x-aaa-unresponsive-adapter-profile-conflict
      mgmt_ip: 192.0.2.2/24
dot1x_settings:
  enabled: true
aaa_settings:
  radius:
    servers:
      - host: 192.0.2.10
        cleartext_key: test-key
port_profiles:
  - profile: AAA-PROFILE
    dot1x:
      aaa:
        unresponsive:
          action:
            traffic_allow_ipv4_standard_acl: AAA-STANDARD
connected_endpoints:
  - name: server1
    adapters:
      - switches:
          - dot1x-aaa-unresponsive-adapter-profile-conflict
        switch_ports:
          - Ethernet1
        profile: AAA-PROFILE
        dot1x:
          aaa:
            unresponsive:
              action:
                traffic_allow_ipv4_acl: AAA-EXTENDED

expected_error_message: >-
  'traffic_allow_ipv4_acl' and 'traffic_allow_ipv4_standard_acl' are mutually exclusive
  under 'connected_endpoints[name=server1].adapters[0].dot1x.aaa.unresponsive.action' for host
  'dot1x-aaa-unresponsive-adapter-profile-conflict'.
