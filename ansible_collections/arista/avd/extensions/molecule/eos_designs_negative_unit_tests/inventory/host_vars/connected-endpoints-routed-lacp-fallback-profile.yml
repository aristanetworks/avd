---
type: l2leaf
l2leaf:
  nodes:
    - name: connected-endpoints-routed-lacp-fallback-profile

port_profiles:
  - profile: ROUTED
    mode: routed

servers:
  # LACP fallback individual member interfaces using a routed port profile.
  - name: L2_SERVER
    adapters:
      - switches: [connected-endpoints-routed-lacp-fallback-profile, connected-endpoints-routed-lacp-fallback-profile]
        switch_ports: [Ethernet1, Ethernet2]
        mode: trunk
        port_channel:
          mode: active
          lacp_fallback:
            mode: individual
            individual:
              profile: ROUTED
