---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: missing-web-authentication-acl-in-catalog
      mgmt_ip: 192.168.0.2/24

ipv4_acls:
# ip_access_lists:
  - name: web-acl1
    entries:
      - sequence: 15
        action: deny
        protocol: ip
        source: any
        destination: 10.0.0.1

dot1x_settings:
  enabled: true
  web_authentication:
    enabled: true
    ipv4_acl: web-acl

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        cleartext_key: super-secret-key

expected_error_message: >-
  'ipv4_acls[name=web-acl]' is required but was not found for host 'missing-web-authentication-acl-in-catalog'.
