---
custom_node_type_keys:
  - key: routed_wan_router
    type: routed_wan_router
    default_evpn_role: none
    default_wan_role: client
    default_underlay_routing_protocol: ebgp
    default_overlay_routing_protocol: none
    connected_endpoints: true

type: routed_wan_router
wan_mode: legacy-autovpn

bgp_peer_groups:
  wan_overlay_peers:
    password: "htm4AZe9mIQOO1uiMuGgYQ=="
    listen_range_prefixes:
      - 192.168.142.0/24

wan_ipsec_profiles:
  control_plane:
    shared_key: ABCDEF1234567890

routed_wan_router:
  nodes:
    - name: connected-endpoints-routed-unsupported-wan-router
      id: 1
      bgp_as: 65000
      loopback_ipv4_pool: 192.168.42.0/24
      vtep_loopback_ipv4_pool: 192.168.142.0/24
      l3_interfaces:
        - name: Ethernet3
          wan_carrier: ATT
          wan_circuit_id: 404
          ip_address: 172.31.0.2/31
          peer_ip: 172.31.0.1

wan_path_groups:
  - name: INET
    id: 101

wan_carriers:
  - name: ATT
    path_group: INET
    trusted: true

servers:
  # 'mode: routed' on a WAN router.
  - name: ROUTED_SERVER
    adapters:
      - switches: [connected-endpoints-routed-unsupported-wan-router]
        switch_ports: [Ethernet1]
        mode: routed
        switch_ipv4_addresses: [10.0.0.0/31]
