---
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: invalid-dot1q-encapsulation-vlan-ethernet-subinterface
      platform: 720XP
      link_tracking:
        enabled: true
      filter:
        only_vlans_in_use: true
      mgmt_ip: 192.168.1.2

servers:
  # port-channel provide physical and port-channel descriptions as templates with all fields
  - name: OLD_SW-1/2
    adapters:
      - switches: [invalid-dot1q-encapsulation-vlan-ethernet-subinterface]
        switch_ports: [Ethernet1]
        endpoint_ports: [Endpoint_port1]
        description: "Interface description {interface} {endpoint_type}_{endpoint}{endpoint_port?<_!u}"
        subinterfaces:
          - number: 10000
            description: subinterface number greater that 4094
            vlan_id: 1000

expected_error_message: >-
  'encapsulation_vlan.client_dot1q' must be set for 'servers[name=OLD_SW-1/2].adapters[0].subinterfaces[number=10000]'
  since the subinterface number is above 4094.
