type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: invalid-aaa-settings-radius-group
      mgmt_ip: 192.168.0.2/24

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - radius
        cleartext_key: super-secret-key

expected_error_message: >-
  Cannot use server group 'radius' for `aaa_settings.radius.servers[host=agni.arista.com]`.
  This group name is reserved by EOS. Please choose a different group name.
