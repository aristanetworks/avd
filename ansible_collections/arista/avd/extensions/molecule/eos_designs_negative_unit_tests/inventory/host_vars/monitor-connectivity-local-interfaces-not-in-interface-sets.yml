---
type: l3leaf
l3leaf:
  defaults:
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: monitor-connectivity-local-interfaces-not-in-interface-sets
      id: 201
      bgp_as: 201
      loopback_ipv4_pool: 192.168.255.0/24
      mgmt_ip: 1.1.10.201

monitor_connectivity:
  interval: 5
  interface_sets:
    - name: SET_INTERNET
      interfaces: [Ethernet1, Ethernet2]
  local_interfaces: Loopback0
