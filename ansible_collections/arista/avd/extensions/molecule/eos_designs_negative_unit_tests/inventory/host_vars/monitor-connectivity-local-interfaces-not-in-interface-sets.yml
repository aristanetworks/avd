---
type: l3leaf
l3leaf:
  nodes:
    - name: monitor-connectivity-local-interfaces-not-in-interface-sets
      id: 201
      bgp_as: 201
      loopback_ipv4_pool: 192.168.255.0/24
      mgmt_ip: 1.1.10.201

monitor_connectivity:
  interval: 5
  interface_sets:
    - name: SET_INTERNET
      interfaces: Ethernet1-2
  local_interfaces: Loopback0

expected_error_message: >-
  monitor_connectivity.local_interfaces 'Loopback0' has to be defined in monitor_connectivity.interface_sets.
