---
# Test for missing "mgmt_ip" and "ipv6_mgmt_ip", when "default_mgmt_method" is "oob".
# `address_locking_settings` triggers `get_local_interface` which resolves
# `default_mgmt_protocol_interface` and surfaces the error from `default_mgmt_method`.
default_mgmt_method: oob

type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: missing-mgmt-ip-default-mgmt-method-oob

address_locking_settings:
  dhcp_servers_ipv4:
    - 10.10.10.10

expected_error_message: >-
  'default_mgmt_method: oob' requires either 'mgmt_ip' or 'ipv6_mgmt_ip' to be set.
