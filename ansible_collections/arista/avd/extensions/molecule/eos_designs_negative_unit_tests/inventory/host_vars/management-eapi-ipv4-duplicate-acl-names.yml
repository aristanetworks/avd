---
type: l2leaf

l2leaf:
  nodes:
    - name: management-eapi-ipv4-duplicate-acl-names
      id: 43
      mgmt_ip: 10.10.10.43/26

management_eapi:
  enabled: true
  vrfs:
    - name: management
      enabled: true
      ipv4_standard_acl: FILTER
    - name: extended
      enabled: true
      ipv4_acl: FILTER

ipv4_standard_acls:
  - name: FILTER
    entries:
      - sequence: 10
        action: permit
        source: 192.0.2.0/24

avd_design_future:
  raise_for_missing_management_eapi_acls: true

ipv4_acls:
  - name: FILTER
    entries:
      - sequence: 10
        action: permit
        protocol: ip
        source: any
        destination: any

expected_error_message: >-
  'standard_access_lists[name=FILTER]': ACL 'FILTER' expected from 'ipv4_standard_acls' is also rendered under 'ip_access_lists' (extended ACL catalog
  'ipv4_acls'). Extended and standard ACL names must be distinct on each device.
