---
type: l2leaf

l2leaf:
  nodes:
    - name: management-eapi-ipv4-duplicate-acl-names
      id: 43
      mgmt_ip: 10.10.10.43/26

management_eapi:
  enabled: true
  vrfs:
    - name: management
      enabled: true
      ipv4_standard_acl: FILTER
    - name: extended
      enabled: true
      ipv4_acl: FILTER

avd_design_future:
  raise_for_missing_management_eapi_acls: true

ipv4_standard_acls:
  - name: FILTER
    entries:
      - action: permit
        source: 192.0.2.0/24

ipv4_acls:
  - name: FILTER
    entries:
      - action: permit
        protocol: ip
        source: any
        destination: any

expected_error_message: >-
  'management_eapi.vrfs[name=extended].ipv4_acl' and 'management_eapi.vrfs[name=management].ipv4_standard_acl'
  are mutually exclusive for ACL 'FILTER'. Only one IPv4 ACL type can be configured with the same name.
