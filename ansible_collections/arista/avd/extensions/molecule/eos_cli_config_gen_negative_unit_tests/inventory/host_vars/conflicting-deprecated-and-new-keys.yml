---
ethernet_interfaces:
  - name: Ethernet1
    # The deprecated key is still supported alone, but conflicts with its replacement.
    ipv6_address: 2001:db8:1::1/64
    ipv6_addresses:
      - 2001:db8:1::2/64
  - name: Ethernet2
    # Also exercise a replacement key reached through a nested path.
    ipv6_nd_ra_disabled: true
    ipv6_nd:
      ra:
        disabled: false
