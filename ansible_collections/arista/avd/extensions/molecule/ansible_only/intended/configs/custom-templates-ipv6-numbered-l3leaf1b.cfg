!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname custom-templates-ipv6-numbered-l3leaf1b
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
vlan 11
   name VRF10_VLAN11
!
vlan 12
   name VRF10_VLAN12
!
vrf instance MGMT
!
vrf instance VRF10
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_custom-templates-ipv6-numbered-spine_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:2:1::2/64
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8:1::2/128
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ipv6 address 2001:db8:5::2/128
!
interface Loopback10
   description DIAG_VRF_VRF10
   no shutdown
   vrf VRF10
   ip address 10.255.10.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.1.32/24
!
interface Vlan11
   description VRF10_VLAN11
   no shutdown
   vrf VRF10
   ip address virtual 10.10.11.1/24
!
interface Vlan12
   description VRF10_VLAN12
   no shutdown
   vrf VRF10
   ip address virtual 10.10.12.1/24
!
interface Vxlan1
   description custom-templates-ipv6-numbered-l3leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan encapsulation ipv6
   vxlan vlan 11 vni 10011
   vxlan vlan 12 vni 10012
   vxlan vrf VRF10 vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip address virtual source-nat vrf VRF10 address 10.255.10.2
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF10
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8:1::/48 eq 128
   seq 20 permit 2001:db8:5::/48 eq 128
!
ipv6 unicast-routing
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.255.2.2
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 2001:db8:2:1::1 peer group IPv4-UNDERLAY-PEERS
   neighbor 2001:db8:2:1::1 remote-as 65100
   neighbor 2001:db8:2:1::1 description custom-templates-ipv6-numbered-spine_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 11
      rd 10.255.2.2:10011
      route-target both 10011:10011
      redistribute learned
   !
   vlan 12
      rd 10.255.2.2:10012
      route-target both 10012:10012
      redistribute learned
   !
   address-family ipv6
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf VRF10
      rd 10.255.2.2:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.255.2.2
      redistribute connected
!
end
