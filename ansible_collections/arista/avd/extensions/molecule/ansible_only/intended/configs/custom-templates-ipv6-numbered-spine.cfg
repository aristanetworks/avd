!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname custom-templates-ipv6-numbered-spine
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_custom-templates-ipv6-numbered-l3leaf1a_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:2::1/64
!
interface Ethernet2
   description P2P_custom-templates-ipv6-numbered-l3leaf1b_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:2:1::1/64
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8::1/128
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.1.35/24
!
ip routing
no ip routing vrf MGMT
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8::/48 eq 128
!
ipv6 unicast-routing
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
router bgp 65100
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 2001:db8:2:1::2 peer group IPv4-UNDERLAY-PEERS
   neighbor 2001:db8:2:1::2 remote-as 65101
   neighbor 2001:db8:2:1::2 description custom-templates-ipv6-numbered-l3leaf1b_Ethernet1
   neighbor 2001:db8:2::2 peer group IPv4-UNDERLAY-PEERS
   neighbor 2001:db8:2::2 remote-as 65101
   neighbor 2001:db8:2::2 description custom-templates-ipv6-numbered-l3leaf1a_Ethernet1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv6
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
