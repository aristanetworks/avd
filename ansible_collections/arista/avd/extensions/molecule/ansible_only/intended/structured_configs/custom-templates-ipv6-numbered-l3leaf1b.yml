aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_custom-templates-ipv6-numbered-spine_Ethernet2
  shutdown: false
  mtu: 9214
  ipv6_addresses:
  - 2001:db8:2:1::2/64
  metadata:
    peer: custom-templates-ipv6-numbered-spine
    peer_interface: Ethernet2
    peer_type: spine
  switchport:
    enabled: false
hostname: custom-templates-ipv6-numbered-l3leaf1b
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
ipv6_prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY-V6
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:1::/48 eq 128
  - sequence: 20
    action: permit 2001:db8:5::/48 eq 128
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ipv6_addresses:
  - 2001:db8:1::2/128
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ipv6_addresses:
  - 2001:db8:5::2/128
- name: Loopback10
  description: DIAG_VRF_VRF10
  shutdown: false
  vrf: VRF10
  ip_address: 10.255.10.2/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.1.32/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: ANSIBLE_ONLY
  validate_hardware:
    enabled: false
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 30
    type: permit
    match:
    - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.255.2.2
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv6
    send_community: all
    maximum_routes: 256000
  neighbors:
  - ip_address: 2001:db8:2:1::1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: custom-templates-ipv6-numbered-spine
    description: custom-templates-ipv6-numbered-spine_Ethernet2
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 11
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.2.2:10011
    route_targets:
      both:
      - 10011:10011
    redistribute_routes:
    - learned
  - id: 12
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.2.2:10012
    route_targets:
      both:
      - 10012:10012
    redistribute_routes:
    - learned
  address_family_ipv6:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
  vrfs:
  - name: VRF10
    rd: 10.255.2.2:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.255.2.2
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
transceiver_qsfp_default_mode_4x10: true
virtual_source_nat_vrfs:
- name: VRF10
  ip_address: 10.255.10.2
vlan_interfaces:
- name: Vlan11
  description: VRF10_VLAN11
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.11.1/24
  metadata:
    tenants:
    - TENANT1
- name: Vlan12
  description: VRF10_VLAN12
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.12.1/24
  metadata:
    tenants:
    - TENANT1
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 11
  name: VRF10_VLAN11
  metadata:
    tenants:
    - TENANT1
- id: 12
  name: VRF10_VLAN12
  metadata:
    tenants:
    - TENANT1
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF10
  ip_routing: true
  metadata:
    tenants:
    - TENANT1
vxlan_interface:
  vxlan1:
    description: custom-templates-ipv6-numbered-l3leaf1b_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      encapsulations:
        ipv6: true
      vlans:
      - id: 11
        vni: 10011
      - id: 12
        vni: 10012
      vrfs:
      - name: VRF10
        vni: 10
