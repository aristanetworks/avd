- name: Ethernet2
  shutdown: false
  peer_type: network_port
  switchport:
    enabled: true
hostname: digital.twin.ethernet.ports.2
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.3.130/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.3.145/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.169.3.2/32
  type: oob
metadata:
  is_deployed: true
  fabric_name: DIGITAL_TWIN
mlag_configuration:
  domain_id: NODE_GROUP_A
  local_interface: Vlan4094
  peer_address: 192.168.3.96
  peer_link: Port-Channel4
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel4
  description: MLAG_digital-twin-ethernet-ports-1_Port-Channel4
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.3.128/28 eq 32
  - sequence: 20
    action: permit 192.168.3.144/28 eq 32
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65001'
  router_id: 192.168.3.130
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    type: ipv4
    remote_as: '65001'
    description: digital-twin-ethernet-ports-1
    next_hop_self: true
    send_community: all
    maximum_routes: 12000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 192.168.3.80
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    peer: digital-twin-ethernet-ports-1
    description: digital-twin-ethernet-ports-1_Vlan4093
  - ip_address: 192.168.3.114
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: digital-twin-ethernet-ports-1
    description: digital-twin-ethernet-ports-1_Ethernet3
  - ip_address: 192.168.3.166
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: digital-twin-ethernet-ports-1
    description: digital-twin-ethernet-ports-1
  - ip_address: 192.168.3.168
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: digital-twin-ethernet-ports-1
    description: digital-twin-ethernet-ports-1
  - ip_address: 192.168.3.170
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: digital-twin-ethernet-ports-1
    description: digital-twin-ethernet-ports-1
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: TENANT_A_VRF_A
    rd: 192.168.3.130:1025
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 1025:1025
      export:
      - address_family: evpn
        route_targets:
        - 1025:1025
    router_id: 192.168.3.130
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 192.168.3.81/31
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 192.168.3.97/31
  mtu: 9214
  no_autostate: true
- name: Vlan1
  description: TENANT_A_VRF_A_SVI_A
  shutdown: false
  vrf: TENANT_A_VRF_A
  tenant: TENANT_A
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  tenant: system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  tenant: system
- id: 1
  name: TENANT_A_VRF_A_SVI_A
  tenant: TENANT_A
vrfs:
- name: MGMT
  ip_routing: false
- name: TENANT_A_VRF_A
  ip_routing: true
  tenant: TENANT_A
vxlan_interface:
  vxlan1:
    description: digital.twin.ethernet.ports.2_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
      vrfs:
      - name: TENANT_A_VRF_A
        vni: 1025
