- name: Ethernet5
  description: MLAG_digital-twin-ethernet-ports-1_Ethernet5
  shutdown: false
  channel_group:
    id: 4
    mode: active
  peer: digital-twin-ethernet-ports-1
  peer_interface: Ethernet5
  peer_type: mlag_peer
- name: Ethernet3
  description: P2P_digital-twin-ethernet-ports-1_Ethernet3
  shutdown: false
  mtu: 9214
  ip_address: 192.168.3.115/31
  peer: digital-twin-ethernet-ports-1
  peer_interface: Ethernet3
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet11
  description: P2P_digital-twin-ethernet-ports-1_Ethernet11
  shutdown: false
  mtu: 9214
  ip_address: 192.168.3.167/31
  peer: digital-twin-ethernet-ports-1
  peer_interface: Ethernet11
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet11.100
  description: P2P_digital-twin-ethernet-ports-1_Ethernet11.100
  shutdown: false
  mtu: 9214
  ip_address: 192.168.3.169/31
  peer: digital-twin-ethernet-ports-1
  peer_interface: Ethernet11.100
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet11.101
  description: P2P_digital-twin-ethernet-ports-1_Ethernet11.101
  shutdown: false
  mtu: 9214
  ip_address: 192.168.3.171/31
  peer: digital-twin-ethernet-ports-1
  peer_interface: Ethernet11.101
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet10.100
  shutdown: false
  vrf: TENANT_A_VRF_A
  encapsulation_dot1q:
    vlan: 100
  ip_address: 192.168.3.162/31
  peer_type: l3_interface
- name: Ethernet10.101
  shutdown: false
  vrf: TENANT_A_VRF_A
  encapsulation_dot1q:
    vlan: 101
