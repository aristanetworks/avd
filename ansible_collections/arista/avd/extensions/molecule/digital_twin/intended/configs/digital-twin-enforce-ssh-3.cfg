!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname digital-twin-enforce-ssh-3
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.8/32
no ip routing vrf MGMT
!
management ssh
   ip access-group ssh_mgmt_ipv4_acl_in vrf MGMT in
   ip access-group ssh_default_ipv4_acl_in in
   ipv6 access-group ssh_mgmt_ipv6_acl_in vrf MGMT in
   ipv6 access-group ssh_default_ipv6_acl_in in
   !
   vrf MGMT
      no shutdown
   !
   vrf default
      no shutdown
!
end
