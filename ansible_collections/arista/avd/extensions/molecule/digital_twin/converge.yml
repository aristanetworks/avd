---
- name: Converge
  hosts: DIGITAL_TWIN
  gather_facts: false
  connection: local
  tasks:
    - name: Generate intended variables
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

- name: Clear facts between regular and Digital Twin plays so that facts set by the first run are not picked by the second
  hosts: DIGITAL_TWIN
  gather_facts: false
  tasks:
    - name: Clear facts between plays
      ansible.builtin.meta: clear_facts

- name: Converge
  hosts: DIGITAL_TWIN
  gather_facts: false
  connection: local
  vars:
    output_dir_name: "digital_twin/intended"
    documentation_dir_name: "digital_twin/documentation"
    avd_digital_twin_mode: true
  tasks:
    - name: Generate intended variables in ACT Digital Twin mode
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

- name: Converge
  hosts: DIGITAL_TWIN_SINGLE_SWITCH_FABRIC
  gather_facts: false
  connection: local
  vars:
    output_dir_name: "digital_twin/intended"
    documentation_dir_name: "digital_twin/documentation"
    avd_digital_twin_mode: true
    # Disable generation of the documentation to avoid duplicated artifacts breaking pytests
    eos_designs_documentation:
      enable: false
      topology_csv: false
      p2p_links_csv: false
  tasks:
    - name: Generate intended variables in ACT Digital Twin mode
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.eos_designs
