---
# Test enabling SSH in the default VRF in ACT Digital Twin mode when the default VRF is disabled.
type: l2leaf

l2leaf:
  nodes:
    - name: digital-twin-enforce-ssh-4
      id: 1
      mgmt_ip: 192.168.0.9/32

digital_twin:
  environment: act
  fabric:
    act_ensure_ssh_access: true

ssh_settings:
  vrfs:
    - name: default
      enabled: false
