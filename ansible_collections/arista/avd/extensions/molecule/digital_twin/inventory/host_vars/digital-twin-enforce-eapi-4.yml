---
# Test enabling eAPI and removal of the IPv4 ACL (in the default VRF) in ACT Digital Twin mode when eAPI in default VRF is initially disabled and has IPv4 ACL.
type: l2leaf

l2leaf:
  nodes:
    - name: digital-twin-enforce-eapi-4
      id: 1
      mgmt_ip: 192.168.0.4/32

digital_twin:
  environment: act
  fabric:
    act_ensure_eapi_access: true

management_eapi:
  enabled: true
  enable_http: true
  vrfs:
    - name: default
      enabled: false
      ipv4_acl: eapi_ipv4_acl_in
      ipv6_acl: eapi_ipv6_acl_in
