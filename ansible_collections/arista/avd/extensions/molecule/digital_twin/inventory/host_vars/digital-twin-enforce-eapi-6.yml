---
# Test removal of the default VRF eAPI IPv4 standard ACL reference while retaining its definition in ACT Digital Twin mode.
type: l2leaf

l2leaf:
  nodes:
    - name: digital-twin-enforce-eapi-6
      id: 1
      mgmt_ip: 192.168.0.6/32

digital_twin:
  environment: act
  fabric:
    act_ensure_eapi_access: true

management_eapi:
  enabled: true
  enable_http: true
  vrfs:
    - name: default
      enabled: true
      ipv4_standard_acl: eapi_ipv4_acl_in
      ipv6_acl: eapi_ipv6_acl_in

ipv4_standard_acls:
  - name: eapi_ipv4_acl_in
    entries:
      - action: permit
        source: 192.0.2.0/24
