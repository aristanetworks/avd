---
# Test removal of the default VRF SSH IPv4 ACL while preserving IPv6 and non-default VRF ACLs in ACT Digital Twin mode.
type: l2leaf

l2leaf:
  nodes:
    - name: digital-twin-enforce-ssh-3
      id: 1
      mgmt_ip: 192.168.0.8/32

digital_twin:
  environment: act
  fabric:
    act_ensure_ssh_access: true

ssh_settings:
  vrfs:
    - name: default
      enabled: true
      ipv4_acl: ssh_default_ipv4_acl_in
      ipv6_acl: ssh_default_ipv6_acl_in
    - name: MGMT
      enabled: true
      ipv4_acl: ssh_mgmt_ipv4_acl_in
      ipv6_acl: ssh_mgmt_ipv6_acl_in
