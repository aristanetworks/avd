---
# Test that act_cv_instance overrides daemon_terminattr.cvaddrs in ACT Digital Twin mode.
type: l2leaf

l2leaf:
  nodes:
    - name: digital-twin-cv-instance-1
      id: 1
      mgmt_ip: 192.168.1.10/32
      mgmt_gateway: 192.168.1.254

digital_twin:
  environment: act
  fabric:
    act_cv_instance: 10.20.30.40:9910

cv_settings:
  onprem_clusters:
    - name: production
      servers:
        - name: 192.168.200.11

ntp_settings:
  servers:
    - name: 0.pool.ntp.org
