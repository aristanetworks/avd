---
# Test enabling eAPI (in the default VRF) in ACT Digital Twin mode when eAPI is initially disabled globally.
type: l2leaf

l2leaf:
  nodes:
    - name: digital-twin-enforce-eapi-1
      id: 1
      mgmt_ip: 192.168.0.1/32

digital_twin:
  environment: act
  fabric:
    act_ensure_eapi_access: true
    act_cv_instance: cv-dev.example.com:443

management_eapi:
  enabled: false
