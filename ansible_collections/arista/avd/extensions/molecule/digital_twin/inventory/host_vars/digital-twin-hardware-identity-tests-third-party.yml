---
type: l2leaf

# Verify ACT omits serial_number, system_mac_address, and ztp for third-party nodes even when configured.
# The production system MAC must remain available for EOS calculations such as the SNMPv3 EngineID.
l2leaf:
  nodes:
    - name: digital-twin-hardware-identity-tests-third-party
      id: 1
      platform: hardware-identity-third-party
      mgmt_ip: 192.168.10.13/32
      serial_number: PROD-THIRD-PARTY-SERIAL
      system_mac_address: 02:1c:73:00:00:13
      digital_twin:
        serial_number: DTTHIRDPARTYSERIAL
        system_mac_address: 02:1c:73:00:10:13

custom_platform_settings:
  - platforms:
      - hardware-identity-third-party
    digital_twin:
      act_node_type: third-party

digital_twin:
  fabric:
    serial_number: "{serial_number}"
    system_mac_address: "{system_mac_address}"
    ztp: true

snmp_settings:
  compute_local_engineid: true
  compute_local_engineid_source: system_mac
