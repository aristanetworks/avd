!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname digital.twin.ethernet.ports.2
!
no spanning-tree vlan-id 4093-4094
!
vlan 1
   name TENANT_A_VRF_A_SVI_A
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance TENANT_A_VRF_A
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel4
   description MLAG_digital-twin-ethernet-ports-1_Port-Channel4
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel9
   description FIREWALL_firewall-1
   no shutdown
   switchport
   mlag 9
!
interface Port-Channel14
   description P2P_digital-twin-ethernet-ports-1_Port-Channel14
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.3.199/31
!
interface Port-Channel15
   description P2P_external-device-4_Port-Channel15
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.3.202/31
!
interface Port-Channel16
   no shutdown
   switchport
   mlag 16
!
interface Port-Channel17
   no shutdown
   no switchport
   vrf TENANT_A_VRF_A
   ip address 192.168.3.178/31
!
interface Port-Channel17.100
   no shutdown
   encapsulation dot1q vlan 100
   vrf TENANT_A_VRF_A
   ip address 192.168.3.180/31
!
interface Port-Channel18
   no shutdown
   no switchport
   vrf TENANT_A_VRF_A
   ip address 192.168.3.182/31
