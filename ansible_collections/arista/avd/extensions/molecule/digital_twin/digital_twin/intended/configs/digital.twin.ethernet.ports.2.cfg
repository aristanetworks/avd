   no shutdown
   switchport
!
interface Ethernet2
   no shutdown
   switchport
!
interface Ethernet3
   description P2P_digital-twin-ethernet-ports-1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.3.115/31
!
interface Ethernet4
   description MLAG_digital-twin-ethernet-ports-1_Ethernet4
   no shutdown
   channel-group 4 mode active
!
interface Ethernet5
   description MLAG_digital-twin-ethernet-ports-1_Ethernet5
   no shutdown
   channel-group 4 mode active
!
interface Ethernet9
   description FIREWALL_firewall-1_Eth4
   no shutdown
   channel-group 9 mode active
!
interface Ethernet10
   no shutdown
   no switchport
   vrf TENANT_A_VRF_A
   ip address 192.168.3.170/31
!
interface Ethernet10.100
   no shutdown
   encapsulation dot1q vlan 100
   vrf TENANT_A_VRF_A
   ip address 192.168.3.162/31
