!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname digital.twin.ethernet.ports.2
!
no spanning-tree vlan-id 4093-4094
!
vlan 1
   name TENANT_A_VRF_A_SVI_A
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance TENANT_A_VRF_A
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel4
   description MLAG_digital-twin-ethernet-ports-1_Port-Channel4
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description FIREWALL_firewall-1_Eth2
   no shutdown
   switchport
!
interface Ethernet2
   no shutdown
   switchport
!
interface Ethernet3
   description P2P_digital-twin-ethernet-ports-1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.3.115/31
!
interface Ethernet4
   description MLAG_digital-twin-ethernet-ports-1_Ethernet4
   no shutdown
   channel-group 4 mode active
!
interface Ethernet5
   description MLAG_digital-twin-ethernet-ports-1_Ethernet5
   no shutdown
   channel-group 4 mode active
!
interface Ethernet10
   no shutdown
   no switchport
   vrf TENANT_A_VRF_A
   ip address 192.168.3.165/31
!
interface Ethernet10.100
   no shutdown
   encapsulation dot1q vlan 100
   vrf TENANT_A_VRF_A
   ip address 192.168.3.162/31
!
interface Ethernet10.101
   no shutdown
   encapsulation dot1q vlan 101
   vrf TENANT_A_VRF_A
   ip address 192.168.3.163/31
!
interface Ethernet11
   description P2P_digital-twin-ethernet-ports-1_Ethernet11
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.3.167/31
!
interface Ethernet11.100
   description P2P_digital-twin-ethernet-ports-1_Ethernet11.100
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.3.169/31
!
interface Ethernet11.101
   description P2P_digital-twin-ethernet-ports-1_Ethernet11.101
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.3.171/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.3.130/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.3.145/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.169.3.2/32
!
interface Vlan1
   description TENANT_A_VRF_A_SVI_A
   no shutdown
   vrf TENANT_A_VRF_A
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 192.168.3.81/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 192.168.3.97/31
!
interface Vxlan1
   description digital.twin.ethernet.ports.2_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vrf TENANT_A_VRF_A vni 1025
!
ip routing
no ip routing vrf MGMT
ip routing vrf TENANT_A_VRF_A
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.3.128/28 eq 32
   seq 20 permit 192.168.3.144/28 eq 32
!
mlag configuration
   domain-id NODE_GROUP_A
   local-interface Vlan4094
   peer-address 192.168.3.96
   peer-link Port-Channel4
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.168.3.130
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65001
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description digital-twin-ethernet-ports-1
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 12000
   neighbor 192.168.3.80 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 192.168.3.80 description digital-twin-ethernet-ports-1_Vlan4093
   neighbor 192.168.3.114 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.3.114 remote-as 65001
   neighbor 192.168.3.114 description digital-twin-ethernet-ports-1_Ethernet3
   neighbor 192.168.3.166 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.3.166 remote-as 65001
   neighbor 192.168.3.166 description digital-twin-ethernet-ports-1
   neighbor 192.168.3.168 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.3.168 remote-as 65001
   neighbor 192.168.3.168 description digital-twin-ethernet-ports-1
   neighbor 192.168.3.170 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.3.170 remote-as 65001
   neighbor 192.168.3.170 description digital-twin-ethernet-ports-1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf TENANT_A_VRF_A
      rd 192.168.3.130:1025
      route-target import evpn 1025:1025
      route-target export evpn 1025:1025
      router-id 192.168.3.130
      redistribute connected
!
end
