!
interface Ethernet4
   description MLAG_digital.twin.ethernet.ports.2_Ethernet4
   no shutdown
   channel-group 4 mode active
!
interface Ethernet5
   description MLAG_digital.twin.ethernet.ports.2_Ethernet5
   no shutdown
   channel-group 4 mode active
!
interface Ethernet6
