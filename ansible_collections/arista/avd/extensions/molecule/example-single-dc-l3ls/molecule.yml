---
ansible:
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=../../../examples/single-dc-l3ls/inventory.yml
  env:
    ANSIBLE_FORCE_COLOR: true
  cfg:
    defaults:
      jinja2_extensions: jinja2.ext.loopcontrols,jinja2.ext.do,jinja2.ext.i18n
      duplicate_dict_key: error

dependency:
  name: galaxy
  enabled: false

scenario:
  test_sequence:
    - converge
    - idempotence

verifier:
  name: ansible
