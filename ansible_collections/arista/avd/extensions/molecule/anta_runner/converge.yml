---
- name: Converge
  hosts: FABRIC
  gather_facts: false
  vars:
    root_dir: "{{ playbook_dir }}"
  tasks:
    - name: Generate AVD Structured Configurations and Fabric Documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: ANTA Default Run
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        anta_runner_dry_run: true
        avd_catalogs_dir: "{{ root_dir }}/anta/avd_catalogs/default_run"
        anta_reports_dir: "{{ root_dir }}/anta/reports/default_run"
      run_once: true

    - name: ANTA Filtered Run
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        anta_runner_dry_run: true
        avd_catalogs_dir: "{{ root_dir }}/anta/avd_catalogs/filtered_run"
        anta_reports_dir: "{{ root_dir }}/anta/reports/filtered_run"
        # When a device is part of multiple filters, the last filter will be applied so the order is important
        avd_catalogs_filters:
          # Skip VerifyNTP for all devices
          - skip_tests:
              - VerifyNTP
          # Only VerifyReachability will run on DC1_SVC_LEAVES devices
          - device_list: "{{ groups['DC1_SVC_LEAVES'] }}"
            run_tests:
              - VerifyReachability
          # Skip tests take precedence over run_tests
          # No test will run on DC2_SPINES devices
          - device_list: "{{ groups['DC2_SPINES'] }}"
            run_tests:
              - VerifyLLDPNeighbors
            skip_tests:
              - VerifyLLDPNeighbors
      run_once: true

    - name: ANTA User-Defined Catalogs Run
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        anta_runner_dry_run: true
        avd_catalogs_enabled: false
        user_catalogs_enabled: true
        anta_reports_dir: "{{ root_dir }}/anta/reports/user_defined_catalogs_run"
      run_once: true

    - name: ANTA User-Defined Catalogs Run with Tags and Markdown Granularity
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        anta_runner_dry_run: true
        avd_catalogs_enabled: false
        user_catalogs_enabled: true
        anta_reports_dir: "{{ root_dir }}/anta/reports/user_defined_catalogs_with_tags_run"
        anta_report_expand_results: true
        anta_report_custom_field: true
        anta_runner_tags: ["border_leaf"]
      run_once: true

    - name: ANTA Extra Validation Run with Filtered Report
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        anta_runner_dry_run: true
        # Keeping the same directory names below to easily see the diffs in molecule artifacts
        # To be changed in a separate PR
        avd_catalogs_dir: "{{ root_dir }}/anta/avd_catalogs/default_run_filtered_report"
        anta_reports_dir: "{{ root_dir }}/anta/reports/default_run_filtered_report"
        anta_report_exclude_statuses: ["unset"]
        avd_catalogs_extra_fabric_validation: true
      run_once: true

    - name: ANTA Default Run with Sorted Report
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        anta_runner_dry_run: true
        avd_catalogs_dir: "{{ root_dir }}/anta/avd_catalogs/default_run_sorted_report"
        anta_reports_dir: "{{ root_dir }}/anta/reports/default_run_sorted_report"
        # Same test name on same device will be sorted by the custom field or description
        anta_report_sort_fields: ["test", "categories", "device", "custom_field", "description"]
      run_once: true
