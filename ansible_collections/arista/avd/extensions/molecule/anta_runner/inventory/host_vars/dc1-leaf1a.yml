# Test the new anta_ variables for connection settings
anta_user: anta
anta_password: anta
anta_enable_mode: true
anta_enable_password: anta
anta_port: 443
anta_use_ssl: true

# Overriding the default behavior for storm-control feature for `vEOS-lab` platform to test the storm-control tests.
platform_settings:
  - platforms: [vEOS-lab]
    feature_support:
      bgp_update_wait_for_convergence: false
      bgp_update_wait_install: false
      interface_storm_control: true
      queue_monitor_length_notify: false
      evpn_gateway_all_active_multihoming: true
    reload_delay:
      mlag: 300
      non_mlag: 330
    digital_twin:
      act_node_type: veos

# Custom router bgp structured_config to test external BGP peer
custom_structured_configuration_router_bgp:
  neighbors:
    - ip_address: 10.1.1.1
      description: External peer
      peer_group: EVPN-OVERLAY-PEERS
  neighbor_interfaces:
    - name: Ethernet1
      remote_as: "577"

# Custom router path selection structured_config to test negative case for STUN client test case
custom_structured_configuration_router_path_selection:
  path_groups:
    - name: Test_local_interface
      id: 110
      dynamic_peers:
        enabled: true
    - name: Test_stun_server_profile
      id: 210
      local_interfaces:
        - name: Ethernet3

# Custom router adaptive virtual topology structured_config to test skip the anta test VerifyAVTSpecificPath for empty static peers
custom_structured_configuration_router_adaptive_virtual_topology:
  topology_role: edge

# Custom inputs for the hardware tests
accepted_xcvr_manufacturers:
  - "Arastra, Inc."
  - "Arista Networks"
  - "Generic"

accepted_pwr_supply_states:
  - "ok"
  - "Not Present"

accepted_fan_states:
  - "ok"
  - "Not Present"
