# Test for not generating the avt, router path selection and security test when router ip is ipv6 address
custom_structured_configuration_router_path_selection:
  path_groups:
    - name: mpls
      static_peers:
        - router_ip: "1:1:1:1:1:1:1:1"
          name: dc1-leaf1a
          ipv4_addresses:
            - 172.18.1.2

# Custom vxlan structured_config to validate that the vxlan interface is skipped when using ipv6 encapsulation in combination with dps source interface
custom_structured_configuration_vxlan_interface:
  vxlan1:
    description: dc1-leaf1c_VTEP
    vxlan:
      source_interface: Dps1
      udp_port: 4789
      encapsulations:
        ipv6: true
