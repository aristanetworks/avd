management_security:
  ssl_profiles:
  - name: STUN-DTLS
    tls_versions: '1.2'
    trust_certificate:
      certificates:
      - aristaDeviceCertProvisionerDefaultRootCA.crt
    certificate:
      file: STUN-DTLS.crt
      key: STUN-DTLS.key
metadata:
  is_deployed: true
  dc_name: DC1
  fabric_name: FABRIC
  cv_tags:
    device_tags:
    - name: Role
      value: edge
    - name: Region
      value: Global
    - name: Zone
      value: Global-ZONE
    - name: Site
      value: DC1
    interface_tags:
    - interface: Ethernet1
      tags:
      - name: Type
        value: lan
    - interface: Ethernet2
      tags:
      - name: Type
        value: lan
    - interface: Ethernet13
      tags:
      - name: Type
        value: wan
      - name: Carrier
        value: mpls-sp-1
      - name: Circuit
        value: DC1-MPLS-5
  cv_pathfinder:
    role: edge
    region: Global
    zone: Global-ZONE
    site: DC1
    vtep_ip: 10.255.1.3
    ssl_profile: STUN-DTLS
    pathfinders:
    - vtep_ip: 10.255.255.10
    - vtep_ip: 10.255.255.20
    interfaces:
    - name: Ethernet13
      carrier: mpls-sp-1
      circuit_id: DC1-MPLS-5
      pathgroup: mpls
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.2.0/27 eq 32
- name: PL-DPS-WAN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.1.3/32 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
    set:
    - extcommunity soo 10.255.2.3:100 additive
  - sequence: 80
    type: permit
    match:
    - ip address prefix-list PL-DPS-WAN-OVERLAY
- name: RM-BGP-UNDERLAY-PEERS-IN
  sequence_numbers:
  - sequence: 40
    type: permit
    description: Mark prefixes originated from the LAN
    set:
    - extcommunity soo 10.255.2.3:100 additive
- name: RM-EVPN-SOO-IN
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - extcommunity ECL-EVPN-SOO
  - sequence: 20
    type: permit
- name: RM-EVPN-SOO-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    set:
    - extcommunity soo 10.255.2.3:100 additive
- name: RM-EVPN-EXPORT-VRF-DEFAULT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - extcommunity ECL-EVPN-SOO
router_adaptive_virtual_topology:
  topology_role: edge
  gateway_vxlan: true
  region:
    name: Global
    id: 1
  zone:
    name: Global-ZONE
    id: 1
  site:
    name: DC1
    id: 100
  profiles:
  - name: DEFAULT-POLICY-CONTROL-PLANE
    load_balance_policy: LB-DEFAULT-POLICY-CONTROL-PLANE
  - name: DEFAULT-POLICY-DEFAULT
    load_balance_policy: LB-DEFAULT-POLICY-DEFAULT
  policies:
  - name: DEFAULT-POLICY-WITH-CP
    matches:
    - application_profile: APP-PROFILE-CONTROL-PLANE
      avt_profile: DEFAULT-POLICY-CONTROL-PLANE
    - application_profile: default
      avt_profile: DEFAULT-POLICY-DEFAULT
  vrfs:
  - name: default
    policy: DEFAULT-POLICY-WITH-CP
    profiles:
    - name: DEFAULT-POLICY-CONTROL-PLANE
      id: 254
    - name: DEFAULT-POLICY-DEFAULT
      id: 1
router_bfd:
