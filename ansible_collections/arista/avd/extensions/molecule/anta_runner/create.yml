---
- name: Configure local folders
  hosts: FABRIC
  gather_facts: false
  connection: local
  vars:
    root_dir: "{{ playbook_dir }}"
    build_output_folders_root_dir: "{{ playbook_dir }}"
    build_output_folders_avd_catalogs_dir: "{{ playbook_dir }}/anta/avd_catalogs"
    build_output_folders_anta_reports_dir: "{{ playbook_dir }}/anta/reports"
  tasks:
    - name: Create local output folders
      delegate_to: 127.0.0.1
      ansible.builtin.import_role:
        name: arista.avd.build_output_folders
      run_once: true

    - name: Create ANTA subfolders for different runs
      delegate_to: 127.0.0.1
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0o775"
      loop:
        - "{{ build_output_folders_avd_catalogs_dir }}/default_run"
        - "{{ build_output_folders_avd_catalogs_dir }}/filtered_run"
        - "{{ build_output_folders_avd_catalogs_dir }}/default_run_filtered_report"
        - "{{ build_output_folders_avd_catalogs_dir }}/default_run_sorted_report"
        - "{{ build_output_folders_anta_reports_dir }}/default_run"
        - "{{ build_output_folders_anta_reports_dir }}/filtered_run"
        - "{{ build_output_folders_anta_reports_dir }}/user_defined_catalogs_run"
        - "{{ build_output_folders_anta_reports_dir }}/user_defined_catalogs_with_tags_run"
        - "{{ build_output_folders_anta_reports_dir }}/default_run_filtered_report"
        - "{{ build_output_folders_anta_reports_dir }}/default_run_sorted_report"
      run_once: true
