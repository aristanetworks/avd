---
# Test for global 802.1X enabled with default values
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-1
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        cleartext_key: super-secret-key

port_profiles:
  - profile: DOT1X_MAC_BASED_ACCESS_LIST
    dot1x:
      mac_based_access_list: true

servers:
  - name: DOT1X_SERVER
    adapters:
      - switches: [dot1x-settings-1]
        switch_ports: [Ethernet1]
        endpoint_ports: [Eth0]
        dot1x:
          mac_based_access_list: true

network_ports:
  - switches: [dot1x-settings-1]
    switch_ports: [Ethernet2]
    dot1x:
      mac_based_access_list: true
  - switches: [dot1x-settings-1]
    switch_ports: [Ethernet3]
    profile: DOT1X_MAC_BASED_ACCESS_LIST
