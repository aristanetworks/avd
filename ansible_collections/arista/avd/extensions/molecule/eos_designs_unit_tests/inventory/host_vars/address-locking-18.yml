---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
    mgmt_ip: 1.1.10.10
  nodes:
    - name: address-locking-18
      id: 101
      bgp_as: 101

# Testing that IPv4-specific settings (dhcp_servers_ipv4, local_interface) are not rendered when only IPv6 address locking is requested while
# only_configure_address_locking_when_used is set to true.
avd_design_future:
  only_configure_address_locking_when_used: true

address_locking_settings:
  dhcp_servers_ipv4:
    - 192.0.2.1
  local_interface: use_default_mgmt_method_interface

servers:
  - name: ADDRESS_LOCKING_18_SERVER
    adapters:
      - switches: [address-locking-18]
        switch_ports: [Ethernet2]
        mode: access
        vlans: 101
        address_locking:
          ipv6: true
