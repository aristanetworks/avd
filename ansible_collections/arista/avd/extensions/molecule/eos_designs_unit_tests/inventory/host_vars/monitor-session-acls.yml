---
# Test IPv4 extended, IPv4 standard, IPv6 and MAC ACLs at monitor-session source and session scope.
type: l2leaf
avd_design_future:
  raise_for_missing_monitor_session_acls: true
l2leaf:
  nodes:
    - name: monitor-session-acls
      mgmt_ip: 192.168.0.2/24

ipv4_acls:
  - name: MONITOR-IPV4
    entries:
      - sequence: 10
        action: permit
        protocol: ip
        source: 192.0.2.0/24
        destination: any
  - name: UNUSED-IPV4
    entries:
      - action: deny
        protocol: ip
        source: any
        destination: any

ipv4_standard_acls:
  - name: MONITOR-IPV4-STANDARD
    entries:
      - sequence: 10
        action: permit
        source: 198.51.100.0/24
  - name: UNUSED-IPV4-STANDARD
    entries:
      - action: deny
        source: any

ipv6_acls:
  - name: MONITOR-IPV6
    entries:
      - sequence: 10
        action: permit
        protocol: ipv6
        source: 2001:db8::/64
        destination: any
  - name: UNUSED-IPV6
    entries:
      - action: deny
        protocol: ipv6
        source: any
        destination: any

mac_acls:
  - name: MONITOR-MAC
    entries:
      - sequence: 10
        action: permit
        source: any
        destination: any
  - name: UNUSED-MAC
    entries:
      - action: deny
        source: any
        destination: any

network_ports:
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet1-2]
    # Reuse the source ACL on two interfaces to verify deduplication and priority.
    monitor_sessions:
      - name: IPV4-SOURCE
        role: source
        source_settings:
          direction: rx
          access_group:
            type: ip
            name: MONITOR-IPV4
            priority: 5
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet3]
    monitor_sessions:
      - name: IPV4-STANDARD-SOURCE
        role: source
        source_settings:
          direction: tx
          access_group:
            type: ipv4_standard
            name: MONITOR-IPV4-STANDARD
            priority: 10
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet4]
    monitor_sessions:
      - name: IPV4-SESSION
        role: source
        session_settings:
          access_group:
            type: ip
            name: MONITOR-IPV4
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet5]
    monitor_sessions:
      - name: IPV4-STANDARD-SESSION
        role: source
        session_settings:
          access_group:
            type: ipv4_standard
            name: MONITOR-IPV4-STANDARD
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet6]
    monitor_sessions:
      - name: IPV4-SOURCE
        role: destination
      - name: IPV4-STANDARD-SOURCE
        role: destination
      - name: IPV4-SESSION
        role: destination
      - name: IPV4-STANDARD-SESSION
        role: destination
      - name: IPV6-SOURCE
        role: destination
      - name: IPV6-SESSION
        role: destination
      - name: MAC-SOURCE
        role: destination
      - name: MAC-SESSION
        role: destination
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet7]
    monitor_sessions:
      - name: IPV6-SOURCE
        role: source
        source_settings:
          direction: rx
          access_group:
            type: ipv6
            name: MONITOR-IPV6
            priority: 15
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet8]
    monitor_sessions:
      - name: IPV6-SESSION
        role: source
        session_settings:
          access_group:
            type: ipv6
            name: MONITOR-IPV6
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet9]
    monitor_sessions:
      - name: MAC-SOURCE
        role: source
        source_settings:
          direction: rx
          access_group:
            type: mac
            name: MONITOR-MAC
            priority: 20
  - switches: [monitor-session-acls]
    switch_ports: [Ethernet10]
    monitor_sessions:
      - name: MAC-SESSION
        role: source
        session_settings:
          access_group:
            type: mac
            name: MONITOR-MAC
