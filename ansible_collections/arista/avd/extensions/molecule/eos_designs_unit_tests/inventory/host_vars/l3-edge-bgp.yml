type: spine
spine:
  nodes:
    - name: l3-edge-bgp
      ptp:
        enabled: true
      id: 1
      evpn_role: "none"
      loopback_ipv4_pool: 1.2.3.4/24
      bgp_as: 65000

l3_edge:
  p2p_links_profiles:
    - name: profile1
      ip_pool: pool1
      speed: "forced 10000full"
      mtu: 2000
      bfd: true
      ptp:
        enabled: true
      qos_profile: TEST-QOS-PROFILE
      macsec_profile: TEST-MACSEC-PROFILE
      ethernet_structured_config:
        service_policy:
          qos:
            input: TEST_POLICY
      raw_eos_cli: |
        ! TEST RAW_EOS_CLI

  p2p_links_ip_pools:
    - name: pool1
      ipv4_pool: 192.168.0.0/24
    - name: ipv6_pool
      ipv6_pool: 2001:db8:1000::/64
    - name: dual_stack_pool
      ipv4_pool: 192.168.100.0/24
      ipv6_pool: 2001:db8:2000::/64

  p2p_links:
    # P2P link without routing. Settings set via profile
    - nodes: [l3-edge-bgp, peer1]
      interfaces: [ethernet1, ethernet1]
      id: 1
      profile: profile1
      include_in_underlay_protocol: false

      # P2P link with underlay routing and IP set manually, and ipv6_enabled.
    - nodes: [l3-edge-bgp, peer2]
      interfaces: [ethernet2, ethernet2]
      ip: [192.168.0.2/31, 192.168.0.3/31]
      as: [65000, 65002]
      ipv6_enable: true

      # P2P link with underlay routing and IP set as subnet.
    - nodes: [l3-edge-bgp, peer3]
      interfaces: [ethernet3, ethernet3]
      subnet: 192.168.0.4/31
      as: [65000, 65003]

      # P2P link with underlay routing and IP set via ip_pool and id.
      # Descriptions set manually
    - nodes: [l3-edge-bgp, peer4]
      interfaces: [ethernet4, ethernet4]
      ip_pool: pool1
      id: 4
      as: [65000, 65004]
      descriptions:
        [
          "Custom description on l3-edge-bgp eth4",
          "Custom description on peer4 eth4",
        ]

    # P2P link with Port-Channel with underlay routing and and IP set manually.
    - nodes: [l3-edge-bgp, peer5]
      ip: [192.168.0.8/31, 192.168.0.9/31]
      as: [65000, 65005]
      port_channel:
        mode: active
        nodes_child_interfaces:
          - node: l3-edge-bgp
            interfaces: [Ethernet5, Ethernet6]
          - node: peer5
            interfaces: [Ethernet5, Ethernet6]
      include_in_underlay_protocol: true

    # P2P link with Port-Channel with underlay routing and IP set via ip_pool and id.
    - nodes: [l3-edge-bgp, peer6]
      ip_pool: pool1
      id: 6
      as: [65000, 65006]
      port_channel:
        mode: active
        description: Custom port-channel description
        nodes_child_interfaces:
          - node: l3-edge-bgp
            interfaces: [Ethernet7, Ethernet8]
          - node: peer6
            interfaces: [Ethernet7, Ethernet8]
      include_in_underlay_protocol: true

    # P2P link with Port-Channel with underlay routing and IP set via ip_pool and id.
    - nodes: [l3-edge-bgp, peer7]
      ip_pool: pool1
      id: 7
      as: [65000, 65006]
      port_channel:
        mode: active
        nodes_child_interfaces:
          - node: l3-edge-bgp
            interfaces: [Ethernet9, Ethernet10]
          - node: peer7
            interfaces: [Ethernet9, Ethernet10]

    # P2P link port-channel and ethernet structured config.
    - nodes: [l3-edge-bgp, peer7]
      id: 8
      ip_pool: pool1
      as: [65000, 65006]
      port_channel:
        mode: active
        nodes_child_interfaces:
          - node: l3-edge-bgp
            interfaces: [Ethernet11, Ethernet12]
          - node: peer7
            interfaces: [Ethernet11, Ethernet12]
      port_channel_structured_config:
        description: Description set via port_channel_structured_config(l3_edge)
      ethernet_structured_config:
        description: Description set via ethernet_structured_config(l3_edge)

    # Dual-stack link (IPv4 + IPv6 from pool) with include_in_underlay_protocol: true.
    # Expects: BGP neighbor created for IPv4, interface has both IPv4 and IPv6 addresses.
    - nodes: [l3-edge-bgp, peer-ipv6-1]
      interfaces: [Ethernet13, Ethernet1]
      ip_pool: dual_stack_pool
      id: 1
      as: [65000, 65101]
      include_in_underlay_protocol: true

    # IPv6-only link (from pool) with include_in_underlay_protocol: true.
    # Expects: No BGP neighbor (IPv6-only skips underlay), interface has IPv6 only, ipv6_unicast_routing enabled.
    - nodes: [l3-edge-bgp, peer-ipv6-2]
      interfaces: [Ethernet14, Ethernet1]
      ip_pool: ipv6_pool
      id: 1
      as: [65000, 65102]
      include_in_underlay_protocol: true

    # IPv6-only link (addresses set manually) with include_in_underlay_protocol: true.
    # Expects: Same as above.
    - nodes: [l3-edge-bgp, peer-ipv6-3]
      interfaces: [Ethernet15, Ethernet1]
      ipv6: ["2001:db8:3000::1/127", "2001:db8:3000::2/127"]
      as: [65000, 65103]
      include_in_underlay_protocol: true

    # IPv6-only link with include_in_underlay_protocol: false
    # Expects: No BGP neighbor, interface has IPv6 only, ipv6_unicast_routing enabled.
    - nodes: [l3-edge-bgp, peer-ipv6-4]
      interfaces: [Ethernet16, Ethernet1]
      ipv6: ["2001:db8:4000::1/127", "2001:db8:4000::2/127"]
      include_in_underlay_protocol: false

    # Dual-stack with ipv6_prefix key (manual IPv6, pool IPv4)
    # Expects: BGP neighbor for IPv4, both addresses on interface.
    - nodes: [l3-edge-bgp, peer-ipv6-5]
      interfaces: [Ethernet17, Ethernet1]
      ip_pool: pool1
      id: 10
      ipv6_prefix: "2001:db8:5000::/127"
      as: [65000, 65104]
      include_in_underlay_protocol: true
