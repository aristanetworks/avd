---
node_type_keys:
  - key: l2leaf
    type: l2leaf
    connected_endpoints: true
    network_services:
      l2: false
    underlay_router: false
    mlag_support: false

enabled_trunk_groups: true
only_local_vlan_trunk_groups: true

type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: connected-endpoints-no-network-services
      mgmt_ip: 192.168.0.2/24
      filter:
        only_vlans_in_use: true

# Added this to improve coverage for eos_designs_facts/vlan.py
servers:
  - name: OLD_SW-1/8
    adapters:
      - switches: [connected-endpoints-no-network-services]
        switch_ports: [Ethernet19]
        endpoint_ports: [Endpoint_port4]
        mode: trunk
        trunk_groups: [group1, group2]
      - switches: [connected-endpoints-no-network-services]
        switch_ports: [Ethernet20]
        endpoint_ports: [Endpoint_port5]
        mode: trunk
        description: connected-endpoints-no-network-services_vlans="all->alias of EOS's default/implicit '1-4094'"
        vlans: all
      - switches: [connected-endpoints-no-network-services]
        switch_ports: [Ethernet21]
        endpoint_ports: [Endpoint_port6]
        mode: trunk
        description: connected-endpoints-no-network-services_vlans="defined_vlans->none"
        vlans: defined_vlans
      # Forcing VLANs despite they are not defined on the switch
      - switches: [connected-endpoints-no-network-services]
        switch_ports: [Ethernet22]
        endpoint_ports: [Endpoint_port7]
        mode: trunk
        description: connected-endpoints-no-network-services_vlans="100,200"
        vlans: 100,200
      - switches: [connected-endpoints-no-network-services]
        switch_ports: [Ethernet23]
        endpoint_ports: [Endpoint_port8]
        mode: trunk
        description: connected-endpoints-no-network-services_vlans="none"
        vlans: none
