---
# Match the password used by the regular EVPN neighbor returning from the Route Server.
override_router_bgp:
  neighbors:
    # dc1-spine1
    - ip_address: 192.168.255.1
      password: 5B0XC3gLnsY/sTjyPTZ8og==

queue_monitor_streaming:
  enable: true
  ip_standard_access_group: ACL-QMS
  ipv6_access_group: ACLv6-QMS
  max_connections: 8
  vrf: vrf1

ipv4_standard_acls:
  - name: ACL-QMS
    entries:
      - sequence: 10
        action: permit
        source: any
