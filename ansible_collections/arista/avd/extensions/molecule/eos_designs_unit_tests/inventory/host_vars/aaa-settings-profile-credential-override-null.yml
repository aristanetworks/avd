---
type: l2leaf
l2leaf:
  defaults:
    aaa_settings_profile: credential_rotation
  nodes:
    - name: aaa-settings-profile-credential-override-null

aaa_settings:
  enable_password:
    password: OLD_ENABLE_PASSWORD_HASH
  local_users:
    - name: rotating-user
      privilege: 15
      role: network-admin
      sha512_password: OLD_LOCAL_USER_PASSWORD_HASH

aaa_settings_profiles:
  - profile: credential_rotation
    enable_password:
      password: null
      cleartext_password: new-enable-password
    local_users:
      - name: rotating-user
        sha512_password: null
        cleartext_password: new-local-user-password
