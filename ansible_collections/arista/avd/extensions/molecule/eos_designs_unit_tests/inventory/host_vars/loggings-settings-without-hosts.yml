---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
    mgmt_ip: 1.1.10.15
  nodes:
    - name: loggings-settings-without-hosts
      id: 15
      bgp_as: 15

logging_settings:
  console: errors
  monitor: disabled
  buffered:
    size: 1000000
    level: warnings
