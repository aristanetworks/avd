---
# Test for 802.1X device profiling LLDP: system_name disabled, system_description enabled with auth_only.
# Covers the false branch of `system_name.enabled` and the auth_only=true path for `system_description`.
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-5
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  device_profiling:
    enabled: true
    lldp:
      system_name:
        enabled: false
      system_description:
        enabled: true
        auth_only: true

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        cleartext_key: super-secret-key
