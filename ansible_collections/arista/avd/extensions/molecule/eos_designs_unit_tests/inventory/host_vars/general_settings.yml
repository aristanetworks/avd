---
# Testing general_settings

type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: general_settings
      mgmt_ip: 192.168.0.2/24

general_settings:
  # Test ARP configuration
  arp:
    # Test persistent ARP with refresh_delay
    persistent:
      enabled: true
      refresh_delay: 1200

    # Test aging timeout
    aging:
      timeout_default: 1500

  # Test IP ICMP redirect
  ip_icmp_redirect: false
