---
# The goal of this test is to verify that node l3_interfaces can generate BGP peerings even if BGP is not required for underlay or overlay.
# The node type *must* have `underlay_router: true` to even be considered an L3 device.
# The uplink type is overridden to `lan` to also ensure that nothing is relying on uplink type p2p / p2p-vrfs.

# l3spine has default overlay and underlay protocols set to none, so it will not have any BGP config by default.
type: l3spine

ipv4_prefix_list_catalog:
  - name: ALLOW-DEFAULT
    sequence_numbers:
      - sequence: 10
        action: permit 0.0.0.0/0

ipv6_prefix_list_catalog:
  - name: ALLOW-IPV6-DEFAULT
    sequence_numbers:
      - sequence: 10
        action: permit ::/0
  - name: ALLOW-IPV6-LOCAL
    sequence_numbers:
      - sequence: 10
        action: permit 2001:db8:42::/64

l3spine:
  nodes:
    - name: node-type-l3-interfaces-bgp
      loopback_ipv4_pool: 192.168.255.0/24
      id: 1
      bgp_as: 65000
      uplink_type: lan
      l3_interfaces:
        - # triggering bgp
          name: Ethernet43
          enabled: false
          ip_address: 192.168.42.42/24
          peer_ip: 192.168.42.1
          wan_carrier: INTERNET
          bgp:
            peer_as: 65042
            ipv4_prefix_list_in: ALLOW-DEFAULT
        - # IPv6 BGP peering on an L3 interface with inbound and outbound policies.
          name: Ethernet44
          ipv6_addresses:
            - 2001:db8:42::2/64
          peer: PEER-IPV6
          peer_interface: Ethernet1
          peer_ipv6_address: 2001:db8:42::1
          bgp:
            peer_as: 65043
            ipv6_prefix_list_in: ALLOW-IPV6-DEFAULT
            ipv6_prefix_list_out: ALLOW-IPV6-LOCAL
      l3_port_channels:
        - # IPv6 BGP peering with the default deny-all outbound policy.
          name: Port-Channel45
          ipv6_addresses:
            - 2001:db8:45::2/64
          peer: PEER-IPV6-PC
          peer_port_channel: Port-Channel1
          peer_ipv6_address: 2001:db8:45::1
          member_interfaces:
            - name: Ethernet45
              peer: PEER-IPV6-PC
              peer_interface: Ethernet1
          bgp:
            peer_as: 65045
