  nodes:
    - name: mgmt-interface-dhcp
      mgmt_ip: dhcp
      mgmt_gateway: 10.1.1.1 # Suppressed mgmt_gateway with avd_design_future.accept_dhcp_default_route_for_mgmt_ip_dhcp: true and mgmt_ip: dhcp
      id: 201
