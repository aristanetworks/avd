---
# Test configuring a queue-monitor streaming IPv4 ACL from the catalog.
queue_monitor_streaming:
  enable: true
  ipv4_acl: QMS-EXTENDED
  ipv6_access_group: ACLv6-QMS
  max_connections: 8
  vrf: vrf1

ipv4_acls:
  - name: QMS-EXTENDED
    entries:
      - sequence: 10
        action: permit
        protocol: ip
        source: any
        destination: any
