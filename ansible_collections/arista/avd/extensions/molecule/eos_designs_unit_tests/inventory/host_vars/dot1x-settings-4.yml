---
# Test for global 802.1X enabled with combination of specific group and the default 'radius' group as fallback
# Verify that the built-in CloudEOS platform setting suppresses 802.1X Per-MAC ACL mode
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-4
      mgmt_ip: 192.168.0.2/24
      platform: CloudEOS

dot1x_settings:
  enabled: true
  authentication:
    radius_groups: [agni-server-group, radius]
  accounting:
    radius_groups: [agni-server-group, radius]

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - agni-server-group
        cleartext_key: super-secret-key

network_ports:
  - switches: [dot1x-settings-4]
    switch_ports: [Ethernet1]
    dot1x:
      mac_based_access_list: true
      reauthentication: true
