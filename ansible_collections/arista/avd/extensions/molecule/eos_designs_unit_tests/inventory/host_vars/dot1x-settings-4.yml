---
# Test for global 802.1X enabled with combination of specific group and the default 'radius' group as fallback
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-4
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  authentication:
    radius_groups: [agni-server-group, radius]
  accounting:
    radius_groups: [agni-server-group, radius]
  device_profiling:
    enabled: true
    dhcp:
      parameter_request_list:
        enabled: false
        auth_only: true
      vendor_class_id:
        enabled: true
        auth_only: true

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - agni-server-group
        cleartext_key: super-secret-key
