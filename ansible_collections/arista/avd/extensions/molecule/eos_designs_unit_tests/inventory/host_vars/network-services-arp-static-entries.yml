---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 10
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
  nodes:
    - name: network-services-arp-static-entries
      id: 102
      bgp_as: 102

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF1
        vrf_id: 1
        # ARP static entries without nodes - should apply to all devices with this VRF
        arp_static_entries:
          - ipv4_address: 10.1.1.1
            mac_address: 0000.0000.0001
          - ipv4_address: 10.1.1.2
            mac_address: 0000.0000.0002
        svis:
          - id: 10
            name: VRF1_VLAN10
            enabled: true
            ip_address_virtual: 10.1.10.1/24

      - name: VRF2
        vrf_id: 2
        # ARP static entries with specific nodes - should only apply to network-services-arp-static-entries node
        arp_static_entries:
          - ipv4_address: 10.2.1.1
            mac_address: 0000.0000.0011
            nodes: [network-services-arp-static-entries]
          - ipv4_address: 10.2.1.2
            mac_address: 0000.0000.0012
            nodes: [network-services-arp-static-entries]
          # This entry should NOT be configured on network-services-arp-static-entries node
          - ipv4_address: 10.2.1.3
            mac_address: 0000.0000.0013
            nodes: [some-other-node]
        svis:
          - id: 20
            name: VRF2_VLAN20
            enabled: true
            ip_address_virtual: 10.2.20.1/24

      - name: VRF3
        vrf_id: 3
        # Mix of entries with and without nodes
        arp_static_entries:
          - ipv4_address: 10.3.1.1
            mac_address: 0000.0000.0021
            # No nodes - applies to all
          - ipv4_address: 10.3.1.2
            mac_address: 0000.0000.0022
            nodes: [network-services-arp-static-entries]
        svis:
          - id: 30
            name: VRF3_VLAN30
            enabled: true
            ip_address_virtual: 10.3.30.1/24

      - name: VRF4
        vrf_id: 4
        # Test with different MAC address formats
        arp_static_entries:
          - ipv4_address: 192.168.100.1
            mac_address: AAAA.BBBB.CCCC
          - ipv4_address: 192.168.100.2
            mac_address: aaaa.bbbb.cccd
          - ipv4_address: 192.168.100.3
            mac_address: 1234.5678.90AB
        svis:
          - id: 40
            name: VRF4_VLAN40
            enabled: true
            ip_address_virtual: 192.168.40.1/24
