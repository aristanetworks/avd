---
# Use the built-in l2leaf type to exercise the standard connected-endpoint and network-port path.
type: l2leaf
l2leaf:
  nodes:
    - name: monitor-sessions-mixed-types
      id: 1
      mgmt_ip: 192.168.1.2/24

avd_design_future:
  configure_monitor_session_ipv4_acl_from_catalog: true

ipv4_acls:
  - name: MONITOR-SESSION-IP-ACL
    entries:
      - sequence: 10
        action: permit
        protocol: ip
        source: any
        destination: any

ipv6_acls:
  - name: MONITOR-SESSION-IPV6-ACL
    entries:
      - sequence: 10
        action: permit
        protocol: ipv6
        source: any
        destination: any

mac_acls:
  - name: MONITOR-SESSION-MAC-ACL
    entries:
      - sequence: 10
        action: permit
        source: any
        destination: any

# Same name is intentional: EOS Designs must cast and merge these into one monitor session.
# Source is supplied by a connected endpoint.
servers:
  - name: server1
    adapters:
      - switches: [monitor-sessions-mixed-types]
        switch_ports: [Ethernet1]
        monitor_sessions:
          - name: MIXED
            role: source
            source_settings:
              direction: rx
              access_group:
                type: ip
                name: MONITOR-SESSION-IP-ACL
                priority: 10
          - name: MONITOR-IPV6
            role: source
            source_settings:
              direction: rx
              access_group:
                type: ipv6
                name: MONITOR-SESSION-IPV6-ACL
          - name: MONITOR-MAC
            role: source
            source_settings:
              direction: rx
              access_group:
                type: mac
                name: MONITOR-SESSION-MAC-ACL
                priority: 20

# Destination is supplied by a network port with the same session name.
network_ports:
  - switches: [monitor-sessions-mixed-types]
    switch_ports: [Ethernet2]
    monitor_sessions:
      - name: MIXED
        role: destination
