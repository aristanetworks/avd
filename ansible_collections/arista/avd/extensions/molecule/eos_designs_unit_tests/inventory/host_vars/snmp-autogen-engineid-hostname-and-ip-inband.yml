---
# Minimum config to only test the specific feature.
# This tests the SNMP auto engine ID for the hostname_and_ip mode
# It is not RFC 3411 compliant and hash None for inband management
type: l2leaf

l2leaf:
  nodes:
    - name: snmp-autogen-engine-id-legacy-hostname-and-ip-inband
      id: 43
      inband_mgmt_ip: 192.168.0.10/24
inband_mgmt_interface_vrf: MGMT
inband_mgmt_gateway: 192.168.0.1

snmp_settings:
  contact: example@example.com
  location: true
  compute_local_engineid: true
  compute_local_engineid_source: hostname_and_ip
  compute_v3_user_localized_key: true
  users:
    - name: usertest-auth-priv
      group: usergroup
      version: v3
      auth: sha
      auth_passphrase: clearauth # to get from vault in real life
      priv: aes192
      priv_passphrase: clearpriv # to get from vault in real life
