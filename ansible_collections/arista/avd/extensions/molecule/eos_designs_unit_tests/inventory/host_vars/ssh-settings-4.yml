---
type: l2leaf

l2leaf:
  nodes:
    - name: ssh-settings-4
      id: 43
      mgmt_ip: 10.10.10.43/26
      inband_mgmt_ip: 10.20.30.40/24
      inband_mgmt_gateway: 10.20.30.1

ipv4_standard_acls:
  - name: ACL-SSH-STANDARD
    entries:
      - sequence: 10
        action: permit
        source: any

mgmt_interface_settings:
  vrf: MGMT
mgmt_gateway: 10.10.10.1

ssh_settings:
  vrfs:
    - name: default
      enabled: true
      ipv4_standard_acl: ACL-SSH-STANDARD

