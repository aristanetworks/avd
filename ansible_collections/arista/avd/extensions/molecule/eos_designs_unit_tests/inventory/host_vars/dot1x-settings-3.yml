---
# Test for global 802.1X enabled with specific features turned off
# Verify that the built-in vEOS-lab platform setting suppresses 802.1X Per-MAC ACL mode
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-3
      mgmt_ip: 192.168.0.2/24
      platform: vEOS-lab

dot1x_settings:
  enabled: true
  accounting:
    enabled: true
  bypass_bpdu: false
  bypass_lldp: false
  dynamic_authorization:
    enabled: false
    # Without CoA feature enabled it won't render the radius server dynamic authorization udp port
    port: 100
  device_profiling:
    enabled: true
    dhcp:
      hostname:
        auth_only: true
      parameter_request_list:
        enabled: false
      vendor_class_id:
        auth_only: true
    lldp:
      system_name:
        auth_only: true
      system_description:
        enabled: false

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        cleartext_key: super-secret-key

network_ports:
  - switches: [dot1x-settings-3]
    switch_ports: [Ethernet1]
    dot1x:
      mac_based_access_list: true
      reauthentication: true
