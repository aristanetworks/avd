---
# Only the interface name and shutdown state should be generated for an unused management interface.
type: l2leaf
default_mgmt_method: none
avd_design_future:
  only_configure_oob_mgmt_vrf_and_ipv4_static_routes_when_used: true
l2leaf:
  nodes:
    - name: mgmt-interface-settings-3
mgmt_interface_settings:
  description: UNUSED_MANAGEMENT
  vrf: UNUSED_MGMT
  interface: Management0
  shutdown: auto
  lldp:
    transmit: false
    receive: false
    ztp_vlan: 111
