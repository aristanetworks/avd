---
type: spine

spine:
  nodes:
    - name: logging_settings_local_interface
      mgmt_ip: 192.168.66.23/24
      id: 2
      loopback_ipv4_pool: 1.2.3.4/24
      bgp_as: 65000

logging_settings:
  # Test the new use_local_interface_cli feature - uses local-interface instead of source-interface
  use_local_interface_cli: true
  hosts:
    # Test: No VRF specified; should use VRF from default_mgmt_method with local-interface CLI
    - name: 30.30.30.7
      protocol: tcp
      ports:
        - 100
        - 200
    - name: 192.168.0.42
      vrf: default
  vrfs:
    - name: MGMT
      source_interface: Management0
    - name: default
      source_interface: Ethernet42
