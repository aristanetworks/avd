---
# This tests the SNMP auto engine ID calculation for the method specified
# as the default mgmt method.
# This also test support for other interfaces, like loopback being specified
# as the inband mgmt interface.
type: l2leaf

l2leaf:
  nodes:
    - name: snmp-autogen-engineid-rfc3411-hostname-default-mgmt-inband
      id: 43
      inband_mgmt_ip: 192.168.0.10/24
default_mgmt_method: inband
inband_mgmt_interface_vrf: MGMT
inband_mgmt_gateway: 192.168.0.10/24

snmp_settings:
  compute_local_engineid: true
  # The default value is rfc3411_type5
  # compute_local_engineid_source: rfc3411_type5
  # Since default_mgmt_method is set to inband, it should use the inband_mgmt_ip.
