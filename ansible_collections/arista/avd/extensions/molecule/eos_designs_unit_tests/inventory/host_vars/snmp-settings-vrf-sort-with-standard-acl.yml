---
ipv4_standard_acls:
  - name: SNMP-VRF-ACL
    entries:
      - sequence: 10
        action: permit
        source: 10.0.0.14

type: l2leaf

l2leaf:
  nodes:
    - name: snmp-settings-vrf-sort-with-standard-acl
      id: 44
      mgmt_ip: 10.10.10.44/26

avd_design_future:
  sort_snmp_acls_and_local_interfaces_by_vrf: true

mgmt_interface_settings:
  vrf: MGMT
mgmt_gateway: 10.10.10.1

snmp_settings:
  vrfs:
    - name: use_default_mgmt_method_vrf
      enable: true
      ipv4_standard_acl: SNMP-VRF-ACL
