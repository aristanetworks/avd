---
# Minimum config to only test the specific feature.
# This tests the SNMP auto engine ID
type: l2leaf

l2leaf:
  nodes:
    - name: snmp-autogen-engineid-rfc3411-hostname-oob-ip
      id: 43
      mgmt_ip: 192.168.0.10/24
      # Making sure mgmt_ip has precedence over ipv6_mgmt_ip.
      ipv6_mgmt_ip: 2001:db8::dead:beef:cafe/64

snmp_settings:
  compute_local_engineid: true
  # The default value is 3411
  # compute_local_engineid_source: rfc3411_type5
  local_engineid_ip: use_mgmt_interface
