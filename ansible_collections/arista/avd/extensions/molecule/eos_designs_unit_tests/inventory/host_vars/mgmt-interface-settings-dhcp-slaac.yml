# Test DHCP and SLAAC enablement through mgmt_interface_settings rather than node mgmt_ip.
type: l2leaf
mgmt_interface_settings:
  vrf: MGMT
  description: "Management Interface - DHCP"
  ipv4:
    default_dhcp: true
    dhcp_accept_default_route: true
  ipv6:
    default_auto_config: true
    auto_config_accept_default_route: true

# These gateways and destination networks are ignored because DHCP and router advertisements provide the default routes.
mgmt_gateway: 10.1.1.1
mgmt_destination_networks:
  - 10.0.10.0/24
  - 172.16.254.0/23
ipv6_mgmt_gateway: 0200::1
ipv6_mgmt_destination_networks:
  - 0210:1::/64
  - 0210:2::/64

l2leaf:
  nodes:
    - name: mgmt-interface-settings-dhcp-slaac
      id: 201
