---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
    mgmt_ip: 1.1.10.12
  nodes:
    - name: address-locking-12
      id: 102
      bgp_as: 102

# Testing auto_dhcp_server_interfaces: true with no L2 uplinks, no dhcp_server_interfaces, and no local_interface.
# Since there are no L2 uplinks and no MLAG on this standalone l3leaf, the auto-detection yields no interfaces.
# The result falls back to no dhcp_server_interfaces and no local_interface (address locking configured with just locked_address).
avd_design_future:
  fix_address_locking_dhcp_server_interfaces: true

address_locking_settings:
  auto_dhcp_server_interfaces: true
  locked_address:
    ipv4_enforcement_disabled: true
