---
# Minimum config to only test the specific feature.
# This tests the SNMP auto engine ID
type: l2leaf

l2leaf:
  nodes:
    - name: snmp-autogen-engineid-rfc3411-hostname-inband-ip
      id: 43
      inband_mgmt_ip: 192.168.0.10/24
inband_mgmt_interface_vrf: MGMT
inband_mgmt_gateway: 192.168.0.1

snmp_settings:
  compute_local_engineid: true
  # The default value is 3411
  # compute_local_engineid_source: rfc3411_type5
  local_engineid_ip: use_inband_mgmt_interface
