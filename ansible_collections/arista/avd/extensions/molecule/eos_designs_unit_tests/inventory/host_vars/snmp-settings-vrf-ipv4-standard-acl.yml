---
ipv4_standard_acls:
  - name: SNMP-VRF-ACL
    entries:
      - sequence: 10
        action: permit
        source: 10.0.0.14

type: l2leaf

l2leaf:
  nodes:
    - name: snmp-settings-vrf-ipv4-standard-acl
      id: 43
      mgmt_ip: 10.10.10.43/26

mgmt_interface_settings:
  vrf: MGMT
mgmt_gateway: 10.10.10.1

snmp_settings:
  vrfs:
    # Testing automatically picking up the oob VRF with the 'use_default_mgmt_method_vrf' keyword.
    # This errors if mgmt_ip is missing.
    - name: use_default_mgmt_method_vrf
      enable: true
      ipv4_standard_acl: SNMP-VRF-ACL
