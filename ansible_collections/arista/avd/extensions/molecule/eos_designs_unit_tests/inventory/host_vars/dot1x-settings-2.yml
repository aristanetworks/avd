---
# Test for global 802.1X enabled with non-default values
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-2
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  radius_groups: [agni-server-group, backup-agni-server-group]
  bypass_bpdu: false
  bypass_lldp: false
  dynamic_authorization:
    enabled: false
  mac_based_authentication:
    username_delimiter: colon
    username_letter_case: uppercase

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - agni-server-group
        cleartext_key: super-secret-key
      - host: agni2.arista.com
        groups:
          - backup-agni-server-group
        cleartext_key: super-secret-key
