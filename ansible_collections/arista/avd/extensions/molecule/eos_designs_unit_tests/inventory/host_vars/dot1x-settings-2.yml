---
# Test for global 802.1X enabled with non-default values
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-2
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  authentication:
    radius_groups: [agni-server-group, backup-agni-server-group]
  accounting:
    mode: stop-only
    radius_groups: [agni-server-group, backup-agni-server-group]
    multicast: true
    syslog: true
  dynamic_authorization:
    additional_groups: [coa-server-group]
  mac_based_authentication:
    username_format:
      delimiter: colon
      letter_case: uppercase
  radius_av_pairs:
    service_type: true
    framed_mtu: 1500
    dhcp:
      hostname:
        enabled: true
        auth_only: true
      parameter_request_list:
        enabled: true
      vendor_class_id:
        enabled: false
  captive_portal:
    enabled: true
    ssl_profile: captive-portal-ssl-profile
    url: https://captive.arista.com
    start_limit_infinite: true
    ipv4_standard_acl: CAPTIVE-PORTAL-ACL

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - agni-server-group
        cleartext_key: super-secret-key
      - host: agni2.arista.com
        groups:
          - backup-agni-server-group
        cleartext_key: super-secret-key
      - host: coa.arista.com
        groups:
          - coa-server-group
        cleartext_key: super-secret-key
