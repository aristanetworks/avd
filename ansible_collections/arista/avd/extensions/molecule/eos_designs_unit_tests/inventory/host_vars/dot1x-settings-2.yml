---
# Test for global 802.1X enabled with non-default values
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-2
      mgmt_ip: 192.168.0.2/24

dot1x_settings:
  enabled: true
  authentication:
    radius_groups: [agni-server-group, backup-agni-server-group]
  accounting:
    mode: start-stop
    radius_groups: [agni-server-group, backup-agni-server-group]
    multicast: true
    syslog: true
  dynamic_authorization:
    additional_groups: [coa-server-group]
  mac_based_authentication:
    username_format:
      delimiter: colon
      letter_case: uppercase
    delay: 200
    hold_period: 100
  radius_av_pairs:
    service_type: true
    framed_mtu: 1500
  # `device_profiling.enabled` is omitted so it takes its default (false). The early-return
  # fires before the accounting validation, so the sub-keys below are ignored and it is safe
  # to combine with `accounting.mode: stop-only`.
  device_profiling:
    lldp:
      system_name:
        enabled: true
        auth_only: true
      system_description:
        enabled: true

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        groups:
          - agni-server-group
        cleartext_key: super-secret-key
      - host: agni2.arista.com
        groups:
          - backup-agni-server-group
        cleartext_key: super-secret-key
      - host: coa.arista.com
        groups:
          - coa-server-group
        cleartext_key: super-secret-key
