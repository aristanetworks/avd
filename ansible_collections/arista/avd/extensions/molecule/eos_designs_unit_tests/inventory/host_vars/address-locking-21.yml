---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
    mgmt_ip: 1.1.10.10
  nodes:
    - name: address-locking-21
      id: 101
      bgp_as: 101

# Testing that address_locking_settings.disabled: true is rendered in the IPv6-only lazy path.
# When only IPv6 address locking is used, set_once_address_locking_ipv6 must apply 'disabled'
# directly since set_once_address_locking() (the full writer) is never triggered by the IPv6 path.
avd_design_future:
  only_configure_address_locking_when_used: true

address_locking_settings:
  disabled: true

servers:
  - name: ADDRESS_LOCKING_21_SERVER
    adapters:
      - switches: [address-locking-21]
        switch_ports: [Ethernet2]
        mode: access
        vlans: 101
        address_locking:
          ipv6: true
