---
# Minimum config to only test the specific feature.
# This tests the SNMP auto engine ID
type: l2leaf

l2leaf:
  nodes:
    - name: snmp-autogen-engineid-rfc3411-hostname-specific-ip
      id: 43
default_mgmt_method: none

snmp_settings:
  compute_local_engineid: true
  # The default value is rfc3411_type5
  # compute_local_engineid_source: rfc3411_type5
  # default_mgmt_method is none so an IP must be set
  local_engineid_ip: 42.42.42.42
