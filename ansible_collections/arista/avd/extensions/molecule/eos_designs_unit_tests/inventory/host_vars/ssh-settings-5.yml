---
type: l2leaf

l2leaf:
  nodes:
    - name: ssh-settings-5
      id: 43
      mgmt_ip: 10.10.10.43/26
      inband_mgmt_ip: 10.20.30.40/24
      inband_mgmt_gateway: 10.20.30.1

avd_design_future:
  # Test this setting for VRF default.
  validate_ssh_settings_vrfs_ipv4_acl: true

ipv4_acls:
  - name: ACL-SSH
    entries:
      - sequence: 15
        action: deny
        protocol: ip
        source: any
        destination: any

ipv4_standard_acls:
  - name: ACL-SSH-STANDARD
    entries:
      - sequence: 10
        action: permit
        source: any

mgmt_interface_settings:
  vrf: MGMT
mgmt_gateway: 10.10.10.1

ssh_settings:
  vrfs:
    - name: default
      enabled: true
      ipv4_acl: ACL-SSH
