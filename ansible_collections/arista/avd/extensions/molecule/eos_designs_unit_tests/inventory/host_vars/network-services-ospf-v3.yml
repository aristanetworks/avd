---
# Tests OSPFv3

type: l3leaf

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.66.0/24
    vtep_loopback_ipv4_pool: 192.168.142.0/24
    virtual_router_mac_address: 00:11:22:33:44:55
    bgp_as: 666
  nodes:
    - name: network-services-ospf-v3
      id: 142
      mgmt_ip: 192.168.42.142/24

tenants:
  # Test OSPFv3 Redistribution
  - name: Tenant_OSPFv3_Redistribute
    mac_vrf_vni_base: 10000
    mac_vrf_id_base: 20000
    redistribute_mlag_ibgp_peering_vrfs: true
    vrfs:
      - name: Tenant_OSPFv3_Redistribute_VRF
        vrf_vni: 100
        vrf_id: 42
        ospfv3:
          enabled: true
          router_id: 192.168.255.101
          address_family_ipv4:
            enabled: true
            redistribute_bgp:
              enabled: true
            redistribute_connected:
              enabled: true
            redistribute_static:
              enabled: true
          address_family_ipv6:
            enabled: true
            redistribute_bgp:
              enabled: true
            redistribute_connected:
              enabled: true
            redistribute_static:
              enabled: true
          nodes: [network-services-ospf-v3]
        redistribute_ospfv3: false
        svis:
          - id: 201
            name: Tenant_OSPFv3_Redistribute_201
            description: "Tenant_OSPFv3_Redistribute_201 description"
            enabled: true
            ipv6_address: cafe::cafe/64
            ipv6_enable: true
            ospfv3:
              enabled: true
              address_family_ipv4:
                enabled: true
              address_family_ipv6:
                enabled: true
              passive_interface: true
              network_point_to_point: true
  # Test OSPFv3 Redistribution with route map
  - name: Tenant_OSPFv3_Redistribute_Route_Map
    mac_vrf_vni_base: 10000
    mac_vrf_id_base: 20000
    redistribute_mlag_ibgp_peering_vrfs: true
    vrfs:
      - name: Tenant_OSPFv3_Redistribute_Route_Map_VRF
        vrf_vni: 101
        vrf_id: 43
        ospfv3:
          enabled: true
          router_id: 192.168.255.102
          address_family_ipv4:
            enabled: true
            redistribute_bgp:
              enabled: true
              route_map: ipv4_ospf_rm
            redistribute_connected:
              enabled: true
              route_map: ipv4_ospf_rm
            redistribute_static:
              enabled: true
              route_map: ipv4_ospf_rm
          address_family_ipv6:
            enabled: true
            redistribute_bgp:
              enabled: true
              route_map: ipv6_ospf_rm
            redistribute_connected:
              enabled: true
              route_map: ipv6_ospf_rm
            redistribute_static:
              enabled: true
              route_map: ipv6_ospf_rm
          nodes: [network-services-ospf-v3]
        svis:
          - id: 202
            name: Tenant_OSPFv3_Redistribute_Route_Map_202
            description: "Tenant_OSPFv3_Redistribute_Route_Map_202 description"
            enabled: true
            ipv6_address: cafe::/64
            ipv6_enable: true
            ospfv3:
              enabled: true
              address_family_ipv4:
                enabled: true
                area: 1.1.1.1
              address_family_ipv6:
                enabled: true
                area: 1.1.1.1
              passive_interface: true
              network_point_to_point: true
  # Test OSPFv3 IPv4 Redistribution
  - name: Tenant_OSPFv3_Redistribute_IPv4
    mac_vrf_vni_base: 10000
    mac_vrf_id_base: 20000
    redistribute_mlag_ibgp_peering_vrfs: true
    vrfs:
      - name: Tenant_OSPFv3_Redistribute_IPv4
        vrf_vni: 102
        vrf_id: 44
        ospfv3:
          enabled: true
          router_id: 192.168.255.103
          address_family_ipv4:
            enabled: true
            redistribute_bgp:
              enabled: true
              route_map: ipv4_ospf_rm
            redistribute_connected:
              enabled: true
              route_map: ipv4_ospf_rm
          nodes: [network-services-ospf-v3]
        svis:
          - id: 203
            name: Tenant_OSPFv3_Redistribute_Include_Leaked_203
            description: "Tenant_OSPFv3_Redistribute_Include_Leaked_203 description"
            enabled: true
            ipv6_address: cafe::ca/64
            ipv6_enable: true
            ospfv3:
              enabled: true
              address_family_ipv4:
                enabled: true
                area: 1.1.1.1
              address_family_ipv6:
                enabled: true
                area: 1.1.1.1
              passive_interface: true
              network_point_to_point: true
  # Test OSPFv3 IPv6 Redistribution
  - name: Tenant_OSPFv3_Redistribute_IPv6
    mac_vrf_vni_base: 10000
    mac_vrf_id_base: 20000
    redistribute_mlag_ibgp_peering_vrfs: true
    vrfs:
      - name: Tenant_OSPFv3_Redistribute_IPv6
        vrf_vni: 105
        vrf_id: 47
        ospfv3:
          enabled: true
          router_id: 192.168.255.104
          address_family_ipv6:
            enabled: true
            redistribute_bgp:
              enabled: true
              route_map: ipv6_ospf_rm
            redistribute_connected:
              enabled: true
              route_map: ipv6_ospf_rm
            redistribute_static:
              enabled: true
              route_map: ipv6_ospf_rm
          nodes: [network-services-ospf-v3]
        svis:
          - id: 206
            name: Tenant_OSPFv3_No_Redistribution_206
            description: "Tenant_OSPFv3_No_Redistribution_206 description"
            enabled: true
            ipv6_address: ca::ca/64
            ipv6_enable: true
