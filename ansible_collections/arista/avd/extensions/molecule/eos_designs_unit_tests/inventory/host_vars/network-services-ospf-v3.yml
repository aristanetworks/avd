    mac_vrf_vni_base: 10000
    mac_vrf_id_base: 20000
    redistribute_mlag_ibgp_peering_vrfs: true
    vrfs:
      - name: Tenant_OSPFv3_Redistribute_Ospfv3_nss_VRF
        vrf_vni: 104
        vrf_id: 46
        ipv6_ospf:
          enabled: true
          router_id: ipv6_ospf_router_ospfv3_nss
          redistribute_ospfv3:
            enabled: true
            route_map: ipv6_ospf_rm
            match_nssa_external:
              enabled: true
              route_map: ipv6_ospf_rm
          nodes: [network-services-ospf-v3]
        svis:
          - id: 205
            name: Tenant_OSPFv3_Redistribute_Ospfv3_nss_205
            description: "Tenant_OSPFv3_Redistribute_Ospfv3_nss_205 description"
            enabled: true
