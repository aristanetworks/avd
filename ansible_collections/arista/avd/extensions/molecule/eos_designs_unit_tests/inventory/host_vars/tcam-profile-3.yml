---
# Test case 3: system profile - check additional profile configured
# Expected output:
# hardware tcam
#    profile additional-profile
#       source flash:/additional-profile.conf
#    !
#    system profile system-profile
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: tcam-profile-3
      mgmt_ip: 192.168.0.2/24
      platform: test-platform

tcam_profiles:
  - name: additional-profile
    source: flash:/additional-profile.conf

platform_settings:
  - platforms: ["test-platform"]
    tcam_profile: system-profile
    additional_tcam_profiles:
      - additional-profile
