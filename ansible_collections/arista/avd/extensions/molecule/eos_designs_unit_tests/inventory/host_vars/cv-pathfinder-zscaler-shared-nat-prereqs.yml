---
# Test dedicated to multiple Zscaler Internet Exit policies on one device.
# Shared NAT prerequisites must be generated once per device.
wan_mode: cv-pathfinder
# Disabling underlay for tests
underlay_routing_protocol: none

type: wan_router
bgp_as: 65000

cv_pathfinder_regions:
  - name: AVD_Land_Test
    id: 88
    description: AVD Region
    sites:
      - name: Site188
        id: 188
        location: Somewhere

bgp_peer_groups:
  wan_overlay_peers:
    password: "htm4AZe9mIQOO1uiMuGgYQ=="
    listen_range_prefixes:
      - 192.168.255.0/24

wan_route_servers:
  - hostname: cv-pathfinder-pathfinder
    vtep_ip: 10.10.10.10
    path_groups:
      - name: INET
        interfaces:
          - name: Ethernet1
            public_ip: 198.51.100.10

wan_ipsec_profiles:
  control_plane:
    shared_key: ABCDEF1234567890
  data_plane:
    shared_key: ABCDEF1234567890666

wan_router:
  defaults:
    loopback_ipv4_pool: 192.168.42.0/24
    vtep_loopback_ipv4_pool: 192.168.255.0/24
    filter:
      always_include_vrfs_in_tenants: [TenantA]
  nodes:
    - name: cv-pathfinder-zscaler-shared-nat-prereqs
      cv_pathfinder_region: AVD_Land_Test
      cv_pathfinder_site: Site188
      id: 1
      l3_interfaces:
        - name: Ethernet1
          wan_carrier: ATT
          wan_circuit_id: 188-1
          ip_address: 198.51.100.11/31
          peer_ip: 198.51.100.10
          cv_pathfinder_internet_exit:
            policies:
              - name: ZSCALER-EXIT-POLICY-1
                tunnel_interface_numbers: 100-102
              - name: ZSCALER-EXIT-POLICY-2
                tunnel_interface_numbers: 110-112

wan_path_groups:
  - name: INET
    id: 101

wan_carriers:
  - name: ATT
    path_group: INET
    trusted: true

tenants:
  - name: TenantA
    vrfs:
      - name: default
        vrf_id: 1
      - name: PROD
        vrf_id: 42

wan_virtual_topologies:
  vrfs:
    - name: PROD
      wan_vni: 42
  policies:
    - name: DEFAULT-POLICY
      default_virtual_topology:
        path_groups:
          - names: [INET]
      application_virtual_topologies:
        - application_profile: APP-1
          path_groups:
            - names: [INET]
          internet_exit:
            policy: ZSCALER-EXIT-POLICY-1
          id: 2
        - application_profile: APP-2
          path_groups:
            - names: [INET]
          internet_exit:
            policy: ZSCALER-EXIT-POLICY-2
          id: 4

application_classification:
  application_profiles:
    - name: APP-1
    - name: APP-2

cv_pathfinder_internet_exit_policies:
  - name: ZSCALER-EXIT-POLICY-1
    type: zscaler
    zscaler:
      domain_name: test.local
      ipsec_key_salt: THIS_SHOULD_BE_VAULTED
  - name: ZSCALER-EXIT-POLICY-2
    fallback_to_system_default: false
    type: zscaler
    zscaler:
      domain_name: test.local
      ipsec_key_salt: THIS_SHOULD_BE_VAULTED

# User-provided ACL for Internet Exit NAT.
ipv4_acls:
  - name: ACL-NAT-IE-ZSCALER
    entries:
      - sequence: 10
        action: permit
        protocol: ip
        source: any
        destination: 10.10.10.0/24
      - sequence: 20
        action: deny
        protocol: ip
        source: any
        destination: any

zscaler_endpoints:
  cloud_name: zscalerbeta
  device_location:
    city: Santa Clara, CA
    country: United States
  primary:
    city: Fremont, CA
    datacenter: FMT1
    country: United States
    region: us-west1
    latitude: 37
    longitude: -121
    ip_address: 203.0.113.10 # Not the correct address
