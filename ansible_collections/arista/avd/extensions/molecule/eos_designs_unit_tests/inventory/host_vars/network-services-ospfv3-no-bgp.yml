---
# OSPFv3 on a non-VTEP L3 switch without BGP. VXLAN is left at its default since the device is not a VTEP.
type: l3spine

underlay_routing_protocol: ospf

l3spine:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    virtual_router_mac_address: 00:1c:73:00:dc:01
  nodes:
    - name: network-services-ospfv3-no-bgp
      id: 1

tenants:
  - name: TENANT_A
    vrfs:
      - name: VRF_A
        vrf_id: 10
        ospfv3:
          redistribute_connected:
            enabled: true
        svis:
          - id: 110
            name: TRANSIT
            enabled: true
            ipv6_address: 2001:db8:110::1/64
            ospfv3:
              enabled: true
              point_to_point: true
          - id: 111
            name: LAN
            enabled: true
            ipv6_address: 2001:db8:111::1/64
            ospfv3:
              enabled: true
              passive: true
