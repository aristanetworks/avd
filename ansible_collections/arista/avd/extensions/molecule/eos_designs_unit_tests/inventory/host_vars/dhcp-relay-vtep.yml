---
# Test DHCP packet suppression for VTEP devices

type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
  nodes:
    - name: dhcp-relay-vtep
      id: 101
      bgp_as: 101

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    l2vlans:
      - id: 101
        name: dhcp-relay-1
      - id: 102
        name: dhcp-relay-2

general_settings:
  dhcp_relay:
    tunnel_requests_disabled: true
