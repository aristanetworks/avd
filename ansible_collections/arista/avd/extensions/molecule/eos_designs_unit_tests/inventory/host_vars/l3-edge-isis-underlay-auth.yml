underlay_routing_protocol: isis
underlay_isis_authentication_mode: md5
underlay_isis_authentication_key: "$1c$sTNAlR6rKSw="

type: spine
spine:
  nodes:
    - name: l3-edge-isis-underlay-auth
      id: 1
      evpn_role: "none"
      loopback_ipv4_pool: 1.2.5.0/24
      bgp_as: 65000

l3_edge:
  p2p_links:
    # Global encrypted key applied via use_underlay_authentication: true (new code path).
    - nodes: [l3-edge-isis-underlay-auth, peer1]
      interfaces: [ethernet1, ethernet1]
      ip: [192.168.2.0/31, 192.168.2.1/31]
      use_underlay_authentication: true

    # use_underlay_authentication: false - legacy fallback still applies global encrypted key.
    - nodes: [l3-edge-isis-underlay-auth, peer2]
      interfaces: [ethernet2, ethernet2]
      ip: [192.168.2.2/31, 192.168.2.3/31]
      use_underlay_authentication: false
