type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: custom-structured-configuration
      mgmt_ip: 192.168.100.10/24

custom_structured_configuration_prefix:
  - 'csc_1_'
  - 'csc_2_'

aaa_settings:
