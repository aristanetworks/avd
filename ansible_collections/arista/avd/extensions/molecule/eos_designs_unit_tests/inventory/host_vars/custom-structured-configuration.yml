        cleartext_key: arista
        groups:
          - TACACS1

      - host: 10.10.10.2  # Collides with csc_1_aaa_server_groups
        vrf: default
        cleartext_key: arista
        groups:
          - TACACS1

      - host: 10.10.10.3 # unique value
        vrf: default
        cleartext_key: arista
        groups:
          - TACACS1

