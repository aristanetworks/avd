---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 8
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:dc:00:00:00:0a
    mgmt_ip: 1.1.10.10
  nodes:
    - name: address-locking-13
      id: 101
      bgp_as: 101

# Testing IPv4 and IPv6 enforcement-disabled modes from a connected endpoint.
avd_design_future:
  only_configure_address_locking_when_used: true

address_locking_settings:
  locked_address:
    ipv4_enforcement_disabled: true
    ipv6_enforcement_disabled: true

servers:
  - name: ADDRESS_LOCKING_13_SERVER
    adapters:
      - switches: [address-locking-13]
        switch_ports: [Ethernet2]
        mode: access
        vlans: 101
        address_locking:
          ipv4: true
          ipv6: true
