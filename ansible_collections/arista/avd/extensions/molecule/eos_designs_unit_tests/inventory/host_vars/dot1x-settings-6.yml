---
# Test for 802.1X device profiling with LLDP disabled and DHCP non-default options.
type: l2leaf
l2leaf:
  defaults:
  nodes:
    - name: dot1x-settings-6
      mgmt_ip: 192.168.0.2/24
      platform: no_address_locking_platform

# Verify DHCP profiling is allowed when Address Locking is configured but unsupported by the platform.
custom_platform_settings:
  - platforms:
      - no_address_locking_platform
    feature_support:
      address_locking:
        supported: false
      dot1x_bpdu_bypass: false
      dot1x_mac_based_access_list: false

address_locking_settings:
  dhcp_servers_ipv4:
    - 10.0.0.1

dot1x_settings:
  enabled: true
  device_profiling:
    enabled: true
    dhcp:
      hostname:
        enabled: false
      parameter_request_list:
        auth_only: true
      vendor_class_id:
        enabled: false
    lldp:
      enabled: false

aaa_settings:
  radius:
    servers:
      - host: agni.arista.com
        cleartext_key: super-secret-key

port_profiles:
  - profile: DOT1X_MAC_BASED_ACCESS_LIST
    dot1x:
      mac_based_access_list: true

servers:
  - name: DOT1X_SERVER
    adapters:
      - switches: [dot1x-settings-6]
        switch_ports: [Ethernet1]
        endpoint_ports: [Eth0]
        dot1x:
          mac_based_access_list: true

network_ports:
  - switches: [dot1x-settings-6]
    switch_ports: [Ethernet2]
    dot1x:
      mac_based_access_list: true
  - switches: [dot1x-settings-6]
    switch_ports: [Ethernet3]
    profile: DOT1X_MAC_BASED_ACCESS_LIST
