---

default_node_types:
  - node_type: spine
    match_hostnames:
      - ".*spine"
  - node_type: l3leaf
    match_hostnames:
      - ".*leaf.*"

default_interfaces:
  - types: [spine]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    downlink_interfaces: [Ethernet1-8]
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    downlink_interfaces: [Ethernet8]

underlay_ipv6: true
underlay_ipv6_numbered: true

spine:
  defaults:
    id: 10
    platform: vEOS-lab
    router_id_pool: 10.255.0.0/24
    loopback_ipv6_pool: 2001:DB8:0::/48
    bgp_as: 65100

  nodes:
    - name: ipv6-downlink-pools-spine
      id: 1
      mgmt_ip: 192.168.1.35/24
      downlink_pools:
        - ipv6_pool: 2001:DB8:12::/48
          downlink_interfaces: [Ethernet1-8]

l3leaf:
  defaults:
    platform: vEOS-lab
    router_id_pool: 10.255.1.0/24
    loopback_ipv6_pool: 2001:DB8:13::/48
    # Testing Loopback0 as vtep loopback.
    vtep_loopback: Loopback0
    uplink_switches: ['ipv6-downlink-pools-spine']
    mlag: false
    virtual_router_mac_address: 00:1c:73:00:00:99

  node_groups:
    - group: DC1_L3_LEAF1
      bgp_as: 65101
      nodes:
        - name: ipv6-downlink-pools-leaf1a
          id: 1
          mgmt_ip: 172.16.1.31/24
          uplink_switch_interfaces:
            - Ethernet1
