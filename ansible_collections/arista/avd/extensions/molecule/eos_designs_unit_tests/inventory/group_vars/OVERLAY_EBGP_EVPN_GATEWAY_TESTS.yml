---
type: l3leaf

# using default overlay_routing_protocol: ebgp
evpn_overlay_bgp_rtc: true

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    virtual_router_mac_address: 00:1c:73:00:00:99
    bgp_as: 65233
    platform: vEOS
    mlag: false
  nodes:
    - name: evpn-gateway-all-active-mh-gw
      id: 1
      filter:
        tenants: [ EVPN_GATEWAY_TESTS ]
      mgmt_ip: 192.168.0.204/24
      evpn_route_servers: [evpn-gateway-l2-evpn-role-server]
      evpn_gateway:
        d_path:
          enabled: true
          local_domain_id: "65200:2"
          remote_domain_id: "65100:1"
        all_active_multihoming:
          enabled: true
          evpn_ethernet_segment:
            identifier: 0000:0001:0001:0000:0509
            rt_import: 00:00:00:00:07:09
        evpn_l2:
          enabled: true
        evpn_l3:
          enabled: true
          inter_domain: true
        remote_peers:
          - hostname: DCI_TEST
            ip_address: 192.168.100.10
            bgp_as: 65002
    - name: evpn-gateway-all-active-mh-gw-enabled-d-path-false
      id: 2
      filter:
        tenants: [ EVPN_GATEWAY_TESTS ]
      mgmt_ip: 192.168.0.205/24
      evpn_route_servers: [evpn-gateway-l2-evpn-role-server]
      evpn_gateway:
        d_path:
          enabled: false
          local_domain_id: "65200:1"
          remote_domain_id: "65100:2"
        all_active_multihoming:
          enabled: true
          evpn_ethernet_segment:
            identifier: 0000:0001:0001:0000:0509
            rt_import: 00:00:00:00:07:09
        evpn_l3:
          enabled: true
        remote_peers:
          - hostname: DCI_TEST
            ip_address: 192.168.100.10
            bgp_as: 65002
    - name: evpn-gateway-l2-evpn-role-server
      id: 3
      filter:
        tenants: [ EVPN_GATEWAY_TESTS ]
      mgmt_ip: 192.168.0.206/24
      evpn_role: server
      evpn_gateway:
        evpn_l2:
          enabled: true
        remote_peers:
          - hostname: DCI_TEST
            ip_address: 192.168.100.10
            bgp_as: 65002

    - name: evpn-gateway-l2-l3-disabled
      id: 4
      filter:
        tenants: [ EVPN_GATEWAY_TESTS ]
      mgmt_ip: 192.168.0.207/24
      evpn_role: server

    - name: evpn-l2-multi-domain
      id: 5
      mgmt_ip: 192.168.100.101/24
      evpn_route_servers: [evpn-gateway-l2-l3-disabled]
      filter:
        tenants: [ L2_MULTI_DOMAIN_DISABLED, L2_MULTI_DOMAIN_ENABLED ]
      bgp_as: 65001
      evpn_gateway:
        remote_peers:
          - hostname: DCI_TEST
            ip_address: 192.168.100.10
            bgp_as: 65002
        evpn_l2:
          enabled: true

    - name: evpn-gateway-l3-rd-rt-rewrite
      id: 6
      mgmt_ip: 192.168.0.209/24
      evpn_route_servers: [evpn-gateway-l2-evpn-role-server]
      filter:
        tenants: [ EVPN_GATEWAY_TESTS, RD_RT_REWRITE_PARTIAL_TESTS ]
      evpn_gateway:
        remote_peers:
          - hostname: DCI_TEST
            ip_address: 192.168.100.10
            bgp_as: 65002
        evpn_l3:
          enabled: true
          mode: rd-rt-rewrite

tenants:
  - name: EVPN_GATEWAY_TESTS
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF10
        vrf_vni: 10
        svis:
          - id: 11
            name: VRF10_VLAN11
            enabled: true
            ip_address_virtual: 10.10.11.1/24
          - id: 12
            name: VRF10_VLAN12
            enabled: true
            ip_address_virtual: 10.10.12.1/24
      - name: VRF11
        vrf_vni: 11
        svis:
          - id: 21
            name: VRF11_VLAN21
            enabled: true
            ip_address_virtual: 10.10.21.1/24
          - id: 22
            name: VRF11_VLAN22
            enabled: true
            ip_address_virtual: 10.10.22.1/24
          - id: 300
            name: VRF11_VLAN300
            enabled: true
            ip_virtual_router_addresses:
              - 10.100.100.1
    l2vlans:
      - id: 3401
        name: L2_VLAN3401
      - id: 3402
        name: L2_VLAN3402
  - name: L2_MULTI_DOMAIN_DISABLED
    mac_vrf_vni_base: 10000
    # Test to disable all vlans in Tenant for l2 multi-domain
    evpn_l2_multi_domain: false
    vrfs:
      - name: L2_MULTI_DOMAIN_NEUTRAL_1
        vrf_vni: 10
        svis:
          - id: 110
            name: L2_MULTI_DOMAIN_NEUTRAL
            enabled: true
            ip_address_virtual: 10.1.10.1/24
          - id: 111
            name: L2_MULTI_DOMAIN_ENABLED
            enabled: true
            ip_address_virtual: 10.1.11.1/24
            # Test to enable specific VLAN for l2 multi-domain when disabled on Tenant
            evpn_l2_multi_domain: true
      - name: L2_MULTI_DOMAIN_ENABLED
        vrf_vni: 11
        # Test to enable all vlans in VRF for l2 multi-domain when disabled on Tenant
        evpn_l2_multi_domain: true
        svis:
          - id: 150
            name: L2_MULTI_DOMAIN_NEUTRAL
            enabled: true
            ip_address_virtual: 10.1.50.1/24
          - id: 160
            name: L2_MULTI_DOMAIN_NEUTRAL
            enabled: true
            ip_address_virtual: 10.1.60.1/24
          - id: 170
            name: L2_MULTI_DOMAIN_DISABLED
            enabled: true
            ip_address_virtual: 10.1.70.1/24
            # Test to disable specific VLAN for l2 multi-domain when enabled on VRF
            evpn_l2_multi_domain: false
    l2vlans:
      - id: 180
        name: L2_MULTI_DOMAIN_NEUTRAL
      - id: 190
        name: L2_MULTI_DOMAIN_ENABLED
        # Test to enable specific VLAN for l2 multi-domain when disabled on Tenant
        evpn_l2_multi_domain: true

  - name: L2_MULTI_DOMAIN_ENABLED
    mac_vrf_vni_base: 20000
    # Test to enable all vlans in Tenant for l2 multi-domain
    evpn_l2_multi_domain: true
    vrfs:
      - name: L2_MULTI_DOMAIN_NEUTRAL_2
        vrf_vni: 20
        svis:
          - id: 210
            name: L2_MULTI_DOMAIN_NEUTRAL
            enabled: true
            ip_address_virtual: 10.2.10.1/24
          - id: 211
            name: L2_MULTI_DOMAIN_DISABLED
            enabled: true
            ip_address_virtual: 10.2.11.1/24
             # Test to disable specific VLAN for l2 multi-domain when enabled on Tenant
            evpn_l2_multi_domain: false
      - name: L2_MULTI_DOMAIN_DISBLED
        vrf_vni: 21
        # Test to disable all vlans in VRF for l2 multi-domain when enabled on Tenant
        evpn_l2_multi_domain: false
        svis:
          - id: 250
            name: L2_MULTI_DOMAIN_NEUTRAL
            enabled: true
            ip_address_virtual: 10.2.50.1/24
          - id: 260
            name: L2_MULTI_DOMAIN_NEUTRAL
            enabled: true
            ip_address_virtual: 10.2.60.1/24
          - id: 270
            name: L2_MULTI_DOMAIN_ENABLED
            enabled: true
            ip_address_virtual: 10.2.70.1/24
            # Test to enable specific VLAN in VRF for l2 multi-domain when disabled on VRF
            evpn_l2_multi_domain: true
    l2vlans:
      - id: 280
        name: L2_MULTI_DOMAIN_NEUTRAL
      - id: 290
        name: L2_MULTI_DOMAIN_DISABLED
        # Test to disable specific VLAN for l2 multi-domain when enabled on Tenant
        evpn_l2_multi_domain: false

  - name: RD_RT_REWRITE_PARTIAL_TESTS
    mac_vrf_vni_base: 30000
    vrfs:
      - name: VRF_RT_IMPORT_DOMAIN_ALL_EXPORT_DOMAIN_REMOTE
        vrf_vni: 30
        # Test: rt_export false with rt_export_evpn_remote true (default) generates import domain all + export domain remote
        rt_export: false
        svis:
          - id: 301
            name: VRF_RT_IMPORT_DOMAIN_ALL_EXPORT_DOMAIN_REMOTE_VLAN301
            enabled: true
            ip_address_virtual: 10.3.1.1/24
      - name: VRF_RT_IMPORT_DOMAIN_REMOTE_EXPORT_DOMAIN_ALL
        vrf_vni: 31
        # Test: rt_import false with rt_import_evpn_remote true (default) generates import domain remote + export domain all
        rt_import: false
        svis:
          - id: 302
            name: VRF_RT_IMPORT_DOMAIN_REMOTE_EXPORT_DOMAIN_ALL_VLAN302
            enabled: true
            ip_address_virtual: 10.3.2.1/24
      - name: VRF_RT_IMPORT_LOCAL_NO_EXPORT
        vrf_vni: 32
        # Test: rt_import_evpn_remote false with rt_import true generates local import evpn (no domain), no export
        rt_import_evpn_remote: false
        rt_export: false
        rt_export_evpn_remote: false
        svis:
          - id: 303
            name: VRF_RT_IMPORT_LOCAL_NO_EXPORT_VLAN303
            enabled: true
            ip_address_virtual: 10.3.3.1/24
      - name: VRF_RT_NO_IMPORT_LOCAL_EXPORT
        vrf_vni: 33
        # Test: rt_export_evpn_remote false with rt_export true generates no import, local export evpn (no domain)
        rt_import: false
        rt_import_evpn_remote: false
        rt_export_evpn_remote: false
        svis:
          - id: 304
            name: VRF_RT_NO_IMPORT_LOCAL_EXPORT_VLAN304
            enabled: true
            ip_address_virtual: 10.3.4.1/24
