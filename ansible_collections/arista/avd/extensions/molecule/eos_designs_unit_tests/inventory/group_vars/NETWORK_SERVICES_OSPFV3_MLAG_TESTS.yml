---
# OSPFv3 in network services on an MLAG VTEP pair.
type: l3leaf

l3leaf:
  defaults:
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    virtual_router_mac_address: 00:1c:73:00:dc:01
    bgp_as: 65101
  node_groups:
    - group: NETWORK_SERVICES_OSPFV3_MLAG
      nodes:
        - name: network-services-ospfv3-mlag-a
          id: 1
          mlag_interfaces: [Ethernet5, Ethernet6]
        - name: network-services-ospfv3-mlag-b
          id: 2
          mlag_interfaces: [Ethernet5, Ethernet6]

tenants:
  - name: TENANT_A
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF_A
        vrf_id: 10
        svis:
          # Shared transit segment towards an external router. Both MLAG peers and the external router
          # form OSPFv3 adjacencies. The virtual address is the gateway for statically routed hosts.
          - id: 320
            name: SHARED_TRANSIT
            enabled: true
            vxlan: false
            ipv6_virtual_router_addresses:
              - 2001:db8:320::1
            # The IPv4 opt-out on the SVI must not be reset by the 'nodes' settings.
            nodes:
              - node: network-services-ospfv3-mlag-a
                ip_address: 10.1.32.2/24
                ipv6_address: 2001:db8:320::2/64
              - node: network-services-ospfv3-mlag-b
                ip_address: 10.1.32.3/24
                ipv6_address: 2001:db8:320::3/64
            ospfv3:
              enabled: true
              ipv4:
                enabled: false
          # Point-to-point peering between the two MLAG peers with link-local addressing only.
          - id: 321
            name: P2P_LINK_LOCAL
            enabled: true
            vxlan: false
            ipv6_enable: true
            ospfv3:
              enabled: true
              point_to_point: true

      # OSPFv3 is enabled on both MLAG peers, so they form an adjacency, and on one more SVI on only one of the peers.
      - name: VRF_NODE_SPECIFIC
        vrf_id: 11
        svis:
          - id: 330
            name: MLAG_PEERS_TRANSIT
            enabled: true
            vxlan: false
            nodes:
              - node: network-services-ospfv3-mlag-a
                ipv6_address: 2001:db8:330::2/64
              - node: network-services-ospfv3-mlag-b
                ipv6_address: 2001:db8:330::3/64
            ospfv3:
              enabled: true
          - id: 331
            name: NODE_SPECIFIC_TRANSIT
            enabled: true
            vxlan: false
            nodes:
              - node: network-services-ospfv3-mlag-a
                ipv6_address: 2001:db8:331::2/64
                ospfv3:
                  enabled: true
              - node: network-services-ospfv3-mlag-b
                ipv6_address: 2001:db8:331::3/64
