---
type: l3leaf

l3leaf:
  defaults:
    platform: cEOSLab
    virtual_router_mac_address: 00:1c:73:00:00:99
    loopback_ipv4_pool: 10.1.0.0/24
    vtep_loopback_ipv4_pool: 10.1.1.0/24
    bgp_as: 65000
  nodes:
    - name: LEAF1_DOT1X_EVPN_REDISTRIBUTION_ENABLED
      id: 11
      mgmt_ip: 172.20.20.111/24
    - name: LEAF2_DOT1X_EVPN_REDISTRIBUTION_DISABLED
      id: 12
      mgmt_ip: 172.20.20.112/24
    - name: LEAF1_DOT1X_EVPN_REDISTRIBUTION_ENABLED_VLAN_AWARE_BUNDLES
      id: 13
      mgmt_ip: 172.20.20.113/24
    - name: LEAF2_DOT1X_EVPN_REDISTRIBUTION_DISABLED_VLAN_AWARE_BUNDLES
      id: 14
      mgmt_ip: 172.20.20.114/24

tenants:
  - name: Tenant_A
    mac_vrf_vni_base: 10000
    vrfs:
      - name: DEV
        vrf_id: 500
        svis:
          - id: 100
            name: VRFDEV_VLAN100
            enabled: true
            ip_address_virtual: 192.168.100.1/24
          - id: 200
            name: VRFDEV_VLAN200
            enabled: true
            ip_address_virtual: 192.168.200.1/24
