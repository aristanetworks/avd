---
# RFC5549 link-local MLAG iBGP peering in VRFs without underlay_ipv6, using the shared MLAG peer group.
# Expected with the fix: no change, IPv6 is not activated without underlay_ipv6.
underlay_rfc5549: true
overlay_mlag_rfc5549: true

l3leaf:
  defaults:
    platform: vEOS-lab
    mlag_interfaces: [Ethernet11, Ethernet12]
    virtual_router_mac_address: 00:1c:73:00:00:99
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/24
  node_groups:
    - group: MLAG_VRF_PG_AF_RFC5549_SHARED
      bgp_as: 65105
      nodes:
        - name: mlag-vrf-pg-af-rfc5549-shared-leaf1a
          id: 9
          mgmt_ip: 192.168.201.109/24
        - name: mlag-vrf-pg-af-rfc5549-shared-leaf1b
          id: 10
          mgmt_ip: 192.168.201.110/24
