---
# Test MLAG peer-group selection: ipv4-same-name.
# Ansible replaces this dictionary, so include the parent peer groups as well.
mlag_ipv4_underlay_peer_group: mlag_ipv4_underlay_peer
mlag_ipv4_vrfs_peer_group: mlag_ipv4_vrfs_peer
bgp_peer_groups:
  mlag_ipv4_underlay_peer:
    maximum_routes: 12001
    bfd: true
    cleartext_password: arista
    structured_config:
      description: Selected mlag_ipv4_underlay_peer
  mlag_ipv6_underlay_peer:
    maximum_routes: 12002
    bfd: true
    cleartext_password: arista
    structured_config:
      description: Selected mlag_ipv6_underlay_peer
  mlag_underlay_peer:
    maximum_routes: 12003
    bfd: true
    cleartext_password: arista
    structured_config:
      description: Selected mlag_underlay_peer
  mlag_ipv6_vrfs_peer:
    maximum_routes: 12004
    bfd: true
    cleartext_password: arista
    structured_config:
      description: Selected mlag_ipv6_vrfs_peer
  mlag_vrfs_peer:
    maximum_routes: 12005
    bfd: true
    cleartext_password: arista
    structured_config:
      description: Selected mlag_vrfs_peer
  mlag_ipv4_vrfs_peer:
    name: MLAG-IPv4-UNDERLAY-PEER
    maximum_routes: 99999
    structured_config:
      description: Must be ignored when sharing the underlay group
