---

# L3LS Fabric Values

# If a device is set to "is_deployed: false" at the host_vars level, then shutdown interfaces towards undeployed peers.
shutdown_interfaces_towards_undeployed_peers: true

# If a device is set to "is_deployed: false" at the host_vars level, then shutdown bgp towards undeployed peers.
shutdown_bgp_towards_undeployed_peers: true

# Enable vlan aware bundles
evpn_vlan_aware_bundles: true

# EVPN host flapping settings
evpn_hostflap_detection:
  expiry_timeout: 10

bgp_ecmp: 4

# bgp peer groups passwords
bgp_peer_groups:
  ipv4_underlay_peers:
    name: UNDERLAY-PEERS
    password: "0nsCUm70mvSTxVO0ldytrg=="
  evpn_overlay_peers:
    password: "q+VNViP5i4rVjW1cxFv2wA=="
  mlag_ipv4_underlay_peer:
    name: MLAG-PEERS
    password: "15AwQNBEJ1nyF/kBEtoAGw=="
  # To check when names of mlag_ipv4_underlay_peer and mlag_ipv4_vrfs_peer are same
  # bfd setting and structured_config.description will be ignored.
  mlag_ipv4_vrfs_peer:
    name: MLAG-PEERS
    bfd: false
    structured_config:
      description: Description for mlag_ipv4_vrfs_peer via structured_config
  ipvpn_gateway_peers:
    name: IPVPN-INTERWORKING-PEERS
    password: "nWwwZQLPI34O1AhoANg77g=="

# Spine Switches
spine:
  defaults:
    platform: 7050SX3

    bgp_as: 65001
    loopback_ipv4_pool: 192.168.255.0/24
    bgp_defaults:
      - distance bgp 20 200 200
  nodes:
    - name: dc1-spine1
      id: 1
      mgmt_ip: 192.168.200.101/24
      mac_address: '0c:1d:c0:1d:62:01'
    - name: dc1-spine2
      platform: 7500R
      id: 2
      mgmt_ip: 192.168.200.102/24
      mac_address: '0c:1d:c0:1d:62:01'
    - name: dc1-spine3
      platform: 7800R3
      id: 3
      mgmt_ip: 192.168.200.103/24
      mac_address: '0c:1d:c0:1d:62:01'
    - name: dc1-spine4
      platform: 7280R3
      id: 4
      mgmt_ip: 192.168.200.104/24
      mac_address: '0c:1d:c0:1d:62:01'

# Leaf switch groups
# A maximum of two nodes can form a leaf group
# When two nodes are in a leaf group this will automatically form mlag pair

l3leaf:
  defaults:
    # Set to test automatic uplink/downlink allocation
    max_parallel_uplinks: 2
    # Testing multiple pools and ranges to represent 192.168.255.0-192.168.255.200. This will break into multiple entries in the EVPN overlay prefix-list.
    loopback_ipv4_pool: 192.168.255.0-192.168.255.3, 192.168.255.4/30, 192.168.255.8-192.168.255.200
    loopback_ipv4_offset: 8
    # Testing multiple pools and ranges to represent 192.168.254.0-192.168.254.200. This will break into multiple entries in the EVPN overlay prefix-list.
    vtep_loopback_ipv4_pool: 192.168.254.0-192.168.254.127, 192.168.254.128/26, 192.168.254.192-192.168.254.200
    # Commented out for automatic uplink allocation
    # uplink_interfaces: ['Ethernet1', 'Ethernet2', 'Ethernet3', 'Ethernet4']
    uplink_switches: ['dc1-spine1', 'dc1-spine2', 'dc1-spine3', 'dc1-spine4']
    max_uplink_switches: 8
      # Testing multiple pools and ranges to represent 172.31.254.0/23
    uplink_ipv4_pool: 172.31.254.0/30, 172.31.254.4-172.31.254.127, 172.31.254.128/25, 172.31.255.0/24
    uplink_interface_speed: forced 100gfull
    bgp_defaults: ['distance bgp 20 200 200']
    platform: 7280R
    bgp_as: 65101
    # Commented out for automatic mlag allocation
    # mlag_interfaces: [Ethernet5, Ethernet6]
    mlag_interfaces_speed: 100g
    mlag_peer_l3_vlan: 4090
    mlag_peer_vlan: 4092
    mlag_peer_link_allowed_vlans: "1-4094"
    spanning_tree_mode: mstp
    spanning_tree_root_super: true
    spanning_tree_priority: 4096
    virtual_router_mac_address: 00:dc:00:00:00:0a
    filter:
      tenants: [Tenant_A, Tenant_B, Tenant_C, Tenant_D]
      tags: [opzone, web, app, db, vmotion, nfs, v6wan, v6opzone]
      deny_vrfs: [MULTI_TENANT_VRF_TEST]
    # Testing multiple pools and ranges to represent 10.255.251.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/29, 10.255.251.8-10.255.251.127, 10.255.251.128/25
    # Testing multiple pools and ranges to represent 10.255.252.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/29, 10.255.252.8-10.255.252.127, 10.255.252.128/25
  node_groups:
    - group: DC1_LEAF1
      platform: VEOS
      filter:
        tenants: [all]
        tags: [web, app, erp2, v6wan]
        deny_vrfs: [MULTI_TENANT_VRF_TEST]
      nodes:
        - name: dc1-leaf1a
          id: 1
          rack: "rackA"
          mgmt_ip: 192.168.200.105/24
          mac_address: '0c:1d:c0:1d:62:01'
          # Commented out for automatic downlink allocation on spine
          # uplink_switch_interfaces: [Ethernet1, Ethernet1, Ethernet1, Ethernet1]
          # Test setting loopback0 and the VTEP loopback manually
          loopback_ipv4_address: 192.168.42.42
          vtep_loopback_ipv4_address: 192.168.43.43
    - group: DC1_LEAF2
      bgp_as: 65102
      rack: "rackD"
      mlag: false
      # Test for multiple parallel uplinks
      uplink_switches: ['dc1-spine1', 'dc1-spine2', 'dc1-spine2', 'dc1-spine1', 'dc1-spine3', 'dc1-spine4', 'dc1-spine4', 'dc1-spine3']
      nodes:
        - name: dc1-leaf2a
          id: 2
          rack: "rackC"
          mgmt_ip: 192.168.200.106/24
          mac_address: '0c:1d:c0:1d:62:01'
          ptp:
            enabled: false
            # Test free_running should not render when ptp is not enabled
            free_running:
              enabled: true
          link_tracking:
            enabled: true
            groups:
              - name: l2leaf-server01
                recovery_delay: 301
              - name: l2leaf-server02
                recovery_delay: 300
            # test without downlinks.group, this will take the first link tracking group from above list
            downlinks:
              enabled: true
          # Commented out for automatic downlink allocation on spine
          # uplink_switch_interfaces: [Ethernet2, Ethernet2, Ethernet2, Ethernet2]
        - name: dc1-leaf2b
          id: 3
          mgmt_ip: 192.168.200.107/24
          link_tracking:
            enabled: true
            # test 'downlinks.enabled: true' without link_tracking.groups and downlinks.group
            # this will take the default link tracking group i.e. LT_GROUP1
            downlinks:
              enabled: true
          # Commented out for automatic downlink allocation on spine
          # uplink_switch_interfaces: [Ethernet3, Ethernet3, Ethernet3, Ethernet3]
    - group: DC1_SVC3
      platform: 7050SX3
      bgp_as: 65103
      mlag_port_channel_id: 2000
      mlag_domain_id: custom_mlag_domain_id
      filter:
        tenants: [Tenant_A, Tenant_B, Tenant_C]
        tags: [opzone, web, app, db, vmotion, nfs, wan, erp3, svc3only]
        deny_vrfs: []
      nodes:
        - name: dc1-svc3a
          id: 4
          mgmt_ip: 192.168.200.108/24
          mac_address: '0c:1d:c0:1d:62:01'
          link_tracking:
            enabled: true
            groups:
              - name: link-tracking-group01
                recovery_delay: 350
              - name: link-tracking-group02
                recovery_delay: 500
            # testing downlinks with group defined, this will take the defined link tracking group
            downlinks:
              enabled: true
              group: link-tracking-group02
          # Commented out for automatic downlink allocation on spine
          # uplink_switch_interfaces: [Ethernet4, Ethernet4, Ethernet4, Ethernet4]
        - name: dc1-svc3b
          id: 5
          mgmt_ip: 192.168.200.109/24
          # Commented out for automatic downlink allocation on spine
          # uplink_switch_interfaces: [Ethernet5, Ethernet5, Ethernet5, Ethernet5]
    - group: DC1_BL1
      uplink_interfaces: ['Ethernet1', 'Ethernet2', 'Ethernet3', 'Ethernet4']
      mlag: false
      filter:
        tenants: [all]
        tags: [wan]
        always_include_vrfs_in_tenants: ['Tenant_B']
      structured_config:
        sflow:
          vrfs:
            - name: OOB
              destinations:
                - destination: 192.168.200.10
                - destination: 10.0.200.90
              # Need to overwrite at host var level for platform with different management interface
              # This tests was run with inline Jinja previously
              source_interface: Management0
      # NB - uplink_switch_interfaces Ethernet19-21 are used by MH_LEAF1A, 1B and 2A.
      nodes:
        - name: dc1-bl1a
          id: 6
          bgp_as: 65104
          mgmt_ip: 192.168.200.110/24
          mac_address: '0c:1d:c0:1d:62:01'
          uplink_switch_interfaces: [Ethernet22, Ethernet22, Ethernet22, Ethernet22]
          evpn_gateway:
            remote_peers:
              - hostname: dc1-bl2a
                # Testing below that the override is working
              - hostname: dc1-bl2b
                ip_address: 192.168.42.42  # Should be 192.168.255.17
                bgp_as: 65042  # Should be 65107
            evpn_l2:
              enabled: true
            evpn_l3:
              enabled: true
              inter_domain: true
        - name: dc1-bl1b
          id: 7
          bgp_as: 65105
          mgmt_ip: 192.168.200.111/24
          mac_address: '0c:1d:c0:1d:62:01'
          uplink_switch_interfaces: [Ethernet23, Ethernet23, Ethernet23, Ethernet23]
          evpn_gateway:
            remote_peers:
              - hostname: MY_EVPN_GW1_USER_DEFINED
                ip_address: 1.1.1.1
                bgp_as: 65555
              - hostname: MY_EVPN_GW2_USER_DEFINED
                ip_address: 2.2.2.2
                bgp_as: 65555
            evpn_l2:
              enabled: true
            evpn_l3:
              enabled: true
              inter_domain: false
    - group: DC1_BL2
      uplink_interfaces: ['Ethernet1', 'Ethernet2', 'Ethernet3', 'Ethernet4']
      mlag: false
      filter:
        tenants: [all]
        tags: [wan]
        always_include_vrfs_in_tenants: ['Tenant_B']
      nodes:
        - name: dc1-bl2a
          platform: 7280R2
          id: 8
          bgp_as: 65106
          mgmt_ip: 192.168.200.117/24
          mac_address: '0c:1d:c0:1d:62:01'
          uplink_switch_interfaces: [Ethernet24, Ethernet24, Ethernet24, Ethernet24]
          ipvpn_gateway:
            enabled: true
            evpn_domain_id: "65000:3"
            ipvpn_domain_id: "65000:4"
            maximum_routes: 50000
            local_as: 65001
            remote_peers:
              - hostname: rr1
                ip_address: 100.70.0.1
                bgp_as: 64512
              - hostname: rr2
                ip_address: 100.70.0.2
                bgp_as: 64512
            address_families: [vpn-ipv4, vpn-ipv6]
        - name: dc1-bl2b
          platform: 7280R3
          id: 9
          bgp_as: 65107
          mgmt_ip: 192.168.200.118/24
          mac_address: '0c:1d:c0:1d:62:01'
          uplink_switch_interfaces: [Ethernet25, Ethernet25, Ethernet25, Ethernet25]
          # Testing vpn-ipv6 alone
          ipvpn_gateway:
            enabled: true
            evpn_domain_id: "65000:3"
            ipvpn_domain_id: "65000:4"
            maximum_routes: 50000
            local_as: 65001
            remote_peers:
              - hostname: rr1
                ip_address: 100.70.0.1
                bgp_as: 64512
              - hostname: rr2
                ip_address: 100.70.0.2
                bgp_as: 64512
            address_families: [vpn-ipv6]
    - group: DC1_CL1
      mlag: true
      uplink_interfaces: ['Ethernet1', 'Ethernet2', 'Ethernet3', 'Ethernet4']
      evpn_services_l2_only: true
      filter:
        tenants: [Tenant_A, Tenant_B, Tenant_C]
        tags: [opzone, web, app, db, vmotion, nfs, wan]
      nodes:
        - name: dc1-cl1a
          platform: 7368X4
          id: 10
          bgp_as: 65108
          mgmt_ip: 192.168.200.119/24
          uplink_switch_interfaces: [Ethernet26, Ethernet26, Ethernet26, Ethernet26]
          mlag_ibgp_origin_incomplete: false
        - name: dc1-cl1b
          platform: 7300X3
          id: 11
          bgp_as: 65109
          mgmt_ip: 192.168.200.120/24
          uplink_switch_interfaces: [Ethernet27, Ethernet27, Ethernet27, Ethernet27]
    - group: DC1_UNDEPLOYED_LEAF1
      platform: my_custom_platform
      filter:
        tenants: [Tenant_A, Tenant_B, Tenant_C]
        tags: [opzone, web, app, db, vmotion, nfs, wan]
      nodes:
        - name: dc1-undeployed-leaf1a
          id: 13
          bgp_as: 65110
          uplink_switch_interface_speed: 100g-2
          mgmt_ip: 192.168.200.121/24
          uplink_switch_interfaces: [Ethernet28, Ethernet28, Ethernet28, Ethernet28]
        - name: dc1-undeployed-leaf1b
          id: 14
          bgp_as: 65111
          mgmt_ip: 192.168.200.122/24
          uplink_switch_interfaces: [Ethernet29, Ethernet29, Ethernet29, Ethernet29]

l2leaf:
  defaults:
    platform: vEOS-LAB
    uplink_switches: [dc1-svc3a, dc1-svc3b]
    uplink_interfaces: [Ethernet1, Ethernet2]
    mlag: true
    mlag_interfaces: [Ethernet3, Ethernet4]
    mlag_peer_vlan: 4091
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
    rack: "rackE"
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/24
  node_groups:
    - group: DC1_L2LEAF1
      mlag_interfaces_speed: forced 40gfull
      uplink_interface_speed: forced 10000full
      uplink_switches: [dc1-leaf2a, dc1-leaf2b]
      short_esi: 0808:0707:0606
      filter:
        tenants: [Tenant_A]
        tags: [opzone, web, app]
      uplink_mtu: 1499
      nodes:
        - name: dc1-l2leaf1a
          id: 8
          mgmt_ip: 192.168.200.112/24
          mac_address: '0c:1d:c0:1d:62:01'
          uplink_switch_interfaces: [Ethernet7, Ethernet7]
          uplink_mtu: 1498
          ptp:
            enabled: true
        - name: dc1-l2leaf1b
          id: 11
          mgmt_ip: 192.168.200.115/24
          mac_address: '0c:1d:c0:1d:62:02'
          uplink_switch_interfaces: [Ethernet8, Ethernet8]
    - group: DC1_L2LEAF2
      mlag_dual_primary_detection: true
      uplink_interface_speed: forced 100gfull
      uplink_switch_interface_speed: 100g-2
      uplink_switch_port_channel_id: 1007 # Test uplink_switch_port_channel_id on mlag l2leaf
      uplink_port_channel_id: 1001 # Test uplink_port_channel_id on mlag l2leaf
      filter:
        always_include_vrfs_in_tenants: [Tenant_A, Tenant_B, Tenant_C]
        tags: [opzone, web, app, db, vmotion, nfs, wan, erp3]
      nodes:
        - name: dc1-l2leaf2a
          id: 9
          mgmt_ip: 192.168.200.113/24
          mac_address: '0c:1d:c0:1d:62:01'
          uplink_switch_interfaces: [Ethernet7, Ethernet7]
        - name: dc1-l2leaf2b
          id: 10
          mgmt_ip: 192.168.200.114/24
          mac_address: '0c:1d:c0:1d:62:01'
          uplink_switch_interfaces: [Ethernet8, Ethernet8]
    - group: DC1_L2LEAF3
      uplink_switches: [dc1-leaf2a, dc1-leaf2b]
      short_esi: 0606:0707:0808
      filter:
        tenants: [Tenant_A]
        tags: [opzone, web, app]
      nodes:
        - name: dc1-l2leaf3a
          # Testing no id for an L2 Leaf when not needed
          # id: 12
          mgmt_ip: 192.168.200.116/24
          mac_address: '0c:1d:c0:1d:62:01'
          uplink_switch_interfaces: [Ethernet9, Ethernet9]
    - group: DC1_L2LEAF4
      uplink_switches: [dc1-leaf2a, dc1-leaf2b]
      short_esi: auto # Test Auto ESI
      filter:
        tenants: [Tenant_A]
        tags: [opzone, web, app]
      nodes:
        - name: dc1-l2leaf4a
          id: 13
          mgmt_ip: 192.168.200.119/24
          uplink_switch_interfaces: [Ethernet13, Ethernet13]
          uplink_switch_port_channel_id: 1013 # Test uplink_switch_port_channel_id on non-mlag l2leaf
          uplink_port_channel_id: 1001 # Test uplink_port_channel_id on non-mlag l2leaf
    # This pair to demo Auto ESI and automatic uplinks for l2leaf
    - group: DC1_L2LEAF5
      uplink_switches: [dc1-leaf2a, dc1-leaf2b]
      short_esi: auto # Test Auto ESI to MLAG pair
      filter:
        tenants: [Tenant_A]
        tags: [opzone, web, app]
      nodes:
        # Testing with l2 leaf in MLAG with dotted hostnames
        - name: dc1.l2leaf5a
          id: 14
          mgmt_ip: 192.168.200.120/24
        - name: dc1.l2leaf5b
          id: 15
          mgmt_ip: 192.168.200.121/24
    # Example for issue 4124
    - group: DC1_L2LEAF6
      short_esi: auto # Test Auto ESI to MLAG pair
      nodes:
        - name: dc1.l2leaf6a
          id: 16
          mgmt_ip: 192.168.200.122/24
          uplink_interfaces: [Ethernet1]
          uplink_switches: [dc1-leaf2a]
          uplink_switch_interfaces: [Ethernet30]
        - name: dc1.l2leaf6b
          id: 17
          mgmt_ip: 192.168.200.123/24
          uplink_interfaces: [Ethernet1]
          uplink_switches: [dc1-leaf2b]
          uplink_switch_interfaces: [Ethernet31]
      # Node to test structured configs for underlay_l2 uplinks.
    - group: DC1_L2LEAF7
      nodes:
        - name: dc1.l2leaf7a
          id: 18
          mgmt_ip: 192.168.200.124/24
          uplink_interfaces: [Ethernet1]
          uplink_switches: [dc1-leaf2a]
          uplink_switch_interfaces: [Ethernet32]
          # Structured config applied to uplink port-channel.
          uplink_switch_port_channel_structured_config:
            description: description through uplink_switch_port_channel_structured_config(dc1.l2leaf7a)
          # Structured_config applied to member interfaces of uplink port-channel.
          uplink_switch_ethernet_structured_config:
            description: description through uplink_switch_ethernet_structured_config(dc1.l2leaf7a)

    # Nodes to test uplink_type: l2-ethernet
    # Testing a ring topology with DC-L2LEAF8A-C, a bidirectional child ring with DC-L2LEAF8D-E,
    # and a parallel child ring with DC-L2LEAF8F-G where the 8g -> 8f uplink is intentionally omitted.
    #
    # dc1-leaf2a Et33 <-> Et1 dc1-l2leaf8a Et2 <-> Et1 dc1-l2leaf8b Et2 <-> Et2 dc1-l2leaf8c Et1 <-> Et33 dc1-leaf2b
    #                            | Et3                                              Et3 |
    #                            |                                                      |
    #                            |    Et1 dc1-l2leaf8d Et2 <-> Et1 dc1-l2leaf8e Et2     |
    #                            |______________________________________________________|
    #
    #                            | Et4                                              Et4 |
    #                            |                                                      |
    #                            |    Et1 dc1-l2leaf8f Et2 --> Et1 dc1-l2leaf8g Et2     |
    #                            |______________________________________________________|
    - group: DC1_L2LEAF8
      mlag: false
      uplink_type: l2-ethernet
      nodes:
        - name: dc1-l2leaf8a
          mgmt_ip: 192.168.200.125/24
          uplink_interfaces: [Ethernet1, Ethernet2]
          uplink_switches: [dc1-leaf2a, dc1-l2leaf8b]
          uplink_switch_interfaces: [Ethernet33, Ethernet1]
          # Structured_config applied to uplink switch's ethernet interface for uplink-type l2-ethernet.
          uplink_switch_ethernet_structured_config:
            description: description through uplink_switch_ethernet_structured_config(dc1-l2leaf8a)
        - name: dc1-l2leaf8b
          mgmt_ip: 192.168.200.126/24
          uplink_interfaces: [Ethernet1, Ethernet2]
          uplink_switches: [dc1-l2leaf8a, dc1-l2leaf8c]
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
        - name: dc1-l2leaf8c
          mgmt_ip: 192.168.200.127/24
          uplink_interfaces: [Ethernet1, Ethernet2]
          uplink_switches: [dc1-leaf2b, dc1-l2leaf8b]
          uplink_switch_interfaces: [Ethernet33, Ethernet2]
        # The next two switches sit on another child ring with stricter VLAN filtering (don't do this at home kids!)
        # Also see network_ports in DC1_SERVERS.yml.
        - name: dc1-l2leaf8d
          mgmt_ip: 192.168.200.128/24
          uplink_interfaces: [Ethernet1, Ethernet2]
          uplink_switches: [dc1-l2leaf8a, dc1-l2leaf8e]
          uplink_switch_interfaces: [Ethernet3, Ethernet1]
          filter:
            only_vlans_in_use: true
        - name: dc1-l2leaf8e
          mgmt_ip: 192.168.200.129/24
          uplink_interfaces: [Ethernet1, Ethernet2]
          uplink_switches: [dc1-l2leaf8d, dc1-l2leaf8c]
          uplink_switch_interfaces: [Ethernet2, Ethernet3]
          inband_mgmt_vlan: 110 # Existing vlan in network services.
          inband_mgmt_ip: 10.10.10.129/24
          filter:
            only_vlans_in_use: true
        # The next two switches sit on a parallel child ring with same vlans as 8d/8e but without bidirection definition of uplinks.
        # This should show why bidirectional definitions are required to get consistent vlan lists across the ring.
        # Also see network_ports in DC1_SERVERS.yml.
        - name: dc1-l2leaf8f
          mgmt_ip: 192.168.200.130/24
          uplink_interfaces: [Ethernet1, Ethernet2]
          uplink_switches: [dc1-l2leaf8a, dc1-l2leaf8g]
          uplink_switch_interfaces: [Ethernet4, Ethernet1]
          filter:
            only_vlans_in_use: true
        - name: dc1-l2leaf8g
          mgmt_ip: 192.168.200.131/24
          # Notice that 8g does not declare uplink to 8f, so vlans only used on 8g (110->inband mgmt & 111)
          # will not get configured on 8f and not allowed on the trunk between them.
          # This is why configuring uplinks in both directions is required for full vlan redundancy.
          uplink_interfaces: [Ethernet2]
          uplink_switches: [dc1-l2leaf8c]
          uplink_switch_interfaces: [Ethernet4]
          inband_mgmt_vlan: 110 # Existing vlan in network services.
          inband_mgmt_ip: 10.10.10.131/24
          filter:
            only_vlans_in_use: true

    # Minimal topology for asymmetric parent VLAN availability across split port-channel parents.
    # Parent A has VLANs 3901 and 3902, parent B has only VLAN 3902, and the child has both VLANs.
    # This test verifies that only 3902 is configured on both uplinks for `dc1-l2-child-asymmetric-2`
    # and that `dc1-l2-child-asymmetric-1` keeps the non-breaking behavior.
    - group: DC1_L2LEAF9
      mlag: false
      uplink_type: port-channel
      nodes:
        - name: dc1-l2-parent-a
          mgmt_ip: 192.168.200.132/24
          uplink_interfaces: []
          uplink_switches: []
          uplink_switch_interfaces: []
          filter:
            tenants: [Tenant_PARENT_A, Tenant_PARENT_B]
            tags: [parent-a, parent-b]
        - name: dc1-l2-parent-b
          mgmt_ip: 192.168.200.133/24
          uplink_interfaces: []
          uplink_switches: []
          uplink_switch_interfaces: []
          filter:
            tenants: [Tenant_PARENT_B]
            tags: [parent-b]
        - name: dc1-l2-child-asymmetric-1
          mgmt_ip: 192.168.200.134/24
          uplink_interfaces: [Ethernet1, Ethernet2]
          uplink_switches: [dc1-l2-parent-a, dc1-l2-parent-b]
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
          filter:
            tenants: [Tenant_PARENT_A, Tenant_PARENT_B]
            tags: [parent-a, parent-b]
        - name: dc1-l2-child-asymmetric-2
          mgmt_ip: 192.168.200.135/24
          uplink_interfaces: [Ethernet1, Ethernet2]
          uplink_switches: [dc1-l2-parent-a, dc1-l2-parent-b]
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
          filter:
            tenants: [Tenant_PARENT_A, Tenant_PARENT_B]
            tags: [parent-a, parent-b]

# Update p2p mtu 9000 -> 1500
p2p_uplinks_mtu: 1500

# Adjust default bfd values
bfd_multihop:
  interval: 1200
  min_rx: 1200
  multiplier: 3

custom_structured_configuration_prefix: ['my_dci_', 'my_special_dci_', 'override_']

# Set Hardware Speed Groups per platform
platform_speed_groups:
  - platform: 7280R             # Only setting speed-groups on 7280R platform, so only L3leaf should get this setting.
    speeds:
      - speed: 25G
        speed_groups: [3, 2, 5/1]    # Unsorted order, but we should sort output correctly.
      - speed: 10G
        speed_groups: [1, 2, 4] # Duplicate speed-group 2. Since we sort on key first the result will be 25G for group 2
  - platform: my_custom_platform
    speeds:
      - speed: 10G
        speed_groups: [3, 2, 5/1]
      - speed: 25G
        speed_groups: [1, 2, 4]

# Set Aboot password with sha512 hash
override_boot:
  secret:
    key: a153de6290ff1409257ade45f
