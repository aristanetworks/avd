---
underlay_filter_peer_as: true

l3leaf:
  defaults:
    evpn_role: none
  nodes:
    - name: underlay-filter-peer-as-l3leaf1
      bgp_as: 65001
      uplink_switches: [underlay-filter-peer-as-spine1, underlay-filter-peer-as-spine2]
      uplink_interfaces: [Ethernet1, Ethernet2]
      uplink_switch_interfaces: [Ethernet1, Ethernet1]
      loopback_ipv4_pool: 192.168.255.0/24
      loopback_ipv4_offset: 2
      vtep_loopback_ipv4_pool: 192.168.254.0/24
      uplink_ipv4_pool: 192.168.0.0/24
      virtual_router_mac_address: 00:11:22:33:44:55
      id: 1

spine:
  defaults:
    evpn_role: none
    loopback_ipv4_pool: 192.168.255.0/24
    bgp_as: 65000
  nodes:
    - name: underlay-filter-peer-as-spine1
      id: 1
    - name: underlay-filter-peer-as-spine2
      id: 2
