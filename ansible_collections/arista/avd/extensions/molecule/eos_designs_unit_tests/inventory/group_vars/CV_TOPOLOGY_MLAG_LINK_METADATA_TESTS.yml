---
type: "l2leaf"
use_cv_topology: true

cv_topology_levels:
  - type: "l2leaf"
    level: 1

# Crossed MLAG ports are deliberately listed out of natural order.
cv_topology:
  - hostname: "cv-topology-mlag-link-metadata-tests-leaf1"
    platform: "vEOS-lab"
    interfaces:
      - name: "Ethernet8"
        neighbor: "cv-topology-mlag-link-metadata-tests-leaf2"
        neighbor_interface: "Ethernet3"
      - name: "Ethernet10"
        neighbor: "cv-topology-mlag-link-metadata-tests-leaf2"
        neighbor_interface: "Ethernet5"
      - name: "Ethernet7"
        neighbor: "cv-topology-mlag-link-metadata-tests-leaf2"
        neighbor_interface: "Ethernet4"
      - name: "Ethernet9"
        neighbor: "cv-topology-mlag-link-metadata-tests-leaf2"
        neighbor_interface: "Ethernet6"
  - hostname: "cv-topology-mlag-link-metadata-tests-leaf2"
    platform: "vEOS-lab"
    interfaces:
      - name: "Ethernet6"
        neighbor: "cv-topology-mlag-link-metadata-tests-leaf1"
        neighbor_interface: "Ethernet9"
      - name: "Ethernet3"
        neighbor: "cv-topology-mlag-link-metadata-tests-leaf1"
        neighbor_interface: "Ethernet8"
      - name: "Ethernet5"
        neighbor: "cv-topology-mlag-link-metadata-tests-leaf1"
        neighbor_interface: "Ethernet10"
      - name: "Ethernet4"
        neighbor: "cv-topology-mlag-link-metadata-tests-leaf1"
        neighbor_interface: "Ethernet7"
  - hostname: "cv-topology-mlag-without-metadata-tests-leaf1"
    platform: "vEOS-lab"
    interfaces:
      - name: "Ethernet7"
        neighbor: "cv-topology-mlag-without-metadata-tests-leaf2"
        neighbor_interface: "Ethernet4"
      - name: "Ethernet8"
        neighbor: "cv-topology-mlag-without-metadata-tests-leaf2"
        neighbor_interface: "Ethernet3"
  - hostname: "cv-topology-mlag-without-metadata-tests-leaf2"
    platform: "vEOS-lab"
    interfaces:
      - name: "Ethernet3"
        neighbor: "cv-topology-mlag-without-metadata-tests-leaf1"
        neighbor_interface: "Ethernet8"
      - name: "Ethernet4"
        neighbor: "cv-topology-mlag-without-metadata-tests-leaf1"
        neighbor_interface: "Ethernet7"

l2leaf:
  defaults:
    platform: "vEOS-lab"
    mlag_peer_ipv4_pool: "10.255.252.0/24"
  node_groups:
    - group: "CV_TOPOLOGY_MLAG_LINK_METADATA_TESTS"
      mlag_interfaces_metadata:
        - transceiver: "Arista SFP-10G-SR"
          peer_transceiver: "Arista SFP-10G-SRL"
          media: "OM4"
          cable_path: "A"
        - transceiver: "Arista SFP-10G-LR"
          peer_transceiver: "Arista SFP-10G-LRL"
          media: "SM"
          cable_path: "B"
        - {}
      nodes:
        - name: "cv-topology-mlag-link-metadata-tests-leaf1"
          id: 1
        - name: "cv-topology-mlag-link-metadata-tests-leaf2"
          id: 2
    - group: "CV_TOPOLOGY_MLAG_WITHOUT_METADATA_TESTS"
      nodes:
        - name: "cv-topology-mlag-without-metadata-tests-leaf1"
          id: 1
        - name: "cv-topology-mlag-without-metadata-tests-leaf2"
          id: 2
