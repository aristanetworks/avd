---
# VRF across multiple tenants with MLAG IBGP peering enabled
# This tests that the same VRF can be defined in multiple tenants without
# causing duplicate MLAG L3 peering VLAN interface conflicts

default_node_types:
  - node_type: spine
    match_hostnames:
      - "MLAG-MULTI-TENANT-VRF-SPINE.*"
  - node_type: l3leaf
    match_hostnames:
      - "MLAG-MULTI-TENANT-VRF-L3LEAF1.*"

spine:
  defaults:
    platform: vEOS-LAB
    bgp_as: 65100
    loopback_ipv4_pool: 192.168.255.0/24
  nodes:
    - name: MLAG-MULTI-TENANT-VRF-SPINE1
      id: 1
      mgmt_ip: 192.168.201.101/24

l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 192.168.255.0/24
    loopback_ipv4_offset: 100
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    uplink_ipv4_pool: 172.31.255.0/24
    uplink_switches: [MLAG-MULTI-TENANT-VRF-SPINE1]
    uplink_interfaces: [Ethernet1]
    mlag_interfaces: [Ethernet3, Ethernet4]
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    virtual_router_mac_address: 00:1c:73:00:dc:01
  node_groups:
    - group: MLAG_MULTI_TENANT_VRF_L3LEAF1
      bgp_as: 65101
      nodes:
        - name: MLAG-MULTI-TENANT-VRF-L3LEAF1A
          id: 1
          mgmt_ip: 192.168.201.201/24
          uplink_switch_interfaces: [Ethernet1]
        - name: MLAG-MULTI-TENANT-VRF-L3LEAF1B
          id: 2
          mgmt_ip: 192.168.201.202/24
          uplink_switch_interfaces: [Ethernet2]

tenants:
  # Test case matching issue #6629
  # Tenant with SVIs and enable_mlag_ibgp_peering_vrfs at tenant level
  - name: TenantCustomer1
    enable_mlag_ibgp_peering_vrfs: true
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF-INFRA-MIRROR
        vrf_id: 14
        vrf_vni: 9014
        svis:
          - id: 3423
            name: MDR-COLLECTORS
            enabled: true
            ip_address_virtual: 100.74.2.129/29

  # Tenant with only loopbacks and enable_mlag_ibgp_peering_vrfs at VRF level
  # Same VRF name as in TenantCustomer1 - this should work without conflicts
  - name: VRF-INFRA-MIRROR
    vrfs:
      - name: VRF-INFRA-MIRROR
        vrf_id: 14
        vrf_vni: 9014
        enable_mlag_ibgp_peering_vrfs: true
        loopbacks:
          - node: MLAG-MULTI-TENANT-VRF-L3LEAF1A
            ip_address: 172.26.128.12/32
            loopback: 20
            description: VRF-INFRA-MIRROR
            enabled: true
          - node: MLAG-MULTI-TENANT-VRF-L3LEAF1B
            ip_address: 172.26.128.13/32
            loopback: 20
            description: VRF-INFRA-MIRROR
            enabled: true

