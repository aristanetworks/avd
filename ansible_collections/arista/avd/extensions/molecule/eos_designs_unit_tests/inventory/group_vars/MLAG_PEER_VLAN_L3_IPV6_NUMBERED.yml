---
# Testing numbered IPv6 underlay using the MLAG peer VLAN for L3 peering.
# The MLAG peer VLAN IPv6 addresses are used for the underlay and VRF MLAG iBGP peerings, so 'mlag_peer_l3_ipv6_pool' is not needed.
underlay_ipv6: true
underlay_ipv6_numbered: true

avd_design_future:
  fix_match_ipv6_prefix_list_on_mlag_route_map: true

l3leaf:
  defaults:
    platform: vEOS-LAB
    router_id_pool: 10.10.50.0/24
    loopback_ipv6_pool: 2001:DB8:50::/48
    vtep_loopback_ipv6_pool: 2001:DB8:51::/48
    mlag_interfaces: [Ethernet5, Ethernet6]
    mlag_peer_address_family: ipv6
    mlag_peer_ipv6_pool: 2001:DB8:52::/48
    mlag_peer_l3_vlan: 0
    virtual_router_mac_address: 00:1c:73:00:00:99
  node_groups:
    - group: MLAG_PEER_VLAN_L3_IPV6_NUMBERED
      bgp_as: 65150
      nodes:
        - name: mlag-peer-vlan-l3-ipv6-numbered-l3leaf1a
          id: 1
          mgmt_ip: 192.168.201.120/24
        - name: mlag-peer-vlan-l3-ipv6-numbered-l3leaf1b
          id: 2
          mgmt_ip: 192.168.201.121/24

tenants:
  - name: TENANT1
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF10
        vrf_vni: 10
        svis:
          - id: 11
            name: VRF10_VLAN11
            ipv6_address_virtuals: [2001:DB8:11::1/64]
      - name: VRF11
        vrf_vni: 11
        # Covers the IPv6 prefix-list matching the MLAG peer VLAN subnet.
        redistribute_mlag_ibgp_peering_vrfs: false
        svis:
          - id: 21
            name: VRF11_VLAN21
            ipv6_address_virtuals: [2001:DB8:21::1/64]
