---
# IPv4 baseline with only fix_mlag_vrf_peer_group_address_families enabled.
# Configuring the dedicated peer group with the shared group's name must retain shared-group behavior.
bgp_peer_groups:
  mlag_ipv4_vrfs_peer:
    name: MLAG-IPv4-UNDERLAY-PEER

l3leaf:
  defaults:
    platform: vEOS-lab
    mlag_interfaces: [Ethernet11, Ethernet12]
    virtual_router_mac_address: 00:1c:73:00:00:99
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
  node_groups:
    - group: MLAG_VRF_PG_AF_STANDALONE_BASELINE_SHARED_NAME
      bgp_as: 65120
      nodes:
        - name: mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1a
          id: 19
          mgmt_ip: 192.168.201.119/24
        - name: mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1b
          id: 20
          mgmt_ip: 192.168.201.120/24

tenants:
  - name: TENANT_MLAG_VRF_PG_AF
    mac_vrf_vni_base: 10000
    vrfs:
      - name: VRF_IPV4
        vrf_vni: 20
        svis:
          - id: 120
            name: VLAN120_IPV4
            ip_address_virtual: 10.10.120.1/24
