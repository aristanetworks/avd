---
# IPv4 baseline using a dedicated MLAG VRF peer group.
avd_design_future:
  only_configure_mlag_vrfs_peer_group_when_used: true

bgp_peer_groups:
  mlag_ipv4_vrfs_peer:
    name: MLAG-IPv4-VRFS-PEER

l3leaf:
  defaults:
    platform: vEOS-lab
    mlag_interfaces: [Ethernet11, Ethernet12]
    virtual_router_mac_address: 00:1c:73:00:00:99
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
  node_groups:
    - group: MLAG_VRF_PG_AF_BASELINE_DEDICATED
      bgp_as: 65121
      nodes:
        - name: mlag-vrf-pg-af-baseline-dedicated-leaf1a
          id: 21
          mgmt_ip: 192.168.201.121/24
        - name: mlag-vrf-pg-af-baseline-dedicated-leaf1b
          id: 22
          mgmt_ip: 192.168.201.122/24
