---
underlay_routing_protocol: none
overlay_routing_protocol: none

ntp_settings:
  authenticate: true
  set_first_ntp_server_as_preferred: false

devices:
  - name: ntp-settings-profile-per-device-l3leaf
    profile: common_device_profile
    type: l3leaf
    id: 1
    # This selector overrides the one inherited from the device profile.
    ntp_settings_profile: l3leaf_ntp_profile
    loopback_ipv4_pool: 192.0.2.0/24
    vtep_loopback_ipv4_pool: 192.0.3.0/24

  - name: ntp-settings-profile-per-device-l3spine
    profile: common_device_profile
    type: l3spine
    id: 2
    # This selector is inherited from the device profile.
    loopback_ipv4_pool: 192.0.4.0/24

device_profiles:
  - name: common_device_profile
    ntp_settings_profile: l3spine_ntp_profile

ntp_settings_profiles:
  # Distinct servers make selector leakage between devices visible.
  - profile: l3leaf_ntp_profile
    server_vrf: default
    servers:
      - name: 192.0.2.123
        iburst: true

  - profile: l3spine_ntp_profile
    server_vrf: default
    servers:
      - name: 192.0.2.124
        burst: true
