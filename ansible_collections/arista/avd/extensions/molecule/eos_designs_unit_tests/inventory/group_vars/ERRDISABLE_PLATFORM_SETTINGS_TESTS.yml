---

custom_platform_settings:
  - platforms:
      - no-errdisable-platform
    feature_support:
      # Top-level errdisable disabled: all errdisable settings are ignored for this platform.
      errdisable: false
  - platforms:
      - custom-errdisable-platform
    feature_support:
      # Custom platform with a subset of causes explicitly disabled.
      errdisable_detect_causes:
        acl: false
        dot1x: false
        storm_control: false
      errdisable_recovery_causes:
        acl: false
        bpduguard: false
        dot1x: false
        storm_control: false

type: l3leaf

l3leaf:
  defaults:
    bgp_as: 65001
    loopback_ipv4_pool: 10.10.10.0/24
    vtep_loopback_ipv4_pool: 10.10.20.0/24
    uplink_ipv4_pool: 10.10.50.0/24
  node_groups:
    - group: errdisable-veos-group
      nodes:
        - name: errdisable-veos-lab
          id: 1
          # Virtual platform: hardware-specific causes should be filtered out.
          platform: vEOS-lab
    - group: errdisable-ceos-group
      nodes:
        - name: errdisable-ceos-lab
          id: 2
          # Virtual platform: hardware-specific causes should be filtered out.
          platform: cEOSLab
          uplink_interfaces:
            - Ethernet1
          uplink_switch_interfaces:
            - Ethernet2
          uplink_switches:
            - errdisable-veos-lab
    - group: errdisable-7280r-group
      nodes:
        - name: errdisable-7280r
          id: 3
          # Physical platform: all causes should pass through unfiltered.
          platform: 7280R
          uplink_interfaces:
            - Ethernet1
          uplink_switch_interfaces:
            - Ethernet3
          uplink_switches:
            - errdisable-veos-lab
    - group: errdisable-no-errdisable-group
      nodes:
        - name: errdisable-no-errdisable
          id: 4
          # Platform with errdisable: false — all errdisable settings suppressed.
          platform: no-errdisable-platform
          uplink_interfaces:
            - Ethernet1
          uplink_switch_interfaces:
            - Ethernet4
          uplink_switches:
            - errdisable-veos-lab
    - group: errdisable-custom-platform-group
      nodes:
        - name: errdisable-custom-platform
          id: 5
          # Custom platform: acl, dot1x and storm-control causes explicitly disabled.
          platform: custom-errdisable-platform
          uplink_interfaces:
            - Ethernet1
          uplink_switch_interfaces:
            - Ethernet5
          uplink_switches:
            - errdisable-veos-lab

# Test errdisable settings with a mix of hardware-specific and generic causes.
# Hardware-specific causes (e.g., xcvr-*, port-breakout, hardware-speed-group)
# are expected to be filtered out on virtual platforms.
errdisable_settings:
  detect:
    causes:
      - acl
      - arp-inspection
      - dot1x
      - link-change
      - storm-control
      # Expected to be filtered out on virtual platforms (vEOS-lab, cEOSLab)
      - error-correction-encoding
      - hardware-speed-group
      - port-breakout
      - switchcard-unreachable
      - transceiver-adapter
      - xcvr-misconfigured
      - xcvr-overheat
      - xcvr-power-unsupported
  recovery:
    causes:
      - name: acl
        interval: 60
      - name: arp-inspection
        interval: 90
      - name: bpduguard
        interval: 300
      - name: dot1x
        interval: 60
      - name: link-flap
        interval: 60
      - name: storm-control
        interval: 120
      # Expected to be filtered out on virtual platforms (vEOS-lab, cEOSLab)
      - name: error-correction-encoding
        interval: 300
      - name: hardware-speed-group
        interval: 300
      - name: port-breakout
        interval: 300
      - name: switchcard-unreachable
        interval: 300
      - name: transceiver-adapter
        interval: 300
      - name: xcvr-misconfigured
        interval: 300
      - name: xcvr-overheat
        interval: 300
      - name: xcvr-power-unsupported
        interval: 300
      - name: xcvr-unsupported
        interval: 300
    interval: 300
