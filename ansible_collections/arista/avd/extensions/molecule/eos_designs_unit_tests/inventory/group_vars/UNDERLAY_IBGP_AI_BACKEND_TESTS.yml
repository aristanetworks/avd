---
# Testing 'underlay_routing_protocol: ibgp' with BGP settings typical of an AI backend fabric with 2 PODs and super-spines.
# The leaf aggregate address is set with custom structured configuration.

default_node_types:
  - node_type: super-spine
    match_hostnames:
      - underlay-ibgp-ai-ssp\d
  - node_type: spine
    match_hostnames:
      - underlay-ibgp-ai-pod\d-sp\d
  - node_type: l3leaf
    match_hostnames:
      - underlay-ibgp-ai-pod\d-cl\d

underlay_routing_protocol: ibgp
underlay_rfc5549: true
overlay_routing_protocol: none

bgp_peer_groups:
  rr_underlay_peers:
    maximum_routes: 0
  rr_clients_underlay_peers:
    maximum_routes: 0

bgp_distance:
  external_routes: 20
  internal_routes: 200
  local_routes: 200
bgp_graceful_restart:
  enabled: true
  restart_time: 300
bgp_as_notation: asdot
bgp_update_wait_install: true
bgp_maximum_paths: 128
bgp_ecmp: 128

p2p_uplinks_mtu: 9394

super_spine:
  defaults:
    bgp_as: "65000.0"
    loopback_ipv4_pool: 192.168.102.248/29
    bgp_cluster_id: 1.1.1.1
    bgp_defaults:
      - neighbor default send-community
  nodes:
    - name: underlay-ibgp-ai-ssp1
      id: 1
    - name: underlay-ibgp-ai-ssp2
      id: 2

spine:
  defaults:
    bgp_as: "65000.0"
    uplink_switches: [underlay-ibgp-ai-ssp1, underlay-ibgp-ai-ssp2]
    uplink_interfaces: [Ethernet7, Ethernet8]
    bgp_defaults:
      - neighbor default send-community
  node_groups:
    - group: UNDERLAY_IBGP_AI_POD1_SPINES
      loopback_ipv4_pool: 192.168.100.248/29
      bgp_cluster_id: 2.2.2.2
      nodes:
        - name: underlay-ibgp-ai-pod1-sp1
          id: 1
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
        - name: underlay-ibgp-ai-pod1-sp2
          id: 2
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
    - group: UNDERLAY_IBGP_AI_POD2_SPINES
      loopback_ipv4_pool: 192.168.101.248/29
      bgp_cluster_id: 3.3.3.3
      nodes:
        - name: underlay-ibgp-ai-pod2-sp1
          id: 3
          uplink_switch_interfaces: [Ethernet3, Ethernet3]
        - name: underlay-ibgp-ai-pod2-sp2
          id: 4
          uplink_switch_interfaces: [Ethernet4, Ethernet4]

l3leaf:
  defaults:
    bgp_as: "65000.0"
    uplink_interfaces: [Ethernet1, Ethernet2]
    vtep_loopback_ipv4_pool: 192.168.200.0/24
    mlag: false
    bgp_defaults:
      - neighbor default send-community
  node_groups:
    - group: UNDERLAY_IBGP_AI_POD1_LEAVES
      loopback_ipv4_pool: 192.168.100.0/24
      uplink_switches: [underlay-ibgp-ai-pod1-sp1, underlay-ibgp-ai-pod1-sp2]
      nodes:
        - name: underlay-ibgp-ai-pod1-cl1
          id: 1
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
          structured_config:
            router_bgp:
              vrfs:
                - name: default
                  aggregate_addresses:
                    - prefix: 10.10.10.0/24
                      summary_only: true
        - name: underlay-ibgp-ai-pod1-cl2
          id: 2
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
        - name: underlay-ibgp-ai-pod1-cl3
          id: 3
          uplink_switch_interfaces: [Ethernet3, Ethernet3]
        - name: underlay-ibgp-ai-pod1-cl4
          id: 4
          uplink_switch_interfaces: [Ethernet4, Ethernet4]
    - group: UNDERLAY_IBGP_AI_POD2_LEAVES
      loopback_ipv4_pool: 192.168.101.0/24
      uplink_switches: [underlay-ibgp-ai-pod2-sp1, underlay-ibgp-ai-pod2-sp2]
      nodes:
        - name: underlay-ibgp-ai-pod2-cl1
          id: 5
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
        - name: underlay-ibgp-ai-pod2-cl2
          id: 6
          uplink_switch_interfaces: [Ethernet2, Ethernet2]

# GPU facing links, advertised with 'redistribute connected'.
l3_edge:
  p2p_links_ip_pools:
    - name: UNDERLAY_IBGP_AI_GPUS
      ipv4_pool: 10.10.10.0/24
  p2p_links_profiles:
    - name: UNDERLAY_IBGP_AI_GPUS
      speed: 100g
      include_in_underlay_protocol: false
      ip_pool: UNDERLAY_IBGP_AI_GPUS
  p2p_links:
    - id: 1
      profile: UNDERLAY_IBGP_AI_GPUS
      nodes: [underlay-ibgp-ai-pod1-cl1, underlay-ibgp-ai-gpu1]
      interfaces: [Ethernet4, Ethernet1]
    - id: 2
      profile: UNDERLAY_IBGP_AI_GPUS
      nodes: [underlay-ibgp-ai-pod1-cl1, underlay-ibgp-ai-gpu1]
      interfaces: [Ethernet5, Ethernet2]
