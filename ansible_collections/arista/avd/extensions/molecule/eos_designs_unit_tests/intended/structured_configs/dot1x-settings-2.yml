aaa_accounting:
  dot1x:
    default:
      type: stop-only
      methods:
      - multicast: true
        method: group
        group: agni-server-group
      - multicast: true
        method: group
        group: backup-agni-server-group
      - method: logging
aaa_authentication:
  dot1x:
    default: group agni-server-group group backup-agni-server-group
aaa_authorization:
  dynamic:
    dot1x_additional_groups:
    - coa-server-group
aaa_root:
  disabled: true
aaa_server_groups:
- name: agni-server-group
  type: radius
  servers:
  - server: agni.arista.com
    vrf: MGMT
- name: backup-agni-server-group
  type: radius
  servers:
  - server: agni2.arista.com
    vrf: MGMT
- name: coa-server-group
  type: radius
  servers:
  - server: coa.arista.com
    vrf: MGMT
config_end: true
dot1x:
  system_auth_control: true
  protocol_lldp_bypass: true
  protocol_bpdu_bypass: true
  dynamic_authorization: true
  mac_based_authentication:
    delay: 200
    hold_period: 100
  radius_av_pair_username_format:
    delimiter: colon
    mac_string_case: uppercase
  radius_av_pair:
    service_type: true
    framed_mtu: 1500
  captive_portal:
    enabled: true
    url: https://captive.arista.com
    ssl_profile: captive-portal-ssl-profile
    start_limit_infinite: true
    access_list_ipv4: web-acl
enable_password:
  disabled: true
hostname: dot1x-settings-2
ip_access_lists:
- name: web-acl
  entries:
  - sequence: 15
    action: deny
    protocol: tcp
    source: any
    destination: any
    copy_captive_portal: true
ip_igmp_snooping:
  globally_enabled: true
ip_radius:
  vrfs:
  - name: MGMT
    source_interface: Management1
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.2/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
radius_server:
  vrfs:
  - name: MGMT
    servers:
    - host: agni.arista.com
      key: 1404071B09166738212B2130365E0C131A
    - host: agni2.arista.com
      key: 00170616014946150A225E4B1D540E120B
    - host: coa.arista.com
      key: 0215114B0E144232494D1B1C115A190E15
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
