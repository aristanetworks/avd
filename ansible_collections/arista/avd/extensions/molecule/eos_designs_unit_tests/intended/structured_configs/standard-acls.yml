aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: standard-acls
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.0.1/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.0.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 192.168.0.1
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
standard_access_lists:
- name: TEST-STANDARD-ACL-PLAIN
  entries:
  - sequence: 10
    action: permit
    source: 10.0.0.0/8
  - sequence: 20
    action: deny
    source: any
- name: TEST-STANDARD-ACL-WITH-COUNTERS
  counters_per_entry: true
  entries:
  - sequence: 10
    action: permit
    source: 192.168.1.1
  - sequence: 20
    action: deny
    source: any
    log: true
- name: TEST-STANDARD-ACL-WITH-REMARK-AND-VLAN
  entries:
  - sequence: 10
    remark: Allow management subnet
  - sequence: 20
    action: permit
    source: 172.16.0.0/12
    vlan: 100
    vlan_mask: '0xFFF'
  - sequence: 30
    action: permit
    source: 172.20.0.0/16
    inner_vlan: 200
    inner_vlan_mask: '0xFFF'
    mirror_session: SESSION1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
