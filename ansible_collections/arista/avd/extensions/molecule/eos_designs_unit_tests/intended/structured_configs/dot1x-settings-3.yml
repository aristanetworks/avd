aaa_authentication:
  dot1x:
    default: group radius
aaa_root:
  disabled: true
config_end: true
dot1x:
  system_auth_control: true
  protocol_lldp_bypass: false
  protocol_bpdu_bypass: false
  dynamic_authorization: false
  radius_av_pair_username_format:
    delimiter: none
    mac_string_case: lowercase
  radius_av_pair:
    service_type: true
enable_password:
  disabled: true
hostname: dot1x-settings-3
ip_igmp_snooping:
  globally_enabled: true
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.2/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
