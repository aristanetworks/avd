aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: ssh-settings-4
ip_access_lists:
- name: ACL-SSH
  entries:
  - sequence: 15
    action: deny
    protocol: ip
    source: any
    destination: any
ip_igmp_snooping:
  globally_enabled: true
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.10.10.43/26
  type: oob
  gateway: 10.10.10.1
management_ssh:
  ip_access_group_in: ACL-SSH-STANDARD
  vrfs:
  - name: default
    enable: true
  - name: VRF1
    enable: true
    ip_access_group_in: ACL-SSH
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
service_routing_protocols_model: multi-agent
standard_access_lists:
- name: ACL-SSH-STANDARD
  entries:
  - sequence: 10
    action: permit
    source: any
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 10.10.10.1
- prefix: 0.0.0.0/0
  next_hop: 10.20.30.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4092
  description: Inband Management
  shutdown: false
  ip_address: 10.20.30.40/24
  mtu: 1500
  metadata:
    type: inband_mgmt
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4092
  name: INBAND_MGMT
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
