aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: source-interfaces-1
ip_http_client:
  source_interface: Vlan4092
  vrfs:
  - name: MGMT
    source_interface: Management1
ip_igmp_snooping:
  globally_enabled: true
ip_ssh_client:
  source_interface: Vlan4092
  vrfs:
  - name: MGMT
    source_interface: Management1
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.2/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
service_routing_protocols_model: multi-agent
static_routes:
- prefix: 0.0.0.0/0
  next_hop: 10.20.30.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4092
  description: Inband Management
  shutdown: false
  ip_address: 10.20.30.40/24
  mtu: 1500
  metadata:
    type: inband_mgmt
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4092
  name: INBAND_MGMT
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
