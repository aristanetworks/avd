aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1.100
  shutdown: false
  encapsulation_dot1q:
    vlan: 100
  ip_address: 10.3.100.1/24
  metadata:
    peer_type: l3_interface
  sflow:
    enable: true
- name: Ethernet1
  shutdown: false
  metadata:
    peer_type: l3_interface
  sflow:
    enable: false
  switchport:
    enabled: false
hostname: sflow-node-l3-interfaces-tests-spine
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.3/32
metadata:
  is_deployed: true
  platform: 7280R
  fabric_name: SFLOW_NODE_L3_INTERFACES_TESTS
platform:
  sand:
    lag:
      hardware_only: true
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 192.168.255.3
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
service_routing_protocols_model: multi-agent
sflow:
  destinations:
  - destination: 10.10.10.10
  run: true
spanning_tree:
  mode: none
tcam_profile:
  system: vxlan-routing
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
