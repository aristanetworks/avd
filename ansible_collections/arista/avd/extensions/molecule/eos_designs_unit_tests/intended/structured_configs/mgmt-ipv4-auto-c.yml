aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: mgmt-ipv4-auto-c
ip_igmp_snooping:
  globally_enabled: true
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: dhcp
  type: oob
  gateway: 192.0.2.1
metadata:
  is_deployed: true
  fabric_name: MGMT_IPV4_AUTO
service_routing_protocols_model: multi-agent
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.0.2.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
