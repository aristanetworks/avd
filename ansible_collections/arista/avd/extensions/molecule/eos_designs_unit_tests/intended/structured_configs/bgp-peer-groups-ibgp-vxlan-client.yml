aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_bgp-peer-groups-3_Ethernet7
  shutdown: false
  mtu: 9214
  ip_address: 192.168.252.213/31
  metadata:
    peer: bgp-peer-groups-3
    peer_interface: Ethernet7
    peer_type: pe
  switchport:
    enabled: false
hostname: bgp-peer-groups-ibgp-vxlan-client
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.115/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65001'
  router_id: 192.168.255.115
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    description: Description for ipv4_underlay_peers via structured_config
    bfd: true
    password: 7x4B4rnJhZB438m9+BrBfQ==
    send_community: all
    maximum_routes: 12001
  - name: EVPN-OVERLAY-CORE
    metadata:
      type: evpn
    description: Description for evpn_overlay_core via structured_config
    update_source: Loopback0
    bfd: false
    ebgp_multihop: 15
    password: 7PAWRjxv8U6PaK1vvQ5mK/7YOTeJ7b4J
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 192.168.252.212
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    metadata:
      peer: bgp-peer-groups-3
    description: bgp-peer-groups-3_Ethernet7
  - ip_address: 192.168.255.116
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65001'
    metadata:
      peer: bgp-peer-groups-ibgp-vxlan-server
    description: bgp-peer-groups-ibgp-vxlan-server_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-CORE
      activate: true
      domain_remote: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: bgp-peer-groups-ibgp-vxlan-client_VTEP
    vxlan:
      source_interface: Loopback0
      udp_port: 4789
