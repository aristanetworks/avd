aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet11
  description: MLAG_ipv6-numbered-vtep-loopback0-leaf1b_Ethernet11
  shutdown: false
  channel_group:
    id: 11
    mode: active
  metadata:
    peer: ipv6-numbered-vtep-loopback0-leaf1b
    peer_interface: Ethernet11
    peer_type: mlag_peer
- name: Ethernet12
  description: MLAG_ipv6-numbered-vtep-loopback0-leaf1b_Ethernet12
  shutdown: false
  channel_group:
    id: 11
    mode: active
  metadata:
    peer: ipv6-numbered-vtep-loopback0-leaf1b
    peer_interface: Ethernet12
    peer_type: mlag_peer
- name: Ethernet1
  description: P2P_ipv6-numbered-vtep-loopback0-spine_Ethernet1
  shutdown: false
  mtu: 9214
  ipv6_address: 2001:db8:2::2/64
  metadata:
    peer: ipv6-numbered-vtep-loopback0-spine
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
hostname: ipv6-numbered-vtep-loopback0-leaf1a
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
ipv6_prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY-V6
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:1::/48 eq 128
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:4::/64
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ipv6_address: 2001:db8:1::1/128
- name: Loopback10
  description: DIAG_VRF_VRF10
  shutdown: false
  vrf: VRF10
  ip_address: 10.255.10.1/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.1.31/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: EOS_DESIGNS_UNIT_TESTS
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: DC1_L3_LEAF1
  local_interface: Vlan4094
  peer_address: 2001:db8:3::2
  peer_link: Port-Channel11
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel11
  description: MLAG_ipv6-numbered-vtep-loopback0-leaf1b_Port-Channel11
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 30
    type: permit
    match:
    - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.255.1.1
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65101'
    description: ipv6-numbered-vtep-loopback0-leaf1b
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv6
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2001:db8:4::2
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: ipv6-numbered-vtep-loopback0-leaf1b
    description: ipv6-numbered-vtep-loopback0-leaf1b_Vlan4093
  - ip_address: 2001:db8:2::1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ipv6-numbered-vtep-loopback0-spine
    description: ipv6-numbered-vtep-loopback0-spine_Ethernet1
  - ip_address: 2001:db8::1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ipv6-numbered-vtep-loopback0-spine
    description: ipv6-numbered-vtep-loopback0-spine_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 11
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.1.1:10011
    route_targets:
      both:
      - 10011:10011
    redistribute_routes:
    - learned
  - id: 12
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.1.1:10012
    route_targets:
      both:
      - 10012:10012
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
  address_family_ipv6:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
  vrfs:
  - name: VRF10
    rd: 10.255.1.1:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.255.1.1
    neighbors:
    - ip_address: 2001:db8:4::2
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: ipv6-numbered-vtep-loopback0-leaf1b_Vlan3009
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
virtual_source_nat_vrfs:
- name: VRF10
  ip_address: 10.255.10.1
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ipv6_address: 2001:db8:4::1/64
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ipv6_address: 2001:db8:3::1/64
  mtu: 9214
  no_autostate: true
- name: Vlan11
  description: VRF10_VLAN11
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.11.1/24
  metadata:
    tenants:
    - TENANT1
- name: Vlan12
  description: VRF10_VLAN12
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.12.1/24
  metadata:
    tenants:
    - TENANT1
- name: Vlan3009
  description: MLAG_L3_VRF_VRF10
  shutdown: false
  vrf: VRF10
  ipv6_address: 2001:db8:4::1/64
  mtu: 9214
  metadata:
    tenants:
    - TENANT1
    type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 11
  name: VRF10_VLAN11
  metadata:
    tenants:
    - TENANT1
- id: 12
  name: VRF10_VLAN12
  metadata:
    tenants:
    - TENANT1
- id: 3009
  name: MLAG_L3_VRF_VRF10
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TENANT1
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF10
  ip_routing: true
  metadata:
    tenants:
    - TENANT1
vxlan_interface:
  vxlan1:
    description: ipv6-numbered-vtep-loopback0-leaf1a_VTEP
    vxlan:
      source_interface: Loopback0
      udp_port: 4789
      encapsulations:
        ipv6: true
      virtual_router_encapsulation_mac_address: mlag-system-id
      vlans:
      - id: 11
        vni: 10011
      - id: 12
        vni: 10012
      vrfs:
      - name: VRF10
        vni: 10
