aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet11
  description: MLAG_mlag-vrf-pg-af-rfc5549-dedicated-leaf1a_Ethernet11
  shutdown: false
  channel_group:
    id: 11
    mode: active
  metadata:
    peer: mlag-vrf-pg-af-rfc5549-dedicated-leaf1a
    peer_interface: Ethernet11
    peer_type: mlag_peer
- name: Ethernet12
  description: MLAG_mlag-vrf-pg-af-rfc5549-dedicated-leaf1a_Ethernet12
  shutdown: false
  channel_group:
    id: 11
    mode: active
  metadata:
    peer: mlag-vrf-pg-af-rfc5549-dedicated-leaf1a
    peer_interface: Ethernet12
    peer_type: mlag_peer
hostname: mlag-vrf-pg-af-rfc5549-dedicated-leaf1b
ip_igmp_snooping:
  globally_enabled: true
ip_routing_ipv6_interfaces: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.12/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.11/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.201.112/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: MLAG_VRF_PEER_GROUP_ADDRESS_FAMILIES
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: MLAG_VRF_PG_AF_RFC5549_DEDICATED
  local_interface: Vlan4094
  peer_address: 10.255.252.20
  peer_link: Port-Channel11
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel11
  description: MLAG_mlag-vrf-pg-af-rfc5549-dedicated-leaf1a_Port-Channel11
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65106'
  router_id: 192.168.255.12
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65106'
    description: mlag-vrf-pg-af-rfc5549-dedicated-leaf1a
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: MLAG-IPv4-VRFS-PEER
    metadata:
      type: ipv4
    remote_as: '65106'
    description: mlag-vrf-pg-af-rfc5549-dedicated-leaf1a
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  neighbor_interfaces:
  - name: Vlan4093
    remote_as: '65106'
    metadata:
      peer: mlag-vrf-pg-af-rfc5549-dedicated-leaf1a
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    description: mlag-vrf-pg-af-rfc5549-dedicated-leaf1a_Vlan4093
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 110
    metadata:
      tenants:
      - TENANT_MLAG_VRF_PG_AF
    rd: 192.168.255.12:10110
    route_targets:
      both:
      - 10110:10110
    redistribute_routes:
    - learned
  - id: 111
    metadata:
      tenants:
      - TENANT_MLAG_VRF_PG_AF
    rd: 192.168.255.12:10111
    route_targets:
      both:
      - 10111:10111
    redistribute_routes:
    - learned
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
      next_hop:
        address_family_ipv6:
          enabled: true
          originate: true
    - name: MLAG-IPv4-VRFS-PEER
      activate: true
      next_hop:
        address_family_ipv6:
          enabled: true
          originate: true
  vrfs:
  - name: VRF_DUAL_STACK
    rd: 192.168.255.12:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 192.168.255.12
    neighbor_interfaces:
    - name: Vlan3009
      remote_as: '65106'
      peer_group: MLAG-IPv4-VRFS-PEER
      description: mlag-vrf-pg-af-rfc5549-dedicated-leaf1a_Vlan3009
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ipv6_enable: true
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.255.252.21/31
  mtu: 9214
  no_autostate: true
- name: Vlan110
  description: VLAN110_IPV4
  shutdown: true
  vrf: VRF_DUAL_STACK
  ip_address_virtual: 10.10.110.1/24
  metadata:
    tenants:
    - TENANT_MLAG_VRF_PG_AF
- name: Vlan111
  description: VLAN111_IPV6
  shutdown: true
  vrf: VRF_DUAL_STACK
  ipv6_enable: true
  ipv6_address_virtuals:
  - 2001:db8:111::1/64
  metadata:
    tenants:
    - TENANT_MLAG_VRF_PG_AF
- name: Vlan3009
  description: MLAG_L3_VRF_VRF_DUAL_STACK
  shutdown: false
  vrf: VRF_DUAL_STACK
  ipv6_enable: true
  mtu: 9214
  metadata:
    tenants:
    - TENANT_MLAG_VRF_PG_AF
    type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 110
  name: VLAN110_IPV4
  metadata:
    tenants:
    - TENANT_MLAG_VRF_PG_AF
- id: 111
  name: VLAN111_IPV6
  metadata:
    tenants:
    - TENANT_MLAG_VRF_PG_AF
- id: 3009
  name: MLAG_L3_VRF_VRF_DUAL_STACK
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TENANT_MLAG_VRF_PG_AF
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF_DUAL_STACK
  ipv6_routing: true
  ip_routing_ipv6_interfaces: true
  metadata:
    tenants:
    - TENANT_MLAG_VRF_PG_AF
vxlan_interface:
  vxlan1:
    description: mlag-vrf-pg-af-rfc5549-dedicated-leaf1b_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
      vlans:
      - id: 110
        vni: 10110
      - id: 111
        vni: 10111
      vrfs:
      - name: VRF_DUAL_STACK
        vni: 10
