aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
errdisable:
  detect:
    causes:
    - link-change
    - acl
    - arp-inspection
    - dot1x
    - storm-control
  recovery:
    causes:
    - name: acl
      interval: 60
    - name: arp-inspection
      interval: 90
    - name: bpduguard
      interval: 300
    - name: dot1x
      interval: 60
    - name: link-flap
      interval: 60
    - name: storm-control
      interval: 120
hostname: errdisable-settings
ip_igmp_snooping:
  globally_enabled: true
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
