aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: evpn-overlay-mpls-route-reflectors3-ibgp
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.4/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.4/32
metadata:
  is_deployed: true
  platform: vEOS
  fabric_name: EOS_DESIGNS_UNIT_TESTS
  validate_hardware:
    enabled: false
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65233'
  router_id: 192.168.255.4
  maximum_paths:
    paths: 4
  bgp_cluster_id: 192.168.255.4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: RR-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65233'
    update_source: Loopback0
    bfd: true
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 192.168.255.2
    peer_group: RR-OVERLAY-PEERS
    metadata:
      peer: evpn-overlay-mpls-route-reflectors2-ibgp
    description: evpn-overlay-mpls-route-reflectors2-ibgp_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    neighbor_default:
      encapsulation: mpls
    peer_groups:
    - name: RR-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: RR-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
tcam_profile: null
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: evpn-overlay-mpls-route-reflectors3-ibgp_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
