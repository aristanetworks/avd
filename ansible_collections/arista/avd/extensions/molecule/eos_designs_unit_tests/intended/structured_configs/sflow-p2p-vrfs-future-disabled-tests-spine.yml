aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet4
  description: P2P_sflow-p2p-vrfs-future-disabled-tests-leaf_Ethernet1
  shutdown: false
  mtu: 9214
  ipv6_enable: true
  metadata:
    peer: sflow-p2p-vrfs-future-disabled-tests-leaf
    peer_interface: Ethernet1
    peer_type: l3leaf
  sflow:
    enable: true
  switchport:
    enabled: false
- name: Ethernet4.100
  description: P2P_sflow-p2p-vrfs-future-disabled-tests-leaf_Ethernet1.100_VRF_IT
  shutdown: false
  vrf: IT
  encapsulation_dot1q:
    vlan: 100
  ipv6_enable: true
  metadata:
    peer: sflow-p2p-vrfs-future-disabled-tests-leaf
    peer_interface: Ethernet1.100
    peer_type: l3leaf
  sflow:
    enable: true
- name: Ethernet4.42
  description: P2P_sflow-p2p-vrfs-future-disabled-tests-leaf_Ethernet1.42_VRF_PROD
  shutdown: false
  vrf: PROD
  encapsulation_dot1q:
    vlan: 42
  ipv6_enable: true
  metadata:
    peer: sflow-p2p-vrfs-future-disabled-tests-leaf
    peer_interface: Ethernet1.42
    peer_type: l3leaf
  sflow:
    enable: true
hostname: sflow-p2p-vrfs-future-disabled-tests-spine
ip_igmp_snooping:
  globally_enabled: true
ip_routing_ipv6_interfaces: true
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.1.73/32
  ipv6_addresses:
  - 2001:2::49/128
metadata:
  is_deployed: true
  platform: 7280R
  fabric_name: EOS_DESIGNS_UNIT_TESTS
platform:
  sand:
    lag:
      hardware_only: true
router_bgp:
  as: '65000'
  router_id: 192.168.1.73
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  neighbor_interfaces:
  - name: Ethernet4
    remote_as: '65000'
    metadata:
      peer: sflow-p2p-vrfs-future-disabled-tests-leaf
    peer_group: IPv4-UNDERLAY-PEERS
    description: sflow-p2p-vrfs-future-disabled-tests-leaf_Ethernet1
  redistribute:
    connected:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
      next_hop:
        address_family_ipv6:
          enabled: true
          originate: true
  address_family_ipv6:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
  vrfs:
  - name: IT
    router_id: 192.168.1.73
    neighbor_interfaces:
    - name: Ethernet4.100
      remote_as: '65000'
      peer_group: IPv4-UNDERLAY-PEERS
      description: sflow-p2p-vrfs-future-disabled-tests-leaf_Ethernet1.100_vrf_IT
  - name: PROD
    router_id: 192.168.1.73
    neighbor_interfaces:
    - name: Ethernet4.42
      remote_as: '65000'
      peer_group: IPv4-UNDERLAY-PEERS
      description: sflow-p2p-vrfs-future-disabled-tests-leaf_Ethernet1.42_vrf_PROD
service_routing_protocols_model: multi-agent
sflow:
  destinations:
  - destination: 10.10.10.10
  run: true
tcam_profile:
  system: vxlan-routing
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
- name: IT
  ip_routing: true
  metadata:
    tenants:
    - TenantA
- name: PROD
  ip_routing: true
  metadata:
    tenants:
    - TenantA
