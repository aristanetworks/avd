aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: underlay-filter-redistribute-connected-to-bgp-without-route-map
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.10.0.3/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.11.0.3/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-SVI-VRF-DEFAULT
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.10.0/24
route_maps:
- name: RM-EVPN-EXPORT-VRF-DEFAULT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-SVI-VRF-DEFAULT
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.10.0.3
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
  vlans:
  - id: 111
    metadata:
      tenants:
      - TEST
    rd: 10.10.0.3:10111
    route_targets:
      both:
      - 10111:10111
    redistribute_routes:
    - learned
  vrfs:
  - name: default
    rd: 10.10.0.3:111
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 111:111
      export:
      - address_family: evpn
        route_targets:
        - 111:111
        - route-map RM-EVPN-EXPORT-VRF-DEFAULT
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan111
  description: svi_with_default_vrf
  shutdown: true
  ip_address: 10.10.10.111/24
  metadata:
    tenants:
    - TEST
    tags:
    - fabric
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 111
  name: svi_with_default_vrf
  metadata:
    tenants:
    - TEST
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: underlay-filter-redistribute-connected-to-bgp-without-route-map_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 111
        vni: 10111
      vrfs:
      - name: default
        vni: 111
