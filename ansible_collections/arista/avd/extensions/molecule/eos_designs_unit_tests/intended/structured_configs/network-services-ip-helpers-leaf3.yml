aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: L2_network-services-ip-helpers-l2leaf_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: network-services-ip-helpers-l2leaf
    peer_interface: Ethernet1
    peer_type: l2leaf
- name: Ethernet2
  description: L2_network-services-ip-helpers-l2leaf_Ethernet2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: network-services-ip-helpers-l2leaf
    peer_interface: Ethernet2
    peer_type: l2leaf
hostname: network-services-ip-helpers-leaf3
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:dc:01
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.0.255.11/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.2.11/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
port_channel_interfaces:
- name: Port-Channel1
  description: L2_network-services-ip-helpers-l2leaf_Port-Channel1
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 11,100
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.0.255.0/24 eq 32
  - sequence: 20
    action: permit 10.255.2.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65001'
  router_id: 192.0.255.11
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 11
    metadata:
      tenants:
      - TEST2
    rd: 192.0.255.11:1011
    route_targets:
      both:
      - 1011:1011
    redistribute_routes:
    - learned
  vrfs:
  - name: IP_HELPERS3
    rd: 192.0.255.11:102
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 102:102
      export:
      - address_family: evpn
        route_targets:
        - 102:102
    router_id: 192.0.255.11
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan11
  description: SVI2
  shutdown: true
  vrf: IP_HELPERS3
  ip_helpers:
  - ip_helper: 1.1.1.4
    source_interface: vlan100
    vrf: INBANDMGMT
  - ip_helper: 1.1.1.5
    source_interface: vlan100
    vrf: INBANDMGMT
  metadata:
    tenants:
    - TEST2
- name: Vlan100
  description: Inband Management
  shutdown: false
  vrf: INBANDMGMT
  ip_address: 192.168.101.2/24
  ip_virtual_router_addresses:
  - 192.168.101.1
  mtu: 1500
  ip_attached_host_route_export:
    enabled: true
    distance: 19
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 11
  name: SVI2
  metadata:
    tenants:
    - TEST2
- id: 100
  name: INBAND_MGMT
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
- name: IP_HELPERS3
  ip_routing: true
  metadata:
    tenants:
    - TEST2
- name: INBANDMGMT
vxlan_interface:
  vxlan1:
    description: network-services-ip-helpers-leaf3_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 11
        vni: 1011
      vrfs:
      - name: IP_HELPERS3
        vni: 102
