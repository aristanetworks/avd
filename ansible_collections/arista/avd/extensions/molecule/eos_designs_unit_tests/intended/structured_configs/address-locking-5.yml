aaa_root:
  disabled: true
address_locking:
  disabled: true
  local_interface: Management1
  locked_address:
    expiration_mac_disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: SERVER_ADDRESS_LOCKING_5_SERVER
  shutdown: false
  address_locking:
    address_family:
      ipv4: true
  metadata:
    peer: ADDRESS_LOCKING_5_SERVER
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
    mode: access
    access_vlan: 101
hostname: address-locking-5
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:dc:00:00:00:0a
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.109/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.109/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 1.1.10.10
  type: oob
metadata:
  is_deployed: true
  platform: cEOSLab
  fabric_name: EOS_DESIGNS_UNIT_TESTS
  validate_hardware:
    enabled: false
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '101'
  router_id: 192.168.255.109
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 101
    metadata:
      tenants:
      - TENANT1
    rd: 192.168.255.109:10101
    route_targets:
      both:
      - 10101:10101
    redistribute_routes:
    - learned
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 101
  name: test-address-locking-vlan
  address_locking:
    address_family:
      ipv4: true
  metadata:
    tenants:
    - TENANT1
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: address-locking-5_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 101
        vni: 10101
