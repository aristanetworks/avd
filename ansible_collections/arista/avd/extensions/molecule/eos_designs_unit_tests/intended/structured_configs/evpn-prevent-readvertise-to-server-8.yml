aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: evpn-prevent-readvertise-to-server-8
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.118/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.118/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65007'
  router_id: 192.168.255.118
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 192.168.255.112
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65002'
    metadata:
      peer: evpn-prevent-readvertise-to-server-2
    description: evpn-prevent-readvertise-to-server-2_Loopback0
  - ip_address: 192.168.255.113
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65003'
    metadata:
      peer: evpn-prevent-readvertise-to-server-3
    description: evpn-prevent-readvertise-to-server-3_Loopback0
  - ip_address: 192.168.255.115
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65003'
    metadata:
      peer: evpn-prevent-readvertise-to-server-5
    description: evpn-prevent-readvertise-to-server-5_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    neighbors:
    - ip_address: 192.168.255.112
      rcf_out: RCF_EVPN_FILTER_AS( 65002 )
    - ip_address: 192.168.255.113
      rcf_out: RCF_EVPN_FILTER_AS( 65003 )
    - ip_address: 192.168.255.115
      rcf_out: RCF_EVPN_FILTER_AS( 65003 )
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
router_general:
  control_functions:
    code_units:
    - name: CU_EVPN_FILTER_AS
      content: "function RCF_EVPN_FILTER_AS( as_number_type $PEER_ASN ) {\n    return as_path has_none { $PEER_ASN };\n}\nEOF"
service_routing_protocols_model: multi-agent
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: evpn-prevent-readvertise-to-server-8_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
