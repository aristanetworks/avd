aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet10
  description: MLAG_bgp-from-network-services-22_Ethernet10
  shutdown: false
  channel_group:
    id: 10
    mode: active
  metadata:
    peer: bgp-from-network-services-22
    peer_interface: Ethernet10
    peer_type: mlag_peer
hostname: bgp-from-network-services-21
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.0.255.21/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.1.1.21/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
mlag_configuration:
  domain_id: GROUP3
  local_interface: Vlan4094
  peer_address: 10.10.10.41
  peer_link: Port-Channel10
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel10
  description: MLAG_bgp-from-network-services-22_Port-Channel10
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.20.40/31
route_maps:
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
router_bgp:
  as: '65001'
  router_id: 192.0.255.21
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65001'
    description: bgp-from-network-services-22
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  neighbors:
  - ip_address: 10.10.20.41
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    description: bgp-from-network-services-22_Vlan3102
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP-VRFS
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.10.10.40/31
  mtu: 9214
  no_autostate: true
- name: Vlan3102
  description: MLAG_L3_VRF_default
  shutdown: false
  vrf: default
  ip_address: 10.10.20.40/31
  mtu: 9214
  metadata:
    tenants:
    - TEST3
    type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 3102
  name: MLAG_L3_VRF_default
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TEST3
vrfs:
- name: MGMT
  ip_routing: false
