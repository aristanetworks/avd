metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.0.0/24 eq 32
  - sequence: 20
    action: permit 10.11.0.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.10.0.3
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vrfs:
  - name: VRF_DIAG_V4_TENANT_LO_V6
    rd: 10.10.0.3:4241
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 4241:4241
      export:
      - address_family: evpn
        route_targets:
        - 4241:4241
    router_id: 10.10.0.3
    redistribute:
      connected:
        enabled: true
  - name: VRF_DIAG_V4V6_TENANT_LO_V6
    rd: 10.10.0.3:4244
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 4244:4244
      export:
      - address_family: evpn
        route_targets:
        - 4244:4244
    router_id: 10.10.0.3
    redistribute:
      connected:
        enabled: true
  - name: VRF_DIAG_V6_TENANT_LO_V4
    rd: 10.10.0.3:4242
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 4242:4242
      export:
      - address_family: evpn
        route_targets:
        - 4242:4242
    router_id: 10.10.0.3
    redistribute:
      connected:
        enabled: true
  - name: VRF_DUPLICATE_DIAG_V4_DIAG_V6
    rd: 10.10.0.3:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.10.0.3
    redistribute:
      connected:
        enabled: true
  - name: VRF_DUPLICATE_TENANT_LO_V4_DIAG_V6
    rd: 10.10.0.3:11
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '11:11'
      export:
      - address_family: evpn
        route_targets:
        - '11:11'
    router_id: 10.10.0.3
    redistribute:
      connected:
        enabled: true
  - name: VRF_NO_DIAG_TENANT_LO_V4_V6
