aaa_accounting:
  dot1x:
    default:
      type: start-stop
      methods:
      - multicast: false
        method: group
        group: radius
aaa_authentication:
  dot1x:
    default: group radius
aaa_root:
  disabled: true
config_end: true
dot1x:
  system_auth_control: true
  protocol_lldp_bypass: true
  protocol_bpdu_bypass: true
  dynamic_authorization: true
  radius_av_pair:
    lldp:
      system_name:
        enabled: true
        auth_only: false
      system_description:
        enabled: true
        auth_only: false
    dhcp:
      hostname:
        enabled: true
        auth_only: false
      parameter_request_list:
        enabled: true
        auth_only: false
      vendor_class_id:
        enabled: true
        auth_only: false
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: AAA extended ACL on adapter, configured directly
  shutdown: false
  dot1x:
    aaa:
      unresponsive:
        action:
          traffic_allow_access_list: AAA-EXTENDED
  metadata:
    peer: aaa-timeout-test
    peer_key: connected_endpoints
  switchport:
    enabled: true
- name: Ethernet2
  description: AAA standard ACL on adapter, configured directly
  shutdown: false
  dot1x:
    aaa:
      unresponsive:
        action:
          traffic_allow_access_list: AAA-STANDARD
  metadata:
    peer: aaa-timeout-test
    peer_key: connected_endpoints
  switchport:
    enabled: true
- name: Ethernet3
  description: AAA extended ACL on adapter, inherited from profile
  shutdown: false
  dot1x:
    aaa:
      unresponsive:
        action:
          traffic_allow_access_list: AAA-EXTENDED
  metadata:
    peer: aaa-timeout-test
    peer_key: connected_endpoints
    port_profile: AAA-EXTENDED-PROFILE
  switchport:
    enabled: true
- name: Ethernet4
  description: AAA standard ACL on adapter, inherited from profile
  shutdown: false
  dot1x:
    aaa:
      unresponsive:
        action:
          traffic_allow_access_list: AAA-STANDARD
  metadata:
    peer: aaa-timeout-test
    peer_key: connected_endpoints
    port_profile: AAA-STANDARD-PROFILE
  switchport:
    enabled: true
- name: Ethernet5
  description: AAA extended ACL on network port, configured directly
  shutdown: false
  dot1x:
    aaa:
      unresponsive:
        action:
          traffic_allow_access_list: AAA-EXTENDED
  metadata:
    peer_type: network_port
    peer_key: network_ports
  switchport:
    enabled: true
- name: Ethernet6
  description: AAA standard ACL on network port, configured directly
  shutdown: false
  dot1x:
    aaa:
      unresponsive:
        action:
          traffic_allow_access_list: AAA-STANDARD
  metadata:
    peer_type: network_port
    peer_key: network_ports
  switchport:
    enabled: true
- name: Ethernet7
  description: AAA extended ACL on network port, inherited from profile
  shutdown: false
  dot1x:
    aaa:
      unresponsive:
        action:
          traffic_allow_access_list: AAA-EXTENDED
  metadata:
    peer_type: network_port
    peer_key: network_ports
    port_profile: AAA-EXTENDED-PROFILE
  switchport:
    enabled: true
- name: Ethernet8
  description: AAA standard ACL on network port, inherited from profile
  shutdown: false
  dot1x:
    aaa:
      unresponsive:
        action:
          traffic_allow_access_list: AAA-STANDARD
  metadata:
    peer_type: network_port
    peer_key: network_ports
    port_profile: AAA-STANDARD-PROFILE
  switchport:
    enabled: true
hostname: dot1x-settings-7
ip_access_lists:
- name: AAA-EXTENDED
  entries:
  - sequence: 10
    action: permit
    protocol: ip
    source: 192.0.2.0/24
    destination: any
ip_igmp_snooping:
  globally_enabled: true
ip_radius:
  vrfs:
  - name: MGMT
    source_interface: Management1
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.2/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
radius_server:
  vrfs:
  - name: MGMT
    servers:
    - host: agni.arista.com
      key: 1404071B09166738212B2130365E0C131A
service_routing_protocols_model: multi-agent
standard_access_lists:
- name: AAA-STANDARD
  entries:
  - sequence: 10
    action: permit
    source: 192.0.2.0/24
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
