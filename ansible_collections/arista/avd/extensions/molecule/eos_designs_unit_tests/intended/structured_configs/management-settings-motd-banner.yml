    .         Site         : DC1                      .

    .         Type info for information about the device            .

    .         Type help for information about the aliases           .

    '
config_end: true
enable_password:
  disabled: true
hostname: management-settings-motd-banner
ip_igmp_snooping:
  globally_enabled: true
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
