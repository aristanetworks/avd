aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_IPV6_DOWNLINK_POOLS_SPINE_Ethernet1
  shutdown: false
  mtu: 9214
  ipv6_address: 2001:db8:12::2/64
  metadata:
    peer: IPV6_DOWNLINK_POOLS_SPINE
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
hostname: IPV6_DOWNLINK_POOLS_LEAF1a
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
ipv6_prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY-V6
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:13::/48 eq 128
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ipv6_address: 2001:db8:13::1/128
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.1.31/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: EOS_DESIGNS_UNIT_TESTS
  validate_hardware:
    enabled: false
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 30
    type: permit
    match:
    - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.255.1.1
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv6
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2001:db8:12::1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: IPV6_DOWNLINK_POOLS_SPINE
    description: IPV6_DOWNLINK_POOLS_SPINE_Ethernet1
  - ip_address: 2001:db8::1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: IPV6_DOWNLINK_POOLS_SPINE
    description: IPV6_DOWNLINK_POOLS_SPINE_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
  address_family_ipv6:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: IPV6_DOWNLINK_POOLS_LEAF1a_VTEP
    vxlan:
      source_interface: Loopback0
      udp_port: 4789
      encapsulations:
        ipv6: true
