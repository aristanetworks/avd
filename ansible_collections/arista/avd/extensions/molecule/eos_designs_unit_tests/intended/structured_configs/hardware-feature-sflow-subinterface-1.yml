aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet10
  description: P2P_hardware-features-veos-lab_Ethernet10
  shutdown: false
  mtu: 9214
  ip_address: 10.10.50.15/31
  ptp:
    enable: true
    announce:
      interval: 0
      timeout: 3
    delay_req: -3
    sync_message:
      interval: -3
    transport: ipv4
  metadata:
    peer: hardware-features-veos-lab
    peer_interface: Ethernet10
    peer_type: l3leaf
  sflow:
    enable: true
  switchport:
    enabled: false
- name: Ethernet4.4
  description: P2P_hardware-features-cloudeos_Ethernet4.4
  shutdown: false
  mtu: 9214
  ip_address: 10.10.30.40/31
  metadata:
    peer: hardware-features-cloudeos
    peer_interface: Ethernet4.4
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet9.9
  description: P2P_hardware-features-custom-platform_Ethernet9.9
  shutdown: false
  mtu: 9214
  ip_address: 10.10.60.4/31
  metadata:
    peer: hardware-features-custom-platform
    peer_interface: Ethernet9.9
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet5.5
  shutdown: false
  vrf: VRF10
  encapsulation_dot1q:
    vlan: 5
  ip_address: 10.10.40.6/24
  metadata:
    peer_type: l3_interface
- name: Ethernet5
  shutdown: false
  metadata:
    peer_type: l3_interface
  switchport:
    enabled: false
- name: Ethernet7.7
  description: SERVER_TEST_POE_ETH7_NO_POE
  shutdown: false
  l2_mtu: 1001
  l2_mru: 1002
  ptp:
    enable: true
    announce:
      interval: 0
      timeout: 3
    delay_req: -3
    sync_message:
      interval: -3
    role: master
    transport: ipv4
  metadata:
    peer: TEST_POE
    peer_interface: ETH7_NO_POE
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
hardware_counters:
  features: null
hostname: hardware-feature-sflow-subinterface-1
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.10.10.8/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.10.20.8/32
metadata:
  is_deployed: true
  platform: customplatform
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.10.0/24 eq 32
  - sequence: 20
    action: permit 10.10.20.0/24 eq 32
ptp:
  mode: boundary
  clock_identity: 00:1C:73:1e:00:08
  priority1: 30
  priority2: 8
  domain: 127
  monitor:
    enabled: true
    threshold:
      offset_from_master: 250
      mean_path_delay: 1500
    missing_message:
      sequence_ids:
        enabled: true
        announce: 3
        delay_resp: 3
        follow_up: 3
        sync: 3
queue_monitor_length:
  enabled: true
  notifying: true
queue_monitor_streaming:
  enable: true
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65001'
  router_id: 10.10.10.8
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  neighbors:
  - ip_address: 10.10.50.14
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    metadata:
      peer: hardware-features-veos-lab
    description: hardware-features-veos-lab_Ethernet10
  - ip_address: 10.10.30.41
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    local_as: '65000'
    metadata:
      peer: hardware-features-cloudeos
    description: hardware-features-cloudeos
  - ip_address: 10.10.60.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    local_as: '65100'
    metadata:
      peer: hardware-features-custom-platform
    description: hardware-features-custom-platform
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
  vrfs:
  - name: VRF10
    rd: 10.10.10.8:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.10.10.8
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.10.40.100
      remote_as: '65002'
    redistribute:
      connected:
        enabled: true
    address_family_ipv4:
      neighbors:
      - ip_address: 10.10.40.100
        activate: true
service_routing_protocols_model: multi-agent
sflow:
  sample: 1000000
  polling_interval: 5
  destinations:
  - destination: 10.10.10.10
  source_interface: Vlan10
  run: true
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF10
  ip_routing: true
  metadata:
    tenants:
    - TENANT1
vxlan_interface:
  vxlan1:
    description: hardware-feature-sflow-subinterface-1_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vrfs:
      - name: VRF10
        vni: 10
