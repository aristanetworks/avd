ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
ipv6_prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY-V6
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:100::/48 eq 128
  - sequence: 20
    action: permit 2001:db8:101::/48 eq 128
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:103:1a::/64
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ipv6_addresses:
  - 2001:db8:100::1b/128
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ipv6_addresses:
  - 2001:db8:101:1b::1/128
metadata:
  is_deployed: true
  platform: vEOS-LAB
  fabric_name: EOS_DESIGNS_UNIT_TESTS
mlag_configuration:
  domain_id: ipv6-legacy-separate
  local_interface: Vlan4094
  peer_address: 10.102.0.53
  peer_link: Port-Channel5
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel5
  description: MLAG_mlag-bgp-peer-groups-ipv6-legacy-separate-b_Port-Channel5
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 30
    type: permit
    match:
    - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.100.0.27
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv6
    remote_as: '65100'
    description: Selected mlag_ipv4_underlay_peer
    bfd: true
    next_hop_self: true
    password: 4b21pAdCvWeAqpcKDFMdWw==
    send_community: all
    maximum_routes: 12001
    route_map_in: RM-MLAG-PEER-IN
  - name: MLAG-LEGACY-VRFS-PEER
    metadata:
      type: ipv6
    remote_as: '65100'
    description: mlag-bgp-peer-groups-ipv6-legacy-separate-b
    next_hop_self: true
    send_community: all
    maximum_routes: 12004
    route_map_in: RM-MLAG-PEER-IN
  neighbors:
  - ip_address: 2001:db8:103:1a::2
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: mlag-bgp-peer-groups-ipv6-legacy-separate-b
    description: mlag-bgp-peer-groups-ipv6-legacy-separate-b_Vlan4093
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 10
    metadata:
      tenants:
      - MLAG_TEST
    rd: 10.100.0.27:10010
    route_targets:
      both:
      - 10010:10010
    redistribute_routes:
    - learned
  address_family_ipv4:
    peer_groups:
    - name: MLAG-LEGACY-VRFS-PEER
      activate: true
  address_family_ipv6:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
  vrfs:
  - name: TEST
    rd: 10.100.0.27:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.100.0.27
    updates:
      wait_install: true
    neighbors:
    - ip_address: 2001:db8:103:1a::2
      peer_group: MLAG-LEGACY-VRFS-PEER
      description: mlag-bgp-peer-groups-ipv6-legacy-separate-b_Vlan3009
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
