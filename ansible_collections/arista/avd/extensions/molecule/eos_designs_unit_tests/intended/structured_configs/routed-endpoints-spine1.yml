aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_routed-endpoints-leaf1a_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.200.0.0/31
  metadata:
    peer: routed-endpoints-leaf1a
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_routed-endpoints-leaf1b_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.200.0.2/31
  metadata:
    peer: routed-endpoints-leaf1b
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_routed-endpoints-leaf2_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.200.0.4/31
  metadata:
    peer: routed-endpoints-leaf2
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: routed-endpoints-spine1
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.200.1/32
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: EOS_DESIGNS_UNIT_TESTS
  validate_hardware:
    enabled: false
router_bgp:
  as: '65100'
  router_id: 192.168.200.1
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  neighbors:
  - ip_address: 10.200.0.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: routed-endpoints-leaf1a
    description: routed-endpoints-leaf1a_Ethernet1
  - ip_address: 10.200.0.3
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: routed-endpoints-leaf1b
    description: routed-endpoints-leaf1b_Ethernet1
  - ip_address: 10.200.0.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: routed-endpoints-leaf2
    description: routed-endpoints-leaf2_Ethernet1
  redistribute:
    connected:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
