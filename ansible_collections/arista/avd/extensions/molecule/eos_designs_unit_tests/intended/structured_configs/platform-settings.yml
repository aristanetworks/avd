aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet17
  shutdown: false
  metadata:
    peer_type: l3_interface
  switchport:
    enabled: false
- name: Ethernet20
  shutdown: false
  metadata:
    peer_type: l3_interface
  switchport:
    enabled: false
- name: Ethernet18
  shutdown: false
  channel_group:
    id: 18
    mode: active
  metadata:
    peer_type: l3_port_channel_member
- name: Ethernet10.10
  description: test sub interface mtu false
  shutdown: false
  encapsulation_dot1q:
    vlan: 10
  ip_address: 10.10.10.10/24
  metadata:
    peer_type: l3_interface
- name: Ethernet19
  shutdown: false
  channel_group:
    id: 19
    mode: active
  metadata:
    peer_type: l3_port_channel_member
- name: Ethernet13
  description: SERVER_SPEED_TEST_SERVER_Eth1
  shutdown: false
  metadata:
    peer: SPEED_TEST_SERVER
    peer_interface: Eth1
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
- name: Ethernet14
  description: SERVER_SPEED_TEST_SERVER_Eth2
  shutdown: false
  speed: auto
  metadata:
    peer: SPEED_TEST_SERVER
    peer_interface: Eth2
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
- name: Ethernet15
  description: SERVER_SPEED_TEST_SERVER_Eth3
  shutdown: false
  speed: 100g
  metadata:
    peer: SPEED_TEST_SERVER
    peer_interface: Eth3
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
- name: Ethernet16
  description: SPEED_TEST_NETWORK_PORT
  shutdown: false
  metadata:
    peer: SPEED_TEST_NETWORK_PORT
    peer_type: network_port
    peer_key: network_ports
  switchport:
    enabled: true
- name: Ethernet10
  shutdown: false
  metadata:
    peer_type: l3_interface
  switchport:
    enabled: false
- name: Ethernet12
  description: Interface Created from platform_settings.structured_config
  switchport:
    enabled: true
hostname: platform-settings
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.101/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.101/32
management_security:
  entropy_sources:
    hardware: true
    haveged: true
    cpu_jitter: true
    hardware_exclusive: true
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
port_channel_interfaces:
- name: Port-Channel18
  shutdown: false
  metadata:
    peer_type: l3_port_channel
  switchport:
    enabled: false
- name: Port-Channel19
  shutdown: false
  metadata:
    peer_type: l3_port_channel
  switchport:
    enabled: false
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '101'
  router_id: 192.168.255.101
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vrfs:
  - name: default
    rd: 192.168.255.101:1
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '1:1'
      export:
      - address_family: evpn
        route_targets:
        - '1:1'
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: platform-settings_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vrfs:
      - name: default
        vni: 1
