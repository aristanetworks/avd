aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_bgp-peer-groups-3_Ethernet64
  shutdown: false
  mtu: 9214
  ip_address: 192.168.252.217/31
  metadata:
    peer: bgp-peer-groups-3
    peer_interface: Ethernet64
    peer_type: pe
  switchport:
    enabled: false
hostname: bgp-peer-groups-ipv4-selector-generic
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.117/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65001'
  router_id: 192.168.255.117
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: CUSTOM-UNDERLAY-PEERS
    metadata:
      type: ipv4
    description: Description for underlay_peers via structured_config
    bfd: true
    password: NbGgT822TGbA1ANof67e0A==
    send_community: all
    maximum_routes: 12010
  neighbors:
  - ip_address: 192.168.252.216
    peer_group: CUSTOM-UNDERLAY-PEERS
    remote_as: '65001'
    metadata:
      peer: bgp-peer-groups-3
    description: bgp-peer-groups-3_Ethernet64
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_ipv4:
    peer_groups:
    - name: CUSTOM-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: bgp-peer-groups-ipv4-selector-generic_VTEP
    vxlan:
      source_interface: Loopback0
      udp_port: 4789
