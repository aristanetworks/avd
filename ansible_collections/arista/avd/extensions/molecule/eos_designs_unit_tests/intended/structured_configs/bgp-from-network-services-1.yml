aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet10
  description: MLAG_bgp-from-network-services-2_Ethernet10
  shutdown: false
  channel_group:
    id: 10
    mode: active
  metadata:
    peer: bgp-from-network-services-2
    peer_interface: Ethernet10
    peer_type: mlag_peer
hostname: bgp-from-network-services-1
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.0.255.1/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.1.1.1/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
mlag_configuration:
  domain_id: GROUP1
  local_interface: Vlan4094
  peer_address: 10.10.10.1
  peer_link: Port-Channel10
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel10
  description: MLAG_bgp-from-network-services-2_Port-Channel10
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.20.0/31
route_maps:
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-default-11.11.1.2-SET-NEXT-HOP-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    set:
    - ip next-hop 10.10.1.2
router_bgp:
  as: '65001'
  router_id: 192.0.255.1
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MYPEERGROUP
    remote_as: '65991'
    bfd: true
    next_hop_self: true
    maximum_advertised_routes: 2000
    maximum_advertised_routes_warning_limit: '800'
  - name: VALIDATE_BGP_PEERS
    remote_as: '65991'
    bfd: true
    next_hop_self: true
    maximum_accepted_routes:
      limit: 1000
      warning_limit:
        count: 100
    maximum_advertised_routes: 1000
    maximum_advertised_routes_warning_limit: 80 percent
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65001'
    description: bgp-from-network-services-2
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  neighbors:
  - ip_address: 10.10.20.1
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      validate_state: false
    description: bgp-from-network-services-2_Vlan3099
  - ip_address: 10.10.1.2
    peer_group: MYPEERGROUP
    metadata:
      validate_state: false
    route_reflector_client: true
    default_originate:
      enabled: true
      always: true
  - ip_address: 11.11.1.2
    peer_group: MYPEERGROUP
    metadata:
      validate_state: false
    route_map_out: RM-default-11.11.1.2-SET-NEXT-HOP-OUT
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP-VRFS
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    neighbors:
    - ip_address: 10.10.1.2
      activate: true
    - ip_address: 11.11.1.2
      activate: true
  vrfs:
  - name: validate_bgp_peers
    router_id: 192.0.255.1
    timers: 42 42
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.10.20.1
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: bgp-from-network-services-2_Vlan3100
      metadata:
        validate_state: true
    - ip_address: 10.10.2.2
      peer_group: VALIDATE_BGP_PEERS
      route_reflector_client: true
      default_originate:
        always: true
      metadata:
        validate_state: true
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
    address_family_ipv4:
      neighbors:
      - ip_address: 10.10.2.2
        activate: true
    eos_cli: '! Comment for bgp'
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.10.10.0/31
  mtu: 9214
  no_autostate: true
- name: Vlan3099
  description: MLAG_L3_VRF_default
  shutdown: false
  vrf: default
  ip_address: 10.10.20.0/31
  mtu: 9214
  metadata:
    tenants:
    - TEST1
    type: underlay_peering
- name: Vlan3100
  description: MLAG_L3_VRF_validate_bgp_peers
  shutdown: false
  vrf: validate_bgp_peers
  ip_address: 10.10.20.0/31
  mtu: 9214
  metadata:
    tenants:
    - TEST1
    type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 3099
  name: MLAG_L3_VRF_default
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TEST1
- id: 3100
  name: MLAG_L3_VRF_validate_bgp_peers
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TEST1
vrfs:
- name: MGMT
  ip_routing: false
- name: validate_bgp_peers
  ip_routing: true
  metadata:
    tenants:
    - TEST1
