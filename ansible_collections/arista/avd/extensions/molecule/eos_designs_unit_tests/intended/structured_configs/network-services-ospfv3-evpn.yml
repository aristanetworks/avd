aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: network-services-ospfv3-evpn
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:dc:01
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.1/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.1/32
- name: Loopback12
  description: DIAG_VRF_VRF_C
  shutdown: false
  vrf: VRF_C
  ip_address: 10.255.12.1/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.200.101/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 192.168.255.1
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 117
    metadata:
      tenants:
      - TENANT_A
    rd: 192.168.255.1:10117
    route_targets:
      both:
      - 10117:10117
    redistribute_routes:
    - learned
  vrfs:
  - name: VRF_A
    rd: 192.168.255.1:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 192.168.255.1
    redistribute:
      connected:
        enabled: true
      ospfv3:
        enabled: true
  - name: VRF_B
    rd: 192.168.255.1:11
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '11:11'
      export:
      - address_family: evpn
        route_targets:
        - '11:11'
    router_id: 192.168.255.1
    redistribute:
      connected:
        enabled: true
      ospfv3:
        enabled: true
  - name: VRF_C
    rd: 192.168.255.1:12
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '12:12'
      export:
      - address_family: evpn
        route_targets:
        - '12:12'
    router_id: 192.168.255.1
    redistribute:
      connected:
        enabled: true
  - name: VRF_D
    rd: 192.168.255.1:13
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '13:13'
      export:
      - address_family: evpn
        route_targets:
        - '13:13'
    router_id: 192.168.255.1
    redistribute:
      connected:
        enabled: true
      ospfv3:
        enabled: true
        match_external:
          enabled: true
  - name: VRF_DUAL_STACK_1
    rd: 192.168.255.1:14
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '14:14'
      export:
      - address_family: evpn
        route_targets:
        - '14:14'
    router_id: 192.168.255.1
    redistribute:
      connected:
        enabled: true
      ospfv3:
        enabled: true
  - name: VRF_DUAL_STACK_2
    rd: 192.168.255.1:15
