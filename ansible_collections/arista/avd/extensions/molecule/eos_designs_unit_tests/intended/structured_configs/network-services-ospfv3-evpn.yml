    router_id: 192.168.255.1
    redistribute:
      connected:
        enabled: true
      ospfv3:
        enabled: true
router_ospf:
  process_ids:
  - id: 14
    vrf: VRF_DUAL_STACK_1
    passive_interface_default: true
    router_id: 192.168.255.1
    no_passive_interfaces:
    - Vlan214
    redistribute:
      bgp:
        enabled: true
  - id: 15
    vrf: VRF_DUAL_STACK_2
    passive_interface_default: true
    router_id: 192.168.255.1
    no_passive_interfaces:
    - Vlan215
    redistribute:
      bgp:
        enabled: true
router_ospfv3:
  vrfs:
  - name: VRF_A
    router_id: 192.168.255.1
    passive_interface_default: true
    address_family_ipv6:
      redistribute:
        bgp:
          enabled: true
      enabled: true
  - name: VRF_B
    router_id: 10.255.11.1
    passive_interface_default: true
    auto_cost_reference_bandwidth: 100000
    address_family_ipv6:
      redistribute:
        bgp:
          enabled: true
        connected:
          enabled: true
      enabled: true
    eos_cli: log-adjacency-changes detail
  - name: VRF_C
    router_id: 10.255.12.1
    passive_interface_default: true
    address_family_ipv6:
      enabled: true
  - name: VRF_D
    passive_interface_default: true
    address_family_ipv6:
      redistribute:
        bgp:
          enabled: true
      enabled: true
  - name: VRF_DUAL_STACK_1
    router_id: 192.168.255.1
    passive_interface_default: true
    address_family_ipv6:
      redistribute:
        bgp:
          enabled: true
      enabled: true
  - name: VRF_DUAL_STACK_2
    router_id: 192.168.255.1
    passive_interface_default: true
    address_family_ipv6:
      redistribute:
        bgp:
          enabled: true
      enabled: true
  - name: VRF_LINK_LOCAL
    router_id: 192.168.255.1
    passive_interface_default: true
    address_family_ipv6:
      redistribute:
        bgp:
          enabled: true
      enabled: true
  - name: VRF_NO_BGP
    router_id: 192.168.255.1
    passive_interface_default: true
    address_family_ipv6:
      enabled: true
  - name: VRF_SHARED
    router_id: 10.255.17.1
    passive_interface_default: true
    address_family_ipv6:
      redistribute:
        bgp:
          enabled: true
      enabled: true
