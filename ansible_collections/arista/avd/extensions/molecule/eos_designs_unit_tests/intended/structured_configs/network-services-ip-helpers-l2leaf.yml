aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: L2_network-services-ip-helpers-leaf3_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: network-services-ip-helpers-leaf3
    peer_interface: Ethernet1
    peer_type: l3leaf
- name: Ethernet2
  description: L2_network-services-ip-helpers-leaf3_Ethernet2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: network-services-ip-helpers-leaf3
    peer_interface: Ethernet2
    peer_type: l3leaf
hostname: network-services-ip-helpers-l2leaf
ip_igmp_snooping:
  globally_enabled: true
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
port_channel_interfaces:
- name: Port-Channel1
  description: L2_network-services-ip-helpers-leaf3_Port-Channel1
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 11,100
service_routing_protocols_model: multi-agent
static_routes:
- vrf: INBANDMGMT
  prefix: 0.0.0.0/0
  next_hop: 192.168.101.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan100
  description: Inband Management
  shutdown: false
  vrf: INBANDMGMT
  ip_address: 192.168.101.6/24
  mtu: 1500
  metadata:
    type: inband_mgmt
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 11
  name: SVI2
  metadata:
    tenants:
    - TEST2
- id: 100
  name: INBAND_MGMT
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
- name: INBANDMGMT
