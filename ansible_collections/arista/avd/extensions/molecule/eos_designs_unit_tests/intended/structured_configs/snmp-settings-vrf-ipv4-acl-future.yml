aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: snmp-settings-vrf-ipv4-acl-future
ip_access_lists:
- name: acl-for-vrf-default
  entries:
  - sequence: 10
    action: permit
    protocol: ip
    source: any
    destination: any
- name: acl-for-vrf-MGMT
  entries:
  - sequence: 10
    action: permit
    protocol: ip
    source: any
    destination: any
ip_igmp_snooping:
  globally_enabled: true
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.10.10.43/26
  type: oob
  gateway: 10.10.10.1
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
service_routing_protocols_model: multi-agent
snmp_server:
  ipv4_acls:
  - name: acl-for-vrf-default
  - name: acl-for-vrf-MGMT
    vrf: MGMT
  vrfs:
  - name: default
    enable: false
  - name: MGMT
    enable: true
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 10.10.10.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
