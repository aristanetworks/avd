aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: l2vlan-profiles
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.10.0.3/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.11.0.3/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.0.0/24 eq 32
  - sequence: 20
    action: permit 10.11.0.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.10.0.3
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 110
    metadata:
      tenants:
      - research
    rd: 10.10.0.3:10110
    route_targets:
      both:
      - 10110:10110
    redistribute_routes:
    - learned
  - id: 120
    metadata:
      tenants:
      - research
    rd: 10.10.0.3:10120
    route_targets:
      both:
      - 10120:10120
    redistribute_routes:
    - learned
  - id: 130
    metadata:
      tenants:
      - research
    rd: 10.10.0.3:10130
    route_targets:
      both:
      - 10130:10130
    redistribute_routes:
    - learned
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 110
  name: research1
  private_vlan:
    type: isolated
    primary_vlan: 120
  metadata:
    tenants:
    - research
- id: 120
  name: research2
  private_vlan:
    type: community
    primary_vlan: 110
  metadata:
    tenants:
    - research
- id: 130
  name: research3
  private_vlan:
    type: community
    primary_vlan: 120
  metadata:
    tenants:
    - research
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: l2vlan-profiles_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 110
        vni: 10110
      - id: 120
        vni: 10120
      - id: 130
        vni: 10130
