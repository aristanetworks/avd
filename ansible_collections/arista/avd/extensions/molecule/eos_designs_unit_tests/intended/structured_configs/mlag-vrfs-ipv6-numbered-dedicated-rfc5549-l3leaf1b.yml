aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet5
  description: MLAG_mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a_Ethernet5
  shutdown: false
  channel_group:
    id: 5
    mode: active
  metadata:
    peer: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a
    peer_interface: Ethernet5
    peer_type: mlag_peer
- name: Ethernet6
  description: MLAG_mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a_Ethernet6
  shutdown: false
  channel_group:
    id: 5
    mode: active
  metadata:
    peer: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a
    peer_interface: Ethernet6
    peer_type: mlag_peer
hostname: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1b
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
ipv6_prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY-V6
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:74::/48 eq 128
  - sequence: 20
    action: permit 2001:db8:75::/48 eq 128
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:77::/64
  - sequence: 20
    action: permit 2001:db8:78::/64
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ipv6_addresses:
  - 2001:db8:74::2/128
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ipv6_addresses:
  - 2001:db8:75:1::1/128
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.201.127/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-LAB
  fabric_name: MLAG_VRFS_IPV6_NUMBERED
mlag_configuration:
  domain_id: MLAG_VRFS_IPV6_NUMBERED_DEDICATED_RFC5549
  local_interface: Vlan4094
  peer_address: 10.10.76.0
  peer_link: Port-Channel5
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel5
  description: MLAG_mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a_Port-Channel5
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 30
    type: permit
    match:
    - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ipv6 address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65180'
  router_id: 10.10.74.2
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65180'
    description: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: MLAG-IPv6-VRFS-PEER
    metadata:
      type: ipv4
    remote_as: '65180'
    description: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  neighbors:
  - ip_address: 2001:db8:77::1
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a
    description: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a_Vlan4093
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 11
    metadata:
      tenants:
      - TENANT1
    rd: 10.10.74.2:10011
    route_targets:
      both:
      - 10011:10011
    redistribute_routes:
    - learned
  - id: 21
    metadata:
      tenants:
      - TENANT1
    rd: 10.10.74.2:10021
    route_targets:
      both:
      - 10021:10021
    redistribute_routes:
    - learned
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv6-VRFS-PEER
      activate: true
      next_hop:
        address_family_ipv6:
          enabled: true
          originate: true
  address_family_ipv6:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: MLAG-IPv6-VRFS-PEER
      activate: true
  vrfs:
  - name: VRF10
    rd: 10.10.74.2:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.10.74.2
    updates:
      wait_install: true
    neighbors:
    - ip_address: 2001:db8:77::1
      peer_group: MLAG-IPv6-VRFS-PEER
      description: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a_Vlan3009
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
  - name: VRF11
    rd: 10.10.74.2:11
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '11:11'
      export:
      - address_family: evpn
        route_targets:
        - '11:11'
    router_id: 10.10.74.2
    updates:
      wait_install: true
    neighbors:
    - ip_address: 2001:db8:78::1
      peer_group: MLAG-IPv6-VRFS-PEER
      description: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1a_Vlan3010
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
service_routing_protocols_model: multi-agent
spanning_tree:
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ipv6_addresses:
  - 2001:db8:77::2/64
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.10.76.1/31
  mtu: 9214
  no_autostate: true
- name: Vlan11
  description: VRF10_VLAN11
  shutdown: true
  vrf: VRF10
  ip_address_virtual: 10.10.11.1/24
  ipv6_enable: true
  ipv6_address_virtuals:
  - 2001:DB8:11::1/64
  metadata:
    tenants:
    - TENANT1
- name: Vlan3009
  description: MLAG_L3_VRF_VRF10
  shutdown: false
  vrf: VRF10
  ipv6_addresses:
  - 2001:db8:77::2/64
  mtu: 9214
  metadata:
    tenants:
    - TENANT1
    type: underlay_peering
- name: Vlan21
  description: VRF11_VLAN21
  shutdown: true
  vrf: VRF11
  ipv6_enable: true
  ipv6_address_virtuals:
  - 2001:DB8:21::1/64
  metadata:
    tenants:
    - TENANT1
- name: Vlan3010
  description: MLAG_L3_VRF_VRF11
  shutdown: false
  vrf: VRF11
  ipv6_addresses:
  - 2001:db8:78::2/64
  mtu: 9214
  metadata:
    tenants:
    - TENANT1
    type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 11
  name: VRF10_VLAN11
  metadata:
    tenants:
    - TENANT1
- id: 3009
  name: MLAG_L3_VRF_VRF10
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TENANT1
- id: 21
  name: VRF11_VLAN21
  metadata:
    tenants:
    - TENANT1
- id: 3010
  name: MLAG_L3_VRF_VRF11
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TENANT1
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF10
  ipv6_routing: true
  ip_routing_ipv6_interfaces: true
  metadata:
    tenants:
    - TENANT1
- name: VRF11
  ipv6_routing: true
  ip_routing_ipv6_interfaces: true
  metadata:
    tenants:
    - TENANT1
vxlan_interface:
  vxlan1:
    description: mlag-vrfs-ipv6-numbered-dedicated-rfc5549-l3leaf1b_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      encapsulations:
        ipv6: true
      virtual_router_encapsulation_mac_address: mlag-system-id
      vlans:
      - id: 11
        vni: 10011
      - id: 21
        vni: 10021
      vrfs:
      - name: VRF10
        vni: 10
      - name: VRF11
        vni: 11
