aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
errdisable:
  detect_cause:
    arp_inspection: true
    error_correction_encoding: true
    hardware_speed_group: true
    link_change: true
    port_breakout: true
    switchcard_unreachable: true
    transceiver_adapter: true
    xcvr_misconfigured: true
    xcvr_overheat: true
    xcvr_power_unsupported: true
  recovery_cause:
    arp_inspection:
      enabled: true
      interval: 90
    error_correction_encoding:
      enabled: true
      interval: 300
    hardware_speed_group:
      enabled: true
      interval: 300
    link_flap:
      enabled: true
      interval: 60
    port_breakout:
      enabled: true
      interval: 300
    switchcard_unreachable:
      enabled: true
      interval: 300
    transceiver_adapter:
      enabled: true
      interval: 300
    xcvr_misconfigured:
      enabled: true
      interval: 300
    xcvr_overheat:
      enabled: true
      interval: 300
    xcvr_power_unsupported:
      enabled: true
      interval: 300
    xcvr_unsupported:
      enabled: true
      interval: 300
ethernet_interfaces:
- name: Ethernet1
  description: P2P_errdisable-veos-lab_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.10.50.9/31
  metadata:
    peer: errdisable-veos-lab
    peer_interface: Ethernet5
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: errdisable-custom-platform
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.10.10.5/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.10.20.5/32
metadata:
  is_deployed: true
  platform: custom-errdisable-platform
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.10.0/24 eq 32
  - sequence: 20
    action: permit 10.10.20.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65001'
  router_id: 10.10.10.5
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  neighbors:
  - ip_address: 10.10.50.8
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    metadata:
      peer: errdisable-veos-lab
    description: errdisable-veos-lab_Ethernet5
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: errdisable-custom-platform_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
