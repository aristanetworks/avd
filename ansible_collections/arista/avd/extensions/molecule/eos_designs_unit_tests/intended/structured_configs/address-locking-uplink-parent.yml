aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: L2_address-locking-13_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: address-locking-13
    peer_interface: Ethernet1
    peer_type: l2leaf
- name: Ethernet2
  description: L2_address-locking-14_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: address-locking-14
    peer_interface: Ethernet1
    peer_type: l2leaf
- name: Ethernet5
  description: L2_address-locking-15_Ethernet1
  shutdown: false
  metadata:
    peer: address-locking-15
    peer_interface: Ethernet1
    peer_type: l2leaf
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
hostname: address-locking-uplink-parent
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:dc:00:00:00:0a
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.60.1/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.61.1/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
port_channel_interfaces:
- name: Port-Channel1
  description: L2_ADDRESS_LOCKING_MLAG_PAIR_Port-Channel1
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.60.0/24 eq 32
  - sequence: 20
    action: permit 192.168.61.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65042'
  router_id: 192.168.60.1
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: address-locking-uplink-parent_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
