aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet5
  description: MLAG_multi-vtep-mlag-l3leaf1a_Ethernet5
  shutdown: false
  channel_group:
    id: 5
    mode: active
  metadata:
    peer: multi-vtep-mlag-l3leaf1a
    peer_interface: Ethernet5
    peer_type: mlag_peer
- name: Ethernet6
  description: MLAG_multi-vtep-mlag-l3leaf1a_Ethernet6
  shutdown: false
  channel_group:
    id: 5
    mode: active
  metadata:
    peer: multi-vtep-mlag-l3leaf1a
    peer_interface: Ethernet6
    peer_type: mlag_peer
hostname: multi-vtep-mlag-l3leaf1b
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.39/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.38/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.201.119/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-LAB
  fabric_name: EOS_DESIGNS_UNIT_TESTS
mlag_configuration:
  domain_id: MULTI_VTEP_MLAG_L3LEAF1
  local_interface: Vlan4094
  peer_address: 10.10.255.10
  peer_link: Port-Channel5
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel5
  description: MLAG_multi-vtep-mlag-l3leaf1a_Port-Channel5
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65161'
  router_id: 192.168.255.39
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65161'
    description: multi-vtep-mlag-l3leaf1a
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  neighbors:
  - ip_address: 10.10.255.10
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: multi-vtep-mlag-l3leaf1a
    description: multi-vtep-mlag-l3leaf1a_Vlan4094
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  no_spanning_tree_vlan: '4094'
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.10.255.11/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: multi-vtep-mlag-l3leaf1b_VTEP
    vxlan:
      source_interface: Loopback0
      mlag_source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
      decapsulation_filter:
        interface_multiple_vrf_disabled:
        - Ethernet5
        - Ethernet6
