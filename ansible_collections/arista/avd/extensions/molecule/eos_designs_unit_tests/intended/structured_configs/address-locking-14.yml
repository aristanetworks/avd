aaa_root:
  disabled: true
address_locking:
  dhcp_server_interfaces:
  - Port-Channel1
  - Port-Channel3
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: MLAG_address-locking-13_Ethernet3
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: address-locking-13
    peer_interface: Ethernet3
    peer_type: mlag_peer
- name: Ethernet4
  description: MLAG_address-locking-13_Ethernet4
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: address-locking-13
    peer_interface: Ethernet4
    peer_type: mlag_peer
- name: Ethernet1
  description: L2_address-locking-uplink-parent_Ethernet2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: address-locking-uplink-parent
    peer_interface: Ethernet2
    peer_type: l3leaf
hostname: address-locking-14
ip_igmp_snooping:
  globally_enabled: true
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
mlag_configuration:
  domain_id: ADDRESS_LOCKING_MLAG_PAIR
  local_interface: Vlan4094
  peer_address: 10.100.0.0
  peer_link: Port-Channel3
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel3
  description: MLAG_address-locking-13_Port-Channel3
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel1
  description: L2_address-locking-uplink-parent_Port-Channel1
  shutdown: false
  mlag: 1
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
  no_spanning_tree_vlan: '4094'
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.100.0.1/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
