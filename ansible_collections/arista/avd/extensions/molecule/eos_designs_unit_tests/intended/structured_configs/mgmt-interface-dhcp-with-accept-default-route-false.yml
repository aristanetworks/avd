aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: mgmt-interface-dhcp-with-accept-default-route-false
ip_igmp_snooping:
  globally_enabled: true
management_interfaces:
- name: Management1
  description: Management Interface - DHCP
  shutdown: false
  vrf: MGMT
  ip_address: dhcp
  type: oob
  gateway: 10.1.1.1
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
service_routing_protocols_model: multi-agent
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 10.1.1.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
