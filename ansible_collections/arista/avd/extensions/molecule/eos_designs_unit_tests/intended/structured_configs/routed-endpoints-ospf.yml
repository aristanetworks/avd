aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet10
  description: ROUTER_ROUTER01_ge-0/0/0
  shutdown: false
  mtu: 1500
  ip_address: 10.50.0.1/29
  metadata:
    peer: ROUTER01
    peer_interface: ge-0/0/0
    peer_type: router
    peer_key: routers
  switchport:
    enabled: false
hostname: routed-endpoints-ospf
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.201.1/32
  ospf_area: 0.0.0.0
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: EOS_DESIGNS_UNIT_TESTS
  validate_hardware:
    enabled: false
router_ospf:
  process_ids:
  - id: 100
    passive_interface_default: true
    router_id: 192.168.201.1
    bfd_enable: false
    max_lsa: 12000
    redistribute:
      connected:
        enabled: true
    graceful_restart:
      enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
