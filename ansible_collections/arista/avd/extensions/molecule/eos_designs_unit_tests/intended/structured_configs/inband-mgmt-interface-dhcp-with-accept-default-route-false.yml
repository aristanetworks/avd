aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - apiserver.arista.io:443
  cvauth:
    method: token-secure
    token_file: /tmp/cv-onboarding-token
  cvvrf: INBAND_MGMT
  disable_aaa: false
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
enable_password:
  disabled: true
hostname: inband-mgmt-interface-dhcp-with-accept-default-route-false
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: INBAND_MGMT
    servers:
    - ip_address: 1.1.1.1
    - ip_address: 8.8.8.8
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
ntp:
  local_interface:
    name: Vlan4092
    vrf: INBAND_MGMT
  servers:
  - name: 2.2.2.55
    preferred: true
  - name: pool.ntp.org
  vrf: INBAND_MGMT
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4092
  description: Inband Management
  shutdown: false
  vrf: INBAND_MGMT
  ip_address: dhcp
  mtu: 1500
  metadata:
    type: inband_mgmt
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 103
  name: Inband management vlan
  metadata:
    tenants:
    - INBAND_MGMT_TESTS
- id: 105
  name: Inband_management_vlan_ipv6
  metadata:
    tenants:
    - INBAND_MGMT_TESTS
- id: 4092
  name: INBAND_MGMT
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
- name: INBAND_MGMT
