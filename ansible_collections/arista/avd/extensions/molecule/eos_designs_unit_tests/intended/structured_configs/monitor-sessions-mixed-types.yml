aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: SERVER_server1
  shutdown: false
  metadata:
    peer: server1
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
- name: Ethernet2
  shutdown: false
  metadata:
    peer_type: network_port
    peer_key: network_ports
  switchport:
    enabled: true
hostname: monitor-sessions-mixed-types
ip_igmp_snooping:
  globally_enabled: true
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.1.2/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
monitor_sessions:
- name: MIXED
  sources:
  - name: Ethernet1
    direction: rx
  destinations:
  - Ethernet2
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
