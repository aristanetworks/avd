aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: SERVER_server1
  shutdown: false
  metadata:
    peer: server1
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
- name: Ethernet2
  shutdown: false
  metadata:
    peer_type: network_port
    peer_key: network_ports
  switchport:
    enabled: true
hostname: monitor-sessions-mixed-types
ip_access_lists:
- name: MONITOR-SESSION-IP-ACL
  entries:
  - sequence: 10
    action: permit
    protocol: ip
    source: any
    destination: any
ip_igmp_snooping:
  globally_enabled: true
ipv6_access_lists:
- name: MONITOR-SESSION-IPV6-ACL
  entries:
  - protocol: ipv6
    source: any
    destination: any
    sequence: 10
    action: permit
mac_access_lists:
- name: MONITOR-SESSION-MAC-ACL
  entries:
  - sequence: 10
    action: permit any any
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.1.2/24
  type: oob
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
monitor_sessions:
- name: MIXED
  sources:
  - name: Ethernet1
    direction: rx
    access_group:
      type: ip
      name: MONITOR-SESSION-IP-ACL
      priority: 10
  destinations:
  - Ethernet2
- name: MONITOR-IPV6
  sources:
  - name: Ethernet1
    direction: rx
    access_group:
      type: ipv6
      name: MONITOR-SESSION-IPV6-ACL
- name: MONITOR-MAC
  sources:
  - name: Ethernet1
    direction: rx
    access_group:
      type: mac
      name: MONITOR-SESSION-MAC-ACL
      priority: 20
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
