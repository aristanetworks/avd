aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: MLAG_routed-endpoints-leaf1b_Ethernet3
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: routed-endpoints-leaf1b
    peer_interface: Ethernet3
    peer_type: mlag_peer
- name: Ethernet4
  description: MLAG_routed-endpoints-leaf1b_Ethernet4
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: routed-endpoints-leaf1b
    peer_interface: Ethernet4
    peer_type: mlag_peer
- name: Ethernet1
  description: P2P_routed-endpoints-spine1_Ethernet1
  shutdown: false
  mtu: 9214
  link_tracking_groups:
  - name: LT_GROUP1
    direction: upstream
  ip_address: 10.200.0.1/31
  metadata:
    peer: routed-endpoints-spine1
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet11
  description: SERVER_ROUTED_SERVER_nic1
  shutdown: false
  speed: forced 100gfull
  mtu: 9214
  ip_address: 10.30.1.0/31
  metadata:
    peer: ROUTED_SERVER
    peer_interface: nic1
    peer_type: server
    peer_key: servers
    port_profile: ROUTED
  switchport:
    enabled: false
- name: Ethernet12
  description: SERVER_ROUTED_SERVER_nic2
  shutdown: false
  ip_address: 10.30.1.2/31
  metadata:
    peer: ROUTED_SERVER
    peer_interface: nic2
    peer_type: server
    peer_key: servers
    port_profile: ROUTED_CHILD
  switchport:
    enabled: false
- name: Ethernet13
  description: SERVER_ROUTED_SERVER_nic3
  shutdown: false
  speed: forced 100gfull
  mtu: 9214
  metadata:
    peer: ROUTED_SERVER
    peer_interface: nic3
    peer_type: server
    peer_key: servers
    port_profile: ROUTED
  switchport:
    enabled: true
    mode: access
- name: Ethernet30
  description: SERVER_ROUTED_SERVER_nic4
  shutdown: false
  speed: forced 100gfull
  mtu: 9214
  ip_address: 10.30.1.4/31
  metadata:
    peer: ROUTED_SERVER
    peer_interface: nic4
    peer_type: server
    peer_key: servers
    port_profile: ROUTED
  switchport:
    enabled: false
- name: Ethernet14
  description: SERVER_ROUTED_SERVER_nic5
  shutdown: false
  flow_tracker:
    sampled: FLOW-TRACKER
  link_tracking_groups:
  - name: LT_GROUP1
    direction: downstream
  ip_address: 10.30.1.6/31
  ptp:
    enable: true
    announce:
      interval: 0
      timeout: 3
    delay_req: -3
    sync_message:
      interval: -3
    role: master
    transport: ipv4
  service_profile: QOS_PROFILE
  ip_proxy_arp: true
  metadata:
    peer: ROUTED_SERVER
    peer_interface: nic5
    peer_type: server
    peer_key: servers
  sflow:
    enable: true
  switchport:
    enabled: false
  eos_cli: '! custom routed cli'
- name: Ethernet10
  description: FIREWALL_FW01_eth1
  shutdown: false
  ip_address: 10.30.0.0/31
  metadata:
    peer: FW01
    peer_interface: eth1
    peer_type: firewall
    peer_key: firewalls
  switchport:
    enabled: false
- name: Ethernet20
  description: GPU_SERVERS
  shutdown: false
  speed: forced 100gfull
  mtu: 9214
  ip_address: 10.40.0.0/31
  metadata:
    peer: GPU_SERVERS
    peer_type: network_port
    peer_key: network_ports
    port_profile: ROUTED
  switchport:
    enabled: false
- name: Ethernet21
  description: GPU_SERVERS
  shutdown: false
  speed: forced 100gfull
  mtu: 9214
  ip_address: 10.40.0.2/31
  metadata:
    peer: GPU_SERVERS
    peer_type: network_port
    peer_key: network_ports
    port_profile: ROUTED
  switchport:
    enabled: false
- name: Ethernet31
  shutdown: false
  metadata:
    peer_type: network_port
    peer_key: network_ports
    port_profile: ACCESS
  switchport:
    enabled: true
    mode: access
    access_vlan: 10
- name: Ethernet32
  shutdown: false
  metadata:
    peer_type: network_port
    peer_key: network_ports
    port_profile: ACCESS
  switchport:
    enabled: true
    mode: access
    access_vlan: 10
flow_tracking:
  sampled:
    sample: 10000
    trackers:
    - name: FLOW-TRACKER
      record_export:
        on_inactive_timeout: 70000
        on_interval: 300000
      exporters:
      - name: CV-TELEMETRY
        collectors:
        - host: 127.0.0.1
        local_interface: Loopback0
        template_interval: 3600000
    shutdown: false
hostname: routed-endpoints-leaf1a
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
link_tracking_groups:
- name: LT_GROUP1
  recovery_delay: 300
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.200.3/32
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: EOS_DESIGNS_UNIT_TESTS
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: routed-endpoints-leaf1
  local_interface: Vlan4094
  peer_address: 10.200.1.1
  peer_link: Port-Channel3
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
monitor_sessions:
- name: MON1
  sources:
  - name: Ethernet14
port_channel_interfaces:
- name: Port-Channel3
  description: MLAG_routed-endpoints-leaf1b_Port-Channel3
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
router_bgp:
  as: '65101'
  router_id: 192.168.200.3
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65101'
    description: routed-endpoints-leaf1b
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  neighbors:
  - ip_address: 10.200.2.1
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: routed-endpoints-leaf1b
    description: routed-endpoints-leaf1b_Vlan4093
  - ip_address: 10.200.0.0
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: routed-endpoints-spine1
    description: routed-endpoints-spine1_Ethernet1
  redistribute:
    connected:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
sflow:
  destinations:
  - destination: 10.0.0.10
  run: true
spanning_tree:
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 10.200.2.0/31
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.200.1.0/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 10
  name: VLAN10
  metadata:
    tenants:
    - TENANT_A
vrfs:
- name: MGMT
  ip_routing: false
