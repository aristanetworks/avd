aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_underlay-ibgp-pod1-spine1_Ethernet3
  shutdown: false
  mtu: 9214
  ipv6_enable: true
  metadata:
    peer: underlay-ibgp-pod1-spine1
    peer_interface: Ethernet3
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_underlay-ibgp-pod1-spine2_Ethernet3
  shutdown: false
  mtu: 9214
  ipv6_enable: true
  metadata:
    peer: underlay-ibgp-pod1-spine2
    peer_interface: Ethernet3
    peer_type: spine
  switchport:
    enabled: false
hostname: underlay-ibgp-pod1-leaf3
ip_igmp_snooping:
  globally_enabled: true
ip_routing_ipv6_interfaces: true
ipv6_unicast_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.254.11.3/32
metadata:
  is_deployed: false
  fabric_name: EOS_DESIGNS_UNIT_TESTS
router_bgp:
  as: '65000'
  router_id: 10.254.11.3
  maximum_paths:
    paths: 128
    ecmp: 128
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: RR-UPLINK-PEERS
    metadata:
      type: ipv4
    description: Towards uplink route reflectors
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
  neighbor_interfaces:
  - name: Ethernet1
    remote_as: '65000'
    metadata:
      peer: underlay-ibgp-pod1-spine1
    peer_group: RR-UPLINK-PEERS
    description: underlay-ibgp-pod1-spine1_Ethernet3
  - name: Ethernet2
    remote_as: '65000'
    metadata:
      peer: underlay-ibgp-pod1-spine2
    peer_group: RR-UPLINK-PEERS
    description: underlay-ibgp-pod1-spine2_Ethernet3
  redistribute:
    connected:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: RR-UPLINK-PEERS
      activate: true
      next_hop:
        address_family_ipv6:
          enabled: true
          originate: true
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
