aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: MLAG_MLAG-MULTI-TENANT-VRF-L3LEAF1B_Ethernet3
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: MLAG-MULTI-TENANT-VRF-L3LEAF1B
    peer_interface: Ethernet3
    peer_type: mlag_peer
- name: Ethernet4
  description: MLAG_MLAG-MULTI-TENANT-VRF-L3LEAF1B_Ethernet4
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: MLAG-MULTI-TENANT-VRF-L3LEAF1B
    peer_interface: Ethernet4
    peer_type: mlag_peer
- name: Ethernet1
  description: P2P_MLAG-MULTI-TENANT-VRF-SPINE1_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 172.31.255.1/31
  metadata:
    peer: MLAG-MULTI-TENANT-VRF-SPINE1
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
hostname: MLAG-MULTI-TENANT-VRF-L3LEAF1A
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:dc:01
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.101/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.101/32
- name: Loopback20
  description: TENANT2
  shutdown: false
  vrf: VRF1
  ip_address: 172.26.128.12/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.201.201/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-LAB
  fabric_name: EOS_DESIGNS_UNIT_TESTS
mlag_configuration:
  domain_id: MLAG_MULTI_TENANT_VRF_L3LEAF1
  local_interface: Vlan4094
  peer_address: 10.255.252.1
  peer_link: Port-Channel3
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel3
  description: MLAG_MLAG-MULTI-TENANT-VRF-L3LEAF1B_Port-Channel3
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.251.0/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 192.168.255.101
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65101'
    description: MLAG-MULTI-TENANT-VRF-L3LEAF1B
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.255.251.1
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: MLAG-MULTI-TENANT-VRF-L3LEAF1B
    description: MLAG-MULTI-TENANT-VRF-L3LEAF1B_Vlan4093
  - ip_address: 172.31.255.0
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: MLAG-MULTI-TENANT-VRF-SPINE1
    description: MLAG-MULTI-TENANT-VRF-SPINE1_Ethernet1
  - ip_address: 192.168.255.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: MLAG-MULTI-TENANT-VRF-SPINE1
    description: MLAG-MULTI-TENANT-VRF-SPINE1_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 666
    metadata:
      tenants:
      - TENANT1
    rd: 192.168.255.101:10666
    route_targets:
      both:
      - 10666:10666
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: VRF1
    rd: 192.168.255.101:14
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '14:14'
      export:
      - address_family: evpn
        route_targets:
        - '14:14'
    router_id: 192.168.255.101
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.255.251.1
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: MLAG-MULTI-TENANT-VRF-L3LEAF1B_Vlan3013
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
virtual_source_nat_vrfs:
- name: VRF1
  ip_address: 172.26.128.12
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 10.255.251.0/31
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.255.252.0/31
  mtu: 9214
  no_autostate: true
- name: Vlan666
  description: MDR-COLLECTORS
  shutdown: false
  vrf: VRF1
  ip_address_virtual: 192.168.42.1/29
  metadata:
    tenants:
    - TENANT1
- name: Vlan3013
  description: MLAG_L3_VRF_VRF1
  shutdown: false
  vrf: VRF1
  ip_address: 10.255.251.0/31
  mtu: 9214
  metadata:
    tenants:
    - TENANT1
    type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 666
  name: MDR-COLLECTORS
  metadata:
    tenants:
    - TENANT1
- id: 3013
  name: MLAG_L3_VRF_VRF1
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TENANT1
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF1
  ip_routing: true
  metadata:
    tenants:
    - TENANT1
vxlan_interface:
  vxlan1:
    description: MLAG-MULTI-TENANT-VRF-L3LEAF1A_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
      vlans:
      - id: 666
        vni: 10666
      vrfs:
      - name: VRF1
        vni: 9014
