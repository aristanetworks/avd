aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: ethernet1
  description: P2P_peer1_ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 192.168.2.0/31
  isis_enable: EVPN_UNDERLAY
  isis_metric: 50
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  isis_authentication:
    both:
      key_type: '7'
      key: $1c$sTNAlR6rKSw=
      mode: md5
  metadata:
    peer: peer1
    peer_interface: ethernet1
    peer_type: other
  switchport:
    enabled: false
- name: ethernet2
  description: P2P_peer2_ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 192.168.2.2/31
  isis_enable: EVPN_UNDERLAY
  isis_metric: 50
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  isis_authentication:
    both:
      key_type: '7'
      key: $1c$sTNAlR6rKSw=
      mode: md5
  metadata:
    peer: peer2
    peer_interface: ethernet2
    peer_type: other
  switchport:
    enabled: false
hostname: l3-edge-isis-underlay-auth
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 1.2.5.1/32
  isis_enable: EVPN_UNDERLAY
  isis_passive: true
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
router_isis:
  instance: EVPN_UNDERLAY
  net: 49.0001.0010.0200.5001.00
  router_id: 1.2.5.1
  is_type: level-2
  log_adjacency_changes: true
  address_family_ipv4:
    enabled: true
    maximum_paths: 4
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
