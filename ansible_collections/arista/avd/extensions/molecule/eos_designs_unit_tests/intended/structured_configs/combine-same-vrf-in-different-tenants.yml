aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
hostname: combine-same-vrf-in-different-tenants
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:dc:00:00:00:0b
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.201/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 192.168.254.201/32
metadata:
  is_deployed: true
  fabric_name: EOS_DESIGNS_UNIT_TESTS
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65201'
  router_id: 192.168.255.201
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 100
    metadata:
      tenants:
      - TENANT_A
      - TENANT_B
    rd: 192.168.255.201:20100
    route_targets:
      both:
      - 20100:20100
    redistribute_routes:
    - learned
  - id: 101
    metadata:
      tenants:
      - TENANT_A
    rd: 192.168.255.201:20101
    route_targets:
      both:
      - 20101:20101
    redistribute_routes:
    - learned
  - id: 102
    metadata:
      tenants:
      - TENANT_B
    rd: 192.168.255.201:20102
    route_targets:
      both:
      - 20102:20102
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: SHARED_VRF
    rd: 192.168.255.201:200
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 200:200
      export:
      - address_family: evpn
        route_targets:
        - 200:200
    router_id: 192.168.255.201
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan100
  description: VLAN100
  shutdown: false
  vrf: SHARED_VRF
  ip_address_virtual: 10.100.100.1/24
  metadata:
    tenants:
    - TENANT_A
    - TENANT_B
- name: Vlan101
  description: VLAN101
  shutdown: false
  vrf: SHARED_VRF
  ip_address_virtual: 10.100.101.1/24
  metadata:
    tenants:
    - TENANT_A
- name: Vlan102
  description: VLAN102
  shutdown: false
  vrf: SHARED_VRF
  ip_address_virtual: 10.100.102.1/24
  metadata:
    tenants:
    - TENANT_B
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 100
  name: VLAN100
  metadata:
    tenants:
    - TENANT_A
    - TENANT_B
- id: 101
  name: VLAN101
  metadata:
    tenants:
    - TENANT_A
- id: 102
  name: VLAN102
  metadata:
    tenants:
    - TENANT_B
vrfs:
- name: MGMT
  ip_routing: false
- name: SHARED_VRF
  ip_routing: true
  metadata:
    tenants:
    - TENANT_A
    - TENANT_B
vxlan_interface:
  vxlan1:
    description: combine-same-vrf-in-different-tenants_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 100
        vni: 20100
      - id: 101
        vni: 20101
      - id: 102
        vni: 20102
      vrfs:
      - name: SHARED_VRF
        vni: 200
