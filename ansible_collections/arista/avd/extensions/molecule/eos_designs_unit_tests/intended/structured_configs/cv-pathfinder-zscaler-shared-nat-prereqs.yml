prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.42.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
    set:
    - extcommunity soo 192.168.42.1:188 additive
- name: RM-EVPN-SOO-IN
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - extcommunity ECL-EVPN-SOO
  - sequence: 20
    type: permit
- name: RM-EVPN-SOO-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    set:
    - extcommunity soo 192.168.42.1:188 additive
- name: RM-EVPN-EXPORT-VRF-DEFAULT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - extcommunity ECL-EVPN-SOO
router_adaptive_virtual_topology:
  topology_role: edge
  region:
    name: AVD_Land_Test
    id: 88
  zone:
    name: AVD_Land_Test-ZONE
    id: 1
  site:
    name: Site188
    id: 188
  profiles:
  - name: DEFAULT-POLICY-APP-1
    load_balance_policy: LB-DEFAULT-POLICY-APP-1
    internet_exit_policy: ZSCALER-EXIT-POLICY-1
  - name: DEFAULT-POLICY-APP-2
    load_balance_policy: LB-DEFAULT-POLICY-APP-2
    internet_exit_policy: ZSCALER-EXIT-POLICY-2
  - name: DEFAULT-POLICY-DEFAULT
    load_balance_policy: LB-DEFAULT-POLICY-DEFAULT
  - name: DEFAULT-POLICY-CONTROL-PLANE
    load_balance_policy: LB-DEFAULT-POLICY-CONTROL-PLANE
  policies:
  - name: DEFAULT-POLICY
    matches:
    - application_profile: APP-1
      avt_profile: DEFAULT-POLICY-APP-1
    - application_profile: APP-2
      avt_profile: DEFAULT-POLICY-APP-2
    - application_profile: default
      avt_profile: DEFAULT-POLICY-DEFAULT
  - name: DEFAULT-POLICY-WITH-CP
    matches:
    - application_profile: APP-PROFILE-CONTROL-PLANE
      avt_profile: DEFAULT-POLICY-CONTROL-PLANE
    - application_profile: APP-1
      avt_profile: DEFAULT-POLICY-APP-1
    - application_profile: APP-2
      avt_profile: DEFAULT-POLICY-APP-2
    - application_profile: default
      avt_profile: DEFAULT-POLICY-DEFAULT
  vrfs:
  - name: PROD
    policy: DEFAULT-POLICY
    profiles:
    - name: DEFAULT-POLICY-APP-1
      id: 2
    - name: DEFAULT-POLICY-APP-2
      id: 4
    - name: DEFAULT-POLICY-DEFAULT
      id: 1
  - name: default
    policy: DEFAULT-POLICY-WITH-CP
    profiles:
    - name: DEFAULT-POLICY-CONTROL-PLANE
      id: 254
    - name: DEFAULT-POLICY-APP-1
      id: 2
    - name: DEFAULT-POLICY-APP-2
      id: 4
    - name: DEFAULT-POLICY-DEFAULT
      id: 1
