        - '1:1'
        - route-map RM-EVPN-EXPORT-VRF-DEFAULT
  - name: PROD
    rd: 192.168.42.1:42
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '42:42'
      export:
      - address_family: evpn
        route_targets:
        - '42:42'
    router_id: 192.168.42.1
    redistribute:
      connected:
        enabled: true
