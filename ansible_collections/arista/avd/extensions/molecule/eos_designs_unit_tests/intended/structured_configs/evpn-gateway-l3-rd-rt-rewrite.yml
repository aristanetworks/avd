vrfs:
- name: MGMT
  ip_routing: false
- name: VRF10
  ip_routing: true
  metadata:
    tenants:
    - EVPN_GATEWAY_TESTS
- name: VRF11
  ip_routing: true
  metadata:
    tenants:
    - EVPN_GATEWAY_TESTS
- name: VRF_RT_IMPORT_DOMAIN_ALL_EXPORT_DOMAIN_REMOTE
  ip_routing: true
  metadata:
    tenants:
    - RD_RT_REWRITE_PARTIAL_TESTS
- name: VRF_RT_IMPORT_DOMAIN_REMOTE_EXPORT_DOMAIN_ALL
