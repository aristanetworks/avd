      - id: 3402
        vni: 13402
      - id: 301
        vni: 30301
      - id: 302
        vni: 30302
      - id: 303
        vni: 30303
      - id: 304
        vni: 30304
      vrfs:
      - name: VRF10
        vni: 10
      - name: VRF11
        vni: 11
      - name: VRF_RT_IMPORT_DOMAIN_ALL_EXPORT_DOMAIN_REMOTE
        vni: 30
      - name: VRF_RT_IMPORT_DOMAIN_REMOTE_EXPORT_DOMAIN_ALL
