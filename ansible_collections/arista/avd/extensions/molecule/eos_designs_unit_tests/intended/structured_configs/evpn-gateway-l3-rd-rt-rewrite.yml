- name: VRF_RT_NO_IMPORT_LOCAL_EXPORT
  ip_routing: true
  metadata:
    tenants:
    - RD_RT_REWRITE_PARTIAL_TESTS
vxlan_interface:
  vxlan1:
    description: evpn-gateway-l3-rd-rt-rewrite_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 11
        vni: 10011
      - id: 12
        vni: 10012
      - id: 21
        vni: 10021
      - id: 22
        vni: 10022
      - id: 300
        vni: 10300
      - id: 3401
