!
no enable password
no aaa root
!
address locking
   disabled
   dhcp server interface Port-Channel1
   dhcp server interface Port-Channel3
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname address-locking-13
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 16384
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
interface Port-Channel1
   description L2_address-locking-uplink-parent_Port-Channel1
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 1
!
interface Port-Channel3
   description MLAG_address-locking-14_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description L2_address-locking-uplink-parent_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet3
   description MLAG_address-locking-14_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_address-locking-14_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.100.0.10/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.100.0.0/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id ADDRESS_LOCKING_MLAG_PAIR
   local-interface Vlan4094
   peer-address 10.100.0.1
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
end
