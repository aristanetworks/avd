!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname platform-settings
!
vrf instance MGMT
!
management security
   entropy source hardware haveged cpu jitter
   entropy source hardware exclusive
!
interface Port-Channel18
   no shutdown
   no switchport
!
interface Port-Channel19
   no shutdown
   no switchport
!
interface Ethernet10
   no shutdown
   no switchport
!
interface Ethernet10.10
   description test sub interface mtu false
   no shutdown
   encapsulation dot1q vlan 10
   ip address 10.10.10.10/24
!
interface Ethernet12
   description Interface Created from platform_settings.structured_config
   switchport
!
interface Ethernet13
   description SERVER_SPEED_TEST_SERVER_Eth1
   no shutdown
   switchport
!
interface Ethernet14
   description SERVER_SPEED_TEST_SERVER_Eth2
   no shutdown
   speed auto
   switchport
!
interface Ethernet15
   description SERVER_SPEED_TEST_SERVER_Eth3
   no shutdown
   speed 100g
   switchport
!
interface Ethernet16
   description SPEED_TEST_NETWORK_PORT
   no shutdown
   switchport
!
interface Ethernet17
   no shutdown
   no switchport
!
interface Ethernet18
   no shutdown
   channel-group 18 mode active
!
interface Ethernet19
   no shutdown
   channel-group 19 mode active
!
interface Ethernet20
   no shutdown
   no switchport
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.101/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.101/32
!
interface Vxlan1
   description platform-settings_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf default vni 1
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 101
   router-id 192.168.255.101
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vrf default
      rd 192.168.255.101:1
      route-target import evpn 1:1
      route-target export evpn 1:1
!
end
