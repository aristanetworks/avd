!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname combine-same-vrf-ospf-in-different-tenants
!
vlan 200
   name VLAN200
!
vlan 201
   name VLAN201
!
vrf instance MGMT
!
vrf instance OSPF_VRF
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.169.255.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.169.254.1/32
!
interface Vlan200
   description VLAN200
   no shutdown
   vrf OSPF_VRF
   ip ospf area 0.0.0.0
   ip address virtual 10.200.200.1/24
!
interface Vlan201
   description VLAN201
   no shutdown
   vrf OSPF_VRF
   ip ospf area 0.0.0.0
   ip address virtual 10.200.201.1/24
!
interface Vxlan1
   description combine-same-vrf-ospf-in-different-tenants_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 200 vni 30200
   vxlan vlan 201 vni 30201
   vxlan vrf OSPF_VRF vni 300
!
ip virtual-router mac-address 00:dc:00:00:00:0c
!
ip routing
no ip routing vrf MGMT
ip routing vrf OSPF_VRF
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.169.255.0/24 eq 32
   seq 20 permit 192.169.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65301
   router-id 192.169.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 200
      rd 192.169.255.1:30200
      route-target both 30200:30200
      redistribute learned
   !
   vlan 201
      rd 192.169.255.1:30201
      route-target both 30201:30201
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf OSPF_VRF
      rd 192.169.255.1:300
      route-target import evpn 300:300
      route-target export evpn 300:300
      router-id 192.169.255.1
      redistribute connected
      redistribute ospf
!
router ospf 300 vrf OSPF_VRF
   router-id 192.169.255.1
   bfd default
   passive-interface default
   no passive-interface Vlan200
   no passive-interface Vlan201
   redistribute bgp
   max-lsa 15000
!
end
