!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dot1x-settings-2
!
vrf instance MGMT
!
radius-server host agni.arista.com vrf MGMT key 7 1404071B09166738212B2130365E0C131A
radius-server host agni2.arista.com vrf MGMT key 7 00170616014946150A225E4B1D540E120B
radius-server host coa.arista.com vrf MGMT key 7 0215114B0E144232494D1B1C115A190E15
!
aaa group server radius agni-server-group
   server agni.arista.com vrf MGMT
!
aaa group server radius backup-agni-server-group
   server agni2.arista.com vrf MGMT
!
aaa group server radius coa-server-group
   server coa.arista.com vrf MGMT
!
aaa authentication dot1x default group agni-server-group group backup-agni-server-group
aaa authorization dynamic dot1x additional-groups group coa-server-group
aaa accounting dot1x default stop-only group agni-server-group multicast group backup-agni-server-group multicast logging
dot1x
   radius av-pair service-type
   mac-based-auth radius av-pair user-name delimiter colon uppercase
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
no ip routing vrf MGMT
!
ip radius vrf MGMT source-interface Management1
!
dot1x system-auth-control
dot1x protocol lldp bypass
dot1x protocol bpdu bypass
dot1x dynamic-authorization
!
end
