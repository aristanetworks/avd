!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname vlan-tags-mlag-l2leaf1a
!
no spanning-tree vlan-id 4094
!
vlan 110
   name SVI_ESX
!
vlan 600
   name L2VLAN_ESX
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
interface Port-Channel47
   description MLAG_vlan-tags-mlag-l2leaf1b_Port-Channel47
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description vlan_tags=[ESX] -> 110,600
   no shutdown
   switchport trunk allowed vlan 110,600
   switchport mode trunk
   switchport
!
interface Ethernet47
   description MLAG_vlan-tags-mlag-l2leaf1b_Ethernet47
   no shutdown
   channel-group 47 mode active
!
interface Ethernet48
   description MLAG_vlan-tags-mlag-l2leaf1b_Ethernet48
   no shutdown
   channel-group 47 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.11/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.0/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id VLAN_TAGS_MLAG_L2LEAF1
   local-interface Vlan4094
   peer-address 10.255.252.1
   peer-link Port-Channel47
   reload-delay mlag 300
   reload-delay non-mlag 330
!
end
