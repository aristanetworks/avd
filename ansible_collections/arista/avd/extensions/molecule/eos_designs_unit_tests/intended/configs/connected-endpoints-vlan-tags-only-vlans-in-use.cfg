!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname connected-endpoints-vlan-tags-only-vlans-in-use
!
vlan 110
   name SVI_ESX_IN_USE
!
vlan 200
   name L2VLAN_ACCESS_IN_USE
!
vlan 600
   name L2VLAN_ESX_IN_USE
!
vrf instance MGMT
!
interface Ethernet1
   description vlan_tags=[ESX] -> 110,600 (701 is in TENANT_B which is filtered out)
   no shutdown
   switchport trunk allowed vlan 110,600
   switchport mode trunk
   switchport
!
interface Ethernet2
   description access vlan 200
   no shutdown
   switchport access vlan 200
   switchport mode access
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
no ip routing vrf MGMT
!
end
