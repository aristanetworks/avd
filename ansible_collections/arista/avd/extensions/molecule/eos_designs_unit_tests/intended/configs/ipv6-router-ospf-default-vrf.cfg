!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ipv6-router-ospf-default-vrf
!
vlan 201
   name default_201
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.110/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.110/32
!
interface Vlan201
   description default_201 description
   no shutdown
   ipv6 enable
   ipv6 address cafe::cafe/64
   ipv6 ospf 101 area 0.0.0.0
!
interface Vxlan1
   description ipv6-router-ospf-default-vrf_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 201 vni 10201
   vxlan vrf default vni 2
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 102
   router-id 192.168.255.110
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   redistribute ospfv3
   !
   vlan 201
      rd 192.168.255.110:10201
      route-target both 10201:10201
      redistribute learned
   !
   vrf default
      rd 192.168.255.110:2
      route-target import evpn 2:2
      route-target export evpn 2:2
!
ipv6 router ospf 101
   router-id 192.168.255.110
   redistribute bgp
   redistribute connected route-map ipv6_ospf_rm
!
end
