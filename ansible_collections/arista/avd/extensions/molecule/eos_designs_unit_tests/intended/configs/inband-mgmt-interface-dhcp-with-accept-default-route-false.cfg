!
no enable password
no aaa root
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=INBAND_MGMT -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname inband-mgmt-interface-dhcp-with-accept-default-route-false
ip name-server vrf INBAND_MGMT 1.1.1.1
ip name-server vrf INBAND_MGMT 8.8.8.8
!
vlan 103
   name Inband management vlan
!
vlan 105
   name Inband_management_vlan_ipv6
!
vlan 4092
   name INBAND_MGMT
!
vrf instance INBAND_MGMT
!
vrf instance MGMT
!
interface Vlan4092
   description Inband Management
   no shutdown
   mtu 1500
   vrf INBAND_MGMT
   ip address dhcp
no ip routing vrf MGMT
!
ip route vrf INBAND_MGMT 0.0.0.0/0 10.10.10.1/24
!
ntp local-interface vrf INBAND_MGMT Vlan4092
ntp server vrf INBAND_MGMT 2.2.2.55 prefer
ntp server vrf INBAND_MGMT pool.ntp.org
!
end
