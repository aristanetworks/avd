!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname duplicate-vrfs
!
vlan 100
   name VLAN100
!
vlan 200
   name VLAN200
!
vrf instance MGMT
!
vrf instance VRF1
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.101/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.101/32
!
interface Vlan100
   description VLAN100
   no shutdown
   vrf VRF1
   ip address virtual 10.0.100.1/24
!
interface Vlan200
   description VLAN200
   no shutdown
   vrf VRF1
   ip address virtual 10.0.200.1/24
!
interface Vxlan1
   description duplicate-vrfs_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 200 vni 10200
   vxlan vrf VRF1 vni 1
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF1
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 101
   router-id 192.168.255.101
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 192.168.255.101:10100
      route-target both 10100:10100
      redistribute learned
   !
   vlan 200
      rd 192.168.255.101:10200
      route-target both 10200:10200
      redistribute learned
   !
   vrf VRF1
      rd 192.168.255.101:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      router-id 192.168.255.101
      redistribute connected
!
end
