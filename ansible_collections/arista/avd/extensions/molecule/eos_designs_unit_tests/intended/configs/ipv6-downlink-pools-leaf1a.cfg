!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ipv6-downlink-pools-leaf1a
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_ipv6-downlink-pools-spine_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:12::2/64
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8:13::1/128
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.1.31/24
!
interface Vxlan1
   description ipv6-downlink-pools-leaf1a_VTEP
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan encapsulation ipv6
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8:13::/48 eq 128
!
ipv6 unicast-routing
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.255.1.1
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 2001:db8:12::1 peer group IPv4-UNDERLAY-PEERS
   neighbor 2001:db8:12::1 remote-as 65100
   neighbor 2001:db8:12::1 description ipv6-downlink-pools-spine_Ethernet1
   neighbor 2001:db8::1 peer group EVPN-OVERLAY-PEERS
   neighbor 2001:db8::1 remote-as 65100
   neighbor 2001:db8::1 description ipv6-downlink-pools-spine_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv6
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
