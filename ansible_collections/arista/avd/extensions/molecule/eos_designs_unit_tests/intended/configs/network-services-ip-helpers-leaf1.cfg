!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ip-helpers-leaf1
!
spanning-tree mode none
!
vlan 10
   name SVI1
!
vrf instance IP_HELPERS1
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.0.255.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.2.1/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.1.1.1/24
!
interface Vlan10
   description SVI1
   shutdown
   vrf IP_HELPERS1
   ip helper-address 1.1.1.1 vrf MGMT source-interface Management1
   ip helper-address 1.1.1.2 vrf MGMT source-interface Management1
   ip helper-address 1.1.1.3 vrf MGMT source-interface Management1
!
interface Vxlan1
   description network-services-ip-helpers-leaf1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 1010
   vxlan vrf IP_HELPERS1 vni 100
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
ip routing vrf IP_HELPERS1
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.0.255.0/24 eq 32
   seq 20 permit 10.255.2.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.0.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 192.0.255.1:1010
      route-target both 1010:1010
      redistribute learned
   !
   vrf IP_HELPERS1
      rd 192.0.255.1:100
      route-target import evpn 100:100
      route-target export evpn 100:100
      router-id 192.0.255.1
      redistribute connected
!
end
