!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname aaa-settings-4
!
vrf instance MGMT
!
radius-server host 11.10.10.6 tls ssl-profile HOST_SSL_PROFILE port 2083
radius-server host 11.10.10.5 vrf MGMT tls ssl-profile HOST_SSL_PROFILE port 2080
radius-server host 11.10.10.7 vrf MGMT key 7 071B245F5A
!
aaa group server radius RADIUS_TLS
   server 11.10.10.5 vrf MGMT tls port 2080
   server 11.10.10.6 vrf default tls port 2083
   server 11.10.10.7 vrf MGMT
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
no ip routing vrf MGMT
!
ip radius vrf MGMT source-interface Vlan125
!
end
