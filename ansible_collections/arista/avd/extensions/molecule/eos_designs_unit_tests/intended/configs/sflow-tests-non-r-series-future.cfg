!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname sflow-tests-non-r-series-future
!
sflow vrf MGMT destination 10.10.10.10
sflow vrf MGMT destination 10.10.10.11
sflow vrf MGMT source-interface Management1
sflow vrf sflowvrf destination 10.10.10.12 1234
sflow vrf sflowvrf source-interface Loopback321
sflow run
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet10
   description P2P_sflow-tests-r-series-no-future_Ethernet10
   no shutdown
   mtu 9214
   no switchport
   sflow enable
!
interface Ethernet10.100
   description P2P_sflow-tests-r-series-no-future_Ethernet10.100
   no shutdown
   mtu 9214
   no switchport
   sflow enable
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.0.5/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.51/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/27 eq 32
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65200
   router-id 10.255.0.5
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
