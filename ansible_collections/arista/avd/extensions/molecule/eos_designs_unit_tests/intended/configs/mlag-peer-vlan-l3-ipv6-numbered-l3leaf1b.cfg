!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-peer-vlan-l3-ipv6-numbered-l3leaf1b
!
no spanning-tree vlan-id 4094
!
vlan 11
   name VRF10_VLAN11
!
vlan 21
   name VRF11_VLAN21
!
vlan 3009
   name MLAG_L3_VRF_VRF10
   trunk group MLAG
!
vlan 3010
   name MLAG_L3_VRF_VRF11
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF10
!
vrf instance VRF11
!
interface Port-Channel5
   description MLAG_mlag-peer-vlan-l3-ipv6-numbered-l3leaf1a_Port-Channel5
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet5
   description MLAG_mlag-peer-vlan-l3-ipv6-numbered-l3leaf1a_Ethernet5
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description MLAG_mlag-peer-vlan-l3-ipv6-numbered-l3leaf1a_Ethernet6
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8:50::2/128
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ipv6 address 2001:db8:51:1::1/128
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.121/24
!
interface Vlan11
   description VRF10_VLAN11
   shutdown
   vrf VRF10
   ipv6 enable
   ipv6 address virtual 2001:DB8:11::1/64
!
interface Vlan21
   description VRF11_VLAN21
   shutdown
   vrf VRF11
   ipv6 enable
   ipv6 address virtual 2001:DB8:21::1/64
!
interface Vlan3009
   description MLAG_L3_VRF_VRF10
   no shutdown
   mtu 9214
   vrf VRF10
   ipv6 address 2001:db8:52::2/64
!
interface Vlan3010
   description MLAG_L3_VRF_VRF11
   no shutdown
   mtu 9214
   vrf VRF11
   ipv6 address 2001:db8:52::2/64
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ipv6 address 2001:db8:52::2/64
!
interface Vxlan1
   description mlag-peer-vlan-l3-ipv6-numbered-l3leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan encapsulation ipv6
   vxlan vlan 11 vni 10011
   vxlan vlan 21 vni 10021
   vxlan vrf VRF10 vni 10
   vxlan vrf VRF11 vni 11
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF10
ip routing vrf VRF11
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8:50::/48 eq 128
   seq 20 permit 2001:db8:51::/48 eq 128
!
ipv6 prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 2001:db8:52::/64
!
ipv6 unicast-routing
ipv6 unicast-routing vrf VRF10
ipv6 unicast-routing vrf VRF11
!
mlag configuration
   domain-id MLAG_PEER_VLAN_L3_IPV6_NUMBERED
   local-interface Vlan4094
   peer-address 2001:db8:52::1
   peer-link Port-Channel5
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ipv6 address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65150
   router-id 10.10.50.2
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65150
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description mlag-peer-vlan-l3-ipv6-numbered-l3leaf1a
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 2001:db8:52::1 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 2001:db8:52::1 description mlag-peer-vlan-l3-ipv6-numbered-l3leaf1a_Vlan4094
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 11
      rd 10.10.50.2:10011
      route-target both 10011:10011
      redistribute learned
   !
   vlan 21
      rd 10.10.50.2:10021
      route-target both 10021:10021
      redistribute learned
   !
   address-family ipv6
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF10
      rd 10.10.50.2:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.10.50.2
      update wait-install
      neighbor 2001:db8:52::1 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 2001:db8:52::1 description mlag-peer-vlan-l3-ipv6-numbered-l3leaf1a_Vlan3009
      redistribute connected route-map RM-CONN-2-BGP-VRFS
   !
   vrf VRF11
      rd 10.10.50.2:11
      route-target import evpn 11:11
      route-target export evpn 11:11
      router-id 10.10.50.2
      update wait-install
      neighbor 2001:db8:52::1 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 2001:db8:52::1 description mlag-peer-vlan-l3-ipv6-numbered-l3leaf1a_Vlan3010
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
