!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ip-helpers-3
!
spanning-tree mode none
!
vlan 11
   name SVI2
!
vrf instance IP_HELPERS3
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.0.255.11/32
!
interface Vlan11
   description SVI2
   shutdown
   vrf IP_HELPERS3
   ip helper-address 1.1.1.4 vrf INBANDMGMT source-interface vlan100
!
ip routing
ip routing vrf IP_HELPERS3
no ip routing vrf MGMT
!
end
