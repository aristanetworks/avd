!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname snmp-settings-vrf-ipv4-standard-acl
!
snmp-server ipv4 access-list SNMP-VRF-ACL vrf MGMT
snmp-server vrf MGMT
!
vrf instance MGMT
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.10.10.43/26
!
ip access-list standard SNMP-VRF-ACL
   10 permit host 10.0.0.14
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 10.10.10.1
!
end
