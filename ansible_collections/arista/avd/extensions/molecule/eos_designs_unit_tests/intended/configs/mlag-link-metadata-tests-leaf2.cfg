!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-link-metadata-tests-leaf2
!
no spanning-tree vlan-id 4094
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
interface Port-Channel3
   description MLAG_mlag-link-metadata-tests-leaf1_Port-Channel7
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet3
   description MLAG_mlag-link-metadata-tests-leaf1_Ethernet7
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_mlag-link-metadata-tests-leaf1_Ethernet8
   no shutdown
   channel-group 3 mode active
!
interface Ethernet5
   description MLAG_mlag-link-metadata-tests-leaf1_Ethernet9
   no shutdown
   channel-group 3 mode active
!
interface Ethernet6
   description MLAG_mlag-link-metadata-tests-leaf1_Ethernet10
   no shutdown
   channel-group 3 mode active
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.0/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id MLAG_LINK_METADATA_TESTS
   local-interface Vlan4094
   peer-address 10.255.252.1
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
end
