!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname connected-endpoints-no-network-services
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet19
   description SERVER_OLD_SW-1/8_Endpoint_port4
   no shutdown
   switchport mode trunk
   switchport
!
interface Ethernet20
   description connected-endpoints-no-network-services_vlans="all->alias of EOS's default/implicit '1-4094'"
   no shutdown
   switchport mode trunk
   switchport
!
interface Ethernet21
   description connected-endpoints-no-network-services_vlans="defined_vlans->none"
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Ethernet22
   description connected-endpoints-no-network-services_vlans="100,200"
   no shutdown
   switchport trunk allowed vlan 100,200
   switchport mode trunk
   switchport
!
interface Ethernet23
   description connected-endpoints-no-network-services_vlans="none"
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
no ip routing vrf MGMT
!
end
