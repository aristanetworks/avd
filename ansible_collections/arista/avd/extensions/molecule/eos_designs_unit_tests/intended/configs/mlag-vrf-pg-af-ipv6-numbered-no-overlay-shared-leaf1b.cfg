!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-vrf-pg-af-ipv6-numbered-no-overlay-shared-leaf1b
!
no spanning-tree vlan-id 4093-4094
!
vlan 110
   name VLAN110_IPV4
!
vlan 111
   name VLAN111_IPV6
!
vlan 3009
   name MLAG_L3_VRF_VRF_DUAL_STACK
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF_DUAL_STACK
!
interface Port-Channel11
   description MLAG_mlag-vrf-pg-af-ipv6-numbered-no-overlay-shared-leaf1a_Port-Channel11
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet11
   description MLAG_mlag-vrf-pg-af-ipv6-numbered-no-overlay-shared-leaf1a_Ethernet11
   no shutdown
   channel-group 11 mode active
!
interface Ethernet12
   description MLAG_mlag-vrf-pg-af-ipv6-numbered-no-overlay-shared-leaf1a_Ethernet12
   no shutdown
   channel-group 11 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8:1::1e/128
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ipv6 address 2001:db8:5:1d::1/128
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.130/24
!
interface Vlan110
   description VLAN110_IPV4
   shutdown
   vrf VRF_DUAL_STACK
   ip address virtual 10.10.110.1/24
!
interface Vlan111
   description VLAN111_IPV6
   shutdown
   vrf VRF_DUAL_STACK
   ipv6 enable
   ipv6 address virtual 2001:db8:111::1/64
!
interface Vlan3009
   description MLAG_L3_VRF_VRF_DUAL_STACK
   no shutdown
   mtu 9214
   vrf VRF_DUAL_STACK
   ipv6 address 2001:db8:4:1c::2/64
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ipv6 address 2001:db8:4:1c::2/64
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ipv6 address 2001:db8:3:1c::2/64
!
interface Vxlan1
   description mlag-vrf-pg-af-ipv6-numbered-no-overlay-shared-leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan encapsulation ipv6
   vxlan vlan 110 vni 10110
   vxlan vlan 111 vni 10111
   vxlan vrf VRF_DUAL_STACK vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_DUAL_STACK
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8:1::/48 eq 128
   seq 20 permit 2001:db8:5::/48 eq 128
!
ipv6 prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 2001:db8:4:1c::/64
!
ipv6 unicast-routing
ipv6 unicast-routing vrf VRF_DUAL_STACK
!
mlag configuration
   domain-id MLAG_VRF_PG_AF_IPV6_NUMBERED_NO_OVERLAY_SHARED
   local-interface Vlan4094
   peer-address 2001:db8:3:1c::1
   peer-link Port-Channel11
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ipv6 address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65125
   router-id 10.255.1.30
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65125
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description mlag-vrf-pg-af-ipv6-numbered-no-overlay-shared-leaf1a
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 2001:db8:4:1c::1 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 2001:db8:4:1c::1 description mlag-vrf-pg-af-ipv6-numbered-no-overlay-shared-leaf1a_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 110
      rd 10.255.1.30:10110
      route-target both 10110:10110
      redistribute learned
   !
   vlan 111
      rd 10.255.1.30:10111
      route-target both 10111:10111
      redistribute learned
   !
   address-family ipv6
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF_DUAL_STACK
      rd 10.255.1.30:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.255.1.30
      neighbor 2001:db8:4:1c::1 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 2001:db8:4:1c::1 description mlag-vrf-pg-af-ipv6-numbered-no-overlay-shared-leaf1a_Vlan3009
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
