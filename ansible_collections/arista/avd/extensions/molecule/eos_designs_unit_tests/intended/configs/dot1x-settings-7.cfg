!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dot1x-settings-7
!
vrf instance MGMT
!
radius-server host agni.arista.com vrf MGMT key 7 1404071B09166738212B2130365E0C131A
!
aaa authentication dot1x default group radius
aaa accounting dot1x default start-stop group radius
dot1x
   radius av-pair lldp system-name
   radius av-pair lldp system-description
   radius av-pair dhcp hostname
   radius av-pair dhcp parameter-request-list
   radius av-pair dhcp vendor-class-id
!
interface Ethernet1
   description AAA extended ACL on adapter, configured directly
   no shutdown
   switchport
   dot1x aaa unresponsive action traffic allow access list AAA-EXTENDED
!
interface Ethernet2
   description AAA standard ACL on adapter, configured directly
   no shutdown
   switchport
   dot1x aaa unresponsive action traffic allow access list AAA-STANDARD
!
interface Ethernet3
   description AAA extended ACL on adapter, inherited from profile
   no shutdown
   switchport
   dot1x aaa unresponsive action traffic allow access list AAA-EXTENDED
!
interface Ethernet4
   description AAA standard ACL on adapter, inherited from profile
   no shutdown
   switchport
   dot1x aaa unresponsive action traffic allow access list AAA-STANDARD
!
interface Ethernet5
   description AAA extended ACL on network port, configured directly
   no shutdown
   switchport
   dot1x aaa unresponsive action traffic allow access list AAA-EXTENDED
!
interface Ethernet6
   description AAA standard ACL on network port, configured directly
   no shutdown
   switchport
   dot1x aaa unresponsive action traffic allow access list AAA-STANDARD
!
interface Ethernet7
   description AAA extended ACL on network port, inherited from profile
   no shutdown
   switchport
   dot1x aaa unresponsive action traffic allow access list AAA-EXTENDED
!
interface Ethernet8
   description AAA standard ACL on network port, inherited from profile
   no shutdown
   switchport
   dot1x aaa unresponsive action traffic allow access list AAA-STANDARD
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
!
ip access-list AAA-EXTENDED
   10 permit ip 192.0.2.0/24 any
!
ip access-list standard AAA-STANDARD
   10 permit 192.0.2.0/24
no ip routing vrf MGMT
!
ip radius vrf MGMT source-interface Management1
!
dot1x system-auth-control
dot1x protocol lldp bypass
dot1x protocol bpdu bypass
dot1x dynamic-authorization
!
end
