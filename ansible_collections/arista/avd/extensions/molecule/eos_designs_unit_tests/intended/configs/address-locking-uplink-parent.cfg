!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname address-locking-uplink-parent
!
vrf instance MGMT
!
interface Port-Channel1
   description L2_ADDRESS_LOCKING_MLAG_PAIR_Port-Channel1
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_address-locking-13_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_address-locking-14_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet5
   description L2_address-locking-15_Ethernet1
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.60.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.61.1/32
!
interface Vxlan1
   description address-locking-uplink-parent_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.60.0/24 eq 32
   seq 20 permit 192.168.61.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65042
   router-id 192.168.60.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
