!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname l3-edge-ospf-auth
!
spanning-tree mode none
!
vrf instance MGMT
!
interface ethernet1
   description P2P_peer1_ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.1.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
   ip ospf message-digest-key 1 sha512 7 eiB1ByxaLcy1UPdkugTsIOW9ZB1+QG1r
   ip ospf message-digest-key 2 sha512 7 tiJ3eqT1+82aJYMaft7drlLb9eDFkbMr
!
interface ethernet2
   description P2P_peer2_ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.1.2/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface ethernet3
   description P2P_peer3_ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.1.4/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 1.2.4.1/32
   ip ospf area 0.0.0.0
!
ip routing
no ip routing vrf MGMT
!
router ospf 100
   router-id 1.2.4.1
   passive-interface default
   no passive-interface ethernet1
   no passive-interface ethernet2
   no passive-interface ethernet3
   max-lsa 12000
!
end
