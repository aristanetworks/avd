!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname l3-edge-ospf-auth
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_peer1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.1.0/31
   ip ospf network point-to-point
   ip ospf authentication message-digest
   ip ospf area 0.0.0.0
   ip ospf message-digest-key 1 sha512 7 qO39Oo+xVTO7l/La1StOQcW1t7hpfAAH
   ip ospf message-digest-key 2 sha512 7 pWGuZ4QaDATcfTOKCkm1p2Rq2A4O9j5j
!
interface Ethernet2
   description P2P_peer2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.1.2/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   description P2P_peer3_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.1.4/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 1.2.4.1/32
   ip ospf area 0.0.0.0
!
ip routing
no ip routing vrf MGMT
!
router ospf 100
   router-id 1.2.4.1
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   no passive-interface Ethernet3
   max-lsa 12000
!
end
