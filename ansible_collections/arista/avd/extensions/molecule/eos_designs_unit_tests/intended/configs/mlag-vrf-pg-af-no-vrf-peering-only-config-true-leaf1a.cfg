!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-vrf-pg-af-no-vrf-peering-only-config-true-leaf1a
!
no spanning-tree vlan-id 4093-4094
!
vlan 110
   name VLAN110_IPV4
!
vlan 111
   name VLAN111_IPV6
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF_DUAL_STACK
!
interface Port-Channel11
   description MLAG_mlag-vrf-pg-af-no-vrf-peering-only-config-true-leaf1b_Port-Channel11
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet11
   description MLAG_mlag-vrf-pg-af-no-vrf-peering-only-config-true-leaf1b_Ethernet11
   no shutdown
   channel-group 11 mode active
!
interface Ethernet12
   description MLAG_mlag-vrf-pg-af-no-vrf-peering-only-config-true-leaf1b_Ethernet12
   no shutdown
   channel-group 11 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.35/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.35/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.135/24
!
interface Vlan110
   description VLAN110_IPV4
   shutdown
   vrf VRF_DUAL_STACK
   ip address virtual 10.10.110.1/24
!
interface Vlan111
   description VLAN111_IPV6
   shutdown
   vrf VRF_DUAL_STACK
   ipv6 enable
   ipv6 address virtual 2001:db8:111::1/64
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.255.251.68/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.68/31
!
interface Vxlan1
   description mlag-vrf-pg-af-no-vrf-peering-only-config-true-leaf1a_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 110 vni 10110
   vxlan vlan 111 vni 10111
   vxlan vrf VRF_DUAL_STACK vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_DUAL_STACK
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
ipv6 unicast-routing vrf VRF_DUAL_STACK
!
mlag configuration
   domain-id MLAG_VRF_PG_AF_NO_VRF_PEERING_ONLY_CONFIG_TRUE
   local-interface Vlan4094
   peer-address 10.255.252.69
   peer-link Port-Channel11
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65128
   router-id 192.168.255.35
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65128
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description mlag-vrf-pg-af-no-vrf-peering-only-config-true-leaf1b
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.255.251.69 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.251.69 description mlag-vrf-pg-af-no-vrf-peering-only-config-true-leaf1b_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 110
      rd 192.168.255.35:10110
      route-target both 10110:10110
      redistribute learned
   !
   vlan 111
      rd 192.168.255.35:10111
      route-target both 10111:10111
      redistribute learned
   !
   address-family ipv4
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF_DUAL_STACK
      rd 192.168.255.35:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 192.168.255.35
      redistribute connected
!
end
