!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dns-settings-profile-parent-chain
ip domain lookup source-interface Loopback0
ip domain lookup vrf DNS source-interface Loopback1
ip name-server vrf DNS 192.0.2.55 priority 1
ip name-server vrf default 192.0.2.54 priority 1
dns domain child.example.com
ip domain-list regional.example.com
ip host child-host 192.0.2.10
!
vrf instance MGMT
no ip routing vrf MGMT
!
end
