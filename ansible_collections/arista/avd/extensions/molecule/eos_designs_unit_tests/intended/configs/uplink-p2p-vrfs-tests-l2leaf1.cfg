!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname uplink-p2p-vrfs-tests-l2leaf1
!
vlan 66
   name TEST-L2VLAN-ATTRACTION
!
vrf instance MGMT
!
interface Port-Channel1
   description L2_uplink-p2p-vrfs-tests-leaf1_Port-Channel51
   no shutdown
   switchport trunk allowed vlan 66
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_uplink-p2p-vrfs-tests-leaf1_Ethernet51
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_uplink-p2p-vrfs-tests-leaf1_Ethernet52
   no shutdown
   channel-group 1 mode active
!
interface Ethernet10
   no shutdown
   switchport
no ip routing vrf MGMT
!
end
