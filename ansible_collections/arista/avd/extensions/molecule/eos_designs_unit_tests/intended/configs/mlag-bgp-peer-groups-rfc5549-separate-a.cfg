!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-bgp-peer-groups-rfc5549-separate-a
!
no spanning-tree vlan-id 4093-4094
!
vlan 10
   name TEST
!
vlan 3009
   name MLAG_L3_VRF_TEST
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance TEST
!
interface Port-Channel5
   description MLAG_mlag-bgp-peer-groups-rfc5549-separate-b_Port-Channel5
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet5
   description MLAG_mlag-bgp-peer-groups-rfc5549-separate-b_Ethernet5
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description MLAG_mlag-bgp-peer-groups-rfc5549-separate-b_Ethernet6
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.100.0.23/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.101.0.23/32
!
interface Vlan10
   description TEST
   shutdown
   vrf TEST
   ip address virtual 10.10.10.1/24
!
interface Vlan3009
   description MLAG_L3_VRF_TEST
   no shutdown
   mtu 9214
   vrf TEST
   ipv6 enable
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ipv6 enable
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.102.0.44/31
!
interface Vxlan1
   description mlag-bgp-peer-groups-rfc5549-separate-a_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vrf TEST vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
ip routing ipv6 interfaces vrf TEST
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.100.0.0/24 eq 32
   seq 20 permit 10.101.0.0/24 eq 32
!
ipv6 unicast-routing
ipv6 unicast-routing vrf TEST
!
mlag configuration
   domain-id rfc5549-separate
   local-interface Vlan4094
   peer-address 10.102.0.45
   peer-link Port-Channel5
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 10.100.0.23
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-UNDERLAY-PEER peer group
   neighbor MLAG-UNDERLAY-PEER remote-as 65100
   neighbor MLAG-UNDERLAY-PEER next-hop-self
   neighbor MLAG-UNDERLAY-PEER bfd
   neighbor MLAG-UNDERLAY-PEER description Selected mlag_underlay_peer
   neighbor MLAG-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-UNDERLAY-PEER password 7 5b9rb1O0GDYBmJrcKa3pAA==
   neighbor MLAG-UNDERLAY-PEER send-community
   neighbor MLAG-UNDERLAY-PEER maximum-routes 12003
   neighbor MLAG-VRFS-PEER peer group
   neighbor MLAG-VRFS-PEER remote-as 65100
   neighbor MLAG-VRFS-PEER next-hop-self
   neighbor MLAG-VRFS-PEER bfd
   neighbor MLAG-VRFS-PEER description Selected mlag_vrfs_peer
   neighbor MLAG-VRFS-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-VRFS-PEER password 7 mK8cGXuuhchYj2LVAt2QYw==
   neighbor MLAG-VRFS-PEER send-community
   neighbor MLAG-VRFS-PEER maximum-routes 12005
   redistribute connected route-map RM-CONN-2-BGP
   neighbor interface Vlan4093 peer-group MLAG-UNDERLAY-PEER remote-as 65100
   !
   vlan 10
      rd 10.100.0.23:10010
      route-target both 10010:10010
      redistribute learned
   !
   address-family ipv4
      neighbor MLAG-UNDERLAY-PEER activate
      neighbor MLAG-UNDERLAY-PEER next-hop address-family ipv6 originate
      neighbor MLAG-VRFS-PEER activate
      neighbor MLAG-VRFS-PEER next-hop address-family ipv6 originate
   !
   vrf TEST
      rd 10.100.0.23:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.100.0.23
      redistribute connected route-map RM-CONN-2-BGP-VRFS
      neighbor interface Vlan3009 peer-group MLAG-VRFS-PEER remote-as 65100
!
end
