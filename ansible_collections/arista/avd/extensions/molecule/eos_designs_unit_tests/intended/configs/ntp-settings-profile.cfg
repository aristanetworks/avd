!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ntp-settings-profile
!
vrf instance MGMT
no ip routing vrf MGMT
!
ntp trusted-key 1
ntp authenticate
ntp server 192.0.2.123 prefer iburst
!
end
