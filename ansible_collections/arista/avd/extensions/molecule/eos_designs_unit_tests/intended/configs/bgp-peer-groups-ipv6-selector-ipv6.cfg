!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bgp-peer-groups-ipv6-selector-ipv6
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_bgp-peer-groups-3_Ethernet66
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:a11:6e::2/64
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8:dead:beef::6f/128
!
interface Vxlan1
   description bgp-peer-groups-ipv6-selector-ipv6_VTEP
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan encapsulation ipv6
!
ip routing
no ip routing vrf MGMT
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8:dead:beef::/64 eq 128
!
ipv6 unicast-routing
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 10.255.1.119
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor CUSTOM-IPv6-UNDERLAY-PEERS peer group
   neighbor CUSTOM-IPv6-UNDERLAY-PEERS bfd
   neighbor CUSTOM-IPv6-UNDERLAY-PEERS description Description for ipv6_underlay_peers via structured_config
   neighbor CUSTOM-IPv6-UNDERLAY-PEERS password 7 J/DMJM5X/s0HjpYHH7lCrg==
   neighbor CUSTOM-IPv6-UNDERLAY-PEERS send-community
   neighbor CUSTOM-IPv6-UNDERLAY-PEERS maximum-routes 12011
   neighbor 2001:db8:a11:6e::1 peer group CUSTOM-IPv6-UNDERLAY-PEERS
   neighbor 2001:db8:a11:6e::1 remote-as 65001
   neighbor 2001:db8:a11:6e::1 description bgp-peer-groups-3_Ethernet66
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv6
      neighbor CUSTOM-IPv6-UNDERLAY-PEERS activate
!
end
