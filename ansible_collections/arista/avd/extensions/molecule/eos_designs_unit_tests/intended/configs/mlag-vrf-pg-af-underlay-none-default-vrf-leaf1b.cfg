!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-vrf-pg-af-underlay-none-default-vrf-leaf1b
!
no spanning-tree vlan-id 4093-4094
!
vlan 100
   name VLAN100_DEFAULT_IPV4
!
vlan 101
   name VLAN101_DEFAULT_IPV6
!
vlan 110
   name VLAN110_IPV4
!
vlan 111
   name VLAN111_IPV6
!
vlan 3000
   name MLAG_L3_VRF_default
   trunk group MLAG
!
vlan 3009
   name MLAG_L3_VRF_VRF_DUAL_STACK
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF_DUAL_STACK
!
interface Port-Channel11
   description MLAG_mlag-vrf-pg-af-underlay-none-default-vrf-leaf1a_Port-Channel11
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet11
   description MLAG_mlag-vrf-pg-af-underlay-none-default-vrf-leaf1a_Ethernet11
   no shutdown
   channel-group 11 mode active
!
interface Ethernet12
   description MLAG_mlag-vrf-pg-af-underlay-none-default-vrf-leaf1a_Ethernet12
   no shutdown
   channel-group 11 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.18/32
   ipv6 address 2001:db8:1::12/128
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.17/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.118/24
!
interface Vlan100
   description VLAN100_DEFAULT_IPV4
   shutdown
   ip address virtual 10.10.100.1/24
!
interface Vlan101
   description VLAN101_DEFAULT_IPV6
   shutdown
   ipv6 enable
   ipv6 address virtual 2001:db8:101::1/64
!
interface Vlan110
   description VLAN110_IPV4
   shutdown
   vrf VRF_DUAL_STACK
   ip address virtual 10.10.110.1/24
!
interface Vlan111
   description VLAN111_IPV6
   shutdown
   vrf VRF_DUAL_STACK
   ipv6 enable
   ipv6 address virtual 2001:db8:111::1/64
!
interface Vlan3000
   description MLAG_L3_VRF_default
   no shutdown
   mtu 9214
   vrf default
   ipv6 enable
!
interface Vlan3009
   description MLAG_L3_VRF_VRF_DUAL_STACK
   no shutdown
   mtu 9214
   vrf VRF_DUAL_STACK
   ipv6 enable
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.33/31
!
interface Vxlan1
   description mlag-vrf-pg-af-underlay-none-default-vrf-leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 101 vni 10101
   vxlan vlan 110 vni 10110
   vxlan vlan 111 vni 10111
   vxlan vrf default vni 1
   vxlan vrf VRF_DUAL_STACK vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
ip routing ipv6 interfaces vrf VRF_DUAL_STACK
!
ip prefix-list PL-SVI-VRF-DEFAULT
   seq 10 permit 10.10.100.0/24
!
ipv6 unicast-routing
ipv6 unicast-routing vrf VRF_DUAL_STACK
!
mlag configuration
   domain-id MLAG_VRF_PG_AF_UNDERLAY_NONE_DEFAULT_VRF
   local-interface Vlan4094
   peer-address 10.255.252.32
   peer-link Port-Channel11
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 30
   match ip address prefix-list PL-SVI-VRF-DEFAULT
!
route-map RM-EVPN-EXPORT-VRF-DEFAULT permit 10
   match ip address prefix-list PL-SVI-VRF-DEFAULT
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65109
   router-id 192.168.255.18
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-VRFS-PEER peer group
   neighbor MLAG-IPv4-VRFS-PEER remote-as 65109
   neighbor MLAG-IPv4-VRFS-PEER next-hop-self
   neighbor MLAG-IPv4-VRFS-PEER description mlag-vrf-pg-af-underlay-none-default-vrf-leaf1a
   neighbor MLAG-IPv4-VRFS-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-VRFS-PEER send-community
   neighbor MLAG-IPv4-VRFS-PEER maximum-routes 256000
   redistribute connected
   neighbor interface Vlan3000 peer-group MLAG-IPv4-VRFS-PEER remote-as 65109
   !
   vlan 100
      rd 192.168.255.18:10100
      route-target both 10100:10100
      redistribute learned
   !
   vlan 101
      rd 192.168.255.18:10101
      route-target both 10101:10101
      redistribute learned
   !
   vlan 110
      rd 192.168.255.18:10110
      route-target both 10110:10110
      redistribute learned
   !
   vlan 111
      rd 192.168.255.18:10111
      route-target both 10111:10111
      redistribute learned
   !
   address-family ipv4
      neighbor MLAG-IPv4-VRFS-PEER activate
      neighbor MLAG-IPv4-VRFS-PEER next-hop address-family ipv6 originate
   !
   address-family ipv6
      neighbor MLAG-IPv4-VRFS-PEER activate
   !
   vrf default
      rd 192.168.255.18:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      route-target export evpn route-map RM-EVPN-EXPORT-VRF-DEFAULT
   !
   vrf VRF_DUAL_STACK
      rd 192.168.255.18:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 192.168.255.18
      redistribute connected
      neighbor interface Vlan3009 peer-group MLAG-IPv4-VRFS-PEER remote-as 65109
!
end
