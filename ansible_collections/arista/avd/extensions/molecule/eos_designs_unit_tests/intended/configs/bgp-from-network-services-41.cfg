!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bgp-from-network-services-41
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.0.255.41/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.1.1.41/24
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
!
ipv6 unicast-routing
!
router bgp 65001
   router-id 192.0.255.41
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor 10.10.41.42 peer group VALIDATE_BGP_PEERS
   redistribute connected
   !
   address-family ipv4
      neighbor 10.10.41.42 activate
!
end
