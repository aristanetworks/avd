!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname snmp-autogen-engineid-hostname-ip-dhcp
!
snmp-server engineID local 1601dd1090765085e16e4da7611542ba9819a92c
!
vrf instance MGMT
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address dhcp
no ip routing vrf MGMT
!
end
