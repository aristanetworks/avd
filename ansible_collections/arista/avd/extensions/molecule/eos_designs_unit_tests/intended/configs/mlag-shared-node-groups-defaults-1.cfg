!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-shared-node-groups-defaults-1
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 8192
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
interface Port-Channel50
   description MLAG_mlag-shared-node-groups-defaults-2_Port-Channel50
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet50
   description MLAG_mlag-shared-node-groups-defaults-2_Ethernet50
   no shutdown
   channel-group 50 mode active
!
interface Ethernet51
   description MLAG_mlag-shared-node-groups-defaults-2_Ethernet51
   no shutdown
   channel-group 50 mode active
!
interface Ethernet52
   description L2_mlag-shared-node-groups-defaults-4_Ethernet41
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.202.211/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.0/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id MLAG_SHARED_NODE_GROUPS_DEFAULTS_FALLBACK
   local-interface Vlan4094
   peer-address 10.255.252.1
   peer-link Port-Channel50
   reload-delay mlag 300
   reload-delay non-mlag 330
!
end
