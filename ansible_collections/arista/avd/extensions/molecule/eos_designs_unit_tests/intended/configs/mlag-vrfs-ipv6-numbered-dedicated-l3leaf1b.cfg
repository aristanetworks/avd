!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-vrfs-ipv6-numbered-dedicated-l3leaf1b
!
no spanning-tree vlan-id 4093-4094
!
vlan 11
   name VRF10_VLAN11
!
vlan 3009
   name MLAG_L3_VRF_VRF10
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF10
!
interface Port-Channel5
   description MLAG_mlag-vrfs-ipv6-numbered-dedicated-l3leaf1a_Port-Channel5
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet5
   description MLAG_mlag-vrfs-ipv6-numbered-dedicated-l3leaf1a_Ethernet5
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description MLAG_mlag-vrfs-ipv6-numbered-dedicated-l3leaf1a_Ethernet6
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8:70::2/128
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ipv6 address 2001:db8:71:1::1/128
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.125/24
!
interface Vlan11
   description VRF10_VLAN11
   shutdown
   vrf VRF10
   ipv6 enable
   ipv6 address virtual 2001:DB8:11::1/64
!
interface Vlan3009
   description MLAG_L3_VRF_VRF10
   no shutdown
   mtu 9214
   vrf VRF10
   ipv6 address 2001:db8:73::2/64
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ipv6 address 2001:db8:73::2/64
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.10.72.1/31
!
interface Vxlan1
   description mlag-vrfs-ipv6-numbered-dedicated-l3leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan encapsulation ipv6
   vxlan vlan 11 vni 10011
   vxlan vrf VRF10 vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF10
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8:70::/48 eq 128
   seq 20 permit 2001:db8:71::/48 eq 128
!
ipv6 prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 2001:db8:73::/64
!
ipv6 unicast-routing
ipv6 unicast-routing vrf VRF10
!
mlag configuration
   domain-id MLAG_VRFS_IPV6_NUMBERED_DEDICATED
   local-interface Vlan4094
   peer-address 10.10.72.0
   peer-link Port-Channel5
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ipv6 address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65170
   router-id 10.10.70.2
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65170
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description mlag-vrfs-ipv6-numbered-dedicated-l3leaf1a
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor MLAG-IPv6-VRFS-PEER peer group
   neighbor MLAG-IPv6-VRFS-PEER remote-as 65170
   neighbor MLAG-IPv6-VRFS-PEER next-hop-self
   neighbor MLAG-IPv6-VRFS-PEER description mlag-vrfs-ipv6-numbered-dedicated-l3leaf1a
   neighbor MLAG-IPv6-VRFS-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv6-VRFS-PEER send-community
   neighbor MLAG-IPv6-VRFS-PEER maximum-routes 256000
   neighbor 2001:db8:73::1 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 2001:db8:73::1 description mlag-vrfs-ipv6-numbered-dedicated-l3leaf1a_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 11
      rd 10.10.70.2:10011
      route-target both 10011:10011
      redistribute learned
   !
   address-family ipv6
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
      neighbor MLAG-IPv6-VRFS-PEER activate
   !
   vrf VRF10
      rd 10.10.70.2:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.10.70.2
      update wait-install
      neighbor 2001:db8:73::1 peer group MLAG-IPv6-VRFS-PEER
      neighbor 2001:db8:73::1 description mlag-vrfs-ipv6-numbered-dedicated-l3leaf1a_Vlan3009
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
