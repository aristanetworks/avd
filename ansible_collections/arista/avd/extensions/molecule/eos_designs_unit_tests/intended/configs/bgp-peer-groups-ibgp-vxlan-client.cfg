!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bgp-peer-groups-ibgp-vxlan-client
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_bgp-peer-groups-3_Ethernet7
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.252.213/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.115/32
!
interface Vxlan1
   description bgp-peer-groups-ibgp-vxlan-client_VTEP
   vxlan source-interface Loopback0
   vxlan udp-port 4789
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.168.255.115
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-CORE peer group
   neighbor EVPN-OVERLAY-CORE update-source Loopback0
   neighbor EVPN-OVERLAY-CORE description Description for evpn_overlay_core via structured_config
   neighbor EVPN-OVERLAY-CORE ebgp-multihop 15
   neighbor EVPN-OVERLAY-CORE password 7 7PAWRjxv8U6PaK1vvQ5mK/7YOTeJ7b4J
   neighbor EVPN-OVERLAY-CORE send-community
   neighbor EVPN-OVERLAY-CORE maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS bfd
   neighbor IPv4-UNDERLAY-PEERS description Description for ipv4_underlay_peers via structured_config
   neighbor IPv4-UNDERLAY-PEERS password 7 7x4B4rnJhZB438m9+BrBfQ==
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12001
   neighbor 192.168.252.212 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.252.212 remote-as 65001
   neighbor 192.168.252.212 description bgp-peer-groups-3_Ethernet7
   neighbor 192.168.255.116 peer group EVPN-OVERLAY-CORE
   neighbor 192.168.255.116 remote-as 65001
   neighbor 192.168.255.116 description bgp-peer-groups-ibgp-vxlan-server_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-CORE activate
      neighbor EVPN-OVERLAY-CORE domain remote
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
