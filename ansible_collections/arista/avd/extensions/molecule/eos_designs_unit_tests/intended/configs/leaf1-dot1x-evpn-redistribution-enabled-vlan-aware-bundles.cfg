!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf1-dot1x-evpn-redistribution-enabled-vlan-aware-bundles
!
vlan 100
   name VRFDEV_VLAN100
!
vlan 200
   name VRFDEV_VLAN200
!
vrf instance DEV
!
vrf instance MGMT
!
radius-server host agni.arista.com vrf MGMT key 7 1404071B09166738212B2130365E0C131A
!
aaa authentication dot1x default group radius
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.1.0.13/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.1.1.13/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.20.20.113/24
!
interface Vlan100
   description VRFDEV_VLAN100
   no shutdown
   vrf DEV
   ip address virtual 192.168.100.1/24
!
interface Vlan200
   description VRFDEV_VLAN200
   no shutdown
   vrf DEV
   ip address virtual 192.168.200.1/24
!
interface Vxlan1
   description leaf1-dot1x-evpn-redistribution-enabled-vlan-aware-bundles_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 200 vni 10200
   vxlan vrf DEV vni 500
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf DEV
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.1.0.0/24 eq 32
   seq 20 permit 10.1.1.0/24 eq 32
!
ip radius vrf MGMT source-interface Management1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 10.1.0.13
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan-aware-bundle DEV
      rd 10.1.0.13:500
      route-target both 500:500
      redistribute dot1x
      redistribute learned
      vlan 100,200
   !
   vrf DEV
      rd 10.1.0.13:500
      route-target import evpn 500:500
      route-target export evpn 500:500
      router-id 10.1.0.13
      redistribute connected
!
dot1x system-auth-control
dot1x protocol lldp bypass
dot1x protocol bpdu bypass
dot1x dynamic-authorization
!
end
