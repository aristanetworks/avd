!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname standard-acls
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.0.1/32
!
ip access-list standard TEST-STANDARD-ACL-PLAIN
   10 permit 10.0.0.0/8
   20 deny any
!
ip access-list standard TEST-STANDARD-ACL-WITH-COUNTERS
   counters per-entry
   10 permit host 192.168.1.1
   20 deny any log
!
ip access-list standard TEST-STANDARD-ACL-WITH-REMARK-AND-VLAN
   10 remark Allow management subnet
   20 permit vlan 100 0xFFF 172.16.0.0/12
   30 permit vlan inner 200 0xFFF 172.20.0.0/16 mirror session SESSION1
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.0.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 192.168.0.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
