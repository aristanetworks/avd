!
no enable password
no aaa root
!
flow tracking hardware
   tracker FLOW-TRACKER
      record export on inactive timeout 70000
      record export on interval 300000
      exporter CV-TELEMETRY
         collector 127.0.0.1
         local interface Loopback0
         template interval 3600000
   no shutdown
!
service routing protocols model multi-agent
!
kernel software forwarding ecmp
!
hostname legacy-autovpn-empty-load-balance-policy
!
router path-selection
   tcp mss ceiling ipv4 ingress
   !
   path-group NET id 102
      ipsec profile AUTOVPN
      !
      local interface Ethernet1
      !
      peer dynamic
   !
   load-balance policy LB-DEFAULT-AUTOVPN-POLICY-CONTROL-PLANE
      path-group NET
   !
   policy DEFAULT-AUTOVPN-POLICY-WITH-CP
      10 application-profile APP-PROFILE-CONTROL-PLANE
         load-balance LB-DEFAULT-AUTOVPN-POLICY-CONTROL-PLANE
   !
   vrf default
      path-selection-policy DEFAULT-AUTOVPN-POLICY-WITH-CP
!
platform sfe data-plane cpu allocation maximum 2
!
spanning-tree mode none
!
vrf instance MGMT
!
ip security
   ike policy AUTOVPN-IKE
      local-id 192.168.131.3
   !
   sa policy AUTOVPN-SA
   !
   profile AUTOVPN
      ike-policy AUTOVPN-IKE
      sa-policy AUTOVPN-SA
      connection start
      shared-key 7 ABCDEF1234567890
      dpd 10 50 clear
      mode transport
   !
   key controller
      profile AUTOVPN
!
interface Dps1
   description DPS Interface
   mtu 9194
   flow tracker hardware FLOW-TRACKER
   ip address 192.168.131.3/32
!
interface Ethernet1
   description NOC
   no shutdown
   no switchport
   ip address dhcp
   dhcp client accept default-route
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.31.3/32
!
interface Vxlan1
   description legacy-autovpn-empty-load-balance-policy_VTEP
   vxlan source-interface Dps1
   vxlan udp-port 4789
   vxlan vrf default vni 1
!
application traffic recognition
   !
   application ipv4 APP-CONTROL-PLANE
      destination prefix field-set PFX-PATHFINDERS
   !
   application-profile APP-PROFILE-CONTROL-PLANE
      application APP-CONTROL-PLANE
   !
   field-set ipv4 prefix PFX-PATHFINDERS
!
ip routing
no ip routing vrf MGMT
!
ip extcommunity-list ECL-EVPN-SOO permit soo 192.168.31.3:0
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.31.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   set extcommunity soo 192.168.31.3:0 additive
!
route-map RM-EVPN-EXPORT-VRF-DEFAULT permit 10
   match extcommunity ECL-EVPN-SOO
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 192.168.31.3
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 16
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family path-selection
      bgp additional-paths receive
      bgp additional-paths send any
   !
   vrf default
      rd 192.168.31.3:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      route-target export evpn route-map RM-EVPN-EXPORT-VRF-DEFAULT
!
end
