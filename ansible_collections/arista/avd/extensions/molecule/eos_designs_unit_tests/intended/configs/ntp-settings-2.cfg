!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ntp-settings-2
!
vlan 4092
   name INBAND_MGMT
!
vrf instance INBAND_MGMT
!
vrf instance MGMT
!
interface Vlan4092
   description Inband Management
   no shutdown
   mtu 1500
   vrf INBAND_MGMT
   ip address 192.168.1.2/24
no ip routing vrf MGMT
!
ntp local-interface vrf INBAND_MGMT Vlan4092
ntp server vrf INBAND_MGMT 10.10.10.1 prefer source-address 192.168.1.2
ntp server vrf INBAND_MGMT 10.10.10.2 source-address 198.51.100.10
!
end
