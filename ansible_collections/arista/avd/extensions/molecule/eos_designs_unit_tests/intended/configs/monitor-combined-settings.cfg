!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
monitor layer1
   logging transceiver
!
logging vrf MGMT host syslog.example.com
logging vrf MGMT source-interface Management1
!
hostname monitor-combined-settings
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.160/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.160/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 1.1.10.52
!
interface Vxlan1
   description monitor-combined-settings_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
!
monitor connectivity
   interval 10
   interface set SET_LOOPBACK0 Loopback0
   interface set SET_LOOPBACK1 Loopback1
   interface set SET_LOOPBACK2 Loopback2
   !
   host INTERNET_CHECK
      local-interfaces SET_LOOPBACK0 address-only
      ip 8.8.4.4
   !
   host INTERNET_CHECK_1
      ip 8.8.4.5
   !
   host INTERNET_CHECK_2
      local-interfaces SET_LOOPBACK1
      ip 8.8.4.6
   !
   host INTERNET_CHECK_3
      local-interfaces SET_LOOPBACK2
      ip 8.8.4.7
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 152
   router-id 192.168.255.160
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
