!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname MLAG-MULTI-TENANT-VRF-L3LEAF1B
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
vlan 110
   name SHARED_VRF_SVI
!
vlan 220
   name TENANT_C_SVI
!
vlan 3099
   name MLAG_L3_VRF_SHARED_VRF
   trunk group MLAG
!
vlan 3199
   name MLAG_L3_VRF_TENANT_C_VRF
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance SHARED_VRF
!
vrf instance TENANT_C_VRF
!
interface Port-Channel3
   description MLAG_MLAG-MULTI-TENANT-VRF-L3LEAF1A_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description P2P_MLAG-MULTI-TENANT-VRF-SPINE1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 172.31.255.3/31
!
interface Ethernet3
   description MLAG_MLAG-MULTI-TENANT-VRF-L3LEAF1A_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_MLAG-MULTI-TENANT-VRF-L3LEAF1A_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.102/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.101/32
!
interface Loopback100
   description SHARED_VRF_LOOPBACK
   no shutdown
   vrf SHARED_VRF
   ip address 172.16.100.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.202/24
!
interface Vlan110
   description SHARED_VRF_SVI
   no shutdown
   vrf SHARED_VRF
   ip address virtual 10.110.110.1/24
!
interface Vlan220
   description TENANT_C_SVI
   no shutdown
   vrf TENANT_C_VRF
   ip address virtual 10.220.220.1/24
!
interface Vlan3099
   description MLAG_L3_VRF_SHARED_VRF
   no shutdown
   mtu 9214
   vrf SHARED_VRF
   ip address 10.255.251.1/31
!
interface Vlan3199
   description MLAG_L3_VRF_TENANT_C_VRF
   no shutdown
   mtu 9214
   vrf TENANT_C_VRF
   ip address 10.255.251.1/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.255.251.1/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.1/31
!
interface Vxlan1
   description MLAG-MULTI-TENANT-VRF-L3LEAF1B_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 110 vni 10110
   vxlan vlan 220 vni 30220
   vxlan vrf SHARED_VRF vni 11100
   vxlan vrf TENANT_C_VRF vni 12200
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip address virtual source-nat vrf SHARED_VRF address 172.16.100.2
!
ip routing
no ip routing vrf MGMT
ip routing vrf SHARED_VRF
ip routing vrf TENANT_C_VRF
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.251.0/31
!
mlag configuration
   domain-id MLAG_MULTI_TENANT_VRF_L3LEAF1
   local-interface Vlan4094
   peer-address 10.255.252.0
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 192.168.255.102
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description MLAG-MULTI-TENANT-VRF-L3LEAF1A
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.255.251.0 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.251.0 description MLAG-MULTI-TENANT-VRF-L3LEAF1A_Vlan4093
   neighbor 172.31.255.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.31.255.2 remote-as 65100
   neighbor 172.31.255.2 description MLAG-MULTI-TENANT-VRF-SPINE1_Ethernet2
   neighbor 192.168.255.1 peer group EVPN-OVERLAY-PEERS
   neighbor 192.168.255.1 remote-as 65100
   neighbor 192.168.255.1 description MLAG-MULTI-TENANT-VRF-SPINE1_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 110
      rd 192.168.255.102:10110
      route-target both 10110:10110
      redistribute learned
   !
   vlan 220
      rd 192.168.255.102:30220
      route-target both 30220:30220
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf SHARED_VRF
      rd 192.168.255.102:100
      route-target import evpn 100:100
      route-target export evpn 100:100
      router-id 192.168.255.102
      update wait-install
      neighbor 10.255.251.0 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.251.0 description MLAG-MULTI-TENANT-VRF-L3LEAF1A_Vlan3099
      redistribute connected route-map RM-CONN-2-BGP-VRFS
   !
   vrf TENANT_C_VRF
      rd 192.168.255.102:200
      route-target import evpn 200:200
      route-target export evpn 200:200
      router-id 192.168.255.102
      update wait-install
      neighbor 10.255.251.0 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.251.0 description MLAG-MULTI-TENANT-VRF-L3LEAF1A_Vlan3199
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
