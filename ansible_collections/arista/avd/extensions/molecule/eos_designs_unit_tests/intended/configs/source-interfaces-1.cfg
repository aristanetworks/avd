!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname source-interfaces-1
!
vlan 4092
   name INBAND_MGMT
!
vrf instance MGMT
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
!
interface Vlan4092
   description Inband Management
   no shutdown
   mtu 1500
   ip address 10.20.30.40/24
no ip routing vrf MGMT
!
ip route 0.0.0.0/0 10.20.30.1
!
ip http client local-interface Vlan4092
ip http client local-interface Management1 vrf MGMT
ip ssh client source-interface Vlan4092
ip ssh client source-interface Management1 vrf MGMT
!
end
