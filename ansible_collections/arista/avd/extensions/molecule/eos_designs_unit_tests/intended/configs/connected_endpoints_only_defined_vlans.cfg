!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname connected_endpoints_only_defined_vlans
!
vlan 101
   name vlan101
!
vlan 102
   name vlan102
!
vlan 111
   name vlan111
!
vlan 112
   name vlan112
!
vrf instance MGMT
!
interface Ethernet1
   description SERVER_server_1_eth0
   no shutdown
   switchport trunk allowed vlan 101-102,111-112
   switchport mode trunk
   switchport
!
interface Ethernet2
   description SERVER_server_2_eth0
   no shutdown
   switchport trunk allowed vlan 101-102,111-112
   switchport mode trunk
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.1.2
no ip routing vrf MGMT
!
end
