!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname connected-endpoints-vlan-tags
!
vlan 110
   name SVI_ESX
!
vlan 120
   name SVI_ESX2
!
vlan 600
   name L2VLAN_ESX_A
!
vlan 601
   name L2VLAN_ESX_B
!
vlan 602
   name L2VLAN_ESX2
!
vlan 700
   name L2VLAN_BACKUP
!
vlan 4092
   name L2VLAN_NATIVE
!
vrf instance MGMT
!
interface Port-Channel4
   description vlans=10-11 + vlan_tags=[ESX2] -> 10-11,120,602
   no shutdown
   switchport trunk native vlan 4092
   switchport trunk allowed vlan 10-11,120,602
   switchport mode trunk
   switchport
!
interface Ethernet1
   description vlan_tags=[ESX] from profile -> 110,600-601
   no shutdown
   switchport trunk allowed vlan 110,600-601
   switchport mode trunk
   switchport
!
interface Ethernet2
   description vlans=10 from profile + vlan_tags=[ESX] from parent profile -> 10,110,600-601
   no shutdown
   switchport trunk allowed vlan 10,110,600-601
   switchport mode trunk
   switchport
!
interface Ethernet3
   description vlan_tags=[ESX2,BACKUP] overriding profile -> 120,602,700
   no shutdown
   switchport trunk allowed vlan 120,602,700
   switchport mode trunk
   switchport
!
interface Ethernet4
   description SERVER_esx_port_channel
   no shutdown
   channel-group 4 mode active
!
interface Ethernet5
   description SERVER_esx_port_channel
   no shutdown
   channel-group 4 mode active
!
interface Ethernet6
   description vlan_tags matching no VLAN -> none
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Ethernet7
   description vlan_tags=[NOT_ON_SWITCH] -> 601 (130 and 610 are not configured on this switch)
   no shutdown
   switchport trunk allowed vlan 601
   switchport mode trunk
   switchport
!
interface Ethernet10
   description network_ports vlan_tags=[ESX,ESX2] -> 110,120,600-602
   no shutdown
   switchport trunk allowed vlan 110,120,600-602
   switchport mode trunk
   switchport
!
interface Ethernet11
   description network_ports vlan_tags=[ESX,ESX2] -> 110,120,600-602
   no shutdown
   switchport trunk allowed vlan 110,120,600-602
   switchport mode trunk
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
no ip routing vrf MGMT
!
end
