!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname IPV6_NUMBERED_VTEP_LOOPBACK0_SPINE
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_IPV6_NUMBERED_VTEP_LOOPBACK0_LEAF1a_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:2::1/64
!
interface Ethernet2
   description P2P_IPV6_NUMBERED_VTEP_LOOPBACK0_LEAF1b_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:2:1::1/64
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8::1/128
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.1.35/24
!
ip routing
no ip routing vrf MGMT
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8::/48 eq 128
!
ipv6 unicast-routing
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 2001:db8:1::1 peer group EVPN-OVERLAY-PEERS
   neighbor 2001:db8:1::1 remote-as 65101
   neighbor 2001:db8:1::1 description IPV6_NUMBERED_VTEP_LOOPBACK0_LEAF1a_Loopback0
   neighbor 2001:db8:1::2 peer group EVPN-OVERLAY-PEERS
   neighbor 2001:db8:1::2 remote-as 65101
   neighbor 2001:db8:1::2 description IPV6_NUMBERED_VTEP_LOOPBACK0_LEAF1b_Loopback0
   neighbor 2001:db8:2:1::2 peer group IPv4-UNDERLAY-PEERS
   neighbor 2001:db8:2:1::2 remote-as 65101
   neighbor 2001:db8:2:1::2 description IPV6_NUMBERED_VTEP_LOOPBACK0_LEAF1b_Ethernet1
   neighbor 2001:db8:2::2 peer group IPv4-UNDERLAY-PEERS
   neighbor 2001:db8:2::2 remote-as 65101
   neighbor 2001:db8:2::2 description IPV6_NUMBERED_VTEP_LOOPBACK0_LEAF1a_Ethernet1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv6
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
