!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname underlay-ibgp-node-type-keys-leaf1
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_underlay-ibgp-node-type-keys-spine1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Ethernet2
   description P2P_underlay-ibgp-node-type-keys-spine2_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Ethernet10
   description P2P_underlay-ibgp-node-type-keys-tor1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.254.50.4/32
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
!
ipv6 unicast-routing
!
router bgp 65000
   router-id 10.254.50.4
   update wait-install
   no bgp default ipv4-unicast
   bgp cluster-id 10.255.2.3
   maximum-paths 4
   neighbor RR-CLIENTS-UNDERLAY-PEERS peer group
   neighbor RR-CLIENTS-UNDERLAY-PEERS next-hop-self
   neighbor RR-CLIENTS-UNDERLAY-PEERS route-reflector-client
   neighbor RR-CLIENTS-UNDERLAY-PEERS send-community
   neighbor RR-CLIENTS-UNDERLAY-PEERS maximum-routes 256000
   neighbor RR-UNDERLAY-PEERS peer group
   neighbor RR-UNDERLAY-PEERS next-hop-self
   neighbor RR-UNDERLAY-PEERS send-community
   neighbor RR-UNDERLAY-PEERS maximum-routes 256000
   redistribute connected
   neighbor interface Ethernet1 peer-group RR-UNDERLAY-PEERS remote-as 65000
   neighbor interface Ethernet2 peer-group RR-UNDERLAY-PEERS remote-as 65000
   neighbor interface Ethernet10 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000
   !
   address-family ipv4
      neighbor RR-CLIENTS-UNDERLAY-PEERS activate
      neighbor RR-CLIENTS-UNDERLAY-PEERS next-hop address-family ipv6 originate
      neighbor RR-UNDERLAY-PEERS activate
      neighbor RR-UNDERLAY-PEERS next-hop address-family ipv6 originate
!
end
