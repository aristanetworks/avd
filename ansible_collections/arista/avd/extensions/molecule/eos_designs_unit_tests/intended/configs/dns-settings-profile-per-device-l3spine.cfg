!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dns-settings-profile-per-device-l3spine
ip name-server vrf default 192.0.2.53 priority 1
dns domain l3spine.example.com
ip domain-list l3spine.example.com
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.0.4.2/32
!
ip routing
no ip routing vrf MGMT
!
end
