!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bgp-peer-groups-4
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.250.1/32
   node-segment ipv4 index 1
   isis enable CORE
   isis passive
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
mpls ip
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.168.250.1
   update wait-install
   no bgp default ipv4-unicast
   bgp cluster-id 192.168.250.1
   maximum-paths 4
   neighbor RR-OVERLAY-PEERS peer group
   neighbor RR-OVERLAY-PEERS remote-as 65001
   neighbor RR-OVERLAY-PEERS update-source Loopback0
   neighbor RR-OVERLAY-PEERS description Description for rr_overlay_peers via structured_config
   neighbor RR-OVERLAY-PEERS send-community
   neighbor RR-OVERLAY-PEERS maximum-routes 0
   neighbor 192.168.255.112 peer group RR-OVERLAY-PEERS
   neighbor 192.168.255.112 description bgp-peer-groups-2_Loopback0
   !
   address-family vpn-ipv4
      neighbor RR-OVERLAY-PEERS activate
!
router isis CORE
   net 49.0001.1921.6825.0001.00
   router-id ipv4 192.168.250.1
   is-type level-2
   log-adjacency-changes
   !
   address-family ipv4 unicast
      maximum-paths 4
   !
   segment-routing mpls
      no shutdown
!
end
