!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ip-helpers-l2leaf
!
vlan 11
   name SVI2
!
vlan 100
   name INBAND_MGMT
!
vrf instance INBANDMGMT
!
vrf instance MGMT
!
interface Port-Channel1
   description L2_network-services-ip-helpers-leaf3_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 11,100
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_network-services-ip-helpers-leaf3_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_network-services-ip-helpers-leaf3_Ethernet2
   no shutdown
   channel-group 1 mode active
!
interface Vlan100
   description Inband Management
   no shutdown
   mtu 1500
   vrf INBANDMGMT
   ip address 192.168.101.6/24
no ip routing vrf MGMT
!
ip route vrf INBANDMGMT 0.0.0.0/0 192.168.101.1
!
end
