!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-peer-vlan-l3-ipv6-rfc5549-l3leaf1b
!
no spanning-tree vlan-id 4094
!
vlan 11
   name VRF10_VLAN11
!
vlan 3009
   name MLAG_L3_VRF_VRF10
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF10
!
interface Port-Channel5
   description MLAG_mlag-peer-vlan-l3-ipv6-rfc5549-l3leaf1a_Port-Channel5
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet5
   description MLAG_mlag-peer-vlan-l3-ipv6-rfc5549-l3leaf1a_Ethernet5
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description MLAG_mlag-peer-vlan-l3-ipv6-rfc5549-l3leaf1a_Ethernet6
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.60.2/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.10.61.1/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.123/24
!
interface Vlan11
   description VRF10_VLAN11
   shutdown
   vrf VRF10
   ip address virtual 10.10.11.1/24
!
interface Vlan3009
   description MLAG_L3_VRF_VRF10
   no shutdown
   mtu 9214
   vrf VRF10
   ipv6 enable
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ipv6 enable
   ipv6 address 2001:db8:62::2/64
!
interface Vxlan1
   description mlag-peer-vlan-l3-ipv6-rfc5549-l3leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 11 vni 10011
   vxlan vrf VRF10 vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
ip routing ipv6 interfaces vrf VRF10
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.60.0/24 eq 32
   seq 20 permit 10.10.61.0/24 eq 32
!
ipv6 unicast-routing
ipv6 unicast-routing vrf VRF10
!
mlag configuration
   domain-id MLAG_PEER_VLAN_L3_IPV6_RFC5549
   local-interface Vlan4094
   peer-address 2001:db8:62::1
   peer-link Port-Channel5
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65160
   router-id 10.10.60.2
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65160
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description mlag-peer-vlan-l3-ipv6-rfc5549-l3leaf1a
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   redistribute connected route-map RM-CONN-2-BGP
   neighbor interface Vlan4094 peer-group MLAG-IPv4-UNDERLAY-PEER remote-as 65160
   !
   vlan 11
      rd 10.10.60.2:10011
      route-target both 10011:10011
      redistribute learned
   !
   address-family ipv4
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
      neighbor MLAG-IPv4-UNDERLAY-PEER next-hop address-family ipv6 originate
   !
   vrf VRF10
      rd 10.10.60.2:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.10.60.2
      redistribute connected route-map RM-CONN-2-BGP-VRFS
      neighbor interface Vlan3009 peer-group MLAG-IPv4-UNDERLAY-PEER remote-as 65160
!
end
