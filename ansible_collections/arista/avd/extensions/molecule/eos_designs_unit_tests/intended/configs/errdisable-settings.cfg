!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
errdisable detect cause acl
errdisable detect cause arp-inspection
errdisable detect cause dot1x
errdisable detect cause link-change
errdisable detect cause storm-control
errdisable recovery cause acl
errdisable recovery cause arp-inspection
errdisable recovery cause bpduguard
errdisable recovery cause dot1x
no errdisable recovery cause lacp-rate-limit
errdisable recovery cause link-flap
errdisable recovery cause storm-control
errdisable recovery cause acl interval 60
errdisable recovery cause arp-inspection interval 90
errdisable recovery cause bpduguard interval 300
errdisable recovery cause dot1x interval 60
errdisable recovery cause link-flap interval 60
errdisable recovery cause storm-control interval 120
errdisable recovery interval 200
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname errdisable-settings
!
vrf instance MGMT
no ip routing vrf MGMT
!
end
