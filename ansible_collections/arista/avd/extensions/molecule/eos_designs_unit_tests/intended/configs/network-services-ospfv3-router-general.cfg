!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ospfv3-router-general
!
vlan 110
   name VRF_MAIN_ROUTER_ID_TRANSIT
!
vlan 111
   name VRF_EXPLICIT_ROUTER_ID_TRANSIT
!
vrf instance MGMT
!
vrf instance VRF_EXPLICIT_ROUTER_ID
!
vrf instance VRF_MAIN_ROUTER_ID
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.1/32
!
interface Vlan110
   description VRF_MAIN_ROUTER_ID_TRANSIT
   no shutdown
   vrf VRF_MAIN_ROUTER_ID
   ipv6 address 2001:db8:110::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan111
   description VRF_EXPLICIT_ROUTER_ID_TRANSIT
   no shutdown
   vrf VRF_EXPLICIT_ROUTER_ID
   ipv6 address 2001:db8:111::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vxlan1
   description network-services-ospfv3-router-general_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf VRF_EXPLICIT_ROUTER_ID vni 11
   vxlan vrf VRF_MAIN_ROUTER_ID vni 10
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_EXPLICIT_ROUTER_ID
ip routing vrf VRF_MAIN_ROUTER_ID
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
ipv6 unicast-routing vrf VRF_EXPLICIT_ROUTER_ID
ipv6 unicast-routing vrf VRF_MAIN_ROUTER_ID
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vrf VRF_EXPLICIT_ROUTER_ID
      rd 192.168.255.1:11
      route-target import evpn 11:11
      route-target export evpn 11:11
      redistribute connected
      redistribute ospfv3
   !
   vrf VRF_MAIN_ROUTER_ID
      rd 192.168.255.1:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      redistribute connected
      redistribute ospfv3
!
router general
   router-id ipv4 192.168.255.1
   exit
!
router ospfv3 vrf VRF_EXPLICIT_ROUTER_ID
   router-id 10.255.11.1
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
router ospfv3 vrf VRF_MAIN_ROUTER_ID
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
end
