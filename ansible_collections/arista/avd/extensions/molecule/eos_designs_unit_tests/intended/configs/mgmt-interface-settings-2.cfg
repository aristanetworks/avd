!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mgmt-interface-settings-2
!
vrf instance vrf_from_mgmt_interface_settings
!
interface Management0
   description description from mgmt_interface_settings
   no shutdown
   vrf vrf_from_mgmt_interface_settings
   ip address 192.168.0.3/24
   ipv6 enable
   ipv6 address 2001:db8::3/64
ip routing vrf vrf_from_mgmt_interface_settings
!
ipv6 unicast-routing vrf vrf_from_mgmt_interface_settings
!
ipv6 route vrf vrf_from_mgmt_interface_settings ::/0 2001:db8::1
!
end
