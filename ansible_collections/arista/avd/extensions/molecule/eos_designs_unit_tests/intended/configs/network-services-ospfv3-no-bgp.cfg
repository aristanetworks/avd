!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ospfv3-no-bgp
!
vlan 110
   name TRANSIT
!
vlan 111
   name LAN
!
vrf instance MGMT
!
vrf instance VRF_A
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
   ip ospf area 0.0.0.0
!
interface Vlan110
   description TRANSIT
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:110::1/64
   no ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan111
   description LAN
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:111::1/64
   ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_A
ipv6 unicast-routing vrf VRF_A
!
router ospf 100
   router-id 192.168.255.1
   passive-interface default
   redistribute connected
   max-lsa 12000
   graceful-restart
!
router ospfv3 vrf VRF_A
   router-id 192.168.255.1
   passive-interface default
   !
   address-family ipv6
      redistribute connected
!
end
