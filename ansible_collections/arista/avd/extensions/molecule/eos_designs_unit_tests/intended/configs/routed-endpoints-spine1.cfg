!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname routed-endpoints-spine1
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_routed-endpoints-leaf1a_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.200.0.0/31
!
interface Ethernet2
   description P2P_routed-endpoints-leaf1b_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.200.0.2/31
!
interface Ethernet3
   description P2P_routed-endpoints-leaf2_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.200.0.4/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.200.1/32
!
ip routing
no ip routing vrf MGMT
!
router bgp 65100
   router-id 192.168.200.1
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.200.0.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.200.0.1 remote-as 65101
   neighbor 10.200.0.1 description routed-endpoints-leaf1a_Ethernet1
   neighbor 10.200.0.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.200.0.3 remote-as 65101
   neighbor 10.200.0.3 description routed-endpoints-leaf1b_Ethernet1
   neighbor 10.200.0.5 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.200.0.5 remote-as 65102
   neighbor 10.200.0.5 description routed-endpoints-leaf2_Ethernet1
   redistribute connected
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
