!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bgp-peer-groups-ibgp-vxlan-server
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_bgp-peer-groups-3_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.252.215/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.116/32
!
interface Vxlan1
   description bgp-peer-groups-ibgp-vxlan-server_VTEP
   vxlan source-interface Loopback0
   vxlan udp-port 4789
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.168.255.116
   update wait-install
   no bgp default ipv4-unicast
   bgp cluster-id 192.168.255.116
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS remote-as 65001
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS description Description for evpn_overlay_peers via structured_config
   neighbor EVPN-OVERLAY-PEERS route-reflector-client
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS bfd
   neighbor IPv4-UNDERLAY-PEERS description Description for ipv4_underlay_peers via structured_config
   neighbor IPv4-UNDERLAY-PEERS password 7 7x4B4rnJhZB438m9+BrBfQ==
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12001
   neighbor 192.168.252.214 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.252.214 remote-as 65001
   neighbor 192.168.252.214 description bgp-peer-groups-3_Ethernet8
   neighbor 192.168.255.115 peer group EVPN-OVERLAY-PEERS
   neighbor 192.168.255.115 description bgp-peer-groups-ibgp-vxlan-client_Loopback0
   neighbor 192.168.255.115 password 7 wBetBpc3nPkl2OfohjmGLOJZEaCkiIgn
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
