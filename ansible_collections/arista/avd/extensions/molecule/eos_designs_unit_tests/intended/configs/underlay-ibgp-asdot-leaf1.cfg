!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname underlay-ibgp-asdot-leaf1
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_underlay-ibgp-asdot-spine1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.254.41.1/32
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
!
ipv6 unicast-routing
!
router bgp 65000.10
   bgp asn notation asdot
   router-id 10.254.41.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor RR-UNDERLAY-PEERS peer group
   neighbor RR-UNDERLAY-PEERS next-hop-self
   neighbor RR-UNDERLAY-PEERS send-community
   neighbor RR-UNDERLAY-PEERS maximum-routes 256000
   redistribute connected
   neighbor interface Ethernet1 peer-group RR-UNDERLAY-PEERS remote-as 65000.10
   !
   address-family ipv4
      neighbor RR-UNDERLAY-PEERS activate
      neighbor RR-UNDERLAY-PEERS next-hop address-family ipv6 originate
!
end
