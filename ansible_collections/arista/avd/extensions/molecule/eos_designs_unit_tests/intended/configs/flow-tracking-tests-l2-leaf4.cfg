!
no enable password
no aaa root
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=default -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -ipfixaddr=default/127.0.0.1:4739 -cvsourceintf=Vlan4092
   no shutdown
!
vlan internal order ascending range 1006 1199
!
flow tracking hardware
   tracker FLOW-TRACKER-11
      record export on inactive timeout 50020
      record export on interval 300321
      exporter CLOUDVISION
         collector 127.0.0.1
         local interface Vlan4092
      !
      exporter ayush_exporter
         collector 127.0.2.1
         local interface Management1
         template interval 40020
   no shutdown
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname flow-tracking-tests-l2-leaf4
ip domain lookup source-interface Vlan4092
ip name-server vrf default 192.168.200.5
!
vlan 11
   name VLAN11
!
vlan 4092
   name INBAND_MGMT
!
vrf instance MGMT
!
interface Port-Channel1
   description L2_flow-tracking-tests-leaf-mlag_Port-Channel34
   no shutdown
   switchport trunk allowed vlan 11,4092
   switchport mode trunk
   switchport
   flow tracker hardware FLOW-TRACKER-11
!
interface Ethernet1
   description L2_flow-tracking-tests-leaf3_Ethernet34
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_flow-tracking-tests-leaf4_Ethernet34
   no shutdown
   channel-group 1 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.204/24
!
interface Vlan4092
   description Inband Management
   no shutdown
   mtu 1500
   ip address 10.254.254.6/24
!
no ip routing
no ip routing vrf MGMT
!
ip route 0.0.0.0/0 10.254.254.1
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 192.168.200.5 prefer
!
end
