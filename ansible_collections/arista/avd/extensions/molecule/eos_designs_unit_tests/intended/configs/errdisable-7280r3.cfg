!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
errdisable detect cause acl
errdisable detect cause arp-inspection
errdisable detect cause fabric-capacity-low
errdisable detect cause link-change
errdisable detect cause tpid
errdisable detect cause xcvr-misconfigured
errdisable detect cause xcvr-overheat
errdisable detect cause xcvr-power-unsupported
errdisable recovery cause arp-inspection
errdisable recovery cause bpduguard
errdisable recovery cause fabric-capacity-low
errdisable recovery cause link-flap
errdisable recovery cause tpid
errdisable recovery cause xcvr-misconfigured
errdisable recovery cause xcvr-overheat
errdisable recovery cause xcvr-power-unsupported
errdisable recovery cause xcvr-unsupported
errdisable recovery cause arp-inspection interval 90
errdisable recovery cause bpduguard interval 300
errdisable recovery cause fabric-capacity-low interval 300
errdisable recovery cause link-flap interval 60
errdisable recovery cause tpid interval 300
errdisable recovery cause xcvr-misconfigured interval 300
errdisable recovery cause xcvr-overheat interval 300
errdisable recovery cause xcvr-power-unsupported interval 300
errdisable recovery cause xcvr-unsupported interval 300
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname errdisable-7280r3
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_errdisable-veos-lab_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.7/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.10.4/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.10.20.4/32
!
interface Vxlan1
   description errdisable-7280r3_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
!
hardware tcam
   system profile vxlan-routing
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.10.0/24 eq 32
   seq 20 permit 10.10.20.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 10.10.10.4
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.10.50.6 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.6 remote-as 65001
   neighbor 10.10.50.6 description errdisable-veos-lab_Ethernet4
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
