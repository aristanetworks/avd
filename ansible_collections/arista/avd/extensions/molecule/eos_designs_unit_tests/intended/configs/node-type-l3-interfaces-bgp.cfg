!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname node-type-l3-interfaces-bgp
!
vrf instance MGMT
!
interface Port-Channel47
   description PEER-PC-BGP_Port-Channel47
   no shutdown
   no switchport
   ipv6 address 2001:db8:1::1/64
!
interface Ethernet43
   description INTERNET
   shutdown
   no switchport
   ip address 192.168.42.42/24
!
interface Ethernet44
   description PEER-IPV6_Ethernet1
   no shutdown
   no switchport
   ipv6 address 2001:db8::1/64
!
interface Ethernet45
   description PEER-PC-BGP_Ethernet1
   no shutdown
   channel-group 47 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list ALLOW-DEFAULT
   seq 10 permit 0.0.0.0/0
!
ipv6 unicast-routing
!
route-map RM-BGP-192.168.42.1-IN permit 10
   match ip address prefix-list ALLOW-DEFAULT
   set community no-advertise additive
!
route-map RM-BGP-192.168.42.1-OUT deny 10
!
router bgp 65000
   router-id 192.168.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor 192.168.42.1 remote-as 65042
   neighbor 192.168.42.1 description INTERNET
   neighbor 192.168.42.1 route-map RM-BGP-192.168.42.1-IN in
   neighbor 192.168.42.1 route-map RM-BGP-192.168.42.1-OUT out
   neighbor 2001:db8:1::2 remote-as 65047
   neighbor 2001:db8:1::2 description PEER-PC-BGP_Port-Channel47
   neighbor 2001:db8::2 remote-as 65044
   neighbor 2001:db8::2 description PEER-IPV6_Ethernet1
   redistribute connected
   !
   address-family ipv4
      neighbor 192.168.42.1 activate
   !
   address-family ipv6
      neighbor 2001:db8:1::2 activate
      neighbor 2001:db8::2 activate
!
end
