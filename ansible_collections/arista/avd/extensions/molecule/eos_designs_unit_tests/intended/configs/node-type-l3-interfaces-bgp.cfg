!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname node-type-l3-interfaces-bgp
!
vrf instance MGMT
!
interface Port-Channel45
   description PEER-IPV6-PC_Port-Channel1
   no shutdown
   no switchport
   ipv6 address 2001:db8:45::2/64
!
interface Ethernet43
   description INTERNET
   shutdown
   no switchport
   ip address 192.168.42.42/24
!
interface Ethernet44
   description PEER-DUAL-STACK_Ethernet1
   no shutdown
   no switchport
   ip address 192.168.43.2/24
   ipv6 address 2001:db8:42::2/64
!
interface Ethernet45
   description PEER-IPV6-PC_Ethernet1
   no shutdown
   channel-group 45 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list ALLOW-DEFAULT
   seq 10 permit 0.0.0.0/0
!
ipv6 prefix-list ALLOW-IPV6-DEFAULT
   seq 10 permit ::/0
!
ipv6 prefix-list ALLOW-IPV6-LOCAL
   seq 10 permit 2001:db8:42::/64
!
ipv6 unicast-routing
!
route-map RM-BGP-192.168.42.1-IN permit 10
   match ip address prefix-list ALLOW-DEFAULT
   set community no-advertise additive
!
route-map RM-BGP-192.168.42.1-OUT deny 10
!
route-map RM-BGP-192.168.43.1-IN permit 10
   match ip address prefix-list ALLOW-DEFAULT
!
route-map RM-BGP-192.168.43.1-OUT deny 10
!
route-map RM-BGP-2001:db8:42::1-IN permit 10
   match ipv6 address prefix-list ALLOW-IPV6-DEFAULT
!
route-map RM-BGP-2001:db8:42::1-OUT permit 10
   match ipv6 address prefix-list ALLOW-IPV6-LOCAL
!
route-map RM-BGP-2001:db8:42::1-OUT deny 20
!
route-map RM-BGP-2001:db8:45::1-IN permit 10
   match ipv6 address prefix-list ALLOW-IPV6-DEFAULT
!
router bgp 65000
   router-id 192.168.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor 192.168.42.1 remote-as 65042
   neighbor 192.168.42.1 description INTERNET
   neighbor 192.168.42.1 route-map RM-BGP-192.168.42.1-IN in
   neighbor 192.168.42.1 route-map RM-BGP-192.168.42.1-OUT out
   neighbor 192.168.43.1 remote-as 65043
   neighbor 192.168.43.1 description PEER-DUAL-STACK_Ethernet1
   neighbor 192.168.43.1 route-map RM-BGP-192.168.43.1-IN in
   neighbor 192.168.43.1 route-map RM-BGP-192.168.43.1-OUT out
   neighbor 2001:db8:42::1 remote-as 65043
   neighbor 2001:db8:42::1 description PEER-DUAL-STACK_Ethernet1
   neighbor 2001:db8:42::1 route-map RM-BGP-2001:db8:42::1-IN in
   neighbor 2001:db8:42::1 route-map RM-BGP-2001:db8:42::1-OUT out
   neighbor 2001:db8:45::1 remote-as 65045
   neighbor 2001:db8:45::1 description PEER-IPV6-PC_Port-Channel1
   neighbor 2001:db8:45::1 route-map RM-BGP-2001:db8:45::1-IN in
   redistribute connected
   !
   address-family ipv4
      neighbor 192.168.42.1 activate
      neighbor 192.168.43.1 activate
   !
   address-family ipv6
      neighbor 2001:db8:42::1 activate
      neighbor 2001:db8:45::1 activate
!
end
