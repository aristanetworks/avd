!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ipv6-acls
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   no shutdown
   no switchport
   ip address 2001:db8:172:16::2/127
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet1 in
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet1 out
!
interface Ethernet2
   no shutdown
   no switchport
   ip address dhcp
   dhcp client accept default-route
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet2 in
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet2 out
!
interface Ethernet3
   no shutdown
   no switchport
   ip address dhcp
   dhcp client accept default-route
   ipv6 access-group TEST-IPV6-ACL-WITH-NO-FIELDS-IN in
   ipv6 access-group TEST-IPV6-ACL-WITH-NO-FIELDS-OUT out
!
interface Ethernet4
   no shutdown
   no switchport
   ip address 2001:db8:172:19::/127
   ipv6 access-group TEST-IPV6-ACL-WITH-NO-FIELDS-IN in
   ipv6 access-group TEST-IPV6-ACL-WITH-NO-FIELDS-OUT out
!
interface Ethernet5/1
   no shutdown
   no switchport
   ip address 2001:db8:172:20::/127
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet5_1 in
!
interface Ethernet6/6
   no shutdown
   no switchport
!
interface Ethernet6/6.6
   no shutdown
   encapsulation dot1q vlan 6
   ip address 2001:db8:172:21::/127
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet6_6.6 out
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.0.1/32
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet1
   15 deny ip any host 2001:db8:172:16::2
   permit ip 2001:db8:172:16::1/127 host 2001:db8:172:16::2
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet2
   15 deny ip any host 2001:db8:1::1
   permit ip host 2001:db8:1::2 host 2001:db8:1::1
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet5_1
   15 deny ip any host 2001:db8:172:20::
   permit ip 2001:db8:172:20::1/127 host 2001:db8:172:20::
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet1
   remark Some remark will not require source and destination fields.
   permit ip host 2001:db8:172:16::2 any
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet2
   remark Some remark will not require source and destination fields.
   permit ip host 2001:db8:1::1 any
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet6_6.6
   remark Some remark will not require source and destination fields.
   permit ip host 2001:db8:172:21:: any
!
ipv6 access-list TEST-IPV6-ACL-WITH-NO-FIELDS-IN
   permit ip host 172.18.18.18 any
!
ipv6 access-list TEST-IPV6-ACL-WITH-NO-FIELDS-OUT
   permit ip host 172.18.18.18 any
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.0.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 192.168.0.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
