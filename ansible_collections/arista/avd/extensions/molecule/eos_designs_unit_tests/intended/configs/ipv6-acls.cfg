!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ipv6-acls
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   no shutdown
   no switchport
   ip address 172.16.0.2/30
   ipv6 access-group TEST-IPV6-ACL-IN in
   ipv6 access-group TEST-IPV6-ACL-OUT out
!
interface Ethernet4
   no shutdown
   no switchport
   ip address 172.19.19.0/31
   ipv6 access-group TEST-IPV6-ACL-IN in
   ipv6 access-group TEST-IPV6-ACL-OUT out
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.0.1/32
!
ipv6 access-list TEST-IPV6-ACL-IN
   15 allow
!
ipv6 access-list TEST-IPV6-ACL-OUT
   15 deny
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.0.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 192.168.0.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
