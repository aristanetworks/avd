!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname underlay-ibgp-ai-ssp2
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_underlay-ibgp-ai-pod1-sp1_Ethernet8
   no shutdown
   mtu 9394
   no switchport
   ipv6 enable
!
interface Ethernet2
   description P2P_underlay-ibgp-ai-pod1-sp2_Ethernet8
   no shutdown
   mtu 9394
   no switchport
   ipv6 enable
!
interface Ethernet3
   description P2P_underlay-ibgp-ai-pod2-sp1_Ethernet8
   no shutdown
   mtu 9394
   no switchport
   ipv6 enable
!
interface Ethernet4
   description P2P_underlay-ibgp-ai-pod2-sp2_Ethernet8
   no shutdown
   mtu 9394
   no switchport
   ipv6 enable
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.102.250/32
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
!
ipv6 unicast-routing
!
router bgp 65000.0
   bgp asn notation asdot
   router-id 192.168.102.250
   update wait-install
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   bgp cluster-id 1.1.1.1
   maximum-paths 128 ecmp 128
   neighbor default send-community
   neighbor RR-CLIENTS-UNDERLAY-PEERS peer group
   neighbor RR-CLIENTS-UNDERLAY-PEERS next-hop-self
   neighbor RR-CLIENTS-UNDERLAY-PEERS route-reflector-client
   neighbor RR-CLIENTS-UNDERLAY-PEERS send-community
   neighbor RR-CLIENTS-UNDERLAY-PEERS maximum-routes 0
   redistribute connected
   neighbor interface Ethernet1 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000.0
   neighbor interface Ethernet2 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000.0
   neighbor interface Ethernet3 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000.0
   neighbor interface Ethernet4 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000.0
   !
   address-family ipv4
      neighbor RR-CLIENTS-UNDERLAY-PEERS activate
      neighbor RR-CLIENTS-UNDERLAY-PEERS next-hop address-family ipv6 originate
!
end
