!
no enable password
no aaa root
!
dhcp relay
   tunnel requests disabled
   mlag peer-link requests disabled
!
ip dhcp relay information option
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dhcp-relay-vtep-mlag-2
!
no spanning-tree vlan-id 4094
!
vlan 101
   name dhcp-relay-1
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
interface Port-Channel5
   description MLAG_dhcp-relay-vtep-mlag-1_Port-Channel5
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description P2P_mlag-isis-spine_Ethernet35
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.101.9/31
!
interface Ethernet5
   description MLAG_dhcp-relay-vtep-mlag-1_Ethernet5
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description MLAG_dhcp-relay-vtep-mlag-1_Ethernet6
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 172.31.255.37/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.36/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.117/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.10.255.7/31
!
interface Vxlan1
   description dhcp-relay-vtep-mlag-2_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 101 vni 10101
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 172.31.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
mlag configuration
   domain-id DHCP_RELAY_VTEP_MLAG
   local-interface Vlan4094
   peer-address 10.10.255.6
   peer-link Port-Channel5
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65161
   router-id 172.31.255.37
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65161
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description dhcp-relay-vtep-mlag-1
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.10.10.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.10.1 remote-as 65000
   neighbor 10.10.10.1 description mlag-isis-spine_Loopback0
   neighbor 10.10.101.8 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.101.8 remote-as 65000
   neighbor 10.10.101.8 description mlag-isis-spine_Ethernet35
   neighbor 10.10.255.6 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.10.255.6 description dhcp-relay-vtep-mlag-1_Vlan4094
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 101
      rd 172.31.255.37:10101
      route-target both 10101:10101
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
!
end
