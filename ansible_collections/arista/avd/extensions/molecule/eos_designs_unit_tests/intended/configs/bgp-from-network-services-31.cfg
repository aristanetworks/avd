!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bgp-from-network-services-31
!
spanning-tree mode none
no spanning-tree vlan-id 4093-4094
!
vlan 3103
   name MLAG_L3_VRF_default
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
interface Port-Channel10
   description MLAG_bgp-from-network-services-32_Port-Channel10
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet10
   description MLAG_bgp-from-network-services-32_Ethernet10
   no shutdown
   channel-group 10 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.0.255.31/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.1.1.31/24
!
interface Vlan3103
   description MLAG_L3_VRF_default
   no shutdown
   mtu 9214
   vrf default
   ipv6 enable
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.10.10.60/31
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
!
ipv6 unicast-routing
!
mlag configuration
   domain-id BGP_FROM_NETWORK_SERVICES_GROUP4
   local-interface Vlan4094
   peer-address 10.10.10.61
   peer-link Port-Channel10
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bgp 65001
   router-id 192.0.255.31
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65001
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description bgp-from-network-services-32
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   redistribute connected route-map RM-CONN-2-BGP-VRFS
   neighbor interface Vlan3103 peer-group MLAG-IPv4-UNDERLAY-PEER remote-as 65001
   !
   address-family ipv4
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
      neighbor MLAG-IPv4-UNDERLAY-PEER next-hop address-family ipv6 originate
!
end
