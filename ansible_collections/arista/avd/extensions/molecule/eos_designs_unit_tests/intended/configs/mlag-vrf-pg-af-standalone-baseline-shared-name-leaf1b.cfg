!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1b
!
no spanning-tree vlan-id 4093-4094
!
vlan 120
   name VLAN120_IPV4
!
vlan 3019
   name MLAG_L3_VRF_VRF_IPV4
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF_IPV4
!
interface Port-Channel11
   description MLAG_mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1a_Port-Channel11
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet11
   description MLAG_mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1a_Ethernet11
   no shutdown
   channel-group 11 mode active
!
interface Ethernet12
   description MLAG_mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1a_Ethernet12
   no shutdown
   channel-group 11 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.20/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.19/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.120/24
!
interface Vlan120
   description VLAN120_IPV4
   shutdown
   vrf VRF_IPV4
   ip address virtual 10.10.120.1/24
!
interface Vlan3019
   description MLAG_L3_VRF_VRF_IPV4
   no shutdown
   mtu 9214
   vrf VRF_IPV4
   ip address 10.255.251.37/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.255.251.37/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.37/31
!
interface Vxlan1
   description mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 120 vni 10120
   vxlan vrf VRF_IPV4 vni 20
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_IPV4
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.251.36/31
!
mlag configuration
   domain-id MLAG_VRF_PG_AF_STANDALONE_BASELINE_SHARED_NAME
   local-interface Vlan4094
   peer-address 10.255.252.36
   peer-link Port-Channel11
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65120
   router-id 192.168.255.20
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65120
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1a
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.255.251.36 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.251.36 description mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1a_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 120
      rd 192.168.255.20:10120
      route-target both 10120:10120
      redistribute learned
   !
   address-family ipv4
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF_IPV4
      rd 192.168.255.20:20
      route-target import evpn 20:20
      route-target export evpn 20:20
      router-id 192.168.255.20
      neighbor 10.255.251.36 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.251.36 description mlag-vrf-pg-af-standalone-baseline-shared-name-leaf1a_Vlan3019
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
