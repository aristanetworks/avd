!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bgp-peer-groups-ipv4-selector-generic
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_bgp-peer-groups-3_Ethernet64
   no shutdown
   mtu 9214
   no switchport
   ip address 192.168.252.217/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.117/32
!
interface Vxlan1
   description bgp-peer-groups-ipv4-selector-generic_VTEP
   vxlan source-interface Loopback0
   vxlan udp-port 4789
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.168.255.117
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor CUSTOM-UNDERLAY-PEERS peer group
   neighbor CUSTOM-UNDERLAY-PEERS bfd
   neighbor CUSTOM-UNDERLAY-PEERS description Description for underlay_peers via structured_config
   neighbor CUSTOM-UNDERLAY-PEERS password 7 NbGgT822TGbA1ANof67e0A==
   neighbor CUSTOM-UNDERLAY-PEERS send-community
   neighbor CUSTOM-UNDERLAY-PEERS maximum-routes 12010
   neighbor 192.168.252.216 peer group CUSTOM-UNDERLAY-PEERS
   neighbor 192.168.252.216 remote-as 65001
   neighbor 192.168.252.216 description bgp-peer-groups-3_Ethernet64
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor CUSTOM-UNDERLAY-PEERS activate
!
end
