!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ospfv3-mlag-a
!
no spanning-tree vlan-id 4093-4094
!
vlan 320
   name SHARED_TRANSIT
!
vlan 321
   name P2P_LINK_LOCAL
!
vlan 330
   name MLAG_PEERS_TRANSIT
!
vlan 331
   name NODE_SPECIFIC_TRANSIT
!
vlan 3009
   name MLAG_L3_VRF_VRF_A
   trunk group MLAG
!
vlan 3010
   name MLAG_L3_VRF_VRF_NODE_SPECIFIC
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF_A
!
vrf instance VRF_NODE_SPECIFIC
!
interface Port-Channel5
   description MLAG_network-services-ospfv3-mlag-b_Port-Channel5
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet5
   description MLAG_network-services-ospfv3-mlag-b_Ethernet5
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description MLAG_network-services-ospfv3-mlag-b_Ethernet6
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.1/32
!
interface Vlan320
   description SHARED_TRANSIT
   no shutdown
   vrf VRF_A
   ip address 10.1.32.2/24
   ipv6 address 2001:db8:320::2/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
   ipv6 virtual-router address 2001:db8:320::1
!
interface Vlan321
   description P2P_LINK_LOCAL
   no shutdown
   vrf VRF_A
   ipv6 enable
   no ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan330
   description MLAG_PEERS_TRANSIT
   no shutdown
   vrf VRF_NODE_SPECIFIC
   ipv6 address 2001:db8:330::2/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan331
   description NODE_SPECIFIC_TRANSIT
   no shutdown
   vrf VRF_NODE_SPECIFIC
   ipv6 address 2001:db8:331::2/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan3009
   description MLAG_L3_VRF_VRF_A
   no shutdown
   mtu 9214
   vrf VRF_A
   ip address 10.255.251.0/31
!
interface Vlan3010
   description MLAG_L3_VRF_VRF_NODE_SPECIFIC
   no shutdown
   mtu 9214
   vrf VRF_NODE_SPECIFIC
   ip address 10.255.251.0/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.255.251.0/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.0/31
!
interface Vxlan1
   description network-services-ospfv3-mlag-a_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vrf VRF_A vni 10
   vxlan vrf VRF_NODE_SPECIFIC vni 11
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_A
ip routing vrf VRF_NODE_SPECIFIC
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.251.0/31
ipv6 unicast-routing vrf VRF_A
ipv6 unicast-routing vrf VRF_NODE_SPECIFIC
!
mlag configuration
   domain-id NETWORK_SERVICES_OSPFV3_MLAG
   local-interface Vlan4094
   peer-address 10.255.252.1
   peer-link Port-Channel5
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 192.168.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description network-services-ospfv3-mlag-b
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.255.251.1 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.251.1 description network-services-ospfv3-mlag-b_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF_A
      rd 192.168.255.1:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 192.168.255.1
      update wait-install
      neighbor 10.255.251.1 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.251.1 description network-services-ospfv3-mlag-b_Vlan3009
      redistribute connected route-map RM-CONN-2-BGP-VRFS
      redistribute ospfv3
   !
   vrf VRF_NODE_SPECIFIC
      rd 192.168.255.1:11
      route-target import evpn 11:11
      route-target export evpn 11:11
      router-id 192.168.255.1
      update wait-install
      neighbor 10.255.251.1 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.251.1 description network-services-ospfv3-mlag-b_Vlan3010
      redistribute connected route-map RM-CONN-2-BGP-VRFS
      redistribute ospfv3
!
router ospfv3 vrf VRF_A
   router-id 192.168.255.1
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
router ospfv3 vrf VRF_NODE_SPECIFIC
   router-id 192.168.255.1
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
end
