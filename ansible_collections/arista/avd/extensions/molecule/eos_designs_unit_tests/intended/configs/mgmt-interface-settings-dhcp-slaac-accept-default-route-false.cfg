!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname mgmt-interface-settings-dhcp-slaac-accept-default-route-false
!
vrf instance MGMT
!
interface Management1
   description Management Interface - DHCP
   no shutdown
   vrf MGMT
   ip address dhcp
   ipv6 enable
   ipv6 address auto-config
no ip routing vrf MGMT
!
ip route vrf MGMT 10.0.10.0/24 10.1.1.1
ip route vrf MGMT 172.16.254.0/23 10.1.1.1
!
ipv6 route vrf MGMT 0210:1::/64 0200::1
ipv6 route vrf MGMT 0210:2::/64 0200::1
!
end
