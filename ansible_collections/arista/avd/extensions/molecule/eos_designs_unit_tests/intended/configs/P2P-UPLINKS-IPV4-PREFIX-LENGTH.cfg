!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname p2p-uplinks-ipv4-prefix-length
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_mlag-odd-id-l3leaf1a_Ethernet10
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.255.250/30
!
interface Ethernet2
   description P2P_mlag-odd-id-l3leaf1b_Ethernet10
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.255.254/30
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.254.254.32/32
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.254.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65123
   router-id 10.254.254.32
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.254.255.249 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.255.249 remote-as 923
   neighbor 10.254.255.249 description mlag-odd-id-l3leaf1a_Ethernet10
   neighbor 10.254.255.253 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.255.253 remote-as 923
   neighbor 10.254.255.253 description mlag-odd-id-l3leaf1b_Ethernet10
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
