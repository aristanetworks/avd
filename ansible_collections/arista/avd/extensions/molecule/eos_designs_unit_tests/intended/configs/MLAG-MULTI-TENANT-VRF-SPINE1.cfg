!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname MLAG-MULTI-TENANT-VRF-SPINE1
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_MLAG-MULTI-TENANT-VRF-L3LEAF1A_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 172.31.255.0/31
!
interface Ethernet2
   description P2P_MLAG-MULTI-TENANT-VRF-L3LEAF1B_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 172.31.255.2/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.201.101/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 192.168.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 172.31.255.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.31.255.1 remote-as 65101
   neighbor 172.31.255.1 description MLAG-MULTI-TENANT-VRF-L3LEAF1A_Ethernet1
   neighbor 172.31.255.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.31.255.3 remote-as 65101
   neighbor 172.31.255.3 description MLAG-MULTI-TENANT-VRF-L3LEAF1B_Ethernet1
   neighbor 192.168.255.101 peer group EVPN-OVERLAY-PEERS
   neighbor 192.168.255.101 remote-as 65101
   neighbor 192.168.255.101 description MLAG-MULTI-TENANT-VRF-L3LEAF1A_Loopback0
   neighbor 192.168.255.102 peer group EVPN-OVERLAY-PEERS
   neighbor 192.168.255.102 remote-as 65101
   neighbor 192.168.255.102 description MLAG-MULTI-TENANT-VRF-L3LEAF1B_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
