!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ospf-bgp-redistribute
!
vlan 500
   name VRF-OSPF-INTERNAL-500
!
vlan 510
   name VRF-OSPF-EXTERNAL-NSSA-510
!
vlan 520
   name VRF-OSPF-NSSA-NO-TYPE-520
!
vlan 530
   name VRF-OSPF-NSSA-TYPE2-530
!
vrf instance MGMT
!
vrf instance VRF-OSPF-EXTERNAL-NSSA
!
vrf instance VRF-OSPF-INTERNAL
!
vrf instance VRF-OSPF-NSSA-NO-TYPE
!
vrf instance VRF-OSPF-NSSA-TYPE2
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.90.50/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.91.50/32
!
interface Vlan500
   description VRF-OSPF-INTERNAL-500
   no shutdown
   vrf VRF-OSPF-INTERNAL
   ip address 10.1.50.1/24
   ip ospf area 0.0.0.0
!
interface Vlan510
   description VRF-OSPF-EXTERNAL-NSSA-510
   no shutdown
   vrf VRF-OSPF-EXTERNAL-NSSA
   ip address 10.1.51.1/24
   ip ospf area 0.0.0.0
!
interface Vlan520
   description VRF-OSPF-NSSA-NO-TYPE-520
   no shutdown
   vrf VRF-OSPF-NSSA-NO-TYPE
   ip address 10.1.52.1/24
   ip ospf area 0.0.0.0
!
interface Vlan530
   description VRF-OSPF-NSSA-TYPE2-530
   no shutdown
   vrf VRF-OSPF-NSSA-TYPE2
   ip address 10.1.53.1/24
   ip ospf area 0.0.0.0
!
interface Vxlan1
   description network-services-ospf-bgp-redistribute_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf VRF-OSPF-EXTERNAL-NSSA vni 51
   vxlan vrf VRF-OSPF-INTERNAL vni 50
   vxlan vrf VRF-OSPF-NSSA-NO-TYPE vni 52
   vxlan vrf VRF-OSPF-NSSA-TYPE2 vni 53
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF-OSPF-EXTERNAL-NSSA
ip routing vrf VRF-OSPF-INTERNAL
ip routing vrf VRF-OSPF-NSSA-NO-TYPE
ip routing vrf VRF-OSPF-NSSA-TYPE2
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.90.0/24 eq 32
   seq 20 permit 192.168.91.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65190
   router-id 192.168.90.50
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vrf VRF-OSPF-EXTERNAL-NSSA
      rd 192.168.90.50:51
      route-target import evpn 51:51
      route-target export evpn 51:51
      router-id 192.168.90.50
      redistribute connected
      redistribute ospf match external include leaked route-map RM-OSPF-TO-BGP-EXTERNAL
      redistribute ospf match nssa-external 1 route-map RM-OSPF-TO-BGP-NSSA
   !
   vrf VRF-OSPF-INTERNAL
      rd 192.168.90.50:50
      route-target import evpn 50:50
      route-target export evpn 50:50
      router-id 192.168.90.50
      redistribute connected
      redistribute ospf include leaked route-map RM-OSPF-TO-BGP-INTERNAL
   !
   vrf VRF-OSPF-NSSA-NO-TYPE
      rd 192.168.90.50:52
      route-target import evpn 52:52
      route-target export evpn 52:52
      router-id 192.168.90.50
      redistribute connected
      redistribute ospf match nssa-external include leaked
   !
   vrf VRF-OSPF-NSSA-TYPE2
      rd 192.168.90.50:53
      route-target import evpn 53:53
      route-target export evpn 53:53
      router-id 192.168.90.50
      redistribute connected
      redistribute ospf match nssa-external 2
!
router ospf 50 vrf VRF-OSPF-INTERNAL
   router-id 192.168.90.50
   passive-interface default
   no passive-interface Vlan500
   redistribute bgp
!
router ospf 51 vrf VRF-OSPF-EXTERNAL-NSSA
   router-id 192.168.90.50
   passive-interface default
   no passive-interface Vlan510
   redistribute bgp
!
router ospf 52 vrf VRF-OSPF-NSSA-NO-TYPE
   router-id 192.168.90.50
   passive-interface default
   no passive-interface Vlan520
   redistribute bgp
!
router ospf 53 vrf VRF-OSPF-NSSA-TYPE2
   router-id 192.168.90.50
   passive-interface default
   no passive-interface Vlan530
   redistribute bgp
!
end
