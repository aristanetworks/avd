!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname platform-settings-speed-auto-cloudeos
!
vrf instance MGMT
!
interface Ethernet20
   description EXPLICIT_AUTO_MODE_SUPPRESSED
   no shutdown
   switchport
!
interface Ethernet21
   description PLAIN_AUTO_PRESERVED
   no shutdown
   speed auto
   switchport
!
interface Ethernet22
   description FIXED_SPEED_PRESERVED
   no shutdown
   speed 10g
   switchport
no ip routing vrf MGMT
!
end
