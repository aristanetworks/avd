!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname cv-topology-mlag-without-metadata-tests-leaf1
!
no spanning-tree vlan-id 4094
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
interface Port-Channel7
   description MLAG_cv-topology-mlag-without-metadata-tests-leaf2_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet7
   description MLAG_cv-topology-mlag-without-metadata-tests-leaf2_Ethernet3
   no shutdown
   channel-group 7 mode active
!
interface Ethernet8
   description MLAG_cv-topology-mlag-without-metadata-tests-leaf2_Ethernet4
   no shutdown
   channel-group 7 mode active
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.252.0/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id CV_TOPOLOGY_MLAG_WITHOUT_METADATA_TESTS
   local-interface Vlan4094
   peer-address 10.255.252.1
   peer-link Port-Channel7
   reload-delay mlag 300
   reload-delay non-mlag 330
!
end
