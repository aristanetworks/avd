!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname address-locking-11
!
vrf instance MGMT
!
interface Port-Channel2
   description ADDRESS_LOCKING_11_SERVER_UNSET
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
!
interface Port-Channel3
   description ADDRESS_LOCKING_11_SERVER_IPV4_IPV6_TRUE
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
!
interface Port-Channel4
   description ADDRESS_LOCKING_11_SERVER_IPV4_DISABLED_IPV6_TRUE
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
   !
   address locking
      address-family ipv4 disabled
!
interface Port-Channel5
   description ADDRESS_LOCKING_11_SERVER_IPV4_TRUE_IPV6_DISABLED
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
   !
   address locking
      address-family ipv6 disabled
!
interface Port-Channel6
   description ADDRESS_LOCKING_11_SERVER_IPV4_IPV6_DISABLED
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
   !
   address locking
      address-family ipv4 disabled
      address-family ipv6 disabled
!
interface Port-Channel7
   description ADDRESS_LOCKING_11_NETWORK_PORT_UNSET
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
!
interface Port-Channel8
   description ADDRESS_LOCKING_11_NETWORK_PORT_IPV4_IPV6_TRUE
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
!
interface Port-Channel9
   description ADDRESS_LOCKING_11_NETWORK_PORT_IPV4_DISABLED_IPV6_TRUE
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
   !
   address locking
      address-family ipv4 disabled
!
interface Port-Channel10
   description ADDRESS_LOCKING_11_NETWORK_PORT_IPV4_TRUE_IPV6_DISABLED
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
   !
   address locking
      address-family ipv6 disabled
!
interface Port-Channel11
   description ADDRESS_LOCKING_11_NETWORK_PORT_IPV4_IPV6_DISABLED
   no shutdown
   switchport access vlan 101
   switchport mode access
   switchport
   !
   address locking
      address-family ipv4 disabled
      address-family ipv6 disabled
!
interface Ethernet2
   description ADDRESS_LOCKING_11_SERVER_UNSET_MEMBER
   no shutdown
   channel-group 2 mode active
!
interface Ethernet3
   description ADDRESS_LOCKING_11_SERVER_IPV4_IPV6_TRUE_MEMBER
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description ADDRESS_LOCKING_11_SERVER_IPV4_DISABLED_IPV6_TRUE_MEMBER
   no shutdown
   channel-group 4 mode active
!
interface Ethernet5
   description ADDRESS_LOCKING_11_SERVER_IPV4_TRUE_IPV6_DISABLED_MEMBER
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description ADDRESS_LOCKING_11_SERVER_IPV4_IPV6_DISABLED_MEMBER
   no shutdown
   channel-group 6 mode active
!
interface Ethernet7
   description ADDRESS_LOCKING_11_NETWORK_PORT_UNSET_MEMBER
   no shutdown
   channel-group 7 mode active
!
interface Ethernet8
   description ADDRESS_LOCKING_11_NETWORK_PORT_IPV4_IPV6_TRUE_MEMBER
   no shutdown
   channel-group 8 mode active
!
interface Ethernet9
   description ADDRESS_LOCKING_11_NETWORK_PORT_IPV4_DISABLED_IPV6_TRUE_MEMBER
   no shutdown
   channel-group 9 mode active
!
interface Ethernet10
   description ADDRESS_LOCKING_11_NETWORK_PORT_IPV4_TRUE_IPV6_DISABLED_MEMBER
   no shutdown
   channel-group 10 mode active
!
interface Ethernet11
   description ADDRESS_LOCKING_11_NETWORK_PORT_IPV4_IPV6_DISABLED_MEMBER
   no shutdown
   channel-group 11 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.109/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.109/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 1.1.10.10
!
interface Vxlan1
   description address-locking-11_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 101
   router-id 192.168.255.109
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
