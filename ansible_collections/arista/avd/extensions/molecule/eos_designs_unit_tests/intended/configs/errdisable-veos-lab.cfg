!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
errdisable detect cause acl
errdisable detect cause arp-inspection
errdisable detect cause link-change
errdisable recovery cause acl interval 60
errdisable recovery cause arp-inspection interval 90
errdisable recovery cause bpduguard interval 300
errdisable recovery cause link-flap interval 60
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname errdisable-veos-lab
!
vrf instance MGMT
!
interface Ethernet2
   description P2P_errdisable-ceos-lab_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.2/31
!
interface Ethernet3
   description P2P_errdisable-7280r_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.4/31
!
interface Ethernet5
   description P2P_errdisable-custom-platform_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.10.50.8/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.10.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.10.20.1/32
!
interface Vxlan1
   description errdisable-veos-lab_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.10.0/24 eq 32
   seq 20 permit 10.10.20.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 10.10.10.1
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.10.50.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.3 remote-as 65001
   neighbor 10.10.50.3 description errdisable-ceos-lab_Ethernet1
   neighbor 10.10.50.5 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.5 remote-as 65001
   neighbor 10.10.50.5 description errdisable-7280r_Ethernet1
   neighbor 10.10.50.9 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.10.50.9 remote-as 65001
   neighbor 10.10.50.9 description errdisable-custom-platform_Ethernet1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
