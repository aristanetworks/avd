!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname underlay-ibgp-ai-pod2-cl2
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_underlay-ibgp-ai-pod2-sp1_Ethernet2
   no shutdown
   mtu 9394
   no switchport
   ipv6 enable
!
interface Ethernet2
   description P2P_underlay-ibgp-ai-pod2-sp2_Ethernet2
   no shutdown
   mtu 9394
   no switchport
   ipv6 enable
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.101.6/32
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
!
ipv6 unicast-routing
!
router bgp 65000.0
   bgp asn notation asdot
   router-id 192.168.101.6
   update wait-install
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   maximum-paths 128 ecmp 128
   neighbor default send-community
   neighbor RR-UNDERLAY-PEERS peer group
   neighbor RR-UNDERLAY-PEERS next-hop-self
   neighbor RR-UNDERLAY-PEERS send-community
   neighbor RR-UNDERLAY-PEERS maximum-routes 0
   redistribute connected
   neighbor interface Ethernet1 peer-group RR-UNDERLAY-PEERS remote-as 65000.0
   neighbor interface Ethernet2 peer-group RR-UNDERLAY-PEERS remote-as 65000.0
   !
   address-family ipv4
      neighbor RR-UNDERLAY-PEERS activate
      neighbor RR-UNDERLAY-PEERS next-hop address-family ipv6 originate
!
end
