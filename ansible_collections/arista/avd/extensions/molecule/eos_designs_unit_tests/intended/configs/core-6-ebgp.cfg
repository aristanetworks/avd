!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname core-6-ebgp
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_LINK_TO_CORE-7-EBGP_Ethernet1
   no shutdown
   mtu 1600
   no switchport
   ip address 172.16.2.0/31
   ipv6 address 2001:db8:64:48::/127
   mpls ip
!
interface Ethernet2
   description P2P_LINK_TO_CORE-7-EBGP_Ethernet2
   no shutdown
   mtu 1600
   no switchport
   ip address 172.16.3.0/31
   ipv6 address 2001:db8:64:1234::/127
   mpls ip
!
interface Ethernet3
   description P2P_LINK_TO_CORE-7-EBGP_Ethernet3
   no shutdown
   mtu 1600
   no switchport
   ip address 172.16.3.2/31
   ipv6 address 2001:db8:64:1234::2/127
   mpls ip
!
interface Ethernet4
   description P2P_LINK_TO_CORE-7-EBGP_Ethernet4
   no shutdown
   mtu 1600
   no switchport
   ipv6 address 2001:db8:64:ff::/127
   mpls ip
!
interface Ethernet5
   description P2P_LINK_TO_CORE-7-EBGP_Ethernet5
   no shutdown
   mtu 1600
   no switchport
   ipv6 address 2001:db8:64:5000::0/127
   mpls ip
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.0.0.7/32
   ipv6 address 2000:1234:ffff:ffff::7/128
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.0.0.0/24 eq 32
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2000:1234:ffff:ffff::/64 eq 128
!
ipv6 unicast-routing
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
router bgp 65000
   router-id 10.0.0.7
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 172.16.2.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.2.1 remote-as 65107
   neighbor 172.16.2.1 local-as 65106 no-prepend replace-as
   neighbor 172.16.2.1 description core-7-ebgp
   neighbor 172.16.3.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.3.1 remote-as 65107
   neighbor 172.16.3.1 local-as 65106 no-prepend replace-as
   neighbor 172.16.3.1 description core-7-ebgp
   neighbor 172.16.3.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.3.3 remote-as 65107
   neighbor 172.16.3.3 local-as 65106 no-prepend replace-as
   neighbor 172.16.3.3 description core-7-ebgp
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   address-family ipv6
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
