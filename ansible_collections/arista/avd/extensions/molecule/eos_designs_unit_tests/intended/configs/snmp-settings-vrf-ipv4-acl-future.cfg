!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname snmp-settings-vrf-ipv4-acl-future
!
snmp-server ipv4 access-list acl-for-vrf-default
snmp-server ipv4 access-list acl-for-vrf-MGMT vrf MGMT
no snmp-server vrf default
snmp-server vrf MGMT
!
vrf instance MGMT
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.10.10.43/26
!
ip access-list acl-for-vrf-MGMT
   10 permit ip any any
!
ip access-list acl-for-vrf-default
   10 permit ip any any
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 10.10.10.1
!
end
