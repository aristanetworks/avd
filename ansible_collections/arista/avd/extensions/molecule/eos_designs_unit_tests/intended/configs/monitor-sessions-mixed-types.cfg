!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname monitor-sessions-mixed-types
!
vrf instance MGMT
!
interface Ethernet1
   description SERVER_server1
   no shutdown
   switchport
!
interface Ethernet2
   no shutdown
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.1.2/24
!
ipv6 access-list MONITOR-SESSION-IPV6-ACL
   10 permit ipv6 any any
!
ip access-list MONITOR-SESSION-IP-ACL
   10 permit ip any any
no ip routing vrf MGMT
!
mac access-list MONITOR-SESSION-MAC-ACL
   10 permit any any
!
monitor session MIXED source Ethernet1 rx ip access-group MONITOR-SESSION-IP-ACL priority 10
monitor session MIXED destination Ethernet2
monitor session MONITOR-IPV6 source Ethernet1 rx ipv6 access-group MONITOR-SESSION-IPV6-ACL
monitor session MONITOR-MAC source Ethernet1 rx mac access-group MONITOR-SESSION-MAC-ACL priority 20
!
end
