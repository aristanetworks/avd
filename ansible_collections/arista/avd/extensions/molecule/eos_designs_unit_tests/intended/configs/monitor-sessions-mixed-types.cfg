!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname monitor-sessions-mixed-types
!
vrf instance MGMT
!
interface Ethernet1
   description SERVER_server1
   no shutdown
   switchport
!
interface Ethernet2
   no shutdown
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.1.2/24
no ip routing vrf MGMT
!
monitor session MIXED source Ethernet1 rx
monitor session MIXED destination Ethernet2
!
end
