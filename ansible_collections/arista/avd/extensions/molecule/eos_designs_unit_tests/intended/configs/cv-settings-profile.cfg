!
no enable password
no aaa root
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.cv-prod-eu-3.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname cv-settings-profile
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 192.0.2.53
dns domain example.com
!
vrf instance MGMT
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.0.2.10/24
no ip routing vrf MGMT
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 192.0.2.123 prefer
!
end
