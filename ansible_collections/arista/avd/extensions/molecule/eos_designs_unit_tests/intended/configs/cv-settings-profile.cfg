!
no enable password
no aaa root
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvopt cvaas.addr=apiserver.cv-prod-eu-3.arista.io:443 -cvopt cvaas.auth=token-secure,/tmp/cv-onboarding-token -cvopt cvaas.vrf=MGMT -cvopt cvaas.sourceintf=Management1 -cvopt onprem.addr=192.0.2.11:9910 -cvopt onprem.auth=token,/tmp/token -cvopt onprem.vrf=MGMT -cvopt onprem.sourceintf=Management1 -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname cv-settings-profile
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 192.0.2.53
dns domain example.com
!
vrf instance MGMT
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.0.2.10/24
no ip routing vrf MGMT
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 192.0.2.123 prefer
!
end
