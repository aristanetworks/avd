!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname overlay-routing-protocol-her-l3leaf4
!
vrf instance MGMT
!
interface Ethernet5
   description P2P_overlay-routing-protocol-cvx-l3leaf1_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 172.31.255.9/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.254.5/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.253.5/32
!
interface Vxlan1
   description overlay-routing-protocol-her-l3leaf4_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan flood vtep 192.168.253.1 192.168.253.2 192.168.253.3
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.254.0/24 eq 32
   seq 20 permit 192.168.253.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bgp 65002
   router-id 192.168.254.5
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 172.31.255.8 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.31.255.8 remote-as 65001
   neighbor 172.31.255.8 description overlay-routing-protocol-cvx-l3leaf1_Ethernet5
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
