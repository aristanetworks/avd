!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-vrf-loopbacks-virtual-source-nat
!
vrf instance MGMT
!
vrf instance VRF_DIAG_V4V6_TENANT_LO_V6
!
vrf instance VRF_DIAG_V4_TENANT_LO_V6
!
vrf instance VRF_DIAG_V6_TENANT_LO_V4
