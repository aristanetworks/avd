   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf VRF_DIAG_V4_TENANT_LO_V6 vni 4241
   vxlan vrf VRF_DIAG_V4V6_TENANT_LO_V6 vni 4244
   vxlan vrf VRF_DIAG_V6_TENANT_LO_V4 vni 4242
   vxlan vrf VRF_DUPLICATE_DIAG_V4_DIAG_V6 vni 10
   vxlan vrf VRF_DUPLICATE_TENANT_LO_V4_DIAG_V6 vni 11
   vxlan vrf VRF_NO_DIAG_TENANT_LO_V4_V6 vni 4249
   vxlan vrf VRF_NO_DIAG_TENANT_LO_V6_V4_V6 vni 4246
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip address virtual source-nat vrf VRF_DIAG_V4V6_TENANT_LO_V6 address 10.144.255.3
ip address virtual source-nat vrf VRF_DIAG_V4_TENANT_LO_V6 address 10.141.255.3
ip address virtual source-nat vrf VRF_DUPLICATE_DIAG_V4_DIAG_V6 address 10.100.0.3
ip address virtual source-nat vrf VRF_DUPLICATE_TENANT_LO_V4_DIAG_V6 address 10.202.0.1
ip address virtual source-nat vrf VRF_NO_DIAG_TENANT_LO_V4_V6 address 10.149.0.1
ipv6 address virtual source-nat vrf VRF_DIAG_V4V6_TENANT_LO_V6 address 2001:db8:144::3
ipv6 address virtual source-nat vrf VRF_DIAG_V4_TENANT_LO_V6 address 2001:db8:141::1
ipv6 address virtual source-nat vrf VRF_DIAG_V6_TENANT_LO_V4 address 2001:db8:142::3
ipv6 address virtual source-nat vrf VRF_NO_DIAG_TENANT_LO_V4_V6 address 2001:db8:150::1
ipv6 address virtual source-nat vrf VRF_NO_DIAG_TENANT_LO_V6_V4_V6 address 2001:db8:146::1
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_DIAG_V4V6_TENANT_LO_V6
ip routing vrf VRF_DIAG_V4_TENANT_LO_V6
ip routing vrf VRF_DIAG_V6_TENANT_LO_V4
ip routing vrf VRF_DUPLICATE_DIAG_V4_DIAG_V6
ip routing vrf VRF_DUPLICATE_TENANT_LO_V4_DIAG_V6
ip routing vrf VRF_NO_DIAG_TENANT_LO_V4_V6
ip routing vrf VRF_NO_DIAG_TENANT_LO_V6_V4_V6
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.0.0/24 eq 32
   seq 20 permit 10.11.0.0/24 eq 32
ipv6 unicast-routing vrf VRF_DIAG_V4V6_TENANT_LO_V6
ipv6 unicast-routing vrf VRF_DIAG_V4_TENANT_LO_V6
ipv6 unicast-routing vrf VRF_NO_DIAG_TENANT_LO_V4_V6
ipv6 unicast-routing vrf VRF_NO_DIAG_TENANT_LO_V6_V4_V6
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.10.0.3
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vrf VRF_DIAG_V4_TENANT_LO_V6
      rd 10.10.0.3:4241
      route-target import evpn 4241:4241
      route-target export evpn 4241:4241
      router-id 10.10.0.3
      redistribute connected
   !
   vrf VRF_DIAG_V4V6_TENANT_LO_V6
      rd 10.10.0.3:4244
      route-target import evpn 4244:4244
      route-target export evpn 4244:4244
      router-id 10.10.0.3
      redistribute connected
   !
   vrf VRF_DIAG_V6_TENANT_LO_V4
      rd 10.10.0.3:4242
      route-target import evpn 4242:4242
      route-target export evpn 4242:4242
      router-id 10.10.0.3
      redistribute connected
   !
   vrf VRF_DUPLICATE_DIAG_V4_DIAG_V6
      rd 10.10.0.3:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.10.0.3
      redistribute connected
   !
   vrf VRF_DUPLICATE_TENANT_LO_V4_DIAG_V6
      rd 10.10.0.3:11
      route-target import evpn 11:11
      route-target export evpn 11:11
      router-id 10.10.0.3
      redistribute connected
   !
   vrf VRF_NO_DIAG_TENANT_LO_V4_V6
      rd 10.10.0.3:4249
      route-target import evpn 4249:4249
      route-target export evpn 4249:4249
      router-id 10.10.0.3
      redistribute connected
   !
   vrf VRF_NO_DIAG_TENANT_LO_V6_V4_V6
      rd 10.10.0.3:4246
      route-target import evpn 4246:4246
      route-target export evpn 4246:4246
      router-id 10.10.0.3
      redistribute connected
!
end
