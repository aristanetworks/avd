!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ip-helpers-2
!
spanning-tree mode none
no spanning-tree vlan-id 4093-4094
!
vlan 10
   name SVI1
!
vlan 3099
   name MLAG_L3_VRF_IP_HELPERS1
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance IP_HELPERS1
!
vrf instance MGMT
!
interface Port-Channel10
   description MLAG_network-services-ip-helpers-1_Port-Channel10
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet10
   description MLAG_network-services-ip-helpers-1_Ethernet10
   no shutdown
   channel-group 10 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.0.255.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.1.1.2/24
!
interface Vlan10
   description SVI1
   shutdown
   vrf IP_HELPERS1
   ip helper-address 1.1.1.1 vrf MGMT source-interface Management1
   ip helper-address 1.1.1.2 vrf MGMT source-interface Management1
!
interface Vlan3099
   description MLAG_L3_VRF_IP_HELPERS1
   no shutdown
   mtu 9214
   vrf IP_HELPERS1
   ip address 10.10.20.1/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.10.10.1/31
!
ip routing
ip routing vrf IP_HELPERS1
no ip routing vrf MGMT
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.10.20.0/31
!
mlag configuration
   domain-id GROUP1
   local-interface Vlan4094
   peer-address 10.10.10.0
   peer-link Port-Channel10
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
end
