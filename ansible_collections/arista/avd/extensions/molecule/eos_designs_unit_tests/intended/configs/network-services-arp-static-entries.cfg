!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-arp-static-entries
!
vlan 10
   name VRF1_VLAN10
!
vlan 20
   name VRF2_VLAN20
!
vlan 30
   name VRF3_VLAN30
!
vlan 40
   name VRF4_VLAN40
!
vrf instance MGMT
!
vrf instance VRF1
!
vrf instance VRF2
!
vrf instance VRF3
!
vrf instance VRF4
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.112/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.112/32
!
interface Vlan10
   description VRF1_VLAN10
   no shutdown
   vrf VRF1
   ip address virtual 10.1.10.1/24
!
interface Vlan20
   description VRF2_VLAN20
   no shutdown
   vrf VRF2
   ip address virtual 10.2.20.1/24
!
interface Vlan30
   description VRF3_VLAN30
   no shutdown
   vrf VRF3
   ip address virtual 10.3.30.1/24
!
interface Vlan40
   description VRF4_VLAN40
   no shutdown
   vrf VRF4
   ip address virtual 192.168.40.1/24
!
interface Vxlan1
   description network-services-arp-static-entries_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vlan 30 vni 10030
   vxlan vlan 40 vni 10040
   vxlan vrf VRF1 vni 1
   vxlan vrf VRF2 vni 2
   vxlan vrf VRF3 vni 3
   vxlan vrf VRF4 vni 4
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF1
ip routing vrf VRF2
ip routing vrf VRF3
ip routing vrf VRF4
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
arp vrf VRF1 10.1.1.1 0000.0000.0001 arpa
arp vrf VRF1 10.1.1.2 0000.0000.0002 arpa
arp vrf VRF2 10.2.1.1 0000.0000.0011 arpa
arp vrf VRF2 10.2.1.2 0000.0000.0012 arpa
arp vrf VRF3 10.3.1.1 0000.0000.0021 arpa
arp vrf VRF3 10.3.1.2 0000.0000.0022 arpa
arp vrf VRF4 192.168.100.1 AAAA.BBBB.CCCC arpa
arp vrf VRF4 192.168.100.2 aaaa.bbbb.cccd arpa
arp vrf VRF4 192.168.100.3 1234.5678.90AB arpa
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 102
   router-id 192.168.255.112
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 192.168.255.112:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 192.168.255.112:10020
      route-target both 10020:10020
      redistribute learned
   !
   vlan 30
      rd 192.168.255.112:10030
      route-target both 10030:10030
      redistribute learned
   !
   vlan 40
      rd 192.168.255.112:10040
      route-target both 10040:10040
      redistribute learned
   !
   vrf VRF1
      rd 192.168.255.112:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      router-id 192.168.255.112
      redistribute connected
   !
   vrf VRF2
      rd 192.168.255.112:2
      route-target import evpn 2:2
      route-target export evpn 2:2
      router-id 192.168.255.112
      redistribute connected
   !
   vrf VRF3
      rd 192.168.255.112:3
      route-target import evpn 3:3
      route-target export evpn 3:3
      router-id 192.168.255.112
      redistribute connected
   !
   vrf VRF4
      rd 192.168.255.112:4
      route-target import evpn 4:4
      route-target export evpn 4:4
      router-id 192.168.255.112
      redistribute connected
!
end
