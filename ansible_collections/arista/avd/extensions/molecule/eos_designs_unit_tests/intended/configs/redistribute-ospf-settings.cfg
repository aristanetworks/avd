!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname redistribute-ospf-settings
!
vlan 201
   name SVI_201
!
vlan 202
   name SVI_202
!
vlan 203
   name SVI_203
!
vlan 204
   name SVI_204
!
vlan 205
   name SVI_205
!
vlan 206
   name SVI_206
!
vlan 208
   name SVI_208
!
vlan 209
   name SVI_209
!
vlan 210
   name SVI_210
!
vrf instance MGMT
!
vrf instance VRF_DEFAULT_LEGACY
!
vrf instance VRF_DEPRECATED_FALSE
!
vrf instance VRF_DEPRECATED_TRUE
!
vrf instance VRF_MATCH_EXTERNAL
!
vrf instance VRF_MATCH_INTERNAL
!
vrf instance VRF_MATCH_NSSA
!
vrf instance VRF_MATCH_ROUTE_MAP
!
vrf instance VRF_REDIST_DISABLED
!
vrf instance VRF_ROUTE_MAP_ONLY
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.99.50/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.143.50/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.42.50/24
!
interface Vlan201
   description SVI_201
   no shutdown
   vrf VRF_MATCH_INTERNAL
   ip address virtual 10.20.1.1/24
!
interface Vlan202
   description SVI_202
   no shutdown
   vrf VRF_MATCH_EXTERNAL
   ip address virtual 10.20.2.1/24
!
interface Vlan203
   description SVI_203
   no shutdown
   vrf VRF_MATCH_NSSA
   ip address virtual 10.20.3.1/24
!
interface Vlan204
   description SVI_204
   no shutdown
   vrf VRF_MATCH_ROUTE_MAP
   ip address virtual 10.20.4.1/24
!
interface Vlan205
   description SVI_205
   no shutdown
   vrf VRF_ROUTE_MAP_ONLY
   ip address virtual 10.20.5.1/24
!
interface Vlan206
   description SVI_206
   no shutdown
   vrf VRF_REDIST_DISABLED
   ip address virtual 10.20.6.1/24
!
interface Vlan208
   description SVI_208
   no shutdown
   vrf VRF_DEFAULT_LEGACY
   ip address virtual 10.20.8.1/24
!
interface Vlan209
   description SVI_209
   no shutdown
   vrf VRF_DEPRECATED_TRUE
   ip address virtual 10.20.9.1/24
!
interface Vlan210
   description SVI_210
   no shutdown
   vrf VRF_DEPRECATED_FALSE
   ip address virtual 10.20.10.1/24
!
interface Vxlan1
   description redistribute-ospf-settings_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 201 vni 10201
   vxlan vlan 202 vni 10202
   vxlan vlan 203 vni 10203
   vxlan vlan 204 vni 10204
   vxlan vlan 205 vni 10205
   vxlan vlan 206 vni 10206
   vxlan vlan 208 vni 10208
   vxlan vlan 209 vni 10209
   vxlan vlan 210 vni 10210
   vxlan vrf VRF_DEFAULT_LEGACY vni 208
   vxlan vrf VRF_DEPRECATED_FALSE vni 210
   vxlan vrf VRF_DEPRECATED_TRUE vni 209
   vxlan vrf VRF_MATCH_EXTERNAL vni 202
   vxlan vrf VRF_MATCH_INTERNAL vni 201
   vxlan vrf VRF_MATCH_NSSA vni 203
   vxlan vrf VRF_MATCH_ROUTE_MAP vni 204
   vxlan vrf VRF_REDIST_DISABLED vni 206
   vxlan vrf VRF_ROUTE_MAP_ONLY vni 205
!
ip virtual-router mac-address 00:11:22:33:44:55
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_DEFAULT_LEGACY
ip routing vrf VRF_DEPRECATED_FALSE
ip routing vrf VRF_DEPRECATED_TRUE
ip routing vrf VRF_MATCH_EXTERNAL
ip routing vrf VRF_MATCH_INTERNAL
ip routing vrf VRF_MATCH_NSSA
ip routing vrf VRF_MATCH_ROUTE_MAP
ip routing vrf VRF_REDIST_DISABLED
ip routing vrf VRF_ROUTE_MAP_ONLY
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.99.0/24 eq 32
   seq 20 permit 192.168.143.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 999
   router-id 192.168.99.50
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 201
      rd 192.168.99.50:10201
      route-target both 10201:10201
      redistribute learned
   !
   vlan 202
      rd 192.168.99.50:10202
      route-target both 10202:10202
      redistribute learned
   !
   vlan 203
      rd 192.168.99.50:10203
      route-target both 10203:10203
      redistribute learned
   !
   vlan 204
      rd 192.168.99.50:10204
      route-target both 10204:10204
      redistribute learned
   !
   vlan 205
      rd 192.168.99.50:10205
      route-target both 10205:10205
      redistribute learned
   !
   vlan 206
      rd 192.168.99.50:10206
      route-target both 10206:10206
      redistribute learned
   !
   vlan 208
      rd 192.168.99.50:10208
      route-target both 10208:10208
      redistribute learned
   !
   vlan 209
      rd 192.168.99.50:10209
      route-target both 10209:10209
      redistribute learned
   !
   vlan 210
      rd 192.168.99.50:10210
      route-target both 10210:10210
      redistribute learned
   !
   vrf VRF_DEFAULT_LEGACY
      rd 192.168.99.50:208
      route-target import evpn 208:208
      route-target export evpn 208:208
      router-id 192.168.99.50
      redistribute connected
      redistribute ospf
   !
   vrf VRF_DEPRECATED_FALSE
      rd 192.168.99.50:210
      route-target import evpn 210:210
      route-target export evpn 210:210
      router-id 192.168.99.50
      redistribute connected
   !
   vrf VRF_DEPRECATED_TRUE
      rd 192.168.99.50:209
      route-target import evpn 209:209
      route-target export evpn 209:209
      router-id 192.168.99.50
      redistribute connected
      redistribute ospf
   !
   vrf VRF_MATCH_EXTERNAL
      rd 192.168.99.50:202
      route-target import evpn 202:202
      route-target export evpn 202:202
      router-id 192.168.99.50
      redistribute connected
      redistribute ospf match external
   !
   vrf VRF_MATCH_INTERNAL
      rd 192.168.99.50:201
      route-target import evpn 201:201
      route-target export evpn 201:201
      router-id 192.168.99.50
      redistribute connected
      redistribute ospf match internal
   !
   vrf VRF_MATCH_NSSA
      rd 192.168.99.50:203
      route-target import evpn 203:203
      route-target export evpn 203:203
      router-id 192.168.99.50
      redistribute connected
      redistribute ospf match nssa-external
   !
   vrf VRF_MATCH_ROUTE_MAP
      rd 192.168.99.50:204
      route-target import evpn 204:204
      route-target export evpn 204:204
      router-id 192.168.99.50
      redistribute connected
      redistribute ospf match internal route-map RM-OSPF-INT
   !
   vrf VRF_REDIST_DISABLED
      rd 192.168.99.50:206
      route-target import evpn 206:206
      route-target export evpn 206:206
      router-id 192.168.99.50
      redistribute connected
   !
   vrf VRF_ROUTE_MAP_ONLY
      rd 192.168.99.50:205
      route-target import evpn 205:205
      route-target export evpn 205:205
      router-id 192.168.99.50
      redistribute connected
      redistribute ospf route-map RM-OSPF-ALL
!
router ospf 201 vrf VRF_MATCH_INTERNAL
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
router ospf 202 vrf VRF_MATCH_EXTERNAL
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
router ospf 203 vrf VRF_MATCH_NSSA
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
router ospf 204 vrf VRF_MATCH_ROUTE_MAP
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
router ospf 205 vrf VRF_ROUTE_MAP_ONLY
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
router ospf 206 vrf VRF_REDIST_DISABLED
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
router ospf 208 vrf VRF_DEFAULT_LEGACY
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
router ospf 209 vrf VRF_DEPRECATED_TRUE
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
router ospf 210 vrf VRF_DEPRECATED_FALSE
   router-id 192.168.99.50
   passive-interface default
   redistribute bgp
!
end
