!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ipv6-acls-l3-interfaces
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Port-Channel1
   description peer1_Port-Channel10
   no shutdown
   no switchport
   ip address 172.22.0.2/30
   ipv6 address 2001:db8:10::2/64
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Port-Channel1 in
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Port-Channel1 out
!
interface Ethernet1
   no shutdown
   no switchport
   ip address 172.16.0.2/30
   ipv6 address 2001:db8:1::2/64
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet1 in
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet1 out
!
interface Ethernet2
   no shutdown
   no switchport
   ip address 172.17.0.2/30
   ipv6 access-group TEST-IPV6-ACL-WITH-NO-FIELDS-IN in
   ipv6 access-group TEST-IPV6-ACL-WITH-NO-FIELDS-OUT out
!
interface Ethernet3
   no shutdown
   no switchport
   ip address 172.18.0.2/30
   ipv6 access-group TEST-IPV6-ACL-WITH-NO-FIELDS-IN in
   ipv6 access-group TEST-IPV6-ACL-WITH-NO-FIELDS-OUT out
!
interface Ethernet4
   no shutdown
   no switchport
   ip address 172.19.0.2/30
   ipv6 address 2001:db8:4::2/64
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet4 in
!
interface Ethernet5/1
   no shutdown
   no switchport
   ip address 172.20.0.2/30
   ipv6 address 2001:db8:5::2/64
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet5_1 out
!
interface Ethernet6/6
   no shutdown
   no switchport
!
interface Ethernet6/6.6
   no shutdown
   encapsulation dot1q vlan 6
   ip address 172.21.0.2/30
   ipv6 address 2001:db8:6::2/64
   ipv6 access-group TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet6_6.6 out
!
interface Ethernet10
   description peer1_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.1.1/32
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet1
   15 deny ipv6 any host 2001:db8:1::2
   permit ipv6 host 172.16.0.1 host 2001:db8:1::2
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Ethernet4
   15 deny ipv6 any host 2001:db8:4::2
   permit ipv6 host 172.19.0.1 host 2001:db8:4::2
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-IN_Port-Channel1
   15 deny ipv6 any host 2001:db8:10::2
   permit ipv6 host 172.22.0.1 host 2001:db8:10::2
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet1
   remark Some remark will not require source and destination fields.
   permit ipv6 host 2001:db8:1::2 any
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet5_1
   remark Some remark will not require source and destination fields.
   permit ipv6 host 2001:db8:5::2 any
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Ethernet6_6.6
   remark Some remark will not require source and destination fields.
   permit ipv6 host 2001:db8:6::2 any
!
ipv6 access-list TEST-IPV6-ACL-WITH-IP-FIELDS-OUT_Port-Channel1
   remark Some remark will not require source and destination fields.
   permit ipv6 host 2001:db8:10::2 any
!
ipv6 access-list TEST-IPV6-ACL-WITH-NO-FIELDS-IN
   permit ipv6 host 2001:db8:ffff::1 any
!
ipv6 access-list TEST-IPV6-ACL-WITH-NO-FIELDS-OUT
   permit ipv6 host 2001:db8:ffff::1 any
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.1.0/24 eq 32
!
ipv6 unicast-routing
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.168.1.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
