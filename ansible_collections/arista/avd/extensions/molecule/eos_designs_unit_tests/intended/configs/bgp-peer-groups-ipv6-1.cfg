!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bgp-peer-groups-ipv6-1
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_bgp-peer-groups-3_Ethernet61
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:a11:beef::d1/127
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ipv6 address 2001:db8:dead:beef::69/128
!
interface Vxlan1
   description bgp-peer-groups-ipv6-1_VTEP
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan encapsulation ipv6
!
ip routing
no ip routing vrf MGMT
!
ip extcommunity-list ECL-EVPN-SOO permit soo 10.255.1.113:1
!
ipv6 prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
   seq 10 permit 2001:db8:dead:beef::/64 eq 128
!
ipv6 unicast-routing
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 30
   match ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
!
route-map RM-EVPN-SOO-IN deny 10
   match extcommunity ECL-EVPN-SOO
!
route-map RM-EVPN-SOO-IN permit 20
!
route-map RM-EVPN-SOO-OUT permit 10
   set extcommunity soo 10.255.1.113:1 additive
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 10.255.1.113
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS remote-as 65001
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPV6-UNDERLAY-PEERS peer group
   neighbor IPV6-UNDERLAY-PEERS bfd
   neighbor IPV6-UNDERLAY-PEERS description Description for ipv4_underlay_peers via structured_config for IPv6 underlay numbered
   neighbor IPV6-UNDERLAY-PEERS send-community
   neighbor IPV6-UNDERLAY-PEERS maximum-routes 256000
   neighbor 2001:db8:a11:beef::d0 peer group IPV6-UNDERLAY-PEERS
   neighbor 2001:db8:a11:beef::d0 remote-as 65001
   neighbor 2001:db8:a11:beef::d0 description bgp-peer-groups-3_Ethernet61
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor EVPN-OVERLAY-PEERS route-map RM-EVPN-SOO-IN in
      neighbor EVPN-OVERLAY-PEERS route-map RM-EVPN-SOO-OUT out
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv6
      neighbor IPV6-UNDERLAY-PEERS activate
!
end
