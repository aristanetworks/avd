!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname routed-endpoints-leaf2
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_routed-endpoints-spine1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.200.0.5/31
!
interface Ethernet10
   description SERVER_ROUTED_SERVER_nic6
   no shutdown
   no switchport
   ip address 10.30.2.0/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.200.5/32
!
ip routing
no ip routing vrf MGMT
!
router bgp 65102
   router-id 192.168.200.5
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.200.0.4 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.200.0.4 remote-as 65100
   neighbor 10.200.0.4 description routed-endpoints-spine1_Ethernet3
   redistribute connected
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
