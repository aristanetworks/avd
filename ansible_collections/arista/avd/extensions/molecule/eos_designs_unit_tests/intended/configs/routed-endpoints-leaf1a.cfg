!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname routed-endpoints-leaf1a
!
no spanning-tree vlan-id 4093-4094
!
vlan 10
   name VLAN10
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
interface Port-Channel3
   description MLAG_routed-endpoints-leaf1b_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description P2P_routed-endpoints-spine1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.200.0.1/31
!
interface Ethernet3
   description MLAG_routed-endpoints-leaf1b_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_routed-endpoints-leaf1b_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Ethernet10
   description FIREWALL_FW01_eth1
   no shutdown
   no switchport
   ip address 10.30.0.0/31
!
interface Ethernet11
   description SERVER_ROUTED_SERVER_nic1
   no shutdown
   mtu 9214
   speed forced 100gfull
   no switchport
   ip address 10.30.1.0/31
!
interface Ethernet12
   description SERVER_ROUTED_SERVER_nic2
   no shutdown
   no switchport
   ip address 10.30.1.2/31
!
interface Ethernet13
   description SERVER_ROUTED_SERVER_nic3
   no shutdown
   mtu 9214
   speed forced 100gfull
   switchport mode access
   switchport
!
interface Ethernet20
   description GPU_SERVERS
   no shutdown
   mtu 9214
   speed forced 100gfull
   no switchport
   ip address 10.40.0.0/31
!
interface Ethernet21
   description GPU_SERVERS
   no shutdown
   mtu 9214
   speed forced 100gfull
   no switchport
   ip address 10.40.0.2/31
!
interface Ethernet30
   description SERVER_ROUTED_SERVER_nic4
   no shutdown
   mtu 9214
   speed forced 100gfull
   no switchport
   ip address 10.30.1.4/31
!
interface Ethernet31
   no shutdown
   switchport access vlan 10
   switchport mode access
   switchport
!
interface Ethernet32
   no shutdown
   switchport access vlan 10
   switchport mode access
   switchport
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.200.3/32
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.200.2.0/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.200.1.0/31
!
ip routing
no ip routing vrf MGMT
!
mlag configuration
   domain-id routed-endpoints-leaf1
   local-interface Vlan4094
   peer-address 10.200.1.1
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bgp 65101
   router-id 192.168.200.3
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description routed-endpoints-leaf1b
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.200.0.0 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.200.0.0 remote-as 65100
   neighbor 10.200.0.0 description routed-endpoints-spine1_Ethernet1
   neighbor 10.200.2.1 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.200.2.1 description routed-endpoints-leaf1b_Vlan4093
   redistribute connected
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
!
end
