!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname underlay-ibgp-ssp2
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_underlay-ibgp-pod1-spine1_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Ethernet2
   description P2P_underlay-ibgp-pod1-spine2_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Ethernet3
   description P2P_underlay-ibgp-pod2-spine1_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Ethernet4
   description P2P_underlay-ibgp-pod2-spine2_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.254.0.1/32
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
!
ipv6 unicast-routing
!
router bgp 65000
   router-id 10.254.0.1
   update wait-install
   no bgp default ipv4-unicast
   bgp cluster-id 10.255.0.1
   maximum-paths 128 ecmp 128
   neighbor RR-CLIENTS-UNDERLAY-PEERS peer group
   neighbor RR-CLIENTS-UNDERLAY-PEERS next-hop-self
   neighbor RR-CLIENTS-UNDERLAY-PEERS bfd
   neighbor RR-CLIENTS-UNDERLAY-PEERS route-reflector-client
   neighbor RR-CLIENTS-UNDERLAY-PEERS password 7 oU8X5y3u4epoPjIAyBowQg==
   neighbor RR-CLIENTS-UNDERLAY-PEERS send-community
   neighbor RR-CLIENTS-UNDERLAY-PEERS maximum-routes 0
   redistribute connected
   neighbor interface Ethernet1 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000
   neighbor interface Ethernet2 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000
   neighbor interface Ethernet3 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000
   neighbor interface Ethernet4 peer-group RR-CLIENTS-UNDERLAY-PEERS remote-as 65000
   !
   address-family ipv4
      neighbor RR-CLIENTS-UNDERLAY-PEERS activate
      neighbor RR-CLIENTS-UNDERLAY-PEERS next-hop address-family ipv6 originate
!
end
