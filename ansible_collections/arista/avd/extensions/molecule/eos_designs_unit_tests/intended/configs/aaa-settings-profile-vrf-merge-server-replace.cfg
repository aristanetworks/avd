!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname aaa-settings-profile-vrf-merge-server-replace
!
vrf instance MGMT
!
radius-server host 198.51.100.22 vrf GLOBAL_RADIUS key 7 071B245F5A
radius-server host 198.51.100.23 vrf PARENT_RADIUS key 7 071B245F5A
radius-server host 198.51.100.24 vrf SHARED_RADIUS key 7 071B245F5A
!
aaa group server radius CHILD_RADIUS_GLOBAL_VRF
   server 198.51.100.22 vrf GLOBAL_RADIUS
!
aaa group server radius CHILD_RADIUS_PARENT_VRF
   server 198.51.100.23 vrf PARENT_RADIUS
!
aaa group server radius CHILD_RADIUS_SHARED_VRF
   server 198.51.100.24 vrf SHARED_RADIUS
!
tacacs-server host 198.51.100.12 vrf GLOBAL_TACACS key 7 071B245F5A
tacacs-server host 198.51.100.13 vrf PARENT_TACACS key 7 071B245F5A
tacacs-server host 198.51.100.14 vrf SHARED_TACACS key 7 071B245F5A
!
aaa group server tacacs+ CHILD_TACACS_GLOBAL_VRF
   server 198.51.100.12 vrf GLOBAL_TACACS
!
aaa group server tacacs+ CHILD_TACACS_PARENT_VRF
   server 198.51.100.13 vrf PARENT_TACACS
!
aaa group server tacacs+ CHILD_TACACS_SHARED_VRF
   server 198.51.100.14 vrf SHARED_TACACS
no ip routing vrf MGMT
!
ip radius vrf GLOBAL_RADIUS source-interface Loopback1
!
ip radius vrf PARENT_RADIUS source-interface Loopback3
!
ip radius vrf SHARED_RADIUS source-interface Loopback9
!
ip tacacs vrf GLOBAL_TACACS source-interface Loopback0
!
ip tacacs vrf PARENT_TACACS source-interface Loopback2
!
ip tacacs vrf SHARED_TACACS source-interface Loopback6
!
end
