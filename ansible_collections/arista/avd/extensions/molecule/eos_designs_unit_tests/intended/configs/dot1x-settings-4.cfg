!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dot1x-settings-4
!
vrf instance MGMT
!
radius-server host agni.arista.com vrf MGMT key 7 1404071B09166738212B2130365E0C131A
!
aaa group server radius agni-server-group
   server agni.arista.com vrf MGMT
!
aaa authentication dot1x default group agni-server-group group radius
aaa accounting dot1x default start-stop group agni-server-group group radius
dot1x
   radius av-pair lldp system-name
   radius av-pair lldp system-description
   radius av-pair dhcp hostname
   radius av-pair dhcp vendor-class-id auth-only
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
no ip routing vrf MGMT
!
ip radius vrf MGMT source-interface Management1
!
dot1x system-auth-control
dot1x protocol lldp bypass
dot1x protocol bpdu bypass
dot1x dynamic-authorization
!
end
