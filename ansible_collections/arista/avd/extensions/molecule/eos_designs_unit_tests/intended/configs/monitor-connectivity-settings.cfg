!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname monitor-connectivity-settings
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.159/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.159/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 1.1.10.51
!
interface Vxlan1
   description monitor-connectivity-settings_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
!
monitor connectivity
   interval 5
   no shutdown
   interface set SET_INTERNET Ethernet1-2
   interface set SET_INTERNET_1 Ethernet3-4
   interface set SET_INTERNET_2 Ethernet5-6
   interface set SET_LOOPBACK0 Loopback0
   local-interfaces SET_LOOPBACK0 address-only default
   !
   host DNS1
      description
      Primary DNS Server
      local-interfaces SET_INTERNET
      ip 8.8.8.8
      icmp echo size 100
      url http://www.dummy.com
   !
   host DNS2
      description
      Secondary DNS Server
      local-interfaces SET_INTERNET_1
      ip 1.1.1.1
      icmp echo size 100
   !
   host DNS3
      description
      Tertiory DNS Server
      local-interfaces SET_INTERNET_2 address-only
      ip 1.1.1.2
   !
   vrf MGMT
      interface set SET_MGMT Management1
      interface set SET_MGMT_1 Loopback100
      interface set SET_MGMT_2 Loopback101
      description
      Management VRF monitoring
      !
      host MGMT_SERVER
         description
         Management server
         local-interfaces SET_MGMT
         ip 10.0.0.1
      !
      host MGMT_SERVER_1
         description
         Management server 1
         local-interfaces SET_MGMT_1 address-only
         ip 10.0.0.2
      !
      host MGMT_SERVER_2
         description
         Management server 2
         local-interfaces SET_MGMT_2
         ip 10.0.0.3
   !
   vrf MGMT_1
      interface set SET_MGMT_1 Loopback200
      interface set SET_MGMT_2 Loopback201
      interface set SET_MGMT_3 Loopback202
      interface set Vrf_Set_MGMT Management1
      description
      Management VRF monitoring 1
      local-interfaces Vrf_Set_MGMT address-only default
      !
      host MGMT_SERVER_1
         description
         Management server 1
         local-interfaces SET_MGMT_1
         ip 11.0.0.1
      !
      host MGMT_SERVER_2
         description
         Management server 2
         local-interfaces SET_MGMT_2 address-only
         ip 11.0.0.2
      !
      host MGMT_SERVER_3
         description
         Management server 3
         local-interfaces SET_MGMT_3
         ip 11.0.0.3
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 151
   router-id 192.168.255.159
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
