!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname filter.vrfs
!
vrf instance MGMT
!
vrf instance VRF2
   description This VRF is attracted by Loopback and will be configured because it is permitted by filter.allow_vrfs
!
vrf instance VRF5
   description This VRF will be configured because of always_include_vrfs_in_tenants and it is permitted by filter.allow_vrfs
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.0.0.1/32
!
interface Loopback2
   no shutdown
   vrf VRF2
   ip address 192.168.1.1/32
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF2
ip routing vrf VRF5
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.0.0.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 10.0.0.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
