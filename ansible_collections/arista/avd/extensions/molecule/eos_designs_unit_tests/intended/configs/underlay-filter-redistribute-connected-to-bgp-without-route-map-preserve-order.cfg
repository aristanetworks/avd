!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname underlay-filter-redistribute-connected-to-bgp-without-route-map-preserve-order
!
vlan 111
   name svi_with_default_vrf
!
vlan 112
   name svi_with_default_vrf_2
!
vlan 113
   name svi_with_default_vrf_3
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.0.4/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.11.0.4/32
!
interface Vlan111
   description svi_with_default_vrf
   shutdown
   ip address 10.10.10.111/24
!
interface Vlan112
   description svi_with_default_vrf_2
   shutdown
   ip address 10.10.30.111/24
!
interface Vlan113
   description svi_with_default_vrf_3
   shutdown
   ip address 10.10.20.111/24
!
interface Vxlan1
   description underlay-filter-redistribute-connected-to-bgp-without-route-map-preserve-order_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 111 vni 10111
   vxlan vlan 112 vni 10112
   vxlan vlan 113 vni 10113
   vxlan vrf default vni 111
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-SVI-VRF-DEFAULT
   seq 10 permit 10.10.10.0/24
   seq 20 permit 10.10.30.0/24
   seq 30 permit 10.10.20.0/24
!
route-map RM-EVPN-EXPORT-VRF-DEFAULT permit 10
   match ip address prefix-list PL-SVI-VRF-DEFAULT
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.10.0.4
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected
   !
   vlan 111
      rd 10.10.0.4:10111
      route-target both 10111:10111
      redistribute learned
   !
   vlan 112
      rd 10.10.0.4:10112
      route-target both 10112:10112
      redistribute learned
   !
   vlan 113
      rd 10.10.0.4:10113
      route-target both 10113:10113
      redistribute learned
   !
   vrf default
      rd 10.10.0.4:111
      route-target import evpn 111:111
      route-target export evpn 111:111
      route-target export evpn route-map RM-EVPN-EXPORT-VRF-DEFAULT
!
end
