!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname svi-ipv4-acls
!
vlan 611
   name standard_acl_ingress
!
vlan 612
   name standard_acl_egress
!
vlan 613
   name standard_acl_both
!
vlan 614
   name standard_acl_profile
!
vlan 615
   name standard_acl_parent_profile
!
vlan 616
   name standard_acl_child_override
!
vlan 617
   name standard_in_extended_out
!
vlan 618
   name extended_in_standard_out
!
vlan 619
   name standard_acl_svi_override
!
vlan 620
   name standard_acl_profile_node_override
!
vlan 621
   name standard_acl_svi_node_override
!
vrf instance MGMT
!
vrf instance SVI_ACL_TESTS
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.1/32
!
interface Vlan611
   description standard_acl_ingress
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-IN in
   ip address virtual 10.6.11.1/24
!
interface Vlan612
   description standard_acl_egress
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-OUT out
   ip address virtual 10.6.12.1/24
!
interface Vlan613
   description standard_acl_both
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-IN in
   ip access-group SVI-STANDARD-OUT out
   ip address virtual 10.6.13.1/24
!
interface Vlan614
   description standard_acl_profile
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-IN in
   ip access-group SVI-STANDARD-OUT out
   ip address virtual 10.6.14.1/24
!
interface Vlan615
   description standard_acl_parent_profile
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-IN in
   ip access-group SVI-STANDARD-OUT out
   ip address virtual 10.6.15.1/24
!
interface Vlan616
   description standard_acl_child_override
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-OUT in
   ip access-group SVI-STANDARD-IN out
   ip address virtual 10.6.16.1/24
!
interface Vlan617
   description standard_in_extended_out
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-IN in
   ip access-group SVI-EXTENDED_Vlan617 out
   ip address virtual 10.6.17.1/24
!
interface Vlan618
   description extended_in_standard_out
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-EXTENDED_Vlan618 in
   ip access-group SVI-STANDARD-OUT out
   ip address virtual 10.6.18.1/24
!
interface Vlan619
   description standard_acl_svi_override
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-OUT in
   ip access-group SVI-STANDARD-IN out
   ip address virtual 10.6.19.1/24
!
interface Vlan620
   description standard_acl_profile_node_override
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-OUT in
   ip access-group SVI-STANDARD-IN out
   ip address virtual 10.6.20.1/24
!
interface Vlan621
   description standard_acl_svi_node_override
   no shutdown
   vrf SVI_ACL_TESTS
   ip access-group SVI-STANDARD-IN in
   ip access-group SVI-STANDARD-OUT out
   ip address virtual 10.6.21.1/24
!
interface Vxlan1
   description svi-ipv4-acls_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 611 vni 10611
   vxlan vlan 612 vni 10612
   vxlan vlan 613 vni 10613
   vxlan vlan 614 vni 10614
   vxlan vlan 615 vni 10615
   vxlan vlan 616 vni 10616
   vxlan vlan 617 vni 10617
   vxlan vlan 618 vni 10618
   vxlan vlan 619 vni 10619
   vxlan vlan 620 vni 10620
   vxlan vlan 621 vni 10621
   vxlan vrf SVI_ACL_TESTS vni 1
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip access-list SVI-EXTENDED_Vlan617
   permit ip any host 10.6.17.1
!
ip access-list SVI-EXTENDED_Vlan618
   permit ip any host 10.6.18.1
!
ip access-list standard SVI-STANDARD-IN
   10 permit 10.0.0.0/8
!
ip access-list standard SVI-STANDARD-OUT
   10 permit 172.16.0.0/12
!
ip routing
no ip routing vrf MGMT
ip routing vrf SVI_ACL_TESTS
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.168.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 611
      rd 192.168.255.1:10611
      route-target both 10611:10611
      redistribute learned
   !
   vlan 612
      rd 192.168.255.1:10612
      route-target both 10612:10612
      redistribute learned
   !
   vlan 613
      rd 192.168.255.1:10613
      route-target both 10613:10613
      redistribute learned
   !
   vlan 614
      rd 192.168.255.1:10614
      route-target both 10614:10614
      redistribute learned
   !
   vlan 615
      rd 192.168.255.1:10615
      route-target both 10615:10615
      redistribute learned
   !
   vlan 616
      rd 192.168.255.1:10616
      route-target both 10616:10616
      redistribute learned
   !
   vlan 617
      rd 192.168.255.1:10617
      route-target both 10617:10617
      redistribute learned
   !
   vlan 618
      rd 192.168.255.1:10618
      route-target both 10618:10618
      redistribute learned
   !
   vlan 619
      rd 192.168.255.1:10619
      route-target both 10619:10619
      redistribute learned
   !
   vlan 620
      rd 192.168.255.1:10620
      route-target both 10620:10620
      redistribute learned
   !
   vlan 621
      rd 192.168.255.1:10621
      route-target both 10621:10621
      redistribute learned
   !
   vrf SVI_ACL_TESTS
      rd 192.168.255.1:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      router-id 192.168.255.1
      redistribute connected
!
end
