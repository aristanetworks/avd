!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ospfv3-evpn
!
vlan 110
   name MINIMAL
!
vlan 111
   name AREA_INTEGER
!
vlan 112
   name AREA_DOTTED_P2P
!
vlan 113
   name PASSIVE
!
vlan 114
   name LINK_LOCAL_ONLY
!
vlan 115
   name VARPV6
!
vlan 116
   name DUAL_STACK_IPV4_OPT_OUT
!
vlan 117
   name NO_OSPFV3_VXLAN
!
vlan 118
   name PROFILE
!
vlan 119
   name PARENT_PROFILE
!
vlan 120
   name NODE_ENABLED
!
vlan 121
   name NODE_DISABLED
!
vlan 122
   name SVI_STRUCTURED_CONFIG
!
vlan 123
   name LINK_LOCAL_VARPV6
!
vlan 124
   name IPV4_ONLY_IPV4_AF_FALSE
!
vlan 211
   name VRF_B_TRANSIT
!
vlan 212
   name VRF_C_TRANSIT
!
vlan 213
   name VRF_D_TRANSIT
!
vlan 214
   name VRF_DUAL_STACK_1_TRANSIT
!
vlan 215
   name VRF_DUAL_STACK_2_TRANSIT
!
vlan 216
   name VRF_NO_BGP_TRANSIT
!
vlan 217
   name VRF_SHARED_TENANT_A
!
vlan 218
   name VRF_SHARED_TENANT_B
!
vlan 219
   name VRF_LINK_LOCAL_TRANSIT
!
vrf instance MGMT
!
vrf instance VRF_A
!
vrf instance VRF_B
!
vrf instance VRF_C
!
vrf instance VRF_D
!
vrf instance VRF_DUAL_STACK_1
!
vrf instance VRF_DUAL_STACK_2
!
vrf instance VRF_LINK_LOCAL
!
vrf instance VRF_NO_BGP
!
vrf instance VRF_SHARED
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.1/32
!
interface Loopback12
   description DIAG_VRF_VRF_C
   no shutdown
   vrf VRF_C
   ip address 10.255.12.1/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.200.101/24
!
interface Vlan110
   description MINIMAL
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:110::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan111
   description AREA_INTEGER
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:111::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 10
!
interface Vlan112
   description AREA_DOTTED_P2P
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:112::1/64
   no ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv6 area 0.0.0.10
!
interface Vlan113
   description PASSIVE
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:113::1/64
   ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan114
   description LINK_LOCAL_ONLY
   no shutdown
   vrf VRF_A
   ipv6 enable
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan115
   description VARPV6
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:115::2/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
   ipv6 virtual-router address 2001:db8:115::1
!
interface Vlan116
   description DUAL_STACK_IPV4_OPT_OUT
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:116::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
   ip address virtual 10.1.116.1/24
!
interface Vlan117
   description NO_OSPFV3_VXLAN
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:117::1/64
!
interface Vlan118
   description PROFILE
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:118::1/64
   no ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan119
   description PARENT_PROFILE
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:119::1/64
   ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.20
!
interface Vlan120
   description NODE_ENABLED
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:120::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan121
   description NODE_DISABLED
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:121::1/64
!
interface Vlan122
   description SVI_STRUCTURED_CONFIG
   no shutdown
   vrf VRF_A
   ipv6 address 2001:db8:122::1/64
   no ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv6 area 0.0.0.99
!
interface Vlan123
   description LINK_LOCAL_VARPV6
   no shutdown
   vrf VRF_A
   ipv6 enable
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
   ipv6 virtual-router address 2001:db8:123::1
!
interface Vlan124
   description IPV4_ONLY_IPV4_AF_FALSE
   no shutdown
   vrf VRF_A
   ip address 10.1.124.1/24
   ipv6 enable
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan211
   description VRF_B_TRANSIT
   no shutdown
   vrf VRF_B
   ipv6 address 2001:db8:211::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan212
   description VRF_C_TRANSIT
   no shutdown
   vrf VRF_C
   ipv6 address 2001:db8:212::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan213
   description VRF_D_TRANSIT
   no shutdown
   vrf VRF_D
   ipv6 address 2001:db8:213::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan214
   description VRF_DUAL_STACK_1_TRANSIT
   no shutdown
   vrf VRF_DUAL_STACK_1
   ip address 10.1.214.1/24
   ipv6 address 2001:db8:214::1/64
   ip ospf area 0.0.0.0
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan215
   description VRF_DUAL_STACK_2_TRANSIT
   no shutdown
   vrf VRF_DUAL_STACK_2
   ip address 10.1.215.1/24
   ipv6 address 2001:db8:215::1/64
   ip ospf area 0.0.0.0
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan216
   description VRF_NO_BGP_TRANSIT
   no shutdown
   vrf VRF_NO_BGP
   ipv6 address 2001:db8:216::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan217
   description VRF_SHARED_TENANT_A
   no shutdown
   vrf VRF_SHARED
   ipv6 address 2001:db8:217::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan218
   description VRF_SHARED_TENANT_B
   no shutdown
   vrf VRF_SHARED
   ipv6 address 2001:db8:218::1/64
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan219
   description VRF_LINK_LOCAL_TRANSIT
   no shutdown
   vrf VRF_LINK_LOCAL
   ipv6 enable
   no ospfv3 passive-interface
   ospfv3 ipv6 area 0.0.0.0
!
interface Vxlan1
   description network-services-ospfv3-evpn_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 117 vni 10117
   vxlan vrf VRF_A vni 10
   vxlan vrf VRF_B vni 11
   vxlan vrf VRF_C vni 12
   vxlan vrf VRF_D vni 13
   vxlan vrf VRF_DUAL_STACK_1 vni 14
   vxlan vrf VRF_DUAL_STACK_2 vni 15
   vxlan vrf VRF_LINK_LOCAL vni 18
   vxlan vrf VRF_NO_BGP vni 16
   vxlan vrf VRF_SHARED vni 17
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip address virtual source-nat vrf VRF_C address 10.255.12.1
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_A
ip routing vrf VRF_B
ip routing vrf VRF_C
ip routing vrf VRF_D
ip routing vrf VRF_DUAL_STACK_1
ip routing vrf VRF_DUAL_STACK_2
ip routing vrf VRF_LINK_LOCAL
ip routing vrf VRF_NO_BGP
ip routing vrf VRF_SHARED
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
ipv6 unicast-routing vrf VRF_A
ipv6 unicast-routing vrf VRF_B
ipv6 unicast-routing vrf VRF_C
ipv6 unicast-routing vrf VRF_D
ipv6 unicast-routing vrf VRF_DUAL_STACK_1
ipv6 unicast-routing vrf VRF_DUAL_STACK_2
ipv6 unicast-routing vrf VRF_LINK_LOCAL
ipv6 unicast-routing vrf VRF_NO_BGP
ipv6 unicast-routing vrf VRF_SHARED
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 192.168.255.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 117
      rd 192.168.255.1:10117
      route-target both 10117:10117
      redistribute learned
   !
   vrf VRF_A
      rd 192.168.255.1:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 192.168.255.1
      redistribute connected
      redistribute ospfv3
   !
   vrf VRF_B
      rd 192.168.255.1:11
      route-target import evpn 11:11
      route-target export evpn 11:11
      router-id 192.168.255.1
      redistribute connected
      redistribute ospfv3
   !
   vrf VRF_C
      rd 192.168.255.1:12
      route-target import evpn 12:12
      route-target export evpn 12:12
      router-id 192.168.255.1
      redistribute connected
   !
   vrf VRF_D
      rd 192.168.255.1:13
      route-target import evpn 13:13
      route-target export evpn 13:13
      router-id 192.168.255.1
      redistribute connected
      redistribute ospfv3
      redistribute ospfv3 match external
   !
   vrf VRF_DUAL_STACK_1
      rd 192.168.255.1:14
      route-target import evpn 14:14
      route-target export evpn 14:14
      router-id 192.168.255.1
      redistribute connected
      redistribute ospfv3
   !
   vrf VRF_DUAL_STACK_2
      rd 192.168.255.1:15
      route-target import evpn 15:15
      route-target export evpn 15:15
      router-id 192.168.255.1
      redistribute connected
      redistribute ospf
   !
   vrf VRF_LINK_LOCAL
      rd 192.168.255.1:18
      route-target import evpn 18:18
      route-target export evpn 18:18
      router-id 192.168.255.1
      redistribute connected
      redistribute ospfv3
   !
   vrf VRF_SHARED
      rd 192.168.255.1:17
      route-target import evpn 17:17
      route-target export evpn 17:17
      router-id 192.168.255.1
      redistribute connected
      redistribute ospfv3
!
router ospf 14 vrf VRF_DUAL_STACK_1
   router-id 192.168.255.1
   passive-interface default
   no passive-interface Vlan214
   redistribute bgp
!
router ospf 15 vrf VRF_DUAL_STACK_2
   router-id 192.168.255.1
   passive-interface default
   no passive-interface Vlan215
   redistribute bgp
!
router ospfv3 vrf VRF_A
   router-id 192.168.255.1
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
router ospfv3 vrf VRF_B
   router-id 10.255.11.1
   auto-cost reference-bandwidth 100000
   passive-interface default
   log-adjacency-changes detail
   !
   address-family ipv6
      redistribute bgp
      redistribute connected
!
router ospfv3 vrf VRF_C
   router-id 10.255.12.1
   passive-interface default
   !
   address-family ipv6
!
router ospfv3 vrf VRF_D
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
router ospfv3 vrf VRF_DUAL_STACK_1
   router-id 192.168.255.1
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
router ospfv3 vrf VRF_DUAL_STACK_2
   router-id 192.168.255.1
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
router ospfv3 vrf VRF_LINK_LOCAL
   router-id 192.168.255.1
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
router ospfv3 vrf VRF_NO_BGP
   router-id 192.168.255.1
   passive-interface default
   !
   address-family ipv6
!
router ospfv3 vrf VRF_SHARED
   router-id 10.255.17.1
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
!
end
