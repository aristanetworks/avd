!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname combine-same-vrf-in-different-tenants
!
vlan 100
   name VLAN100
!
vlan 101
   name VLAN101
!
vlan 102
   name VLAN102
!
vrf instance MGMT
!
vrf instance SHARED_VRF
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.201/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.201/32
!
interface Vlan100
   description VLAN100
   no shutdown
   vrf SHARED_VRF
   ip address virtual 10.100.100.1/24
!
interface Vlan101
   description VLAN101
   no shutdown
   vrf SHARED_VRF
   ip address virtual 10.100.101.1/24
!
interface Vlan102
   description VLAN102
   no shutdown
   vrf SHARED_VRF
   ip address virtual 10.100.102.1/24
!
interface Vxlan1
   description combine-same-vrf-in-different-tenants_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 20100
   vxlan vlan 101 vni 20101
   vxlan vlan 102 vni 20102
   vxlan vrf SHARED_VRF vni 200
!
ip virtual-router mac-address 00:dc:00:00:00:0b
!
ip routing
no ip routing vrf MGMT
ip routing vrf SHARED_VRF
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65201
   router-id 192.168.255.201
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 192.168.255.201:20100
      route-target both 20100:20100
      redistribute learned
   !
   vlan 101
      rd 192.168.255.201:20101
      route-target both 20101:20101
      redistribute learned
   !
   vlan 102
      rd 192.168.255.201:20102
      route-target both 20102:20102
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
   !
   vrf SHARED_VRF
      rd 192.168.255.201:200
      route-target import evpn 200:200
      route-target export evpn 200:200
      router-id 192.168.255.201
      redistribute connected
!
end
