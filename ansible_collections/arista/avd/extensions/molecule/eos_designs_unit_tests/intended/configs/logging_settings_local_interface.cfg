!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
logging vrf MGMT host 30.30.30.7 100 200 protocol tcp
logging host 192.168.0.42
logging vrf MGMT local-interface Management0
logging local-interface Ethernet42
!
hostname logging_settings_local_interface
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 1.2.3.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.66.23/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 1.2.3.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 1.2.3.2
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
!
end
