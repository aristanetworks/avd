!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ip-helpers-leaf3
!
spanning-tree mode none
!
vlan 11
   name SVI2
!
vlan 100
   name INBAND_MGMT
!
vrf instance INBANDMGMT
!
vrf instance IP_HELPERS3
!
vrf instance MGMT
!
interface Port-Channel1
   description L2_network-services-ip-helpers-l2leaf_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 11,100
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_network-services-ip-helpers-l2leaf_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_network-services-ip-helpers-l2leaf_Ethernet2
   no shutdown
   channel-group 1 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.0.255.11/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.2.11/32
!
interface Vlan11
   description SVI2
   shutdown
   vrf IP_HELPERS3
   ip helper-address 1.1.1.4 vrf INBANDMGMT source-interface vlan100
   ip helper-address 1.1.1.5 vrf INBANDMGMT source-interface vlan100
!
interface Vlan100
   description Inband Management
   no shutdown
   mtu 1500
   vrf INBANDMGMT
   ip address 192.168.101.2/24
   ip attached-host route export 19
   ip virtual-router address 192.168.101.1
!
interface Vxlan1
   description network-services-ip-helpers-leaf3_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 11 vni 1011
   vxlan vrf IP_HELPERS3 vni 102
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
ip routing vrf IP_HELPERS3
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.0.255.0/24 eq 32
   seq 20 permit 10.255.2.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 192.0.255.11
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 11
      rd 192.0.255.11:1011
      route-target both 1011:1011
      redistribute learned
   !
   vrf IP_HELPERS3
      rd 192.0.255.11:102
      route-target import evpn 102:102
      route-target export evpn 102:102
      router-id 192.0.255.11
      redistribute connected
!
end
