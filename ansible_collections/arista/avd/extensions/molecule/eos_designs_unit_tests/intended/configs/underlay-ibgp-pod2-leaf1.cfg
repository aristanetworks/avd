!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname underlay-ibgp-pod2-leaf1
!
vrf instance MGMT
!
interface Ethernet1
   description P2P_underlay-ibgp-pod2-spine1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Ethernet2
   description P2P_underlay-ibgp-pod2-spine2_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ipv6 enable
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.254.12.1/32
!
ip routing ipv6 interfaces
no ip routing vrf MGMT
!
ipv6 unicast-routing
!
router bgp 65000
   router-id 10.254.12.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 128 ecmp 128
   neighbor RR-UPLINK-PEERS peer group
   neighbor RR-UPLINK-PEERS next-hop-self
   neighbor RR-UPLINK-PEERS bfd
   neighbor RR-UPLINK-PEERS description Towards uplink route reflectors
   neighbor RR-UPLINK-PEERS password 7 DXSzy3wx6R+lZX+VX+pgMw==
   neighbor RR-UPLINK-PEERS send-community
   neighbor RR-UPLINK-PEERS maximum-routes 256000
   redistribute connected
   neighbor interface Ethernet1 peer-group RR-UPLINK-PEERS remote-as 65000
   neighbor interface Ethernet2 peer-group RR-UPLINK-PEERS remote-as 65000
   !
   address-family ipv4
      neighbor RR-UPLINK-PEERS activate
      neighbor RR-UPLINK-PEERS next-hop address-family ipv6 originate
!
end
