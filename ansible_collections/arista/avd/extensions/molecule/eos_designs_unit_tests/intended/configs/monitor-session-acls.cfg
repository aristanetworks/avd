!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname monitor-session-acls
!
vrf instance MGMT
!
interface Ethernet1
   no shutdown
   switchport
!
interface Ethernet2
   no shutdown
   switchport
!
interface Ethernet3
   no shutdown
   switchport
!
interface Ethernet4
   no shutdown
   switchport
!
interface Ethernet5
   no shutdown
   switchport
!
interface Ethernet6
   no shutdown
   switchport
!
interface Ethernet7
   no shutdown
   switchport
!
interface Ethernet8
   no shutdown
   switchport
!
interface Ethernet9
   no shutdown
   switchport
!
interface Ethernet10
   no shutdown
   switchport
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.2/24
!
ipv6 access-list MONITOR-IPV6
   10 permit ipv6 2001:db8::/64 any
!
ip access-list MONITOR-IPV4
   10 permit ip 192.0.2.0/24 any
!
ip access-list standard MONITOR-IPV4-STANDARD
   10 permit 198.51.100.0/24
no ip routing vrf MGMT
!
mac access-list MONITOR-MAC
   10 permit any any
!
monitor session IPV4-SESSION ip access-group MONITOR-IPV4
monitor session IPV4-SESSION source Ethernet4
monitor session IPV4-SESSION destination Ethernet6
monitor session IPV4-SOURCE source Ethernet1 rx ip access-group MONITOR-IPV4 priority 5
monitor session IPV4-SOURCE source Ethernet2 rx ip access-group MONITOR-IPV4 priority 5
monitor session IPV4-SOURCE destination Ethernet6
monitor session IPV4-STANDARD-SESSION ip access-group MONITOR-IPV4-STANDARD
monitor session IPV4-STANDARD-SESSION source Ethernet5
monitor session IPV4-STANDARD-SESSION destination Ethernet6
monitor session IPV4-STANDARD-SOURCE source Ethernet3 tx ip access-group MONITOR-IPV4-STANDARD priority 10
monitor session IPV4-STANDARD-SOURCE destination Ethernet6
monitor session IPV6-SESSION ipv6 access-group MONITOR-IPV6
monitor session IPV6-SESSION source Ethernet8
monitor session IPV6-SESSION destination Ethernet6
monitor session IPV6-SOURCE source Ethernet7 rx ipv6 access-group MONITOR-IPV6 priority 15
monitor session IPV6-SOURCE destination Ethernet6
monitor session MAC-SESSION mac access-group MONITOR-MAC
monitor session MAC-SESSION source Ethernet10
monitor session MAC-SESSION destination Ethernet6
monitor session MAC-SOURCE source Ethernet9 rx mac access-group MONITOR-MAC priority 20
monitor session MAC-SOURCE destination Ethernet6
!
end
