!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ospf-v3
!
vlan 201
   name Tenant_OSPFv3_Redistribute_201
!
vlan 202
   name Tenant_OSPFv3_Redistribute_Route_Map_202
!
vlan 203
   name Tenant_OSPFv3_Redistribute_IPv4_203
!
vlan 206
   name Tenant_OSPFv3_Redistribute_IPv6_206
!
vlan 207
   name Tenant_OSPFv3_Structured_Config_206
!
vrf instance MGMT
!
vrf instance Tenant_OSPFv3_Redistribute_IPv4
!
vrf instance Tenant_OSPFv3_Redistribute_IPv6
!
vrf instance Tenant_OSPFv3_Redistribute_Route_Map_VRF
!
vrf instance Tenant_OSPFv3_Redistribute_VRF
!
vrf instance Tenant_OSPFv3_Structured_Config_VRF
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.66.142/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.142.142/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.42.142/24
!
interface Vlan201
   description Tenant_OSPFv3_Redistribute_201 description
   no shutdown
   vrf Tenant_OSPFv3_Redistribute_VRF
   ip address 10.201.1.1/24
   ipv6 enable
   ipv6 address cafe::cafe/64
   ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv4 area 0.0.0.0
   ospfv3 ipv6 area 0.0.0.0
!
interface Vlan202
   description Tenant_OSPFv3_Redistribute_Route_Map_202 description
   no shutdown
   vrf Tenant_OSPFv3_Redistribute_Route_Map_VRF
   ip address 10.202.1.1/24
   ipv6 enable
   ipv6 address cafe::/64
   ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv4 area 1.1.1.1
   ospfv3 ipv6 area 1.1.1.1
!
interface Vlan203
   description Tenant_OSPFv3_Redistribute_IPv4_203 description
   no shutdown
   vrf Tenant_OSPFv3_Redistribute_IPv4
   ip address 10.203.1.1/24
   ipv6 enable
   ipv6 address cafe::ca/64
   ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv4 area 1.1.1.1
!
interface Vlan206
   description Tenant_OSPFv3_Redistribute_IPv6_206 description
   no shutdown
   vrf Tenant_OSPFv3_Redistribute_IPv6
   ipv6 enable
   ipv6 address ca::ca/64
   ospfv3 passive-interface
   ospfv3 network point-to-point
   ospfv3 ipv6 area 1.1.1.1
!
interface Vlan207
   description Tenant_OSPFv3_Structured_Config_206 description
   no shutdown
   vrf Tenant_OSPFv3_Structured_Config_VRF
!
interface Vxlan1
   description network-services-ospf-v3_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 201 vni 10201
   vxlan vlan 202 vni 10202
   vxlan vlan 203 vni 10203
   vxlan vlan 206 vni 10206
   vxlan vlan 207 vni 10207
   vxlan vrf Tenant_OSPFv3_Redistribute_IPv4 vni 102
   vxlan vrf Tenant_OSPFv3_Redistribute_IPv6 vni 105
   vxlan vrf Tenant_OSPFv3_Redistribute_Route_Map_VRF vni 101
   vxlan vrf Tenant_OSPFv3_Redistribute_VRF vni 100
   vxlan vrf Tenant_OSPFv3_Structured_Config_VRF vni 109
!
ip virtual-router mac-address 00:11:22:33:44:55
!
ip routing
no ip routing vrf MGMT
ip routing vrf Tenant_OSPFv3_Redistribute_IPv4
ip routing vrf Tenant_OSPFv3_Redistribute_IPv6
ip routing vrf Tenant_OSPFv3_Redistribute_Route_Map_VRF
ip routing vrf Tenant_OSPFv3_Redistribute_VRF
ip routing vrf Tenant_OSPFv3_Structured_Config_VRF
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.66.0/24 eq 32
   seq 20 permit 192.168.142.0/24 eq 32
ipv6 unicast-routing vrf Tenant_OSPFv3_Redistribute_IPv4
ipv6 unicast-routing vrf Tenant_OSPFv3_Redistribute_IPv6
ipv6 unicast-routing vrf Tenant_OSPFv3_Redistribute_Route_Map_VRF
ipv6 unicast-routing vrf Tenant_OSPFv3_Redistribute_VRF
ipv6 unicast-routing vrf Tenant_OSPFv3_Structured_Config_VRF
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 666
   router-id 192.168.66.142
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 201
      rd 192.168.66.142:20201
      route-target both 20201:20201
      redistribute learned
   !
   vlan 202
      rd 192.168.66.142:20202
      route-target both 20202:20202
      redistribute learned
   !
   vlan 203
      rd 192.168.66.142:20203
      route-target both 20203:20203
      redistribute learned
   !
   vlan 206
      rd 192.168.66.142:20206
      route-target both 20206:20206
      redistribute learned
   !
   vlan 207
      rd 192.168.66.142:20207
      route-target both 20207:20207
      redistribute learned
   !
   vrf Tenant_OSPFv3_Redistribute_IPv4
      rd 192.168.66.142:44
      route-target import evpn 44:44
      route-target export evpn 44:44
      router-id 192.168.66.142
      redistribute connected
      redistribute ospfv3
   !
   vrf Tenant_OSPFv3_Redistribute_IPv6
      rd 192.168.66.142:47
      route-target import evpn 47:47
      route-target export evpn 47:47
      router-id 192.168.66.142
      redistribute connected
      redistribute ospfv3
   !
   vrf Tenant_OSPFv3_Redistribute_Route_Map_VRF
      rd 192.168.66.142:43
      route-target import evpn 43:43
      route-target export evpn 43:43
      router-id 192.168.66.142
      redistribute connected
      redistribute ospfv3
   !
   vrf Tenant_OSPFv3_Redistribute_VRF
      rd 192.168.66.142:42
      route-target import evpn 42:42
      route-target export evpn 42:42
      router-id 192.168.66.142
      redistribute connected
   !
   vrf Tenant_OSPFv3_Structured_Config_VRF
      rd 192.168.66.142:49
      route-target import evpn 49:49
      route-target export evpn 49:49
      router-id 192.168.66.142
      redistribute connected
      redistribute ospfv3
!
router ospfv3 vrf Tenant_OSPFv3_Redistribute_IPv4
   router-id 192.168.255.103
   passive-interface default
   !
   address-family ipv4
      redistribute bgp
      redistribute static route-map ipv6_ospf_rm
!
router ospfv3 vrf Tenant_OSPFv3_Redistribute_IPv6
   router-id 192.168.255.104
   passive-interface default
   !
   address-family ipv6
      redistribute bgp
      redistribute static route-map ipv6_ospf_rm
!
router ospfv3 vrf Tenant_OSPFv3_Redistribute_Route_Map_VRF
   router-id 192.168.255.102
   passive-interface default
   !
   address-family ipv4
      redistribute bgp route-map ipv4_ospf_rm
      redistribute connected route-map ipv4_ospf_rm
      redistribute static route-map ipv4_ospf_rm
   !
   address-family ipv6
      redistribute bgp route-map ipv6_ospf_rm
      redistribute connected route-map ipv6_ospf_rm
      redistribute static route-map ipv6_ospf_rm
!
router ospfv3 vrf Tenant_OSPFv3_Redistribute_VRF
   router-id 192.168.255.101
   passive-interface default
   !
   address-family ipv4
      redistribute bgp
      redistribute connected
      redistribute static
   !
   address-family ipv6
      redistribute bgp
      redistribute connected
      redistribute static
!
router ospfv3 vrf Tenant_OSPFv3_Structured_Config_VRF
   router-id 192.168.255.107
   !
   address-family ipv4
      auto-cost reference-bandwidth 500
      passive-interface default
      redistribute bgp include leaked
   !
   address-family ipv6
      redistribute bgp
      redistribute static route-map ipv6_ospf_rm
!
end
