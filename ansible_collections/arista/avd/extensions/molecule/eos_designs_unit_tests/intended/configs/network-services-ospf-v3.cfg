!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname network-services-ospf-v3
!
vlan 201
   name Tenant_OSPFv3_201
!
vrf instance MGMT
!
vrf instance Tenant_OSPFv3_VRF
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.66.142/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.142.142/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.42.142/24
!
interface Vlan201
   description Tenant_OSPFv3_201 description
   no shutdown
   vrf Tenant_OSPFv3_VRF
   ipv6 enable
   ipv6 address cafe::cafe/64
   ipv6 ospf network point-to-point
   ipv6 ospf 42 area 0.0.0.0
!
interface Vxlan1
   description network-services-ospf-v3_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 201 vni 10201
   vxlan vrf Tenant_OSPFv3_VRF vni 100
!
ip virtual-router mac-address 00:11:22:33:44:55
!
ip routing
no ip routing vrf MGMT
ip routing vrf Tenant_OSPFv3_VRF
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.66.0/24 eq 32
   seq 20 permit 192.168.142.0/24 eq 32
ipv6 unicast-routing vrf Tenant_OSPFv3_VRF
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 666
   router-id 192.168.66.142
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 201
      rd 192.168.66.142:20201
      route-target both 20201:20201
      redistribute learned
   !
   vrf Tenant_OSPFv3_VRF
      rd 192.168.66.142:42
      route-target import evpn 42:42
      route-target export evpn 42:42
      router-id 192.168.66.142
      redistribute connected
!
ipv6 router ospf 42 vrf Tenant_OSPFv3_VRF
   router-id ipv6_ospf_router
   auto-cost reference-bandwidth 10
   redistribute bgp include leaked route-map ipv6_ospf_rm
   redistribute dhcp route-map ipv6_ospf_rm
   redistribute connected include leaked route-map ipv6_ospf_rm
   redistribute isis include leaked level-1 route-map ipv6_ospf_rm
   redistribute ospfv3 leaked route-map ipv6_ospf_rm
   redistribute ospfv3 leaked match external route-map ipv6_ospf_rm
   redistribute ospfv3 leaked match nssa-external route-map ipv6_ospf_rm
   redistribute static include leaked route-map ipv6_ospf_rm
!
end
