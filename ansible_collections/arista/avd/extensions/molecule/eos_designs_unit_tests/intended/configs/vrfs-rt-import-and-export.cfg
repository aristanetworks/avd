!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname vrfs-rt-import-and-export
!
vlan 100
   name VLAN100
!
vlan 200
   name VLAN200
!
vlan 201
   name VLAN201
!
vrf instance MGMT
!
vrf instance VRF1
!
vrf instance VRF2
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.0.20/32
!
interface Loopback1
   description MY_VTEP_LOOPBACK
   no shutdown
   ip address 10.11.0.20/32
!
interface Vlan100
   description VLAN100
   no shutdown
   vrf VRF1
   ip address virtual 10.0.100.1/24
!
interface Vlan200
   description VLAN200
   no shutdown
   vrf VRF2
   ip address virtual 10.0.200.1/24
!
interface Vlan201
   description VLAN201
   no shutdown
   ip address virtual 10.0.201.1/24
!
interface Vxlan1
   description vrfs-rt-import-and-export_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 200 vni 10200
   vxlan vlan 201 vni 10201
   vxlan vrf default vni 3
   vxlan vrf VRF1 vni 1
   vxlan vrf VRF2 vni 2
!
ip virtual-router mac-address 00:dc:00:00:00:0a
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF1
ip routing vrf VRF2
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.0.0/24 eq 32
   seq 20 permit 10.11.0.0/24 eq 32
!
ip prefix-list PL-SVI-VRF-DEFAULT
   seq 10 permit 10.0.201.0/24
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP permit 30
   match ip address prefix-list PL-SVI-VRF-DEFAULT
!
route-map RM-EVPN-EXPORT-VRF-DEFAULT permit 10
   match ip address prefix-list PL-SVI-VRF-DEFAULT
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.10.0.20
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 10.10.0.20:10100
      route-target both 10100:10100
      redistribute learned
   !
   vlan 200
      rd 10.10.0.20:10200
      route-target both 10200:10200
      redistribute learned
   !
   vlan 201
      rd 10.10.0.20:10201
      route-target both 10201:10201
      redistribute learned
   !
   vrf default
      rd 10.10.0.20:3
      route-target import evpn 3:3
      route-target export evpn 3:3
      route-target export evpn route-map RM-EVPN-EXPORT-VRF-DEFAULT
   !
   vrf VRF1
      rd 111:222
      route-target export evpn 333:444
      router-id 10.10.0.20
      redistribute connected
   !
   vrf VRF2
      rd 10.10.0.20:999
      route-target import evpn 2:999
      router-id 10.10.0.20
      redistribute connected
!
end
