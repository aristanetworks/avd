---
- name: Validate eos_cli_config_gen inputs for no-custom-template test
  arista.avd.validate_inputs:
    schema_name: eos_config
    input_dir: "{{ structured_config_dir }}"
    input_suffix: yml
    read_from_input_dir: true
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen_no_custom"
  delegate_to: localhost
  check_mode: false
  run_once: true

- name: Remove previous no-custom-template output directory
  ansible.builtin.file:
    path: "{{ actual_output_dir }}/eos_cli_config_gen_no_custom_outputs"
    state: absent

- name: First run without custom templates and without TOC
  vars:
    custom_templates: []
  register: result_first
  arista.avd.eos_cli_config_gen:
    config_filename: "{{ actual_output_dir }}/eos_cli_config_gen_no_custom_outputs/testhost.cfg"
    documentation_filename: "{{ actual_output_dir }}/eos_cli_config_gen_no_custom_outputs/testhost.md"
    device_doc_toc: false
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen_no_custom"
  delegate_to: localhost

- name: Second run without custom templates and without TOC
  vars:
    custom_templates: []
  register: result_second
  arista.avd.eos_cli_config_gen:
    config_filename: "{{ actual_output_dir }}/eos_cli_config_gen_no_custom_outputs/testhost.cfg"
    documentation_filename: "{{ actual_output_dir }}/eos_cli_config_gen_no_custom_outputs/testhost.md"
    device_doc_toc: false
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen_no_custom"
  delegate_to: localhost

- name: Tamper existing no-custom-template configuration file
  ansible.builtin.lineinfile:
    path: "{{ actual_output_dir }}/eos_cli_config_gen_no_custom_outputs/testhost.cfg"
    line: "! integration tamper marker"

- name: Third run after tampering existing file
  vars:
    custom_templates: []
  register: result_third
  arista.avd.eos_cli_config_gen:
    config_filename: "{{ actual_output_dir }}/eos_cli_config_gen_no_custom_outputs/testhost.cfg"
    documentation_filename: "{{ actual_output_dir }}/eos_cli_config_gen_no_custom_outputs/testhost.md"
    device_doc_toc: false
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen_no_custom"
  delegate_to: localhost

- name: Validate result
  ansible.builtin.assert:
    that:
      - result_first is success
      - result_first.changed == true
      - result_second is success
      - result_second.changed == false
      - result_third is success
      - result_third.changed == true
