---
# When RUNNING_FROM_SOURCE=True, the pyavd requirement is skipped and marked valid without checking
# the installed version. This tests that code path.
- name: Test with pyavd requirement skipped when running from source
  register: result
  arista.avd.verify_requirements:
    requirements:
      - "pyavd>=1.0"
    avd_ignore_requirements: true
  check_mode: false
  run_once: true

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is success
      - result.failed == false
