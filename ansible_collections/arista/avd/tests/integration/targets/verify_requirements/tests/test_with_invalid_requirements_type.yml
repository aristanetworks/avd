---
- name: Test with requirements as string instead of list
  ignore_errors: true
  register: result
  arista.avd.verify_requirements:
    requirements: "Jinja2>=2.9"
  check_mode: false
  run_once: true

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is failed
      - result.msg == expected_error
  vars:
    expected_error: >-
      Error during plugin 'arista.avd.verify_requirements' execution: The argument 'requirements' is not a list
