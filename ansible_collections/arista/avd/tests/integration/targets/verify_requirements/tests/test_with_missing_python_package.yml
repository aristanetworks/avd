---
- name: Test with missing Python package
  ignore_errors: true
  register: result
  arista.avd.verify_requirements:
    requirements:
      - "non-existent-avd-test-package>=1.0"
  check_mode: false
  run_once: true

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is failed
      - result.msg == expected_error
  vars:
    expected_error: "If it is a false positive, set 'avd_ignore_requirements=True'."
