---
all:
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  hosts:
    localhost:
      ansible_connection: local
  children:
    output_folder_hosts:
      vars:
        # Role tasks must delegate to localhost rather than connect to these hosts.
        ansible_connection: ssh
        ansible_host: 127.0.0.1
        ansible_port: 1
        ansible_ssh_timeout: 1
      hosts:
        output-host-1:
        output-host-2:
