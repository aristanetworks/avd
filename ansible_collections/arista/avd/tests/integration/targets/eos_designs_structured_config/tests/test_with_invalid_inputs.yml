- name: Test with invalid inputs
  ignore_errors: true
  register: result
  vars:
    underlay_routing_protocol: ABC
  arista.avd.eos_designs_structured_config:

- vars:
    error_msg: >-
      1 error found during schema validation of input variables.
  assert:
    that:
      - result.failed == True
      - result.msg == error_msg
