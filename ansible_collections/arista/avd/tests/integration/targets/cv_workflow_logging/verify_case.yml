---
- name: "Run CV deployment - {{ probe_case }}"
  cv_workflow_probe:
    configuration_dir: "{{ playbook_dir }}"
    device_list: [leaf1]
    cv_servers: [cv.invalid]
    workspace:
      name: "{{ probe_case }}"
    return_details: "{{ probe_case.endswith('details') }}"
  register: cv_probe_result
  ignore_errors: true

- name: "Verify workflow results and Ansible warning capture - {{ probe_case }}"
  ansible.builtin.assert:
    that:
      - cv_probe_result.changed
      - cv_probe_result.failed == probe_case.startswith('failure')
      - cv_probe_result.warnings | sort == expected_warnings | sort
      - cv_probe_result.stderr_lines is not defined
      - cv_probe_result.stderr is not defined
      - cv_probe_result.logs is not defined
      - cv_probe_result.errors == expected_workflow_errors
  vars:
    # Ansible 2.19+ also captures Display.warning() in the registered task result.
    expected_log_warnings: >-
      {{ ['CV_LOGGING_PROBE_pyavd_' ~ probe_case, 'CV_LOGGING_PROBE_urllib3_' ~ probe_case]
         if ansible_version.full is version('2.19', '>=') else [] }}
    expected_warnings: "{{ ['CV_WORKFLOW_WARNING_' ~ probe_case] + expected_log_warnings }}"
    expected_workflow_errors: "{{ ['Workflow rejected deployment'] if probe_case.startswith('failure') else [] }}"
