---
all:
  hosts:
    legacy:
      ansible_connection: local
    canonical:
      ansible_connection: local
    isolated:
      ansible_connection: local
  children:
    role_settings:
      vars:
        ansible_connection: local
        expected_structured_config: true
        expected_digital_twin_mode: false
        expected_read_from_file: true
        expected_catalog_filters: []
        expected_exclude_statuses: []
        expected_workspace_state: submitted
        expected_change_control_state: pending approval
        expected_manifest: {}
      hosts:
        omitted:
        legacy_null:
          avd_eos_designs_structured_config: null
          avd_digital_twin_mode: null
          read_structured_config_from_file: null
          avd_catalogs_filters: null
          anta_report_exclude_statuses: null
          cv_workspace_requested_state: null
          cv_change_control_requested_state: null
          cv_static_config_manifest: null
        legacy_false:
          avd_eos_designs_structured_config: false
          avd_digital_twin_mode: false
          read_structured_config_from_file: false
          cv_submit_workspace: false
          cv_run_change_control: true
          cv_workspace_requested_state: null
          cv_change_control_requested_state: null
          expected_structured_config: false
          expected_read_from_file: false
          expected_workspace_state: built
          expected_change_control_state: completed
        canonical_false:
          avd_eos_designs_structured_config: true
          avd_digital_twin_mode: true
          read_structured_config_from_file: true
          avd_catalogs_filters:
            - skip_tests: [VerifyNTP]
          anta_report_exclude_statuses: [success]
          eos_designs_structured_config: false
          eos_designs_digital_twin_mode: false
          eos_cli_config_gen_read_structured_config_from_file: false
          cv_deploy_read_structured_config_from_file: false
          anta_runner_avd_catalogs_filters: []
          anta_runner_report_exclude_statuses: []
          cv_workspace_requested_state: submitted
          cv_change_control_requested_state: completed
          cv_static_config_manifest:
            preserve_existing_containers: true
          cv_deploy_workspace_requested_state: built
          cv_deploy_change_control_requested_state: pending approval
          cv_deploy_static_config_manifest: {}
          expected_structured_config: false
          expected_read_from_file: false
          expected_workspace_state: built
        canonical_true:
          avd_eos_designs_structured_config: false
          avd_digital_twin_mode: false
          read_structured_config_from_file: false
          eos_designs_structured_config: true
          eos_designs_digital_twin_mode: true
          eos_cli_config_gen_read_structured_config_from_file: true
          cv_deploy_read_structured_config_from_file: true
          anta_runner_avd_catalogs_filters:
            - skip_tests: [VerifyNTP]
          anta_runner_report_exclude_statuses: [success]
          cv_deploy_workspace_requested_state: abandoned
          cv_deploy_change_control_requested_state: approved
          cv_deploy_static_config_manifest:
            preserve_existing_containers: true
          expected_digital_twin_mode: true
          expected_catalog_filters:
            - skip_tests: [VerifyNTP]
          expected_exclude_statuses: [success]
          expected_workspace_state: abandoned
          expected_change_control_state: approved
          expected_manifest:
            preserve_existing_containers: true
        canonical_null:
          avd_eos_designs_structured_config: true
          avd_digital_twin_mode: true
          read_structured_config_from_file: true
          eos_designs_structured_config: null
          eos_designs_digital_twin_mode: null
          eos_cli_config_gen_read_structured_config_from_file: null
          cv_deploy_read_structured_config_from_file: null
          anta_runner_avd_catalogs_filters: null
          anta_runner_report_exclude_statuses: null
          cv_deploy_workspace_requested_state: null
          cv_deploy_change_control_requested_state: null
          cv_deploy_static_config_manifest: null
          expected_structured_config: null
          expected_digital_twin_mode: null
          expected_read_from_file: null
          expected_catalog_filters: null
          expected_exclude_statuses: null
          expected_workspace_state: null
          expected_change_control_state: null
          expected_manifest: null
