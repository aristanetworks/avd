---
# Test 1: Without vault password - files should be plain JSON
- name: Test 1 - Without vault password
  hosts: testhost
  gather_facts: false
  tags: test1
  vars:
    hostname: testhost
    router_bgp:
      as: "65001"
    static_routes:
      - vrf: default
        prefix: 0.0.0.0/0
        next_hop: 192.168.0.1
  tasks:
    - name: Validate inputs without vault configured
      arista.avd.validate_inputs:
        schema_name: eos_config
        read_from_input_dir: false
      check_mode: false
      register: validate_result

    - name: Verify validation succeeded
      ansible.builtin.assert:
        that:
          - validate_result is success
        fail_msg: "Validation should succeed without vault configured"

    - name: Verify files are plain JSON
      ansible.builtin.include_tasks: tasks/verify_vault_encryption.yml
      vars:
        templated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/templated/testhost.json"
        validated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/validated/testhost.json"
        expected_encrypted: false

# Test 2: With vault password - files should be encrypted
- name: Test 2 - With vault password
  hosts: testhost
  gather_facts: false
  tags: test2
  vars:
    hostname: testhost
    router_bgp:
      as: "65001"
    static_routes:
      - vrf: default
        prefix: 0.0.0.0/0
        next_hop: 192.168.0.1
  tasks:
    - name: Validate inputs with vault configured
      arista.avd.validate_inputs:
        schema_name: eos_config
        read_from_input_dir: false
      check_mode: false
      register: validate_result

    - name: Verify validation succeeded
      ansible.builtin.assert:
        that:
          - validate_result is success
        fail_msg: "Validation should succeed with vault configured"

    - name: Verify files are encrypted
      ansible.builtin.include_tasks: tasks/verify_vault_encryption.yml
      vars:
        templated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/templated/testhost.json"
        validated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/validated/testhost.json"
        expected_encrypted: true

# Test 3: Multiple vault identities without avd_vault_id - should use first identity ('dev')
- name: Test 3 - Multiple vault identities (default behavior)
  hosts: testhost
  gather_facts: false
  tags: test3
  vars:
    hostname: testhost
    router_bgp:
      as: "65001"
    static_routes:
      - vrf: default
        prefix: 0.0.0.0/0
        next_hop: 192.168.0.1
  tasks:
    - name: Validate inputs with multiple vault identities
      arista.avd.validate_inputs:
        schema_name: eos_config
        read_from_input_dir: false
      check_mode: false
      register: validate_result

    - name: Verify validation succeeded
      ansible.builtin.assert:
        that:
          - validate_result is success
        fail_msg: "Validation should succeed with multiple vault identities"

    - name: Verify files are encrypted with first vault identity
      ansible.builtin.include_tasks: tasks/verify_vault_encryption.yml
      vars:
        templated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/templated/testhost.json"
        validated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/validated/testhost.json"
        expected_encrypted: true
        expected_vault_id: "dev"

    - name: Verify can decrypt with dev password
      ansible.builtin.include_tasks: tasks/verify_vault_encryption.yml
      vars:
        templated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/templated/testhost.json"
        validated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/validated/testhost.json"
        expected_encrypted: true
        vault_password_file: "{{ playbook_dir }}/.vault_dev"
        can_decrypt: true

    - name: Verify cannot decrypt with prod password
      ansible.builtin.include_tasks: tasks/verify_vault_encryption.yml
      vars:
        templated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/templated/testhost.json"
        validated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/validated/testhost.json"
        expected_encrypted: true
        vault_password_file: "{{ playbook_dir }}/.vault_prod"
        can_decrypt: false

# Test 4: Multiple vault identities with avd_vault_id='prod' - should use 'prod' identity
- name: Test 4 - Multiple vault identities with avd_vault_id
  hosts: testhost
  gather_facts: false
  tags: test4
  vars:
    hostname: testhost
    router_bgp:
      as: "65001"
    static_routes:
      - vrf: default
        prefix: 0.0.0.0/0
        next_hop: 192.168.0.1
  tasks:
    - name: Validate inputs with avd_vault_id='prod'
      arista.avd.validate_inputs:
        schema_name: eos_config
        read_from_input_dir: false
        avd_vault_id: "prod"
      check_mode: false
      register: validate_result

    - name: Verify validation succeeded
      ansible.builtin.assert:
        that:
          - validate_result is success
        fail_msg: "Validation should succeed with avd_vault_id specified"

    - name: Verify files are encrypted with specified vault identity
      ansible.builtin.include_tasks: tasks/verify_vault_encryption.yml
      vars:
        templated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/templated/testhost.json"
        validated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/validated/testhost.json"
        expected_encrypted: true
        expected_vault_id: "prod"

    - name: Verify can decrypt with prod password
      ansible.builtin.include_tasks: tasks/verify_vault_encryption.yml
      vars:
        templated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/templated/testhost.json"
        validated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/validated/testhost.json"
        expected_encrypted: true
        vault_password_file: "{{ playbook_dir }}/.vault_prod"
        can_decrypt: true

    - name: Verify cannot decrypt with dev password
      ansible.builtin.include_tasks: tasks/verify_vault_encryption.yml
      vars:
        templated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/templated/testhost.json"
        validated_file: "{{ lookup('env', 'AVDTMPDIR') }}/arista_avd/eos_cli_config_gen/validated/testhost.json"
        expected_encrypted: true
        vault_password_file: "{{ playbook_dir }}/.vault_dev"
        can_decrypt: false
