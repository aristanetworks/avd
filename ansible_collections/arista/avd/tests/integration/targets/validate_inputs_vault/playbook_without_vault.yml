---
- name: Test validate_inputs without vault
  hosts: testhost
  gather_facts: false
  vars:
    # Required hostvars for eos_config schema
    hostname: testhost
    # Add some minimal eos_config data so validation produces output
    router_bgp:
      as: "65001"
    static_routes:
      - vrf: default
        prefix: 0.0.0.0/0
        next_hop: 192.168.0.1
  tasks:
    - name: Validate inputs without vault configured
      arista.avd.validate_inputs:
        schema_name: eos_config
        read_from_input_dir: false
      check_mode: false
      register: validate_result

    - name: Verify validation succeeded
      ansible.builtin.assert:
        that:
          - validate_result is success
        fail_msg: "Validation should succeed without vault configured"
