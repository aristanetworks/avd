---
- name: Test AVD catalogs with supported structured configuration formats
  arista.avd.anta_workflow:
    device_list: "{{ anta_test_devices }}"
    avd_catalogs:
      structured_config_dir: "{{ actual_output_dir }}/structured_configs"
      structured_config_suffix: "{{ item }}"
      output_dir: "{{ actual_output_dir }}/generated_catalogs"
      filters:
        - run_tests: [VerifyNTP, VerifyCoredump]
        - device_list: [anta-leaf1]
          run_tests: [VerifyNTP]
        - device_list: [anta-leaf2]
          skip_tests: [VerifyNTP]
    runner:
      dry_run: true
      batch_size: 1
    report:
      json_output: "{{ actual_output_dir }}/avd_catalogs_{{ item }}.json"
  register: catalog_results
  delegate_to: localhost
  check_mode: false
  run_once: true
  loop: [yml, yaml, json]

- name: Validate results and device-specific catalog filters
  ansible.builtin.assert:
    that:
      - item is success
      - item.anta_tests_summary.total_tests == 2
      - item.anta_tests_summary.tests_unset == 2
      - report_data | length == 2
      - report_data[0].name == 'anta-leaf1'
      - report_data[0].test == 'VerifyNTP'
      - report_data[1].name == 'anta-leaf2'
      - report_data[1].test == 'VerifyCoredump'
      - lookup('file', actual_output_dir ~ '/generated_catalogs/anta-leaf1.json') | from_json | length > 0
      - lookup('file', actual_output_dir ~ '/generated_catalogs/anta-leaf2.json') | from_json | length > 0
  vars:
    report_data: "{{ lookup('file', actual_output_dir ~ '/avd_catalogs_' ~ item.item ~ '.json') | from_json }}"
  loop: "{{ catalog_results.results }}"
  loop_control:
    label: "{{ item.item }}"
