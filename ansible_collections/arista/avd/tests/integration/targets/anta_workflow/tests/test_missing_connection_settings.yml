---
- name: Test missing device connection settings
  arista.avd.anta_workflow:
    device_list: [anta-no-credentials]
    avd_catalogs:
      enabled: false
    user_catalogs:
      enabled: true
      input_dir: "{{ actual_output_dir }}/catalogs/json"
    runner:
      dry_run: true
  ignore_errors: true
  register: result
  delegate_to: localhost
  check_mode: false
  run_once: true

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is failed
      - result.msg.startswith(expected_error)
  vars:
    expected_error: >-
      Error during plugin 'arista.avd.anta_workflow' execution: Device 'anta-no-credentials' is missing required connection settings.
      Please make sure all required connection variables are defined in the Ansible inventory, as specified in the role documentation
