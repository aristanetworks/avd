---
- name: Test missing structured configuration file
  arista.avd.anta_workflow:
    device_list: "{{ anta_test_devices }}"
    avd_catalogs:
      structured_config_dir: "{{ actual_output_dir }}/empty_catalogs"
  ignore_errors: true
  register: result
  delegate_to: localhost
  check_mode: false
  run_once: true

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is failed
      - result.msg == expected_error
  vars:
    expected_error: >-
      Error during plugin 'arista.avd.anta_workflow' execution: Structured configuration file for device
      'anta-leaf1' not found: {{ actual_output_dir }}/empty_catalogs/anta-leaf1.yml
