---
- name: Validate inputs reading from json file with empty validation_configuration
  arista.avd.validate_inputs:
    schema_name: eos_config
    input_dir: "{{ input_dir }}"
    input_suffix: json
    read_from_input_dir: true
    validation_configuration: {}
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen_empty_validation_configuration"
  delegate_to: localhost
  check_mode: false
  run_once: true
  register: result

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is success
      - result is not failed
