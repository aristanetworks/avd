---
- name: Validate inputs with empty device_list
  arista.avd.validate_inputs:
    schema_name: eos_config
    device_list: []
    input_dir: "{{ input_dir }}"
    input_suffix: json
    read_from_input_dir: true
    tmp_dir: "{{ actual_output_dir }}/tmp_validate_inputs_empty_device_list"
  delegate_to: localhost
  check_mode: false
  run_once: true
  register: result

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is success
      - result is not failed
