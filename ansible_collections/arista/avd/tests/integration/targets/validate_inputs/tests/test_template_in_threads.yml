---
- name: Validate inputs with templating in threads.
  arista.avd.validate_inputs:
    schema_name: eos_config
    read_from_input_dir: false
    # Action-plugin arguments are templated in the action plugin process. This lookup primes a lock held by a background thread before validate_inputs forks.
    tmp_dir: "{{ lookup('forked_lock', actual_output_dir ~ '/tmp_lookup_in_forked_worker') }}"
    # The test fails without 'template_with_multiprocessing: false', as the forked templating process will inherit the lock. Race condition in real deployments.
    template_with_multiprocessing: false
  delegate_to: localhost
  check_mode: false
  run_once: true
  vars:
    # Hostvars are templated later in the validate_inputs worker. The fork inherits the held lock, so this second lookup reproduces the unsafe fork behavior.
    hostname: "{{ lookup('forked_lock', 'testhost') }}"
