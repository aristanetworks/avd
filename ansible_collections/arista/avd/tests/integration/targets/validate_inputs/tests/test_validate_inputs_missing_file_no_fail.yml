---
- name: Validate inputs with missing file and fail_on_missing_input_files false
  arista.avd.validate_inputs:
    device_list: "{{ ansible_play_hosts_all }}"
    schema_name: cv_deploy
    input_dir: "{{ input_dir }}/missing_dir"
    input_suffix: json
    read_from_input_dir: true
    fail_on_missing_input_files: false
    tmp_dir: "{{ actual_output_dir }}/tmp_cv_deploy"
  delegate_to: localhost
  check_mode: false
  run_once: true
  register: result

- name: Validate result is success
  ansible.builtin.assert:
    that:
      - result is success
