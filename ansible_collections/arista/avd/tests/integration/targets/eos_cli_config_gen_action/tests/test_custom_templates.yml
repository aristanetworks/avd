---
- name: Validate eos_cli_config_gen inputs
  arista.avd.validate_inputs:
    schema_name: eos_config
    input_dir: "{{ structured_config_dir }}"
    input_suffix: yml
    read_from_input_dir: true
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen"
  delegate_to: localhost
  check_mode: false
  run_once: true

- name: Test custom templates in eos_cli_config_gen
  register: result
  arista.avd.eos_cli_config_gen:
    config_filename: "{{ actual_output_dir }}/testhost.cfg"
    generate_device_doc: false
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen"
  delegate_to: localhost

- name: Compare actual output with expected output
  ansible.builtin.shell: >-
    diff "{{ expected_output_dir }}/testhost.cfg"
    "{{ actual_output_dir }}/testhost.cfg"
  failed_when: diff_output.rc > 0
  register: diff_output
  delegate_to: localhost

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is success
