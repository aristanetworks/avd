---
- name: Validate eos_cli_config_gen inputs
  arista.avd.validate_inputs:
    schema_name: eos_config
    input_dir: "{{ structured_config_dir }}"
    input_suffix: yml
    read_from_input_dir: true
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen"
  delegate_to: localhost
  check_mode: false
  run_once: true

- name: Test canonical custom templates in eos_cli_config_gen
  vars:
    custom_templates: []
    eos_cli_config_gen_custom_templates:
      - "{{ relative_custom_templates_dir }}/custom_template1.j2"
  register: result
  arista.avd.eos_cli_config_gen:
    config_filename: "{{ actual_output_dir }}/testhost.cfg"
    generate_device_doc: false
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen"
  delegate_to: localhost

- name: Compare actual output with expected output
  ansible.builtin.shell: >-
    diff "{{ expected_output_dir }}/testhost.cfg"
    "{{ actual_output_dir }}/testhost.cfg"
  failed_when: diff_output.rc > 0
  register: diff_output
  delegate_to: localhost

- name: Validate result
  ansible.builtin.assert:
    that:
      - result is success

- name: Test legacy custom templates in eos_cli_config_gen
  vars:
    custom_templates:
      - "{{ relative_custom_templates_dir }}/custom_template1.j2"
  register: legacy_result
  arista.avd.eos_cli_config_gen:
    config_filename: "{{ actual_output_dir }}/testhost-legacy.cfg"
    generate_device_doc: false
    tmp_dir: "{{ actual_output_dir }}/tmp_eos_cli_config_gen"
  delegate_to: localhost

- name: Compare legacy custom-template output with expected output
  ansible.builtin.shell: >-
    diff "{{ expected_output_dir }}/testhost.cfg"
    "{{ actual_output_dir }}/testhost-legacy.cfg"
  failed_when: legacy_diff.rc > 0
  register: legacy_diff
  delegate_to: localhost

- name: Validate legacy result
  ansible.builtin.assert:
    that:
      - legacy_result is success
