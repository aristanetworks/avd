# Custom Glossary Definitions
#
# This file allows you to add custom terms to the glossary that are not part of the schema.
# Each entry should have a 'term' and 'description' field.
#
# Format:
#   - term: "Your Term Here"
#     description: |
#       Your description here.
#       Can be multiline.

# AVD-Specific Terms
- term: "AVD"
  description: |
    Arista Validated Designs - A framework for design-driven network automation that provides
    extensible fabric-wide network models, simplifying configuration, delivering consistency,
    and reducing errors across data center, campus, and wide area networks.

- term: "AVD Design"
  description: |
    AVD Design data models provide opinionated yet flexible network-wide data models expressing the
    intent of your network design and configuration. AVD Design data models are transformed by the
    Arista AVD framework to generate configuration, documentation and tests.

- term: "EOS Config"
  description: |
    The EOS Config provides device-centric data models for expressing the Arista EOS device
    configurations syntax. These data models are also referred to as “structured config” within
    the AVD Design data models and can be leveraged with custom structured configuration to
    extend or override the behaviour of Arista AVD.

- term: "Structured Config"
  description: |
    Device-centric configuration data in YAML format that directly maps to EOS CLI commands.
    Structured config can be used to extend or override the configuration generated by AVD
    Design data models.

- term: "Digital Twin"
  description: |
    A virtual replica of a production AVD fabric optimized for specific simulation environments
    like ACT (Arista Cloud Test). AVD automatically generates artifacts required to deploy
    digital twins with features adjusted for the target environment.

# Network Design Patterns
- term: "L3LS"
  description: |
    Layer 3 Leaf-Spine - A network architecture where leaf switches are connected to spine
    switches using Layer 3 routing protocols. This is the foundation for modern data center
    designs with EVPN/VXLAN overlays.

- term: "L2LS"
  description: |
    Layer 2 Leaf-Spine - A network architecture where leaf switches are connected to spine
    switches using Layer 2 protocols, typically with spanning tree for loop prevention.

- term: "3-Stage Clos"
  description: |
    A network topology consisting of three layers: spine, leaf, and optionally overlay controllers.
    Also referred to as a POD (Point of Delivery) in AVD terminology. This architecture provides
    non-blocking, scalable connectivity.

- term: "5-Stage Clos"
  description: |
    An extended Clos topology adding super-spine and border leaf layers to the traditional
    3-stage design, enabling larger scale deployments across multiple PODs or data centers.

- term: "POD"
  description: |
    Point of Delivery - A self-contained network segment in a Clos architecture, typically
    consisting of spine switches, L3 leaf switches, and L2 leaf switches.

# Routing Protocols
# - term: "BGP"
#   description: |
#     Border Gateway Protocol - A standardized exterior gateway protocol (RFC 4271) designed to
#     exchange routing and reachability information among autonomous systems. Used extensively
#     in AVD for both underlay and overlay routing.

# - term: "eBGP"
#   description: |
#     External BGP - BGP sessions between routers in different autonomous systems. In AVD L3LS
#     designs, eBGP is commonly used for both underlay routing and EVPN overlay peering.

# - term: "iBGP"
#   description: |
#     Internal BGP - BGP sessions between routers within the same autonomous system. Requires
#     route reflectors or full mesh peering. Used in AVD MPLS designs and some EVPN deployments.

# - term: "EVPN"
#   description: |
#     Ethernet VPN (RFC 7432) - A BGP-based control plane for VXLAN that provides Layer 2 and
#     Layer 3 connectivity with advanced features like multi-tenancy, mobility, and integrated
#     routing and bridging.

# - term: "OSPF"
#   description: |
#     Open Shortest Path First - A link-state interior gateway protocol used for IP routing
#     within an autonomous system. Can be used as the underlay routing protocol in AVD designs.

# - term: "ISIS"
#   description: |
#     Intermediate System to Intermediate System - A link-state routing protocol similar to OSPF,
#     commonly used in service provider networks and as an underlay protocol for MPLS and EVPN.

# VXLAN and Overlay
# - term: "VXLAN"
#   description: |
#     Virtual Extensible LAN (RFC 7348) - A network virtualization technology that encapsulates
#     Layer 2 Ethernet frames within Layer 4 UDP datagrams, enabling Layer 2 networks to be
#     extended across Layer 3 infrastructure.

# - term: "VNI"
#   description: |
#     VXLAN Network Identifier - A 24-bit identifier in the VXLAN header that uniquely identifies
#     a VXLAN segment. Similar to a VLAN ID but with a much larger address space (16 million vs 4096).

# - term: "VTEP"
#   description: |
#     VXLAN Tunnel Endpoint - A device that originates and/or terminates VXLAN tunnels. VTEPs
#     encapsulate Ethernet frames into VXLAN packets and decapsulate them at the destination.

# - term: "IRB"
#   description: |
#     Integrated Routing and Bridging - A technique that allows routing between VXLAN segments
#     (VNIs) on the same device. In EVPN, this enables both Layer 2 and Layer 3 services.

# - term: "Symmetric IRB"
#   description: |
#     A VXLAN routing model where both ingress and egress VTEPs perform routing. Traffic is
#     routed at the ingress VTEP, transported through the fabric in the destination VRF's VNI,
#     and bridged at the egress VTEP.

# - term: "Asymmetric IRB"
#   description: |
#     A VXLAN routing model where only the ingress VTEP performs routing and the egress VTEP
#     only bridges. Requires all VLANs to be present on all VTEPs.

# High Availability
# - term: "MLAG"
#   description: |
#     Multi-Chassis Link Aggregation - Arista's proprietary technology that allows a link
#     aggregation group (LAG) to span two physical switches, providing redundancy and increased
#     bandwidth without spanning tree.

# - term: "LACP"
#   description: |
#     Link Aggregation Control Protocol (IEEE 802.3ad) - A protocol for bundling multiple
#     physical links into a single logical link for increased bandwidth and redundancy.

# - term: "ESI"
#   description: |
#     Ethernet Segment Identifier (RFC 7432) - A unique identifier for an Ethernet segment in
#     EVPN multi-homing scenarios. Used for active-active multi-homing with EVPN.

# - term: "BFD"
#   description: |
#     Bidirectional Forwarding Detection (RFC 5880) - A protocol designed to provide fast failure
#     detection for network paths. Used to quickly detect link or node failures and trigger
#     routing protocol convergence.

# VRF and Tenancy
# - term: "VRF"
#   description: |
#     Virtual Routing and Forwarding - A technology that allows multiple instances of a routing
#     table to coexist on the same router, enabling network segmentation and multi-tenancy.

# - term: "SVI"
#   description: |
#     Switched Virtual Interface - A virtual Layer 3 interface associated with a VLAN. SVIs
#     provide inter-VLAN routing and serve as the default gateway for hosts in the VLAN.

- term: "Tenant"
  description: |
    In AVD, a tenant is an abstraction layer above VRFs that groups related network services.
    Tenants help organize and manage multi-tenant network configurations.

# WAN and SD-WAN
# - term: "CV Pathfinder"
#   description: |
#     CloudVision Pathfinder - Arista's SD-WAN solution that provides intelligent path selection,
#     application-aware routing, and centralized management through CloudVision. Integrates with
#     AVD for automated WAN deployment.

# - term: "AutoVPN"
#   description: |
#     Arista's automated VPN solution that dynamically establishes IPsec tunnels between sites
#     without manual configuration. Used as the foundation for CV Pathfinder deployments.

# - term: "Path Group"
#   description: |
#     In CV Pathfinder and AutoVPN, a path group represents a set of WAN transport links with
#     similar characteristics (e.g., MPLS, Internet). Used for traffic engineering and path
#     selection.

# - term: "DPS"
#   description: |
#     Dynamic Path Selection - Arista's technology for intelligent, application-aware WAN path
#     selection based on real-time network conditions and application requirements.

# - term: "AVT"
#   description: |
#     Adaptive Virtual Topology - A feature that dynamically adjusts VXLAN tunnel paths based on
#     network conditions, application requirements, and policies to optimize traffic flow.

# MPLS
# - term: "MPLS"
#   description: |
#     Multiprotocol Label Switching - A routing technique that directs data using short path
#     labels instead of network addresses. Commonly used in service provider networks for VPNs
#     and traffic engineering.

# - term: "LDP"
#   description: |
#     Label Distribution Protocol (RFC 5036) - A protocol used in MPLS networks to distribute
#     labels between routers, establishing label-switched paths (LSPs).

# - term: "SR-TE"
#   description: |
#     Segment Routing Traffic Engineering - A source-based routing technique that allows a sender
#     to specify the path a packet should take through the network using a stack of segment
#     identifiers.

# - term: "Route Reflector"
#   description: |
#     A BGP router that reflects routes between iBGP peers, eliminating the need for a full mesh
#     of iBGP sessions. Essential for scaling iBGP deployments in large networks.

# CloudVision
- term: "CVaaS"
  description: |
    CloudVision as a Service - Arista's cloud-based network management and automation platform
    that provides centralized visibility, telemetry, and configuration management for Arista devices.

- term: "CloudVision Studio"
  description: |
    A feature of CloudVision that provides visual workflow automation and configuration
    management capabilities, including Static Configuration Studio and Access Interface
    Configuration Studio.

- term: "Change Control"
  description: |
    In CloudVision, a change control is a workflow mechanism that manages network configuration
    changes with approval processes, scheduling, and rollback capabilities.

- term: "Workspace"
  description: |
    In CloudVision, a workspace is a staging area for configuration changes that can be built,
    reviewed, and submitted before being applied to network devices.

# Management and Automation
- term: "ANTA"
  description: |
    Arista Network Test Automation - A Python framework for validating the operational state
    of Arista EOS devices. Integrated with AVD to provide automated testing of deployed configurations.

- term: "ACT"
  description: |
    Arista Cloud Test - A cloud-based virtual lab environment for testing and validating
    network designs using virtual Arista EOS instances.

- term: "eAPI"
  description: |
    Arista's RESTful API for programmatic access to EOS devices. Enables automation tools
    like Ansible to configure and manage Arista switches.

# Network Services
# - term: "VLAN"
#   description: |
#     Virtual Local Area Network (IEEE 802.1Q) - A logical network segment that groups devices
#     on the same broadcast domain regardless of physical location. VLANs provide network
#     segmentation and isolation.

# - term: "AAA"
#   description: |
#     Authentication, Authorization, and Accounting - A framework for controlling access to
#     network resources, tracking user activities, and enforcing security policies.

# - term: "TACACS+"
#   description: |
#     Terminal Access Controller Access-Control System Plus - A protocol that provides centralized
#     authentication, authorization, and accounting for network device access.

# - term: "RADIUS"
#   description: |
#     Remote Authentication Dial-In User Service - A networking protocol that provides centralized
#     authentication, authorization, and accounting management for users connecting to network services.

# - term: "ACL"
#   description: |
#     Access Control List - A set of rules that filter network traffic based on criteria such as
#     source/destination IP addresses, protocols, and ports. Used for security and traffic management.

# - term: "QoS"
#   description: |
#     Quality of Service - A set of technologies and techniques for managing network traffic to
#     ensure performance for critical applications by prioritizing certain types of traffic.

# - term: "LLDP"
#   description: |
#     Link Layer Discovery Protocol (IEEE 802.1AB) - A vendor-neutral protocol that allows
#     network devices to advertise their identity and capabilities to neighbors on the same
#     network segment.

# - term: "NTP"
#   description: |
#     Network Time Protocol - A protocol for synchronizing clocks of computer systems over
#     packet-switched networks. Critical for accurate logging, security, and distributed systems.

# - term: "SNMP"
#   description: |
#     Simple Network Management Protocol - A protocol for collecting and organizing information
#     about managed devices on IP networks and for modifying that information to change device behavior.

# - term: "IPsec"
#   description: |
#     Internet Protocol Security - A protocol suite for securing IP communications by authenticating
#     and encrypting each IP packet in a communication session. Used extensively in VPN deployments.

# Data Center Interconnect
# - term: "DCI"
#   description: |
#     Data Center Interconnect - The networking infrastructure that connects two or more data
#     centers, enabling resource sharing, disaster recovery, and workload mobility.

# - term: "EVPN Gateway"
#   description: |
#     A device that rewrites EVPN routes at the edge of an EVPN domain, typically used in DCI
#     scenarios to control route propagation and optimize convergence between data centers.

# Spanning Tree
# - term: "STP"
#   description: |
#     Spanning Tree Protocol (IEEE 802.1D) - A network protocol that prevents loops in Layer 2
#     networks by creating a loop-free logical topology.

# - term: "RSTP"
#   description: |
#     Rapid Spanning Tree Protocol (IEEE 802.1w) - An evolution of STP that provides faster
#     convergence times while maintaining backward compatibility.

# - term: "MSTP"
#   description: |
#     Multiple Spanning Tree Protocol (IEEE 802.1s) - An extension of RSTP that allows multiple
#     VLANs to be mapped to a reduced number of spanning tree instances.

# # Multicast
# - term: "PIM"
#   description: |
#     Protocol Independent Multicast - A family of multicast routing protocols that can work
#     with any unicast routing protocol. Includes PIM-SM (Sparse Mode) and PIM-DM (Dense Mode).

# - term: "IGMP"
#   description: |
#     Internet Group Management Protocol - A protocol used by hosts and adjacent routers to
#     establish multicast group memberships on IPv4 networks.

# # Timing and Synchronization
# - term: "PTP"
#   description: |
#     Precision Time Protocol (IEEE 1588) - A protocol for synchronizing clocks throughout a
#     network with sub-microsecond accuracy. More precise than NTP, used for applications
#     requiring tight time synchronization.

# Additional AVD Concepts
- term: "Fabric"
  description: |
    In AVD, a fabric refers to the entire network infrastructure managed as a single entity,
    including all switches, links, and services. AVD generates configurations for the entire
    fabric from a unified data model.

- term: "Node Type"
  description: |
    A classification of network devices in AVD (e.g., spine, leaf, super-spine, border-leaf).
    Node types determine the role and configuration template applied to devices.

# - term: "Underlay"
#   description: |
#     The physical network infrastructure that provides IP connectivity between devices. In AVD
#     L3LS designs, the underlay typically uses BGP, OSPF, or ISIS for routing.

# - term: "Overlay"
#   description: |
#     The virtual network built on top of the underlay infrastructure. In AVD, the overlay
#     typically uses EVPN for control plane and VXLAN for data plane encapsulation.

# - term: "Inband Management"
#   description: |
#     A management approach where network devices are managed through the production network
#     rather than a dedicated out-of-band management network. AVD can configure SVIs for
#     inband management access.

# Ansible Roles
- term: "eos_designs"
  description: |
    An AVD Ansible role that provides an abstracted data model to deploy various network
    designs and use cases. It generates structured configurations from fabric-wide intent
    data models, supporting L3LS EVPN, L2LS, MPLS, and WAN designs. The role outputs
    structured YAML configurations and fabric documentation.

- term: "eos_cli_config_gen"
  description: |
    An AVD Ansible role that generates EOS CLI syntax and device documentation from
    structured configuration data. It converts YAML-based structured configs into
    EOS CLI commands and creates device-specific documentation in Markdown format.

- term: "cv_deploy"
  description: |
    An AVD Ansible role that deploys EOS device configurations and tags to CloudVision.
    It manages the full deployment workflow including workspace creation, configuration
    push, change control creation, and approval processes for both CVaaS and on-premises
    CloudVision instances.

- term: "anta_runner"
  description: |
    An AVD Ansible role that validates the operational state of Arista EOS devices using
    the ANTA (Arista Network Test Automation) framework. It can generate test catalogs
    from AVD structured configurations or execute user-defined test catalogs, reporting
    results in JSON, CSV, and Markdown formats.

- term: "eos_config_deploy_eapi"
  description: |
    An AVD Ansible role that deploys configurations directly to Arista EOS devices using
    eAPI. It performs configuration replacement and can optionally save configurations
    to startup-config.

- term: "build_output_folders"
  description: |
    An AVD Ansible role that creates the necessary directory structure for storing
    generated configurations, documentation, and other AVD outputs. Typically run
    before eos_designs and eos_cli_config_gen roles.

- term: "eos_validate_state"
  description: |
    A legacy AVD Ansible role for validating the operational state of EOS devices.
    This role has been superseded by the anta_runner role which provides more
    comprehensive testing capabilities using the ANTA framework.

- term: "eos_snapshot"
  description: |
    An AVD Ansible role that collects operational state snapshots from EOS devices.
    Useful for capturing the current state before and after changes for comparison
    and validation purposes.

