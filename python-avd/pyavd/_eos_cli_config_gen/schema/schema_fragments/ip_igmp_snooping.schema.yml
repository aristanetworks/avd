# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  ip_igmp_snooping:
    type: dict
    keys:
      globally_enabled:
        type: bool
        default: true
        description: Activate or deactivate IGMP snooping for all vlans where `vlans` allows user to activate / deactivate IGMP snooping per vlan.
      robustness_variable:
        type: int
      restart_query_interval:
        type: int
      interface_restart_query:
        type: int
      fast_leave:
        type: bool
      querier:
        type: dict
        keys:
          enabled:
            type: bool
          address:
            type: str
            description: IP Address.
          query_interval:
            type: int
          max_response_time:
            type: int
          last_member_query_interval:
            type: int
          last_member_query_count:
            type: int
          startup_query_interval:
            type: int
          startup_query_count:
            type: int
          version:
            type: int
      proxy:
        type: bool
      vlans:
        type: list
        primary_key: id
        items:
          type: dict
          keys:
            id:
              type: int
              description: VLAN ID.
            enabled:
              type: bool
            querier:
              type: dict
              keys:
                enabled:
                  type: bool
                address:
                  type: str
                  description: IP Address.
                query_interval:
                  type: int
                max_response_time:
                  type: int
                last_member_query_interval:
                  type: int
                last_member_query_count:
                  type: int
                startup_query_interval:
                  type: int
                startup_query_count:
                  type: int
                version:
                  type: int
            max_groups:
              type: int
            fast_leave:
              type: bool
            proxy:
              type: bool
              description: |
                Global proxy settings should be enabled before enabling per-vlan.
