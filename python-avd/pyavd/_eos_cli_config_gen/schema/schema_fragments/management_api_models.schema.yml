# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  management_api_models:
    type: dict
    keys:
      providers:
        type: list
        deprecation:
          warning: true
          new_key: provider
          remove_in_version: 7.0.0
        items:
          type: dict
          keys:
            name:
              type: str
              valid_values: ["sysdb", "smash"]
            paths:
              type: list
              items:
                type: dict
                keys:
                  path:
                    type: str
                  disabled:
                    type: bool
                    default: false
      provider:
        type: dict
        keys:
          sysdb:
            type: dict
            description: Sysdb provider configuration.
            keys:
              paths:
                type: list
                description: List of paths.
                items:
                  type: dict
                  keys:
                    path:
                      type: str
                      description: Path.
                    disabled:
                      type: bool
                      description: Disable the path.
                      default: false
          smash:
            type: dict
            description: Smash provider configuration.
            $ref: "eos_cli_config_gen#/keys/management_api_models/keys/provider/keys/sysdb"
          macsec:
            type: dict
            description: MACsec provider configuration.
            keys:
              interfaces:
                type: bool
                description: Enable MACsec for interfaces.
              mka:
                type: bool
                description: Enable MKA for MACsec.
