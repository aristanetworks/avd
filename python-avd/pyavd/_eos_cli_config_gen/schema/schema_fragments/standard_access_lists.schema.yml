# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
allow_other_keys: true
keys:
  standard_access_lists:
    type: list
    primary_key: name
    items:
      type: dict
      keys:
        name:
          type: str
          description: Access-list Name.
          convert_types: [ int ]
        counters_per_entry:
          type: bool
        entries:
          type: list
          items:
            type: dict
            keys:
              sequence:
                type: int
                description: Sequence ID.
                convert_types:
                  - str
              action:
                type: str
                description: |
                  Action as string.
                valid_values: [ permit, deny ]
              remark:
                type: str
                description: |-
                  Specify a comment. If remark is specified other keys of the entry are ignored.
              source:
                type: str
                description: |-
                  The value can be:
                  1. A single source address.
                  2. Source address with mask. e.g. '10.0.0.1/8'.
                  3. 'any' source address.
              vlan:
                type: int
                description: Match packets by VLAN value.
                convert_types:
                  - str
              vlan_mask:
                type: str
                description: VLAN mask. Range 0x000-0xFFF. Required when `vlan` is defined.
              inner_vlan:
                type: int
                description: Match packets by inner VLAN value.
                convert_types:
                  - str
              inner_vlan_mask:
                type: str
                description: Inner VLAN mask. Range 0x000-0xFFF. Required when `inner_vlan` is defined.
              log:
                type: bool
                description: Enable logging when a packet matches the ACL rule.
              mirror_session:
                type: str
                description: Mirror session to mirror matches against this rule.
        sequence_numbers:
          type: list
          deprecation:
            warning: true
            removed: false
            remove_in_version: 7.0.0
            new_key: entries
          primary_key: sequence
          items:
            type: dict
            keys:
              sequence:
                type: int
                description: Sequence ID.
                convert_types:
                  - str
              action:
                type: str
                required: true
                description: |
                  Action as string.
                  Example: "deny ip any any"
