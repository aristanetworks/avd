# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
$defs:
  source_interface_per_vrf:
    type: dict
    keys:
      source_interface:
        type: str
        description: Define `source_interface` for VRF default.
      vrfs:
        type: list
        primary_key: name
        description: Define `source interfaces` for any VRF other than default.
        items:
          type: dict
          keys:
            name:
              type: str
            source_interface:
              type: str
              required: true
