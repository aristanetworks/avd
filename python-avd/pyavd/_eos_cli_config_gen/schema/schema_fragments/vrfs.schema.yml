# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  vrfs:
    type: list
    primary_key: name
    description: |
      These keys are ignored if the name of the vrf is 'default'.
    items:
      type: dict
      keys:
        name:
          type: str
          description: VRF Name.
          convert_types:
            - int
        description:
          type: str
        ip_routing:
          type: bool
        ipv6_routing:
          type: bool
        ip_routing_ipv6_interfaces:
          type: bool
        metadata:
          type: dict
          description: |-
            The data under `metadata` is used for documentation, validation or integration purposes.
            It will not affect the generated EOS configuration.

          keys:
            tenants:
              type: list
              description: Key only used for documentation or validation purposes.
              items:
                type: str
