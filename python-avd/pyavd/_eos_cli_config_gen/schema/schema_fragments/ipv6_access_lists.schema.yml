# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  ipv6_access_lists:
    type: list
    primary_key: name
    display_name: IPv6 Extended Access-Lists
    items:
      type: dict
      keys:
        name:
          type: str
          description: IPv6 Access-list Name.
          convert_types: [ int ]
        counters_per_entry:
          type: bool
        entries:
          type: list
          description: ACL Entries.
          items:
            type: dict
            $ref: "eos_cli_config_gen#/$defs/access_list_entry"
            keys:
              protocol:
                type: str
                description: |-
                  "ipv6", "tcp", "udp", "icmpv6" or other protocol name or number.
                  Required except for remarks.
              source:
                type: str
                description: |-
                  "any", "<ipv6>/<mask>" or "<ipv6>".
                  "<ipv6>" without a mask means host.
                  Required except for remarks.
              destination:
                type: str
                description: |-
                  "any", "<ipv6>/<mask>" or "<ipv6>".
                  "<ipv6>" without a mask means host.
                  Required except for remarks.
              hop_limit:
                type: int
                convert_types:
                  - str
                min: 0
                description: Match Hop Limit value.
              hop_limit_match:
                type: str
                valid_values:
                  - "eq"
                  - "gt"
                  - "lt"
                  - "neq"
                default: "eq"
              dscp_mask:
                type: str
                convert_types:
                  - int
                description: DSCP mask ranges from 0x00 to 0x3F.
              inner_vlan_number:
                type: int
                convert_types:
                  - str
              inner_vlan_mask:
                type: str
                description: 0x000-0xFFF inner VLAN mask.
        sequence_numbers:
          deprecation:
            warning: true
            removed: false
            remove_in_version: 7.0.0
          type: list
          primary_key: sequence
          items:
            type: dict
            keys:
              sequence:
                type: int
                description: Sequence ID.
                convert_types:
                  - str
              action:
                type: str
                required: true
                description: |
                  Action as string.
                  Example: "deny ipv6 any any"
