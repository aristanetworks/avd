# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  ipv6_access_lists:
    type: list
    primary_key: name
    display_name: IPv6 Extended Access-Lists
    items:
      type: dict
      keys:
        name:
          type: str
          description: IPv6 Access-list Name.
          convert_types: [ int ]
        counters_per_entry:
          type: bool
        entries:
          type: list
          description: ACL Entries.
          items:
            type: dict
            keys:
              sequence:
                type: int
                convert_types:
                  - str
                description: ACL entry sequence number.
              remark:
                type: str
                description: |-
                  Comment up to 100 characters.
                  If remark is defined, other keys in the ACL entry will be ignored.
              action:
                type: str
                valid_values:
                  - "permit"
                  - "deny"
                description: |-
                  ACL action.
                  Required except for remarks.
              protocol:
                type: str
                description: |-
                  "ipv6", "tcp", "udp", "icmpv6" or other protocol name or number.
                  Required except for remarks.
              source:
                type: str
                description: |-
                  "any", "<ipv6>/<mask>" or "<ipv6>".
                  "<ipv6>" without a mask means host.
                  Required except for remarks.
              source_ports_match:
                type: str
                valid_values:
                  - "eq"
                  - "gt"
                  - "lt"
                  - "neq"
                  - "range"
                default: "eq"
              source_ports:
                type: list
                min_length: 1
                items:
                  type: str
                  convert_types:
                    - int
                  description: TCP/UDP source port name or number.
              destination:
                type: str
                description: |-
                  "any", "<ipv6>/<mask>" or "<ipv6>".
                  "<ipv6>" without a mask means host.
                  Required except for remarks.
              destination_ports_match:
                type: str
                valid_values:
                  - "eq"
                  - "gt"
                  - "lt"
                  - "neq"
                  - "range"
                default: "eq"
              destination_ports:
                type: list
                min_length: 1
                items:
                  type: str
                  convert_types:
                    - int
                  description: TCP/UDP destination port name or number.
              tcp_flags:
                type: list
                items:
                  type: str
                  description: TCP Flag Name.
              log:
                type: bool
                description: Log matches against this rule.
              icmp_type:
                type: str
                convert_types:
                  - int
                description: Message type name/number for ICMP packets.
              icmp_code:
                type: str
                convert_types:
                  - int
                description: Message code for ICMP packets.
              hop_limit:
                type: int
                convert_types:
                  - str
                min: 0
                description: Match Hop Limit value.
              hop_limit_match:
                type: str
                valid_values:
                  - "eq"
                  - "gt"
                  - "lt"
                  - "neq"
                default: "eq"
              nexthop_group:
                type: str
                description: nexthop-group name.
              tracked:
                type: bool
                description: Match packets in existing ICMP/UDP/TCP connections.
              dscp:
                type: str
                convert_types:
                  - int
                description: DSCP value or name.
              dscp_mask:
                type: str
                convert_types:
                  - int
                description: DSCP mask ranges from 0x00 to 0x3F.
              vlan_number:
                type: int
                convert_types:
                  - str
              vlan_inner:
                type: bool
                default: false
              vlan_mask:
                type: str
                description: 0x000-0xFFF VLAN mask.
        sequence_numbers:
          deprecation:
            warning: true
            removed: false
            remove_in_version: 7.0.0
          type: list
          primary_key: sequence
          items:
            type: dict
            keys:
              sequence:
                type: int
                description: Sequence ID.
                convert_types:
                  - str
              action:
                type: str
                required: true
                description: |
                  Action as string.
                  Example: "deny ipv6 any any"
