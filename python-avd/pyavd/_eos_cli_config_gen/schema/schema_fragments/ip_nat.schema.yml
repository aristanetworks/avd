# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  ip_nat:
    type: dict
    keys:
      kernel_buffer_size:
        type: int
        min: 1
        max: 64
        description: Buffer size in MB.
      profiles:
        type: list
        primary_key: name
        items:
          type: dict
          $ref: "eos_cli_config_gen#/$defs/interface_ip_nat"
          keys:
            name:
              type: str
            vrf:
              type: str
              description: Specify VRF for NAT profile.
      pools:
        type: list
        primary_key: name
        items:
          type: dict
          keys:
            name:
              type: str
            type:
              type: str
              valid_values: ["ip-port", "port-only"]
              default: "ip-port"
            prefix_length:
              type: int
              min: 16
              max: 32
              description: It is only used and required when `type` is `ip-port`.
            ranges:
              type: list
              items:
                type: dict
                keys:
                  first_ip:
                    type: str
                    description: |-
                      IPv4 address.
                      Required when `type` is `ip-port` and ignored otherwise.
                  last_ip:
                    type: str
                    description: |-
                      IPv4 address.
                      Required when `type` is `ip-port` and ignored otherwise.
                      `first_ip` and `last_ip` ip addresses should lie in same subnet.
                  first_port:
                    type: int
                    min: 1
                    max: 65535
                  last_port:
                    type: int
                    min: 1
                    max: 65535
                    description: |-
                      Required when `first_port` is set.
                      `last_port` must be greater than or equal to `first_port`.
            utilization_log_threshold:
              type: int
              min: 1
              max: 100
      synchronization:
        type: dict
        keys:
          description:
            type: str
          expiry_interval:
            type: int
            min: 60
            max: 3600
            description: In seconds.
          local_interface:
            type: str
            description: EOS interface name.
          peer_address:
            type: str
            description: IPv4 address.
          port_range:
            type: dict
            keys:
              first_port:
                type: int
                min: 1024
                max: 65535
              last_port:
                type: int
                min: 1024
                max: 65535
                description: '>= first_port.'
              split_disabled:
                type: bool
          shutdown:
            type: bool
      translation:
        type: dict
        keys:
          address_selection:
            type: dict
            keys:
              any:
                type: bool
              hash_field_source_ip:
                type: bool
          counters:
            type: bool
          low_mark:
            type: dict
            keys:
              percentage:
                type: int
                min: 1
                max: 99
                description: "Used to render 'ip nat translation low-mark <percentage>'."
              host_percentage:
                type: int
                min: 1
                max: 99
                description: "Used to render 'ip nat translation low-mark <host_percentage> host'."
          max_entries:
            type: dict
            keys:
              limit:
                type: int
                min: 0
                max: 4294967295
              host_limit:
                type: int
                min: 0
                max: 4294967295
              ip_limits:
                type: list
                primary_key: ip
                items:
                  type: dict
                  keys:
                    ip:
                      type: str
                      description: IPv4 address.
                    limit:
                      type: int
                      required: true
                      min: 0
                      max: 4294967295
          timeouts:
            type: list
            primary_key: protocol
            items:
              type: dict
              keys:
                protocol:
                  type: str
                  valid_values: ["tcp", "udp"]
                timeout:
                  type: int
                  required: true
                  min: 0
                  max: 4294967295
                  description: In seconds.
