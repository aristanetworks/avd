# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  cvx:
    type: dict
    description: "CVX server features are not supported on physical switches. See `management_cvx` for client configurations."
    keys:
      shutdown:
        type: bool
      peer_hosts:
        type: list
        items:
          type: str
          description: IP address or hostname.
      services:
        type: dict
        keys:
          mcs:
            type: dict
            keys:
              redis:
                type: dict
                keys:
                  password:
                    type: str
                    description: Hashed password using the password_type.
                  password_type:
                    type: str
                    convert_types:
                      - int
                    valid_values: ["0", "7", "8a"]
                    default: "7"
              shutdown:
                type: bool
          vxlan:
            type: dict
            description: VXLAN Controller service.
            keys:
              shutdown:
                type: bool
              vtep_mac_learning:
                type: str
                valid_values:
                  - "control-plane"
                  - "data-plane"
          openstack:
            type: dict
            description: OpenStack services.
            keys:
              authentication:
                type: dict
                keys:
                  role:
                    type: str
                    description: API authentication user role.
              grace_period:
                type: int
                description: Set the grace period for which the OpenStack agent waits for OpenStack region data.
                min: 0
                max: 14400
                convert_types:
                  - str
              ip_access_group:
                type: dict
                keys:
                  name:
                    type: str
                    required: true
                  in:
                    type: bool
              ipv6_access_group:
                type: dict
                keys:
                  name:
                    type: str
                    required: true
                  in:
                    type: bool
              name_resolution:
                type: dict
                keys:
                  force:
                    type: bool
                    description: Get the tenant and VM names from OpenStack immediately.
                  interval:
                    type: int
                    min: 0
                    max: 86400
                    convert_types:
                      - str
                    description: Set the time interval in seconds between name updates, 0 to disable.
              network:
                type: dict
                keys:
                  type_driver:
                    type: dict
                    keys:
                      vlan:
                        type: str
                        valid_values:
                          - "arista"
                          - "default"
              region:
                type: list
                primary_key: name
                items:
                  type: dict
                  keys:
                    name:
                      description: The name of the region. This must match what is in use in the ML2 driver configuration.
                      type: str
                    username:
                      type: str
                      description: "'admin' or valid keystone user."
                    password:
                      type: str
                    password_type:
                      type: str
                      default: "7"
                      valid_values:
                        - "7"
                        - "8a"
                      convert_types:
                        - int
                    tenant:
                      type: str
                      description: Tenant name.
                    keystone:
                      type: dict
                      keys:
                        auth_url:
                          type: str
                          pattern: http(s?)://[a-zA-Z0-9.]+(:?\d+)?/v(2\.0|3)/
              shutdown:
                type: bool
