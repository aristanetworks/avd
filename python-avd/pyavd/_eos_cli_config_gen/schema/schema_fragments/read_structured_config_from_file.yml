# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  eos_cli_config_gen_read_structured_config_from_file:
    documentation_options:
      table: role-settings
    type: bool
    default: true
    description: |
      Read structured configuration from files in `eos_cli_config_gen_structured_dir`.
      If set to false, `eos_cli_config_gen` reads structured configuration from hostvars.
  read_structured_config_from_file:
    documentation_options:
      table: legacy-role-settings
    type: bool
    description: |
      Legacy alias for `eos_cli_config_gen_read_structured_config_from_file`.
