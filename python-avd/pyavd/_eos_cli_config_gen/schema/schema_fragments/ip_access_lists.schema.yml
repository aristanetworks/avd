# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  ip_access_lists:
    type: list
    primary_key: name
    display_name: IP Extended Access-Lists (improved model)
    items:
      type: dict
      keys:
        name:
          type: str
          description: Access-list Name.
          convert_types:
            - int
        counters_per_entry:
          type: bool
        entries:
          type: list
          description: ACL Entries.
          items:
            type: dict
            $ref: "eos_cli_config_gen#/$defs/access_list_entry"
            keys:
              sequence:
                type: int
              remark:
                type: str
              action:
                type: str
              protocol:
                type: str
                description: |-
                  "ip", "tcp", "udp", "icmp" or other protocol name or number.
                  Required except for remarks.
              source:
                type: str
                description: |-
                  "any", "<ip>/<mask>" or "<ip>".
                  "<ip>" without a mask means host.
                  Required except for remarks.
              destination:
                type: str
                description: |-
                  "any", "<ip>/<mask>" or "<ip>".
                  "<ip>" without a mask means host.
                  Required except for remarks.
              fragments:
                type: bool
                description: Match non-head fragment packets.
              ttl:
                type: int
                description: TTL value.
                convert_types:
                  - str
                min: 0
                max: 255
              ttl_match:
                type: str
                valid_values:
                  - "eq"
                  - "gt"
                  - "lt"
                  - "neq"
                default: "eq"
              vlan_inner:
                type: bool
                default: false
                description: |-
                  Render vlan and mask as inner vlan.
                  Both 'inner_vlan_number' and 'inner_vlan_mask' are required when migrating to the new keys.
                deprecation:
                  warning: true
                  removed: false
                  remove_in_version: 7.0.0
                  new_key: inner_vlan_number
        permit_response_traffic:
          type: str
          valid_values:
            - nat
          description: |-
            Permit response traffic automatically based on NAT translations.
            Minimum EOS version requirement 4.32.2F.
