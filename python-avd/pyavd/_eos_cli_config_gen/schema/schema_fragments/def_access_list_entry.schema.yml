# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
$defs:
  access_list_entry:
    type: dict
    keys:
      sequence:
        type: int
        convert_types:
          - str
        description: ACL entry sequence number.
      remark:
        type: str
        description: |-
          Comment up to 100 characters.
          If remark is defined, other keys in the ACL entry will be ignored.
      action:
        type: str
        valid_values:
          - "permit"
          - "deny"
        description: |-
          ACL action.
          Required except for remarks.
      source_ports_match:
        type: str
        valid_values:
          - "eq"
          - "gt"
          - "lt"
          - "neq"
          - "range"
        default: "eq"
      source_ports:
        type: list
        min_length: 1
        items:
          type: str
          convert_types:
            - int
          description: TCP/UDP source port name or number.
      destination_ports_match:
        type: str
        valid_values:
          - "eq"
          - "gt"
          - "lt"
          - "neq"
          - "range"
        default: "eq"
      destination_ports:
        type: list
        min_length: 1
        items:
          type: str
          convert_types:
            - int
          description: TCP/UDP destination port name or number.
      tcp_flags:
        type: list
        items:
          type: str
          description: TCP Flag Name.
      log:
        type: bool
        description: |-
          Log matches against this rule.
          Mutually exclusive with `copy_captive_portal`. `copy_captive_portal` takes precedence.
      icmp_type:
        type: str
        convert_types:
          - int
        description: Message type name/number for ICMP packets.
      icmp_code:
        type: str
        convert_types:
          - int
        description: Message code for ICMP packets.
      nexthop_group:
        type: str
        description: nexthop-group name.
      tracked:
        type: bool
        description: Match packets in existing ICMP/UDP/TCP connections.
      dscp:
        type: str
        convert_types:
          - int
        description: DSCP value or name.
      vlan_number:
        type: int
        convert_types:
          - str
      vlan_mask:
        type: str
        description: 0x000-0xFFF VLAN mask.
      inner_vlan_number:
        type: int
        convert_types:
          - str
      inner_vlan_mask:
        type: str
        description: 0x000-0xFFF inner VLAN mask. This field is required when `inner_vlan_number` is set.
