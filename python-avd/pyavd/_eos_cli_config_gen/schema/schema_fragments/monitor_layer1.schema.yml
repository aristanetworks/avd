# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  monitor_layer1:
    type: dict
    description: "Enable SYSLOG messages on transceiver SMBus communication failures."
    keys:
      enabled:
        type: bool
        description: Enable monitor layer1.
        # TODO: Remove this key in AVD 7.0 version.
        # The `enabled` key is not required to render the `monitor layer1` CLI block when `eos_config_future.render_monitor_layer1_without_enabled` is true.
        # The `monitor layer1` CLI block will be rendered if any of the following sub-settings are set to `true`: `logging_mac_fault`, `logging_transceiver.dom`, `logging_transceiver.communication` or `logging_transceiver.enabled`.
      logging_mac_fault:
        type: bool
        description: "Enable MAC fault logging."
      logging_transceiver:
        type: dict
        description: "Configure transceiver monitoring logging."
        keys:
          dom:
            type: bool
            description: "Enable transceiver Digital Optical Monitoring (DOM) logging."
          communication:
            type: bool
            description: "Enable transceiver SMBus fail and reset logging."
          enabled:
            type: bool
            description: Some platforms support only the `logging transceiver` command. `enabled` key configures this command.
