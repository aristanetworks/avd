# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  radius_server:
    type: dict
    keys:
      attribute_32_include_in_access_req:
        type: dict
        keys:
          hostname:
            type: bool
          format:
            type: str
            description: Specify the format of the NAS-Identifier. If 'hostname' is set, this is ignored.
      deadtime:
        description: Time to skip a non-responsive server in minutes.
        type: int
        convert_types:
          - str
        min: 1
        max: 1000
      dynamic_authorization:
        type: dict
        keys:
          port:
            type: int
            min: 0
            max: 65535
            convert_types:
              - str
            description: TCP Port.
          tls_ssl_profile:
            type: str
            description: Name of TLS profile.
      servers:
        type: list
        description: Hosts configuration for VRF default.
        items:
          type: dict
          keys:
            host:
              type: str
              required: true
              description: ->
                Host IP address or name.
                Multiple server with the same hostname/IP address can be configured for TLS and no TLS.
            tls:
              type: dict
              description: When TLS is configured, `key` is ignored.
              keys:
                enabled:
                  type: bool
                  description: Enable TLS for radius-server.
                ssl_profile:
                  type: str
                  description: Name of TLS profile.
                port:
                  type: int
                  min: 0
                  max: 65535
                  convert_types:
                    - str
                  description: TCP Port used for TLS. EOS default is 2083.
            timeout:
              type: int
              min: 1
              max: 1000
              convert_types:
                - str
            retransmit:
              type: int
              min: 0
              max: 100
              convert_types:
                - str
            key:
              type: str
              description: |-
                Encrypted key.
                When TLS is configured, `key` is ignored.
            key_type:
              type: str
              convert_types:
                - int
              valid_values: ["0", "7", "8a"]
              default: "7"
      vrfs:
        type: list
        primary_key: name
        items:
          type: dict
          keys:
            name:
              type: str
              convert_types:
                - int
              description: Non-defualt VRF name.
            servers:
              type: list
              required: true
              $ref: "eos_cli_config_gen#/keys/radius_server/keys/servers"
      tls_ssl_profile:
        type: str
        description: Name of global TLS profile.
