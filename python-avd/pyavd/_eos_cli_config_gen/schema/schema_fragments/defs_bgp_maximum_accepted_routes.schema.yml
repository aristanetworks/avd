# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
$defs:
  maximum_accepted_routes:
    type: dict
    keys:
      limit:
        type: int
        description: Maximum number of routes (0 means unlimited) that can be accepted from the BGP neighbor.
        min: 0
        max: 4294967294
        required: true
      warning_limit:
        type: dict
        description: Warning threshold for the maximum number of accepted routes.
        keys:
          count:
            type: int
            description: Maximum number of routes after which a warning is issued (0 means never warn). Mutually exclusive with `percent`. `count` takes precedence.
            min: 0
            max: 4294967294
          percent:
            type: int
            description: Percentage of the maximum number of accepted routes at which a warning is issued. Mutually exclusive with `count`. `count` takes precedence.
            min: 1
            max: 100
