# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  management_ldap:
    type: dict
    keys:
      server_defaults:
        type: dict
        description: Default LDAP options applied to all servers unless overridden per host.
        keys:
          base_dn:
            type: str
            description: Base Distinguished Name used for LDAP searches (e.g., dc=example,dc=com).
          rdn_attribute_user:
            type: str
            description: Relative Distinguished Name attribute(s) for user lookup (e.g., cn).
          ssl_profile:
            type: str
            description: SSL profile name to secure LDAP connections.
          authorization_group_policy:
            type: str
            description: LDAP group policy name to use for user authorization.
          timeout:
            type: int
            min: 1
            max: 1000
            description: Time in seconds (EOS default 30 seconds) to wait for a response from this LDAP server.
          search:
            type: dict
            description: Credentials used by the switch to perform LDAP search bind operations.
            keys:
              username:
                type: str
                required: true
                description: LDAP username (DN) for search bind operations (e.g., cn=ldap-admin,dc=example,dc=com).
              password:
                type: str
                required: true
                description: Password for the search bind user.
                convert_types:
                  - int
              password_type:
                type: str
                valid_values:
                  - "0"
                  - "7"
                  - "8a"
                description: |-
                  Password encryption type.
                  - 0 = clear text
                  - 7 = obfuscated
                  - 8a = AES-256-GCM encrypted.
                  Omit to provide an unobfuscated string (EOS will store it obfuscated).
                convert_types:
                  - int
      server_hosts:
        type: list
        primary_key: host
        description: List of LDAP server hosts.
        items:
          type: dict
          $ref: "eos_cli_config_gen#/keys/management_ldap/keys/server_defaults"
          keys:
            host:
              type: str
              description: Hostname or IP address of the LDAP server.
            port:
              type: int
              description: Port of LDAP server (EOS default 389).
              min: 0
              max: 65535
            vrf:
              type: str
              convert_types:
                - int
      group_policies:
        type: list
        primary_key: policy
        description: Named LDAP group policies that map LDAP groups to EOS roles and privilege levels.
        items:
          type: dict
          keys:
            policy:
              type: str
              description: Group policy name. Referenced by server authorization_group_policy.
            search_filter:
              type: dict
              description: LDAP search filter used to enumerate group membership.
              keys:
                objectclass:
                  type: str
                  required: true
                  description: LDAP objectclass value to match (e.g., group).
                attribute:
                  type: str
                  required: true
                  description: LDAP attribute that holds group member DNs (e.g., member).
            groups:
              type: list
              primary_key: name
              description: List of LDAP group-to-role mappings within this policy.
              items:
                type: dict
                keys:
                  name:
                    type: str
                    description: LDAP group name. Quoted strings are supported for names containing spaces (e.g., "Network Admin").
                  role:
                    type: str
                    required: true
                    description: EOS role assigned to members of this LDAP group.
                  privilege:
                    type: int
                    min: 0
                    max: 15
                    description: Optional privilege level (0-15) assigned alongside the role.
