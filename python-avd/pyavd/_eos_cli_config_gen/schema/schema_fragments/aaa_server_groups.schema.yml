# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  aaa_server_groups:
    type: list
    primary_key: name
    items:
      type: dict
      keys:
        name:
          description: |-
            Group name.
            The group names `radius`, `tacacs+` and `ldap` are reserved by EOS and must not be used.
          type: str
          pattern: "^(?:radius.+|radiu[^s].*|radi[^u].*|rad[^i].*|ra[^d].*|r[^a].*|tacacs\\+.+|tacacs[^+].*|tacac[^s].*|taca[^c].*|tac[^a].*|ta[^c].*|t[^a].*|ldap.+|lda[^p].*|ld[^a].*|l[^d].*|[^rtl].*|r|ra|rad|radi|radiu|t|ta|tac|taca|tacac|tacacs|l|ld|lda)$"
        type:
          type: str
          valid_values: ["tacacs+", "radius", "ldap"]
          required: true
        servers:
          type: list
          items:
            type: dict
            keys:
              server:
                type: str
                description: Hostname or IP address.
                required: true
              vrf:
                type: str
                description: VRF name.
                convert_types:
                  - int
