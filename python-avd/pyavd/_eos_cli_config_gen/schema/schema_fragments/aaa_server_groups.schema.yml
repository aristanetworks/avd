# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  aaa_server_groups:
    type: list
    primary_key: name
    items:
      type: dict
      keys:
        name:
          description: |-
            Group name.
            The group names `radius`, `tacacs+` and `ldap` are reserved by EOS and must not be used.
          type: str
          pattern: "^(?!radius$|tacacs\\+$|ldap$).+$"
        type:
          type: str
          valid_values: ["tacacs+", "radius", "ldap"]
          required: true
        servers:
          type: list
          items:
            type: dict
            keys:
              server:
                type: str
                description: Hostname or IP address.
                required: true
              vrf:
                type: str
                description: VRF name.
                convert_types:
                  - int
              tls:
                type: dict
                description: TLS settings for the RADIUS group server. Only applicable when the parent server group type is 'radius'.
                keys:
                  enabled:
                    type: bool
                    description: Enable TLS to secure communication with the RADIUS group server.
                    required: true
                  port:
                    type: int
                    min: 1
                    max: 65535
                    convert_types:
                      - str
                    description: TCP port used for TLS-secured RADIUS communication. Overrides the default RadSec port (EOS default is 2083).
