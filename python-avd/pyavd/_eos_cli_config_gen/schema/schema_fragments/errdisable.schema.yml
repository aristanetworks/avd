# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  errdisable:
    type: dict
    keys:
      detect:
        type: dict
        keys:
          causes:
            type: list
            items:
              type: str
              description: |-
                Specifies the events that should trigger this action.
                Supported values align with EOS 4.35.0F
              valid_values:
                - "acl"
                - "arp-inspection"
                - "dot1x-coa"
                - "dot1x-phone-classification"
                - "dot1x-session-replace"
                - "link-change"
                - "stp-no-portid"
                - "tapagg"
      recovery:
        type: dict
        keys:
          causes:
            type: list
            primary_key: name
            items:
              type: dict
              keys:
                name:
                  type: str
                  description: |-
                    Specifies the type of event that can trigger recovery actions.
                    Supported values align with EOS 4.35.0F
                  valid_values:
                    - "acl"
                    - "arp-inspection"
                    - "bpduguard"
                    - "dot1x-coa"
                    - "dot1x-phone-classification"
                    - "dot1x-session-replace"
                    - "hitless-reload-down"
                    - "link-flap"
                    - "no-internal-vlan"
                    - "stp-no-portid"
                    - "tapagg"
                    - "uplink-failure-detection"
                interval:
                  type: int
                  description: |-
                    Interval for each recovery cause in seconds.
                  min: 30
                  max: 86400
                  convert_types:
                    - str
          interval:
            type: int
            convert_types:
              - "str"
            description: Interval in seconds.
            min: 30
            max: 86400
