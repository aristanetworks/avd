# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  errdisable:
    type: dict
    keys:
      detect:
        type: dict
        keys:
          causes:
            type: list
            items:
              type: str
              description: |-
                Specifies the events that should trigger this action.
                The list of supported causes depends on both the EOS version and the hardware platform.
              valid_values:
                - "acl"
                - "arp-inspection"
                - "dot1x"
                - "dot1x-coa"
                - "dot1x-phone-classification"
                - "dot1x-session-replace"
                - "error-correction-encoding"
                - "hardware-speed-group"
                - "interface-speed"
                - "internal-error"
                - "link-change"
                - "port-breakout"
                - "storm-control"
                - "switchcard-unreachable"
                - "tapagg"
                - "transceiver-adapter"
                - "xcvr-misconfigured"
                - "xcvr-overheat"
                - "xcvr-power-unsupported"
        deprecation:
          warning: true
          removed: false
          remove_in_version: 7.0.0
          new_key: detect_cause
      detect_cause:
        type: dict
        description: |-
          Specifies the events that should trigger this action.
          The list of supported causes depends on both the EOS version and the hardware platform.
        keys:
          acl:
            type: bool
            description: Enable/Disable detection for ACL errors.
          arp_inspection:
            type: bool
            description: Enable/Disable detection for ARP inspection errors.
          dot1x:
            type: bool
            description: Enable/Disable detection for 802.1X errors.
          dot1x_coa:
            type: bool
            description: Enable/Disable detection for 802.1X Change of Authorization errors.
          dot1x_phone_classification:
            type: bool
            description: Enable/Disable detection for 802.1X phone classification errors.
          dot1x_session_replace:
            type: bool
            description: Enable/Disable detection for 802.1X session replace errors.
          error_correction_encoding:
            type: bool
            description: Enable/Disable detection for error correction encoding errors.
          hardware_speed_group:
            type: bool
            description: Enable/Disable detection for hardware speed group errors.
          interface_speed:
            type: bool
            description: Enable/Disable detection for interface speed errors.
          internal_error:
            type: bool
            description: Enable/Disable detection for internal errors.
          link_change:
            type: bool
            description: Enable/Disable detection for link change errors.
          port_breakout:
            type: bool
            description: Enable/Disable detection for port breakout errors.
          storm_control:
            type: bool
            description: Enable/Disable detection for storm control errors.
          switchcard_unreachable:
            type: bool
            description: Enable/Disable detection for switchcard unreachable errors.
          tapagg:
            type: bool
            description: Enable/Disable detection for tap aggregation errors.
          transceiver_adapter:
            type: bool
            description: Enable/Disable detection for transceiver adapter errors.
          xcvr_misconfigured:
            type: bool
            description: Enable/Disable detection for transceiver misconfiguration errors.
          xcvr_overheat:
            type: bool
            description: Enable/Disable detection for transceiver overheat errors.
          xcvr_power_unsupported:
            type: bool
            description: Enable/Disable detection for unsupported transceiver power errors.
      recovery:
        type: dict
        deprecation:
          warning: true
          removed: false
          remove_in_version: 7.0.0
          new_key: recovery_cause or recovery_interval
        keys:
          causes:
            type: list
            primary_key: name
            items:
              type: dict
              keys:
                name:
                  type: str
                  description: |-
                    Specifies the type of event that can trigger recovery actions.
                    The list of supported causes depends on both the EOS version and the hardware platform.
                  valid_values:
                    - "acl"
                    - "arp-inspection"
                    - "bpduguard"
                    - "dot1x"
                    - "dot1x-coa"
                    - "dot1x-phone-classification"
                    - "dot1x-session-replace"
                    - "error-correction-encoding"
                    - "hardware-speed-group"
                    - "hitless-reload-down"
                    - "interface-speed"
                    - "internal-error"
                    - "lacp-rate-limit"
                    - "link-flap"
                    - "no-internal-vlan"
                    - "port-breakout"
                    - "portchannelguard"
                    - "portsec"
                    - "speed-misconfigured"
                    - "storm-control"
                    - "stuck-queue"
                    - "switchcard-unreachable"
                    - "tap-port-init"
                    - "tapagg"
                    - "transceiver-adapter"
                    - "uplink-failure-detection"
                    - "xcvr-misconfigured"
                    - "xcvr-overheat"
                    - "xcvr-power-unsupported"
                    - "xcvr-unsupported"
                interval:
                  type: int
                  description: |-
                    Interval for each recovery cause in seconds.
                  min: 30
                  max: 86400
                  convert_types:
                    - str
          interval:
            type: int
            convert_types:
              - "str"
            description: Interval in seconds.
            min: 30
            max: 86400
      recovery_cause:
        type: dict
        description: |-
          Specifies the type of event that can trigger recovery actions.
          The list of supported causes depends on both the EOS version and the hardware platform.
        keys:
          acl:
            type: dict
            description: Recovery settings for ACL errors.
            keys:
              enabled:
                type: bool
                description: Enable recovery for ACL errors.
              interval:
                type: int
                description: Interval for ACL recovery in seconds.
                min: 30
                max: 86400
                convert_types:
                  - str
          arp_inspection:
            type: dict
            description: Recovery settings for ARP inspection errors.
            keys:
              enabled:
                type: bool
                description: Enable recovery for ARP inspection errors.
              interval:
                type: int
                description: Interval for ARP inspection recovery in seconds.
                min: 30
                max: 86400
                convert_types:
                  - str
          bpduguard:
            type: dict
            description: Recovery settings for BPDU guard errors.
            keys:
              enabled:
                type: bool
                description: Enable recovery for BPDU guard errors.
              interval:
                type: int
                description: Interval for BPDU guard recovery in seconds.
                min: 30
                max: 86400
                convert_types:
                  - str
          dot1x:
            type: dict
            description: Recovery settings for 802.1X errors.
            keys:
