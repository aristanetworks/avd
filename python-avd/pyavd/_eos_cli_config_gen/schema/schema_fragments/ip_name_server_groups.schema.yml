# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  ip_name_server_groups:
    type: list
    primary_key: name
    items:
      type: dict
      keys:
        name:
          type: str
        vrfs:
          type: list
          primary_key: name
          items:
            type: dict
            keys:
              name:
                type: str
                convert_types:
                  - int
                description: VRF name. Use "default" for the default VRF.
              name_servers:
                type: list
                required: true
                primary_key: ip_address
                min_length: 1
                items:
                  type: dict
                  keys:
                    ip_address:
                      type: str
                      description: IPv4 or IPv6 address for DNS server.
                    priority:
                      description: Priority value (lower is first).
                      type: int
                      convert_types:
                        - str
                      min: 0
                      max: 15
        name_servers:
          type: list
          primary_key: ip_address
          allow_duplicate_primary_key: true
          deprecation:
            warning: true
            removed: false
            remove_in_version: 7.0.0
          items:
            type: dict
            keys:
              ip_address:
                type: str
                description: IPv4 or IPv6 address for DNS server.
              vrf:
                description: VRF Name.
                type: str
                required: true
                convert_types:
                  - int
              priority:
                description: Priority value (lower is first).
                type: int
                convert_types:
                  - str
                min: 0
                max: 15
        dns_domain:
          type: str
        ip_domain_lists:
          type: list
          description: Set domain names to complete unqualified host names.
          items:
            type: str
        ip_domain_list:
          type: str
          description: Set domain names to complete unqualified host names.
          deprecation:
            removed: true
            warning: true
            new_key: ip_domain_lists
            remove_in_version: 6.0.0
