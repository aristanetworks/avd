# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  dhcp_relay:
    type: dict
    keys:
      servers:
        type: list
        items:
          type: str
          description: Server IP or Hostname.
      tunnel_requests_disabled:
        type: bool
      mlag_peerlink_requests_disabled:
        type: bool
      client_requests:
        type: dict
        description: Configure DHCP client request settings.
        keys:
          flooding_suppression_vlans:
            type: list
            description: Disable DHCP request flooding to other interfaces in VLAN.
            items:
              type: str
              description: |
                VLAN ID or range(s) of VLAN IDs, <1-4094>.
                Example:
                  - 1000
                  - 500-510
                  - 2000,3000
