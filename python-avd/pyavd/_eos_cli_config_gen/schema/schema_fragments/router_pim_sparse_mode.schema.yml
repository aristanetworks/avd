# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  router_pim_sparse_mode:
    type: dict
    keys:
      ipv4:
        type: dict
        keys:
          bfd:
            type: bool
            description: Enable/Disable BFD.
          make_before_break:
            type: bool
            description: Enable/Disable Make-Before-Break.
          message_hello_address_secondary_ipv6:
            type: bool
            description: Allow PIM IPv4 over IPv6 nexthop.
          ssm_range:
            type: str
            description: IPv4 Prefix associated with SSM.
          register_local_interface:
            type: str
            description: |-
              Local interface to use for PIM register messages.
          rp_addresses:
            type: list
            primary_key: address
            allow_duplicate_primary_key: true
            items:
              type: dict
              keys:
                address:
                  type: str
                  description: RP Address.
                groups:
                  type: list
                  items:
                    type: str
                access_lists:
                  type: list
                  items:
                    type: str
                priority:
                  type: int
                  min: 0
                  max: 255
                hashmask:
                  type: int
                  min: 0
                  max: 32
                override:
                  type: bool
          anycast_rps:
            type: list
            # TODO AVD7.0: min_length: 1
            primary_key: address
            items:
              type: dict
              keys:
                address:
                  type: str
                  description: Anycast RP Address.
                other_anycast_rp_addresses:
                  type: list
                  # TODO AVD7.0: min_length: 1
                  primary_key: address
                  items:
                    type: dict
                    keys:
                      address:
                        type: str
                        description: Other Anycast RP Address.
                      register_count:
                        type: str
                        description: |-
                          Number of registers to forward before pausing in range of 0 to 4294967295.
                          Use 'infinity' to forward all registers.
                        convert_types:
                          - int
      vrfs:
        type: list
        primary_key: name
        items:
          type: dict
          keys:
            name:
              type: str
              description: VRF Name.
              convert_types:
                - int
            ipv4:
              type: dict
              keys:
                bfd:
                  type: bool
                  description: Enable/Disable BFD.
                make_before_break:
                  type: bool
                  description: Enable/Disable Make-Before-Break.
                register_local_interface:
                  type: str
                  description: |-
                    Local interface to use for PIM register messages.
                rp_addresses:
                  type: list
                  items:
                    type: dict
                    keys:
                      address:
                        type: str
                        description: RP Address.
                        required: true
                      groups:
                        type: list
                        items:
                          type: str
                      access_lists:
                        type: list
                        items:
                          type: str
                      priority:
                        type: int
                        min: 0
                        max: 255
                      hashmask:
                        type: int
                        min: 0
                        max: 32
                      override:
                        type: bool
                anycast_rps:
                  type: list
                  $ref: "eos_cli_config_gen#/keys/router_pim_sparse_mode/keys/ipv4/keys/anycast_rps"
                ssm_range:
                  type: str
                  description: |-
                    Standard access list name or use the specific keyword 'standard' as a shortcut to apply
                    a predefined rule that permits the 232.0.0.0/8 range for SSM traffic.
