# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
$defs:
  detect_and_recovery:
    type: dict
    keys:
      detection:
        type: bool
      recovery:
        type: bool
      recovery_interval:
        type: int
        description: |-
          Interval for recovery cause in seconds.
        min: 30
        max: 86400
        convert_types:
          - str
keys:
  errdisable_settings:
    type: dict
    documentation_options:
      table: system-settings
    description: |-
      Errdisable settings for the device.
      Causes are filtered based on platform feature support defined in
      `platform_settings.feature_support.errdisable_causes.<cause>.detection` and
      `platform_settings.feature_support.errdisable_causes.<cause>.recovery`.
    keys:
      causes:
        type: dict
        keys:
          acl:
            type: dict
            $ref: "eos_designs#/$defs/detect_and_recovery"
          arp_inspection:
            type: dict
            $ref: "eos_designs#/$defs/detect_and_recovery"
          bpduguard:
            type: dict
            keys:
              recovery:
                type: bool
              recovery_interval:
                type: int
                description: |-
                  Interval for recovery cause in seconds.
                min: 30
                max: 86400
                convert_types:
                  - str
          dot1x:
            type: dict
            $ref: "eos_designs#/$defs/detect_and_recovery"
          dot1x_coa:
            type: dict
            $ref: "eos_designs#/$defs/detect_and_recovery"
          dot1x_phone_classification:
            type: dict
            $ref: "eos_designs#/$defs/detect_and_recovery"
          dot1x_session_replace:
            type: dict
            $ref: "eos_designs#/$defs/detect_and_recovery"
          error_correction_encoding:
            type: dict
            $ref: "eos_designs#/$defs/detect_and_recovery"
          hardware_speed_group:
