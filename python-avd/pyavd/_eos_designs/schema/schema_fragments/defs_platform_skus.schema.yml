# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
$defs:
  platform_skus:
    type: list
    primary_key: name
    items:
      type: dict
      keys:
        name:
          type: str
          description: Arista SKU name.
        platform_family:
          type: str
          description: Inherit settings from platform family name defined under `platform_families`.
          required: true
        poe:
          type: bool
          default: false
          description: |-
            Support for PoE.
            The feature will be ignored on platforms where this is false.
