# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  avd_design_future:
    type: dict
    description: |-
      Opt-in to AVD 7 behaviors. These behaviors will be the default behaviors in AVD 7.0.
    documentation_options:
      table: role-settings
    deprecation:
      warning: false
      remove_in_version: 7.0.0
    keys:
      bgp_always_disable_ipv4_unicast_for_peer_groups:
        type: bool
        description: |-
          Deactivate the IPv4 unicast Address Family for BGP Peer Groups even when IPv4 is not activated by default.
        # TODO AVD 7.0 change the default to false.
        default: true
