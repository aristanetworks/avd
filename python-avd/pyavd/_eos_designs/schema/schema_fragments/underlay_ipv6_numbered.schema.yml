type: dict
keys:
  underlay_ipv6_numbered:
    documentation_options:
      table: fabric-settings
    description: |
      This feature allows pure IPv6 underlay routing protocol with numbered addresses.
      Sets the underlay and overlay (EVPN) to use IPv6 addresses.
      Currently BGP peer-groups are named with IPv4 by default. This can be modified under `bgp_peer_groups`.
      Requires (fabric-level):
        - "underlay_ipv6: true"
        - "loopback_ipv6_pool"
        - "underlay_routing_protocol: ebgp"
      Requires (node-level, on each node, node group, or type defaults):
        - "uplink_ipv6_pool" (or `downlink_pools` on the upstream node) for underlay P2P links.
        - "vtep_loopback_ipv6_pool" on VTEPs.
        - "router_id_pool" (an IPv4 subnet, used only for BGP router-id allocation).
      For MLAG, the peer-link SVI uses IPv4 by default. To run the MLAG peer-link over IPv6, also set on the MLAG nodes:
        - "mlag_peer_address_family: ipv6"
        - "mlag_peer_ipv6_pool" (peer-link SVI)
        - "mlag_peer_l3_ipv6_pool" (L3 peering when `mlag_peer_l3_vlan` is enabled)
      Some settings are not yet supported with IPv6 underlay:
        - underlay_multicast_pim_sm
        - underlay_multicast_rp_interfaces
        - underlay_rfc5549
        - wan_role
        - vtep_vvtep_ip
        - inband_ztp
    type: bool
    default: false
