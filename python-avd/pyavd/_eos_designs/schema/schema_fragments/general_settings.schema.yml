# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  general_settings:
    type: dict
    documentation_options:
      table: system-settings
    keys:
      interface_defaults:
        type: dict
        keys:
          ethernet_shutdown:
            type: bool
            default: false
            description: Shutdown Ethernet interfaces by default unless they are explicitly enabled.
      arp:
        type: dict
        keys:
          persistent:
            type: dict
            $ref: "eos_cli_config_gen#/keys/arp/keys/persistent"
          aging:
            type: dict
            $ref: "eos_cli_config_gen#/keys/arp/keys/aging"
      ip_icmp_redirect:
        type: bool
        $ref: "eos_cli_config_gen#/keys/ip_icmp_redirect"
      # TODO: Revisit for default values in AVD 7.0
      dhcp_relay:
        type: dict
        keys:
          information_option:
            type: bool
            description: Enables the insertion of DHCP Relay Agent Information (Option 82).
            default: false
          tunnel_requests_disabled:
            type: bool
            description: |-
              Blocks DHCP relay for packets received over VXLAN tunnels.
              This is a VTEP-specific optimization and will only be configured on VXLAN VTEPs.
            default: false
          mlag_peerlink_requests_disabled:
            type: bool
            description: |-
              Blocks DHCP relay for packets arriving via the MLAG peer-link.
              This will only be configured on VXLAN VTEPs which are also MLAG devices.
            default: false
      suspended_vlans:
        type: list
        description: |-
          Suspended VLANs are rendered only as local suspended VLAN definitions.
          They are not used for endpoint VLANs, defined_vlans, or AVD-computed trunk allowed VLANs, and must not overlap with VLANs defined by network services.
        primary_key: id
        items:
          type: dict
          keys:
            id:
              type: int
              min: 1
              max: 4094
            name:
              type: str
      ip_software_forwarding_exceed_action_drop:
        type: dict
        documentation_options:
          table: system-settings
        description: |-
          Drop IPv4 packets larger than configured mtu (in bytes) in software.
          Supported starting EOS 4.36.1F, 4.35.4M, 4.34.6M, 4.33.8M, 4.32.11M.
        keys:
          enabled:
            type: bool
            required: true
          mtu:
            type: int
            description: IPv4 software-forwarding MTU threshold in bytes.
            min: 68
            max: 65535
            required: true
