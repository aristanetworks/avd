# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  connected_endpoints:
    type: list
    primary_key: name
    description: |-
      List of endpoint connected to the fabric.
      This should be applied to group_vars or host_vars where endpoints are connecting.
    items:
      type: dict
      keys:
        name:
          type: str
          description: Endpoint name will be used in the switchport description.
        type:
          type: str
          description: |-
            Type of endpoint.
            This is used in descriptions and in documentation.
        rack:
          type: str
          description: Rack is used for documentation purposes only.
        # TODO: Add this in a separate PR.
        # digital_twin:
        #   type: dict
        #   description: |-
        #     PREVIEW: This option is marked as "preview", meaning the data models or generated configuration can change at any time.
        #   keys:
        #     enabled:
        #       type: bool
        #       description: |-
        #         Setting this flag to `false` will exclude the endpoint and all associated switch ports from the:
        #           - generated Digital Twin topology file.
        #           - generated structured and rendered EOS configuration.
        #         This setting overrides global `digital_twin.endpoints.enabled` flag.
        #       default: true
        adapters:
          type: list
          description: A list of adapters, group by adapters leveraging the same port-profile.
          items:
            $ref: "eos_designs#/$defs/adapter_config"
            type: dict
            keys:
              switch_ports:
                type: list
                required: true
                description: |
                  List of switch interfaces.
                  The lists `endpoint_ports`, `switch_ports`, and `switches` must have the same length.
                items:
                  type: str
                  description: Switchport interface.
              switches:
                type: list
                required: true
                description: |
                  List of switches.
                  The lists `endpoint_ports`, `switch_ports`, and `switches` must have the same length.
                items:
                  type: str
                  description: Device.
              endpoint_ports:
                type: list
                description: |
                  Endpoint ports is used for description, required unless `description` or `descriptions` is set.
                  The lists `endpoint_ports`, `switch_ports`, `descriptions` and `switches` must have the same length.
                  Each list item is one switchport.
                items:
                  type: str
                  description: Port name on the endpoint.
              descriptions:
                type: list
                description: |-
                  Unique description per port. When set, takes priority over description.
                  This can be a template using the AVD string formatter syntax: https://avd.arista.com/stable/ansible_collections/arista/avd/roles/eos_designs/docs/how-to/custom-descriptions-names.html#avd-string-formatter-syntax.
                  The available template fields are:
                    - `endpoint_type` - the `type` of the connected endpoint either set on the endpoint or taken from `connected_endpoints_keys.type` like `server`, `router` etc.
                    - `endpoint` - The name of the connected endpoint
                    - `endpoint_port` - The value from `endpoint_ports` for this switch port if set.
                    - `port_channel_id`: The port-channel number for the switch.
                items:
                  type: str
              subinterfaces:
                type: list
                description: |-
                  L2 Subinterfaces
                  Subinterfaces are only supported on routed Ethernet interfaces, which means they cannot be configured in combination with any L2 features like `mode`, `vlans` etc.
                  Setting short_esi: auto generates the short_esi automatically using a hash of configuration elements.
                  Please see the notes under "EVPN A/A ESI dual-attached endpoint scenario" before setting short_esi: auto.
                primary_key: number
                items:
                  type: dict
                  keys:
                    number:
                      type: int
                      convert_types:
                        - str
                      description: Subinterface number.
                      min: 1
                      max: 1048575
                    description:
                      type: str
                      description: |-
                        Description for subinterface.
                        This can be a template using the AVD string formatter syntax: https://avd.arista.com/stable/ansible_collections/arista/avd/roles/eos_designs/docs/how-to/custom-descriptions-names.html#avd-string-formatter-syntax.
                        The available template fields are:
                          - `subinterface` - The full subinterface name.
                          - `subinterface_number` - The number for the subinterface.
                          - `vlan_id` - The VLAN ID bridged to this subinterface.
                          - `dot1q_client_vlan` - The Client VLAN ID encapsulation.
                          - `endpoint_type` - The `type` of the connected endpoint either set on the endpoint or taken from `connected_endpoints_keys.type` like `server`, `router` etc.
                          - `endpoint` - The name of the connected endpoint
                    short_esi:
                      type: str
                      description: |-
                        In format xxxx:xxxx:xxxx or "auto".
                        Required for multihomed ethernet interfaces with subinterfaces.
                    vlan_id:
                      type: int
                      convert_types:
                        - str
                      min: 1
                      max: 4094
                      description: |-
                        VLAN ID to bridge.
                        Default is the subinterface number.
                    encapsulation_vlan:
                      type: dict
                      keys:
                        client_dot1q:
                          type: int
                          description: |-
                            Client VLAN ID encapsulation.
                            Default is the subinterface number.
                          convert_types:
                            - str
                          min: 1
                          max: 4094
                    raw_eos_cli:
                      type: str
                      description: EOS CLI rendered directly on the subinterface in the final EOS configuration.
                    structured_config:
                      type: dict
                      relaxed_validation: true
                      description: Custom structured config added under ethernet_interfaces.[name=<subinterface>] for eos_cli_config_gen.
                      documentation_options:
                        hide_keys: true
                      $ref: "eos_cli_config_gen#/keys/ethernet_interfaces/items"
              port_channel:
                type: dict
                keys:
                  subinterfaces:
                    type: list
                    primary_key: number
                    description: |
                      Port-Channel L2 Subinterfaces.
                      Subinterfaces are only supported on routed port-channels, which means they cannot be configured on MLAG port-channels.
                      Setting `short_esi: auto` generates the short_esi automatically using a hash of configuration elements.
                      Please see the notes under "EVPN A/A ESI dual-attached endpoint scenario" before setting `short_esi: auto`.
                    items:
                      type: dict
                      keys:
                        number:
                          type: int
                          convert_types:
                            - str
                          description: Subinterface number.
                          min: 1
                          max: 1048575
                        description:
                          type: str
                          description: |-
                            Description for subinterface.
                            This can be a template using the AVD string formatter syntax: https://avd.arista.com/stable/ansible_collections/arista/avd/roles/eos_designs/docs/how-to/custom-descriptions-names.html#avd-string-formatter-syntax.
                            The available template fields are:
                              - `subinterface` - The full subinterface name.
                              - `subinterface_number` - The number for the subinterface.
                              - `vlan_id` - The VLAN ID bridged to this subinterface.
                              - `dot1q_client_vlan` - The Client VLAN ID encapsulation.
                              - `endpoint_type` - The `type` of the connected endpoint either set on the endpoint or taken from `connected_endpoints_keys.type` like `server`, `router` etc.
                              - `endpoint` - The name of the connected endpoint
                        short_esi:
                          type: str
                          description: |
                            In format xxxx:xxxx:xxxx or "auto".
                            Required for multihomed port-channels with subinterfaces.
                        vlan_id:
                          type: int
                          convert_types:
                            - str
                          min: 1
                          max: 4094
                          description: |
                            VLAN ID to bridge.
                            Default is the subinterface number.
                        encapsulation_vlan:
                          type: dict
                          keys:
                            client_dot1q:
                              type: int
                              description: |
                                Client VLAN ID encapsulation.
                                Default is the subinterface number.
                              convert_types:
                                - str
                              min: 1
                              max: 4094
                        raw_eos_cli:
                          type: str
                          description: EOS CLI rendered directly on the port-channel subinterface in the final EOS configuration.
                        structured_config:
                          type: dict
                          relaxed_validation: true
                          description: Custom structured config added under port_channel_interfaces.[name=<subinterface>] for the EOS Config schema.
                          documentation_options:
                            hide_keys: true
                          $ref: "eos_cli_config_gen#/keys/port_channel_interfaces/items"
