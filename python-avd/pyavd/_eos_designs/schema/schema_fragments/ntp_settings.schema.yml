# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  ntp_settings:
    documentation_options:
      table: time-configuration
    type: dict
    description: |-
      NTP settings
    keys:
      server_vrf:
        type: str
        default: use_default_mgmt_method_vrf
        description: |-
          EOS only supports NTP servers in one VRF, so this VRF is used for all NTP servers and one local-interface.
          - `use_mgmt_interface_vrf` will configure the NTP server(s) under the VRF set with `mgmt_interface_vrf` and set the `mgmt_interface` as NTP local-interface.
            An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
          - `use_inband_mgmt_vrf` will configure the NTP server(s) under the VRF set with `inband_mgmt_vrf` and set the `inband_mgmt_interface` as NTP local-interface.
            An error will be raised if inband management is not configured for the device.
          - `use_default_mgmt_method_vrf` will configure the VRF for NTP server(s) and local-interface for NTP depending on the value of `default_mgmt_method`.
          - Any other string will be used directly as the VRF name but local interface must be set with `custom_structured_configuration_ntp` if needed.
      set_first_ntp_server_as_preferred:
        type: bool
        description: |-
          If 'true', AVD marks the first entry under 'ntp_settings.servers' as 'preferred'.
          Set to 'false' to avoid automatically setting any server as 'preferred'.
        default: true
      servers:
        type: list
        primary_key: name
        description: |-
          By default, AVD marks the first server as `preferred`.
          Set 'ntp_settings.set_first_ntp_server_as_preferred: false' to disable this behavior.
        items:
          type: dict
          keys:
            name:
              type: str
              $ref: eos_cli_config_gen#/keys/ntp/keys/servers/items/keys/name
            burst:
              type: bool
            iburst:
              type: bool
            key:
              type: int
              $ref: eos_cli_config_gen#/keys/ntp/keys/servers/items/keys/key
            maxpoll:
              type: int
              $ref: eos_cli_config_gen#/keys/ntp/keys/servers/items/keys/maxpoll
            minpoll:
              type: int
              $ref: eos_cli_config_gen#/keys/ntp/keys/servers/items/keys/minpoll
            version:
              type: int
              $ref: eos_cli_config_gen#/keys/ntp/keys/servers/items/keys/version
            source_address:
              type: str
              description: |-
                - `use_mgmt_interface_ipv4` configures the source address as the IPv4 address of the management interface.
                - `use_mgmt_interface_ipv6` configures the source address as the IPv6 address of the management interface.
                - `use_inband_mgmt_interface_ipv4` configures the source address as the IPv4 address of the inband management interface.
                - `use_inband_mgmt_interface_ipv6` configures the source address as the IPv6 address of the inband management interface.
                - Any other string is used directly as the source address (for example, an IPv4 or IPv6 address).
                use_* values fail validation when the management address is missing/dhcp, ntp_settings.server_vrf is not the expected management VRF, or the use_* keyword is unsupported.
      authenticate:
        type: bool
      authenticate_servers_only:
        type: bool
      authentication_keys:
        type: list
        primary_key: id
        items:
          type: dict
          $ref: eos_cli_config_gen#/keys/ntp/keys/authentication_keys/items
          keys:
            key:
              type: str
              description: |-
                Authentication provided using the `key_type` format.
                Will be rendered as such.
                Takes precedence over `cleartext_key`.
              # Need to overwrite required: true from the EOS Config schema to allow cleartext_key only
              required: false
            cleartext_key:
              type: str
              description: |-
                Cleartext key for the NTP authentication key. Encrypted to Type 7 by AVD.
                `key_type` does not influence this key.
                To protect the password at rest it is strongly recommended to make use of a vault or similar.
            key_type:
              type: str
              description: |-
                Key type of the `key`.
                Does not have any influence on `cleartext_key`.
      trusted_keys:
        type: str
        $ref: eos_cli_config_gen#/keys/ntp/keys/trusted_keys
