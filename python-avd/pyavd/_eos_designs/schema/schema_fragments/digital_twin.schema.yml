type: dict
keys:
  digital_twin:
    documentation_options:
      table: digital-twin-configuration
    type: dict
    description: |-
      PREVIEW: This option is marked as "preview", meaning the data models or generated configuration can change at any time.
      Global settings to configure the Digital Twin of the Fabric.
    keys:
      environment:
        type: str
        description: |-
          Targeted Digital Twin environment.
        valid_values:
          - act
        default: act
      act_cloudeos_username:
        type: str
        description: |-
          Username for ACT Digital Twin 'cloudeos' nodes.
        default: cvpadmin
      act_cloudeos_password:
        type: str
        description: |-
          Password for ACT Digital Twin 'cloudeos' nodes.
        default: cvp123!
      act_cloudeos_os_version:
        type: str
        description: |-
          OS version for ACT Digital Twin 'cloudeos' nodes.
        default: "4.33.2F"
      act_cvp_username:
        type: str
        description: |-
          Username for ACT Digital Twin 'cvp' nodes.
        default: root
      act_cvp_password:
        type: str
        description: |-
          Password for ACT Digital Twin 'cvp' nodes.
        default: cvproot
      act_cvp_os_version:
        type: str
        description: |-
          OS version for ACT Digital Twin 'cvp' nodes.
        default: "2024.3.2"
      act_generic_username:
        type: str
        description: |-
          Username for ACT Digital Twin 'generic' nodes.
        default: ansible
      act_generic_password:
        type: str
        description: |-
          Password for ACT Digital Twin 'generic' nodes.
        default: ansible
      act_generic_os_version:
        type: str
        description: |-
          OS version for ACT Digital Twin 'generic' nodes.
        default: "ubuntu-2204-lts"
      act_third_party_username:
        type: str
        description: |-
          Username for ACT Digital Twin 'third-party' nodes.
        default: ansible
      act_third_party_password:
        type: str
        description: |-
          Password for ACT Digital Twin 'third-party' nodes.
        default: ansible
      act_third_party_os_version:
        type: str
        description: |-
          OS version for ACT Digital Twin 'third-party' nodes.
        default: "byod"
      act_tools_server_username:
        type: str
        description: |-
          Username for ACT Digital Twin 'tools-server' nodes.
        default: ansible
      act_tools_server_password:
        type: str
        description: |-
          Password for ACT Digital Twin 'tools-server' nodes.
        default: ansible
      act_tools_server_os_version:
        type: str
        description: |-
          OS version for ACT Digital Twin 'tools-server' nodes.
        default: "ubuntu-2204-lts"
      act_veos_username:
        type: str
        description: |-
          Username for ACT Digital Twin 'veos' nodes.
        default: cvpadmin
      act_veos_password:
        type: str
        description: |-
          Password for ACT Digital Twin 'veos' nodes.
        default: cvp123!
      act_veos_os_version:
        type: str
        description: |-
          OS version for ACT Digital Twin 'veos' nodes.
        default: "4.33.1.1F"
      auxiliary_systems:
        type: list
        description: |-
          Auxiliary systems (e.g., CloudVision portal, general Linux servers) deployed as part of the Digital Twin infrastructure alongside the fabric devices.
        items:
          type: dict
          keys:
            node_name:
              type: str
              description: |-
                XXX
              required: true
            node_type:
              type: str
              description: |-
                XXX
              required: true
              valid_values:
                - act-tools-server
            act_os_version:
              type: str
              description: |-
                XXX
                Overrides parent `digital_twin.act_<node_type>_os_version` value.
            act_mgmt_ip:
              type: str
              description: |-
                Management interface IPv4 address for ACT Digital Twin.
                Required for ACT auxiliary system.
              format: cidr
