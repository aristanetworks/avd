# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  port_profiles:
    type: list
    primary_key: profile
    description: |
      Optional profiles to share common settings for connected_endpoints and/or network_ports.
      Keys are the same used under endpoints adapters. Keys defined under endpoints adapters take precedence.
    items:
      type: dict
      $ref: "eos_designs#/$defs/adapter_config"
      # These keys will take precedence over $ref
      keys:
        profile:
          type: str
          description: Port profile name.
        parent_profile:
          type: str
          description: |
            Parent profile is optional.
            Port_profiles can refer to another port_profile to inherit settings in up to two levels (adapter->profile->parent_profile).
        port_channel:
          type: dict
          keys:
            subinterfaces:
              type: list
              primary_key: number
              description: |
                Port-Channel L2 Subinterfaces.
                Only applicable for connected-endpoints. `Subinterfaces` key cannot be used with `network_ports`
                Subinterfaces are only supported on routed port-channels, which means they cannot be configured on MLAG port-channels.
                Setting `short_esi: auto` generates the short_esi automatically using a hash of configuration elements.
                Please see the notes under "EVPN A/A ESI dual-attached endpoint scenario" before setting `short_esi: auto`.
              items:
                type: dict
                keys:
                  number:
                    type: int
                    convert_types:
                      - str
                    description: Subinterface number.
                    min: 1
                    max: 1048575
                  description:
                    type: str
                    description: |-
                      Description for subinterface.
                      This can be a template using the AVD string formatter syntax: https://avd.arista.com/stable/ansible_collections/arista/avd/roles/eos_designs/docs/how-to/custom-descriptions-names.html#avd-string-formatter-syntax.
                      The available template fields are:
                        - `subinterface` - The full subinterface name.
                        - `subinterface_number` - The number for the subinterface.
                        - `vlan_id` - The VLAN ID bridged to this subinterface.
                        - `dot1q_client_vlan` - The Client VLAN ID encapsulation.
                        - `endpoint_type` - The `type` of the connected endpoint either set on the endpoint or taken from `connected_endpoints_keys.type` like `server`, `router` etc.
                        - `endpoint` - The name of the connected endpoint
                  short_esi:
                    type: str
                    description: |
                      In format xxxx:xxxx:xxxx or "auto".
                      Required for multihomed port-channels with subinterfaces.
                  vlan_id:
                    type: int
                    convert_types:
                      - str
                    min: 1
                    max: 4094
                    description: |
                      VLAN ID to bridge.
                      Default is the subinterface number.
                  encapsulation_vlan:
                    type: dict
                    keys:
                      client_dot1q:
                        type: int
                        description: |
                          Client VLAN ID encapsulation.
                          Default is the subinterface number.
                        convert_types:
                          - str
                        min: 1
                        max: 4094
                  raw_eos_cli:
                    type: str
                    description: EOS CLI rendered directly on the port-channel subinterface in the final EOS configuration.
                  structured_config:
                    type: dict
                    relaxed_validation: true
                    description: Custom structured config added under port_channel_interfaces.[name=<subinterface>] for the EOS Config schema.
                    documentation_options:
                      hide_keys: true
                    $ref: "eos_cli_config_gen#/keys/port_channel_interfaces/items"
