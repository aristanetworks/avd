# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
$defs:
  spanning_tree_settings:
    type: dict
    documentation_options:
      table: spanning-tree-settings
    keys:
      mode:
        type: str
        valid_values:
          - mstp
          - rstp
          - rapid-pvst
          - none
      priority:
        type: int
        convert_types:
          - str
        default: 32768
        description: |-
          Spanning-tree priority configured for the selected mode.
          For `rapid-pvst` the priority can also be set per VLAN under network services.
      root_super:
        type: bool
        default: false
      mst_pvst_boundary:
        type: bool
        description: Enable MST PVST border ports.
      port_id_allocation_port_channel_range:
        type: dict
        $ref: "eos_cli_config_gen#/keys/spanning_tree/keys/port_id_allocation_port_channel_range"
      loop_guard_default:
        type: bool
        description: Enable loopguard by default on all ports.
        default: false
