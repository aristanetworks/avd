# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  aaa_settings:
    type: dict
    keys:
      enable_password:
        type: dict
        keys:
          password:
            type: str
            description: |-
              SHA512 hashed password.
              Takes precedence over `cleartext_password`.
              This variable is sensitive and SHOULD be configured using some vault.
          cleartext_password:
            type: str
            description: |-
              Cleartext enable password.
              Encrypted using `password_type` by AVD.
              This variable is sensitive and SHOULD be configured using some vault mechanism.
          password_type:
            type: str
            # TODO: Later we may want to add Yescrypt and scrypt so need to update the code accordingly.
            valid_values:
              - sha512
            default: sha512
      tacacs:
        type: dict
        keys:
          servers:
            type: list
            items:
              type: dict
              keys:
                host:
                  type: str
                  description: |-
                    Host IP address or name.
                    Combination of `host` and `vrf` should be unique.
                  required: true
                groups:
                  type: list
                  min_length: 1
                  items:
                    type: str
                    pattern: "^(?:tacacs\\+.+|tacacs[^+].|tacac[^s].|taca[^c].|tac[^a].|ta[^c].|t[^a].|[^t].*|t|ta|tac|taca|tacac|tacacs?)$"
                  description: |-
                    List of Tacacs group names.
                    The group name `tacacs+` is reserved by EOS and must not be used.
                vrf:
                  type: str
                  description: |-
                    VRF name.
                    The value will be interpreted according to these rules:
                    - `use_mgmt_interface_vrf` will configure the TACACS host under the VRF set with `mgmt_interface_vrf`.
                      An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
                    - `use_inband_mgmt_vrf` will configure the TACACS host under the VRF set with `inband_mgmt_vrf`.
                      An error will be raised if inband management is not configured for the device.
                    - `use_default_mgmt_method_vrf` will configure the VRF and source-interface for one of the two options above depending on the value of `default_mgmt_method`.
                    - Any other string will be used directly as the VRF name.
                  convert_types:
                    - int
                timeout:
                  type: int
                  $ref: "eos_cli_config_gen#/keys/tacacs_servers/keys/hosts/items/keys/timeout"
                key:
                  type: str
                  description: |-
                    Encrypted Type 7 key.
                    Takes precedence over `cleartext_key` if both are provided.
                    Either `key` or `cleartext_key` must be set to render the configuration;
                    otherwise, an error will be raised.
                cleartext_key:
                  type: str
                  description: |-
                    Plaintext password that will be encrypted to Type 7 by AVD.
                    To protect the password at rest it is strongly recommended to make use of a vault or similar.
                    Either `key` or `cleartext_key` must be set to render the configuration;
                    otherwise, an error will be raised.
                  convert_types:
                    - int
          vrfs:
            type: list
            primary_key: name
            items:
              type: dict
              keys:
                name:
                  type: str
                  description: VRF Name.
                  convert_types:
                    - int
                source_interface:
                  type: str
                  description: |-
                    Source interface to use for TACACS hosts in this VRF.
                    If not set, the source interface may be set automatically when the TACACS server VRF is set to `use_mgmt_interface_vrf`, `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
                    If set for the VRFs defined by `mgmt_interface_vrf` or `inband_mgmt_vrf`, this setting will take precedence.
          policy:
            type: dict
            keys:
              ignore_unknown_mandatory_attribute:
                type: bool
                default: false
      radius:
        type: dict
        keys:
          servers:
            type: list
            items:
              type: dict
              keys:
                host:
                  type: str
                  description: |-
                    Host IP address or name.
                    Multiple servers with the same hostname/IP address can be configured for TLS and no TLS.
                  required: true
                groups:
                  type: list
                  min_length: 1
                  items:
                    type: str
                    pattern: "^(?:radius.+|radiu[^s].|radi[^u].|rad[^i].|ra[^d].|r[^a].|[^r].*|r|ra|rad|radi|radiu)$"
                  description: |-
                    List of Radius group names.
                    The group name `radius` is reserved by EOS and must not be used.
                vrf:
                  type: str
                  description: |-
                    VRF name.
                    The value will be interpreted according to these rules:
                    - `use_mgmt_interface_vrf` will configure the Radius host under the VRF set with `mgmt_interface_vrf`.
                      An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
                    - `use_inband_mgmt_vrf` will configure the Radius host under the VRF set with `inband_mgmt_vrf`.
                      An error will be raised if inband management is not configured for the device.
                    - `use_default_mgmt_method_vrf` will configure the VRF and source-interface for one of the two options above depending on the value of `default_mgmt_method`.
                    - Any other string will be used directly as the VRF name.
                  convert_types:
                    - int
                timeout:
                  type: int
                  $ref: "eos_cli_config_gen#/keys/radius_server/keys/servers/items/keys/timeout"
                retransmit:
                  type: int
                  $ref: "eos_cli_config_gen#/keys/radius_server/keys/servers/items/keys/retransmit"
                key:
                  type: str
                  description: |-
                    Encrypted type-7 key.
                    Takes precedence over `cleartext_key`.
                cleartext_key:
                  type: str
                  description: |-
                    Cleartext password.
                    Encrypted to Type 7 by AVD.
                    To protect the password at rest it is strongly recommended to make use of a vault or similar.
                  convert_types:
                    - int
                tls:
                  type: dict
                  description: When TLS is configured, `key` and `cleartext_key` are ignored.
                  $ref: "eos_cli_config_gen#/keys/radius_server/keys/servers/items/keys/tls"
          vrfs:
            type: list
            primary_key: name
            items:
              type: dict
              keys:
                name:
                  type: str
                  description: VRF Name.
                  convert_types:
                    - int
                source_interface:
                  type: str
                  description: |-
                    Source interface to use for RADIUS hosts in this VRF.
                    If not set, the source interface may be set automatically when the RADIUS server VRF is set to `use_mgmt_interface_vrf`, `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
                    If set for the VRFs defined by `mgmt_interface_vrf` or `inband_mgmt_vrf`, this setting will take precedence.
      authentication:
        type: dict
        keys:
          login:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_authentication/keys/login"
          enable:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_authentication/keys/enable"
          policies:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_authentication/keys/policies"
      authorization:
        type: dict
        keys:
          policy:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_authorization/keys/policy"
          exec:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_authorization/keys/exec"
          config_commands:
            type: bool
            $ref: "eos_cli_config_gen#/keys/aaa_authorization/keys/config_commands"
          serial_console:
            type: bool
            $ref: "eos_cli_config_gen#/keys/aaa_authorization/keys/serial_console"
          commands:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_authorization/keys/commands"
      accounting:
        type: dict
        keys:
          exec:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_accounting/keys/exec"
          system:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_accounting/keys/system"
          commands:
            type: dict
            $ref: "eos_cli_config_gen#/keys/aaa_accounting/keys/commands"
      root_login:
        type: dict
        keys:
          enabled:
            type: bool
            default: false
          sha512_password:
            type: str
      local_users:
        $ref: "eos_cli_config_gen#/keys/local_users"
        type: list
        items:
          type: dict
          keys:
            sha512_password:
              type: str
              description: |-
                SHA512 Hash of Password.
                Takes precedence over `cleartext_password`.
                This variable is sensitive and SHOULD be configured using some vault mechanism.
            cleartext_password:
              type: str
              description: |-
                Cleartext user password.
                Encrypted using `password_type` by AVD.
                This variable is sensitive and SHOULD be configured using some vault mechanism.
            password_type:
              type: str
              # TODO: Later we may want to add Yescrypt and scrypt so need to update the code accordingly.
              valid_values:
                - sha512
              default: sha512
