# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  device_roles:
    type: list
    description: |-
      PREVIEW - This datamodel is still under development and may change or get removed at any time.
    documentation_options:
      table: devices
    primary_key: name
    items:
      $ref: "eos_designs#/$defs/node_type/keys/defaults"
      type: dict
      keys:
        name:
          type: str
          description: Role Name
        evpn_role:
          type: str
          default: "none"
        flow_tracker_type:
          type: str
          default: "sampled"
        mpls_lsr:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/mpls_lsr"
          type: bool
        connected_endpoints:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/connected_endpoints"
          type: bool
        evpn_encapsulation:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/default_evpn_encapsulation"
          type: str
        mlag_support:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/mlag_support"
          type: bool
        network_services:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/network_services"
          type: dict
        underlay_router:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/underlay_router"
          type: bool
        underlay_routing_protocol:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/default_underlay_routing_protocol"
          type: str
        overlay_routing_protocol:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/default_overlay_routing_protocol"
          type: str
        overlay_address_families:
          type: list
          default:
            - evpn
          items:
            type: str
        ptp:
          type: dict
          keys:
            priority1:
              type: int
              default: 127
        uplink_type:
          type: str
          default: p2p
        vtep:
          type: bool
          default: false
        custom_ip_addressing:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/ip_addressing"
          type: dict
        custom_interface_descriptions:
          $ref: "eos_designs#/keys/node_type_keys/items/keys/interface_descriptions"
          type: dict
    default:
      - name: spine
        evpn_role: server
        ptp:
          priority1: 20
        cv_tags_topology_type: spine
      - name: l3leaf
        connected_endpoints: true
        evpn_role: client
        mlag_support: true
        network_services:
          l2: true
          l3: true
        vtep: true
        ptp:
          priority1: 30
        cv_tags_topology_type: leaf
      - name: l2leaf
        connected_endpoints: true
        mlag_support: true
        network_services:
          l2: true
        underlay_router: false
        uplink_type: port-channel
        cv_tags_topology_type: leaf
