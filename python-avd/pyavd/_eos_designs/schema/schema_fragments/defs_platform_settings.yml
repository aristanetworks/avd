# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
$defs:
  platform_settings:
    type: list
    items:
      type: dict
      keys:
        platforms:
          type: list
          items:
            type: str
            convert_types:
              - int
        trident_forwarding_table_partition:
          type: str
          description: Only applied when evpn_multicast is true.
        reload_delay:
          type: dict
          keys:
            mlag:
              type: int
              convert_types:
                - str
              min: 0
              max: 86400
              description: In seconds.
            non_mlag:
              type: int
              convert_types:
                - str
              min: 0
              max: 86400
              description: In seconds.
        tcam_profile:
          type: str
        lag_hardware_only:
          type: bool
        default_interface_mtu:
          type: int
          convert_types:
            - str
          description: |
            Default interface MTU configured on EOS under "interface defaults".
            Takes precedence over the root key "default_interface_mtu".
          min: 68
          max: 65535
        p2p_uplinks_mtu:
          type: int
          convert_types:
            - str
          description: |
            Set MTU on point to point uplink interfaces.
            Takes precedence over the root key "p2p_uplinks_mtu".
            <node_type>.uplink_mtu -> platform_settings.p2p_uplinks_mtu -> p2p_uplinks_mtu -> 9214.
          min: 68
          max: 65535
        feature_support:
          type: dict
          keys:
            address_locking:
              type: dict
              keys:
                supported:
                  type: bool
                  description: |-
                    Global support for Address Locking feature.
                    The feature will be ignored on platforms where this is false.
                  default: true
                # TODO 7.0: Disable for cEOS-lab, vEOS-lab, CloudEOS
                ipv4_enforcement_disabled:
                  type: bool
                  description: |-
                    Support for disabling enforcement for locked IPv4 addresses.
                    The feature will be ignored on platforms where this is false.
                  default: true
                # TODO 7.0: Disable for cEOS-lab, vEOS-lab, CloudEOS
                ipv6_enforcement_disabled:
                  type: bool
                  description: |-
                    Support for disabling enforcement for locked IPv6 addresses.
                    The feature will be ignored on platforms where this is false.
                  default: true
                # TODO 7.0: Disable for cEOS-lab, vEOS-lab, CloudEOS
                ipv6_ethernet_interface:
                  type: bool
                  description: |-
                    Support for controlling IPv6 Address Locking on the Ethernet interface level.
                    The feature will be ignored on platforms where this is false.
                  default: true
                # TODO 7.0: Disable for cEOS-lab, vEOS-lab, CloudEOS
                ipv6_vlan:
                  type: bool
                  description: |-
                    Support for controlling IPv6 Address Locking on the VLAN level.
                    The feature will be ignored on platforms where this is false.
                  default: true
            queue_monitor:
              type: bool
              description: |-
                Support for LANZ.
                The feature will be ignored on platforms where this is false.
              default: true
            queue_monitor_length_notify:
              type: bool
              description: |-
                Support for LANZ notifying mode. Requires the parent `queue_monitor` feature to be enabled.
                The feature will be ignored on platforms where this is false.
              default: true
            interface_storm_control:
              type: bool
              default: true
              description: |-
                Support for storm-control.
                The feature will be ignored on platforms where this is false.
            poe:
              type: bool
              default: false
              description: |-
                Support for PoE.
                The feature will be ignored on platforms where this is false.
            subinterface_mtu:
              type: bool
              default: true
              description: |
                Support for MTU configuration under sub-interfaces.
                When this key is set to False, MTU is not rendered under sub-interfaces even if it is set in the inputs.
            subinterface_monitor_session:
              type: bool
              default: true
              description: |-
                Support for monitor session configuration on sub-interfaces.
                When this key is set to false, an error will be raised if a monitor session is configured on a sub-interface.
            per_interface_mtu:
              type: bool
              default: true
              description: |
                Support for configuration of per interface MTU for p2p links, MLAG SVIs and Network Services.
                Effectively this means that all settings regarding interface MTU will be ignored if this is false.
                Platforms without support for per interface MTU can use a single default interface MTU setting. Set this via "default_interface_mtu"
            per_interface_l2_mtu:
              type: bool
              default: true
              description: |
                Support for configuration of per interface L2 MTU on Ethernet or Port-channel interfaces.
                The feature will be ignored on platforms where this is false.
            per_interface_l2_mru:
              type: bool
              default: true
              description: |
                Support for configuration of per interface L2 MRU (maximum receive unit) on Ethernet and Port-Channel interfaces.
                The feature will be ignored on platforms where this is false.
            bgp_update_wait_install:
              type: bool
              default: true
              description: |
                Disables FIB updates and route advertisement when the BGP instance is initiated until the BGP convergence state is reached.
                Can be overridden by setting "bgp_update_wait_install" host/group_vars.
                The feature will be ignored on platforms where this is false.
            bgp_update_wait_for_convergence:
              type: bool
              default: true
              description: |
                Do not advertise reachability to a prefix until that prefix has been installed in hardware.
                This will eliminate any temporary black holes due to a BGP speaker advertising reachability to a prefix that may not yet be installed into the forwarding plane.
                Can be overridden by setting "bgp_update_wait_for_convergence" host/group_vars.
                The feature will be ignored on platforms where this is false.
            platform_sfe_interface_profile:
              type: dict
              description: Support for Platform SFE Interface Profiles.
              keys:
                supported:
                  type: bool
                  default: false
                  description: Capability flag for generation of SFE interface profile.
                max_rx_queues:
                  type: int
                  default: 6
                  convert_types:
                    - str
                  description: Maximum rx_queue count supported on any interface.
            evpn_gateway_all_active_multihoming:
              type: bool
              default: false
              description: |-
                Support for all-active EVPN gateway redundancy.
                An error will be raised if the feature is enabled and this is false.
            evpn_gateway_rd_rt_rewrite:
              type: bool
              default: false
              description: |-
                Support for EVPN gateway RD/RT rewrite mode.
                An error will be raised if the feature is enabled and this is false.
            hardware_counters:
              type: bool
              description: |-
                Support for enabling counters using programmable hardware counter resources.
                Setting this key to `false` for the specific platform will ignore all hardware counter features for this platform.
              default: true
            hardware_counter_features:
              type: dict
              description:  |-
                Per-feature support for the hardware counters.
                Features set to `false` will be ignored for this platform.
              keys:
                acl:
                  type: bool
                  default: true
                decap_group:
                  type: bool
                  default: true
                directflow:
                  type: bool
                  default: true
                ecn:
                  type: bool
                  default: true
                flow_spec:
                  type: bool
                  default: true
                gre_tunnel_interface:
                  type: bool
                  default: true
                ip:
                  type: bool
                  default: true
                mpls_interface:
                  type: bool
                  default: true
                mpls_lfib:
                  type: bool
                  default: true
                mpls_tunnel:
                  type: bool
                  default: true
                multicast:
                  type: bool
                  default: true
                nexthop:
                  type: bool
                  default: true
                pbr:
                  type: bool
                  default: true
                pdp:
                  type: bool
                  default: true
                policing_interface:
                  type: bool
                  default: true
                qos:
                  type: bool
                  default: true
                qos_dual_rate_policer:
                  type: bool
                  default: true
                route:
                  type: bool
                  default: true
                routed_port:
                  type: bool
                  default: true
                segment_security:
                  type: bool
                  default: true
                subinterface:
                  type: bool
                  default: true
                tapagg:
                  type: bool
                  default: true
                traffic_class:
                  type: bool
                  default: true
                traffic_policy:
                  type: bool
                  default: true
                vlan:
                  type: bool
                  default: true
                vlan_interface:
                  type: bool
                  default: true
                vni_decap:
                  type: bool
                  default: true
                vni_encap:
                  type: bool
                  default: true
                vtep_decap:
                  type: bool
                  default: true
                vtep_encap:
                  type: bool
                  default: true
            hardware_speed_group:
              type: bool
              description: |-
                Support for configurable speeds per speed-group.
                The feature will be ignored on platforms where this is false.
              default: true
            private_vlan:
              type: bool
              default: true
              description: |
                Support for PVLAN feature.
                On platforms with additional requirements to use PVLAN, ex. 7280R/R2/R3 set this via "private_vlan" in the specific platform settings.
                See the TOI at https://www.arista.com/en/support/toi/eos-4-25-0f/14609-support-for-private-vlan.
            sflow:
              type: bool
              description: |-
                Support for sFlow.
                The feature will be ignored on platforms where this is false.
              default: true
            sflow_subinterfaces:
              type: bool
              description: |-
                Support for sFlow on sub-interfaces.
                The feature will be ignored on platforms where this is false.
              default: true
            wan:
              type: bool
              description: |-
                Support for Arista WAN features.
                An error will be raised if the feature is enabled and this is false.
              default: true
            ptp:
              type: bool
              description: |-
                Support for Precision Time Protocol (PTP).
                The feature will be ignored on platforms where this is false.
              default: true
            hardware_validation:
              type: bool
              description: |-
                Enable hardware validation for the device.
                When `false`, all hardware tests are skipped, therefore the `validation_profiles[].hardware` keys defined for the validation profile applied to the device are ignored.
              default: true
            errdisable_causes:
              type: dict
              description: |-
                Per-cause support for errdisable detection and recovery.
                Causes with `detection: false` will suppress detection for that cause even if enabled in `errdisable_settings.causes.<cause>.detection`.
                Causes with `recovery: false` will suppress recovery for that cause even if enabled in `errdisable_settings.causes.<cause>.recovery`.
                The supported causes depends on the EOS version and the hardware platform.
              keys:
                acl:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                arp_inspection:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                bpduguard:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                dot1x:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                dot1x_coa:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                dot1x_phone_classification:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                dot1x_session_replace:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                error_correction_encoding:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                fabric_capacity_low:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                hardware_speed_group:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                hitless_reload_down:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                interface_speed:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                internal_error:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                lacp_rate_limit:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                link_change:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                link_flap:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                no_internal_vlan:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                port_breakout:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                portchannelguard:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                portsec:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                speed_misconfigured:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                storm_control:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                stuck_queue:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                switchcard_unreachable:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                tap_port_init:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                tapagg:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                tpid:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                transceiver_adapter:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                uplink_failure_detection:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
                xcvr_misconfigured:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                xcvr_overheat:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                xcvr_power_unsupported:
                  type: dict
                  keys:
                    detection:
                      type: bool
                      default: true
                    recovery:
                      type: bool
                      default: true
                xcvr_unsupported:
                  type: dict
                  keys:
                    recovery:
                      type: bool
                      default: true
        management_interface:
          type: str
          default: Management1
        security_entropy_sources:
          description: Entropy source improves the randomness of the numbers used to generate MACsec's cryptographic keys.
          type: dict
          keys:
            hardware:
              type: bool
              description: Use a hardware based source.
            haveged:
              type: bool
              description: Use the HAVEGE algorithm.
            cpu_jitter:
              type: bool
              description: Use the Jitter RNG algorithm of a CPU based source.
            hardware_exclusive:
              type: bool
              description: Only use entropy from the hardware source.
        digital_twin:
          type: dict
          description: |-
            PREVIEW: This option is marked as "preview", meaning the data models or generated configuration can change at any time.
            Digital Twin settings applied when `avd_digital_twin_mode` is `true`.
          keys:
            platform:
              type: str
              description: |-
                Name of an alternate `platform_settings` platform used when running in Digital Twin mode.
                The `platform_settings` for the regular `platform` is used if this is not set.
            act_node_type:
              type: str
              description: |-
                ACT node type.
              valid_values:
                - cloudeos
                - cvp
                - generic
                - third-party
                - tools-server
                - veos
        structured_config:
          type: dict
          relaxed_validation: true
          documentation_options:
            hide_keys: true
          description: Custom structured config for the EOS Config schema.
          $ref: "eos_cli_config_gen#"
        raw_eos_cli:
          type: str
          description: EOS CLI rendered directly on the root level of the final EOS configuration.
