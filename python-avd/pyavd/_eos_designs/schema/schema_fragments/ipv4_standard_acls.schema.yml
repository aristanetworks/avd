# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  ipv4_standard_acls:
    type: list
    primary_key: name
    description: |-
      PREVIEW: This data model is currently in "preview" mode and is not used anywhere yet.
      IPv4 standard access-lists catalog.
    items:
      type: dict
      keys:
        name:
          type: str
          description: Access-list Name.
          convert_types: [int]
        counters_per_entry:
          type: bool
        entries:
          type: list
          items:
            type: dict
            keys:
              sequence:
                type: int
                description: Sequence ID.
                convert_types:
                  - str
              action:
                type: str
                description: |
                  Action as string.
                valid_values: [permit, deny]
              remark:
                type: str
                description: |-
                  Specify a comment. If remark is specified other keys of the entry are ignored.
              source:
                type: str
                description: |-
                  Required for non-remark entries.
                  The value can be:
                  1. A single source address.
                  2. Source address with mask. e.g. '10.0.0.1/8'.
                  3. 'any' source address.
              vlan:
                type: int
                description: Match packets by VLAN value.
                convert_types:
                  - str
              vlan_mask:
                type: str
                description: |-
                  VLAN mask. Range "0x000"-"0xFFF". Required when `vlan` is defined.
                  To ensure that a value like 0x001 is treated strictly as a string
                  and not converted to a decimal (like 1), use single or double quotes.
              inner_vlan:
                type: int
                description: Match packets by inner VLAN value.
                convert_types:
                  - str
              inner_vlan_mask:
                type: str
                description: |-
                  Inner VLAN mask. Range 0x000-0xFFF. Required when `inner_vlan` is defined.
                  To ensure that a value like 0x001 is treated strictly as a string
                  and not converted to a decimal (like 1), use single or double quotes.
              log:
                type: bool
                description: Enable logging when a packet matches the ACL rule.
              mirror_session:
                type: str
                description: Mirror session to mirror matches against this rule.
