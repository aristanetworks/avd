# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  underlay_ipv6:
    documentation_options:
      table: fabric-settings
    description: |
      This feature turns on IPv6 routing in the underlay.
      It works with isis underlays and ebgp underlays using "underlay_rfc5549" or "underlay_ipv6_numbered".
      It requires a "loopback_ipv6_pool" to be defined under the node type settings.
    type: bool
    default: false
