# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  dot1x_settings:
    documentation_options:
      table: dot1x-settings
    type: dict
    description: |-
      Settings for 802.1X deployments.
    keys:
      enabled:
        type: bool
        default: false
        description: |-
          Enable 802.1X port authentication on the switch.
      protocol_bypasses:
        type: dict
        keys:
          bpdu:
            type: bool
            default: true
            $ref: eos_cli_config_gen#/keys/dot1x/keys/protocol_bpdu_bypass
          lldp:
            type: bool
            default: true
            $ref: eos_cli_config_gen#/keys/dot1x/keys/protocol_lldp_bypass
      dynamic_authorization:
        # Using a dict to eventually support a non-default port (Cisco ISE uses 1700 by default)
        type: dict
        keys:
          enabled:
            type: bool
            default: true
            $ref: eos_cli_config_gen#/keys/dot1x/keys/dynamic_authorization
      always_send_service_type:
        type: bool
        default: true
        $ref: eos_cli_config_gen#/keys/dot1x/keys/radius_av_pair/keys/service_type
