# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  dot1x_settings:
    documentation_options:
      table: dot1x-settings
    type: dict
    description: Settings for 802.1X deployments.
    keys:
      enabled:
        type: bool
        default: false
        description: |-
          Globally enable 802.1X port authentication on the switch.
          Must be true for 802.1X to be active on any interface.
      authentication:
        type: dict
        keys:
          radius_groups:
            type: list
            min_length: 1
            description: |-
              List of RADIUS server groups to be used for 802.1X authentication when globally enabled. If not provided, all defined RADIUS hosts are used.
              The order of the list defines the server group priority.
              Each group name must also be defined on any server under `aaa_settings.radius.servers`.
            items:
              type: str
              description: RADIUS server group name.
      accounting:
        type: dict
        keys:
          enabled:
            type: bool
            default: true
            description: Enable 802.1X accounting.
          mode:
            type: str
            valid_values: [start-stop, stop-only]
            default: start-stop
            description: |-
              Determines whether to send accounting records when a session is established and
              when it ends (`start-stop`), or only when the session ends (`stop-only`).
          radius_groups:
            type: list
            min_length: 1
            description: |-
              List of RADIUS server groups to be used for 802.1X accounting when enabled. If not provided, all defined RADIUS hosts are used.
              The order of the list defines the server group priority.
              Each group name must also be defined on any server under `aaa_settings.radius.servers`.
            items:
              type: str
              description: RADIUS server group name.
          multicast:
            type: bool
            default: false
            description: Send Accounting-Request messages to all servers in a RADIUS group at the same time.
          syslog:
            type: bool
            default: false
            description: |-
              Log all accounting messages to syslog if all RADIUS servers are unavailable or unresponsive.
      bypass_bpdu:
        type: bool
        default: true
        $ref: eos_cli_config_gen#/keys/dot1x/keys/protocol_bpdu_bypass
      bypass_lldp:
        type: bool
        default: true
        $ref: eos_cli_config_gen#/keys/dot1x/keys/protocol_lldp_bypass
      dynamic_authorization:
        type: dict
        keys:
          enabled:
            type: bool
            default: true
            $ref: eos_cli_config_gen#/keys/dot1x/keys/dynamic_authorization
          additional_groups:
            type: list
            description: |-
              List of additional RADIUS server groups for dynamic authorization purposes only.
              The order of the list defines the server group priority.
              Each group name must also be defined on any server under `aaa_settings.radius.servers`.
            items:
              type: str
              description: RADIUS server group name.
      mac_based_authentication:
        type: dict
        keys:
          username_format:
            type: dict
            keys:
              delimiter:
                type: str
                description: RADIUS User-Name attribute delimiter to use on the MAC address.
                required: true
                valid_values:
                  - colon
                  - hyphen
                  - none
                  - period
              letter_case:
                type: str
                description: RADIUS User-Name attribute letter case to use on the MAC address.
                required: true
                valid_values:
                  - lowercase
                  - uppercase
          delay:
            type: int
            $ref: eos_cli_config_gen#/keys/dot1x/keys/mac_based_authentication/keys/delay
          hold_period:
            type: int
            $ref: eos_cli_config_gen#/keys/dot1x/keys/mac_based_authentication/keys/hold_period
      radius_av_pairs:
        type: dict
        keys:
          service_type:
            type: bool
            default: false
            description: Send RADIUS Service-Type attribute in Access-Request and Accounting messages.
          framed_mtu:
            type: int
            $ref: eos_cli_config_gen#/keys/dot1x/keys/radius_av_pair/keys/framed_mtu
      device_profiling:
        type: dict
        description: |-
          Device profiling feature.
          Allows EOS to send authenticated host attributes (DHCP options/LLDP TLVs)
          to the RADIUS server via Arista VSA "Arista-Device-Profiling" accounting messages.
          Requires `dot1x_settings.accounting.enabled: true` and `dot1x_settings.accounting.mode: start-stop`.
        keys:
          enabled:
            type: bool
            default: false
            description: Enable all DHCP and LLDP TLV profiling options.
          dhcp:
            type: dict
            description: |-
              DHCP options profiling.
              Enables profiling via DHCP Discover/Request packets.
              Limitations:
                - IPv4 only. IPv6 address assignments via DHCPv6 or SLAAC are not supported.
                - Not supported on VTEP devices.
                - Not supported with IP Locking features.
                - MLAG support requires EOS 4.34.3+.
            keys:
              enabled:
                type: bool
                default: true
                description: Enable all DHCP profiling options collectively.
              hostname:
                type: dict
                description: DHCP Option 12 (Hostname).
                keys:
                  enabled:
                    type: bool
                    default: true
                  auth_only:
                    type: bool
                    default: false
                    description: Sends the attribute only once when first learned.
              parameter_request_list:
                type: dict
                description: DHCP Option 55 (Parameter Request List).
                keys:
                  enabled:
                    type: bool
                    default: true
                  auth_only:
                    type: bool
                    default: false
                    description: Sends the attribute only once when first learned.
              vendor_class_id:
                type: dict
                description: DHCP Option 60 (Vendor Class ID).
                keys:
                  enabled:
                    type: bool
                    default: true
                  auth_only:
                    type: bool
                    default: false
                    description: Sends the attribute only once when first learned.
          lldp:
            type: dict
            description: |-
              LLDP TLVs profiling.
              Enables profiling via LLDP packets.
              Requires LLDP to be globally enabled.
            keys:
              enabled:
                type: bool
                default: true
                description: Enable all LLDP profiling options collectively.
              system_name:
                type: dict
                description: LLDP system name (LLDP TLV 5).
                keys:
                  enabled:
                    type: bool
                    default: true
                  auth_only:
                    type: bool
                    default: false
                    description: Send the attribute only once when first learned.
              system_description:
                type: dict
                description: LLDP system description (LLDP TLV 6).
                keys:
                  enabled:
                    type: bool
                    default: true
                  auth_only:
                    type: bool
                    default: false
                    description: Send the attribute only once when first learned.
      redistribute_in_evpn:
        type: bool
        default: true
        description: |-
          Globally enable the redistribution of static 802.1X-learned MAC addresses into EVPN under all configured MAC-VRFs.
      web_authentication:
        type: dict
        description: |-
            The Web Authentication feature authenticates a supplicant via a web page, generally referred to as a captive portal.
            Requires `dot1x_settings.dynamic_authorization.enabled: true`.
        keys:
          enabled:
            type: bool
            required: true
            description: Enable the Web Authentication feature.
          url:
            type: str
            pattern: "https?://[^\\s/:]+(:\\d+)?"
            description: |-
              Static captive portal URL used when the RADIUS server does not provide one during the authentication workflow.
              If both are configured, the RADIUS-provided URL takes precedence.
              Supported format: http[s]://<hostname>[:<port>]
          ssl_profile:
            type: str
            description: |-
              SSL profile name, enabling HTTPS redirection on port 443.
              Without this, only HTTP redirection is supported.
              Can be used alone (when RADIUS provides the URL dynamically) or together with `url`.
          start_limit_infinite:
            type: bool
            description: |-
              Disable the loop-protection mechanism that limits captive portal authentication retries.
              By default, EOS limits a supplicant to 16 consecutive attempts before logging it off.
