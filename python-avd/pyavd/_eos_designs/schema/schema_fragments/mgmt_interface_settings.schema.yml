type: dict
keys:
  mgmt_interface_settings:
    documentation_options:
      table: management-interface-settings
    description: |-
      Out-of-Band (OOB) management interface settings.
      These settings override the corresponding global variables where applicable.
    type: dict
    keys:
      description:
        type: str
        description: |-
          Interface description configured on the management interface.
        default: OOB_MANAGEMENT
      vrf:
        type: str
        description: |-
          VRF name used for the management interface.
        default: MGMT
      vrf_routing:
        type: bool
        description: |-
          Enable IP routing in the management VRF.
        default: false
      interface:
        type: str
        description: |-
          Name of the management interface (e.g. Management0, Management1).
        default: Management1
      shutdown:
        type: str
        # TODO AVD7.0: Change default to "auto"
        default: "false"
        description: |-
          Control the management interface shutdown state.
          - "true": Always shut down the interface, even when management addressing is configured.
          - "false": Configure "no shutdown" when management addressing is configured; otherwise, generate no interface configuration.
          - "auto": Configure "no shutdown" when management addressing is configured; otherwise, shut down the interface.
          Management addressing is determined by node `mgmt_ip` or `ipv6_mgmt_ip`, including DHCP and SLAAC.
          When shutting down an interface without node management addressing, only its name and shutdown state are configured.
        valid_values:
          - "true"
          - "false"
          - "auto"
        convert_to_lower_case: true
      lldp:
        type: dict
        description: LLDP settings for the management interface.
        keys:
          transmit:
            type: bool
            description: Enable LLDP transmission on the management interface.
          receive:
            type: bool
            description: Enable LLDP reception on the management interface.
          ztp_vlan:
            type: int
            description: VLAN ID advertised via LLDP for Zero Touch Provisioning (ZTP).
      ipv4:
        type: dict
        keys:
          default_dhcp:
            type: bool
            default: false
            description: |-
              Enable DHCP (Dynamic Host Configuration Protocol) for IPv4 address assignment if `mgmt_ip` is not set for the node.
          dhcp_accept_default_route:
            type: bool
            default: true
            description: |-
              Accept the default route when configured for DHCP.
      ipv6:
        type: dict
        keys:
          default_auto_config:
            type: bool
            default: false
            description: |-
              Enable SLAAC (Stateless Address Auto-Configuration) for IPv6 address assignment if `ipv6_mgmt_ip` is not set for the node.
          auto_config_accept_default_route:
            type: bool
            default: true
            description: |-
              Accept the default route when configured for SLAAC.
