# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  overlay_routing_protocol_address_family:
    documentation_options:
      table: overlay-settings
    type: str
    description: |
      Set to `ipv6` to use IPv6 addresses for overlay EVPN peering.
      Setting this to `ipv6` requires both `underlay_ipv6: true` and `underlay_rfc5549: true`.
      When `underlay_ipv6_numbered: true`, IPv6 overlay peering is enabled automatically, and this setting has no effect.
    valid_values:
      - ipv4
      - ipv6
    default: ipv4
