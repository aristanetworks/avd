# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  flow_tracking_settings:
    documentation_options:
      table: management-flow-tracking-settings
    description: |-
      Define the flow tracking parameters for this topology.
    type: dict
    keys:
      sampled:
        type: dict
        description: |-
          The options relevant only for flow tracker type sampled.
        keys:
          encapsulation:
            type: dict
            keys:
              ipv4_ipv6:
                type: bool
              mpls:
                type: bool
          sample:
            type: int
            convert_types:
              - str
            min: 1
            max: 4294967295
            default: 10000
          hardware_offload:
            type: dict
            keys:
              ipv4:
                type: bool
                description: Configure hardware offload for IPv4 traffic.
              ipv6:
                type: bool
                description: Configure hardware offload for IPv6 traffic.
              threshold_minimum:
                type: int
                convert_types:
                  - str
                min: 1
                max: 4294967295
                description: Minimum number of samples.
      hardware:
        type: dict
        description: |-
          The options relevant only for flow tracker type hardware.
        keys:
          record:
            type: dict
            keys:
              format_ipfix_standard_timestamps_counters:
                type: bool
                description: Enable software export of IPFIX data records.
      cloudvision_exporter:
        type: dict
        description: Configuration for the exporter to CloudVision.
        keys:
          name:
            type: str
            default: CLOUDVISION
          vrf:
            type: str
            default: use_default_mgmt_method_vrf
            description: |-
              VRF name.
              The value will be interpreted according to these rules:
              - `use_mgmt_interface_vrf` will configure under the VRF set with `mgmt_interface_vrf`.
                An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
              - `use_inband_mgmt_vrf` will configure under the VRF set with `inband_mgmt_vrf`.
                An error will be raised if inband management is not configured for the device.
              - `use_default_mgmt_method_vrf` will configure the VRF and source-interface for one of the two options above depending on the value of `default_mgmt_method`.
              - Any other string will be used directly as the VRF name.
          source_interface:
            type: str
            description: |-
              Local interface used to connect to TerminAttr on EOS.
              If not set, the local interface may be set automatically when VRF is set to `use_mgmt_interface_vrf`, `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
      trackers:
        type: list
        primary_key: name
        items:
          type: dict
          keys:
            name:
              type: str
              description: Tracker Name
            sampled:
              type: dict
              description: |-
                The options relevant only for flow tracker type sampled.
              keys:
                table_size:
                  type: int
                  convert_types:
                    - str
                  min: 1
                  max: 614400
                  description: |
                    Maximum number of entries in flow table.
                record_export:
                  type: dict
                  keys:
                    mpls:
                      type: bool
                      description: Export MPLS forwarding information.
            record_export:
              type: dict
              keys:
                on_inactive_timeout:
                  type: int
                  convert_types:
                    - str
                  min: 3000
                  max: 900000
                  description: Flow record inactive export timeout in milliseconds
                on_interval:
                  type: int
                  convert_types:
                    - str
                  min: 1000
                  max: 36000000
                  description: Flow record export interval in milliseconds
            export_to_cloudvision:
              type: bool
              description: |-
                When set to `true`, AVD automatically:
                Configure an Flow tracking for `127.0.0.1` port `4739` in the VRF defined in `cloudvision_exporter.vrf`.
                Also configures the TerminAttr daemon IPFIX Collector address to listen on for receiving IPFIX packets.
            exporters:
              type: list
              primary_key: name
              items:
                type: dict
                keys:
                  name:
                    type: str
                    description: Exporter Name
                  collectors:
                    type: list
                    primary_key: host
                    $ref: "eos_cli_config_gen#/$defs/flow_tracking/keys/trackers/items/keys/exporters/items/keys/collectors"
                  format:
                    type: dict
                    keys:
                      ipfix_version:
                        type: int
                        convert_types:
                          - str
                  local_interface:
                    type: str
                    default: use_default_mgmt_method_interface
                    description: |-
                      Local Source Interface.
                      The value will be interpreted according to these rules:
                        - `use_mgmt_interface` will configure the `mgmt_interface` as the local interface.
                        - `use_inband_mgmt_interface` will configure the `inband_mgmt_interface` as the local interface.
                        - `use_default_mgmt_method_interface` will configure `mgmt_interface` or `inband_mgmt_interface` as the local interface depending on the value of `default_mgmt_method`.
                        - Any other string will be used directly as the local interface.
                  template_interval:
                    type: int
                    convert_types:
                      - str
                    min: 5000
                    max: 3600000
                    description: Template interval in milliseconds
                  collector:
                    type: dict
                    deprecation:
                      warning: true
                      removed: true
                      remove_in_version: 6.0.0
                      new_key: collectors
        default:
          - name: FLOW-TRACKER
            record_export:
              on_inactive_timeout: 70000
              on_interval: 300000
            exporters:
              - name: CV-TELEMETRY
                collectors:
                  - host: 127.0.0.1
                local_interface: Loopback0
                template_interval: 3600000
