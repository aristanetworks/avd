interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.1.0.2/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.2.0.2/32
!
interface Vlan101
   description VLAN101
   shutdown
   vrf VRF1
   ip address virtual 10.1.1.1/24
!
interface Vlan102
   description VLAN102
   shutdown
   vrf VRF1
   ip address virtual 10.1.2.1/24
!
interface Vxlan1
   description l3leaf2_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 101 vni 10101
   vxlan vlan 102 vni 10102
   vxlan vrf VRF1 vni 1
!
ip virtual-router mac-address 00:11:22:33:44:55
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF1
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.1.0.0/16 eq 32
   seq 20 permit 10.2.0.0/16 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000.2
   bgp asn notation asdot
   router-id 10.1.0.2
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.0.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.0.0.1 remote-as 65000.0
   neighbor 10.0.0.1 description spine1_Loopback0
   neighbor 10.0.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.0.0.2 remote-as 65000.0
   neighbor 10.0.0.2 description spine2_Loopback0
   neighbor 10.4.0.4 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.4.0.4 remote-as 65000.0
   neighbor 10.4.0.4 description spine2_Ethernet2/3
   neighbor 10.4.0.6 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.4.0.6 remote-as 65000.0
   neighbor 10.4.0.6 description spine1_Ethernet2/4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 101
      rd 10.1.0.2:10101
      route-target both 10101:10101
      redistribute learned
   !
   vlan 102
      rd 10.1.0.2:10102
      route-target both 10102:10102
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf VRF1
      rd 10.1.0.2:1
      route-target import evpn 1:1
      route-target export evpn 1:1
      router-id 10.1.0.2
      redistribute connected
!
end
