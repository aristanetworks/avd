!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname spine2
!
spanning-tree mode none
!
vrf instance MGMT
!
interface Ethernet1/4
   description P2P_l3leaf1_Ethernet1/2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.4.0.2/31
!
interface Ethernet2/3
   description P2P_l3leaf2_Ethernet2/1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.4.0.4/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.0.0.2/32
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.0.0.0/16 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000.0
   bgp asn notation asdot
   router-id 10.0.0.2
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.1.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.1 remote-as 65000.1
   neighbor 10.1.0.1 description l3leaf1_Loopback0
   neighbor 10.1.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.2 remote-as 65000.2
   neighbor 10.1.0.2 description l3leaf2_Loopback0
   neighbor 10.4.0.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.4.0.3 remote-as 65000.1
   neighbor 10.4.0.3 description l3leaf1_Ethernet1/2
   neighbor 10.4.0.5 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.4.0.5 remote-as 65000.2
   neighbor 10.4.0.5 description l3leaf2_Ethernet2/1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
