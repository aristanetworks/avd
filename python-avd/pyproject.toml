[project]
name="pyavd"
dynamic = ["version"]
authors=[{ name = "Arista Networks", email = "avd-dev@arista.com"}]
description="Arista AVD"
readme = "README.md"
license = "Apache-2.0"
license-files = ["pyavd/LICENSE"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
keywords = ["pyavd"]
requires-python = ">=3.10"
dependencies = [
    "anta>=1.8.0",
    "aristaproto>=0.1.1",
    "deepmerge>=1.1.0",
    # we patch the connection code in grpclib to get proxy support, so we need to carefully monitor and test new versions
    "grpclib>=0.4.8",
    "jinja2>=3.0",
    "pyavd-utils==0.0.6",
    "python-socks[asyncio]>=2.7.2",
    "pyyaml>=6.0.0",
    "requests>=2.27.0",
]

[project.urls]
homepage = "https://avd.arista.com"
repository = "https://github.com/aristanetworks/avd"

[project.optional-dependencies]
ansible = [
    "ansible-core>=2.16.0,<2.22.0",
    "pyavd[ansible-collection]",
]
ansible-collection = [
    "netaddr>=0.7.19",
    # distlib is required to install the collection from source as it is using manifest
    "distlib>=0.3.9",
]

[build-system]
requires = [
    "deepmerge>=1.1.0",
    "jinja2>=3.0",
    "jsonschema-rs>=0.24",
    "pyavd-utils==0.0.6",
    "pydantic>=2.3.0",
    "pyyaml>=6.0.0",
    "referencing>=0.35.0",
    "ruff==0.15.21",
    "setuptools>=77.0",
]
build-backend = "custom_build_backend"
backend-path = ["scripts"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
    "avd_meta_schema.pickle",
    "cv_deploy.schema.pickle",
    "eos_cli_config_gen.schema.pickle",
    "eos_designs.schema.pickle",
    "schemas.json.gz",
]

[tool.setuptools.packages.find]
include = ["pyavd*"]

[tool.setuptools.dynamic]
version = {attr = "pyavd.__version__"}

[dependency-groups]
# helping pdm generate the flat list of requirements in pre-commit
self = [
  "pyavd==6.4.0.dev0"
]

[tool.black]
# Black has been replaced with Ruff.
# This section should be removed later, but kept here to avoid IDE extensions from messing up the code.
line-length = 160

force-exclude = '''pyavd/_cv/api/.*'''

[tool.isort]
# Isort has been replaced with Ruff.
# This section should be removed later, but kept here to avoid IDE extensions from messing up the code.
profile = "black"
skip_gitignore = true
line_length = 160
known_first_party = ["pyavd", "schema_tools"]

extend_skip_glob = [
  "pyavd/_cv/api/**/*"
]

[tool.ruff]
# Extend the `pyproject.toml` file in the parent directory...
# Should not be needed, but the ruff vscode extension does not seem to respect the ruff behavior of ignoring files without tool.ruff
extend = "../pyproject.toml"

[tool.pyright]
# Pyright stops at the first parent pyproject.toml it finds so as documented adding base config
extends = "../pyproject.toml"
